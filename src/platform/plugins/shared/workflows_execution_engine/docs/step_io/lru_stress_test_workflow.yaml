# Stress test workflow for the LRU-based StepIoService
#
# Generates enough step outputs to exceed the default 10 MB maxCacheSize budget,
# forcing the LRU to evict stale entries and rehydrate on demand from ES.
#
# Memory profile:
#   base_payload output  :  ~10 KB  (held warm — referenced every iteration)
#   produce_chunk output :  ~10 KB  x 1100 iterations  =  ~11 MB total generated
#   LRU budget (default) :  10 MB   -> eviction starts around iteration 1000
#   Evicted entries       :  old produce_chunk outputs (not re-referenced)
#
# What to observe:
#   - Workflow completes without errors despite exceeding the cache budget
#   - ES getStepExecutionsByIds calls appear once eviction kicks in (~iteration 1000)
#   - Heap stays near the 10 MB LRU ceiling rather than growing to 11+ MB
#   - Old code required evictStaleLoopOutputs on every loop exit; new code needs nothing
#
# foreach section stresses scope-stack rehydration:
#   Old code: pinForeachSource / unpinForeachScope per iteration.
#   New code: scope stack walked uniformly; no per-step-type branching.

name: lru-stress-test
enabled: false
triggers:
  - type: manual

steps:
  # -- Base payload (~10 KB) ------------------------------------------------
