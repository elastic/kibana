# Memory pressure stress test for the workflow execution engine.
#
# Generates enough step outputs to exceed the default 10 MB step-IO cache budget,
# forcing the engine to evict stale entries and rehydrate on demand from ES.
#
# Memory profile:
#   base_payload output  :  ~10 KB  (held warm — referenced every iteration)
#   produce_chunk output :  ~10 KB  x 1100 iterations  =  ~11 MB total generated
#   Cache budget (default):  10 MB  -> eviction starts around iteration 1000
#   Evicted entries       :  old produce_chunk outputs (not re-referenced)
#
# What to observe:
#   - Workflow completes without errors despite exceeding the cache budget
#   - ES getStepExecutionsByIds calls appear once eviction kicks in (~iteration 1000)
#   - Heap stays near the 10 MB cache ceiling rather than growing to 11+ MB
#
# foreach section stresses scope-stack rehydration across iterations.

name: memory-pressure-stress-test
enabled: false
triggers:
  - type: manual

steps:
  # -- Base payload (~10 KB) ------------------------------------------------
