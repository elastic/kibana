name: "Audit 13 - Cancel nested durable waits"
description: "Cancel this execution after it enters waiting. All four nested waits must become terminal and after_wait must never run."
enabled: true
triggers:
  - type: manual
steps:
  - name: branches
    type: parallel
    foreach: [a, b]
    steps:
      - name: nested
        type: parallel
        foreach: [1, 2]
        steps:
          - name: long_wait
            type: wait
            with: { duration: 2m }
          - name: after_wait
            type: console
            with: { message: MUST_NOT_RUN }
