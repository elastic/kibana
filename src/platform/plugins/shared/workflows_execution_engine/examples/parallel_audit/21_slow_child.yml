name: "Audit 21 - Slow child for cancellation audit"
description: "Waits one minute. Audit 20 cancels this child when its owning parallel branch expires."
enabled: true
triggers:
  - type: manual
inputs:
  - name: owner
    type: string
    default: manual
steps:
  - name: pause
    type: wait
    with: { duration: 1m }
  - name: return_owner
    type: workflow.output
    with: { owner: '{{ inputs.owner }}' }
