name: "Audit 14 - Child workflow for parallel audit"
description: "Returns its input after a durable wait; invoked by audit-15-child-joins."
enabled: true
triggers:
  - type: manual
inputs:
  - name: owner
    type: string
    default: manual
steps:
  - name: pause
    type: wait
    with: { duration: 2s }
  - name: return_owner
    type: workflow.output
    with: { owner: '{{ inputs.owner }}' }
