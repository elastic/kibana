name: "Audit 15 - Parallel synchronous child workflows"
description: "Two synchronous child workflows must resume their own branch and return distinct owner values without duplicate launches."
enabled: true
triggers:
  - type: manual
steps:
  - name: branches
    type: parallel
    foreach: [a, b]
    steps:
      - name: child
        type: workflow.execute
        with:
          workflow-id: audit-14-child
          inputs: { owner: '{{ foreach.item }}' }
      - name: result
        type: console
        with: { message: '{{ steps.child.output | json }}' }
