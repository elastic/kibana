name: "Audit 16 - Restart while nested branches are parked"
description: "before_wait runs four times. Restart Kibana during 15-second nested waits; after_wait then runs four times with no repeated before_wait records."
enabled: true
triggers:
  - type: manual
steps:
  - name: branches
    type: parallel
    foreach: [a, b]
    steps:
      - name: remember
        type: data.set
        with: { owner: '{{ foreach.item }}' }
      - name: nested
        type: parallel
        foreach: [1, 2]
        steps:
          - name: before_wait
            type: console
            with: { message: '{{ variables.owner }}:{{ foreach.item }}' }
          - name: pause
            type: wait
            with: { duration: 15s }
          - name: after_wait
            type: console
            with: { message: '{{ variables.owner }}:{{ foreach.item }}' }
