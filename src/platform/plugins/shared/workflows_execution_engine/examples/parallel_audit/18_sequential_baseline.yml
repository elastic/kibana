name: "Audit 18 - Sequential engine compatibility"
description: "Existing sequential foreach, break, wait, retry/continue and workflow.output. Returns done after two item results."
enabled: true
triggers:
  - type: manual
steps:
  - name: items
    type: foreach
    foreach: [0, 1, 2]
    steps:
      - name: stop
        type: loop.break
        if: '${{ foreach.index == 2 }}'
      - name: pause
        type: wait
        with: { duration: 1s }
      - name: item_result
        type: console
        with: { message: '{{ foreach.item }}' }
  - name: optional
    type: http
    with: { url: 'http://localhost:9228/audit-intentional-unauthorized', method: GET }
    on-failure:
      retry: { max-attempts: 1, delay: 1s }
      continue: true
  - name: result
    type: workflow.output
    with: { result: done }
