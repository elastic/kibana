name: Rebuild a long workflow
description: Forty-five heavy steps in one workflow, built one after another in the same page, to catch memory growth in the builder.
tags:
  - scout
  - graph-rebuild
consts:
  records:
    - id: 1
      label: first
      score: 10
      team: core
    - id: 2
      label: second
      score: 20
      team: infra
triggers:
  - type: manual
steps:
  - name: map_1
    type: data.map
    items: "${{ consts.records }}"
    with:
      fields:
        id: "${{ item.id }}"
        label: "${{ item.label }}"
        score: "${{ item.score }}"
        team: "${{ item.team }}"
        position: "${{ index }}"
  - name: set_1
    type: data.set
    with:
      round: 1
      source: "${{ steps.map_1.output }}"
      label: "round 1"
      limit: 10
      enabled: true
  - name: log_1
    type: console
    with:
      message: "round 1 of 15 done, {{ steps.set_1.output.round }}"

