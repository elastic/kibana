title: Create data view request
type: object
required:
  - data_view
properties:
  data_view:
    type: object
    required:
      - title
    description: The data view object.
    properties:
      allowNoIndex:
        $ref: 'allownoindex.yaml'
      fieldAttrs:
        type: object
        additionalProperties:
          $ref: 'fieldattrs.yaml'
      fieldFormats:
        $ref: 'fieldformats.yaml'
      fields:
        type: object
      id:
        type: string
      name:
        type: string
        description: The data view name.
      namespaces:
        $ref: 'namespaces.yaml'
      runtimeFieldMap:
        type: object
        additionalProperties:
          $ref: 'runtimefieldmap.yaml'
      sourceFilters:
        $ref: 'sourcefilters.yaml'
      timeFieldName:
        $ref: 'timefieldname.yaml'
      title:
        $ref: 'title.yaml'
      type:
        $ref: 'type.yaml'
      typeMeta:
        $ref: 'typemeta.yaml'
      version:
        type: string
  override:
    type: boolean
    description: >
      Overwrite a data view with the same name or ID.
      The name is `data_view.name`, or `data_view.title` if the name is omitted or empty;
      it's matched against the stored names of data views in the current space.
      A name match deletes the existing data view from all spaces and creates a replacement
      in `data_view.namespaces`, or in the current space if that's omitted or empty.
      If no name matches, an ID match keeps the existing spaces unless a non-empty
      `data_view.namespaces` is provided.
      Unless `data_view.id` is provided, a new ID is generated, which can break existing references.
    default: false
