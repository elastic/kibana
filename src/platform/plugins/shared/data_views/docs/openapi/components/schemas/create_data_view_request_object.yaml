title: Create data view request
type: object
required:
  - data_view
properties:
  data_view:
    type: object
    required:
      - title
    description: The data view object.
    properties:
      allowNoIndex:
        $ref: 'allownoindex.yaml'
      fieldAttrs:
        type: object
        additionalProperties:
          $ref: 'fieldattrs.yaml'
      fieldFormats:
        $ref: 'fieldformats.yaml'
      fields:
        type: object
      id:
        type: string
      name:
        type: string
        description: The data view name.
      namespaces:
        $ref: 'namespaces.yaml'
      runtimeFieldMap:
        type: object
        additionalProperties:
          $ref: 'runtimefieldmap.yaml'
      sourceFilters:
        $ref: 'sourcefilters.yaml'
      timeFieldName:
        $ref: 'timefieldname.yaml'
      title:
        $ref: 'title.yaml'
      type:
        $ref: 'type.yaml'
      typeMeta:
        $ref: 'typemeta.yaml'
      version:
        type: string
  override:
    type: boolean
    description: |
      When `true`, overwrites an existing data view instead of failing with a duplicate error.  
      Kibana does this in two steps:  

      1. It looks for a data view with the same name in the current space and deletes it from all spaces.  
         The name is `data_view.name`, or `data_view.title` if the name is omitted or empty.  
      2. It saves the new data view under `data_view.id`, overwriting any data view that has that ID.  
         If you provide `data_view.namespaces`, the new data view goes in those spaces only, even if they don't include the current space.  
         Otherwise, it keeps the spaces of the data view it overwrites, or goes in the current space if it overwrites none.  

      If step 2 fails after step 1, Kibana doesn't restore the data view it deleted in step 1.  
      If you don't provide `data_view.id`, Kibana generates a new one, and references to the old ID stop working.  
      The name search covers only the current space. If the existing data view isn't in the current space and you don't provide `data_view.id`, the request creates a duplicate.  
      If you provide an ID that exists only in other spaces, the request fails with a conflict error.  
      To change which spaces a data view belongs to, update its spaces instead of using `override`.  

    default: false
