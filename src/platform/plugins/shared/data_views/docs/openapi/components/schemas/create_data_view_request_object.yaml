title: Create data view request
type: object
required:
  - data_view
properties:
  data_view:
    type: object
    required:
      - title
    description: The data view object.
    properties:
      allowNoIndex:
        $ref: 'allownoindex.yaml'
      fieldAttrs:
        type: object
        additionalProperties:
          $ref: 'fieldattrs.yaml'
      fieldFormats:
        $ref: 'fieldformats.yaml'
      fields:
        type: object
      id:
        type: string
      name:
        type: string
        description: The data view name.
      namespaces:
        $ref: 'namespaces.yaml'
      runtimeFieldMap:
        type: object
        additionalProperties:
          $ref: 'runtimefieldmap.yaml'
      sourceFilters:
        $ref: 'sourcefilters.yaml'
      timeFieldName:
        $ref: 'timefieldname.yaml'
      title:
        $ref: 'title.yaml'
      type:
        $ref: 'type.yaml'
      typeMeta:
        $ref: 'typemeta.yaml'
      version:
        type: string
  override:
    type: boolean
    description: >
      Override an existing data view if a data view with the provided name already exists in the current space.
      If `data_view.name` is omitted or empty, `data_view.title` is used as the name.
      When a matching name is found, the existing data view is deleted and a replacement is created.
      If the existing data view is shared with other spaces, it is deleted from all of those spaces.
      The replacement uses the spaces specified in `data_view.namespaces`, or only the current space if
      `data_view.namespaces` is omitted or empty; the existing space assignments are not preserved automatically.
      Unless `data_view.id` is specified, the replacement has a new ID, which can break saved objects
      that reference the previous ID.
      This option also allows overwriting an existing data view with the provided `data_view.id`.
    default: false
