fileGroups:
  src:
    - version_dependencies.txt
tags:
  - is-webpack-built
tasks:
  extract-version-dependencies:
    command: node
    args:
      - scripts/extract_version_dependencies.js
      - src/platform/packages/private/kbn-vega-sandbox/version_dependencies.txt
      - --collect
      - babel-loader
      - --collect
      - vega
      - --collect
      - vega-interpreter
      - --collect
      - vega-lite
      - --collect
      - vega-tooltip
      - --collect
      - webpack
      - --transitive
    env:
      CI_STATS_DISABLED: 'true'
    inputs:
      - /package.json
      - /yarn.lock
    outputs:
      - version_dependencies.txt
    options:
      runFromWorkspaceRoot: true
  build-webpack:
    command: yarn
    args:
      - build
    deps:
      - ~:extract-version-dependencies
    inputs:
      - '@group(src)'
      - package.json
      - webpack.config.js
    outputs:
      - /target/build/src/platform/packages/private/kbn-vega-sandbox
  watch-webpack:
    type: run
    options:
      persistent: true
    command: yarn
    args:
      - build
      - '--watch'
    deps:
      - extract-version-dependencies
    inputs:
      - '@group(src)'
      - package.json
      - webpack.config.js
    outputs:
      - /target/build/src/platform/packages/private/kbn-vega-sandbox
