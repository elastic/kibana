# -----
# This file is for information purpose only. 'viewer' and 'editor' roles are defined in stateful Elasticsearch by default
# Source: https://github.com/elastic/elasticsearch/blob/4272164530807787d4d8b991e3095a6e79176dbf/x-pack/plugin/core/src/main/java/org/elasticsearch/xpack/core/security/authz/store/ReservedRolesStore.java#L861-L952
# Note: inconsistency between these roles definition and the same roles of serverless project may break FTR deployment-agnostic tests
# -----
viewer:
  cluster: ['monitor_inference']
  indices:
    - names:
        - '.alerts*'
        - '.preview.alerts*'
        - '.adhoc.alerts*'
      privileges:
        - 'read'
        - 'view_index_metadata'
      allow_restricted_indices: false
    - names:
        - '.items-*'
        - '.lists-*'
        - '.siem-signals*'
      privileges:
        - 'read'
        - 'view_index_metadata'
      allow_restricted_indices: false
    - names:
        - '/~(([.]|ilm-history-).*)/'
      privileges:
        - 'read'
        - 'view_index_metadata'
      allow_restricted_indices: false
    - names:
        - '.profiling-*'
        - 'profiling-*'
      privileges:
        - 'read'
        - 'view_index_metadata'
      allow_restricted_indices: false
  applications:
    - application: 'kibana-.kibana'
      privileges:
        - 'read'
      resources:
        - '*'
  run_as: []

editor:
  cluster: ['monitor_inference']
  indices:
    - names:
        - 'observability-annotations'
      privileges:
        - 'read'
        - 'view_index_metadata'
        - 'write'
      allow_restricted_indices: false
    - names:
        - '.items-*'
        - '.lists-*'
        - '.siem-signals*'
      privileges:
        - 'maintenance'
        - 'read'
        - 'view_index_metadata'
        - 'write'
      allow_restricted_indices: false
    - names:
        - '/~(([.]|ilm-history-).*)/'
      privileges:
        - 'read'
        - 'view_index_metadata'
      allow_restricted_indices: false
    - names:
        - '.profiling-*'
        - 'profiling-*'
      privileges:
        - 'read'
        - 'view_index_metadata'
      allow_restricted_indices: false
    - names:
        - '.alerts*'
        - '.internal.alerts*'
        - '.internal.preview.alerts*'
        - '.preview.alerts*'
        - '.internal.adhoc.alerts*'
        - '.adhoc.alerts*'
      privileges:
        - 'maintenance'
        - 'read'
        - 'view_index_metadata'
        - 'write'
      allow_restricted_indices: false
  applications:
    - application: 'kibana-.kibana'
      privileges:
        - 'all'
      resources:
        - '*'
  run_as: []

# Admin role without 'remote_indices' access definition
# There is no such built-in role in stateful, and it's a role "similar" to the built-in 'admin' role in serverless
admin:
  # TODO: 'all' should be replaced with explicit list both here and serverless for deployment-agnostic tests with 'admin' role to be compatible
  cluster: ['all']
  indices:
    - names: ['*']
      privileges: ['all']
      allow_restricted_indices: false
    - names: ['*']
      privileges:
        - 'monitor'
        - 'read'
        - 'read_cross_cluster'
        - 'view_index_metadata'
      allow_restricted_indices: true
  applications:
    - application: '*'
      privileges: ['*']
      resources: ['*']
  run_as: ['*']

# Roles of the Nightshift service accounts (kibana/nightshift_agent, kibana/nightshift_automations).
# Nightshift ships on Serverless, where elasticsearch-controller defines them as _nightshift_agent and
# _nightshift_automations (mirrored in serverless_resources/project_roles/oblt/roles.yml). Stateful
# Elasticsearch has no such roles, so they are defined here for local development and stateful CI.
# Keep the grants in sync with the Serverless roles.
nightshift_agent:
  cluster: ['monitor_inference']
  indices:
    - names: ['logs-*', 'metrics-*', 'traces-*', 'apm-*']
      privileges: ['read', 'view_index_metadata']
      allow_restricted_indices: false
    - names:
        - 'ai-index-idx-nightshift-cortex'
        - 'ai-index-idx-nightshift-semantic-memory'
        - 'ai-index-idx-nightshift-decision-trees'
      privileges: ['read', 'view_index_metadata', 'write', 'auto_configure']
      allow_restricted_indices: false
  applications:
    - application: 'kibana-.kibana'
      privileges:
        - 'feature_nightshift.minimal_all'
        - 'feature_agentBuilder.minimal_all'
        - 'feature_actions.read'
        - 'feature_workflowsManagement.read'
      resources: ['*']
  run_as: []

nightshift_automations:
  cluster: ['monitor_inference']
  applications:
    - application: 'kibana-.kibana'
      privileges:
        - 'feature_nightshift.read'
        - 'feature_agenticInvestigations.minimal_read'
        - 'feature_agenticInvestigations.investigations_all'
        - 'feature_agentBuilder.minimal_all'
        - 'feature_actions.read'
      resources: ['*']
  run_as: []

# temporarily added for testing purpose
system_indices_superuser:
  cluster: ['all']
  indices:
    - names: ['*']
      privileges: ['all']
      allow_restricted_indices: true
  applications:
    - application: '*'
      privileges: ['*']
      resources: ['*']
  run_as: ['*']
