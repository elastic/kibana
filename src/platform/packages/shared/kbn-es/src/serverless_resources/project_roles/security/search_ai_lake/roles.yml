# -----
# Copy from internal roles config in elasticsearch-controller
# -----

# Predefined roles for "Security" "SearchAiLake" (tier) project types

#-------------------------------------------------------------------------------------------------
# >>> Ai4DSoC ROLES (and privileges) <<<
#
# Updates to predefined roles must also be done in Kibana. The file is currently located here:
#
# src/platform/packages/shared/kbn-es/src/serverless_resources/project_roles/security/search_ai_lake/roles.yml
#
# Please ensure a PR is opened to update the above as well.
#
# Two roles based on requirements:
# - analyst: Core security operations with read/write access
# - soc_manager: Full administrative capabilities
# -------------------------------------------------------------------------------------------------

_search_ai_lake_analyst:
  metadata:
    _public: true
    _reserved: true
  cluster:
    - "manage_inference"
    - "monitor_connector"
    - "monitor_inference"
    - "monitor_ml"
    - "read_project_routing"
  indices:
    - names:
        - ".alerts-security*"
        - ".internal.alerts-security*"
        - ".adhoc.alerts-security*"
        - ".internal.adhoc.alerts-security*"
      privileges:
        - "index"
        - "read"
        - "write"
        - "maintenance"
        - "view_index_metadata"
    - names:
        - ".siem-signals-*"
        - ".preview.alerts-security*"
        - ".internal.preview.alerts-security*"
        - "logs-*"
      privileges:
        - "read"
        - "view_index_metadata"
    - names:
        - ".lists*"
        - ".items*"
        - ".fleet-agents*"
        - ".fleet-actions*"
        - "risk-score.risk-score-*"
        - ".entities.v1.latest.security_*"
        - ".ml-anomalies-*"
        - "security_solution-*.misconfiguration_latest*"
      privileges:
        - "read"
    # Threat intel indicators. Only the per-space filtered aliases are granted, so the
    # trailing hyphen is load-bearing: it never matches the bare .threat-intel-indicators index.
    - names:
        - ".threat-intel-indicators-*"
      privileges:
        - "read"

  applications:
    - application: "kibana-.kibana"
      privileges:
        - "feature_ml.read"
        - "feature_siemV5.all"
        - "feature_securitySolutionRulesV2.all"
        - "feature_securitySolutionCasesV3.all"
        - "feature_securitySolutionAssistant.all"
        - "feature_securitySolutionAttackDiscovery.minimal_all"
        - "feature_builtInAlerts.all"
        - "feature_actions.all"
        - "feature_discover_v2.read"
        - "feature_savedQueryManagement.read"
        - "feature_indexPatterns.read"
        - "feature_fleetv2.read"
        - "feature_agentBuilder.all"
        - "feature_workflowsManagement.all"
      resources: "*"

_search_ai_lake_soc_manager:
  metadata:
    _public: true
    _reserved: true
  cluster:
    - "manage_inference"
    - "monitor_connector"
    - "monitor_inference"
    - "monitor_ml"
    - "read_project_routing"
  indices:
    - names:
        - "apm-*-transaction*"
        - "traces-apm*"
        - "auditbeat-*"
        - "endgame-*"
        - "filebeat-*"
        - "packetbeat-*"
        - "winlogbeat-*"
        - "logstash-*"
        - ".asset-criticality.asset-criticality-*"
        - "security_solution-*.misconfiguration_latest*"
      privileges:
        - "read"
        - "write"
    - names:
        - "logs-*"
      privileges:
        - "read"
        - "view_index_metadata"
        - "write"
    - names:
        - ".alerts-security*"
        - ".siem-signals-*"
        - ".preview.alerts-security*"
        - ".internal.preview.alerts-security*"
        - ".adhoc.alerts-security*"
        - ".internal.adhoc.alerts-security*"
        - ".internal.alerts-security*"
      privileges:
        - "read"
        - "write"
        - "manage"
        - "view_index_metadata"
    - names:
        - ".lists*"
        - ".items*"
      privileges:
        - "read"
        - "write"
        - "view_index_metadata"
    - names:
        - "metrics-endpoint.metadata_current_*"
        - ".fleet-agents*"
        - ".fleet-actions*"
        - "risk-score.risk-score-*"
        - ".entities.v1.latest.security_*"
        - ".ml-anomalies-*"
      privileges:
        - "read"
    # Threat intel indicators. Only the per-space filtered aliases are granted, so the
    # trailing hyphen is load-bearing: it never matches the bare .threat-intel-indicators index.
    - names:
        - ".threat-intel-indicators-*"
      privileges:
        - "read"

  applications:
    - application: "kibana-.kibana"
      privileges:
        - "feature_siemV5.all"
        - "feature_siemV5.global_artifact_management_all"
        - "feature_siemV5.workflow_insights_all"
        - "feature_siemV5.soc_management_all"
        - "feature_securitySolutionRulesV2.all"
        - "feature_securitySolutionCasesV3.all"
        - "feature_securitySolutionAssistant.all"
        - "feature_securitySolutionAttackDiscovery.all"
        - "feature_actions.all"
        - "feature_builtInAlerts.all"
        - "feature_indexPatterns.all"
        - "feature_discover_v2.all"
        - "feature_savedQueryManagement.all"
        - "feature_ml.all"
        - "feature_fleetv2.all"
        - "feature_advancedSettings.all"
        - "feature_agentBuilder.all"
        - "feature_workflowsManagement.all"
      resources: "*"
