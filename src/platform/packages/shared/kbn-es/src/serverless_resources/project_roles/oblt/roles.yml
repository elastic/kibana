# -----
# Copy from internal roles config in elasticsearch-controller
# -----

# Predefined roles for "Observability" project types

viewer:
  metadata:
    _public: true
    _reserved: true
  cluster:
    - 'read_project_routing'
    - 'monitor_inference'
  indices:
    - names:
        - '/~(([.]|ilm-history-).*)/'
      privileges:
        - 'read'
        - 'view_index_metadata'
        - 'read_view_metadata'
      allow_restricted_indices: false
    - names:
        - '.siem-signals*'
        - '.lists-*'
        - '.items-*'
      privileges:
        - 'read'
        - 'view_index_metadata'
      allow_restricted_indices: false
    - names:
        - '.alerts*'
        - '.preview.alerts*'
        - '.adhoc.alerts*'
      privileges:
        - 'read'
        - 'view_index_metadata'
      allow_restricted_indices: false
    - names:
        - '.slo-observability.*'
      privileges:
        - 'read'
        - 'view_index_metadata'
    - names:
        - '.evaluation-*'
      privileges:
        - 'read'
        - 'view_index_metadata'
      allow_restricted_indices: false
  applications:
    - application: 'kibana-.kibana'
      privileges:
        - 'read'
      resources:
        - '*'
  run_as: []
editor:
  metadata:
    _public: true
    _reserved: true
  cluster:
    - 'read_project_routing'
    - 'monitor_inference'
  indices:
    - names:
        - '/~(([.]|ilm-history-).*)/'
      privileges:
        - 'read'
        - 'read_failure_store'
        - 'view_index_metadata'
        - 'read_view_metadata'
      allow_restricted_indices: false
    - names:
        - 'observability-annotations'
      privileges:
        - 'read'
        - 'view_index_metadata'
        - 'write'
      allow_restricted_indices: false
    - names:
        - '.siem-signals*'
        - '.lists-*'
        - '.items-*'
      privileges:
        - 'read'
        - 'view_index_metadata'
        - 'write'
        - 'maintenance'
      allow_restricted_indices: false
    - names:
        - '.internal.alerts*'
        - '.alerts*'
        - '.internal.preview.alerts*'
        - '.preview.alerts*'
        - '.internal.adhoc.alerts*'
        - '.adhoc.alerts*'
      privileges:
        - 'read'
        - 'view_index_metadata'
        - 'write'
        - 'maintenance'
      allow_restricted_indices: false
    - names:
        - '.slo-observability.*'
      privileges:
        - 'write'
        - 'read'
        - 'view_index_metadata'
        - 'manage'
    - names:
        - '.evaluation-*'
      privileges:
        - 'read'
        - 'view_index_metadata'
        - 'write'
      allow_restricted_indices: false
    - names:
        - 'kibana_sample_data_*'
      privileges:
        - 'read'
        - 'view_index_metadata'
        - 'write'
        - 'manage'
      allow_restricted_indices: false
  applications:
    - application: 'kibana-.kibana'
      privileges:
        - 'all'
      resources:
        - '*'
  run_as: []
_nightshift_agent:
  description: 'Privileges for the service account of the Nightshift agent. Assigned by Kibana; do not assign to users.'
  metadata:
    _public: true
    _reserved: true
  cluster:
    - 'monitor_inference'
    - 'read_project_routing'
  indices:
    - names:
        - 'ai-index-idx-nightshift-cortex'
        - 'ai-index-idx-nightshift-semantic-memory'
        - 'ai-index-idx-nightshift-decision-trees'
      privileges:
        - 'read'
        - 'view_index_metadata'
        - 'write'
        - 'auto_configure'
      allow_restricted_indices: false
  applications:
    - application: 'kibana-.kibana'
      privileges:
        - 'feature_nightshift.minimal_all'
        - 'feature_agentBuilder.minimal_all'
        - 'feature_actions.read'
        - 'feature_workflowsManagement.read'
      resources:
        - '*'
  run_as: []
_nightshift_automations:
  description: 'Privileges for the service account of Nightshift automations. Assigned by Kibana; do not assign to users.'
  metadata:
    _public: true
    _reserved: true
  cluster:
    - 'monitor_inference'
  applications:
    - application: 'kibana-.kibana'
      privileges:
        - 'feature_agenticInvestigations.minimal_read'
        - 'feature_agenticInvestigations.investigations_all'
        - 'feature_agentBuilder.minimal_all'
        - 'feature_actions.read'
      resources:
        - '*'
  run_as: []

# admin role defined in elasticsearch controller
admin:
  metadata:
    _public: true
    _reserved: true
  cluster: ['all']
  indices:
    - names: ['*']
      privileges: ['all']
      allow_restricted_indices: false
  applications:
    - application: '*'
      privileges: ['*']
      resources: ['*']

# temporarily added for testing purpose
system_indices_superuser:
  cluster: ['all']
  indices:
    - names: ['*']
      privileges: ['all']
      allow_restricted_indices: true
  applications:
    - application: '*'
      privileges: ['*']
      resources: ['*']
  run_as: ['*']
