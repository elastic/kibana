overlay: 1.0.0
info:
  title: Sophos Central API corrections
  version: 1.0.0
actions:
  # Alerts endpoint: severity, product, category accept repeated query keys
  - target: $.paths['/common/v1/alerts'].get.parameters[?(@.name=='severity')].schema
    description: >-
      The Sophos Common API v1 alerts endpoint accepts repeated query parameters
      for severity (e.g. ?severity=high&severity=medium). The published spec
      models it as a single string; this overlay corrects it to an array.
    update:
      type: array
      items:
        type: string

  - target: $.paths['/common/v1/alerts'].get.parameters[?(@.name=='product')].schema
    description: >-
      Correct product parameter to array type for repeated query keys.
    update:
      type: array
      items:
        type: string

  - target: $.paths['/common/v1/alerts'].get.parameters[?(@.name=='category')].schema
    description: >-
      Correct category parameter to array type for repeated query keys.
    update:
      type: array
      items:
        type: string

  # Endpoints listing: healthStatus accepts repeated query keys
  - target: $.paths['/endpoint/v1/endpoints'].get.parameters[?(@.name=='healthStatus')].schema
    description: >-
      The Sophos Endpoint API v1 endpoints listing accepts repeated query
      parameters for healthStatus (e.g. ?healthStatus=bad&healthStatus=suspicious).
      The published spec models it as a single string.
    update:
      type: array
      items:
        type: string

  # Isolation endpoint: undocumented comment field
  - target: $.paths['/endpoint/v1/endpoints/isolation'].post.requestBody.content['application/json'].schema
    description: >-
      The isolation endpoint uses `enabled: true` for isolate and `enabled: false`
      for de-isolate. The published spec does not document the `comment` field,
      which is accepted and stored by the API.
    update:
      properties:
        enabled:
          type: boolean
        ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 500
        comment:
          type: string
          maxLength: 400
      required:
        - enabled
        - ids
