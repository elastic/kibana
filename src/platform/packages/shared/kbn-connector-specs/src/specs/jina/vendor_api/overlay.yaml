overlay: 1.0.0
info:
  title: Jina Reader API corrections
  version: 1.0.0
actions:
  - target: $.paths['/echo','/echo/{rest}'].*.requestBody.content['application/json','multipart/form-data'].schema.allOf
    description: >-
      The echo routes type their request bodies as an empty allOf, which is not a valid schema: allOf must list
      at least one. The routes accept any body, which is what the schema means without the allOf.
    remove: true
