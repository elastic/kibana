overlay: 1.0.0
info:
  title: PostHog API corrections
  version: 1.0.0
actions:
  - target: $.servers
    description: >-
      The spec names only US and EU Cloud, but https://posthog.com/docs/api says "For self-hosted
      instances, use your self-hosted domain", and the connector takes that instance URL as
      config. Without a fixed server, requests to any instance URL match.
    remove: true
  - target: $.paths['/api/projects/{project_id}/session_recordings/'].get.parameters
    description: >-
      The spec lists only limit and offset, but the list view parses every query parameter into a
      RecordingsQuery (filter_from_params_to_query in
      https://github.com/PostHog/posthog/blob/master/posthog/session_recordings/session_recording_api.py
      and https://github.com/PostHog/posthog/blob/master/posthog/session_recordings/utils.py), whose
      date_from, date_to and person_uuid fields are strings (RecordingsQuery in the published spec).
    update:
      - name: date_from
        in: query
        required: false
        schema:
          type: string
      - name: date_to
        in: query
        required: false
        schema:
          type: string
      - name: person_uuid
        in: query
        required: false
        schema:
          type: string
