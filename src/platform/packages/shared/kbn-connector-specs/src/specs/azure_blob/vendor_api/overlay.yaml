overlay: 1.0.0
info:
  title: Azure Blob Storage corrections
  version: 1.0.0
actions:
  - target: $..parameters[?@.name == 'x-ms-version'].schema.enum
    description: >-
      The connector sends x-ms-version 2021-06-08, a Blob service version
      (https://learn.microsoft.com/en-us/rest/api/storageservices/versioning-for-the-azure-storage-services)
      that azure-rest-api-specs publishes no blob.json for. The operations the connector calls
      (List Containers, List Blobs, Get Blob, Get Blob Properties) and their parameters are
      identical in the 2021-04-10 and 2021-08-06 specs apart from this enum, so 2021-06-08 is
      accepted here.
    update:
      - '2021-06-08'

  - target: $['x-ms-paths']['/{containerName}/{blob}'].*.parameters[?@.name == 'blob'].schema.pattern
    description: >-
      Azure names a blob with 1 to 1024 characters and rules out only control characters
      (https://learn.microsoft.com/en-us/rest/api/storageservices/naming-and-referencing-containers--blobs--and-metadata).
      This pattern allows alphanumeric segments and a single extension, so an everyday name such
      as `my-file_v2.tar.gz` or one with a space would be refused. The length bounds next to it
      are right and stay.
    remove: true
