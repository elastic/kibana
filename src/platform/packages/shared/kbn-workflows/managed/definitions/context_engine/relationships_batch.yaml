version: '1'
name: __NAME__
description: 'Links one batch of the long-term facts and entities of a Context Engine AI index with typed relationships, for relationships, which runs the batches of a read at once.'
enabled: false
tags:
  - context-engine
  - memory
  - dreaming
  - relationships
settings:
  timeout: '25m'
consts:
  ai_index_id: __AI_INDEX_ID__
  memories_index: __MEMORIES_INDEX__
  connector_id: __CONNECTOR_ID__
  instructions: __INSTRUCTIONS__
  relationship_types: __RELATIONSHIP_TYPES__
outputs:
  - name: created
    type: number
  - name: updated
    type: number
  - name: deleted
    type: number
  - name: rejected
    type: number
triggers:
  - type: manual
    inputs:
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: 'The facts and entities of the batch, as relationships read them: the id, type, update time, permissions and lifecycle status of each, all with the same permissions.'
          items:
            type: object
        dry_run:
          type: boolean
          default: false
          description: Report what the batch would write and reject, and write nothing.
steps:
  - name: read_items
    type: elasticsearch.search
    with:
      index: '{{ consts.memories_index }}'
      ignore_unavailable: true
      size: 100
      sort:
        - updated_at: desc
      collapse:
        field: id
      _source:
        - id
        - type
        - title
        - description
        - content
        - permissions
        - governance.lifecycle.status
      query:
        bool:
          filter:
            - terms:
                id: '${{ inputs.items | map: "id" }}'
            - bool:
                should:
                  - bool:
                      must_not:
                        nested:
                          path: permissions.kibana.privileges
                          query:
                            match_all: {}
                          ignore_unmapped: true
                  - nested:
                      path: permissions.kibana.privileges
                      ignore_unmapped: true
                      query:
                        bool:
                          should:
                            - term:
                                permissions.kibana.privileges.space: '{{ workflow.spaceId }}'
                            - term:
                                permissions.kibana.privileges.space: '*'
                          minimum_should_match: 1
                minimum_should_match: 1

  - name: items
    type: data.set
    with:
      items: '${{ steps.read_items.output.hits.hits | map: "_source" }}'

  - name: read_entities
    type: elasticsearch.search
    with:
      index: '{{ consts.memories_index }}'
      ignore_unavailable: true
      size: 300
      sort:
        - _score: desc
        - updated_at: desc
      collapse:
        field: id
      _source:
        - id
        - type
        - title
        - description
        - permissions
        - governance.lifecycle.status
      query:
        bool:
          should:
            - match:
                title:
                  query: '{{ variables.items | map: "title" | join: " " | truncate: 1000 }} {{ variables.items | map: "content" | join: " " | truncate: 3000 }}'
          filter:
            - prefix:
                type:
                  value: 'entity.'
            - bool:
                should:
                  - bool:
                      must_not:
                        nested:
                          path: permissions.kibana.privileges
                          query:
                            match_all: {}
                          ignore_unmapped: true
                  - nested:
                      path: permissions.kibana.privileges
                      ignore_unmapped: true
                      query:
                        bool:
                          should:
                            - term:
                                permissions.kibana.privileges.space: '{{ workflow.spaceId }}'
                            - term:
                                permissions.kibana.privileges.space: '*'
                          minimum_should_match: 1
                minimum_should_match: 1

  - name: read_relationships
    type: elasticsearch.search
    with:
      index: '{{ consts.memories_index }}'
      ignore_unavailable: true
      size: 500
      sort:
        - updated_at: desc
      collapse:
        field: id
      _source:
        - id
        - description
        - attributes
        - permissions
        - governance.lifecycle.status
      query:
        bool:
          filter:
            - term:
                type: memory.relationship
            - terms:
                references.uri: '${{ variables.items | map: "id" | join: "|ki://" | prepend: "ki://" | split: "|" }}'
            - bool:
                should:
                  - bool:
                      must_not:
                        nested:
                          path: permissions.kibana.privileges
                          query:
                            match_all: {}
                          ignore_unmapped: true
                  - nested:
                      path: permissions.kibana.privileges
                      ignore_unmapped: true
                      query:
                        bool:
                          should:
                            - term:
                                permissions.kibana.privileges.space: '{{ workflow.spaceId }}'
                            - term:
                                permissions.kibana.privileges.space: '*'
                          minimum_should_match: 1
                minimum_should_match: 1

  - name: mentions
    type: data.set
    with:
      mention_clauses: >-
        [{%- assign separator = "" -%}
        {%- for item in variables.items -%}
        {%- assign kind = item.type | split: "." | first -%}
        {%- if kind == 'entity' and item.type != 'entity.user' and item.title != blank -%}
        {{ separator }}{"match_phrase":{"title":{{ item.title | json }}}},{"match_phrase":{"content":{{ item.title | json }}}}
        {%- assign separator = "," -%}
        {%- endif -%}
        {%- endfor -%}
        {%- if separator == "" -%}{"match_none":{}}{%- endif -%}]

  - name: match_facts
    type: elasticsearch.search
    with:
      index: '{{ consts.memories_index }}'
      ignore_unavailable: true
      size: 100
      collapse:
        field: id
      _source: false
      query:
        bool:
          filter:
            - prefix:
                type:
                  value: 'fact.'
            - bool:
                should:
                  - bool:
                      must_not:
                        nested:
                          path: permissions.kibana.privileges
                          query:
                            match_all: {}
                          ignore_unmapped: true
                  - nested:
                      path: permissions.kibana.privileges
                      ignore_unmapped: true
                      query:
                        bool:
                          should:
                            - term:
                                permissions.kibana.privileges.space: '{{ workflow.spaceId }}'
                            - term:
                                permissions.kibana.privileges.space: '*'
                          minimum_should_match: 1
                minimum_should_match: 1
          must_not:
            - terms:
                id: '${{ variables.items | map: "id" }}'
          should: '${{ variables.mention_clauses | json_parse }}'
          minimum_should_match: 1

  - name: read_facts
    type: elasticsearch.search
    with:
      index: '{{ consts.memories_index }}'
      ignore_unavailable: true
      size: 100
      sort:
        - updated_at: desc
      collapse:
        field: id
      _source:
        - id
        - type
        - title
        - content
        - permissions
        - governance.lifecycle.status
      query:
        bool:
          filter:
            - terms:
                id: '${{ steps.match_facts.output.hits.hits | map: "fields.id.first" }}'
            - bool:
                should:
                  - bool:
                      must_not:
                        nested:
                          path: permissions.kibana.privileges
                          query:
                            match_all: {}
                          ignore_unmapped: true
                  - nested:
                      path: permissions.kibana.privileges
                      ignore_unmapped: true
                      query:
                        bool:
                          should:
                            - term:
                                permissions.kibana.privileges.space: '{{ workflow.spaceId }}'
                            - term:
                                permissions.kibana.privileges.space: '*'
                          minimum_should_match: 1
                minimum_should_match: 1

  - name: relate
    type: ai.prompt
    connector-id: '{{ consts.connector_id }}'
    connector-id-by-feature: '{% if consts.connector_id == blank %}context_engine_prompt{% endif %}'
    on-failure:
      retry:
        max-attempts: 2
        delay: '30s'
    with:
      prompt: |
        You link long-term facts and entities with typed relationships.

        You are given ITEMS (facts and entities that are new or changed since they were last linked), EXISTING entities they could link to, EXISTING facts that mention an entity in ITEMS, and the EXISTING relationships of the ITEMS.

        Return only changes. Each relationship has from, an id from ITEMS, EXISTING ENTITIES or EXISTING FACTS, to, an id from ITEMS or EXISTING ENTITIES, and relation, one of the RELATIONSHIP TYPES. Read it as "from relation to": "Priya manages Alex" has from Priya, relation manages, to Alex.
        - Create a relationship with a description: one sentence on why it holds, from what the ITEMS and EXISTING FACTS say.
        - Update one by repeating its from, relation and to with a new description.
        - Delete one with delete: true when the ITEMS show it no longer holds.

        Rules:
        - Link only what the ITEMS or EXISTING FACTS state or clearly imply. Every relationship has at least one end in ITEMS.
        - from and to are different items.
        - Link a fact only to the entities it is about, with relation about: from is the fact, to is the entity. Never use another type from or to a fact.
        - Link an EXISTING FACT only to an entity in ITEMS that it is about. A fact that only mentions an entity's name in passing is not about it.
        - Every other type links two entities. Use one only when its description fits both ends; otherwise leave the pair unlinked.
        - Never create the inverse of an EXISTING relationship, one that states the same thing from the other end: with "Priya manages Alex", do not create "Alex reports_to Priya". A relationship that states something else, such as "Alex mentors Priya", is fine.
        - Leave out EXISTING relationships that do not change.
        - An empty list is a valid answer.

        RELATIONSHIP TYPES:
        - about: A fact is about an entity. Built in; the only type for facts.
        {%- for relationship_type in consts.relationship_types %}
        - {{ relationship_type.type }}{% if relationship_type.description %}: {{ relationship_type.description }}{% endif %}
        {%- endfor %}

        INSTRUCTIONS:

        {{ consts.instructions }}

        ITEMS (one per line):
        {%- for item in variables.items %}
        {{ item | pick: "id", "type", "title", "description", "content" | json }}
        {%- endfor %}

        EXISTING ENTITIES (one per line, none when empty):
        {%- assign item_ids = variables.items | map: "id" %}
        {%- assign audience = variables.items.first.permissions | json %}
        {%- for hit in steps.read_entities.output.hits.hits %}
        {%- assign entity_audience = hit._source.permissions | json %}
        {%- unless item_ids contains hit._source.id or hit._source.governance.lifecycle.status == 'deleted' or hit._source.governance.lifecycle.status == 'verification_failed' or entity_audience != audience %}
        {{ hit._source | pick: "id", "type", "title", "description" | json }}
        {%- endunless %}
        {%- endfor %}

        EXISTING FACTS (one per line, none when empty):
        {%- for hit in steps.read_facts.output.hits.hits %}
        {%- assign fact_audience = hit._source.permissions | json %}
        {%- unless item_ids contains hit._source.id or hit._source.governance.lifecycle.status == 'deleted' or hit._source.governance.lifecycle.status == 'verification_failed' or fact_audience != audience %}
        {{ hit._source | pick: "id", "type", "title", "content" | json }}
        {%- endunless %}
        {%- endfor %}

        EXISTING RELATIONSHIPS (one per line, none when empty):
        {%- for hit in steps.read_relationships.output.hits.hits %}
        {%- assign relationship_audience = hit._source.permissions | json %}
        {%- unless hit._source.governance.lifecycle.status == 'deleted' or relationship_audience != audience %}
        {%- assign key = hit._source.attributes["memory.key"] | split: "|" %}
        {"from": {{ key[0] | json }}, "relation": {{ key[1] | json }}, "to": {{ key[2] | json }}, "description": {{ hit._source.description | json }}}
        {%- endunless %}
        {%- endfor %}
      schema:
        type: object
        properties:
          relationships:
            type: array
            description: Relationships to create, update, or delete. Leave out relationships that do not change.
            items:
              type: object
              properties:
                from:
                  type: string
                  description: The id of the item the relationship goes from, from ITEMS, EXISTING ENTITIES or EXISTING FACTS.
                relation:
                  type: string
                  description: One of the relationship types; about for a fact.
                to:
                  type: string
                  description: The id of the entity the relationship goes to, from ITEMS or EXISTING ENTITIES.
                description:
                  type: string
                  description: One sentence on why the relationship holds. Required to create one.
                delete:
                  type: boolean
                  description: True deletes an existing relationship.
              required:
                - from
                - relation
                - to
        required:
          - relationships

  - name: apply_relationships
    type: context-engine.applyDreamRelationships
    with:
      ai_index_id: '{{ consts.ai_index_id }}'
      items: '${{ inputs.items | map: "id" }}'
      changes: '${{ steps.relate.output.content }}'
      dry_run: '${{ inputs.dry_run == true }}'

  - name: batch_output
    type: workflow.output
    with:
      created: '${{ steps.apply_relationships.output.created | default: 0 }}'
      updated: '${{ steps.apply_relationships.output.updated | default: 0 }}'
      deleted: '${{ steps.apply_relationships.output.deleted | default: 0 }}'
      rejected: '${{ steps.apply_relationships.output.rejected | size | default: 0 }}'
      would_write: '${{ steps.apply_relationships.output.would_write }}'
