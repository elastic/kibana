version: '1'
name: __NAME__
description: 'Links the long-term facts and entities of a Context Engine AI index with typed relationships, as the AI index dreaming config describes: creates, updates and deletes the relationships of the items that changed since the last run.'
enabled: false
tags:
  - context-engine
  - memory
  - dreaming
  - relationships
  - scheduled
settings:
  timeout: '30m'
  concurrency:
    key: __CONCURRENCY_KEY__
    strategy: queue
    max: 1
    queue-size: 10
    queue-ttl: '24h'
consts:
  ai_index_id: __AI_INDEX_ID__
  memories_index: __MEMORIES_INDEX__
  connector_id: __CONNECTOR_ID__
  instructions: __INSTRUCTIONS__
  relationship_types: __RELATIONSHIP_TYPES__
outputs:
  - name: items
    type: number
  - name: created
    type: number
  - name: updated
    type: number
  - name: deleted
    type: number
  - name: rejected
    type: number
  - name: resume_from
    type: string
  - name: resume_after_id
    type: string
triggers:
  - type: scheduled
    with:
      every: '__INTERVAL_MINUTES__m'
  - type: manual
    inputs:
      additionalProperties: false
      properties:
        dry_run:
          type: boolean
          default: false
          description: Report what linking would write and reject, and write nothing. The run ends cancelled, so the next run links the same items.
        since:
          type: string
          maxLength: 64
          description: Link the facts and entities updated since this ISO 8601 time, instead of since the last successful run.
steps:
  - name: status
    type: context-engine.getDreamingStatus
    with:
      ai_index_id: '{{ consts.ai_index_id }}'
      source: relationships

  - name: paused
    type: if
    condition: '${{ steps.status.output.dream != true }}'
    steps:
      - name: skip
        type: workflow.output
        status: cancelled
        with:
          items: 0
          reason: '{{ steps.status.output.reason }}'

  - name: last_run
    type: workflow.getLastRun
    with:
      default_hours: 168
      max_hours: 720

  - name: resume
    type: if
    condition: '${{ inputs.since == blank and steps.last_run.output.last_success.execution_id != blank }}'
    steps:
      - name: last_output
        type: kibana.request
        with:
          method: GET
          path: '/s/{{ workflow.spaceId }}/api/workflows/executions/{{ steps.last_run.output.last_success.execution_id }}'
          query:
            includeOutput: true
            omitStepExecutions: true

  - name: read_items
    type: elasticsearch.search
    with:
      index: '{{ consts.memories_index }}'
      ignore_unavailable: true
      size: 500
      sort:
        - updated_at: asc
        - id: asc
      collapse:
        field: id
        inner_hits:
          name: latest
          size: 1
          sort:
            - updated_at: desc
          _source:
            - id
            - type
            - title
            - description
            - content
            - updated_at
            - permissions
            - governance.lifecycle.status
      _source:
        - updated_at
        - id
      query:
        bool:
          filter:
            - bool:
                should:
                  - prefix:
                      type: 'fact.'
                  - prefix:
                      type: 'entity.'
                minimum_should_match: 1
            - bool:
                should:
                  - range:
                      updated_at:
                        gt: '{{ inputs.since | default: steps.last_output.output.context.output.resume_from | default: steps.last_run.output.since }}'
                  - bool:
                      filter:
                        - term:
                            updated_at: '{{ inputs.since | default: steps.last_output.output.context.output.resume_from | default: steps.last_run.output.since }}'
                        - range:
                            id:
                              gt: '{% if inputs.since == blank %}{{ steps.last_output.output.context.output.resume_after_id }}{% endif %}'
                minimum_should_match: 1
            - bool:
                should:
                  - bool:
                      must_not:
                        nested:
                          path: permissions.kibana.privileges
                          query:
                            match_all: {}
                          ignore_unmapped: true
                  - nested:
                      path: permissions.kibana.privileges
                      ignore_unmapped: true
                      query:
                        bool:
                          should:
                            - term:
                                permissions.kibana.privileges.space: '{{ workflow.spaceId }}'
                            - term:
                                permissions.kibana.privileges.space: '*'
                          minimum_should_match: 1
                minimum_should_match: 1

  - name: active
    type: data.set
    with:
      items: >-
        ${{ steps.read_items.output.hits.hits | map: "inner_hits.latest.hits.hits.first"
        | reject_exp: "item", "item._source.governance.lifecycle.status == 'deleted' or item._source.governance.lifecycle.status == 'verification_failed'"
        | map: "_source" }}
      resume_from: '{% if steps.read_items.output.hits.hits.size == 500 %}{{ steps.read_items.output.hits.hits.last._source.updated_at }}{% endif %}'
      resume_after_id: '{% if steps.read_items.output.hits.hits.size == 500 %}{{ steps.read_items.output.hits.hits.last._source.id }}{% endif %}'
      created: 0
      updated: 0
      deleted: 0
      rejected: 0
      would_write: []

  - name: link
    type: if
    condition: '${{ variables.items.size > 0 }}'
    steps:
      - name: batches
        type: foreach
        foreach: >-
          {%- assign batches = "" | split: "" -%}
          {%- assign audiences = variables.items | group_by_exp: "item", "item.permissions | json" -%}
          {%- for audience in audiences -%}
          {%- assign chunks = audience.items | chunk: 25 -%}
          {%- assign batches = batches | concat: chunks -%}
          {%- endfor -%}
          {{ batches | json }}
        steps:
          - name: read_entities
            type: elasticsearch.search
            with:
              index: '{{ consts.memories_index }}'
              ignore_unavailable: true
              size: 300
              sort:
                - updated_at: desc
              collapse:
                field: id
              _source:
                - id
                - type
                - title
                - description
                - permissions
                - governance.lifecycle.status
              query:
                bool:
                  filter:
                    - prefix:
                        type: 'entity.'
                    - bool:
                        should:
                          - bool:
                              must_not:
                                nested:
                                  path: permissions.kibana.privileges
                                  query:
                                    match_all: {}
                                  ignore_unmapped: true
                          - nested:
                              path: permissions.kibana.privileges
                              ignore_unmapped: true
                              query:
                                bool:
                                  should:
                                    - term:
                                        permissions.kibana.privileges.space: '{{ workflow.spaceId }}'
                                    - term:
                                        permissions.kibana.privileges.space: '*'
                                  minimum_should_match: 1
                        minimum_should_match: 1

          - name: read_relationships
            type: elasticsearch.search
            with:
              index: '{{ consts.memories_index }}'
              ignore_unavailable: true
              size: 500
              sort:
                - updated_at: desc
              collapse:
                field: id
              _source:
                - id
                - description
                - attributes
                - permissions
                - governance.lifecycle.status
              query:
                bool:
                  filter:
                    - term:
                        type: memory.relationship
                    - terms:
                        references.uri: '${{ foreach.item | map: "id" | join: "|ki://" | prepend: "ki://" | split: "|" }}'
                    - bool:
                        should:
                          - bool:
                              must_not:
                                nested:
                                  path: permissions.kibana.privileges
                                  query:
                                    match_all: {}
                                  ignore_unmapped: true
                          - nested:
                              path: permissions.kibana.privileges
                              ignore_unmapped: true
                              query:
                                bool:
                                  should:
                                    - term:
                                        permissions.kibana.privileges.space: '{{ workflow.spaceId }}'
                                    - term:
                                        permissions.kibana.privileges.space: '*'
                                  minimum_should_match: 1
                        minimum_should_match: 1

          - name: relate
            type: ai.prompt
            connector-id: '{{ consts.connector_id }}'
            connector-id-by-feature: '{% if consts.connector_id == blank %}context_engine_prompt{% endif %}'
            on-failure:
              retry:
                max-attempts: 2
                delay: '30s'
            with:
              prompt: |
                You link long-term facts and entities with typed relationships.

                You are given ITEMS (facts and entities that are new or changed since they were last linked), EXISTING entities they could link to, and the EXISTING relationships of the ITEMS.

                Return only changes. Each relationship has from and to, each an id from ITEMS or EXISTING ENTITIES, and relation, one of the RELATIONSHIP TYPES. Read it as "from relation to": "Priya manages Alex" has from Priya, relation manages, to Alex.
                - Create a relationship with a description: one sentence on why it holds, from what the ITEMS say.
                - Update one by repeating its from, relation and to with a new description.
                - Delete one with delete: true when the ITEMS show it no longer holds.

                Rules:
                - Link only what the ITEMS state or clearly imply. Every relationship has at least one end in ITEMS.
                - from and to are different items.
                - Link a fact only to the entities it is about, with relation about: from is the fact, to is the entity. Never use another type from or to a fact.
                - Every other type links two entities. Use one only when its description fits both ends; otherwise leave the pair unlinked.
                - Leave out EXISTING relationships that do not change.
                - An empty list is a valid answer.

                RELATIONSHIP TYPES:
                - about: A fact is about an entity. Built in; the only type for facts.
                {%- for relationship_type in consts.relationship_types %}
                - {{ relationship_type.type }}{% if relationship_type.description %}: {{ relationship_type.description }}{% endif %}
                {%- endfor %}

                INSTRUCTIONS:

                {{ consts.instructions }}

                ITEMS (one per line):
                {%- for item in foreach.item %}
                {{ item | pick: "id", "type", "title", "description", "content" | json }}
                {%- endfor %}

                EXISTING ENTITIES (one per line, none when empty):
                {%- assign item_ids = foreach.item | map: "id" %}
                {%- assign audience = foreach.item.first.permissions | json %}
                {%- for hit in steps.read_entities.output.hits.hits %}
                {%- assign entity_audience = hit._source.permissions | json %}
                {%- unless item_ids contains hit._source.id or hit._source.governance.lifecycle.status == 'deleted' or hit._source.governance.lifecycle.status == 'verification_failed' or entity_audience != audience %}
                {{ hit._source | pick: "id", "type", "title", "description" | json }}
                {%- endunless %}
                {%- endfor %}

                EXISTING RELATIONSHIPS (one per line, none when empty):
                {%- for hit in steps.read_relationships.output.hits.hits %}
                {%- assign relationship_audience = hit._source.permissions | json %}
                {%- unless hit._source.governance.lifecycle.status == 'deleted' or relationship_audience != audience %}
                {%- assign key = hit._source.attributes["memory.key"] | split: "|" %}
                {"from": {{ key[0] | json }}, "relation": {{ key[1] | json }}, "to": {{ key[2] | json }}, "description": {{ hit._source.description | json }}}
                {%- endunless %}
                {%- endfor %}
              schema:
                type: object
                properties:
                  relationships:
                    type: array
                    description: Relationships to create, update, or delete. Leave out relationships that do not change.
                    items:
                      type: object
                      properties:
                        from:
                          type: string
                          description: The id of the item the relationship goes from, from ITEMS or EXISTING ENTITIES.
                        relation:
                          type: string
                          description: One of the relationship types; about for a fact.
                        to:
                          type: string
                          description: The id of the item the relationship goes to, from ITEMS or EXISTING ENTITIES.
                        description:
                          type: string
                          description: One sentence on why the relationship holds. Required to create one.
                        delete:
                          type: boolean
                          description: True deletes an existing relationship.
                      required:
                        - from
                        - relation
                        - to
                required:
                  - relationships

          - name: apply_relationships
            type: context-engine.applyDreamRelationships
            with:
              ai_index_id: '{{ consts.ai_index_id }}'
              items: '${{ foreach.item | map: "id" }}'
              changes: '${{ steps.relate.output.content }}'
              dry_run: '${{ inputs.dry_run == true }}'

          - name: tally
            type: data.set
            with:
              created: '${{ variables.created | plus: steps.apply_relationships.output.created }}'
              updated: '${{ variables.updated | plus: steps.apply_relationships.output.updated }}'
              deleted: '${{ variables.deleted | plus: steps.apply_relationships.output.deleted }}'
              rejected: '${{ variables.rejected | plus: steps.apply_relationships.output.rejected.size }}'
              would_write: '${{ variables.would_write | concat: steps.apply_relationships.output.would_write }}'

  - name: dry_run_result
    type: if
    condition: '${{ inputs.dry_run == true }}'
    steps:
      - name: dry_run_output
        type: workflow.output
        status: cancelled
        with:
          items: '${{ variables.items | size | default: 0 }}'
          created: '${{ variables.created | default: 0 }}'
          updated: '${{ variables.updated | default: 0 }}'
          deleted: '${{ variables.deleted | default: 0 }}'
          rejected: '${{ variables.rejected | default: 0 }}'
          would_write: '${{ variables.would_write }}'
          reason: 'Dry run: nothing was written.'

  - name: output_result
    type: workflow.output
    with:
      items: '${{ variables.items | size | default: 0 }}'
      created: '${{ variables.created | default: 0 }}'
      updated: '${{ variables.updated | default: 0 }}'
      deleted: '${{ variables.deleted | default: 0 }}'
      rejected: '${{ variables.rejected | default: 0 }}'
      resume_from: '{{ variables.resume_from }}'
      resume_after_id: '{{ variables.resume_after_id }}'
