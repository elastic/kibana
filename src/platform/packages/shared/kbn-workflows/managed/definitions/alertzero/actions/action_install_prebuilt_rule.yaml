version: "1"
name: Install prebuilt detection rule
description: >
  AlertZero action: installs an Elastic prebuilt detection rule and turns it on.
  Executed by the investigation proposal gate once an analyst approves, so the
  change is attributed to the approver.
enabled: true
tags:
  # Generic tag every action workflow carries, so the catalog can be
  # discovered by tag rather than a hardcoded list.
  - action
  - alertzero
consts:
  # Self-describing catalog metadata, read back by the proposals service when a
  # proposal referencing this workflow is created or rendered. Metadata has to
  # live under `consts`: unknown top-level keys are stripped by the schema.
  actionMetadata:
    name: Install prebuilt detection rule
    description: Installs an Elastic prebuilt rule from the package and enables it.
    category: configure
    impact: medium
    reversible: true
    approvalPolicy: always-gate
triggers:
  - type: manual
    inputs:
      properties:
        actionInput:
          type: object
          description: >
            Identity of the prebuilt rule to install. The rule has no saved object
            until it is installed, so it is addressed by its signature id and
            package version rather than a saved-object id.
          properties:
            rule_id:
              type: string
              minLength: 1
              maxLength: 512
              description: Signature rule id (`rule_id`) of the prebuilt rule.
            version:
              # Package versions are integers; a fraction would pass here and only
              # fail at the install API, after an analyst has approved it.
              type: integer
              minimum: 1
              description: Package version of the prebuilt rule to install.
          required:
            - rule_id
            - version
          additionalProperties: false
      required:
        - actionInput
      additionalProperties: false
outputs:
  - name: id
    type: string
  - name: installed
    type: boolean
  - name: enabled
    type: boolean
steps:
  # A proposal whose rule was installed since is stale, so nothing is installed
  # or enabled. The lookup is by exact signature id; only a 404 means not installed.
  - name: find_installed_rule
    type: kibana.request
    with:
      # Legacy path: fail on an auth proxy's sign-in redirect instead of passing with HTML (the self client already rejects redirects). See elastic/security-team#20135.
      fetcher:
        follow_redirects: false
      method: GET
      path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules?rule_id={{ inputs.actionInput.rule_id | url_encode }}"
      headers:
        kbn-xsrf: string
        elastic-api-version: "2023-10-31"
        Content-Type: application/json
    on-failure:
      continue: true

  - name: fail_already_installed
    type: workflow.fail
    if: "${{ steps.find_installed_rule.error == nil and steps.find_installed_rule.output.id != nil }}"
    with:
      message: >-
        The rule "{{ steps.find_installed_rule.output.name }}" was installed after this
        proposal was created. Approving again won't work, so decline it.

  - name: fail_rule_lookup
    type: workflow.fail
    if: >-
      ${{ steps.find_installed_rule.error != nil
        and not (steps.find_installed_rule.error.message contains 'HTTP 404') }}
    with:
      message: "{{ steps.find_installed_rule.error.message }}"

  # The installation review lists only the latest version of each rule not yet
  # installed. The exact rule_id comparison below guards against a filter that
  # matched some other rule.
  - name: review_rule
    type: kibana.request
    with:
      # Legacy path: fail on an auth proxy's sign-in redirect instead of passing with HTML (the self client already rejects redirects). See elastic/security-team#20135.
      fetcher:
        follow_redirects: false
      method: POST
      path: "/s/{{ workflow.spaceId }}/internal/detection_engine/prebuilt_rules/installation/_review"
      headers:
        kbn-xsrf: string
        elastic-api-version: "1"
        x-elastic-internal-origin: kibana
        Content-Type: application/json
      body:
        page: 1
        per_page: 1
        filter:
          term: 'security-rule.rule_id: "{{ inputs.actionInput.rule_id }}"'
        fields: [rule_id, version, name]

  - name: fail_version_changed
    type: workflow.fail
    if: >-
      ${{ steps.review_rule.output.rules[0].rule_id == inputs.actionInput.rule_id
        and steps.review_rule.output.rules[0].version != inputs.actionInput.version }}
    with:
      message: >-
        The rule "{{ steps.review_rule.output.rules[0].name }}" is now at version
        {{ steps.review_rule.output.rules[0].version }}, but this proposal was for
        version {{ inputs.actionInput.version }}. Approving again won't work, so
        decline it.

  - name: install_rule
    type: kibana.request
    with:
      # Legacy path: fail on an auth proxy's sign-in redirect instead of passing with HTML (the self client already rejects redirects). See elastic/security-team#20135.
      fetcher:
        follow_redirects: false
      method: POST
      path: "/s/{{ workflow.spaceId }}/internal/detection_engine/prebuilt_rules/installation/_perform"
      headers:
        kbn-xsrf: string
        elastic-api-version: "1"
        x-elastic-internal-origin: kibana
        Content-Type: application/json
      body:
        mode: SPECIFIC_RULES
        rules:
          - rule_id: "{{ inputs.actionInput.rule_id }}"
            version: "${{ inputs.actionInput.version }}"

  # Installed by someone else between the check above and this install.
  - name: fail_install_skipped
    type: workflow.fail
    if: "${{ steps.install_rule.output.summary.skipped > 0 }}"
    with:
      message: >-
        The rule "{{ steps.review_rule.output.rules[0].name | default: inputs.actionInput.rule_id }}"
        was installed after this proposal was created. Approving again won't work, so
        decline it.

  # A fresh install answers with the new saved object, so enable it by uuid.
  - name: enable_installed_rule
    type: security.enableRule
    if: "${{ steps.install_rule.output.summary.succeeded > 0 }}"
    with:
      ids:
        - "{{ steps.install_rule.output.results.created[0].id }}"

  # The install API answers 200 even when it installed nothing (`summary.failed`),
  # and the proposal gate counts any error-free run as success. Step `if` cannot group with
  # parentheses, so what landed is computed here and read below as flags.
  - name: outcome
    type: data.set
    with:
      installed: "${{ steps.install_rule.output.summary.succeeded > 0 }}"
      enabled: >-
        ${{ steps.enable_installed_rule.output.succeeded > 0
          or steps.enable_installed_rule.output.skipped > 0 }}

  # A rule that is not installed and enabled fails the action, so the gate records
  # the proposal `failed` and re-offers it instead of reporting `succeeded`.
  - name: fail_not_applied
    type: workflow.fail
    if: "${{ steps.outcome.output.installed != true or steps.outcome.output.enabled != true }}"
    with:
      message: >-
        Prebuilt rule {{ inputs.actionInput.rule_id }} version {{ inputs.actionInput.version }}
        was not {% if steps.outcome.output.installed != true %}installed{% else %}enabled{% endif %}.
        Install summary: {{ steps.install_rule.output.summary | json }}
        {{ steps.install_rule.output.errors | json }}

  # `workflow.execute` declares its output as unknown, so the parent falls back
  # to a heuristic read of the last step unless the child emits explicitly.
  - name: emit_result
    type: workflow.output
    status: completed
    with:
      id: "{{ steps.install_rule.output.results.created[0].id }}"
      installed: "${{ steps.outcome.output.installed }}"
      enabled: "${{ steps.outcome.output.enabled }}"
