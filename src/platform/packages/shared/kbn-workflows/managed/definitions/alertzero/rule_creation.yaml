version: "1"
name: Detection Rule Creation Worker
description: >
  Drafts an ES|QL detection rule for a reported gap, previews it, and creates it
  disabled once an analyst approves.
enabled: true
tags:
  - security
  - detection-rule-creation
triggers:
  - type: manual
    inputs:
      properties:
        technique:
          type: string
          description: MITRE ATT&CK technique id the new rule should cover.
        gap_description:
          type: string
          description: Detection gap the new rule should cover.
        evidence:
          type: string
          description: Hunt findings or event examples supporting the gap.
        confidence:
          type: number
          description: Confidence in the detection gap from 0 to 1.
        preview_invocation_count:
          type: number
          default: 2
          description: Rule executions the preview simulates.
      required: []
      additionalProperties: false
outputs:
  - name: created
    type: boolean
  - name: rule_name
    type: string
steps:
  - name: draft_creation
    type: ai.agent
    timeout: "10m"
    create-conversation: true
    with:
      message: |-
        Use the [/detection-rule-edit](skill://detection-rule-edit) skill to draft
        a new ES|QL rule from the supplied context. The supplied context is
        sufficient; do not ask a follow-up question.

        ATT&CK technique: {{ inputs.technique }}
        Detection gap: {{ inputs.gap_description }}
        Evidence: {{ inputs.evidence }}
        Confidence: {{ inputs.confidence }}

        Quality gate — decline an unwinnable gap instead of drafting when ANY
        holds:
        - confidence is below 0.3;
        - the gap is a catch-all with no concrete behavior, indicator, or data
          source (e.g. "any command execution activity");
        - the evidence cannot support a specific ES|QL query.
        To decline: call no tools, set skipped to true, set reason to one
        sentence naming what is missing, and leave rule empty. Never draft a
        generic catch-all query to avoid declining — a decline is the correct
        outcome for an unwinnable gap.

        When the gap is winnable, call security.create_detection_rule exactly
        once and set skipped to false. Tool discipline:
        - No speculative tools: no rule search, no ES|QL validation, no rule
          preview — later workflow steps preview and validate the draft.
        - Corroboration is bounded: at most one threat-intel or documentation
          lookup, and only when the evidence names no concrete behavior or
          data source.
        - After security.create_detection_rule returns, call no further tools.

        Echo the tool's returned rule fields under "rule" and the attachment
        metadata alongside it. Never return id or rule_id.
      schema:
        type: object
        additionalProperties: false
        properties:
          skipped:
            type: boolean
            description: True when the quality gate declined the gap as unwinnable.
          reason:
            type: string
            description: One sentence naming what is missing, set when skipped is true.
          rule:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
              description:
                type: string
              query:
                type: string
              language:
                type: string
                enum: [esql]
              type:
                type: string
                enum: [esql]
              interval:
                type: string
              from:
                type: string
              to:
                type: string
              severity:
                type: string
                enum: [low, medium, high, critical]
              risk_score:
                type: number
              threat:
                type: array
                items:
                  type: object
                  additionalProperties: true
              tags:
                type: array
                items:
                  type: string
            required:
              - name
              - description
              - query
              - language
              - type
              - interval
              - from
              - to
              - severity
              - risk_score
              - threat
              - tags
          attachment_id:
            type: string
          attachment_version:
            type: number
        required:
          - skipped

  - name: preview_creation
    type: workflow.execute
    if: >-
      ${{ steps.draft_creation.output.structured_output.rule.query != null
        and steps.draft_creation.output.structured_output.rule.query != ''
        and steps.draft_creation.output.structured_output.attachment_id != null }}
    with:
      workflow-id: system-security-rule-preview
      inputs:
        space_id: "{{ workflow.spaceId }}"
        preview_body:
          name: "{{ steps.draft_creation.output.structured_output.rule.name }}"
          description: "{{ steps.draft_creation.output.structured_output.rule.description }}"
          query: "{{ steps.draft_creation.output.structured_output.rule.query }}"
          language: esql
          type: esql
          interval: "{{ steps.draft_creation.output.structured_output.rule.interval }}"
          from: "{{ steps.draft_creation.output.structured_output.rule.from }}"
          to: "{{ steps.draft_creation.output.structured_output.rule.to }}"
          severity: "{{ steps.draft_creation.output.structured_output.rule.severity }}"
          risk_score: "${{ steps.draft_creation.output.structured_output.rule.risk_score }}"
          threat: "${{ steps.draft_creation.output.structured_output.rule.threat }}"
          tags: "${{ steps.draft_creation.output.structured_output.rule.tags }}"
          invocationCount: "${{ inputs.preview_invocation_count }}"
          timeframeEnd: '{{ "now" | date: "%Y-%m-%dT%H:%M:%S.%LZ", "UTC" }}'

  - name: review_creation
    type: waitForApproval
    if: >-
      ${{ steps.draft_creation.output.structured_output.rule.query != null
        and steps.draft_creation.output.structured_output.rule.query != ''
        and steps.draft_creation.output.structured_output.attachment_id != null }}
    timeout: "72h"
    with:
      approveLabel: Create rule
      rejectLabel: Dismiss
      message: |-
        New ES|QL detection rule: {{ steps.draft_creation.output.structured_output.rule.name }}

        {{ steps.draft_creation.output.structured_output.rule.description }}

        Query:
        {{ steps.draft_creation.output.structured_output.rule.query }}

        ATT&CK technique: {{ inputs.technique }}
        Expected matches: {% if steps.preview_creation.output.succeeded and steps.preview_creation.output.is_aborted == false %}{{ steps.preview_creation.output.alert_count }}{% else %}preview inconclusive{% endif %}
        {% if steps.preview_creation.output.error_text != '' %}
        Preview errors: {{ steps.preview_creation.output.error_text }}
        {% endif %}
        Severity: {{ steps.draft_creation.output.structured_output.rule.severity }}
        Risk score: {{ steps.draft_creation.output.structured_output.rule.risk_score }}

        Review the draft: /app/agent_builder/conversations/{{ steps.draft_creation.output.conversation_id }}


  - name: classify_preview
    type: data.set
    with:
      conclusive: >-
        ${{ steps.preview_creation.output.succeeded == true
          and steps.preview_creation.output.is_aborted == false }}
      note: >-
        {%- if steps.review_creation.output.response.approved == true and (steps.preview_creation.output.succeeded != true or steps.preview_creation.output.is_aborted == true) -%}
        Preview was inconclusive.
        {%- if steps.preview_creation.output.error_text != '' %} Preview errors:
        {{ steps.preview_creation.output.error_text }}{% endif -%}
        {%- endif -%}

  - name: create_rule
    type: security.createRule
    if: >-
      ${{ steps.review_creation.output.response.approved == true }}
    with:
      rule: "${{ steps.draft_creation.output.structured_output.rule }}"

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      created: "${{ steps.create_rule.error == null and steps.create_rule.output.id != null }}"
      rule_name: "{{ steps.draft_creation.output.structured_output.rule.name }}"
