version: "1"
name: Detection Coverage Worker
description: >
  Finds knowledge indicators that report a detection gap and are still pending. Starts
  one Detection Coverage Review for each, up to a limit of active reviews per space.
  Skips indicators that already have an active review. Does not write to indicators. One
  run is one sweep.
enabled: true
tags:
  - security
  - detection-coverage
settings:
  # One sweep per space at a time. Two sweeps at the same time can start two reviews for
  # one indicator.
  concurrency:
    key: detection-coverage
    strategy: drop
    max: 1
triggers:
  # Manual trigger only. This workflow is installed once for all spaces. A scheduled
  # trigger on such a workflow does not run.
  - type: manual
    inputs:
      properties:
        ai_index_id:
          type: string
          maxLength: 256
          description: "AI index that holds the indicators. Default: security-investigations."
        max_open_checks:
          type: integer
          minimum: 1
          # The maximum equals the default. The search below reads at most 50 indicators.
          maximum: 50
          description: "Maximum number of active reviews in this space. Default: 50. A manual run can only lower it."
      additionalProperties: false
outputs:
  - name: pending
    type: number
  - name: started
    type: number
  - name: in_flight
    type: number
  - name: search_failed
    type: boolean
  - name: lookup_failed
    type: boolean
consts:
  # Defaults. A manual run can override each value through the input with the same name.
  ai_index_id: security-investigations
  # Maximum number of active reviews per space. A sweep starts new reviews up to this
  # number.
  max_open_checks: 50
  # The template language has no empty-list literal. `| default: []` returns nothing.
  # This constant is the empty-list fallback.
  no_rows: []
steps:
  # Step 1 of 6: list the reviews that are active in this space. A review is active from
  # its start until it ends. Each review has the concurrency key
  # `coverage-<indicator id>`. The key gives the indicator id.
  #
  # If this request fails, the sweep continues with an empty list. Then every pending
  # indicator is a candidate. The review's concurrency rule drops a duplicate review.
  #
  # The workflow id in the path must equal the id in `start_review`.
  - name: list_active_reviews
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/api/workflows/workflow/system-security-coverage-review/executions?statuses=pending&statuses=queued&statuses=waiting&statuses=waiting_for_input&statuses=waiting_for_child&statuses=running&size=100"
      headers:
        elastic-api-version: "2023-10-31"

  # Step 2 of 6: get the indicator ids of the active reviews, and count them. The
  # template language cannot change list items one by one. The keys are joined into one
  # string, the prefix is removed, and the string is split into ids.
  - name: collect_active_indicators
    type: data.set
    with:
      indicator_ids: "${{ steps.list_active_reviews.output.results | default: consts.no_rows | map: 'concurrencyGroupKey' | join: ',' | remove: 'coverage-' | split: ',' }}"
      count: "${{ steps.list_active_reviews.output.results | default: consts.no_rows | size }}"

  # Step 3 of 6: count the reviews this sweep can start: the maximum minus the active
  # reviews. The result is never below zero. A negative slice length does not give an
  # empty list.
  - name: resolve_free_slots
    type: data.set
    with:
      free: "${{ inputs.max_open_checks | default: consts.max_open_checks | minus: steps.collect_active_indicators.output.count | at_least: 0 }}"

  # Step 4 of 6: find pending indicators without an active review. The query matches
  # type and status only. `attributes` is a flattened field in Elasticsearch. Values
  # match exactly and are case-sensitive.
  #
  # The query excludes indicators with an active review. An excluded indicator does not
  # use a place in the result. If step 1 failed, the list is empty, and an empty list
  # excludes nothing.
  #
  # If this search fails, the sweep starts no review. The next sweep tries again.
  - name: search_pending_indicators
    type: elasticsearch.search
    on-failure:
      continue: true
    with:
      index: "ai-index-idx-{{ inputs.ai_index_id | default: consts.ai_index_id }}"
      # A plain number. The step rejects a template in a number field. The value equals
      # max_open_checks, so one sweep can fill an empty space. Change both together.
      size: 50
      query:
        bool:
          filter:
            - term:
                type: security.coverage
            - term:
                attributes.status: pending
          must_not:
            - ids:
                values: "${{ steps.collect_active_indicators.output.indicator_ids | default: consts.no_rows }}"

  # Step 5 of 6: keep only as many indicators as the sweep can start.
  - name: resolve_dispatch_batch
    type: data.set
    with:
      indicators: "${{ steps.search_pending_indicators.output.hits.hits | default: consts.no_rows | slice: 0, steps.resolve_free_slots.output.free }}"

  # Step 6 of 6: start one review per indicator. The sweep does not wait for the review.
  # A review can wait up to 72 hours for a human. The sweep passes the indicator id and
  # the index name. The review reads the indicator.
  - name: start_reviews
    type: foreach
    foreach: "${{ steps.resolve_dispatch_batch.output.indicators | default: consts.no_rows }}"
    steps:
      - name: start_review
        type: workflow.executeAsync
        on-failure:
          continue: true
        with:
          workflow-id: system-security-coverage-review
          inputs:
            ki_id: "{{ foreach.item._id }}"
            ai_index_id: "{{ inputs.ai_index_id | default: consts.ai_index_id }}"

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      # Pending indicators without an active review. `pending` plus `in_flight` is the
      # full queue.
      pending: "${{ steps.search_pending_indicators.output.hits.total.value | default: 0 }}"
      # Reviews this sweep tried to start.
      started: "${{ steps.resolve_dispatch_batch.output.indicators | default: consts.no_rows | size }}"
      in_flight: "${{ steps.collect_active_indicators.output.count }}"
      # Both reads can fail without stopping the sweep. These flags show a failed read.
      # Zero pending after a failed search does not mean an empty queue.
      search_failed: "${{ steps.search_pending_indicators.error != null }}"
      lookup_failed: "${{ steps.list_active_reviews.error != null }}"
