version: "1"
name: Detection Coverage Worker
description: >
  Finds knowledge indicators in this space that report a detection gap, are still
  pending, and were created inside the lookback window. Starts one Detection Coverage
  Review for each, up to a limit of active reviews per space. Skips indicators that
  already have an active review. Does not write to indicators. One run is one sweep.
enabled: true
tags:
  - security
  - detection-coverage
settings:
  # One sweep per space at a time. Two sweeps at the same time can start two reviews for
  # one indicator.
  concurrency:
    key: detection-coverage
    strategy: drop
    max: 1
triggers:
  # Manual trigger only. This workflow is installed once for all spaces. A scheduled
  # trigger on such a workflow does not run.
  - type: manual
    inputs:
      properties:
        ai_index_id:
          type: string
          maxLength: 256
          description: "AI index that holds the indicators. Default: security-investigations."
        max_open_checks:
          type: integer
          minimum: 1
          maximum: 100
          description: "Maximum number of active reviews in this space. Default: 100. Cannot exceed 100 because the active-review lookup is capped at 100 by the executions API."
        batch_size:
          type: integer
          minimum: 1
          maximum: 50
          description: "How many new reviews to start per sweep. Default: 5. Raise to process the backlog faster; lower to reduce Task Manager load."
        lookback_days:
          type: integer
          minimum: 1
          maximum: 90
          description: "How many days back the sweep looks for indicators, counted from their creation time. Default: 14. A manual run can raise or lower it."
      additionalProperties: false
outputs:
  - name: pending
    type: number
  - name: started
    type: number
  - name: in_flight
    type: number
  - name: search_failed
    type: boolean
  - name: lookup_failed
    type: boolean
consts:
  # Defaults. A manual run can override each value through the input with the same name.
  ai_index_id: security-investigations
  # Maximum number of active reviews per space (across all sweeps). A sweep starts new
  # reviews only when the in-flight count is below this ceiling. Capped at 100 because
  # the executions API returns at most 100 results, so counting above 100 is impossible.
  max_open_checks: 100
  # New reviews started per sweep. Kept small so each sweep adds a bounded number of
  # Task Manager tasks. The ES search size below must be at least this value.
  batch_size: 5
  # How many days back the sweep looks. An indicator older than this is never reviewed,
  # so the sweep reads the oldest indicators in the window first. Must stay above the
  # review's `176h` timeout: a review can park that long on its proposal, and an
  # expired proposal is only retried while its indicator is still inside the window.
  # A test pins the relationship.
  lookback_days: 14
  # The template language has no empty-list literal. `| default: []` returns nothing.
  # This constant is the empty-list fallback.
  no_rows: []
steps:
  # Step 1 of 8: list the reviews that are active in this space. A review is active from
  # its start until it ends. Each review has the concurrency key
  # `coverage-<indicator id>`. The key gives the indicator id.
  #
  # If this request fails, the sweep continues with an empty list. Then every pending
  # indicator is a candidate. The review's concurrency rule drops a duplicate review.
  #
  # The workflow id in the path must equal the id in `start_review`.
  #
  # `size=100` is the maximum the executions API accepts. If more than 100 reviews are
  # active, the in-flight count is underestimated and the exclusion list is incomplete.
  # The concurrency key drop remains the enforcer that prevents duplicate reviews.
  - name: list_active_reviews
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/api/workflows/workflow/system-security-coverage-review/executions?statuses=pending&statuses=queued&statuses=waiting&statuses=waiting_for_input&statuses=waiting_for_child&statuses=running&size=100"
      headers:
        elastic-api-version: "2023-10-31"

  # Step 2 of 8: get the indicator ids of the active reviews, and count them. The
  # template language cannot change list items one by one. The keys are joined into one
  # string, the prefix is removed, and the string is split into ids.
  - name: collect_active_indicators
    type: data.set
    with:
      parsed: "${{ steps.list_active_reviews.output.results | default: consts.no_rows | map: 'concurrencyGroupKey' | join: ',' | remove: 'coverage-' | split: ',' }}"
      parsed_count: "${{ steps.list_active_reviews.output.results | default: consts.no_rows | map: 'concurrencyGroupKey' | join: ',' | remove: 'coverage-' | split: ',' | size }}"
      count: "${{ steps.list_active_reviews.output.results | default: consts.no_rows | size }}"

  # Step 3 of 8: publish the ids only when the parse is sound. `join` and `split` use a
  # comma, so a comma inside a key would produce more ids than there are reviews, and a
  # fragment could name an unrelated indicator. The parse counts only when it yields
  # exactly one id per active review. Otherwise this step is skipped and the search below
  # excludes nothing. The review's own drop concurrency then stops a duplicate review.
  - name: resolve_active_indicators
    type: data.set
    if: "${{ steps.collect_active_indicators.output.parsed_count == steps.collect_active_indicators.output.count }}"
    with:
      indicator_ids: "${{ steps.collect_active_indicators.output.parsed }}"

  # Step 4 of 8: count how many reviews the space can still accept: the ceiling minus
  # the active reviews. The result is never below zero.
  - name: resolve_free_slots
    type: data.set
    with:
      free: "${{ inputs.max_open_checks | default: consts.max_open_checks | minus: steps.collect_active_indicators.output.count | at_least: 0 }}"

  # Step 5 of 8: resolve the per-sweep batch limit from the input or the default.
  - name: resolve_batch_size
    type: data.set
    with:
      size: "${{ inputs.batch_size | default: consts.batch_size }}"

  # Step 6 of 8: find pending indicators without an active review. The query matches
  # type, status, and creation time. `attributes` is a flattened field in Elasticsearch.
  # Values match exactly and are case-sensitive. `@timestamp` is written once, when the
  # indicator is created, so the range is a creation-time window and marking an indicator
  # processed does not move it.
  #
  # All spaces share one indicator index, so the query also matches the space. The
  # producer writes it in `attributes.space_id`. An indicator without it is not reviewed.
  #
  # The query excludes indicators with an active review. An excluded indicator does not
  # use a place in the result. If step 1 failed or the parse was unsound, the list is
  # empty, and an empty list excludes nothing.
  #
  # Oldest first: an indicator that leaves the window is never reviewed, so the sweep
  # takes the ones closest to leaving it. `_source` is not read. Only `_id` reaches the
  # review, and indicator content can be 64 kB.
  #
  # If this search fails, the sweep starts no review. The next sweep tries again.
  - name: search_pending_indicators
    type: elasticsearch.search
    on-failure:
      continue: true
    with:
      index: "ai-index-idx-{{ inputs.ai_index_id | default: consts.ai_index_id }}"
      # A plain number. The step rejects a template in a number field. Set to the
      # maximum allowed batch_size input so the search always returns enough candidates.
      # consts.batch_size and the batch_size input maximum (50) must not exceed this.
      size: 50
      _source: false
      sort:
        - "@timestamp":
            order: asc
            unmapped_type: date
      query:
        bool:
          filter:
            - term:
                type: security.coverage
            - term:
                attributes.status: pending
            - term:
                attributes.space_id: "{{ workflow.spaceId }}"
            - range:
                "@timestamp":
                  gte: "now-{{ inputs.lookback_days | default: consts.lookback_days }}d"
          must_not:
            - ids:
                values: "${{ steps.resolve_active_indicators.output.indicator_ids | default: consts.no_rows }}"

  # Step 7 of 8: cap results to the smaller of free slots and batch size. Two slices in
  # sequence take the minimum: the first limits by the space ceiling, the second by the
  # per-sweep batch. The ES search already returns at most batch_size.maximum (50) hits.
  - name: resolve_dispatch_batch
    type: data.set
    with:
      indicators: "${{ steps.search_pending_indicators.output.hits.hits | default: consts.no_rows | slice: 0, steps.resolve_free_slots.output.free | slice: 0, steps.resolve_batch_size.output.size }}"

  # Step 8 of 8: start one review per indicator. The sweep does not wait for the review.
  # A review can park for up to a week while its proposal gate waits for a human. The
  # sweep passes the indicator id and the index name. The review reads the indicator.
  - name: start_reviews
    type: foreach
    foreach: "${{ steps.resolve_dispatch_batch.output.indicators | default: consts.no_rows }}"
    steps:
      - name: start_review
        type: workflow.executeAsync
        on-failure:
          continue: true
        with:
          workflow-id: system-security-coverage-review
          inputs:
            ki_id: "{{ foreach.item._id }}"
            ai_index_id: "{{ inputs.ai_index_id | default: consts.ai_index_id }}"

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      # Pending indicators inside the lookback window and without an active review.
      # `pending` plus `in_flight` is the queue inside the window.
      pending: "${{ steps.search_pending_indicators.output.hits.total.value | default: 0 }}"
      # Reviews this sweep tried to start.
      started: "${{ steps.resolve_dispatch_batch.output.indicators | default: consts.no_rows | size }}"
      in_flight: "${{ steps.collect_active_indicators.output.count }}"
      # Both reads can fail without stopping the sweep. These flags show a failed read.
      # Zero pending after a failed search does not mean an empty queue.
      search_failed: "${{ steps.search_pending_indicators.error != null }}"
      lookup_failed: "${{ steps.list_active_reviews.error != null }}"
