version: "1"
name: Alert Triage batch
description: >
  Triages one batch of alerts of a single detection rule for the Alert Triage sweep. Classifies
  every alert with the Security Alert Analysis workflow, writes each verdict as an alert tag and
  note, and groups the confident false positives into closure proposals: each joins the open
  proposal of its pattern or starts a new one with its own Investigation and review. The batch
  has no Investigation of its own. Started by the sweep with `workflow.executeAsync` and never
  waits for a human.
  The sweep claimed the alerts with `az:triage_pending` and recorded this execution as
  `az:triage_exec:<id>`; this run removes both when it has written the outcome, or marks the
  alerts `az:triage_failed` when it cannot classify them.
enabled: true
tags:
  - security
  - alertzero
  - alert-triage

settings:
  # A batch is at most 100 alerts: two model calls and the notes.
  timeout: "2h"
  # The parallelism of triage in a space: `max` batches analyse at once and the rest wait as
  # `queued`, holding no Task Manager slot, up to the in-flight ceiling of 40 that the sweep
  # enforces (`max` + `queue-size`). A full queue or an expired `queue-ttl` ends the run as
  # `skipped`; the sweep then finds its claim dead and plans the alerts again. The TTL is under the
  # default 24 h look-back so queued work does not outlive its alerts. The key is constant:
  # concurrency groups are per space. A test pins these numbers to the planner constants.
  concurrency:
    key: alert-triage-batch
    strategy: queue
    max: 4
    queue-size: 36
    queue-ttl: 2h

triggers:
  # Started by the sweep. Manual so it owns no schedule of its own, and so it can be run by hand.
  - type: manual
    inputs:
      required:
        - rule_id
        - rule_name
        - alert_ids
        - autonomy
        - confidence_floor
      properties:
        rule_id:
          type: string
          minLength: 1
          maxLength: 512
          description: Id of the detection rule every alert of the batch belongs to.
        rule_name:
          type: string
          maxLength: 1024
          description: Name of the detection rule, shown in the Investigation and the proposal.
        alert_ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 256
          description: Alerts to triage. The batch loads their documents itself.
        autonomy:
          type: string
          enum: [manual, supervised]
          description: >-
            The Worker's autonomy level. `supervised` approves the closure proposal automatically.
        confidence_floor:
          type: number
          minimum: 0
          maximum: 1
          description: Minimum confidence for a false positive to be proposed for closure.

consts:
  # Temporary: service accounts have no display name, so the chat would show the raw account
  # id. Remove once they carry one (elastic/security-team#20422).
  author_name: "Alert Triage worker"

steps:
  # ---------------------------------------------------------------------------
  # 1. Abort before classifying when Alert Analysis is off in this
  #    space. Enablement is checked at Worker turn-on; this is the runtime
  #    complement for the case where the operator later turns analysis off and
  #    leaves the Worker running. Empty verdicts are not a substitute — the
  #    sub-workflow also returns [] when no connector resolves for the model tier.
  #
  #    Same runtime_config endpoint the analysis workflow reads. Fail-closed: a
  #    failed fetch after retries fails the run rather than classifying with a
  #    setting nobody read.
  # ---------------------------------------------------------------------------
  - name: fetch_analysis_runtime_config
    type: kibana.request
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/security_solution/alert_analysis_workflow/runtime_config"
      headers:
        kbn-xsrf: string
        elastic-api-version: "1"
        Content-Type: application/json

  - name: require_analysis_enabled
    type: if
    condition: "${{ steps.fetch_analysis_runtime_config.output.workflowEnabled == false }}"
    steps:
      - name: release_claims_analysis_disabled
        type: kibana.SetAlertTags
        on-failure:
          continue: true
        with:
          ids: "${{ inputs.alert_ids }}"
          tags:
            tags_to_add:
              - "az:triage_failed"
            tags_to_remove:
              - "az:triage_pending"
              - "az:triage_exec:{{ execution.id }}"

      - name: abort_analysis_disabled
        type: workflow.fail
        with:
          message: >-
            Alert Triage requires Alert Analysis to be enabled in this space.
            Turn it on under Alert analysis settings, or turn this Worker off.

  # ---------------------------------------------------------------------------
  # 1b. Load the batch's alert documents. The sweep passes ids only, so the batch loads the
  #     documents Alert Analysis takes instead of the sweep pushing up to 100 documents through the
  #     engine. An alert deleted since planning is missing from the result; if none can be loaded the
  #     run marks them failed and stops.
  # ---------------------------------------------------------------------------
  - name: load_alerts
    type: alertzero.triage.loadAlerts
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
    with:
      alert_ids: "${{ inputs.alert_ids }}"

  - name: guard_alerts_loaded
    type: if
    condition: "${{ steps.load_alerts.output.alerts.size == 0 }}"
    steps:
      - name: release_claims_no_alerts
        type: kibana.SetAlertTags
        on-failure:
          continue: true
        with:
          ids: "${{ inputs.alert_ids }}"
          tags:
            tags_to_add:
              - "az:triage_failed"
            tags_to_remove:
              - "az:triage_pending"
              - "az:triage_exec:{{ execution.id }}"

      - name: abort_no_alerts
        type: workflow.fail
        with:
          message: >-
            None of the {{ inputs.alert_ids.size }} alerts of this batch could be loaded; they may
            have been deleted since the sweep planned it.

  # Failure Investigations (below) are counted for the grouping telemetry. Set before any can be created.
  - name: init_failure_conversations
    type: data.set
    with:
      failure_conversation_count: 0

  # ---------------------------------------------------------------------------
  # 4. Run the Security Alert Analysis sub-workflow.
  #
  #    autoCloseEnabled: false — the Worker owns the close decision (R11: every
  #    close is a Proposal, so the sub-workflow must not close inline).
  #
  #    calledByWorker: true — the sub-workflow classifies and tags but leaves the
  #    verdict note to this Worker (add_verdict_notes), so each alert gets one note.
  #
  #    connectorIdByFeature: alertzero_efficient — the Efficient tier, not Balanced. Each
  #    verdict drives a tag, a note, and potentially a HITL proposal, and the batch runs on
  #    every alert sweep. The batch reliability eval (kbn-evals-suite-alert-analysis-workflow,
  #    alert_analysis_batch.spec.ts) found Claude Haiku 4.5 on par with Claude Sonnet 5 on
  #    accuracy, verdict coverage and consistency at batches of up to 100 alerts, for less than
  #    half the cost. Operators pick the model for the tier in Stack Management → Model Settings.
  #
  #    autoCloseConfidenceScoreMinThreshold is passed through so the sub-workflow
  #    reports against the same floor this Worker applies in compute_fp_candidates.
  #
  #    No investigationConversationId: the batch has no Investigation while it classifies, so the
  #    sub-workflow posts no progress comments. A conversation is created only for a new proposal
  #    or a failure.
  # ---------------------------------------------------------------------------
  - name: classify_alerts
    type: workflow.execute
    on-failure:
      # Bounded: one more attempt, then the fallback marks the alerts failed (A8).
      retry:
        max-attempts: 2
        delay: 30s
      fallback:
        - name: create_classify_failed_investigation
          type: ai.conversation.create
          with:
            template_id: investigation
            title: "Alert Triage — {{ inputs.rule_name }}"
            access_control:
              access_mode: public
            metadata:
              status: open
              description: >-
                Triage of {{ inputs.alert_ids.size }} alert{% if inputs.alert_ids.size != 1 %}s{% endif %} from rule
                "{{ inputs.rule_name }}" ({{ inputs.rule_id }}) needs attention.
              workflow_execution_ids: ["{{ execution.id }}"]
        - name: post_comment_classify_failed
          type: ai.conversation.add_user_message
          on-failure:
            continue: true
          with:
            author_name: "{{ consts.author_name }}"
            conversation_id: "{{ steps.create_classify_failed_investigation.output.conversation_id }}"
            message: >-
              ⚠️ Classification step failed for {{ steps.load_alerts.output.alerts.size }} alert{% if steps.load_alerts.output.alerts.size != 1 %}s{% endif %}.
              The Alert Analysis workflow may be disabled, or `workflow.execute` threw.
              Alerts have NOT been tagged or closed.

        # The alerts were never classified: mark them failed so no later sweep retries them
        # forever, and release the claim in the same update.
        - name: release_claims_classify_failed
          type: kibana.SetAlertTags
          on-failure:
            continue: true
          with:
            ids: "${{ inputs.alert_ids }}"
            tags:
              tags_to_add:
                - "az:triage_failed"
              tags_to_remove:
                - "az:triage_pending"
                - "az:triage_exec:{{ execution.id }}"

        # Fallback handles the comment and the tags only. Without this fail the parent continues
        # into empty FP candidates and close_investigation_no_fp — a hollow "triage complete".
        - name: abort_classify_failed
          type: workflow.fail
          with:
            message: >-
              Alert Triage classification failed. The Alert Analysis workflow may be
              disabled in this deployment, or the sub-workflow threw. Alerts were not
              tagged or closed.
    with:
      workflow-id: system-security-alert-analysis
      run-as-mode: inherit
      inputs:
        authorName: "{{ consts.author_name }}"
        # A child run has no trigger event of its own, so the batch must be passed
        # explicitly or the sub-workflow analyses nothing and returns empty verdicts.
        alerts: "${{ steps.load_alerts.output.alerts }}"
        autoCloseEnabled: false
        autoCloseConfidenceScoreMinThreshold: "${{ inputs.confidence_floor }}"
        connectorIdByFeature: alertzero_efficient
        calledByWorker: true

  # ---------------------------------------------------------------------------
  # 5. Compute the FP candidate list: verdicts classified as false_positive
  #    at or above the configured confidence floor.
  # ---------------------------------------------------------------------------
  # The confidence floor is applied here rather than in the sub-workflow: this path passes
  # autoCloseEnabled: false, so the Worker owns the close decision (R11) and therefore owns
  # R6's threshold too. Built as a string first because the expression filters take a
  # pre-rendered predicate, matching `reject_exp` usage in alert_analysis_workflow.yaml.
  - name: build_fp_threshold_expr
    type: data.set
    with:
      fp_threshold_expr: "v.confidence_score >= {{ inputs.confidence_floor }}"
      fp_below_floor_expr: "v.confidence_score < {{ inputs.confidence_floor }}"

  - name: compute_fp_candidates
    type: data.set
    with:
      fp_candidate_ids: >-
        ${{ steps.classify_alerts.output.verdicts
            | where: 'classification', 'false_positive'
            | where_exp: 'v', variables.fp_threshold_expr
            | map: 'alert_id' }}

  # Counted in its own step so the filter above stays the single source of truth. The review
  # dispatch and the no-FP branch both gate on this value, so leaving it unset makes every run a
  # silent no-op: no review is started and the Investigation is never closed.
  - name: count_fp_candidates
    type: data.set
    with:
      fp_candidate_count: "${{ variables.fp_candidate_ids | size }}"

  # Guard: analysis is on (or this run would have aborted at step 1) but the
  # sub-workflow returned 0 verdicts for a non-empty batch — a missing Model
  # Management connector, or the sub-workflow skipped.
  # Counts are materialised first: `${{ alerts | size > 0 }}` is invalid Liquid
  # (the engine parses `size > 0` as a filter name), so a condition takes no filters.
  # `and`/`or` do work, but Liquid gives them no grouping or precedence, so the two
  # comparisons stay nested rather than combined.
  - name: compute_classification_guard_counts
    type: data.set
    with:
      alert_count: "${{ steps.load_alerts.output.alerts | size }}"
      verdict_count: "${{ steps.classify_alerts.output.verdicts | size }}"
      missing_alert_count: "${{ steps.classify_alerts.output.missing_alert_ids | size }}"

  - name: guard_classification_nonempty
    type: if
    condition: "${{ variables.alert_count > 0 }}"
    steps:
      - name: guard_classification_nonempty_inner
        type: if
        condition: "${{ variables.verdict_count == 0 }}"
        steps:
          - name: create_classification_empty_investigation
            type: ai.conversation.create
            with:
              template_id: investigation
              title: "Alert Triage — {{ inputs.rule_name }}"
              access_control:
                access_mode: public
              metadata:
                status: open
                description: >-
                  Triage of {{ inputs.alert_ids.size }} alert{% if inputs.alert_ids.size != 1 %}s{% endif %} from rule
                  "{{ inputs.rule_name }}" ({{ inputs.rule_id }}) needs attention.
                workflow_execution_ids: ["{{ execution.id }}"]
          - name: post_comment_classification_empty
            type: ai.conversation.add_user_message
            on-failure:
              continue: true
            with:
              author_name: "{{ consts.author_name }}"
              conversation_id: "{{ steps.create_classification_empty_investigation.output.conversation_id }}"
              message: >-
                ⚠️ Alert Analysis returned no verdicts for {{ steps.load_alerts.output.alerts.size }} alert{% if steps.load_alerts.output.alerts.size != 1 %}s{% endif %}.
                Analysis is on for this space (a disabled setting aborts earlier).
                Likely causes: the `alertzero_efficient` Model Management feature has no connector,
                or the sub-workflow skipped the batch.
                Alerts have NOT been tagged or closed.
          - name: count_classification_empty_conversation
            type: data.set
            with:
              failure_conversation_count: "${{ variables.failure_conversation_count | plus: 1 }}"
        else:
          # Partial miss: at least one verdict came back (the all-empty case is handled
          # above), but the sub-workflow's missing_alert_ids is nonempty — the model
          # dropped one or more alerts from its reply, or a batch failed after retries.
          # Those alerts get no az: tag, note, or FP-candidate consideration, so the
          # Investigation would otherwise look fully triaged with no record that some
          # alerts still need a verdict.
          - name: guard_missing_alert_ids
            type: if
            condition: "${{ variables.missing_alert_count > 0 }}"
            steps:
              - name: create_missing_alert_ids_investigation
                type: ai.conversation.create
                with:
                  template_id: investigation
                  title: "Alert Triage — {{ inputs.rule_name }}"
                  access_control:
                    access_mode: public
                  metadata:
                    status: open
                    description: >-
                      Triage of {{ inputs.alert_ids.size }} alert{% if inputs.alert_ids.size != 1 %}s{% endif %} from rule
                      "{{ inputs.rule_name }}" ({{ inputs.rule_id }}) needs attention.
                    workflow_execution_ids: ["{{ execution.id }}"]
              - name: post_comment_missing_alert_ids
                type: ai.conversation.add_user_message
                on-failure:
                  continue: true
                with:
                  author_name: "{{ consts.author_name }}"
                  conversation_id: "{{ steps.create_missing_alert_ids_investigation.output.conversation_id }}"
                  message: >-
                    ⚠️ Alert Analysis returned no verdict for {{ variables.missing_alert_count }} of
                    {{ variables.alert_count }} alert{% if variables.alert_count != 1 %}s{% endif %} in this batch (see the sub-workflow's
                    missing_alert_ids). {% if variables.missing_alert_count == 1 %}That alert was{% else %}Those alerts were{% endif %} NOT tagged, noted, or considered for
                    closure by this Worker; only the {{ variables.verdict_count }} matched
                    alert{% if variables.verdict_count != 1 %}s{% endif %} will be triaged below. Re-run the Worker or follow up manually on
                    the missing alert{% if variables.missing_alert_count != 1 %}s{% endif %}.

              - name: count_missing_alert_ids_conversation
                type: data.set
                with:
                  failure_conversation_count: "${{ variables.failure_conversation_count | plus: 1 }}"

  # Alerts that came back without a verdict (the model dropped them, or the whole batch returned
  # none) would otherwise stay claimed with no tag to say why, and be planned again by every
  # sweep. Mark them failed and release the claim; the verdict tags below release the rest.
  # Each branch holds one typed expression. A `{% if %}` around `${{ }}` renders to text, and the
  # foreach below rejects text.
  - name: compute_unverdicted_ids
    type: if
    condition: "${{ variables.verdict_count == 0 }}"
    steps:
      - name: unverdicted_ids_whole_batch
        type: data.set
        with:
          unverdicted_ids: "${{ inputs.alert_ids }}"
    else:
      - name: unverdicted_ids_missing_only
        type: data.set
        with:
          unverdicted_ids: "${{ steps.classify_alerts.output.missing_alert_ids }}"

  - name: release_unverdicted_claims
    type: foreach
    foreach: "${{ variables.unverdicted_ids | chunk: 500 | json }}"
    steps:
      - name: release_unverdicted_claims_call
        type: kibana.SetAlertTags
        on-failure:
          retry:
            max-attempts: 3
            delay: 5s
        with:
          ids: "${{ foreach.item }}"
          tags:
            tags_to_add:
              - "az:triage_failed"
            tags_to_remove:
              - "az:triage_pending"
              - "az:triage_exec:{{ execution.id }}"

  # Telemetry: how the batch was classified.
  - name: report_batch_classified
    type: alertzero.reportWorkerOutcome
    on-failure:
      continue: true
    with:
      event: alert_triage_batch_classified
      alerts_total: "${{ variables.alert_count | default: 0 }}"
      verdicts_true_positive: "${{ steps.classify_alerts.output.true_positive_count | default: 0 }}"
      verdicts_false_positive: "${{ steps.classify_alerts.output.false_positive_count | default: 0 }}"
      verdicts_inconclusive: "${{ steps.classify_alerts.output.inconclusive_count | default: 0 }}"
      alerts_without_verdict: "${{ variables.alert_count | default: 0 | minus: variables.verdict_count | at_least: 0 }}"
      fp_candidates: "${{ variables.fp_candidate_count | default: 0 }}"
      fp_below_floor: "${{ steps.classify_alerts.output.false_positive_count | default: 0 | minus: variables.fp_candidate_count | at_least: 0 }}"

  # ---------------------------------------------------------------------------
  # 7. Apply static AZ classification tags to every analysed alert (R5).
  #    Tags are always written — never gated on autonomy level or FP count.
  #    Replaces any stale AZ classification tag before adding the current one.
  # ---------------------------------------------------------------------------
  # Each verdict class is one call per chunk that adds its own tag and removes the other two.
  # kibana.SetAlertTags rejects a tag present in both lists ("Duplicate tags ... were found"),
  # so the tag being added is never in tags_to_remove. Removing and adding in one call also
  # means a failed call leaves an alert with its previous verdict tag, never with none.
  # An alert id sits in exactly one class: the Alert Analysis Worker path rejects duplicate
  # alert ids before batching and returns one verdict per id. Were an id in two classes, the
  # last class written would win.
  #
  # Written in bulk, not per alert: kibana.SetAlertTags takes a list of ids, so the batch costs
  # one call per verdict class (per chunk of 500) instead of one call
  # per alert. Every step of a loop is recorded in the execution, so a per-alert loop over a
  # thousand alerts is thousands of step records on the same event loop as the UI.
  # The ids are partitioned by classification here.
  #
  # Only a false positive at or above the confidence floor keeps `az:false_positive`: it is the one
  # the closure review proposes to close. A false positive below the floor is a guess nobody is
  # asked about, so it is tagged `az:inconclusive` like the review's other dead ends. Otherwise it
  # would stay open as `az:false_positive` and nothing would ever revisit it.
  - name: compute_below_floor_fp_ids
    type: data.set
    with:
      az_below_floor_fp_ids: >-
        ${{ steps.classify_alerts.output.verdicts
            | where: 'classification', 'false_positive'
            | where_exp: 'v', variables.fp_below_floor_expr
            | map: 'alert_id' }}

  - name: compute_az_tag_ids
    type: data.set
    with:
      az_true_positive_ids: >-
        ${{ steps.classify_alerts.output.verdicts
            | where: 'classification', 'true_positive'
            | map: 'alert_id' }}
      az_false_positive_ids: >-
        ${{ steps.classify_alerts.output.verdicts
            | where: 'classification', 'false_positive'
            | where_exp: 'v', variables.fp_threshold_expr
            | map: 'alert_id' }}
      az_inconclusive_ids: >-
        ${{ steps.classify_alerts.output.verdicts
            | where: 'classification', 'inconclusive'
            | map: 'alert_id'
            | concat: variables.az_below_floor_fp_ids }}

  # Each list is walked in chunks of 500 ids, as floor_alert_triage_review.yaml does for its
  # re-tag. One call carries the whole chunk, so a batch costs a call per chunk and class rather
  # than per alert, yet no call grows with the batch: the route turns `ids` into a `terms` query
  # (capped by index.max_terms_count) and emits one alert-tags-changed trigger event per call,
  # which is truncated beyond 10000 ids. A batch with no verdicts (missing connector, skipped
  # sub-workflow) chunks to an empty list, so each loop below runs zero times and `ids` is never
  # sent empty.
  - name: set_az_true_positive_tags
    type: foreach
    foreach: "${{ variables.az_true_positive_ids | chunk: 500 | json }}"
    steps:
      - name: set_az_true_positive_tags_call
        type: kibana.SetAlertTags
        on-failure:
          retry:
            max-attempts: 3
            delay: 5s
        with:
          ids: "${{ foreach.item }}"
          tags:
            tags_to_remove:
              - "az:false_positive"
              - "az:inconclusive"
              - "az:model_fp"
              - "az:triage_pending"
              - "az:triage_exec:{{ execution.id }}"
            tags_to_add:
              - "az:true_positive"

  - name: set_az_false_positive_tags
    type: foreach
    foreach: "${{ variables.az_false_positive_ids | chunk: 500 | json }}"
    steps:
      - name: set_az_false_positive_tags_call
        type: kibana.SetAlertTags
        on-failure:
          retry:
            max-attempts: 3
            delay: 5s
        with:
          ids: "${{ foreach.item }}"
          tags:
            tags_to_remove:
              - "az:true_positive"
              - "az:inconclusive"
              - "az:triage_pending"
              - "az:triage_exec:{{ execution.id }}"
            # `az:model_fp` records the model's judgement for Rule Tuning. It is not a verdict tag
            # and survives the re-tag to `az:inconclusive` when the proposal is not approved.
            tags_to_add:
              - "az:false_positive"
              - "az:model_fp"

  - name: set_az_inconclusive_tags
    type: foreach
    foreach: "${{ variables.az_inconclusive_ids | chunk: 500 | json }}"
    steps:
      - name: set_az_inconclusive_tags_call
        type: kibana.SetAlertTags
        on-failure:
          retry:
            max-attempts: 3
            delay: 5s
        with:
          ids: "${{ foreach.item }}"
          tags:
            tags_to_remove:
              - "az:true_positive"
              - "az:false_positive"
              - "az:model_fp"
              - "az:triage_pending"
              - "az:triage_exec:{{ execution.id }}"
            tags_to_add:
              - "az:inconclusive"

  # ---------------------------------------------------------------------------
  # 7b. Tag every classified alert with its pattern keys, whatever its verdict.
  #
  #     `az:triage_strict_key:<hash>` and `az:triage_wide_key:<hash>` record which pattern an alert
  #     belongs to. Grouping, the proposal summary and Decisions read them. They are not verdict
  #     tags, so the sweep ignores them. They are written in a step of their own, because each key
  #     pair is a different tag set and `kibana.SetAlertTags` sends one tag set for all its ids. The
  #     step makes one call per distinct key pair. The keys are data for tuning, so a failure after
  #     the retries does not fail the run.
  # ---------------------------------------------------------------------------
  - name: tag_pattern_keys
    type: alertzero.triage.tagPatternKeys
    if: "${{ variables.verdict_count > 0 }}"
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
      continue: true
    with:
      alert_ids: "${{ steps.classify_alerts.output.verdicts | map: 'alert_id' }}"
      fp_candidate_ids: "${{ variables.fp_candidate_ids }}"
      space_id: "{{ workflow.spaceId }}"

  # ---------------------------------------------------------------------------
  # 7b. Group the confident false positives into proposals.
  #
  #     The alerts of one pattern (the wide pattern key) join the open proposal of that
  #     pattern, or start one. Several patterns in a batch give several new proposals, and
  #     alerts that match nothing are pooled into one. Each new proposal gets its own
  #     Investigation, so the first decided review cannot close another proposal's. At
  #     supervised autonomy, or with the `alertzero.triageGrouping` flag off, the step plans one
  #     proposal for the batch, as before grouping existed.
  #
  #     Conversations and tags come before the notes, so each note can link to the
  #     Investigation its alert ended up in. The reviews start after the notes.
  # ---------------------------------------------------------------------------
  - name: init_grouping
    type: data.set
    with:
      no_items: []
      group_mints: []
      group_joins: []
      mint_conversation_ids: []
      failed_review_count: 0
      started_alert_count: 0

  # A failure here re-tags the candidates and fails the run (the fallback re-throws): no proposal
  # exists for them, and they must not stay `az:false_positive`.
  - name: group_fp_candidates_call
    type: alertzero.triage.groupFpCandidates
    if: "${{ variables.fp_candidate_count > 0 }}"
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
      fallback:
        - name: retag_grouping_failed
          type: foreach
          foreach: "${{ variables.fp_candidate_ids | chunk: 500 | json }}"
          steps:
            - name: retag_grouping_failed_call
              type: kibana.SetAlertTags
              on-failure:
                retry:
                  max-attempts: 3
                  delay: 5s
                continue: true
              with:
                ids: "${{ foreach.item }}"
                tags:
                  tags_to_remove:
                    - "az:false_positive"
                  tags_to_add:
                    - "az:inconclusive"
        - name: create_grouping_failed_investigation
          type: ai.conversation.create
          with:
            template_id: investigation
            title: "Alert Triage — {{ inputs.rule_name }}"
            access_control:
              access_mode: public
            metadata:
              status: open
              description: >-
                Triage of {{ inputs.alert_ids.size }} alert{% if inputs.alert_ids.size != 1 %}s{% endif %} from rule
                "{{ inputs.rule_name }}" ({{ inputs.rule_id }}) needs attention.
              workflow_execution_ids: ["{{ execution.id }}"]
        - name: post_comment_grouping_failed
          type: ai.conversation.add_user_message
          on-failure:
            continue: true
          with:
            author_name: "{{ consts.author_name }}"
            conversation_id: "{{ steps.create_grouping_failed_investigation.output.conversation_id }}"
            message: >-
              ⚠️ The false positives could not be grouped into proposals: {{ error.message }}.
              {{ variables.fp_candidate_count }} alert{% if variables.fp_candidate_count != 1 %}s{% endif %} re-tagged az:inconclusive, because no proposal exists for them.
    with:
      fp_candidate_ids: "${{ variables.fp_candidate_ids }}"
      autonomy: "{{ inputs.autonomy }}"
      space_id: "{{ workflow.spaceId }}"
      rule_name: "{{ inputs.rule_name }}"
      confidence_floor: "${{ inputs.confidence_floor }}"
      impacted_entities: "${{ steps.classify_alerts.output.impacted_entities }}"

  - name: resolve_grouping
    type: data.set
    with:
      group_mints: "${{ steps.group_fp_candidates_call.output.mints | default: variables.no_items }}"
      group_joins: "${{ steps.group_fp_candidates_call.output.joins | default: variables.no_items }}"

  - name: count_grouping
    type: data.set
    with:
      mint_count: "${{ variables.group_mints | size }}"

  # Telemetry: how well the keys group the batch, and what grouping did with it.
  - name: report_batch_grouped
    type: alertzero.reportWorkerOutcome
    if: "${{ variables.verdict_count > 0 and steps.tag_pattern_keys.error == blank }}"
    on-failure:
      continue: true
    with:
      event: alert_triage_batch_grouped
      alerts_with_strict_key: "${{ steps.tag_pattern_keys.output.alerts_with_strict_key }}"
      strict_keys: "${{ steps.tag_pattern_keys.output.strict_keys }}"
      strict_keys_single_alert: "${{ steps.tag_pattern_keys.output.strict_keys_single_alert }}"
      wide_keys: "${{ steps.tag_pattern_keys.output.wide_keys }}"
      wide_keys_single_alert: "${{ steps.tag_pattern_keys.output.wide_keys_single_alert }}"
      fp_candidates_on_fallback: "${{ steps.tag_pattern_keys.output.fp_candidates_on_fallback }}"
      grouping: "{{ steps.group_fp_candidates_call.output.grouping | default: 'no_candidates' }}"
      alerts_joined: "${{ steps.group_fp_candidates_call.output.alerts_joined | default: 0 }}"
      proposals_created: "${{ steps.group_fp_candidates_call.output.proposals_created | default: 0 }}"
      alerts_pooled: "${{ steps.group_fp_candidates_call.output.alerts_pooled | default: 0 }}"
      conversation_created: "${{ variables.mint_count > 0 or variables.failure_conversation_count > 0 }}"

  # One Investigation per new proposal, seeded from the `investigation` template, with its alerts and
  # impacted entities attached. The alerts get `az:proposal:<root id>`, so an analyst can find
  # the proposal from an alert. The tag is not a verdict tag, so the sweep ignores it.
  - name: process_mints
    type: foreach
    foreach: "${{ variables.group_mints | json }}"
    steps:
      - name: create_proposal_investigation
        type: ai.conversation.create
        with:
          template_id: investigation
          title: "Alert Triage — {{ inputs.rule_name }}"
          access_control:
            access_mode: public
          metadata:
            status: open
            description: >-
              Closure proposal for {{ steps.process_mints.item.alert_ids.size }} alert{% if steps.process_mints.item.alert_ids.size != 1 %}s{% endif %} from rule
              "{{ inputs.rule_name }}" ({{ inputs.rule_id }}).
            workflow_execution_ids: ["{{ execution.id }}"]

      - name: wrap_mint_conversation_id
        type: data.set
        with:
          new_conversation_ids: "${{ steps.create_proposal_investigation.output.conversation_id | split: ',' }}"

      - name: record_mint_conversation
        type: data.set
        with:
          mint_conversation_ids: "${{ variables.mint_conversation_ids | concat: variables.new_conversation_ids }}"

      - name: attach_mint_alerts
        type: foreach
        foreach: "${{ steps.process_mints.item.alert_ids | chunk: 20 | json }}"
        steps:
          - name: attach_mint_alert_chunk
            type: ai.attachment.add
            on-failure:
              retry:
                max-attempts: 3
                delay: 5s
              continue: true
            with:
              conversation_id: "{{ steps.create_proposal_investigation.output.conversation_id }}"
              type: security.alerts
              render_inline: true
              data:
                alertIds: "${{ foreach.item }}"
              description: "Alerts in this closure proposal"

      - name: attach_mint_impact_gate
        type: if
        condition: "${{ steps.process_mints.item.impacted_entities.size > 0 }}"
        steps:
          - name: attach_mint_impact
            type: investigations.attachImpact
            on-failure:
              continue: true
            with:
              conversationId: "{{ steps.create_proposal_investigation.output.conversation_id }}"
              entities: "${{ steps.process_mints.item.impacted_entities }}"

      - name: tag_mint_alerts
        type: foreach
        foreach: "${{ steps.process_mints.item.alert_ids | chunk: 500 | json }}"
        steps:
          - name: tag_mint_alert_chunk
            type: kibana.SetAlertTags
            on-failure:
              retry:
                max-attempts: 3
                delay: 5s
              continue: true
            with:
              ids: "${{ foreach.item }}"
              tags:
                tags_to_add:
                  - "az:proposal:{{ steps.process_mints.item.proposal_id }}"
                tags_to_remove: []

  # Alerts added to an open proposal go into its Investigation, which already has its review.
  - name: process_joins
    type: foreach
    foreach: "${{ variables.group_joins | json }}"
    steps:
      - name: attach_joined_alerts
        type: foreach
        foreach: "${{ steps.process_joins.item.alert_ids | chunk: 20 | json }}"
        steps:
          - name: attach_joined_alert_chunk
            type: ai.attachment.add
            on-failure:
              retry:
                max-attempts: 3
                delay: 5s
              continue: true
            with:
              conversation_id: "{{ steps.process_joins.item.conversation_id }}"
              type: security.alerts
              render_inline: true
              data:
                alertIds: "${{ foreach.item }}"
              description: "Alerts added to this closure proposal"

      - name: attach_joined_impact_gate
        type: if
        condition: "${{ steps.process_joins.item.impacted_entities.size > 0 }}"
        steps:
          - name: attach_joined_impact
            type: investigations.attachImpact
            on-failure:
              continue: true
            with:
              conversationId: "{{ steps.process_joins.item.conversation_id }}"
              entities: "${{ steps.process_joins.item.impacted_entities }}"

      - name: tag_joined_alerts
        type: foreach
        foreach: "${{ steps.process_joins.item.alert_ids | chunk: 500 | json }}"
        steps:
          - name: tag_joined_alert_chunk
            type: kibana.SetAlertTags
            on-failure:
              retry:
                max-attempts: 3
                delay: 5s
              continue: true
            with:
              ids: "${{ foreach.item }}"
              tags:
                tags_to_add:
                  - "az:proposal:{{ steps.process_joins.item.owner_proposal_id }}"
                tags_to_remove: []

      - name: post_comment_joined_owner
        type: ai.conversation.add_user_message
        on-failure:
          continue: true
        with:
          author_name: "{{ consts.author_name }}"
          conversation_id: "{{ steps.process_joins.item.conversation_id }}"
          message: >-
            +{{ steps.process_joins.item.alert_ids.size }} alert{% if steps.process_joins.item.alert_ids.size != 1 %}s{% endif %} from rule "{{ inputs.rule_name }}" with the same pattern joined this proposal (revision {{ steps.process_joins.item.revision }}).
            [View the added alert{% if steps.process_joins.item.alert_ids.size != 1 %}s{% endif %}](/s/{{ workflow.spaceId }}/app/security/alerts{{ steps.process_joins.item.alerts_page_query }})

  # ---------------------------------------------------------------------------
  # 8. Write a verdict note to each alert referencing the Investigation (R4, R13).
  #    Always written — never gated on autonomy level. The only verdict note on the
  #    Worker path: the sub-workflow skips its own when calledByWorker is true.
  #
  #    The notes API takes one note per call and each call takes about a second (the write
  #    waits for the next index refresh), so a serial loop costs about a second per alert.
  #    Notes are written 20 at a time instead: each chunk is a `parallel` fan-out of 20
  #    branches at concurrency 20, which finishes within one tick because the fan-out does not
  #    exceed the concurrency. That is the schema ceiling for concurrency, and well under the
  #    fan-out ceiling of 100.
  #
  #    A parallel branch cannot carry `on-failure`, so a note that fails here is not retried in
  #    place. `settled` lets every note in the chunk run, the failed ones are collected, and
  #    they are retried serially afterwards with the same retry as before. A note that still
  #    fails fails the run, as it always did.
  # ---------------------------------------------------------------------------
  - name: init_failed_verdict_notes
    type: data.set
    with:
      failed_note_verdicts: []

  - name: add_verdict_notes
    type: foreach
    foreach: "${{ steps.classify_alerts.output.verdicts | chunk: 20 | json }}"
    steps:
      # Copied out of `foreach.item`: inside the parallel step below `foreach.item` is a single
      # verdict, not the chunk.
      - name: current_note_chunk
        type: data.set
        with:
          verdicts: "${{ foreach.item }}"

      - name: write_note_chunk
        type: parallel
        foreach: "${{ steps.current_note_chunk.output.verdicts }}"
        mode: settled
        concurrency:
          max: 20
        steps:
          - name: add_verdict_note
            type: kibana.request
            with:
              method: PATCH
              path: "/s/{{ workflow.spaceId }}/api/note"
              body:
                note:
                  eventId: "{{ foreach.item.alert_id }}"
                  timelineId: ''
                  note: |
                    {%- assign note_conversation = '' -%}
                    {%- assign note_alert = foreach.item.alert_id -%}
                    {%- for mint in variables.group_mints -%}{%- if mint.alert_ids contains note_alert -%}{%- assign note_conversation = variables.mint_conversation_ids[forloop.index0] -%}{%- endif -%}{%- endfor -%}
                    {%- assign note_join = variables.group_joins | where_exp: 'j', 'j.alert_ids contains note_alert' | first -%}
                    {%- if note_join -%}{%- assign note_conversation = note_join.conversation_id -%}{%- endif -%}
                    {% if note_conversation != '' %}[Alert Triage Investigation](/s/{{ workflow.spaceId }}/app/agent_builder/conversations/{{ note_conversation }}) · {% endif %}[Workflow execution]({{ execution.url }})

                    **Verdict:** {{ foreach.item.classification }}
                    **Confidence:** {{ foreach.item.confidence_score }}

                    {{ foreach.item.rationale }}
                    {% if foreach.item.contributing_factors.size > 0 %}
                    **Contributing factors**
                    {% for factor in foreach.item.contributing_factors %}
                    - {{ factor }}
                    {%- endfor %}
                    {% endif %}
              headers:
                kbn-xsrf: string
                Content-Type: application/json

      # A branch's `key` is the verdict it was given, so the verdicts of the notes that did not
      # complete can be read straight off the results. Anything but `completed` counts, so a
      # timed-out branch is retried as well. The cost is that each verdict is stored twice in the
      # branch state and in `results[].key`; attack_discovery_batched_generation.yaml avoids that
      # by fanning out over integer offsets. Here a branch needs the whole verdict to render its
      # note and the retry needs it back, and a branch cannot look it up by index without
      # reading shared variables other branches are writing, so the key stays the verdict.
      # A verdict is at most about 1.5 KB under the classify schema (512-character id, 500-character
      # rationale, three 100-character factors), so a 1000-alert batch (the input maximum) holds
      # at most about 3 MB of duplicated state, and a 100-alert batch about 0.3 MB. That is an
      # upper bound from the schema, not a measurement of a run.
      #
      # The failed verdicts are read from this step's own output, not from `variables`: the
      # variables are a merge of every `data.set` output in run order, and an empty list does
      # not reliably shadow the previous chunk's, which would retry a failed note twice.
      - name: collect_chunk_failed_notes
        type: data.set
        with:
          chunk_failed_verdicts: >-
            ${{ steps.write_note_chunk.output.results
                | where_exp: 'r', 'r.status != "completed"'
                | map: 'key' }}

      - name: record_failed_verdict_notes
        type: data.set
        with:
          failed_note_verdicts: "${{ variables.failed_note_verdicts | concat: steps.collect_chunk_failed_notes.output.chunk_failed_verdicts }}"

  # Empty on a clean run, so this loop does nothing. The note is the same one as above: keep the
  # two in step.
  - name: retry_failed_verdict_notes
    type: foreach
    foreach: "${{ variables.failed_note_verdicts | json }}"
    steps:
      - name: retry_verdict_note
        type: kibana.request
        on-failure:
          retry:
            max-attempts: 3
            delay: 5s
        with:
          method: PATCH
          path: "/s/{{ workflow.spaceId }}/api/note"
          body:
            note:
              eventId: "{{ foreach.item.alert_id }}"
              timelineId: ''
              note: |
                {%- assign note_conversation = '' -%}
                {%- assign note_alert = foreach.item.alert_id -%}
                {%- for mint in variables.group_mints -%}{%- if mint.alert_ids contains note_alert -%}{%- assign note_conversation = variables.mint_conversation_ids[forloop.index0] -%}{%- endif -%}{%- endfor -%}
                {%- assign note_join = variables.group_joins | where_exp: 'j', 'j.alert_ids contains note_alert' | first -%}
                {%- if note_join -%}{%- assign note_conversation = note_join.conversation_id -%}{%- endif -%}
                {% if note_conversation != '' %}[Alert Triage Investigation](/s/{{ workflow.spaceId }}/app/agent_builder/conversations/{{ note_conversation }}) · {% endif %}[Workflow execution]({{ execution.url }})

                **Verdict:** {{ foreach.item.classification }}
                **Confidence:** {{ foreach.item.confidence_score }}

                {{ foreach.item.rationale }}
                {% if foreach.item.contributing_factors.size > 0 %}
                **Contributing factors**
                {% for factor in foreach.item.contributing_factors %}
                - {{ factor }}
                {%- endfor %}
                {% endif %}
          headers:
            kbn-xsrf: string
            Content-Type: application/json

  # ---------------------------------------------------------------------------
  # 9. Hand each new closure proposal to the review workflow.
  #
  #    The proposal waits for an analyst for up to 72 h at Manual autonomy, so the proposal lives
  #    in `system-security-floor-alert-triage-review`, started with `workflow.executeAsync`,
  #    one review per new proposal and in its own Investigation. This run finishes in minutes.
  #    The review raises the proposal, applies the outcome (re-tag on dismissal) and closes its
  #    Investigation. The review has no concurrency limit.
  #
  #    The dispatch status is read per review, because nothing else closes the Investigation of
  #    a proposal whose review never ran. A review that could not be dispatched must not stop the
  #    others: each is counted, and the run fails after every review was tried and the joins
  #    were written.
  #
  #    Autonomy (`manual` gates, `supervised` auto-approves) is passed to the review, which owns
  #    the mapping to `autoApprove`.
  # ---------------------------------------------------------------------------
  - name: start_reviews
    type: foreach
    foreach: "${{ variables.group_mints | json }}"
    steps:
      - name: start_fp_review
        type: workflow.executeAsync
        # Reached only when the review could not be started at all. A review that was started
        # and then skipped or failed is handled from its reported status below.
        # `continue: true` keeps the loop going, and `failed_review_count` fails the run at the end.
        on-failure:
          continue: true
          fallback:
            - name: retag_review_not_started
              type: foreach
              foreach: "${{ steps.start_reviews.item.alert_ids | chunk: 500 | json }}"
              steps:
                - name: retag_review_not_started_call
                  type: kibana.SetAlertTags
                  on-failure:
                    retry:
                      max-attempts: 3
                      delay: 5s
                    continue: true
                  with:
                    ids: "${{ foreach.item }}"
                    tags:
                      tags_to_remove:
                        - "az:false_positive"
                      tags_to_add:
                        - "az:inconclusive"
            - name: post_comment_review_not_started
              type: ai.conversation.add_user_message
              on-failure:
                continue: true
              with:
                author_name: "{{ consts.author_name }}"
                conversation_id: "{{ variables.mint_conversation_ids[steps.start_reviews.index] }}"
                message: >-
                  ⚠️ The closure review could not be started: {{ error.message }}.
                  {{ steps.start_reviews.item.alert_ids.size }} alert{% if steps.start_reviews.item.alert_ids.size != 1 %}s{% endif %} re-tagged az:inconclusive, because no proposal exists for them.
        with:
          workflow-id: system-security-floor-alert-triage-review
          run-as-mode: inherit
          inputs:
            conversation_id: "{{ variables.mint_conversation_ids[steps.start_reviews.index] }}"
            rule_id: "{{ inputs.rule_id }}"
            rule_name: "{{ inputs.rule_name }}"
            fp_candidate_ids: "${{ steps.start_reviews.item.alert_ids }}"
            title: "{{ steps.start_reviews.item.title }}"
            comment: "{{ steps.start_reviews.item.comment }}"
            proposal_id: "{{ steps.start_reviews.item.proposal_id }}"
            confidence_floor: "${{ inputs.confidence_floor }}"
            autonomy: "{{ inputs.autonomy }}"

      # `workflow.executeAsync` reports the child's status as it was when the engine returned
      # the execution id, and the engine applies the concurrency policy and validates the inputs
      # before that, so `skipped` and `failed` are already final here. No separate read of the
      # execution is needed.
      #
      # One value per outcome so every branch below is a single comparison (if-conditions take
      # no filters, and `and`/`or` have no precedence).
      #   not_started → the dispatch itself failed, and its fallback already re-tagged
      #   failed      → the review never ran to a decision (skipped, rejected inputs, cancelled, timed out)
      #   started     → pending, running, parked or already finished
      - name: resolve_review_dispatch
        type: data.set
        with:
          review_dispatch: >-
            {% if steps.start_fp_review.error %}not_started{% elsif steps.start_fp_review.output.status == 'skipped' or steps.start_fp_review.output.status == 'failed' or steps.start_fp_review.output.status == 'cancelled' or steps.start_fp_review.output.status == 'timed_out' %}failed{% else %}started{% endif %}

      - name: handle_review_started
        type: if
        condition: "${{ variables.review_dispatch == 'started' }}"
        steps:
          - name: count_started_alerts
            type: data.set
            with:
              started_alert_count: "${{ variables.started_alert_count | plus: steps.start_reviews.item.alert_ids.size }}"

          - name: post_comment_review_started
            type: ai.conversation.add_user_message
            on-failure:
              continue: true
            with:
              author_name: "{{ consts.author_name }}"
              conversation_id: "{{ variables.mint_conversation_ids[steps.start_reviews.index] }}"
              message: >-
                Closure of {{ steps.start_reviews.item.alert_ids.size }} alert{% if steps.start_reviews.item.alert_ids.size != 1 %}s{% endif %} classified as false positive at or above the {{ inputs.confidence_floor }} confidence floor was handed to the closure review.
                Autonomy level: {{ inputs.autonomy }}.
                {% if inputs.autonomy == 'supervised' %}The closure is approved automatically at this autonomy level; reopen any alert you disagree with.{% else %}A human decision is required.{% endif %}
                The outcome is posted here and this Investigation is closed when it is decided.

      - name: handle_review_failed
        type: if
        condition: "${{ variables.review_dispatch == 'failed' }}"
        steps:
          - name: retag_review_failed
            type: foreach
            foreach: "${{ steps.start_reviews.item.alert_ids | chunk: 500 | json }}"
            steps:
              - name: retag_review_failed_call
                type: kibana.SetAlertTags
                on-failure:
                  retry:
                    max-attempts: 3
                    delay: 5s
                  continue: true
                with:
                  ids: "${{ foreach.item }}"
                  tags:
                    tags_to_remove:
                      - "az:false_positive"
                    tags_to_add:
                      - "az:inconclusive"

          - name: post_comment_review_failed
            type: ai.conversation.add_user_message
            on-failure:
              continue: true
            with:
              author_name: "{{ consts.author_name }}"
              conversation_id: "{{ variables.mint_conversation_ids[steps.start_reviews.index] }}"
              message: >-
                ⚠️ The closure review ended without a decision (status: {{ steps.start_fp_review.output.status }}).
                {% if inputs.autonomy == 'supervised' %}The {{ steps.start_reviews.item.alert_ids.size }} candidate alert{% if steps.start_reviews.item.alert_ids.size != 1 %}s{% endif %} {% if steps.start_reviews.item.alert_ids.size == 1 %}is{% else %}are{% endif %} re-tagged az:inconclusive (the model's false-positive judgement is kept as az:model_fp). At supervised autonomy the review approves automatically and can start closing before this status is read, so some may already be closed: check each alert's workflow_status rather than assuming {% if steps.start_reviews.item.alert_ids.size == 1 %}it is{% else %}they are{% endif %} still open.{% else %}{{ steps.start_reviews.item.alert_ids.size }} alert{% if steps.start_reviews.item.alert_ids.size != 1 %}s{% endif %} {% if steps.start_reviews.item.alert_ids.size == 1 %}remains{% else %}remain{% endif %} open and re-tagged az:inconclusive (the model's false-positive judgement is kept as az:model_fp), since nothing is closed without a human decision.{% endif %} This Investigation stays open for review.

      - name: count_failed_review
        type: data.set
        if: "${{ variables.review_dispatch != 'started' }}"
        with:
          failed_review_count: "${{ variables.failed_review_count | plus: 1 }}"

  # What this batch did, for the execution history. A batch that created no Investigation (all true
  # positives, inconclusive or below the floor) leaves no other record outside its alerts, and the
  # telemetry privacy rules do not apply here: it stays in the deployment.
  - name: log_batch_summary
    type: console
    with:
      message: |-
        Alert Triage batch for rule "{{ inputs.rule_name }}" ({{ inputs.rule_id }}): {{ variables.alert_count }} alert{% if variables.alert_count != 1 %}s{% endif %}.
        {%- if steps.classify_alerts.output.connector_id != '' %}
        Model: connector `{{ steps.classify_alerts.output.connector_id }}`{% if steps.classify_alerts.output.agent_id != '' %}, agent `{{ steps.classify_alerts.output.agent_id }}`{% endif %}.
        {%- endif %}
        Verdicts: {{ steps.classify_alerts.output.true_positive_count | default: 0 }} true positive, {{ variables.fp_candidate_count }} false positive at or above the floor, {{ steps.classify_alerts.output.false_positive_count | default: 0 | minus: variables.fp_candidate_count | at_least: 0 }} false positive below the floor, {{ steps.classify_alerts.output.inconclusive_count | default: 0 }} inconclusive, {{ variables.alert_count | minus: variables.verdict_count | at_least: 0 }} without a verdict.
        Grouping: {{ steps.group_fp_candidates_call.output.grouping | default: 'no_candidates' }}.
        {%- if variables.group_mints.size == 0 and variables.group_joins.size == 0 %}
        No proposal created and no proposal joined.
        {%- endif %}
        {%- for mint in variables.group_mints %}
        Created proposal {{ mint.proposal_id }} ({{ mint.kind }}) for {{ mint.alert_ids.size }} alert{% if mint.alert_ids.size != 1 %}s{% endif %}.
        {%- endfor %}
        {%- for join in variables.group_joins %}
        Joined proposal {{ join.owner_proposal_id }} (revision {{ join.revision }}) with {{ join.alert_ids.size }} alert{% if join.alert_ids.size != 1 %}s{% endif %}.
        {%- endfor %}

  # Fails the run when a review could not be dispatched, so it shows up in execution history, like
  # a dispatch that could not be started always did. After every proposal had its turn and before the
  # run report, as before: a failed run reports nothing.
  - name: abort_review_failed
    type: workflow.fail
    if: "${{ variables.failed_review_count > 0 }}"
    with:
      message: >-
        {{ variables.failed_review_count }} Alert Triage closure review{% if variables.failed_review_count != 1 %}s{% endif %} could not be started or ended
        before reaching a decision. The alerts were classified, tagged and noted.

  # Telemetry: the run's outcome, last so it sees whether the closure review started.
  - name: report_worker_run_completed
    type: alertzero.reportWorkerOutcome
    on-failure:
      continue: true
    with:
      event: worker_run_completed
      candidates_found: "${{ variables.alert_count | default: 0 }}"
      items_dispatched: "${{ variables.verdict_count | default: 0 }}"
      items_failed: "${{ variables.alert_count | default: 0 | minus: variables.verdict_count | at_least: 0 }}"
      items_in_flight: "{{ variables.started_alert_count | default: 0 | plus: steps.group_fp_candidates_call.output.alerts_joined | default: 0 }}"
      degraded_reason: |-
        {%- if variables.alert_count > 0 and variables.verdict_count == 0 -%}
        dependency_unavailable
        {%- elsif variables.verdict_count < variables.alert_count -%}
        missing_data
        {%- else -%}
        none
        {%- endif -%}
      run_outcome: |-
        {%- if variables.alert_count == 0 -%}
        empty_nothing_pending
        {%- elsif variables.verdict_count == 0 -%}
        failed_all_items
        {%- elsif variables.verdict_count < variables.alert_count -%}
        degraded_partial
        {%- else -%}
        produced
        {%- endif -%}
