version: "1"
name: Attack Discovery attach
description: >
  Attaches one Attack Discovery to an Investigation that already describes the
  same attack. Waits for the review to create that Investigation, then journals
  the match, the attachments, and any alert tagging. Does not create the
  Investigation, and does not run FP/TP analysis or the forensics gate. If that
  Investigation is still missing after the wait, retargets the fingerprint at
  this attack and starts a review of it, instead of leaving it unattached or
  writing a second fingerprint. Re-reads the Investigation before attaching.
  If it has since closed, expired, or failed, this run does not attach: it
  writes a fingerprint for this attack and starts a review.
enabled: true
tags:
  - security
  - attack-discovery
settings:
  timeout: "30m"
  # One attach of an attack at a time. A second dispatch of the same attack has
  # nothing to add; the in-flight one is already writing the attachments.
  concurrency:
    key: "attack-discovery-attach-{{ inputs.attack_discovery_id }}"
    strategy: drop
    max: 1
triggers:
  - type: manual
    inputs:
      properties:
        attack_discovery_id:
          type: string
          maxLength: 512
          description: Document id of the persisted Attack Discovery being attached.
        title:
          type: string
          maxLength: 1024
          description: Persisted, anonymized title. Quoted in the match journal. The review writes the Investigation title.
        alert_ids:
          type: array
          maxItems: 1000
          items:
            type: string
            maxLength: 256
          description: Document ids of the detection alerts the Attack Discovery correlated.
        summary_markdown:
          type: string
          maxLength: 8000
          description: Persisted, anonymized summary. The review writes the Investigation summary.
        investigation_id:
          type: string
          maxLength: 256
          description: >
            Investigation to attach to. This run waits for the review to create it
            and does not create it itself.
        tag_correlated_alerts:
          type: boolean
          description: >
            Does not choose the tag. The attach tags `az:ad_correlated` only when
            the re-read says the Investigation was handed off.
        tag_fp_chain_alerts:
          type: boolean
          description: >
            Does not tag or acknowledge. It only changes the journal wording for
            a closed false positive. The review writes `az:ad_fp_chain` at the
            decision.
        journal_alerts_retired:
          type: boolean
          description: >
            Does not choose the note. The retirement journal runs when the re-read
            says the Investigation was handed off.
        parent_run_id:
          type: string
          maxLength: 128
          description: Workflow execution id of the runner that launched this attach.
        fingerprint_pending:
          type: boolean
          description: >
            True when the matcher has not seen the Investigation yet. This run
            adds the continuation's alert ids to the fingerprint only after the
            Investigation appears and the re-read still says to attach. If it
            is still missing after the wait, the existing fingerprint is
            retargeted at this attack. A second fingerprint is not created.
        own_fingerprint_id:
          type: string
          maxLength: 128
          description: >
            Fingerprint id for the review this run starts when the re-read says
            the Investigation has closed, expired, or failed. Omitted on a
            direct call, which then starts that review without writing one.
        host_entity_ids:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 512
        user_entity_ids:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 512
        entity_pairs:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 1024
        tactics:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 64
        first_alert_at:
          type: string
          maxLength: 64
        last_alert_at:
          type: string
          maxLength: 64
        expires_at:
          type: string
          maxLength: 64
          description: >
            When this attack's fingerprint expires. Used by the retarget and by
            the fingerprint written when the re-read starts a review.
        autonomy:
          type: string
          enum:
            - manual
            - supervised
          description: >
            Worker autonomy, forwarded only when this attach gives up and starts
            a review. Omitted on a direct run, which leaves the review at its
            own default.
      required:
        - attack_discovery_id
        - title
        - investigation_id
      additionalProperties: false
consts:
  no_alert_ids: []
  alerts_per_attachment: 20
  ad_correlated_tag: az:ad_correlated
  # Same literal as `consts.ad_fp_chain_tag` in attack_discovery_review.yaml.
  # Generation excludes it. Alert Triage does not.
  ad_fp_chain_tag: az:ad_fp_chain
  impact_entity_cap: 50
steps:
  # The review creates the Investigation, after it has read the de-anonymized
  # title. Creating here would win that race and leave the anonymized title in
  # place, and a create against an Investigation that already exists is logged
  # as an error. Wait instead. A cross-run attach finds the Investigation on
  # the first read. A same-run attach, or one whose review has not created the
  # conversation yet, retries for 15 minutes. That is the same window the
  # matcher treats the fingerprint as in flight. Generation will not hand this
  # discovery to a later run, so the wait has to cover that window. Still
  # missing after that, the next step reviews this attack on its own. The
  # review journals the miss; this conversation is not there to write on.
  - name: wait_for_investigation
    type: ai.conversation.metadata.read
    with:
      conversation_id: "{{ inputs.investigation_id }}"
    on-failure:
      retry:
        max-attempts: 30
        delay: 30s
      continue: true

  # The Investigation id this attack would open if the wait fails. The same
  # slice the review uses, so the retargeted fingerprint is the one that review
  # reads back.
  - name: resolve_own_investigation_id
    type: data.set
    with:
      investigation_id: |-
        {%- assign attack = inputs.attack_discovery_id -%}
        {{ attack | slice: 0,8 }}-{{ attack | slice: 8,4 }}-8{{ attack | slice: 12,3 }}-8{{ attack | slice: 15,3 }}-{{ attack | slice: 18,12 }}

  # The fingerprint the matcher withheld this attack's alert ids from. Looked up
  # by the Investigation it still points at, which is the one the wait used.
  - name: find_pending_fingerprint
    type: elasticsearch.search
    if: "${{ inputs.fingerprint_pending == true }}"
    on-failure:
      continue: true
    with:
      index: ai-index-idx-security-attack-fingerprints
      size: 1
      _source:
        - attributes.alert_ids
      query:
        bool:
          filter:
            - term:
                type: security.attack_fingerprint
            - term:
                attributes.space_id: "{{ workflow.spaceId }}"
            - term:
                attributes.investigation_id: "{{ inputs.investigation_id }}"

  # The wait failed. Point the existing fingerprint at this attack, in one
  # write, so a later match waits for this review instead of opening another
  # Investigation. The write is a no-op once another attack has already claimed
  # it. Hosts, users, and tactics stay. Alert ids become this attack's only.
  # The same script is RETARGET_FINGERPRINT_SCRIPT in the matcher.
  - name: retarget_pending_fingerprint
    type: elasticsearch.update
    if: "${{ inputs.fingerprint_pending == true and steps.wait_for_investigation.error != blank and steps.find_pending_fingerprint.output.hits.hits[0]._id != blank and steps.resolve_own_investigation_id.output.investigation_id != blank }}"
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
      continue: true
    with:
      index: ai-index-idx-security-attack-fingerprints
      id: "{{ steps.find_pending_fingerprint.output.hits.hits[0]._id }}"
      retry_on_conflict: 3
      script:
        lang: painless
        source: >-
          if (ctx._source.attributes == null || ctx._source.attributes.investigation_id != params.expected.investigation_id) {
            ctx.op = 'noop';
          } else {
            ctx._source['@timestamp'] = params.next.written_at;
            ctx._source.attributes.investigation_id = params.next.investigation_id;
            ctx._source.attributes.attack_discovery_id = params.next.attack_discovery_id;
            ctx._source.attributes.alert_ids = params.alerts.values;
            ctx._source.attributes.analyzed_alert_ids = params.alerts.values;
            ctx._source.attributes.alert_count = params.alerts.values.size();
            if (params.next.expires_at != null && params.next.expires_at.length() > 0) {
              ctx._source.expires_at = params.next.expires_at;
            }
            if (params.next.last_alert_at != null && params.next.last_alert_at.length() > 0) {
              ctx._source.attributes.last_alert_at = params.next.last_alert_at;
            }
          }
        params:
          expected:
            investigation_id: "{{ inputs.investigation_id }}"
          next:
            written_at: "${{ now }}"
            investigation_id: "{{ steps.resolve_own_investigation_id.output.investigation_id }}"
            attack_discovery_id: "{{ inputs.attack_discovery_id }}"
            expires_at: "{{ inputs.expires_at }}"
            last_alert_at: "{{ inputs.last_alert_at }}"
          alerts:
            values: "${{ inputs.alert_ids | default: consts.no_alert_ids }}"

  # The id this attack was going to join is recorded as a related Investigation.
  # `investigation_missing` is what makes the review's note say the wait failed,
  # rather than that the earlier Investigation was a closed false positive.
  # Runs after the retarget, so the review reads the fingerprint that now
  # points at this attack.
  - name: review_when_investigation_missing
    type: workflow.executeAsync
    if: "${{ steps.wait_for_investigation.error != blank }}"
    with:
      workflow-id: system-security-attack-discovery-review
      run-as-mode: inherit
      inputs:
        attack_discovery_id: "{{ inputs.attack_discovery_id }}"
        title: "{{ inputs.title }}"
        alert_ids: "${{ inputs.alert_ids | default: consts.no_alert_ids }}"
        summary_markdown: "{{ inputs.summary_markdown }}"
        related_investigation_id: "{{ inputs.investigation_id }}"
        related_link_reason: investigation_missing
        sibling_alert_ids: "${{ consts.no_alert_ids }}"
        sibling_attack_discovery_ids: "${{ consts.no_alert_ids }}"
        autonomy: "${{ inputs.autonomy | default: 'manual' }}"
        parent_run_id: "{{ inputs.parent_run_id }}"

  # The wait can finish minutes after the matcher decided. Read again and apply
  # that row. A failed read falls back to the wait's metadata.
  - name: reread_investigation
    type: ai.conversation.metadata.read
    if: "${{ steps.wait_for_investigation.error == blank }}"
    on-failure:
      retry:
        max-attempts: 3
        delay: 2s
      continue: true
    with:
      conversation_id: "{{ inputs.investigation_id }}"

  - name: resolve_attach_row
    type: data.set
    if: "${{ steps.wait_for_investigation.error == blank }}"
    with:
      row: |-
        {%- assign read = steps.reread_investigation -%}
        {%- assign meta = read.output.metadata -%}
        {%- if read.error != blank -%}
          {%- assign meta = steps.wait_for_investigation.output.metadata -%}
        {%- endif -%}
        {%- assign status = meta.status | default: '' -%}
        {%- assign verdict = meta.verdict | default: '' -%}
        {%- if status == 'closed' or verdict contains 'NO CLASSIFICATION' or verdict contains 'expired with no decision' or verdict contains 'GATE FAILED' -%}
        review
        {%- elsif verdict contains 'Handed off' -%}
        handed_off
        {%- else -%}
        quiet
        {%- endif -%}
      reason: |-
        {%- assign read = steps.reread_investigation -%}
        {%- assign meta = read.output.metadata -%}
        {%- if read.error != blank -%}
          {%- assign meta = steps.wait_for_investigation.output.metadata -%}
        {%- endif -%}
        {%- assign status = meta.status | default: '' -%}
        {%- assign verdict = meta.verdict | default: '' -%}
        {%- assign close_reason = meta.close_reason | default: '' -%}
        {%- if status == 'closed' and close_reason == 'false_positive' -%}
        false_positive
        {%- elsif status == 'closed' -%}
        closed
        {%- elsif verdict contains 'expired with no decision' -%}
        proposal_expired
        {%- elsif verdict contains 'NO CLASSIFICATION' or verdict contains 'GATE FAILED' -%}
        analysis_failed
        {%- endif -%}

  # The Investigation finished while this attach was in flight. Do not write on
  # it. This attack's review has to have its own fingerprint, or the next tick
  # matches the finished one and opens another Investigation.
  - name: write_own_fingerprint
    type: elasticsearch.index
    if: "${{ steps.wait_for_investigation.error == blank and steps.resolve_attach_row.output.row == 'review' and inputs.own_fingerprint_id != blank }}"
    on-failure:
      continue: true
    with:
      index: ai-index-idx-security-attack-fingerprints
      id: "{{ inputs.own_fingerprint_id }}"
      op_type: create
      refresh: wait_for
      document:
        "@timestamp": "${{ now }}"
        id: "{{ inputs.own_fingerprint_id }}"
        type: security.attack_fingerprint
        title: "{{ inputs.title | truncate: 512, '' }}"
        tags:
          - consumer:attack-discovery
        expires_at: "{{ inputs.expires_at }}"
        permissions:
          kibana:
            privileges:
              - space: "{{ workflow.spaceId }}"
        attributes:
          space_id: "{{ workflow.spaceId }}"
          investigation_id: "{{ steps.resolve_own_investigation_id.output.investigation_id }}"
          attack_discovery_id: "{{ inputs.attack_discovery_id }}"
          alert_ids: "${{ inputs.alert_ids | default: consts.no_alert_ids }}"
          analyzed_alert_ids: "${{ inputs.alert_ids | default: consts.no_alert_ids }}"
          alert_count: "${{ inputs.alert_ids | default: consts.no_alert_ids | size }}"
          host_entity_ids: "${{ inputs.host_entity_ids | default: consts.no_alert_ids }}"
          user_entity_ids: "${{ inputs.user_entity_ids | default: consts.no_alert_ids }}"
          entity_pairs: "${{ inputs.entity_pairs | default: consts.no_alert_ids }}"
          mitre_attack_tactics: "${{ inputs.tactics | default: consts.no_alert_ids }}"
          first_alert_at: "{{ inputs.first_alert_at }}"
          last_alert_at: "{{ inputs.last_alert_at }}"
          status: open
          parent_run_id: "{{ inputs.parent_run_id }}"

  - name: review_when_investigation_changed
    type: workflow.executeAsync
    if: "${{ steps.wait_for_investigation.error == blank and steps.resolve_attach_row.output.row == 'review' }}"
    with:
      workflow-id: system-security-attack-discovery-review
      run-as-mode: inherit
      inputs:
        attack_discovery_id: "{{ inputs.attack_discovery_id }}"
        title: "{{ inputs.title }}"
        alert_ids: "${{ inputs.alert_ids | default: consts.no_alert_ids }}"
        summary_markdown: "{{ inputs.summary_markdown }}"
        related_investigation_id: "{{ inputs.investigation_id }}"
        related_link_reason: "{{ steps.resolve_attach_row.output.reason }}"
        sibling_alert_ids: "${{ consts.no_alert_ids }}"
        sibling_attack_discovery_ids: "${{ consts.no_alert_ids }}"
        autonomy: "${{ inputs.autonomy | default: 'manual' }}"
        parent_run_id: "{{ inputs.parent_run_id }}"

  # The Investigation appeared, and the re-read still says to attach. Add this
  # attack's alert ids now. They were kept off the fingerprint while the wait
  # was open. The list stops at 100, the same cap the matcher uses. Script
  # params have to be objects.
  - name: extend_pending_fingerprint
    type: elasticsearch.update
    if: "${{ inputs.fingerprint_pending == true and steps.wait_for_investigation.error == blank and steps.resolve_attach_row.output.row != 'review' and steps.find_pending_fingerprint.output.hits.hits[0]._id != blank }}"
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
      continue: true
    with:
      index: ai-index-idx-security-attack-fingerprints
      id: "{{ steps.find_pending_fingerprint.output.hits.hits[0]._id }}"
      retry_on_conflict: 3
      script:
        lang: painless
        source: >-
          if (ctx._source.attributes.alert_ids == null) {
            ctx._source.attributes.alert_ids = new ArrayList();
          }
          for (def id : params.alert_ids.values) {
            if (!ctx._source.attributes.alert_ids.contains(id) && ctx._source.attributes.alert_ids.size() < 100) {
              ctx._source.attributes.alert_ids.add(id);
            }
          }
          ctx._source.attributes.alert_count = ctx._source.attributes.alert_ids.size();
        params:
          alert_ids:
            values: "${{ inputs.alert_ids | default: consts.no_alert_ids }}"

  # The decision, before any attachment write. Says why this attack did not open
  # its own Investigation. It does not claim the attachments landed: those writes
  # are still ahead, and a later note reports them.
  - name: journal_attach_started
    type: workflow.execute
    if: "${{ steps.wait_for_investigation.error == blank and steps.resolve_attach_row.output.row != 'review' }}"
    with:
      workflow-id: system-alertzero-journal-note
      run-as-mode: inherit
      inputs:
        conversation_id: "{{ inputs.investigation_id }}"
        message: >-
          {%- assign alert_count = inputs.alert_ids | default: consts.no_alert_ids | size -%}
          Matched Attack Discovery {{ inputs.attack_discovery_id }}
          ("{{ inputs.title }}") to this Investigation.
          {% if inputs.tag_fp_chain_alerts == true %}{{ alert_count }} detection alert(s).
          FP/TP analysis was skipped because this Investigation is already closed as a false positive.
          {% else %}{{ alert_count }} correlated detection alert(s).
          FP/TP analysis was skipped because this attack matches one already under investigation.
          {% endif %}Parent run: {{ inputs.parent_run_id }}.
          This execution: {{ execution.id }}.
    on-failure:
      continue: true

  - name: attach_discovery
    type: ai.attachment.add
    if: "${{ steps.wait_for_investigation.error == blank and steps.resolve_attach_row.output.row != 'review' }}"
    with:
      conversation_id: "{{ inputs.investigation_id }}"
      id: "attack-discovery-{{ inputs.attack_discovery_id }}"
      type: security.attack_discovery
      origin: "{{ inputs.attack_discovery_id }}"
      description: An Attack Discovery attached to this Investigation
      render_inline: true
    on-failure:
      continue: true

  - name: attach_alerts
    type: foreach
    if: "${{ steps.wait_for_investigation.error == blank and steps.resolve_attach_row.output.row != 'review' }}"
    foreach: "{{ inputs.alert_ids | default: consts.no_alert_ids | chunk: consts.alerts_per_attachment }}"
    steps:
      - name: attach_alert_batch
        type: ai.attachment.add
        with:
          conversation_id: "{{ inputs.investigation_id }}"
          id: "correlated-alerts-{{ inputs.attack_discovery_id }}-{{ foreach.index }}"
          type: security.alerts
          data:
            alertIds: "${{ foreach.item }}"
          description: >-
            {%- if inputs.tag_fp_chain_alerts == true -%}Detection alerts from an Attack Discovery attached to a closed false positive{%- else -%}Detection alerts correlated by an attached Attack Discovery{%- endif %}
            (batch {{ foreach.index | plus: 1 }} of {{ foreach.total }})
        on-failure:
          continue: true

  # After the writes. "Attempted" on purpose: a retry 409s on an attachment that
  # is already there, and a failed add continues, so the note cannot claim either
  # one landed. The attachment list is what shows which batches are present.
  - name: journal_evidence_attached
    type: workflow.execute
    if: "${{ steps.wait_for_investigation.error == blank and steps.resolve_attach_row.output.row != 'review' }}"
    with:
      workflow-id: system-alertzero-journal-note
      run-as-mode: inherit
      inputs:
        conversation_id: "{{ inputs.investigation_id }}"
        message: >-
          {%- assign alert_count = inputs.alert_ids | default: consts.no_alert_ids | size -%}
          Attempted attachment of Attack Discovery {{ inputs.attack_discovery_id }}
          and {{ alert_count }}
          {% if inputs.tag_fp_chain_alerts == true %}detection alert(s) from the closed false positive{% else %}correlated detection alert(s){% endif %}.
          See the attachment list for what landed.
    on-failure:
      continue: true

  # A continuation no longer gets its own review, so the hosts and users its alerts
  # add have to be recorded here. Merged by id onto the impact already stored.
  - name: collect_impact_entities
    type: security.getAlertEntities
    if: "${{ steps.wait_for_investigation.error == blank and steps.resolve_attach_row.output.row != 'review' and inputs.alert_ids != blank }}"
    timeout: "60s"
    with:
      alert_ids: "${{ inputs.alert_ids }}"
      max_entities: "${{ consts.impact_entity_cap }}"
    on-failure:
      continue: true

  - name: attach_impact
    type: investigations.attachImpact
    if: "${{ steps.wait_for_investigation.error == blank and steps.resolve_attach_row.output.row != 'review' and steps.collect_impact_entities.output.entities != blank }}"
    with:
      conversationId: "{{ inputs.investigation_id }}"
      entities: "${{ steps.collect_impact_entities.output.entities }}"
    on-failure:
      continue: true

  # Counts only hosts and users: `collect_impact_entities` keeps the step's default entity types.
  - name: journal_impact_recorded
    type: workflow.execute
    if: "${{ steps.wait_for_investigation.error == blank and steps.resolve_attach_row.output.row != 'review' }}"
    with:
      workflow-id: system-alertzero-journal-note
      run-as-mode: inherit
      inputs:
        conversation_id: "{{ inputs.investigation_id }}"
        message: >-
          {%- assign impact_hosts = steps.collect_impact_entities.output.entities | where:
          'type', 'host' | size -%}{%- assign impact_users =
          steps.collect_impact_entities.output.entities | where: 'type', 'user' | size
          -%}{% if steps.attach_impact.output.entities != blank %}Recorded impact from
          Attack Discovery {{ inputs.attack_discovery_id }}: {{ impact_hosts }} host{% if
          impact_hosts != 1 %}s{% endif %}, {{ impact_users }} user{% if impact_users != 1
          %}s{% endif %}{% if steps.collect_impact_entities.output.truncated == true %}
          (only its most alerted were recorded){% endif %}, merged into this
          Investigation's impact.{% elsif
          steps.attach_impact.error != blank %}Could not record impact. See attach execution
          {{ execution.id }}.{% elsif steps.collect_impact_entities.error != blank %}Could not read
          the correlated alerts' hosts and users, so no impact was recorded. See attach execution
          {{ execution.id }}.{% elsif inputs.alert_ids == blank %}No impact recorded: the attach
          was given no correlated alerts.{% else %}No impact recorded: the correlated alert(s)
          name no host or user.{% endif %}
    on-failure:
      continue: true

  # `az:ad_fp_chain` wins when that flag is set. Anything else that tags uses
  # `az:ad_correlated`. An open review attaches with neither flag set.
  - name: resolve_alert_tag
    type: data.set
    with:
      tag: "{{ consts.ad_correlated_tag }}"

  - name: tag_correlated_alerts
    type: security.setAlertTags
    if: "${{ steps.wait_for_investigation.error == blank and steps.resolve_attach_row.output.row == 'handed_off' and inputs.alert_ids != blank }}"
    with:
      alert_ids: "${{ inputs.alert_ids }}"
      tags_to_add:
        - "{{ steps.resolve_alert_tag.output.tag }}"
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
      continue: true

  # Same alerts the tag step just marked, and only the ones still open.
  # A by-id status write has no status condition, so an alert
  # closed while this ran would be reopened. The query skips those.
  - name: acknowledge_correlated_alerts
    type: kibana.SetAlertsStatus
    if: "${{ steps.wait_for_investigation.error == blank and steps.resolve_attach_row.output.row == 'handed_off' and inputs.alert_ids != blank }}"
    timeout: "60s"
    with:
      status: acknowledged
      conflicts: proceed
      query:
        bool:
          filter:
            - ids:
                values: "${{ inputs.alert_ids }}"
            - term:
                kibana.alert.workflow_status: open
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
      continue: true

  # The tag and acknowledge calls can return success and change nothing. Read
  # the alerts back before the journal says what landed. Same gate as the note:
  # a declined close tags and does not get this read.
  - name: verify_alerts_retired
    type: elasticsearch.search
    if: "${{ steps.wait_for_investigation.error == blank and steps.resolve_attach_row.output.row == 'handed_off' and inputs.alert_ids != blank }}"
    with:
      index: .alerts-security.alerts-{{ workflow.spaceId }}
      size: 0
      track_total_hits: true
      query:
        ids:
          values: "${{ inputs.alert_ids }}"
      aggregations:
        tagged:
          filter:
            term:
              kibana.alert.workflow_tags: "{{ steps.resolve_alert_tag.output.tag }}"
        open:
          filter:
            term:
              kibana.alert.workflow_status: open
        acknowledged:
          filter:
            term:
              kibana.alert.workflow_status: acknowledged
        closed:
          filter:
            term:
              kibana.alert.workflow_status: closed
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
      continue: true

  - name: resolve_alerts_retired
    type: data.set
    if: "${{ steps.wait_for_investigation.error == blank and steps.resolve_attach_row.output.row == 'handed_off' and inputs.alert_ids != blank }}"
    with:
      read: "${{ steps.verify_alerts_retired.output.hits != null }}"
      requested: "${{ inputs.alert_ids | size }}"
      tagged: "${{ steps.verify_alerts_retired.output.aggregations.tagged.doc_count | default: 0 }}"
      open: "${{ steps.verify_alerts_retired.output.aggregations.open.doc_count | default: 0 }}"
      acknowledged: "${{ steps.verify_alerts_retired.output.aggregations.acknowledged.doc_count | default: 0 }}"
      closed: "${{ steps.verify_alerts_retired.output.aggregations.closed.doc_count | default: 0 }}"

  # A handed-off true positive or inconclusive, or a continuation of a closed
  # false positive. The worker sets `journal_alerts_retired` only when the
  # Investigation verdict records that handoff. A declined or other close still
  # tags above and does not get this note. A closed false positive does.
  # Counts come from the read-back, including zero. No error message: it would
  # be read back as user input.
  - name: journal_alerts_retired
    type: workflow.execute
    if: "${{ steps.wait_for_investigation.error == blank and steps.resolve_attach_row.output.row == 'handed_off' and inputs.alert_ids != blank }}"
    with:
      workflow-id: system-alertzero-journal-note
      run-as-mode: inherit
      inputs:
        conversation_id: "{{ inputs.investigation_id }}"
        message: >-
          {%- assign retired = steps.resolve_alerts_retired.output -%}
          {%- assign tag = steps.resolve_alert_tag.output.tag -%}
          {% if retired.read != true %}Could not read the
          {{ retired.requested }} detection alert(s) back, so whether they were
          tagged {{ tag }} and acknowledged is unknown. See attach execution
          {{ execution.id }}.{% else %}Tagged {{ retired.tagged }} of
          {{ retired.requested }} detection alert(s)
          {{ tag }}{% if retired.tagged < retired.requested %}; later Worker runs
          may correlate the other {{ retired.requested | minus: retired.tagged }}
          again{% else %}, so later Worker runs skip them{% endif %}. Acknowledged:
          {{ retired.acknowledged }}{% if retired.closed > 0 %}; already closed and
          left as they were: {{ retired.closed }}{% endif %}{% if retired.open > 0 %};
          still open, because acknowledging them did not land: {{ retired.open }}{% endif %}.{% if
          retired.tagged < retired.requested or retired.open > 0 %} See attach execution
          {{ execution.id }}.{% endif %}{% endif %}
    on-failure:
      continue: true
