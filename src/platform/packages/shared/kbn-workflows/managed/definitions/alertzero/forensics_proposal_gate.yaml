version: "1"
name: Forensics proposal gate
description: >
  Creates one containment Proposal for an Endpoint analysis run and waits for
  an analyst to approve or reject it. Once every Proposal on the Investigation
  has been decided, asks the analyst whether to close the Investigation by
  dispatching the close gate, which raises an always-gated "Close
  Investigation" Proposal. Never closes anything itself. Continues rather than
  failing if it can't confirm the Investigation's state afterward, since
  leaving the Investigation open for someone to check is safer than deciding
  it incorrectly.
enabled: true
tags:
  - security
  - forensics
settings:
  # This run parks in WAITING_FOR_CHILD for as long as the escalation gate holds the
  # analyst's decision, and the workflow timeout is wall-clock from `startedAt` rather
  # than active time, so that park counts against it. At the engine's 6h default the
  # gate would be cancelled under the analyst, leaving the Investigation open and the
  # proposal dangling.
  #
  # So this has to stay *above* the gate's own ceiling of `168h` — a 72h decision
  # window plus a second full 72h for a proposal re-parked just before its deadline by
  # a privilege denial or a failed action, plus margin. Equal is not enough: this
  # clock starts before the gate is launched, so matching ceilings have the parent
  # expire first and lose a decision the child had already reached (the same reasoning
  # create_proposal.yaml gives for being strictly longer than `52w`). Hence the same
  # 176h as every other human-gated AlertZero parent — attack_discovery_review,
  # coverage_review, rule_creation, rule_tuning_review, hunt_proposal_gate. The
  # requery/dispatch steps after the wrap are near-instant, so the margin is all
  # decision time. The close gate this dispatches parks on its own clock.
  #
  # Not to be confused with the `53w` on system-create-alertzero-proposal, the bridge
  # this child actually executes: that is a deliberate sentinel, not a decision window.
  timeout: '176h'
triggers:
  - type: manual
    inputs:
      properties:
        conversationId:
          type: string
          description: Conversation this Proposal belongs to (create_proposal.yaml's own required field).
        proposalId:
          type: string
          description: >
            The id to create the Proposal under, derived by the caller from what is proposed
            so two runs that race over one subject create one Proposal. Must be a UUID.
            Omit for a Proposal that is always new.
        title:
          type: string
          description: Short plain-text label naming what is proposed; absent falls back to the action's own name.
        comment:
          type: string
          description: Explains what is being proposed, rendered as markdown.
        actionWorkflowId:
          type: string
          description: Managed action workflow to execute once approved. Absent for a proposal the analyst carries out themselves.
        actionInput:
          type: object
          additionalProperties: true
          description: Input for the action workflow, passed through as its single actionInput object.
        confidence:
          type: string
          description: Confidence in the recommendation, snapshotted at creation.
        autoApprove:
          type: boolean
          description: Set by the caller when its autonomy policy already permits this action. Defaults to false so the gate is fail-closed.
        investigationConversationId:
          type: string
          description: Investigation conversation id this gate asks to close on settlement.
        expectedProposalCount:
          type: number
          description: >
            The creation barrier this gate checks (created >= this) before asking to close
            the Investigation. Counts every Proposal on the Investigation, so a caller adding
            to an Investigation that already holds Proposals must include those in the number.
        attackDiscoveryId:
          type: string
          minLength: 1
          maxLength: 512
          description: Attack Discovery alert the Investigation was opened for; passed to the close gate.
        closeReason:
          type: string
          enum:
            - false_positive
            - benign
            - resolved
            - duplicate
            - other
          description: Investigation close reason the analysis decided on; passed to the close gate.
        attackReason:
          type: string
          enum:
            - false_positive
            - true_positive
            - benign_positive
            - duplicate
            - other
          description: Reason for the attack and its alerts on an approved close; passed to the close gate.
        assessment:
          type: string
          maxLength: 500
          description: Short assessment from the analysis, quoted on the close card.
        attackAlertCount:
          type: integer
          minimum: 0
          description: How many detection alerts the attack lists; passed to the close gate for its card.
      required:
        - conversationId
        - comment
        - investigationConversationId
        - expectedProposalCount
        - attackDiscoveryId
        - closeReason
        - attackReason
      additionalProperties: false
outputs:
  - name: proposalStatus
    type: string
  - name: decision
    type: string
  - name: expired
    type: boolean
consts:
  # Temporary: service accounts have no display name, so the chat would show the raw account
  # id. Remove once they carry one (elastic/security-team#20422).
  author_name: "Endpoint Analysis worker"

steps:
  # The gate child adds no second gate: this is a single sync wrap of
  # system-create-alertzero-proposal's own waitForApproval.
  # Goes through the bridge, not straight to system-create-proposal, so this
  # child's Proposals are stamped origin: alertzero like every other AlertZero
  # caller's. on-failure: continue rather than a fallback ending in
  # workflow.output, since this is this workflow's own terminal concern, not a
  # stage a Worker branch depends on continuing past -- but continuing here still
  # lets the requery/dispatch steps below run their own best-effort cleanup
  # rather than aborting the whole execution if the wrap itself never resolves
  # normally.
  #
  # Every forward uses `${{ }}` so an input the caller did not set reaches the
  # bridge as undefined rather than `''` (see create_proposal.yaml): Endpoint
  # analysis omits `impact` and `category` on purpose so the action's own apply,
  # and `autoApprove` is a boolean the bridge's trigger would reject as `''`.
  #
  # A lost race also lands here: if two runs reach the same host at once, both
  # can find the subject free, but only one create succeeds under `proposalId`.
  # The loser fails before any gate is parked and `continue` moves it on.
  # `journal_lost_race` records where the finding went. `expectedProposalCount`
  # still counts the lost Proposal, so the Investigation stays open until an
  # analyst closes it.
  - name: create_and_gate_proposal
    type: workflow.execute
    with:
      workflow-id: system-create-alertzero-proposal
      run-as-mode: inherit
      inputs:
        conversationId: "${{ inputs.conversationId }}"
        proposalId: "${{ inputs.proposalId }}"
        title: "${{ inputs.title }}"
        comment: "${{ inputs.comment }}"
        actionWorkflowId: "${{ inputs.actionWorkflowId }}"
        actionInput: "${{ inputs.actionInput }}"
        confidence: "${{ inputs.confidence }}"
        autoApprove: "${{ inputs.autoApprove }}"
    on-failure:
      continue: true

  # Get existing proposal when the previous create step failed under a
  # caller-derived id: did another Investigation get there first? The
  # Proposal under this id says which one raised it. Its document can
  # take a moment to be searchable after the conflict, so the read is
  # retried. A read that still fails is not an error - the loser just gets the generic note below.
  - name: fetch_existing_proposal
    type: kibana.request
    if: >-
      ${{ steps.create_and_gate_proposal.error.message != nil
        and steps.create_and_gate_proposal.error.message != empty
        and inputs.proposalId != nil
        and inputs.proposalId != empty }}
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals/{{ inputs.proposalId }}"
      headers:
        elastic-api-version: "1"
    on-failure:
      retry:
        max-attempts: 3
        delay: 1s
      continue: true

  # A lost race is a Proposal under this id owned by a different conversation.
  # Any other failure is left to `journal_wrap_failed`.
  - name: resolve_lost_race
    type: data.set
    with:
      lost_race: >-
        ${{ steps.fetch_existing_proposal.output.conversationId != nil
          and steps.fetch_existing_proposal.output.conversationId != empty
          and steps.fetch_existing_proposal.output.conversationId != inputs.conversationId }}
      lost_race_note: >-
        A containment proposal for "{{ inputs.title | default: 'the proposed action' }}" was raised by
        [another Investigation]({% if workflow.spaceId != 'default' %}/s/{{ workflow.spaceId }}{% endif %}/app/alertzero?selectedConversationId={{ steps.fetch_existing_proposal.output.conversationId }})
        at the same moment as this one, so no second Proposal was created and this finding is covered by that one.
        This Investigation stays open until an analyst closes it.

  - name: journal_lost_race
    type: workflow.execute
    if: "${{ variables.lost_race == true }}"
    with:
      workflow-id: system-alertzero-journal-note
      run-as-mode: inherit
      inputs:
        author_name: "{{ consts.author_name }}"
        conversation_id: "{{ inputs.investigationConversationId }}"
        message: "{{ variables.lost_race_note }}"
    on-failure:
      continue: true

  # A wrap that errors before settling may mean this Proposal was never created, in
  # which case the settlement counts below can never reach `expectedProposalCount`
  # and the Investigation stays open with nothing saying why. Journal it so the
  # analyst can see that. Best-effort: a failed note must not stop the requery/dispatch
  # steps. No `error.message`, same as journal_analysis_problem in
  # forensics_run_endpoint_analysis.yaml: later agent rounds read the journal as
  # user input. A lost race already has its own note above.
  - name: journal_wrap_failed
    type: workflow.execute
    if: "${{ steps.create_and_gate_proposal.error != blank and variables.lost_race != true }}"
    with:
      workflow-id: system-alertzero-journal-note
      run-as-mode: inherit
      inputs:
        author_name: "{{ consts.author_name }}"
        conversation_id: "{{ inputs.investigationConversationId }}"
        message: >-
          The containment proposal{% if inputs.title != blank %} "{{ inputs.title }}"{% endif %}
          ran into an error before it settled. If it was never created, this
          investigation won't close automatically. See execution `{{ execution.id }}`
          ([details]({{ execution.url }})).
    on-failure:
      continue: true

  - name: resolve_gate_wrapper_output
    type: data.set
    with:
      proposal_status: "{{ steps.create_and_gate_proposal.output.status }}"
      proposal_decision: "{{ steps.create_and_gate_proposal.output.decision }}"
      proposal_expired: "${{ steps.create_and_gate_proposal.output.status == 'expired' }}"

  # Two calls, not a conditional retry: `!= filter chain -> comparison` in one
  # expression is illegal in this engine, so an "only requery again if the first
  # read looks stale" branch would need the same split this avoids entirely.
  # Bounded (exactly one retry, always run) rather than unbounded: a
  # just-created Proposal has to become visible, and
  # a second immediate read after the wrap has already returned is enough
  # margin for the common case. The later read is preferred and the first is its
  # fallback (see resolve_settlement_counts), so the pair can only ever see more
  # than a single call would -- never less.
  #
  # Three independently-scoped pairs rather than one unfiltered requery: `size`
  # on this route caps at 100 and only bounds the returned `proposals` array, so
  # counting pending/executing by filtering that array silently undercounts past
  # 100 Proposals on an Investigation. `total` is the server's own hit count for
  # whatever filter was sent -- accurate at any volume regardless of `size` -- so
  # each pair asks the question it actually needs answered (all Proposals / only
  # pending / only executing) and reads `total` rather than paging through
  # results this gate has no use for. `size: 1` on every pair: the only thing
  # any of them reads is `total`.
  #
  # Accepted residual gap (shared with hunt_proposal_gate.yaml): three independent reads
  # are three independent instants, not one atomic snapshot, so a Proposal that
  # transitions executing -> failed -> re-parked pending (`create_proposal.yaml`'s own
  # retry/clone path) exactly between the pending pair and the executing pair could read
  # as absent from both. The window needs a failure-and-reclone cycle to land inside a
  # few back-to-back, near-instant reads. The close gate dispatched below reads pending
  # once more before asking, and the close action's route refuses to close over a pending
  # Proposal it can see, so the worst case is a question asked a little early.
  # elastic/security-team#19855 (a per-status aggregate route) closes it for good.
  - name: requery_created
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals"
      headers:
        elastic-api-version: "1"
      query:
        conversationId: "{{ inputs.investigationConversationId }}"
        size: 1
    on-failure:
      continue: true

  - name: requery_created_retry
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals"
      headers:
        elastic-api-version: "1"
      query:
        conversationId: "{{ inputs.investigationConversationId }}"
        size: 1
    on-failure:
      continue: true

  - name: requery_pending
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals"
      headers:
        elastic-api-version: "1"
      query:
        conversationId: "{{ inputs.investigationConversationId }}"
        status: pending
        size: 1
    on-failure:
      continue: true

  - name: requery_pending_retry
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals"
      headers:
        elastic-api-version: "1"
      query:
        conversationId: "{{ inputs.investigationConversationId }}"
        status: pending
        size: 1
    on-failure:
      continue: true

  - name: requery_executing
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals"
      headers:
        elastic-api-version: "1"
      query:
        conversationId: "{{ inputs.investigationConversationId }}"
        status: executing
        size: 1
    on-failure:
      continue: true

  - name: requery_executing_retry
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals"
      headers:
        elastic-api-version: "1"
      query:
        conversationId: "{{ inputs.investigationConversationId }}"
        status: executing
        size: 1
    on-failure:
      continue: true

  # Reads the later requery and falls back to the first one, rather than reading
  # the retry alone: both calls swallow their own failure, so a transient failure
  # on the second read would otherwise discard a first read that had succeeded.
  # The retry exists to see *more* than the first read, so it must never be able
  # to see less.
  #
  # created_count's trailing `default: 0` is fail-safe on its own: a 0 created
  # count almost never clears `>= expectedProposalCount`, so a failed pair of
  # creation reads blocks settlement. pending_count/executing_count are the
  # opposite case -- those gate on being *zero*, so a failed pair collapsing to
  # literal `0` would read as "nothing pending/executing" and let `resolve_settled`
  # ask to close the Investigation while a real pending or executing Proposal sits
  # unobserved because this specific read failed, not because it doesn't exist.
  # `default: 1` keeps them fail-closed: a failed pair can never look like "none
  # outstanding," only like "at least one," which is always safe to NOT-ask on.
  - name: resolve_settlement_counts
    type: data.set
    with:
      created_count: "${{ steps.requery_created_retry.output.total | default: steps.requery_created.output.total | default: 0 }}"
      pending_count: "${{ steps.requery_pending_retry.output.total | default: steps.requery_pending.output.total | default: 1 }}"
      executing_count: "${{ steps.requery_executing_retry.output.total | default: steps.requery_executing.output.total | default: 1 }}"

  # Three-term `and` chain with no `or` mixed in, which associates left-to-right
  # and so avoids the mixed and/or precedence hazard create_proposal.yaml warns
  # about. This is the full settlement predicate: enough Proposals created, none
  # still pending, none still executing. It gates the dispatch below, not a close.
  - name: resolve_settled
    type: data.set
    with:
      settled: "${{ variables.created_count >= inputs.expectedProposalCount and variables.pending_count == 0 and variables.executing_count == 0 }}"

  # Asks rather than closes. The close itself is the always-gated action's, run
  # as the approver, and the close gate reports it (`worker_investigation_closed`),
  # since it is the last workflow in the Worker's own chain that sees the decision.
  #
  # `executeAsync`, so this run does not park a second time on that decision.
  # Of several gates on one Investigation, only the last to settle sees nothing
  # pending and dispatches; two that settle together both dispatch, and the close
  # gate's dedup lets one of them create the Proposal. A gate that settles after a
  # dismissed close question dispatches again, and the dedup mints the next
  # generation, which is how a "keep open" is asked again only once something new
  # has been decided. Continue on failure: the Investigation stays open with its
  # state visible, and recovery is manual.
  - name: dispatch_close_gate
    type: workflow.executeAsync
    if: "${{ variables.settled == true }}"
    with:
      workflow-id: system-security-forensics-close-investigation-gate
      run-as-mode: inherit
      inputs:
        investigationConversationId: "{{ inputs.investigationConversationId }}"
        attackDiscoveryId: "{{ inputs.attackDiscoveryId }}"
        closeReason: "{{ inputs.closeReason }}"
        attackReason: "{{ inputs.attackReason }}"
        assessment: "${{ inputs.assessment }}"
        attackAlertCount: "${{ inputs.attackAlertCount | default: 0 }}"
    on-failure:
      continue: true

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      proposalStatus: "{{ variables.proposal_status }}"
      decision: "{{ variables.proposal_decision }}"
      expired: "${{ variables.proposal_expired }}"
