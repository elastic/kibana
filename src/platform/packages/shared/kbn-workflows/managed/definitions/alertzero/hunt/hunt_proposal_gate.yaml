version: "1"
name: Hunt Watch - proposal gate
description: >
  Creates one Proposal and waits for an analyst to approve or reject it. Once
  every Proposal on the Investigation has been decided, closes the
  Investigation. Continues rather than failing if it can't confirm the
  Investigation's state afterward, since leaving the Investigation open for
  someone to check is safer than closing it incorrectly. Ends failed, after a
  journal note on the Investigation, when no Proposal could be created (not a
  lost race, and not a failure after the Proposal exists).
enabled: true
tags:
  - security
  - continuous-threat-hunt
settings:
  # This run parks in WAITING_FOR_CHILD for as long as the escalation gate holds the
  # analyst's decision, and the workflow timeout is wall-clock from `startedAt` rather
  # than active time, so that park counts against it. At the engine's 6h default the
  # gate would be cancelled under the analyst, leaving the Investigation open and the
  # proposal dangling.
  #
  # So this has to stay *above* the gate's own ceiling of `168h` — a 72h decision
  # window plus a second full 72h for a proposal re-parked just before its deadline by
  # a privilege denial or a failed action, plus margin. Equal is not enough: this
  # clock starts before the gate is launched, so matching ceilings have the parent
  # expire first and lose a decision the child had already reached (the same reasoning
  # create_proposal.yaml gives for being strictly longer than `52w`). Hence the same
  # 176h as every other human-gated AlertZero parent — attack_discovery_review,
  # coverage_review, rule_creation, rule_tuning_review. The two requery/close steps
  # after the wrap are near-instant, so the margin is all decision time.
  #
  # Not to be confused with the `53w` on system-create-alertzero-proposal, the bridge
  # this child actually executes: that is a deliberate sentinel, not a decision window.
  timeout: '176h'
triggers:
  - type: manual
    inputs:
      properties:
        conversationId:
          type: string
          description: Conversation this Proposal belongs to (create_proposal.yaml's own required field).
        proposalId:
          type: string
          description: >-
            The id the Proposal is created under, derived by packaging from what is proposed so a
            second run proposing the same thing meets this one. The service refuses an id that
            already exists, which is how two racing runs create one Proposal.
        title:
          type: string
          description: Short plain-text label naming what is proposed; absent falls back to the action's own name.
        comment:
          type: string
          description: Explains what is being proposed, rendered as markdown.
        actionWorkflowId:
          type: string
          description: Managed action workflow to execute once approved. Absent for a proposal the analyst carries out themselves.
        actionInput:
          type: object
          additionalProperties: true
          description: Input for the action workflow, passed through as its single actionInput object.
        impact:
          type: string
          description: Impact snapshotted at creation.
        confidence:
          type: string
          description: Confidence in the recommendation, snapshotted at creation.
        category:
          type: string
          description: Grouping axis for the decision queue; always set by the packaging child's mint payload.
        investigationConversationId:
          type: string
          description: Investigation conversation id this gate closes on settlement.
        runId:
          type: string
          description: Run id the Worker's fan-out minted for this sweep.
        closureSummary:
          type: string
          description: Precomputed closure summary from the packaging child, written on close.
        expectedProposalCount:
          type: number
          description: The creation barrier this gate checks (created >= this) before closing the Investigation.
        reportId:
          type: string
          description: >-
            Threat report id this Investigation is bound to, named in the journal note when the
            Proposal could not be created so a manual run can target it. Optional: an installed
            packaging child sends it only once its own YAML has reconciled.
      required:
        - conversationId
        - proposalId
        - comment
        - category
        - investigationConversationId
        - runId
        - closureSummary
        - expectedProposalCount
      additionalProperties: false
outputs:
  - name: proposalStatus
    type: string
  - name: decision
    type: string
  - name: expired
    type: boolean
consts:
  # Temporary: service accounts have no display name, so the chat would show the raw account
  # id. Remove once they carry one (elastic/security-team#20422).
  author_name: "Continuous Threat Hunt worker"

steps:
  # The gate child adds no second gate: this is a single sync wrap of
  # system-create-alertzero-proposal's own waitForApproval.
  # Goes through the bridge, not straight to system-create-proposal, so this
  # child's Proposals are stamped origin: alertzero like every other AlertZero
  # caller's. on-failure: continue rather than a fallback ending in
  # workflow.output, since this is this workflow's own terminal concern, not a
  # stage a Worker branch depends on continuing past (that rule applies to the
  # Worker's parallel branch specifically) -- but continuing here still
  # lets the requery/close steps below run their own best-effort cleanup
  # rather than aborting the whole execution if the wrap itself never resolves
  # normally.
  #
  # This is also where a lost race lands, and it is not a rare case. Packaging looks up what
  # already exists before it dispatches this gate, and two reports that reach the same host in
  # one sweep are packaged side by side, so both can find the subject free. The window between
  # that look-up and the create is dispatch latency, plus the bridge's `reopen_investigation`,
  # which runs before it creates: far longer than the search lag that would be the only
  # window if packaging created the Proposal itself. The service creates the Proposal under
  # `proposalId` or refuses with a conflict, so the loser's create fails before any gate is
  # parked or any Proposal id is held, and `continue` carries it on to the requery below.
  #
  # A create that fails with no Proposal under the id (not a lost race, and not a later failure
  # of a Proposal that exists, which is left to read as it always has) is journaled and ends this
  # run failed. Packaging and the Worker cannot see an async child's failure, the hunt-once stamp
  # is already written so no sweep retries the report, so the journal note says what happened and
  # a failed execution shows up in the Workflows executions list. The Watches failure callout is
  # not relied on: it clears once any newer gate run in the space completes, and lost-race gates
  # do that within seconds. See `resolve_create_outcome`.
  #
  # The loser is not left silent: `journal_lost_race` below says where its finding went. What it
  # cannot do is close the Investigation. `expectedProposalCount` was fixed when this gate was
  # dispatched and counts the Proposal that was lost, and a sibling gate's `created_count` never
  # reaches it, so an Investigation with a lost finding stays open until an analyst closes it.
  - name: create_and_gate_proposal
    type: workflow.execute
    with:
      workflow-id: system-create-alertzero-proposal
      run-as-mode: inherit
      inputs:
        conversationId: "${{ inputs.conversationId }}"
        proposalId: "${{ inputs.proposalId }}"
        title: "${{ inputs.title }}"
        comment: "${{ inputs.comment }}"
        actionWorkflowId: "${{ inputs.actionWorkflowId }}"
        actionInput: "${{ inputs.actionInput }}"
        impact: "${{ inputs.impact }}"
        confidence: "${{ inputs.confidence }}"
        category: "${{ inputs.category }}"
    on-failure:
      continue: true

  # Only when the create above failed: was it because another Investigation got there first? The
  # Proposal under this id says which Investigation raised it. Its document can take a moment to be
  # searchable after the conflict, so the read is retried. A read that still fails is not an
  # error: the loser just gets no note, as it did before.
  - name: fetch_existing_proposal
    type: kibana.request
    if: "${{ steps.create_and_gate_proposal.error.message != nil and steps.create_and_gate_proposal.error.message != empty }}"
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals/{{ inputs.proposalId }}"
      headers:
        elastic-api-version: "1"
    on-failure:
      retry:
        max-attempts: 3
        delay: 1s
      continue: true

  # A lost race is a Proposal under this id that belongs to a different conversation. A failure
  # that is neither a lost race nor a conflict is handled by `resolve_create_outcome` below, so a
  # note is only written when it can say something true. A conflict whose lookup missed the
  # winner's not-yet-searchable document stays silent as before (`create_conflict`).
  - name: resolve_lost_race
    type: data.set
    with:
      lost_race: "${{ steps.fetch_existing_proposal.output.conversationId != nil and steps.fetch_existing_proposal.output.conversationId != empty and steps.fetch_existing_proposal.output.conversationId != inputs.conversationId }}"
      lost_race_note: |-
        A Proposal for "{{ inputs.title | default: 'the proposed action' }}" was raised by [another Investigation]({% if workflow.spaceId != 'default' %}/s/{{ workflow.spaceId }}{% endif %}/app/alertzero?selectedConversationId={{ steps.fetch_existing_proposal.output.conversationId }}) at the same moment as this one, so no second Proposal was created and this finding is covered by that one. This Investigation stays open until an analyst closes it.

  - name: journal_lost_race
    type: workflow.execute
    if: "${{ variables.lost_race == true }}"
    with:
      workflow-id: system-alertzero-journal-note
      run-as-mode: inherit
      inputs:
        author_name: "{{ consts.author_name }}"
        conversation_id: "{{ inputs.investigationConversationId }}"
        message: "{{ variables.lost_race_note }}"
    on-failure:
      continue: true

  # Two flags that read no sibling key (the engine renders every key of a data.set against the
  # context before the step runs, so a key cannot read another key of the same step).
  # `own_proposal_exists`: the Proposal under this id belongs to this conversation, so the create
  # worked and any bridge failure came after it (gate timeout, cancel, failed action).
  # `create_conflict`: the service refused the id as already taken, so a Proposal exists even when
  # the lookup above could not see it yet.
  - name: resolve_own_proposal
    type: data.set
    with:
      own_proposal_exists: "${{ steps.fetch_existing_proposal.output.conversationId == inputs.conversationId }}"
      create_conflict: "${{ steps.create_and_gate_proposal.error.message != nil and steps.create_and_gate_proposal.error.message contains 'already exists' }}"

  # A create failure is only reported when nothing says a Proposal exists under the id: not a lost
  # race, not this conversation's own Proposal, not a conflict. A five-term `and` chain with no
  # `or`, which avoids the mixed and/or precedence hazard create_proposal.yaml warns about. An
  # unset variable reads as not-true, so reporting is the safe default. The wording does not claim
  # absolute absence: the gate cannot tell a missing Proposal from a failed read.
  - name: resolve_create_outcome
    type: data.set
    with:
      create_failed: "${{ steps.create_and_gate_proposal.error.message != nil and steps.create_and_gate_proposal.error.message != empty and variables.lost_race != true and variables.own_proposal_exists != true and variables.create_conflict != true }}"
      # Error text is truncated: `system-alertzero-journal-note` rejects messages over 8000, and
      # a nested workflow failure can carry an unbounded message. Same 2000 cut coverage_review
      # uses on journaled errors. Title is capped so a long mint label cannot spend the rest.
      create_failure_note: |-
        The Proposal for "{{ inputs.title | default: 'the proposed action' | truncate: 200 }}" could not be created: {{ steps.create_and_gate_proposal.error.message | truncate: 2000 }}. No Proposal was found under its id when this run checked, so it is likely not in the Proposal queue. It will not be retried automatically, because this run already marked the report hunted. {% if inputs.reportId != nil and inputs.reportId != empty %}A manual run targeting report `{{ inputs.reportId }}` retries it.{% else %}A manual run targeting this Investigation's report retries it.{% endif %} This Investigation stays open until an analyst closes it.

  - name: journal_create_failure
    type: workflow.execute
    if: "${{ variables.create_failed == true }}"
    with:
      workflow-id: system-alertzero-journal-note
      run-as-mode: inherit
      inputs:
        author_name: "{{ consts.author_name }}"
        conversation_id: "{{ inputs.investigationConversationId }}"
        message: "{{ variables.create_failure_note }}"
    on-failure:
      continue: true

  - name: resolve_gate_wrapper_output
    type: data.set
    with:
      proposal_status: "{{ steps.create_and_gate_proposal.output.status }}"
      proposal_decision: "{{ steps.create_and_gate_proposal.output.decision }}"
      proposal_expired: "${{ steps.create_and_gate_proposal.output.status == 'expired' }}"

  # Two calls, not a conditional retry: `!= filter chain -> comparison` in one
  # expression is illegal in this engine, so an "only requery again if the first
  # read looks stale" branch would need the same split this avoids entirely.
  # Bounded (exactly one retry, always run) rather than unbounded: a
  # just-created Proposal has to become visible, and
  # a second immediate read after the wrap has already returned is enough
  # margin for the common case. The later read is preferred and the first is its
  # fallback (see resolve_settlement_counts), so the pair can only ever see more
  # than a single call would -- never less.
  #
  # Three independently-scoped pairs rather than one unfiltered requery: `size`
  # on this route caps at 100 and only bounds the returned `proposals` array, so
  # counting pending/executing by filtering that array (the previous approach)
  # silently undercounted past 100 Proposals on an Investigation. `total` is the
  # server's own hit count for whatever filter was sent -- accurate at any
  # volume regardless of `size` -- so each pair asks the question it actually
  # needs answered (all Proposals / only pending / only executing) and reads
  # `total` rather than paging through results this gate has no use for.
  # `size: 1` on every pair: the only thing any of them reads is `total`.
  #
  # Accepted residual gap: three independent reads are three independent instants, not one
  # atomic snapshot, so a Proposal that transitions executing -> failed -> re-parked pending
  # (`managed/definitions/proposals/create_proposal.yaml`'s own retry/clone path) exactly
  # between the pending pair and the executing pair could read as absent from both --
  # genuinely pending, but invisible to this settlement check. The single-snapshot requery
  # this replaced didn't have this gap, but paid for it with the `size: 100` undercount this
  # change exists to fix; this engine's status filter is single-valued (no "status in
  # [pending, executing]" query), so there is no way to read a status-agnostic "any Proposal
  # still open" total without either that undercount or a real bucketed aggregation. The
  # window itself is narrow -- it needs a failure-and-reclone cycle to land inside a few
  # back-to-back, near-instant reads -- and elastic/security-team#19855 (a per-status
  # aggregate route, proposed independently in review) closes it for good by reading every
  # status from one snapshot instead of several; not worth a more complex workaround here
  # against the existing single-status-filter API for a window this narrow.
  - name: requery_created
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals"
      headers:
        elastic-api-version: "1"
      query:
        conversationId: "{{ inputs.investigationConversationId }}"
        size: 1
    on-failure:
      continue: true

  - name: requery_created_retry
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals"
      headers:
        elastic-api-version: "1"
      query:
        conversationId: "{{ inputs.investigationConversationId }}"
        size: 1
    on-failure:
      continue: true

  - name: requery_pending
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals"
      headers:
        elastic-api-version: "1"
      query:
        conversationId: "{{ inputs.investigationConversationId }}"
        status: pending
        size: 1
    on-failure:
      continue: true

  - name: requery_pending_retry
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals"
      headers:
        elastic-api-version: "1"
      query:
        conversationId: "{{ inputs.investigationConversationId }}"
        status: pending
        size: 1
    on-failure:
      continue: true

  - name: requery_executing
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals"
      headers:
        elastic-api-version: "1"
      query:
        conversationId: "{{ inputs.investigationConversationId }}"
        status: executing
        size: 1
    on-failure:
      continue: true

  - name: requery_executing_retry
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals"
      headers:
        elastic-api-version: "1"
      query:
        conversationId: "{{ inputs.investigationConversationId }}"
        status: executing
        size: 1
    on-failure:
      continue: true

  # Reads the later requery and falls back to the first one, rather than reading
  # the retry alone: both calls swallow their own failure, so a transient failure
  # on the second read would otherwise discard a first read that had succeeded.
  # The retry exists to see *more* than the first read, so it must never be able
  # to see less. `| default:` against another step's output is this package's
  # existing idiom for that (forensics_run_endpoint_analysis.yaml's host_name
  # chains two step outputs and a literal the same way).
  #
  # created_count's trailing `default: 0` is fail-safe on its own: a 0 created
  # count almost never clears `>= expectedProposalCount`, so a failed pair of
  # creation reads blocks settlement same as before this requery was split into
  # three independently-scoped pairs. pending_count/executing_count are the
  # opposite case -- those gate on being *zero*, so a failed pair collapsing to
  # literal `0` would read as "nothing pending/executing" and let `resolve_settled`
  # close the Investigation while a real pending or executing Proposal sits
  # unobserved because this specific read failed, not because it doesn't exist.
  # `default: 1` keeps them fail-closed: a failed pair can never look like "none
  # outstanding," only like "at least one," which is always safe to NOT-close on.
  - name: resolve_settlement_counts
    type: data.set
    with:
      created_count: "${{ steps.requery_created_retry.output.total | default: steps.requery_created.output.total | default: 0 }}"
      pending_count: "${{ steps.requery_pending_retry.output.total | default: steps.requery_pending.output.total | default: 1 }}"
      executing_count: "${{ steps.requery_executing_retry.output.total | default: steps.requery_executing.output.total | default: 1 }}"

  # Three-term `and` chain with no `or` mixed in, which associates left-to-right
  # and so avoids the mixed and/or precedence hazard create_proposal.yaml warns
  # about (that warning is about mixing and/or, not chaining multiple ands).
  # This is the full settlement predicate: enough Proposals created, none still
  # pending, none still executing.
  - name: resolve_settled
    type: data.set
    with:
      settled: "${{ variables.created_count >= inputs.expectedProposalCount and variables.pending_count == 0 and variables.executing_count == 0 }}"

  # Idempotent close (a second close on an already-closed Investigation is a
  # no-op returning closed: true, per the client's own patchMetadata contract);
  # accepted unrecoverable case on failure: the Investigation stays open with
  # its pending state visible, and recovery is manual.
  - name: close_if_settled
    type: ai.conversation.metadata.patch
    if: "${{ variables.settled == true }}"
    with:
      conversation_id: "{{ inputs.investigationConversationId }}"
      updates:
        status: closed
        close_reason: resolved
        summary: "{{ inputs.closureSummary }}"
    on-failure:
      continue: true

  - name: report_investigation_closed_settled
    type: alertzero.reportWorkerOutcome
    if: "${{ steps.close_if_settled.error == blank and steps.close_if_settled.output.changed_fields contains 'status' }}"
    on-failure:
      continue: true
    with:
      event: worker_investigation_closed
      investigation_id: "{{ inputs.investigationConversationId }}"
      close_reason: resolved

  # Last, so the requeries and the idempotent close above still run as best-effort cleanup, and
  # `emit_result` is simply never reached on this path. Ending the run failed is what the
  # Workflows executions list shows. A lost race does not take this path: its finding is covered by
  # the other Proposal and it keeps its own note.
  - name: fail_on_create_failure
    type: workflow.fail
    if: "${{ variables.create_failed == true }}"
    with:
      message: "Proposal creation failed: {{ steps.create_and_gate_proposal.error.message | truncate: 2000 }}"

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      proposalStatus: "{{ variables.proposal_status }}"
      decision: "{{ variables.proposal_decision }}"
      expired: "${{ variables.proposal_expired }}"
