version: "1"
name: Endpoint analysis sweep
description: >
  Finds pending `security.analyze_endpoint` knowledge indicators and starts up
  to two Endpoint analysis workers. Does not write to indicators. The
  opt-in gate is the tagged worker: a disabled or missing worker in the
  indicator's space drops that start.
enabled: true
tags:
  - security
  - endpoint-analysis-coverage
settings:
  # One global sweep at a time. Overlapping ticks would start the same pending
  # indicators twice; the child's drop concurrency is the backstop for a space
  # that already has two analyses in flight.
  concurrency:
    key: endpoint-analysis-sweep
    strategy: drop
    max: 1
triggers:
  - type: scheduled
    with:
      every: "1m"
  - type: manual
    inputs:
      properties:
        ai_index_id:
          type: string
          maxLength: 256
          description: "AI index that holds the indicators. Default: security-investigations."
        batch_size:
          type: integer
          minimum: 1
          maximum: 2
          description: "How many new analysis runs to start per sweep. Default: 2."
        lookback_days:
          type: integer
          minimum: 1
          maximum: 90
          description: "How many days back the sweep looks for indicators, by creation time. Default: 7."
      additionalProperties: false
outputs:
  properties:
    pending:
      type: number
    started:
      type: number
    search_failed:
      type: boolean
consts:
  ai_index_id: security-investigations
  batch_size: 2
  lookback_days: 7
  no_rows: []

steps:
  - name: resolve_batch_size
    type: data.set
    with:
      size: "${{ inputs.batch_size | default: consts.batch_size }}"

  # Oldest first so an indicator about to leave the lookback window is reviewed
  # first. `space_id` is passed to the space-suffixed worker.
  - name: search_pending_indicators
    type: elasticsearch.search
    on-failure:
      continue: true
    with:
      index: "ai-index-idx-{{ inputs.ai_index_id | default: consts.ai_index_id }}"
      size: 2
      _source:
        - attributes.space_id
      sort:
        - "@timestamp":
            order: asc
            unmapped_type: date
      query:
        bool:
          filter:
            - term:
                type: security.analyze_endpoint
            - term:
                attributes.status: pending
            - range:
                "@timestamp":
                  gte: "now-{{ inputs.lookback_days | default: consts.lookback_days }}d"

  - name: resolve_dispatch_batch
    type: data.set
    with:
      indicators: "${{ steps.search_pending_indicators.output.hits.hits | default: consts.no_rows | slice: 0, steps.resolve_batch_size.output.size }}"

  # The worker is installed per space as
  # `system-security-forensics-endpoint-analysis-{space}`. `workflow.executeAsync`
  # looks up children in this global workflow's space, so the start goes through
  # the space-scoped run API. Continue on failure: a disabled worker is the
  # opt-in gate, and the indicator stays pending.
  - name: start_runs
    type: foreach
    foreach: "${{ steps.resolve_dispatch_batch.output.indicators | default: consts.no_rows }}"
    steps:
      - name: start_run
        type: kibana.request
        on-failure:
          continue: true
        if: "${{ foreach.item._source.attributes.space_id != blank }}"
        with:
          method: POST
          path: "/s/{{ foreach.item._source.attributes.space_id }}/api/workflows/workflow/system-security-forensics-endpoint-analysis-{{ foreach.item._source.attributes.space_id }}/run"
          headers:
            kbn-xsrf: "true"
            elastic-api-version: "2023-10-31"
            Content-Type: application/json
          body:
            inputs:
              ki_id: "{{ foreach.item._id }}"
              ai_index_id: "{{ inputs.ai_index_id | default: consts.ai_index_id }}"

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      pending: "${{ steps.search_pending_indicators.output.hits.total.value | default: 0 }}"
      started: "${{ steps.resolve_dispatch_batch.output.indicators | default: consts.no_rows | size }}"
      search_failed: "${{ steps.search_pending_indicators.error != null }}"
