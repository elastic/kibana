version: "1"
name: Rule Tuning
description: >
  Per-space Detection rule-tuning worker. Dispatches the global tuning sweep,
  which diagnoses noisy rules and holds one approval gate per reviewed rule.
enabled: false
tags:
  - watch
  - watch-detection
triggers:
  # This worker owns the per-space tuning cadence; the sweep it dispatches stays
  # manual-only so there is one scheduler authority and no cross-space collision.
  - type: scheduled
    with:
      every: "__WORKER_SCHEDULE_INTERVAL__"
  - type: manual
consts:
  worker_settings:
    settingsVersion: __WORKER_SETTINGS_VERSION__
    autonomy: "__WORKER_AUTONOMY_LEVEL__"
    scheduleInterval: "__WORKER_SCHEDULE_INTERVAL__"
    agentId: "__WORKER_AGENT_ID__"
    extras:
      analysisWindowDays: __WORKER_ANALYSIS_WINDOW_DAYS__
steps:
  # Async: the sweep joins on its review gates and can park for up to 72h.
  # A synchronous call would park this worker run with it and stack every later
  # scheduled run behind a pending gate. FP count / rate still live as consts on
  # the sweep; the analysis window is a per-space Worker setting forwarded here.
  - name: run_rule_tuning
    type: workflow.executeAsync
    with:
      workflow-id: system-security-rule-tuning-worker
      inputs:
        autonomy_level: "{{ consts.worker_settings.autonomy }}"
        # Absent const when no agent is picked; Liquid renders that to "" and every
        # hop below treats blank as "use the agent this step already resolved".
        agent_id: "{{ consts.worker_settings.agentId | default: '' }}"
        analysis_window_days: __WORKER_ANALYSIS_WINDOW_DAYS__
