version: "1"
name: Enable detection rule
description: >
  AlertZero action: turns on an existing detection rule. Executed by the
  investigation proposal gate once an analyst approves, so the change is
  attributed to the approver.
enabled: true
tags:
  # Generic tag every action workflow carries, so the catalog can be
  # discovered by tag rather than a hardcoded list.
  - action
  - alertzero
consts:
  # Self-describing catalog metadata, read back by the proposals service when a
  # proposal referencing this workflow is created or rendered. Metadata has to
  # live under `consts`: unknown top-level keys are stripped by the schema.
  actionMetadata:
    name: Enable detection rule
    description: Enables an installed detection rule that is currently turned off.
    category: configure
    impact: low
    reversible: true
    approvalPolicy: always-gate
triggers:
  - type: manual
    inputs:
      properties:
        actionInput:
          type: object
          description: >
            Identity of the rule to enable. Every action workflow takes a single
            `actionInput` object so the generic gate workflow never needs to know
            an action's parameter names.
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 512
              description: >-
                Saved-object id of the rule, so the change lands on the exact rule
                incarnation the proposal was built against.
          required:
            - id
          additionalProperties: false
      required:
        - actionInput
      additionalProperties: false
outputs:
  - name: enabled
    type: boolean
  - name: succeeded
    type: number
  - name: skipped
    type: number
  - name: failed
    type: number
steps:
  # The bulk action succeeds when the rule was enabled or was already enabled
  # (skipped), and fails outright when the id matches nothing.
  - name: enable_rule
    type: security.enableRule
    with:
      ids:
        - "{{ inputs.actionInput.id }}"

  # `workflow.execute` declares its output as unknown, so the parent falls back
  # to a heuristic read of the last step unless the child emits explicitly.
  - name: emit_result
    type: workflow.output
    status: completed
    with:
      enabled: "${{ steps.enable_rule.output.succeeded > 0 or steps.enable_rule.output.skipped > 0 }}"
      succeeded: "${{ steps.enable_rule.output.succeeded }}"
      skipped: "${{ steps.enable_rule.output.skipped }}"
      failed: "${{ steps.enable_rule.output.failed }}"
