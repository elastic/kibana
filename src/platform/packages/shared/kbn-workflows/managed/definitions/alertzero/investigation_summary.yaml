version: "1"
name: AlertZero investigation summary
description: >
  Reads an investigation or escalation timeline — journal user messages, comments,
  and newly added attachments, with the content of proposals — and writes metadata.summary. It
  waits until the conversation has been quiet for 10 seconds, so a burst of notes gives one
  summary. An investigation is summarized only once a proposal is attached; an escalation always
  is. An agent execution ending, a close, or an attachment edit does not start it. The summary is
  one direct model call on the efficient tier, so it does not append a chat round. On an
  investigation whose Endpoint Analysis has finished, it then re-renders the forensics summary card,
  with no model call, so the card shows the summary this run wrote and any new proposal awaiting
  a decision.
enabled: true
tags:
  - security
  - alertzero
settings:
  concurrency:
    key: "{{ workflow.id }}:{{ event.conversationId }}"
    strategy: cancel-in-progress
    max: 1
triggers:
  - type: ai.conversation.updated
    on:
      condition: >-
        (event.templateId: "investigation" or event.templateId: "escalation")
        and (
          event.eventTypes: "user_message"
          or event.eventTypes: "text_note"
          or event.eventTypes: "attachment_added"
        )
steps:
  - name: settle
    type: wait
    with:
      duration: 10s
  # A model or connector error must not keep the forensics card below from refreshing.
  - name: summarize
    type: alertzero.investigation.summarize
    on-failure:
      continue: true
    with:
      conversation_id: "{{ event.conversationId }}"
  # The forensics summary card's only renderer. It refreshes on a new proposal, including the
  # close question, on the summary above, and on the Endpoint Analysis notes that mark the
  # verdict and each decision, which would otherwise write nothing to the investigation.
  # Writes nothing until the Endpoint Analysis is processed, so the first card the chat shows
  # is a finished one, and nothing when the card is current.
  - name: forensics_summary
    type: alertzero.forensics.renderSummary
    if: "${{ event.templateId == 'investigation' }}"
    with:
      conversation_id: "{{ event.conversationId }}"
