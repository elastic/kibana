version: "1"
name: Hunt Watch - package report
description: >
  Reviews a completed hunt's results and decides which findings warrant a
  Proposal versus which should be dismissed. Resolves every respond action it
  can actually fill (for example isolating a host), then hands each Proposal
  off to its own approval workflow. Closes the Investigation when the run was
  clean. Reports a partial run rather than failing outright, and skips
  packaging entirely if the Investigation was never created.
enabled: true
# security + continuous-threat-hunt: the per-feature child-grouping pair every
# other Watch's children carry (detection-rule-creation/detection-rule-tuning/
# attack-discovery/detection-coverage on their own children), for Workflows-list
# findability. Never watch/watch-hunt, which stays Worker-only.
tags:
  - security
  - continuous-threat-hunt
settings:
  # Keyed per Investigation, not per report or globally: the Worker's own per-space
  # concurrency (hunt-continuous-threat-hunt, max 1) only serializes sweeps against each
  # other, and does nothing for a manual report_ids bypass or a direct invocation of this
  # workflow racing one. Kept for what it still buys, not for Proposal correctness: two runs on
  # one Investigation write its coverage knowledge items and read its settlement baseline one
  # after the other rather than interleaved, and a rerun's look-up does not overlap another's.
  # It does not close the race over a Proposal itself, and does not need to: dispatch_gate below
  # is workflow.executeAsync, so this workflow releases its slot before any gate has created its
  # Proposal, but each gate creates it under an id derived from what it proposes, and the
  # Proposals service refuses a second create of that id. `queue`, not `drop`, means a racing run
  # still packages (just after the first), rather than being silently lost. The key itself is a
  # template and does resolve (ConcurrencyManager renders it with Liquid against the workflow
  # context, same as every other concurrency key here): the point is only that
  # investigationConversationId arrives as an already-rendered, concrete conversation id by the
  # time this workflow runs, not as a nested template this engine would not re-render -- the same
  # precedent attack_discovery_review.yaml's attack_discovery_id sets.
  concurrency:
    key: "hunt-package-report-{{ inputs.investigationConversationId }}"
    strategy: queue
    max: 1
triggers:
  - type: manual
    inputs:
      properties:
        reportId:
          type: string
          description: Threat report id this Investigation is bound to.
        investigationConversationId:
          type: string
          description: Conversation id of the report's Investigation (already created by the Worker).
        runId:
          type: string
          description: Run id the Worker's fan-out minted for this sweep; packaging reads only attachments scoped to this run.
        # The hunt's own verdict, passed down because a run that confirmed no hit leaves no
        # SSE attachment behind: without these, packaging cannot tell that from a run whose
        # state is genuinely missing, and reports every no-hit run as incomplete.
        #
        # Deliberately a plain string rather than an enum of the three values the step
        # accepts. A trigger input is validated before any step runs, so an unexpected value
        # here would abort the child ahead of its own on-failure handling and leave the
        # sweep with no conclusion at all -- the same failure the `technology` enum caused on
        # `hunt.yaml`. The step's own schema rejects a bad value inside that envelope, where
        # `emit_package_failed` can still report it.
        huntStatus:
          type: string
          description: Hunt child's result status, one of `success`, `partial` or `failed`; the latter two mean absence of a hit is not a clean verdict.
        hasConfirmedHit:
          type: boolean
          description: Whether the hunt cleared the confirmed-hit bar.
        # Number of SSE attachments the hunt child prepared (hunt.yaml's `sse_count` output).
        # `attach_sse`'s foreach swallows a per-item attach failure with `continue`, so without
        # this count, packaging has no way to tell a partial attach (some items landed, some
        # did not) from a complete one -- it would read whatever current-run state exists and
        # proceed as if the run were complete. Compared against what read_current_run_state
        # actually finds; a shortfall reports run_incomplete instead of packaging.
        #
        # Not required: this workflow is a plain `yaml` definition, so its own content hash
        # propagates to every space on the next reconciliation regardless of version, but the
        # Worker calling it is a `yamlTemplate` definition whose hash does not cover the
        # imported YAML it renders -- an already-installed Worker only starts sending this
        # field once its own `version` bumps. Requiring it here would fail every such Worker's
        # packaging call in that gap; the step itself treats a missing value as skip-the-check,
        # not as an error.
        expectedSseCount:
          type: number
          description: Number of significant security event attachments the hunt child prepared for this run (its `sse_count` output). Omit to skip the shortfall check.
        # The coordinator result a clean run cannot leave on an attachment (an SSE exists only
        # for a confirmed hit). Not required, for the same reason as `expectedSseCount`: an
        # already-installed Worker does not send them until its own `version` bumps, and the
        # step treats absent values as "no dataset hint / no query", never as an error.
        reportIntentTargets:
          type: array
          items:
            type: string
          description: The coordinator's `report_intent_targets` (the hunt child's `report_intent_targets` output).
        behaviors:
          type: array
          items:
            type: object
            additionalProperties: true
          description: The coordinator's `tier2.behaviors` (the hunt child's `behaviors` output).
        tier2_invoked:
          type: boolean
          description: Whether the hunt ran Tier 2, including a Tier 2 that failed. Read only for product telemetry. The Worker sends false when unknown, such as a hunt that never reached the coordinator.
      required:
        - reportId
        - investigationConversationId
        - runId
        - huntStatus
        - hasConfirmedHit
      additionalProperties: false
outputs:
  - name: status
    type: string
  - name: stage
    type: string
  - name: reason
    type: string
  # Plain-prose account of what packaging did (proposals minted and for what,
  # benign dismissal, coverage knowledge written), quoted verbatim by the
  # Worker's run conclusion message.
  - name: summary
    type: string
consts:
  # Temporary: service accounts have no display name, so the chat would show the raw account
  # id. Remove once they carry one (elastic/security-team#20422).
  author_name: "Continuous Threat Hunt worker"

steps:
  # No Investigation to package against (the Worker's find_or_create failed)
  # means there is nothing to decide: skip the real packaging call rather than
  # run it against a nonexistent Investigation. Same guard as hunt.yaml's
  # run_hunt_coordinator.
  - name: decide_and_package
    type: hunt.packageReport
    if: "${{ inputs.investigationConversationId != nil and inputs.investigationConversationId != empty }}"
    with:
      spaceId: "{{ workflow.spaceId }}"
      reportId: "{{ inputs.reportId }}"
      investigationConversationId: "{{ inputs.investigationConversationId }}"
      runId: "{{ inputs.runId }}"
      huntStatus: "{{ inputs.huntStatus }}"
      # `${{ }}`, not `{{ }}`: the step schema types this as a boolean, and the text form
      # renders it as the string "false", which fails input validation.
      hasConfirmedHit: "${{ inputs.hasConfirmedHit }}"
      expectedSseCount: "${{ inputs.expectedSseCount }}"
      reportIntentTargets: "${{ inputs.reportIntentTargets }}"
      behaviors: "${{ inputs.behaviors }}"
    on-failure:
      fallback:
        # `emit_package_failed` ends the run, so this report goes first.
        - name: report_report_completed_package_failed
          type: alertzero.reportWorkerOutcome
          on-failure:
            continue: true
          with:
            event: hunt_report_completed
            hunt_status: |-
              {%- if inputs.huntStatus == 'success' or inputs.huntStatus == 'partial' or inputs.huntStatus == 'failed' -%}
              {{ inputs.huntStatus }}
              {%- else -%}
              unknown
              {%- endif -%}
            has_confirmed_hit: "${{ inputs.hasConfirmedHit == true }}"
            tier2_invoked: "${{ inputs.tier2_invoked }}"
            package_status: run_incomplete
            closed_clean: false
            proposals_prepared: 0
            proposals_dispatch_failed: 0
            mint_suppression: none
            coverage_kis_written: 0
            coverage_kis_skipped: 0
            investigation_id: "{{ inputs.investigationConversationId }}"
        - name: emit_package_failed
          type: workflow.output
          status: completed
          with:
            status: run_incomplete
            stage: packaging
            reason: "{{ steps.decide_and_package.error.message }}"

  # `if:` gates the whole parallel step, not just its `foreach` source, and
  # checks `!= nil`/`!= empty` rather than a `| default: []` filter chain: a
  # bracket array literal is not a valid filter argument in this engine (it
  # silently drops the field) and `foreach` itself hard-fails on a nil
  # predecessor rather than treating it as empty. Same reasoning as the Worker's
  # own report_fan_out.
  # Fire-and-forget: this child does not join the gates, so `mode: settled` plus
  # the failed count read below is how a launch failure is observed without an
  # on-failure inside the branch body, which the engine rejects there.
  - name: start_proposal_gates
    type: parallel
    if: "${{ steps.decide_and_package.output.status == 'packaged' and steps.decide_and_package.output.proposals != nil and steps.decide_and_package.output.proposals != empty }}"
    foreach: "${{ steps.decide_and_package.output.proposals }}"
    mode: settled
    concurrency:
      max: 5
    steps:
      - name: dispatch_gate
        type: workflow.executeAsync
        with:
          workflow-id: system-security-hunt-proposal-gate
          run-as-mode: inherit
          inputs:
            conversationId: "{{ foreach.item.conversationId }}"
            proposalId: "{{ foreach.item.proposalId }}"
            title: "{{ foreach.item.title }}"
            comment: "{{ foreach.item.comment }}"
            category: "{{ foreach.item.category }}"
            impact: "{{ foreach.item.impact }}"
            confidence: "{{ foreach.item.confidence }}"
            actionWorkflowId: "{{ foreach.item.actionWorkflowId }}"
            actionInput: "${{ foreach.item.actionInput }}"
            investigationConversationId: "{{ inputs.investigationConversationId }}"
            runId: "{{ inputs.runId }}"
            closureSummary: "{{ steps.decide_and_package.output.closureSummary }}"
            expectedProposalCount: "${{ steps.decide_and_package.output.expectedProposalCount }}"

  # A finding a live Proposal already covers creates nothing here. The Investigation that raised
  # that Proposal is named in a journal line on this one, so an analyst reading it can see where
  # its finding went. `mode: settled` for the same reason as the gates above: a failed note is
  # observed, not allowed to abort the others, and the note workflow itself continues on failure.
  # The line is composed by packaging, which knows whether this Investigation was added to the
  # Proposal's comment, so this step only delivers it.
  - name: write_convergence_notes
    type: parallel
    if: "${{ steps.decide_and_package.output.status == 'packaged' and steps.decide_and_package.output.converged != nil and steps.decide_and_package.output.converged != empty }}"
    foreach: "${{ steps.decide_and_package.output.converged }}"
    mode: settled
    concurrency:
      max: 5
    steps:
      - name: write_convergence_note
        type: workflow.execute
        with:
          workflow-id: system-alertzero-journal-note
          run-as-mode: inherit
          inputs:
            author_name: "{{ consts.author_name }}"
            conversation_id: "{{ inputs.investigationConversationId }}"
            message: "{{ foreach.item.note }}"

  # A scalar `default: 0` is fine in this engine; it is only a bracket array
  # literal that gets silently dropped. Safe when start_proposal_gates was
  # itself skipped (no proposals) or never ran.
  - name: resolve_dispatch_status
    type: data.set
    with:
      dispatch_failed_count: "${{ steps.start_proposal_gates.output.failed | default: 0 }}"

  # Benign close: only when packaging actually ran and decided to dismiss
  # (clean run, no hits). A packaging failure or skip never reaches `dismiss`
  # (steps.decide_and_package.output stays nil in both cases), so this cannot
  # close an Investigation packaging never evaluated.
  # Runs before resolve_package_status/resolve_package_summary on purpose: `continue: true`
  # swallows a failed patch, so those steps must read this step's error to avoid reporting
  # a close that never happened.
  - name: dismiss_investigation_if_clean
    type: ai.conversation.metadata.patch
    if: "${{ steps.decide_and_package.output.status == 'packaged' and steps.decide_and_package.output.dismiss == true }}"
    with:
      conversation_id: "{{ inputs.investigationConversationId }}"
      updates:
        status: closed
        close_reason: benign
        summary: "{{ steps.decide_and_package.output.closureSummary }}"
    on-failure:
      continue: true

  - name: report_investigation_closed_benign
    type: alertzero.reportWorkerOutcome
    if: "${{ steps.dismiss_investigation_if_clean.error == blank and steps.dismiss_investigation_if_clean.output.changed_fields contains 'status' }}"
    on-failure:
      continue: true
    with:
      event: worker_investigation_closed
      investigation_id: "{{ inputs.investigationConversationId }}"
      close_reason: benign

  # The one place the dismiss outcome is read: status, reason and summary below key off this
  # flag so the three cannot drift apart. False when the step was skipped (no error entry).
  - name: resolve_dismiss_outcome
    type: data.set
    with:
      dismiss_close_failed: "${{ steps.dismiss_investigation_if_clean.error.message != nil and steps.dismiss_investigation_if_clean.error.message != empty }}"

  # A partial gate launch (k of N dispatched) marks the packaging stage
  # `partial`, same as a `run_incomplete` native result — the
  # Worker's own outcome derivation only checks this child's status for
  # equality to `run_incomplete`, so both collapse to the one literal it reads.
  - name: resolve_package_status
    type: data.set
    with:
      package_status: |-
        {%- if inputs.investigationConversationId == nil or inputs.investigationConversationId == empty -%}
        run_incomplete
        {%- elsif steps.decide_and_package.output.status != 'packaged' -%}
        run_incomplete
        {%- elsif steps.decide_and_package.output.mintSuppression == 'check_failed' -%}
        run_incomplete
        {%- elsif variables.dismiss_close_failed == true -%}
        run_incomplete
        {%- elsif steps.decide_and_package.output.dismissHold == 'check_failed' -%}
        run_incomplete
        {%- elsif variables.dispatch_failed_count > 0 -%}
        run_incomplete
        {%- else -%}
        success
        {%- endif -%}
      package_reason: |-
        {%- if inputs.investigationConversationId == nil or inputs.investigationConversationId == empty -%}
        no Investigation available (find_or_create failed upstream; packaging was not called)
        {%- elsif steps.decide_and_package.output.status == 'run_incomplete' -%}
        {{ steps.decide_and_package.output.reason }}
        {%- elsif steps.decide_and_package.output.mintSuppression == 'check_failed' -%}
        could not verify whether the Investigation already has a Proposal, so no Proposal was minted
        {%- elsif steps.decide_and_package.output.dismissHold == 'check_failed' -%}
        could not verify whether the Investigation has an open Proposal, so it was left open instead of being closed
        {%- elsif steps.decide_and_package.error.message != nil and steps.decide_and_package.error.message != empty -%}
        {{ steps.decide_and_package.error.message }}
        {%- elsif variables.dismiss_close_failed == true -%}
        could not close the Investigation as benign ({{ steps.dismiss_investigation_if_clean.error.message }}), so it is still open. It will not be swept again on its own; a manual run targeting this reportId retries the close
        {%- elsif variables.dispatch_failed_count > 0 -%}
        {{ variables.dispatch_failed_count }} of {{ steps.decide_and_package.output.proposals | size }} gate dispatch(es) failed to launch
        {%- endif -%}

  # The packaging story for the run conclusion. Written from the native step's
  # structured output rather than a second copy of the decision logic: what was
  # decided (one bullet per proposal: category, host, executable action or the
  # reason it is recommendation-only), whether the Investigation was dismissed
  # as benign, and how many coverage knowledge items were written or skipped.
  # The proposal count is what packaging decided and dispatched a gate for, not
  # a count of created Proposals: each gate child creates its own, after this
  # summary is written, so the prose says prepared-and-launched rather than
  # claiming a creation this step cannot observe.
  # On an incomplete run it explains why packaging stopped, in the same words
  # the `reason` output carries. Markdown, embedded under the conclusion's
  # "Packaging" heading, so it starts with a sentence and may add bullets;
  # block tags use `-%}` only so the bullet line breaks survive.
  - name: resolve_package_summary
    type: data.set
    with:
      package_summary: |-
        {% assign packaged = steps.decide_and_package.output -%}
        {% assign convergedCount = packaged.converged | size -%}
        {% assign alreadyOpen = packaged.alreadyOpenCount | default: 0 -%}
        {% assign coveredCount = convergedCount | plus: alreadyOpen -%}
        {% if variables.package_status != 'success' and packaged.status != 'packaged' -%}
        Packaging did not complete: {{ variables.package_reason }}. No proposals were created and the Investigation stays open for a retry.
        {% elsif packaged.dismiss == true and variables.dismiss_close_failed == true -%}
        No confirmed hits, but packaging could not close this Investigation as benign ({{ steps.dismiss_investigation_if_clean.error.message }}), so it is still open. A manual run targeting this reportId retries the close.
        {% elsif packaged.dismissHold == 'open_proposal' -%}
        No confirmed hits this run, but the Investigation still has a Proposal from an earlier run that is pending or executing, so packaging left it open rather than closing it as benign. Decide the existing Proposal first{% if packaged.coverage.written != nil and packaged.coverage.written != empty %}; recorded {{ packaged.coverage.written | size }} coverage knowledge item{% if packaged.coverage.written.size != 1 %}s{% endif %} for Detection Watch{% endif %}.
        {% elsif packaged.dismissHold == 'check_failed' -%}
        No confirmed hits this run, but packaging could not verify whether the Investigation has an open Proposal, so it left the Investigation open rather than risk closing it over one{% if packaged.coverage.written != nil and packaged.coverage.written != empty %}; recorded {{ packaged.coverage.written | size }} coverage knowledge item{% if packaged.coverage.written.size != 1 %}s{% endif %} for Detection Watch{% endif %}.
        {% elsif packaged.dismiss == true -%}
        No confirmed hits, so packaging closed this Investigation as benign{% if packaged.coverage.written != nil and packaged.coverage.written != empty %} and recorded {{ packaged.coverage.written | size }} coverage knowledge item{% if packaged.coverage.written.size != 1 %}s{% endif %} for Detection Watch{% endif %}.
        {% elsif packaged.mintSuppression == 'check_failed' -%}
        This run found something mint-worthy, but packaging could not verify which Proposals already exist, so no new one was created this time{% if packaged.coverage.written != nil and packaged.coverage.written != empty %}; recorded {{ packaged.coverage.written | size }} coverage knowledge item{% if packaged.coverage.written.size != 1 %}s{% endif %} for Detection Watch{% endif %}. The next scheduled sweep will not retry this report on its own -- this run's hunt already marked it hunted -- so a manual run targeting this reportId is what actually retries it.
        {% elsif packaged.proposals == empty and coveredCount > 0 -%}
        This run found something mint-worthy, but every proposal it would have raised already exists, so none was created{% if convergedCount > 0 %}: {{ convergedCount }} {% if convergedCount == 1 %}was{% else %}were{% endif %} raised by another Investigation (the journal says where){% endif %}{% if alreadyOpen > 0 %}{% if convergedCount > 0 %} and {% else %}: {% endif %}{{ alreadyOpen }} {% if alreadyOpen == 1 %}is{% else %}are{% endif %} already open on this Investigation{% endif %}{% if packaged.coverage.written != nil and packaged.coverage.written != empty %}; also recorded {{ packaged.coverage.written | size }} coverage knowledge item{% if packaged.coverage.written.size != 1 %}s{% endif %} for Detection Watch{% endif %}.
        {% else -%}
        Packaging prepared {{ packaged.proposals | size }} proposal{% if packaged.proposals.size != 1 %}s{% endif %} for analyst review and launched an approval gate for each; the gate is what creates the Proposal.{% if variables.dispatch_failed_count > 0 %} {{ variables.dispatch_failed_count }} of the approval gates failed to launch.{% else %} The Investigation stays open until every gate is decided.{% endif %}
        {% for bullet in packaged.proposalBullets -%}
          {{ bullet }}
        {% endfor -%}
        {% if packaged.omittedProposalCount > 0 -%}
          - ...and {{ packaged.omittedProposalCount }} more proposal{% if packaged.omittedProposalCount != 1 %}s{% endif %} not listed here.
        {% endif -%}
        {% if coveredCount > 0 -%}
          - {{ coveredCount }} more finding{% if coveredCount != 1 %}s{% endif %} already {% if coveredCount != 1 %}have{% else %}has{% endif %} a Proposal, so none was created for {% if coveredCount != 1 %}them{% else %}it{% endif %}.
        {% endif -%}
        {% if packaged.coverage.written != nil and packaged.coverage.written != empty -%}
          - Recorded {{ packaged.coverage.written | size }} coverage knowledge item{% if packaged.coverage.written.size != 1 %}s{% endif %} for Detection Watch.
        {% endif -%}
        {% if packaged.coverage.skipped != nil and packaged.coverage.skipped != empty -%}
          - {{ packaged.coverage.skipped | size }} coverage knowledge item{% if packaged.coverage.skipped.size != 1 %}s were{% else %} was{% endif %} not written ({{ packaged.coverage.skipped | map: "reason" | uniq | join: ", " | replace: "_", " " }}).
        {% endif -%}
        {% endif -%}

  # Telemetry: what the hunt and packaging came to for this report.
  - name: report_report_completed
    type: alertzero.reportWorkerOutcome
    on-failure:
      continue: true
    with:
      event: hunt_report_completed
      hunt_status: |-
        {%- if inputs.huntStatus == 'success' or inputs.huntStatus == 'partial' or inputs.huntStatus == 'failed' -%}
        {{ inputs.huntStatus }}
        {%- else -%}
        unknown
        {%- endif -%}
      has_confirmed_hit: "${{ inputs.hasConfirmedHit == true }}"
      tier2_invoked: "${{ inputs.tier2_invoked }}"
      package_status: "{% if variables.package_status == 'success' %}success{% else %}run_incomplete{% endif %}"
      closed_clean: "${{ steps.decide_and_package.output.dismiss == true and variables.dismiss_close_failed != true }}"
      proposals_prepared: "${{ steps.decide_and_package.output.proposals | size }}"
      proposals_dispatch_failed: "${{ variables.dispatch_failed_count | default: 0 }}"
      # The step only says `check_failed`; "every proposal already exists" is derived the same way
      # as `resolve_package_summary`.
      mint_suppression: |-
        {%- assign packaged = steps.decide_and_package.output -%}
        {%- assign already_open = packaged.alreadyOpenCount | default: 0 -%}
        {%- assign covered = packaged.converged | size | plus: already_open -%}
        {%- if packaged.mintSuppression == 'check_failed' -%}
        check_failed
        {%- elsif packaged.proposals == empty and covered > 0 -%}
        existing_proposals
        {%- else -%}
        none
        {%- endif -%}
      coverage_kis_written: "${{ steps.decide_and_package.output.coverage.written | size }}"
      coverage_kis_skipped: "${{ steps.decide_and_package.output.coverage.skipped | size }}"
      investigation_id: "{{ inputs.investigationConversationId }}"

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      status: "{{ variables.package_status }}"
      stage: packaging
      reason: "{{ variables.package_reason }}"
      summary: "{{ variables.package_summary }}"
