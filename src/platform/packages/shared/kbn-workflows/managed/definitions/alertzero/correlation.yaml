version: "1"
name: Hunt Watch - correlation
description: >
  Untagged child invoked by PR 4's tagged Worker (registered id
  system-security-hunt-correlation; PR 4's Worker calls exactly this id, kept
  in sync with kibana#290146's child naming). Runs the anchors correlation
  engine (PR 3, correlate route) against this report's own extracted
  IOCs/actors/techniques, then writes exactly one message to the report's
  Investigation: a related-report narrative plus the security.hunt_correlation
  attachment on a match, or a plain "no related reports found" note otherwise.
  Does not touch Proposals: packaging (PR 4) reads this message to decide
  create vs. dismiss.
enabled: true
tags: []
triggers:
  - type: manual
inputs:
  additionalProperties: false
  properties:
    reportId:
      description: Threat report id (hunt:report:{reportId}).
      type: string
    investigationConversationId:
      description: Conversation id of the report's Investigation, from the Worker branch's find-or-create step.
      type: string
    runId:
      description: Run id shared by every child of one Worker sweep (packaging barrier / conclusion dedupe key).
      type: string
  required:
    - reportId
    - investigationConversationId
outputs:
  - name: status
    type: string
  - name: stage
    type: string
  - name: reason
    type: string
steps:
  # source_report_id-only call: search_by_anchors.ts fetches this report's own
  # extracted.iocs/ioc_set_hash/threat_actors/ttps.techniques when `anchors`
  # is omitted (search_by_anchors.ts:263-272), so the child never has to
  # duplicate that read itself.
  - name: run_correlate
    type: kibana.request
    with:
      method: POST
      path: "/s/{{ workflow.spaceId }}/internal/alertzero/hunt/correlate"
      headers:
        kbn-xsrf: "true"
        elastic-api-version: "1"
        Content-Type: application/json
      body:
        source_report_id: "{{ inputs.reportId }}"
    on-failure:
      continue: true

  # `matched` writes the correlation narrative + the security.hunt_correlation
  # attachment inline; `no_match` and `unavailable` both write a plain note
  # with no attachment (mvp-slice.md:429; `unavailable` is a successful
  # outcome that blocks containment, never the Tier 1 finding).
  - name: journal_matched
    type: workflow.execute
    if: "${{ steps.run_correlate.output.status == 'matched' }}"
    with:
      workflow-id: system-alertzero-journal-note
      inputs:
        conversation_id: "{{ inputs.investigationConversationId }}"
        message: >-
          Correlation found {{ steps.run_correlate.output.matches | size }}
          related report(s) sharing anchors with this one.
    on-failure:
      continue: true

  - name: attach_correlation
    type: ai.attachment.add
    if: "${{ steps.run_correlate.output.status == 'matched' }}"
    with:
      conversation_id: "{{ inputs.investigationConversationId }}"
      id: "{{ steps.run_correlate.output.attachment_data.attachment_id }}"
      type: security.hunt_correlation
      data: "${{ steps.run_correlate.output.attachment_data | json }}"
      description: Anchor correlation against other threat reports
      render_inline: true
    on-failure:
      continue: true

  - name: journal_no_match
    type: workflow.execute
    if: "${{ steps.run_correlate.output.status != 'matched' }}"
    with:
      workflow-id: system-alertzero-journal-note
      inputs:
        conversation_id: "{{ inputs.investigationConversationId }}"
        message: "No related reports found."
    on-failure:
      continue: true

  # `data.set` first, since `workflow.output`'s `with:` values are read, not
  # templated with `{% if %}` blocks directly.
  - name: resolve_result_status
    type: data.set
    with:
      result_status: |-
        {%- if steps.run_correlate.error != null -%}
        failed
        {%- else -%}
        success
        {%- endif -%}

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      status: "{{ variables.result_status }}"
      stage: correlation
      reason: "${{ steps.run_correlate.error | default: null }}"
