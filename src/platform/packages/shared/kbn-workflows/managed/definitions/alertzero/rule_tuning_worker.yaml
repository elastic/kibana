version: "1"
name: Detection Rule Tuning Worker
description: >
  Harvests rules whose alerts analysts closed as false positives and starts one
  tuning review workflow per rule, up to a limit of active reviews per space.
  Each review holds its own approval gate; the sweep does not wait for them.
enabled: true
tags:
  - security
  - detection-rule-tuning
settings:
  # One sweep per space at a time. The sweep only starts reviews and finishes in
  # seconds, so a second sweep would just race the first for the same rules.
  concurrency:
    key: detection-rule-tuning
    strategy: drop
    max: 1
triggers:
  # The per-space Rule Tuning worker owns the 2h schedule. This global sweep stays
  # manual-only so there is one scheduler authority and no cross-space task collision.
  - type: manual
    inputs:
      properties:
        autonomy_level:
          type: string
          enum: [manual, assisted]
          default: assisted
          description: >-
            Detection Watch autonomy level of the dispatching worker, forwarded to
            every review it launches. "manual" makes each review wait for an analyst
            before diagnosis.
        min_fp_count:
          type: integer
          # Floor of 2: a single-FP group makes ES|QL return alert_ids as a scalar,
          # which would fail the review's array input schema.
          minimum: 2
          maximum: 100
          description: Overrides the minimum unreviewed false-positive alerts a rule needs before it is diagnosed.
        min_fp_rate_pct:
          type: number
          minimum: 0
          maximum: 100
          description: Overrides the minimum share of a rule's alerts, in percent, that analysts closed as false positives.
        analysis_window_days:
          type: integer
          minimum: 1
          maximum: 30
          description: Overrides how many days of alerts feed the analysis.
        preview_invocation_count:
          type: integer
          minimum: 1
          maximum: 10
          description: Overrides the rule executions each backtest preview simulates.
        max_rules_per_sweep:
          type: integer
          minimum: 1
          # Can only lower the cap: the fan-out's parallel slots are sized for the
          # default, so a larger value could not open every gate at once.
          maximum: 10
          description: Overrides how many tuning reviews one sweep may launch, up to the default of 10.
      additionalProperties: false
outputs:
  - name: reviews_requested
    type: number
  - name: reviews_in_flight
    type: number
  - name: harvest_failed
    type: boolean
  - name: lookup_failed
    type: boolean
consts:
  # Worker settings. Scheduled runs carry no inputs, so every use goes through
  # `inputs.x | default: consts.x`. The per-space Rule Tuning worker forwards
  # analysis_window_days, min_fp_count and min_fp_rate_pct from its settings, so
  # these three are reached only by a manual run that omits them.
  analysis_window_days: 7
  min_fp_count: 10
  min_fp_rate_pct: 50
  max_rules_per_sweep: 10
  # The max number of rules to consider for tuning.
  max_candidate_rules: 20
  # Rules the FP-rate screen hands to the harvest. Applied after aggregation, so
  # raising it only lengthens the harvest's terms list. Room for the rows the
  # harvest then drops: older revisions of edited rules, and untagged FPs that
  # sit below a rule's reviewed watermark.
  max_screened_rules: 200
  # Ids handed to the diagnosing agent and tagged once the gate resolves; must
  # match ALERTS_BY_IDS_MAX in the investigate-rule skill (investigate_rule_skill.ts).
  max_diagnosis_ids: 100
  preview_invocation_count: 2
  # Liquid has no array literal, so `| default: []` yields undefined rather than an
  # empty array. A const is the only way to spell an empty-array fallback.
  no_rows: []
  reviewed_tag: detection-watch:tuning-reviewed
  # Tuning actions whose proposals can go stale when their rule changes.
  tuning_action_workflow_ids:
    - system-alertzero-action-edit-rule
    - system-alertzero-action-add-rule-exception
steps:
  # Expire pending tuning proposals whose rule was edited or deleted after they
  # were created, so nobody is asked to approve a change that can't be applied.
  - name: list_pending_tuning_proposals
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals"
      headers:
        elastic-api-version: "1"
      query:
        status: pending
        origin: alertzero
        category: configure
        size: 100
    on-failure:
      continue: true

  - name: expire_stale_tuning_proposals
    type: foreach
    foreach: "${{ steps.list_pending_tuning_proposals.output.proposals | default: consts.no_rows | where_exp: 'proposal', 'consts.tuning_action_workflow_ids contains proposal.actionWorkflowId' }}"
    steps:
      # Rule edits carry the rule's id as `id`, exceptions as `rule_id`.
      - name: fetch_proposal_rule
        type: kibana.request
        with:
          method: GET
          path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules?id={{ foreach.item.actionInput.id | default: foreach.item.actionInput.rule_id | url_encode }}"
          headers:
            elastic-api-version: "2023-10-31"
        on-failure:
          continue: true

      - name: expire_deleted_rule_proposal
        type: proposals.updateProposal
        if: "${{ steps.fetch_proposal_rule.error != nil and steps.fetch_proposal_rule.error.message contains 'HTTP 404' }}"
        with:
          proposalId: "{{ foreach.item.id }}"
          status: expired
          rationale: >-
            The rule was deleted after this proposal was created, so this tuning
            can't be applied.
        on-failure:
          continue: true

      - name: expire_changed_rule_proposal
        type: proposals.updateProposal
        if: >-
          ${{ steps.fetch_proposal_rule.error == nil
            and foreach.item.actionInput.expected_revision != nil
            and steps.fetch_proposal_rule.output.revision != foreach.item.actionInput.expected_revision }}
        with:
          proposalId: "{{ foreach.item.id }}"
          status: expired
          rationale: >-
            The rule was changed by "{{ steps.fetch_proposal_rule.output.updated_by }}"
            after this proposal was created, so this tuning can't be applied.
        on-failure:
          continue: true

  # A review parks at its gate for up to 72h and outlives the sweep that started it.
  # Its rule would be re-harvested until the gate resolves, wasting one of the
  # max_rules_per_sweep slots on a launch the child's per-rule drop concurrency then
  # kills. Listing in-flight reviews up front lets the harvest skip those rules at the
  # source. Fails open: without this data the sweep still runs and the drop
  # concurrency remains the backstop.
  - name: list_active_reviews
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/api/workflows/workflow/system-security-rule-tuning-review/executions?statuses=pending&statuses=waiting&statuses=waiting_for_input&statuses=waiting_for_child&statuses=running&statuses=queued&size=100"
      headers:
        elastic-api-version: "2023-10-31"
    on-failure:
      continue: true

  # The list response carries each execution's concurrencyGroupKey
  # (`rule-tuning-review-<rule uuid>`), not its inputs. Liquid cannot transform array
  # elements one by one, so the keys are joined, stripped of the prefix, and split
  # back. Size is computed on its own because comparison operators cannot follow a
  # filter chain.
  - name: collect_active_rules
    type: data.set
    with:
      parsed: "${{ steps.list_active_reviews.output.results | default: consts.no_rows | map: 'concurrencyGroupKey' | join: ',' | remove: 'rule-tuning-review-' | split: ',' }}"
      parsed_count: "${{ steps.list_active_reviews.output.results | default: consts.no_rows | map: 'concurrencyGroupKey' | join: ',' | remove: 'rule-tuning-review-' | split: ',' | size }}"
      expected: "${{ steps.list_active_reviews.output.results | default: consts.no_rows | size }}"

  # A key containing the `,` separator would corrupt the split into fragments that
  # could match unrelated rules (uuids never do, but the keys are external data), so
  # the parse only counts when it yields exactly one id per execution. Skipped
  # otherwise; the screen then falls back to no filter.
  - name: resolve_active_rules
    type: data.set
    if: "${{ steps.collect_active_rules.output.parsed_count == steps.collect_active_rules.output.expected }}"
    with:
      rule_uuids: "${{ steps.collect_active_rules.output.parsed }}"

  # Disabled and deleted rules would otherwise take harvest slots: their alerts
  # outlive them in the index. Scoping the screen to enabled rules handles both.
  # Fails closed: without the list the screen is skipped and the run is flagged.
  - name: list_enabled_rules
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/api/alerting/rules/_find?filter={{ 'alert.attributes.enabled: true and alert.attributes.consumer: siem' | url_encode }}&per_page=10000&fields=revision"
    on-failure:
      continue: true

  # Size is computed on its own because comparison operators cannot follow a
  # filter chain.
  - name: resolve_enabled_rules
    type: data.set
    if: "${{ steps.list_enabled_rules.error == null }}"
    with:
      rule_uuids: "${{ steps.list_enabled_rules.output.data | default: consts.no_rows | map: 'id' }}"
      count: "${{ steps.list_enabled_rules.output.data | default: consts.no_rows | size }}"
      rule_revision_keys: ",{% for rule in steps.list_enabled_rules.output.data %}{{ rule.id }}@{{ rule.revision }},{% endfor %}"

  # Scoped to one space because the tag API writes to the space's own alerts index, so
  # a cross-space harvest would keep rediagnosing alerts it can never mark.
  # `total_count` spans every alert the rule produced in the window. `fp_rate_count`
  # includes reviewed false positives so processing a batch does not dilute the rule's
  # measured FP rate. A rule reviewed earlier in the window would otherwise keep
  # passing both gates and hold a screen slot an unreviewed rule needs, so the screen
  # drops rules whose newest FP is not newer than their newest reviewed alert (the
  # harvest's watermark, computed here in the same pass) and ranks the rest on
  # `untagged_fp_count`, an upper bound on the unreviewed count the harvest measures
  # (every unreviewed FP is untagged). The min_fp_count check on it is a pre-filter,
  # not the gate.
  # The DSL filter carries every per-document exclusion (window, EQL sequence
  # members, enabled rules, in-flight rules), pushed down to Lucene before ES|QL sees
  # a row. Skipping an in-flight rule here, before STATS/LIMIT, frees its slot for
  # the next-noisiest one; the empty-array `terms` matches nothing, which makes that
  # `must_not` a no-op — the fail-open path when the lookup errored, the parse was
  # inconsistent, or no review is pending.
  - name: screen_rule_fp_rates
    type: elasticsearch.esql.query
    if: "${{ steps.resolve_enabled_rules.output.count > 0 }}"
    with:
      allow_partial_results: false
      filter:
        bool:
          filter:
            - range:
                "@timestamp":
                  gte: "now-{{ inputs.analysis_window_days | default: consts.analysis_window_days }}d"
            - terms:
                kibana.alert.rule.uuid: "${{ steps.resolve_enabled_rules.output.rule_uuids }}"
          must_not:
            - exists:
                field: kibana.alert.group.index
            - terms:
                kibana.alert.rule.uuid: "${{ steps.resolve_active_rules.output.rule_uuids | default: consts.no_rows }}"
      query: |-
        FROM .alerts-security.alerts-{{ workflow.spaceId }}
        | EVAL is_fp = `kibana.alert.workflow_status` == "closed"
            AND `kibana.alert.workflow_reason` == "false_positive"
        | STATS total_count = COUNT(*),
            fp_rate_count = COUNT(*) WHERE is_fp,
            untagged_fp_count = COUNT(*) WHERE is_fp AND NOT MV_CONTAINS(`kibana.alert.workflow_tags`, "{{ consts.reviewed_tag }}"),
            last_fp_at = MAX(@timestamp) WHERE is_fp,
            reviewed_watermark = MAX(@timestamp) WHERE MV_CONTAINS(`kibana.alert.workflow_tags`, "{{ consts.reviewed_tag }}")
          BY `kibana.alert.rule.uuid`, `kibana.alert.rule.revision`
        | WHERE (reviewed_watermark IS NULL OR last_fp_at > reviewed_watermark)
          AND untagged_fp_count >= {{ inputs.min_fp_count | default: consts.min_fp_count }}
          AND fp_rate_count * 100 >= total_count * {{ inputs.min_fp_rate_pct | default: consts.min_fp_rate_pct }}
        | SORT untagged_fp_count DESC
        | LIMIT {{ consts.max_screened_rules }}
        | EVAL rule_revision_key = CONCAT(",", `kibana.alert.rule.uuid`, "@", TO_STRING(`kibana.alert.rule.revision`), ",")
        | KEEP `kibana.alert.rule.uuid`, total_count, fp_rate_count, rule_revision_key
    on-failure:
      continue: true

  # Drops rows whose revision is not the rule's current one (a rule edited
  # mid-window) before they reach the harvest. No `default` after where_exp: an
  # empty filtered array is legitimate.
  - name: resolve_screened_rules
    type: data.set
    with:
      rule_revision_keys: "${{ steps.resolve_enabled_rules.output.rule_revision_keys }}"
      rows: "${{ steps.screen_rule_fp_rates.output.values | default: consts.no_rows | where_exp: 'row', 'steps.resolve_enabled_rules.output.rule_revision_keys contains row[3]' }}"
      count: "${{ steps.screen_rule_fp_rates.output.values | default: consts.no_rows | where_exp: 'row', 'steps.resolve_enabled_rules.output.rule_revision_keys contains row[3]' | size }}"
      fanout_limit: "${{ inputs.max_rules_per_sweep | default: consts.max_rules_per_sweep }}"

  # Only false positives of screened rules reach ES|QL, so INLINE STATS's two passes
  # and the TOP key are bounded by their FP volume. Security alerts are indexed with
  # `_id = kibana.alert.uuid`, so the uuid is read from doc values instead of the
  # stored-fields loader `METADATA _id` needs.
  # `allow_partial_results: false` because a partial aggregation would both undercount
  # fp_count and return a short alert_ids list, leaving alerts that drove a decision
  # untagged.
  # `alert_ids` holds only the newest 100 unreviewed FPs: TOP sorts by the collected
  # value itself, so recency needs sortable `timestamp|id` keys, expanded back to
  # plain ids by stripping the fixed 18-char prefix (17-digit timestamp plus the
  # separator, hence SUBSTRING from 19). Tagging those 100 places the reviewed
  # watermark at the newest FP, which retires the older untagged ones too.
  - name: harvest_fp_alerts_by_rule
    type: elasticsearch.esql.query
    if: "${{ steps.resolve_screened_rules.output.count > 0 }}"
    with:
      allow_partial_results: false
      filter:
        bool:
          filter:
            - range:
                "@timestamp":
                  gte: "now-{{ inputs.analysis_window_days | default: consts.analysis_window_days }}d"
            - term:
                kibana.alert.workflow_status: closed
            - term:
                kibana.alert.workflow_reason: false_positive
            - terms:
                kibana.alert.rule.uuid: "${{ steps.resolve_screened_rules.output.rows | map: '0' }}"
          must_not:
            - exists:
                field: kibana.alert.group.index
      query: |-
        FROM .alerts-security.alerts-{{ workflow.spaceId }}
        | INLINE STATS reviewed_watermark = MAX(@timestamp)
            WHERE MV_CONTAINS(`kibana.alert.workflow_tags`, "{{ consts.reviewed_tag }}"),
            latest_revision = MAX(`kibana.alert.rule.revision`)
          BY `kibana.alert.rule.uuid`
        | WHERE `kibana.alert.rule.revision` == latest_revision
          AND (reviewed_watermark IS NULL OR @timestamp > reviewed_watermark)
        | EVAL fp_recency_key = CONCAT(DATE_FORMAT("yyyyMMddHHmmssSSS", @timestamp), "|", `kibana.alert.uuid`)
        | STATS fp_count = COUNT(*),
            last_fp_at = MAX(@timestamp),
            recent_keys = TOP(fp_recency_key, {{ consts.max_diagnosis_ids }}, "desc")
          BY `kibana.alert.rule.uuid`, `kibana.alert.rule.revision`
        | WHERE fp_count >= {{ inputs.min_fp_count | default: consts.min_fp_count }}
        | SORT fp_count DESC
        | LIMIT {{ consts.max_candidate_rules }}
        | MV_EXPAND recent_keys
        | EVAL alert_id = SUBSTRING(recent_keys, 19)
        | STATS fp_count = MAX(fp_count),
            last_fp_at = MAX(last_fp_at),
            alert_ids = VALUES(alert_id)
          BY `kibana.alert.rule.uuid`, `kibana.alert.rule.revision`
        | EVAL rule_revision_key = CONCAT(",", `kibana.alert.rule.uuid`, "@", TO_STRING(`kibana.alert.rule.revision`), ",")
        | SORT fp_count DESC
        | KEEP `kibana.alert.rule.uuid`, fp_count, last_fp_at, alert_ids, rule_revision_key
    on-failure:
      continue: true

  # The revision check is repeated on the harvest rows: `latest_revision` there is the
  # max among the rule's FPs, which lags the current revision when the new revision
  # has no FPs yet. The engine's rehydration planner cannot see step paths inside
  # the quoted where_exp argument, so the keys are referenced directly as well.
  - name: resolve_fanout_rows
    type: data.set
    with:
      rule_revision_keys: "${{ steps.resolve_enabled_rules.output.rule_revision_keys }}"
      rows: "${{ steps.harvest_fp_alerts_by_rule.output.values | default: consts.no_rows | where_exp: 'row', 'steps.resolve_enabled_rules.output.rule_revision_keys contains row[4]' | slice: 0, steps.resolve_screened_rules.output.fanout_limit }}"

  # One review execution per rule, started without waiting. Each child parks on
  # its own approval gate for up to 72h; joining on them here would park this sweep
  # with them and block the space's scheduled sweeps behind a pending gate.
  # A start the engine rejects (review disabled, input rejected) must not stop the
  # remaining rules from getting a review. The child's per-rule drop concurrency
  # is applied when the child task runs, so a duplicate never fails this step.
  - name: run_reviews
    type: foreach
    foreach: "${{ steps.resolve_fanout_rows.output.rows | default: consts.no_rows }}"
    steps:
      # The totals come from the screen row with the same rule@revision key.
      - name: resolve_totals
        type: data.set
        with:
          row: "${{ steps.resolve_screened_rules.output.rows | where_exp: 'row', 'row[3] == foreach.item[4]' | first }}"

      # ES|QL rows arrive as positional arrays in the harvest's KEEP order.
      # `${{ }}` preserves the value's type (numbers, arrays); `{{ }}` stringifies.
      - name: run_review
        type: workflow.executeAsync
        on-failure:
          continue: true
        with:
          workflow-id: system-security-rule-tuning-review
          run-as-mode: inherit
          inputs:
            rule_uuid: "{{ foreach.item.0 }}"
            fp_count: "${{ foreach.item.1 }}"
            last_fp_at: "{{ foreach.item.2 }}"
            alert_ids: "${{ foreach.item.3 }}"
            total_alert_count: "${{ steps.resolve_totals.output.row.1 | default: 0 }}"
            total_fp_count: "${{ steps.resolve_totals.output.row.2 | default: 0 }}"
            autonomy_level: "{{ inputs.autonomy_level | default: 'assisted' }}"
            analysis_window_days: "${{ inputs.analysis_window_days | default: consts.analysis_window_days }}"
            preview_invocation_count: "${{ inputs.preview_invocation_count | default: consts.preview_invocation_count }}"
            parent_run_id: "{{ execution.id }}"

  # Telemetry: the sweep's outcome.
  - name: report_worker_run_completed
    type: alertzero.reportWorkerOutcome
    on-failure:
      continue: true
    with:
      event: worker_run_completed
      candidates_found: "${{ steps.harvest_fp_alerts_by_rule.output.values | default: consts.no_rows | where_exp: 'row', 'steps.resolve_enabled_rules.output.rule_revision_keys contains row[4]' | size }}"
      items_dispatched: "${{ steps.resolve_fanout_rows.output.rows | default: consts.no_rows | size }}"
      # Reviews already running plus the ones this sweep started, as the coverage sweep counts.
      items_in_flight: |-
        {%- assign started = steps.resolve_fanout_rows.output.rows | default: consts.no_rows | size -%}
        {{ steps.collect_active_rules.output.expected | default: 0 | plus: started }}
      source_read_failed: "${{ steps.list_enabled_rules.error != null or steps.screen_rule_fp_rates.error != null or steps.harvest_fp_alerts_by_rule.error != null }}"
      lookup_failed: "${{ steps.list_active_reviews.error != null }}"
      degraded_reason: "{% if steps.list_enabled_rules.error != null or steps.screen_rule_fp_rates.error != null or steps.harvest_fp_alerts_by_rule.error != null or steps.list_active_reviews.error != null %}dependency_unavailable{% else %}none{% endif %}"
      run_outcome: |-
        {%- assign requested = steps.resolve_fanout_rows.output.rows | default: consts.no_rows | size -%}
        {%- if steps.list_enabled_rules.error != null or steps.screen_rule_fp_rates.error != null or steps.harvest_fp_alerts_by_rule.error != null -%}
        failed_source_unavailable
        {%- elsif requested > 0 -%}
        produced
        {%- else -%}
        empty_nothing_found
        {%- endif -%}

  # Decisions are not known here: each review reports its own outcome and tags its
  # alerts once its gate resolves.
  - name: emit_result
    type: workflow.output
    status: completed
    with:
      # Reviews this sweep tried to start.
      reviews_requested: "${{ steps.resolve_fanout_rows.output.rows | default: consts.no_rows | size }}"
      reviews_in_flight: "${{ steps.collect_active_rules.output.expected }}"
      # Every read can fail without stopping the sweep. Zero requested after a failed
      # read does not mean no noisy rule. The enabled-rule lookup and the screen are
      # part of the harvest.
      harvest_failed: "${{ steps.list_enabled_rules.error != null or steps.screen_rule_fp_rates.error != null or steps.harvest_fp_alerts_by_rule.error != null }}"
      lookup_failed: "${{ steps.list_active_reviews.error != null }}"
