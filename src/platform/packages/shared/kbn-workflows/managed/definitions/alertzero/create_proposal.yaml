version: "1"
name: Create AlertZero proposal
description: >
  AlertZero's only door into the proposal gate. Forwards to
  `system-create-proposal` and stamps `origin: alertzero` itself, so no caller
  can attribute a proposal to the wrong feature by forgetting the field — the
  queue filters on `origin` by exact equality, and a wrong value hides the
  proposal from the analyst who was meant to see it.

  Deliberately thin. It exists so AlertZero has one place to add behaviour
  that must happen around every proposal it raises, rather than repeating it
  at each call site. When the caller names a decision tree, a person's
  decision is written back onto that tree after the gate returns. An
  automatic approval does not.
enabled: true
tags:
  - security
  - alertzero
  - proposals

settings:
  # Wall-clock from `startedAt`, and this run parks in WAITING_FOR_CHILD for as
  # long as the gate holds the decision — which `expiresIn` lets a caller set,
  # so no fixed window is safe here. A sentinel for the same reason the gate's
  # own is one: this workflow has no timeout handler, so a ceiling that fires
  # first cancels the bridge, orphans the parked gate and strands the proposal
  # `pending`.
  #
  # Strictly longer than the gate's own `52w`, not equal to it: this clock
  # starts before the gate is launched, so equal ceilings would have the parent
  # expire first and lose a decision the child had already reached. A test pins
  # the inequality.
  timeout: "53w"

triggers:
  - type: manual
    inputs:
      properties:
        conversationId:
          type: string
          description: Conversation this proposal belongs to.
        title:
          type: string
          description: >
            Short plain-text label naming what is proposed — `comment` is
            already the markdown body. Optional here, but stored on every
            proposal: omitting it stores the action workflow's own name, or
            `Proposed action` when the action has no name either.
        comment:
          type: string
          description: >
            Explains what is being proposed, rendered as markdown. Required:
            a proposal a human cannot read is not reviewable.
        actionWorkflowId:
          type: string
          description: >
            Managed action workflow to execute once approved. Omit for a
            proposal the analyst carries out themselves.
        actionInput:
          type: object
          additionalProperties: true
          description: Input for the action workflow.
        impact:
          type: string
          enum: ["low", "medium", "high", "critical", ""]
          description: Impact snapshotted at creation.
        category:
          type: string
          description: Grouping axis for the decision queue.
        confidence:
          type: string
          enum: ["low", "medium", "high", ""]
          description: Confidence in the recommendation.
        expiresIn:
          type: string
          description: >
            How long the analyst has to decide, as a duration like `24h` or
            `1w2d`. Defaults to 72h when unset, which the gate applies.
        autoApprove:
          type: boolean
          description: >
            Set by the caller when its autonomy policy already permits this
            action. Defaults to false so the gate is fail-closed.
        decisionTreeKiId:
          type: string
          maxLength: 512
          description: >
            Knowledge item to update once a person decides. Omit it and the
            proposal changes no tree. Not forwarded to the gate.
        decisionTreeAiIndex:
          type: string
          maxLength: 256
          description: >
            AI index that holds `decisionTreeKiId`. Required together with
            that id. Not forwarded to the gate.
      # `origin` is absent on purpose: this workflow owns it. The gate closes
      # its own inputs to additional properties, so accepting one here would
      # only let a caller pass a value that the forward below has to discard.
      # `decisionTreeKiId` and `decisionTreeAiIndex` stay here for the same
      # reason: the gate would reject them.
      required:
        - conversationId
        - comment
      additionalProperties: false

# Mirrors the gate's own contract verbatim. Callers read
# `steps.<step>.output.decision` and friends off this step, so dropping any of
# these would leave those expressions undefined — falsy, and silently so.
outputs:
  - name: proposalId
    type: string
  - name: status
    type: string
  - name: decision
    type: string
  - name: decidedBy
    type: string

steps:
  # Every forward uses `${{ }}` rather than `{{ }}`. `{{ }}` renders through
  # Liquid and turns an absent input into `''`, which the gate's trigger
  # rejects for `autoApprove` (boolean) and `actionInput` (object) — the run
  # would fail on a field the caller simply did not set. `${{ }}` evaluates and
  # preserves the type, passing `undefined` through for the gate to treat as
  # unset.
  - name: create_proposal
    type: workflow.execute
    with:
      workflow-id: system-create-proposal
      inputs:
        conversationId: "${{ inputs.conversationId }}"
        title: "${{ inputs.title }}"
        comment: "${{ inputs.comment }}"
        actionWorkflowId: "${{ inputs.actionWorkflowId }}"
        actionInput: "${{ inputs.actionInput }}"
        impact: "${{ inputs.impact }}"
        category: "${{ inputs.category }}"
        confidence: "${{ inputs.confidence }}"
        expiresIn: "${{ inputs.expiresIn }}"
        autoApprove: "${{ inputs.autoApprove }}"
        origin: alertzero

  # A person confirmed the action and it ran. `decidedBy` is empty when
  # autonomy approved without asking, so that path leaves the tree tentative.
  # A missing tree continues: the decision already happened, and this write
  # must not fail the proposal. `updateKi` merges `attributes`, so the diagram,
  # symptom, and version stay.
  - name: record_confirmed_decision_tree
    type: context-engine.updateKi
    if: >-
      ${{ inputs.decisionTreeKiId != blank
        and inputs.decisionTreeAiIndex != blank
        and steps.create_proposal.output.decidedBy != blank
        and steps.create_proposal.output.decision == 'approved'
        and steps.create_proposal.output.status == 'succeeded' }}
    on-failure:
      continue: true
    with:
      ai_index_id: "{{ inputs.decisionTreeAiIndex }}"
      ki_id: "{{ inputs.decisionTreeKiId }}"
      refresh: true
      ki:
        attributes:
          status: established
          confirmed_action: "{{ inputs.actionWorkflowId }}"

  # A person refused. Status stays where it was, so a sibling approval that
  # already established the tree is not demoted. The refused action is recorded
  # beside it.
  - name: record_refused_decision_tree
    type: context-engine.updateKi
    if: >-
      ${{ inputs.decisionTreeKiId != blank
        and inputs.decisionTreeAiIndex != blank
        and steps.create_proposal.output.decidedBy != blank
        and steps.create_proposal.output.decision == 'dismissed' }}
    on-failure:
      continue: true
    with:
      ai_index_id: "{{ inputs.decisionTreeAiIndex }}"
      ki_id: "{{ inputs.decisionTreeKiId }}"
      refresh: true
      ki:
        attributes:
          refused_action: "{{ inputs.actionWorkflowId }}"

  # `{{ }}` here, matching how the gate emits these same values, so an
  # unset one reaches the caller as `''` exactly as it does today.
  - name: output_result
    type: workflow.output
    status: completed
    with:
      proposalId: "{{ steps.create_proposal.output.proposalId }}"
      status: "{{ steps.create_proposal.output.status }}"
      decision: "{{ steps.create_proposal.output.decision }}"
      decidedBy: "{{ steps.create_proposal.output.decidedBy }}"
