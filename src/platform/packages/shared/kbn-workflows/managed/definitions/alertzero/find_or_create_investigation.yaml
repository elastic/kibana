version: "1"
name: Hunt Watch - find or create Investigation
description: >
  Untagged child invoked by PR 4's tagged Worker (registered id
  system-security-hunt-find-or-create-investigation; kept in sync with
  kbn-workflows/managed/definitions/alertzero/hunt_continuous_threat_hunt.yaml).
  Wraps the native hunt.findOrCreateInvestigation step, which mints the
  deterministic Investigation id (uuidv5(hunt:report:{reportId})), creates the
  conversation, or verifies an existing one on a conflict. Never throws past
  its own on-failure fallback; a partial run is reported through the typed
  output, not an exception. No kibana.request: PR 3b never shipped an
  Investigation-write route, and the id is minted server-side because Liquid
  cannot compute the uuidv5 hash.
enabled: true
tags: []
triggers:
  - type: manual
    inputs:
      properties:
        reportId:
          type: string
          description: Threat report id to find-or-create a Hunt Watch Investigation for.
      required:
        - reportId
      additionalProperties: false
outputs:
  - name: status
    type: string
  - name: stage
    type: string
  - name: reason
    type: string
  - name: investigationConversationId
    type: string
steps:
  - name: find_or_create
    type: hunt.findOrCreateInvestigation
    with:
      reportId: "{{ inputs.reportId }}"
    on-failure:
      fallback:
        - name: emit_find_or_create_failed
          type: workflow.output
          status: completed
          with:
            status: failed
            stage: find_or_create
            reason: "{{ steps.find_or_create.error.message }}"

  # `data.set` first, since `workflow.output`'s `with:` values are read, not
  # templated with `{% if %}` blocks directly (the hunt.yaml convention).
  - name: resolve_result_status
    type: data.set
    with:
      result_status: |-
        {%- if steps.find_or_create.output.investigationConversationId != nil -%}
        success
        {%- else -%}
        failed
        {%- endif -%}

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      status: "{{ variables.result_status }}"
      stage: find_or_create
      investigationConversationId: "{{ steps.find_or_create.output.investigationConversationId }}"
      reason: "{{ steps.find_or_create.error.message }}"
