version: "1"
name: Continuous Threat Hunt
description: >
  Hunt Watch's per-space sweep: checks which telemetry is available, selects
  candidate reports, and for each one creates or finds its Investigation,
  runs the hunt, and packages the results into findings. Always reaches a
  final outcome for the sweep, even if an individual report's run fails
  partway through.
enabled: false
tags:
  - watch
  - watch-hunt
settings:
  __WORKER_RUN_AS_LINE__:
  # Per-space: prevents a second sweep from starting while the first is still
  # running. It is not an ordering, atomicity, or gate-wait bound, and it is
  # distinct from report_fan_out's own concurrency.max below, which throttles
  # branches within one sweep, not sweeps against each other.
  concurrency:
    key: hunt-continuous-threat-hunt
    strategy: drop
    max: 1
# Triggers are rendered from autonomy: manual = manual only; assisted/supervised
# add the schedule.
triggers:
__WORKER_TRIGGERS__
consts:
  worker_settings:
    settingsVersion: __WORKER_SETTINGS_VERSION__
    autonomy: "__WORKER_AUTONOMY_LEVEL__"
    scheduleInterval: "__WORKER_SCHEDULE_INTERVAL__"
    # Fixed implementation constants, not user-configurable; see HUNT_WORKER_DEFAULTS
    # in worker_template_values.ts.
    tier2When: __WORKER_TIER2_WHEN__
    candidateLimit: __WORKER_CANDIDATE_LIMIT__
    fanOutMax: __WORKER_FAN_OUT_MAX__
steps:
  # Whether the hunt has anything to search: one scope for the space, the
  # Security Solution default data view and what resolved in it. Not Security
  # Solution threat-intel readiness. `continue: true` (no fallback capture): a
  # route exception leaves this step with no output, which
  # resolve_index_scope_gate treats the same as blocked, so selection and the
  # fan-out are both skipped and the run ends with no writes.
  - name: check_index_scope
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/alertzero/hunt/index_scope"
      headers:
        elastic-api-version: "1"
    on-failure:
      continue: true

  # Blocked stops selection: nothing in the default data view is visible to
  # this hunt, or check_index_scope errored outright (no output, so neither
  # status matches). Only `ok` and `degraded` proceed: degraded means the
  # universe resolved but a derived list could not be computed, and the
  # coordinator resolves its own scope per report.
  - name: resolve_index_scope_gate
    type: data.set
    with:
      index_scope_blocked: "${{ steps.check_index_scope.output.status != 'ok' and steps.check_index_scope.output.status != 'degraded' }}"

  # A manual trigger naming reportIds is a bypass sweep; the hunt child's own
  # `trigger` input needs this (hunt.yaml's hunt-once semantics), even though
  # the candidates route below derives its own selection trigger independently
  # from report_ids presence and the Worker never templates a trigger literal
  # into that call.
  - name: resolve_trigger_mode
    type: data.set
    with:
      trigger_mode: |-
        {%- if inputs.reportIds != nil and inputs.reportIds != empty -%}
        manual
        {%- else -%}
        scheduled
        {%- endif -%}

  # Empty selection (`ids: []`) is a successful sweep: no error, no writes,
  # because a fan-out over an empty array is a no-op in this engine.
  # Reports the route returns under `skipped` are logged in sweep diagnostics
  # and never enter the fan-out (not surfaced here; see the route's own response).
  - name: select_candidate_reports
    type: kibana.request
    if: "${{ steps.resolve_index_scope_gate.output.index_scope_blocked != true }}"
    with:
      method: POST
      path: "/s/{{ workflow.spaceId }}/internal/alertzero/hunt/candidates"
      headers:
        kbn-xsrf: "true"
        elastic-api-version: "1"
        Content-Type: application/json
      body:
        report_ids: "${{ inputs.reportIds }}"
        limit: "${{ consts.worker_settings.candidateLimit }}"
    on-failure:
      continue: true

  # `if:` gates the whole parallel step, not just its `foreach` source: a
  # filter's `| default: []` does not produce a usable array for a skipped or
  # nil predecessor in this engine (bracket array literals are not valid filter
  # arguments here, and the key is silently dropped rather than substituted),
  # and `foreach` itself hard-fails ("must evaluate to an array")
  # rather than treating a missing predecessor as empty. Skipping the whole
  # step when the candidates call was blocked or itself failed sidesteps that
  # entirely: index_scope_blocked covers the gate above; the `!= nil` check
  # covers select_candidate_reports failing via its own `continue: true`.
  - name: report_fan_out
    type: parallel
    if: "${{ steps.resolve_index_scope_gate.output.index_scope_blocked != true and steps.select_candidate_reports.output.ids != nil }}"
    foreach: "${{ steps.select_candidate_reports.output.ids }}"
    mode: settled
    # Throttles branches within one sweep, rendered from the fixed fanOutMax
    # constant. Safe above 1 because the engine scopes steps.<name> per branch
    # (kibana#293651). foreach still processes every selected candidate
    # regardless of this value, so candidateLimit is unaffected; only wall-clock
    # per sweep changes.
    concurrency:
      max: __WORKER_FAN_OUT_MAX__
    # Straight-line branch body, atomic steps only: no on-failure/if/foreach on
    # any step here, because the engine rejects nested flow-control in a
    # parallel branch body. Each risky stage is its own child workflow, invoked
    # via a single unconditional workflow.execute; every child owns its own
    # on-failure and always resolves to `completed`, so these calls never abort
    # the branch.
    steps:
      - name: find_or_create_investigation
        type: workflow.execute
        with:
          workflow-id: system-security-hunt-find-or-create-investigation
          run-as-mode: inherit
          inputs:
            reportId: "{{ foreach.item }}"
            runId: "{{ execution.id }}"

      - name: hunt
        type: workflow.execute
        with:
          workflow-id: system-security-hunt-execute
          run-as-mode: inherit
          inputs:
            reportId: "{{ foreach.item }}"
            investigationConversationId: "{{ steps.find_or_create_investigation.output.investigationConversationId }}"
            runId: "{{ execution.id }}"
            trigger: "{{ steps.resolve_trigger_mode.output.trigger_mode }}"
            tier2_when: "{{ consts.worker_settings.tier2When }}"

      # Packaging follows the hunt directly: there is deliberately no
      # cross-report correlation stage between them yet.
      - name: package_report
        type: workflow.execute
        with:
          workflow-id: system-security-hunt-package-report
          run-as-mode: inherit
          inputs:
            reportId: "{{ foreach.item }}"
            investigationConversationId: "{{ steps.find_or_create_investigation.output.investigationConversationId }}"
            runId: "{{ execution.id }}"
            # The hunt's verdict travels with the packaging call: a run that confirmed no
            # hit writes no SSE attachment, so packaging needs to be told that outcome
            # rather than inferring it from missing state (which is also what a rerun
            # collision or a failed attach looks like). `failed` covers the hunt step
            # having no output at all.
            huntStatus: "{{ steps.hunt.output.status | default: 'failed' }}"
            hasConfirmedHit: "${{ steps.hunt.output.hit == true }}"
            # What the hunt prepared, for packaging to compare against what it actually finds
            # attached (`attach_sse`'s foreach can silently drop an item via `continue`). A
            # missing hunt output (the step errored outright) has nothing to compare, so this
            # defaults to 0 -- same as a hunt that genuinely confirmed nothing.
            expectedSseCount: "${{ steps.hunt.output.sse_count | default: 0 }}"
            # What a clean run cannot leave on an attachment: the datasets the report points
            # at and the executed behaviors. Packaging derives the coverage KI's `data_sources`
            # and `validated_esql` from them.
            reportIntentTargets: "${{ steps.hunt.output.report_intent_targets | compact }}"
            behaviors: "${{ steps.hunt.output.behaviors | compact }}"

      # Outcome derivation: find_or_create failing means no Investigation ever
      # existed, so no conclusion is possible (handled by
      # write_run_conclusion below no-op'ing on an empty conversation id).
      # Otherwise: hunt not succeeding is `failed`; packaging returning
      # `run_incomplete` is `partial`; anything else is `completed`.
      - name: resolve_run_outcome
        type: data.set
        with:
          outcome: |-
            {%- if steps.hunt.output.status == 'failed' -%}
            failed
            {%- elsif steps.hunt.output.status == 'partial' or steps.package_report.output.status == 'run_incomplete' -%}
            partial
            {%- else -%}
            completed
            {%- endif -%}
          incomplete_stage: |-
            {%- if steps.hunt.output.status == 'failed' or steps.hunt.output.status == 'partial' -%}
            hunt
            {%- elsif steps.package_report.output.status == 'run_incomplete' -%}
            packaging
            {%- endif -%}

      # Always-runs terminal step, unconditional: an `if` is impossible here
      # because the engine rejects a flow-control key on a branch-body step.
      # journal_note.yaml's own `on-failure: continue: true` makes an empty
      # conversation_id (find_or_create never minted one) a silent no-op, which
      # gives "a run that never obtained an Investigation writes no conclusion"
      # without a branch-level conditional.
      #
      # The single closing message: the run
      # outcome, what the hunt found (the hunt child's `headline`), what
      # packaging did (the packaging child's `summary`), the failing or
      # incomplete stage and its reason when the run did not complete cleanly,
      # and the workflow execution link for full per-stage detail. Markdown
      # (heading, fact list, link), built only from child outputs (no nested
      # tier data, which a parallel branch body cannot safely reach into).
      # Literal block scalar; block tags use `-%}` only so line breaks survive.
      - name: write_run_conclusion
        type: workflow.execute
        with:
          workflow-id: system-alertzero-journal-note
          run-as-mode: inherit
          inputs:
            conversation_id: "{{ steps.find_or_create_investigation.output.investigationConversationId }}"
            message: |-
              {% if steps.resolve_run_outcome.output.outcome == 'completed' -%}
              ### Hunt Watch run completed
              - **Report:** `{{ foreach.item }}`
              - **Hunt:** {{ steps.hunt.output.headline }}.
              - **Packaging:** {{ steps.package_report.output.summary | strip }}
              {% elsif steps.resolve_run_outcome.output.outcome == 'partial' and steps.hunt.output.status == 'partial' -%}
              ### Hunt Watch run partial: the hunt could not cover everything it was asked to
              - **Report:** `{{ foreach.item }}`
              - **Hunt:** {{ steps.hunt.output.headline }}. {{ steps.hunt.output.reason }}
              - **Packaging:** {% if steps.package_report.output.status == 'run_incomplete' %}did not complete. {{ steps.package_report.output.reason }}.{% else %}{{ steps.package_report.output.summary | strip }}{% endif %}
              - **What this means:** the findings above are real, but part of the search did not run. Whether this report gets hunted again is stated in the hunt reason above: a gap that may clear keeps it eligible for a later sweep, while a gap that reproduces retires it having never been fully searched. The Investigation closes once every proposal from this run has been decided; a later sweep reopens it if it finds more.
              {% elsif steps.resolve_run_outcome.output.outcome == 'partial' -%}
              ### Hunt Watch run partial: packaging did not complete
              - **Report:** `{{ foreach.item }}`
              - **Hunt:** {{ steps.hunt.output.headline }}.
              - **Packaging:** did not complete. {{ steps.package_report.output.reason }}.
              - **What this means:** no proposals were created from this run. The hunt evidence was recorded, so the report will not be re-hunted automatically; the Investigation stays open for a manual rerun or review.
              {% else -%}
              ### Hunt Watch run failed: the hunt did not complete
              - **Report:** `{{ foreach.item }}`
              - **Hunt:** did not complete. {{ steps.hunt.output.reason }}
              - **What this means:** no findings or hunt evidence were recorded, so the report stays eligible for the next scheduled sweep or a manual rerun.
              {% endif -%}
              - **Run:** `{{ execution.id }}` ([full per-stage detail]({{ execution.url }}))
