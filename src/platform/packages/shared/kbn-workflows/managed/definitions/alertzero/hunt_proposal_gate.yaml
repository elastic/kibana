version: "1"
name: Hunt Watch - proposal gate
description: >
  Creates one Proposal for a finding the hunt packaged (a "Run a deep forensics
  investigation" handoff for a confirmed host, or an analyst recommendation),
  waits for the decision, and records the outcome on the Investigation. Never
  closes the Investigation: an approved handoff leaves it open for the forensic
  report Forensics Watch writes into it, and a dismissed or expired one leaves
  it open for an analyst to close.
enabled: true
tags:
  - security
  - continuous-threat-hunt
settings:
  # This run parks in WAITING_FOR_CHILD for as long as the escalation gate holds the
  # analyst's decision, and the workflow timeout is wall-clock from `startedAt` rather
  # than active time, so that park counts against it. At the engine's 6h default the
  # gate would be cancelled under the analyst, leaving the Investigation open and the
  # proposal dangling.
  #
  # So this has to stay *above* the gate's own ceiling of `168h` — a 72h decision
  # window plus a second full 72h for a proposal re-parked just before its deadline by
  # a privilege denial or a failed action, plus margin. Equal is not enough: this
  # clock starts before the gate is launched, so matching ceilings have the parent
  # expire first and lose a decision the child had already reached (the same reasoning
  # create_proposal.yaml gives for being strictly longer than `52w`). Hence the same
  # 176h as every other human-gated AlertZero parent — attack_discovery_review,
  # coverage_review, rule_creation, rule_tuning_review. The decision read and the
  # journal note after the wrap are near-instant, so the margin is all decision time.
  #
  # Not to be confused with the `53w` on system-create-alertzero-proposal, the bridge
  # this child actually executes: that is a deliberate sentinel, not a decision window.
  timeout: '176h'
triggers:
  - type: manual
    inputs:
      properties:
        conversationId:
          type: string
          description: Conversation this Proposal belongs to (create_proposal.yaml's own required field).
        title:
          type: string
          description: Short plain-text label naming what is proposed; absent falls back to the action's own name.
        comment:
          type: string
          description: Explains what is being proposed, rendered as markdown.
        actionWorkflowId:
          type: string
          description: Managed action workflow to execute once approved. Absent for a proposal the analyst carries out themselves.
        actionInput:
          type: object
          additionalProperties: true
          description: Input for the action workflow, passed through as its single actionInput object.
        impact:
          type: string
          description: Impact snapshotted at creation.
        confidence:
          type: string
          description: Confidence in the recommendation, snapshotted at creation.
        category:
          type: string
          description: Grouping axis for the decision queue; always set by the packaging child's mint payload.
        investigationConversationId:
          type: string
          description: Investigation conversation id this gate records its outcome on.
        runId:
          type: string
          description: Run id the Worker's fan-out minted for this sweep.
        hostName:
          type: string
          description: >-
            Host the Proposal is about, named in the journal note. Absent on the
            analyst recommendation, which is not scoped to one host.
        autonomy:
          type: string
          description: >-
            Worker autonomy level, which decides whether the handoff needs an analyst
            gate: `supervised` auto-approves it, `manual` and `assisted` gate it. The
            same rule the Attack Discovery review applies to the same handoff. Defaults
            to `manual`. The bridge still forces a gate when it had to reopen a closed
            Investigation, whatever this says.
      required:
        - conversationId
        - comment
        - category
        - investigationConversationId
        - runId
      additionalProperties: false
outputs:
  - name: proposalStatus
    type: string
  - name: decision
    type: string
  - name: expired
    type: boolean
consts:
  journal_note: system-alertzero-journal-note
  default_autonomy: manual
steps:
  # Liquid cannot compare the result of a filter chain in one expression, so the
  # defaulted level is resolved first and the comparison reads it from here.
  - name: resolve_context
    type: data.set
    with:
      autonomy: "{{ inputs.autonomy | default: consts.default_autonomy }}"

  - name: resolve_auto_approve
    type: data.set
    with:
      value: "${{ steps.resolve_context.output.autonomy == 'supervised' }}"

  # The gate child adds no second gate: this is a single sync wrap of
  # system-create-alertzero-proposal's own waitForApproval.
  # Goes through the bridge, not straight to system-create-proposal, so this
  # child's Proposals are stamped origin: alertzero like every other AlertZero
  # caller's, and so a Proposal landing on a closed Investigation reopens it
  # (and is never auto-approved when it did). on-failure: continue rather than
  # a fallback ending in workflow.output, since this is this workflow's own
  # terminal concern, not a stage a Worker branch depends on continuing past --
  # but continuing here still lets the journal note below say that the Proposal
  # could not be created, rather than the finding vanishing silently
  # (elastic/security-team#19849's first direction).
  - name: create_and_gate_proposal
    type: workflow.execute
    with:
      workflow-id: system-create-alertzero-proposal
      inputs:
        conversationId: "${{ inputs.conversationId }}"
        title: "${{ inputs.title }}"
        comment: "${{ inputs.comment }}"
        actionWorkflowId: "${{ inputs.actionWorkflowId }}"
        actionInput: "${{ inputs.actionInput }}"
        impact: "${{ inputs.impact }}"
        confidence: "${{ inputs.confidence }}"
        category: "${{ inputs.category }}"
        autoApprove: "${{ steps.resolve_auto_approve.output.value }}"
    on-failure:
      continue: true

  # The gate's own output already says WHAT was decided. This recovers the prose
  # that goes with it -- `decidedBy`, `dismissReason`, `rationale` -- which the gate
  # does not carry, for the journal note. Best effort: a failed read only costs the
  # note its names.
  - name: read_proposal_decision
    type: kibana.request
    if: "${{ steps.create_and_gate_proposal.output.proposalId != blank }}"
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals/{{ steps.create_and_gate_proposal.output.proposalId }}"
      headers:
        elastic-api-version: "1"
    on-failure:
      continue: true

  # `approved` reads `succeeded`, not the decision alone: an approved handoff whose
  # action failed is re-parked by the bridge and decided again, and only a run
  # whose action actually wrote the forensics request counts as handed off.
  - name: record_decision
    type: data.set
    with:
      created: "${{ steps.create_and_gate_proposal.output.proposalId != blank }}"
      approved: >-
        ${{ steps.create_and_gate_proposal.output.decision == 'approved'
          and steps.create_and_gate_proposal.output.status == 'succeeded' }}
      declined: "${{ steps.create_and_gate_proposal.output.decision == 'dismissed' }}"
      expired: "${{ steps.create_and_gate_proposal.output.status == 'expired' }}"
      # The analyst recommendation has no action, so approving it settles `no_action`:
      # an acknowledgement, not a handoff.
      acknowledged: >-
        ${{ steps.create_and_gate_proposal.output.decision == 'approved'
          and steps.create_and_gate_proposal.output.status == 'no_action' }}

  # The one message this gate writes: what happened to the Proposal, and that the
  # Investigation stays open either way. Literal block scalar; block tags use `-%}`
  # only so line breaks survive.
  - name: journal_decision
    type: workflow.execute
    with:
      workflow-id: "{{ consts.journal_note }}"
      inputs:
        conversation_id: "{{ inputs.investigationConversationId }}"
        message: |-
          {% if steps.record_decision.output.created != true -%}
          Hunt Watch could not create the Proposal{% if inputs.hostName != blank %} for `{{ inputs.hostName }}`{% endif %}: {{ steps.create_and_gate_proposal.error.message | default: 'the proposal workflow returned no proposal id' }}. The finding is still recorded on this Investigation; a manual run of report `{{ inputs.runId }}`'s subject retries it.
          {% elsif steps.record_decision.output.approved == true -%}
          Approved the forensics handoff{% if inputs.hostName != blank %} for `{{ inputs.hostName }}`{% endif %}{% if steps.read_proposal_decision.output.decidedBy.username != blank %} ({{ steps.read_proposal_decision.output.decidedBy.username }}){% endif %}. Forensics Watch picks the host up on its next sweep and writes its report here. This Investigation stays open for that report.
          {% elsif steps.record_decision.output.acknowledged == true -%}
          Acknowledged the analyst recommendation{% if steps.read_proposal_decision.output.decidedBy.username != blank %} ({{ steps.read_proposal_decision.output.decidedBy.username }}){% endif %}. No automated action was attached to it. This Investigation stays open until an analyst closes it.
          {% elsif steps.record_decision.output.declined == true -%}
          Dismissed the Proposal{% if inputs.hostName != blank %} for `{{ inputs.hostName }}`{% endif %} as "{{ steps.read_proposal_decision.output.dismissReason | default: 'unspecified' }}". {{ steps.read_proposal_decision.output.rationale }} This Investigation stays open until an analyst closes it.
          {% elsif steps.record_decision.output.expired == true -%}
          The Proposal{% if inputs.hostName != blank %} for `{{ inputs.hostName }}`{% endif %} expired with no decision. This Investigation stays open until an analyst closes it.
          {% else -%}
          The Proposal{% if inputs.hostName != blank %} for `{{ inputs.hostName }}`{% endif %} ended with status `{{ steps.create_and_gate_proposal.output.status }}` (decision `{{ steps.create_and_gate_proposal.output.decision }}`). This Investigation stays open until an analyst closes it.
          {% endif -%}
    on-failure:
      continue: true

  # Keeps the Investigation open on approval, explicitly: Forensics Watch writes its
  # findings into this conversation, so closing it would put the report where nobody
  # is looking. Only `status` is written; `verdict` carries the handoff note the way
  # the Attack Discovery review records the same event. Nothing in this workflow ever
  # patches `status: closed` -- a dismissed or expired handoff is an analyst's to
  # close, not this gate's, since the same Investigation may carry other handoffs
  # still awaiting a decision.
  - name: record_forensics_handoff
    type: ai.conversation.metadata.patch
    if: "${{ steps.record_decision.output.approved == true }}"
    with:
      conversation_id: "{{ inputs.investigationConversationId }}"
      updates:
        status: open
        verdict: >-
          Handed off{% if inputs.hostName != blank %} `{{ inputs.hostName }}`{% endif %} to
          Forensics Watch, approved by
          {{ steps.read_proposal_decision.output.decidedBy.username | default: 'the worker' }}.
          This Investigation stays open for the forensics report.
    on-failure:
      continue: true

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      proposalStatus: "{{ steps.create_and_gate_proposal.output.status }}"
      decision: "{{ steps.create_and_gate_proposal.output.decision }}"
      expired: "${{ steps.record_decision.output.expired == true }}"
