version: "1"
name: Attack Discovery FP/TP Analysis
description: >
  Judges whether one Attack Discovery's correlation is supported by its cited alerts,
  the entity store, and raw events, and returns a verdict. It returns a result and
  applies nothing: the review that calls it owns the verdict attachment and every
  lifecycle transition.

  Gather is deterministic. The agent has no tools and reasons only over those hits.
  The verdict it returns is emitted as-is. The workflow never emits `failed`.
enabled: true
tags:
  - security
  - attack-discovery
settings:
  # Gather and the agent. Contract bound for this child.
  timeout: "10m"
  # No workflow-level `on-failure.retry` on purpose. It would wrap EVERY step in
  # `enter-retry` nodes, including the bodies of `load_events_per_alert`'s
  # parallel branches, and a branch body cannot be retried (buildParallelBranchBody
  # rejects any `enter-*`/`exit-*` wrapper node in a branch body as unsupported
  # flow-control, e.g. "enter-retry" inside a parallel branch), so the graph never
  # builds and every run is rejected as invalid. Transient failures are handled per source
  # instead: the raw-event fan-out runs `mode: settled`, where a failed branch is
  # recorded in `results[].status/error` and feeds `events_failed` (branch bodies
  # cannot carry `on-failure` -- parallel_step.md Limitation), the optional entity
  # store carries `on-failure: continue: true` and feeds `entities_failed`, and a
  # failed REQUIRED source fails the run, which the review records as `failed` --
  # the review owns whether to run the analysis again.
  # No `concurrency` on purpose: the review already serializes per attack, and a
  # dropped run hands its caller an empty output that is indistinguishable from a
  # failed run.
triggers:
  # Launched by the review via `workflow.execute`. Owns no schedule.
  - type: manual
    inputs:
      properties:
        attack_discovery_id:
          type: string
          # Same bound the review takes.
          maxLength: 512
          description: >-
            Document id of the PERSISTED Attack Discovery under analysis, which
            equals its `kibana.alert.uuid`. Everything this workflow knows about the
            attack is read from that document rather than passed alongside the id.
        investigation_id:
          type: string
          maxLength: 128
          description: >-
            Conversation id of the Investigation the review opened for this attack,
            when there is one. Read to confirm it exists before analysing; this
            workflow writes nothing to it, because the verdict attachment is the
            review's to write. Omit it to analyse the attack with no Investigation.
      # The whole input surface: space comes from `workflow.spaceId`, attempt
      # identity from `execution.id`, and everything about the attack from the
      # loaded document, so no caller can pass a stale copy of any of them.
      # `investigation_id` is optional so the analysis can run without one.
      required:
        - attack_discovery_id
      additionalProperties: false
# The analyst-facing payload, matching the `security.attack_discovery.verdict`
# attachment (elastic/kibana#291932), plus the execution output from the #19280
# contract. `workflow.output` validates against this schema and fails the run on
# a mismatch.
#
# JSON Schema form rather than the legacy `- name:` array: only this form carries
# `maxLength`, which the legacy conversion silently drops.
outputs:
  properties:
    # Not an `enum` of the three, though that is where it belongs: the editor
    # type-checks the SOURCE of `workflow.output` `with:` values, so an enum
    # rejects the `"{{ ... }}"` template below. `require_supported_verdict` applies
    # it at runtime instead. Length caps have no such problem.
    #
    # `failed` is never emitted here; the review derives it from a failed run.
    verdict:
      type: string
    # Body markdown only — the attachment renders the verdict heading itself.
    #
    # Capped to the attachment's own `max(8000)`. Oversize would otherwise complete
    # the child and then fail `attach_verdict`, which continues on failure, letting
    # `apply_verdict` close or escalate with no evidence attached.
    summary_markdown:
      type: string
      maxLength: 8000
    # Optional, body markdown only, capped to the attachment's `max(50_000)`.
    rationale_markdown:
      type: string
      maxLength: 50000
    # This attempt's execution id, so a verdict traces back to the run that
    # produced it.
    analysis_execution_id:
      type: string
    # Read off the loaded document, so the caller can confirm the payload describes
    # the attack it asked about.
    attack_discovery_id:
      type: string
    # Echoed when the caller named one. Not loaded as evidence.
    investigation_id:
      type: string
    workflow_id:
      type: string
    # The workflow version is the prompt version.
    workflow_version:
      type: number
    coverage:
      type: object
    # The same payload the flat fields carry, so a caller that reads the contract
    # shape and the review that reads the flat fields see one verdict.
    payload:
      type: object
    checks:
      type: array
    claims:
      type: object
  # Without verdict and summary the review cannot tell a partial payload from a
  # whole one, and would pair a real verdict with its "analysis failed" summary.
  #
  # No `additionalProperties: false`: the execution output above is the contract
  # shape, and a later telemetry field should not fail a run that already decided.
  required:
    - verdict
    - summary_markdown
consts:
  # Temporary: service accounts have no display name, so the chat would show the raw account
  # id. Remove once they carry one (elastic/security-team#20422).
  author_name: "Attack Discovery worker"
  # Enforced by `require_supported_verdict`. `failed` is absent deliberately: it is
  # an execution state the review derives, not a classification.
  supported_verdicts:
    - false_positive
    - true_positive
    - inconclusive
  # The template language has no empty-list literal, and `| default: []` returns
  # nothing. This constant is the empty-list fallback for optional sources.
  no_rows: []
steps:
  # Loaded rather than received, so a retry cannot reason over a copy that went
  # stale. `ids` works because a persisted discovery is indexed under its
  # `kibana.alert.uuid`, making `_id` the same value.
  #
  # A required source, so no `on-failure`: a failed search, including a missing
  # privilege, fails the run, which the review records as `failed`. An empty hit
  # set is a successful search and is rejected by `require_attack_discovery`.
  - name: load_attack_discovery
    type: elasticsearch.search
    with:
      index: .adhoc.alerts-security.attack.discovery.alerts-{{ workflow.spaceId }}
      size: 1
      # The template caps this document at 50k characters. Drop replacements and
      # api_config; the checks only need the narrative and the cited alert ids.
      _source:
        - '@timestamp'
        - kibana.alert.attack_discovery.alert_ids
        - kibana.alert.attack_discovery.title
        - kibana.alert.attack_discovery.summary_markdown
        - kibana.alert.attack_discovery.details_markdown
        - kibana.alert.attack_discovery.entity_summary_markdown
        - kibana.alert.attack_discovery.mitre_attack_tactics
        - host.name
        - user.name
      query:
        ids:
          values:
            - "{{ inputs.attack_discovery_id }}"

  # An empty search SUCCEEDS, so the step above cannot catch an id that names no
  # document.
  - name: require_attack_discovery
    type: workflow.fail
    if: "${{ steps.load_attack_discovery.output.hits.total.value == 0 }}"
    with:
      message: >-
        No persisted Attack Discovery found for id
        "{{ inputs.attack_discovery_id }}" in space {{ workflow.spaceId }}.
        Required source unavailable; no classification was produced.

  # A metadata READ and nothing else: posting to this conversation, or running
  # `ai.agent` against it, wakes the Investigation agent. The agent below uses
  # `create-conversation: true` on a separate backing conversation.
  #
  # Skipped when no Investigation was named, so the analysis can run on the attack
  # alone. When one was named it is a required source: no `on-failure`, so a
  # missing conversation fails the run.
  - name: load_investigation
    type: ai.conversation.metadata.read
    if: "${{ inputs.investigation_id != blank }}"
    with:
      conversation_id: "{{ inputs.investigation_id }}"

  # Required source: every alert the discovery cites. `found` counts returned hits,
  # not `hits.total`, so a discovery citing more than `size` alerts fails instead of
  # being judged on a subset. A failed search, including a missing privilege, fails
  # the run. An empty hit set is a successful search and is rejected below.
  - name: load_alerts
    type: elasticsearch.search
    with:
      index: .alerts-security.alerts-{{ workflow.spaceId }}
      size: 100
      # The template caps the whole cited-alerts string at 200k characters.
      # Keep the fields the linkage and parent checks read. `original_time` is the
      # anchor of the raw-event window.
      _source:
        - '@timestamp'
        - kibana.alert.original_time
        - kibana.alert.rule.name
        - kibana.alert.severity
        - kibana.alert.risk_score
        - kibana.alert.reason
        - host.name
        - host.id
        - user.name
        - user.id
        - source.ip
        - destination.ip
        - destination.domain
        - process.name
        - process.pid
        - process.entity_id
        - process.command_line
        - process.parent.name
        - process.parent.entity_id
        - process.executable
        - agent.id
        - event.action
        - event.category
        - file.name
        - file.hash.sha256
        - dns.question.name
        - network.direction
      query:
        ids:
          values: "${{ steps.load_attack_discovery.output.hits.hits[0]._source['kibana.alert.attack_discovery.alert_ids'] }}"

  - name: count_alerts
    type: data.set
    with:
      cited: "${{ steps.load_attack_discovery.output.hits.hits[0]._source['kibana.alert.attack_discovery.alert_ids'] | size }}"
      found: "${{ steps.load_alerts.output.hits.hits | size }}"
      host_ids: "${{ steps.load_alerts.output.hits.hits | map: '_source.host.id' | compact | uniq }}"
      host_names: "${{ steps.load_alerts.output.hits.hits | map: '_source.host.name' | compact | uniq }}"
      user_names: "${{ steps.load_alerts.output.hits.hits | map: '_source.user.name' | compact | uniq }}"

  - name: require_cited_alerts
    type: workflow.fail
    if: "${{ steps.count_alerts.output.found != steps.count_alerts.output.cited }}"
    with:
      message: >-
        Only {{ steps.count_alerts.output.found }} of {{ steps.count_alerts.output.cited }}
        cited alerts were found for Attack Discovery "{{ inputs.attack_discovery_id }}".
        Required source unavailable; no classification was produced.

  # Optional. An empty or failed query does not fail the run. The verdict rules
  # treat a missing source as unable to clear an alert. A truncated page does not
  # fail the run; `block_truncated_clear` stops it from clearing the attack.
  - name: load_entities
    type: elasticsearch.search
    on-failure:
      continue: true
    with:
      index: entities-latest-{{ workflow.spaceId }}
      size: 50
      # The template caps this string at 200k characters.
      _source:
        - entity.id
        - entity.type
        - host.name
        - host.id
        - user.name
        - user.id
        - asset.criticality
      query:
        bool:
          minimum_should_match: 1
          should:
            - terms:
                host.id: "${{ steps.count_alerts.output.host_ids }}"
            - terms:
                user.name: "${{ steps.count_alerts.output.user_names }}"

  # Optional. Raw endpoint events, searched PER CITED ALERT so each window
  # hugs its own alert instead of one shared span. A shared
  # [min−2h, max+2h] window over a multi-day discovery returned a page of
  # ordinary telemetry from the start of the span and evicted every
  # alert-adjacent event (fp-tp suite, fp-multiday-span-truncated), because
  # `size:50` with `@timestamp asc` fills with whatever came first, not with
  # what is near the alerts. A per-host split would narrow the span but NOT
  # fix that case when all cited alerts sit on one host; anchoring each
  # branch on one alert's `kibana.alert.original_time` does.
  #
  # `parallel` dynamic fan-out, one branch per cited-alert hit. Each branch
  # searches that alert's host (host.id, falling back to host.name when the
  # alert has no host.id) within original_time ±2h, `size` per branch. The
  # aggregate `results[]` is index-aligned and carries each branch's search
  # output under `results[].output`, so downstream steps reassemble one hit
  # list WITHOUT per-iteration output eviction (a `foreach` step keeps only
  # the LAST iteration's output — verified in exit_foreach_node_impl.ts,
  # which evicts every non-latest iteration output on loop exit).
  #
  # `mode: settled`: raw events are an optional source, and a failed branch
  # (missing index/privilege) is recorded in `results[].status/error` and
  # must not fail the analysis — it feeds `events_failed` below. The
  # aggregate `status` becomes `failed` when any branch failed, which is
  # what `events_failed` reads. Branch bodies CANNOT carry `on-failure`
  # (rejected at build time: unsupported flow-control inside a parallel
  # branch — parallel_step.md §Limitation), so `settled` mode provides the
  # tolerance a failed search needs without failing the analysis.
  #
  # Fan-out ceiling: DEFAULT_PARALLEL_MAX_FAN_OUT is 100 and load_alerts has
  # `size: 100`, so a discovery citing exactly 100 alerts is AT the ceiling
  # (exceeding throws at init). If 100-alert discoveries are real, cap the
  # foreach list (`| first: 50` on the `foreach` expression) or raise the
  # ceiling first.
  - name: load_events_per_alert
    type: parallel
    mode: settled
    foreach: "${{ steps.load_alerts.output.hits.hits }}"
    concurrency:
      max: 5
    steps:
      - name: search_alert_window
        type: elasticsearch.search
        with:
          index: logs-endpoint.events.*
          # Per-branch budget. Worst case is 100 branches x 10 events =
          # 1000 events rendered against the old single size:50 page. The
          # template still caps the rendered string at 200k characters, and
          # a branch overflowing its page sets `branches_truncated`, which
          # blocks an FP clear, so overflow degrades to inconclusive rather
          # than silently dropping evidence.
          size: 10
          _source:
            - '@timestamp'
            - host.name
            - host.id
            - user.name
            - process.name
            - process.parent.name
            - process.entity_id
            - process.executable
            - process.command_line
            - source.ip
            - destination.ip
            - destination.domain
            - event.action
            - event.category
            - agent.id
            - dns.question.name
            - network.direction
          sort:
            - "@timestamp": asc
          # Term (not terms) on the single alert's own host, so one branch
          # cannot pull in another host's telemetry. Alerts with a host.id
          # are keyed by id; the host.name arm renders its term value only
          # when this alert has NO host.id (an empty-string term matches
          # nothing), so an alert with a host.id never matches other hosts
          # sharing its host.name.
          # The alert's own original_time anchors the window; the discovery
          # timestamp is the fallback when this alert has no original_time
          # (fallback for alerts without an original_time).
          query:
            bool:
              minimum_should_match: 1
              should:
                - bool:
                    filter:
                      - term:
                          host.id: "{{ foreach.item._source.host.id }}"
                      - range:
                          "@timestamp":
                            gte: "{{ foreach.item._source['kibana.alert.original_time'] | default: steps.load_attack_discovery.output.hits.hits[0]._source['@timestamp'] }}||-2h"
                            lte: "{{ foreach.item._source['kibana.alert.original_time'] | default: steps.load_attack_discovery.output.hits.hits[0]._source['@timestamp'] }}||+2h"
                - bool:
                    filter:
                      - term:
                          host.name: "{% if foreach.item._source.host.id == blank %}{{ foreach.item._source.host.name }}{% endif %}"
                      - range:
                          "@timestamp":
                            gte: "{{ foreach.item._source['kibana.alert.original_time'] | default: steps.load_attack_discovery.output.hits.hits[0]._source['@timestamp'] }}||-2h"
                            lte: "{{ foreach.item._source['kibana.alert.original_time'] | default: steps.load_attack_discovery.output.hits.hits[0]._source['@timestamp'] }}||+2h"

  # One hit set for the rest of the workflow, flattened from the branch
  # results and deduplicated by `_id` (overlapping per-alert windows return
  # the same event many times). Dedup joins the ids into a comma-delimited
  # list and matches `',' + id + ','`, so the check is delimiter-anchored:
  # one `_id` can never substring-match another. The initial capture seeds
  # the list with a lone comma so the first id matches too.
  - name: load_events
    type: data.set
    with:
      hits: |-
        {%- assign results = steps.load_events_per_alert.output.results | default: consts.no_rows -%}
        {%- capture seen_ids -%},{%- endcapture -%}
        {%- capture rows -%}{%- endcapture -%}
        {%- for r in results -%}
          {%- if r.status == 'completed' -%}
            {%- for hit in r.output.hits.hits -%}
              {%- assign id = hit._id -%}
              {%- assign id_marker = ',' | append: id | append: ',' -%}
              {%- unless seen_ids contains id_marker -%}
                {%- capture seen_ids -%}{{ seen_ids }}{{ id }},{%- endcapture -%}
                {%- capture rows -%}{{ rows }}{{ hit | json }},{%- endcapture -%}
              {%- endunless -%}
            {%- endfor -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if rows == blank -%}[]{%- else -%}[{{ rows | remove_last: ',' }}]{%- endif -%}
      # hits is RENDERED as a JSON array string (Liquid cannot build an array
      # across a loop in one expression), so every consumer must `json_parse`
      # it. `branches_failed`/`branches_truncated` are the aggregate facts the
      # downstream gates read; branches_truncated is the text "1" or "0" (loop
      # output), so consumers compare against '1'.
      branches_failed: "${{ steps.load_events_per_alert.output.failed }}"
      branches_truncated: |-
        {%- assign truncated = 0 -%}
        {%- for r in steps.load_events_per_alert.output.results -%}
          {%- if r.status == 'completed' and r.output.hits.total.value > 10 -%}
            {%- assign truncated = 1 -%}
          {%- endif -%}
        {%- endfor -%}
        {{ truncated }}

  - name: source_status
    type: data.set
    with:
      entities_failed: "${{ steps.load_entities.error != null }}"
      # A failed per-alert branch (settled mode records, not raises) is a
      # failed raw-event search.
      events_failed: "${{ steps.load_events.output.branches_failed > 0 }}"

  - name: analyze
    type: ai.agent
    agent-id: alertzero-thin-agent
    # A model saved on alertzero_template_models replaces the frontier feature.
    # An empty row does not. Keep in sync with ALERTZERO_TEMPLATE_INFERENCE_FEATURE_ID
    # and ALERTZERO_FRONTIER_INFERENCE_FEATURE_ID in @kbn/alertzero-common.
    connector-id-by-feature:
      - alertzero_template_models
      - alertzero_frontier
    # plugin-id: per-run cost attribution; aggregate-by: ALERTZERO_INFERENCE_PARENT_FEATURE_ID.
    plugin-id: alertzero_fp_tp_analysis
    aggregate-by: alertzero_parent
    # Not the Investigation conversation. Posting there, or running the agent
    # against it, wakes the Investigation agent.
    create-conversation: true
    timeout: "8m"
    with:
      author_name: "{{ consts.author_name }}"
      configuration_overrides:
        enable_elastic_capabilities: false
        tools: []
        skill_ids: []
      # Used only when the connector requires an EIS prompt template.
      template_id: ".attack-discovery-fp-tp"
      template_version: 1
      template_variables:
        discovery: "{{ steps.load_attack_discovery.output.hits.hits[0] | json }}"
        cited_alerts: "{{ steps.load_alerts.output.hits.hits | json }}"
        entities: "{{ steps.load_entities.output.hits.hits | default: consts.no_rows | json }}"
        events: "{{ steps.load_events.output.hits | default: consts.no_rows | json_parse | json }}"
        entities_failed: "${{ steps.source_status.output.entities_failed }}"
        events_failed: "${{ steps.source_status.output.events_failed }}"
      message: |
        You judge ONE persisted Attack Discovery as a chain: do the world facts around its
        cited alerts support the attack story it tells? You do not generate a discovery,
        judge individual detection rules, or confirm compromise. You have no tools; use
        only the evidence below.

        Verdicts:
        - true_positive: the alerts plus the world warrant investigating them as one unit.
        - false_positive: the world affirmatively refutes the story.
        - inconclusive: you cannot decide from the evidence.

        Missing telemetry is never a false_positive; only an affirmative contradiction is.
        The discovery's own markdown is a claim to test, not evidence.

        Run every check below and report exactly one entry per check. Status is
        `completed` or `skipped` (the source is empty or unavailable). A completed check
        also has a result: `supports`, `contradicts`, or `neutral`.

        1. alert_linkage — cited alerts only. Alerts may connect by one shared field
           or a path of pivots: one alert shares a host with a second, which shares a
           user with a third. A pivot is a user, host, IP, process, agent.id, or
           source.ip, together with a concrete bridge (process tree, session, event.id,
           or process.entity_id). Shared identifiers without a bridge, or theme and
           timing alone, are neutral. When the pivots connect, the time order still
           has to read as an execution chain.
           Report the strongest pivot; it does not decide the verdict.
        2. entity_role — entity store only. An ordinary employee workstation or
           account supports.
           A management server, MDM, jump box, or service account is neutral, not contradicts:
           the role is context for the other checks, and those machines are also
           high-value targets. A thin or uncurated record is neutral.
        3. process_parent — raw events only. A management agent, scheduler, Nessus
           scan, software-distribution parent, or other config-management parent
           that explains the child contradicts. An office program or browser supports.
           A risk score or severity on a cited alert weighs how strong that parent is.
           It is not a separate verdict.
        4. network_destination — raw events only. Judge every destination shown.
           A known vendor or internal management destination contradicts only when
           every other destination is accounted for. A typosquat, a temporary host
           (such as *.dev or *.worker), a public numeric IP URL, or another unknown
           or known-bad endpoint supports.
           One known-good callout does not cancel the rest.

        The world checks are entity_role, process_parent, and network_destination.

        Choose the verdict by the first rule that matches:
        1. inconclusive — world checks both support and contradict; or you cannot cite
           an id from the hits below.
        2. false_positive — at least one world check contradicts, none supports, and
           both the entity store and the raw events have hits. Missing evidence cannot
           clear an alert: if either source is empty or its query failed, the verdict
           is inconclusive.
        3. true_positive — process_parent or network_destination supports and no world
           check contradicts. An empty or failed entity store does not block this.
           entity_role and alert_linkage corroborate but are never enough on their own.
        4. inconclusive — anything else: every world check is skipped or neutral, or
           only entity_role or alert_linkage supports.

        A truncated entity or raw-event list is missing evidence and cannot clear an attack.
        If more entities or events matched than are shown below, do not return false_positive.

        Claims:
        - claims.world: one entry for each world-check result the verdict relies on, with
          `check`, `result` (supports or contradicts), `source` (entity_store or
          raw_event), and `id` — the `entity.id` of an entity store hit or the `_id` of a
          raw event hit. Cite only ids that appear in the hits below.
        - claims.alert_link: when alert_linkage supports, the strongest pivot. `field`
          is one of user.name, user.id, host.id, host.name, process.entity_id,
          process.pid, agent.id, or source.ip. Include its `value` and the `_id`s of
          at least two cited alerts that share it.

        Writing:
        - summary_markdown: one paragraph. State the verdict in prose (no heading), the
          strongest reason, the id it rests on, and any empty or unavailable source.
          At most 8000 characters.
        - rationale_markdown: one bullet per check (status, result, coverage, and cited
          ids) and one per empty or unavailable source. Omit it if it would only repeat
          the summary.
        - No JSON, no confidence scores, no restated instructions.

        Attack Discovery:
        {{ steps.load_attack_discovery.output.hits.hits[0] | json }}

        Cited alerts ({{ steps.count_alerts.output.found }} of {{ steps.count_alerts.output.cited }}):
        {{ steps.load_alerts.output.hits.hits | json }}

        Entity store, showing at most 50 of {{ steps.load_entities.output.hits.total.value | default: 0 }} that matched (query failed: {{ steps.source_status.output.entities_failed }}):
        {{ steps.load_entities.output.hits.hits | default: consts.no_rows | json }}

        Raw events from a window around EACH cited alert (2 hours before to 2 hours after that alert's own time, on that alert's host), deduplicated, at most 10 per alert (query failed: {{ steps.source_status.output.events_failed }}):
        {{ steps.load_events.output.hits | default: consts.no_rows | json_parse | json }}
      schema:
        type: object
        additionalProperties: false
        properties:
          verdict:
            type: string
            enum:
              - true_positive
              - false_positive
              - inconclusive
          summary_markdown:
            type: string
          rationale_markdown:
            type: string
          checks:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  enum:
                    - alert_linkage
                    - entity_role
                    - process_parent
                    - network_destination
                status:
                  type: string
                  enum:
                    - completed
                    - skipped
                result:
                  type: string
                  enum:
                    - supports
                    - contradicts
                    - neutral
                details:
                  type: string
              required:
                - name
                - status
                - details
          claims:
            type: object
            additionalProperties: false
            properties:
              alert_link:
                type: object
                additionalProperties: false
                properties:
                  field:
                    type: string
                    enum:
                      - user.name
                      - user.id
                      - host.id
                      - host.name
                      - process.entity_id
                      - process.pid
                      - agent.id
                      - source.ip
                  value:
                    type: string
                  alert_ids:
                    type: array
                    items:
                      type: string
                required:
                  - field
                  - value
                  - alert_ids
              world:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    check:
                      type: string
                      enum:
                        - entity_role
                        - process_parent
                        - network_destination
                    result:
                      type: string
                      enum:
                        - supports
                        - contradicts
                    source:
                      type: string
                      enum:
                        - entity_store
                        - raw_event
                    id:
                      type: string
                  required:
                    - check
                    - result
                    - source
                    - id
        # claims stays optional. The messages prompt still asks for them. The
        # .attack-discovery-fp-tp template does not, and a required field would
        # reject that reply.
        required:
          - verdict
          - summary_markdown
          - checks

  # The contract boundary: an unsupported verdict fails the run instead of
  # reaching the review's switch, whose default arm does nothing.
  #
  # Split in two because Liquid has no `not` and no parentheses, so the failure
  # condition cannot be the inline negation of this. Comparisons bind tighter than
  # `and`.
  - name: check_payload
    type: data.set
    with:
      payload_valid: "${{ consts.supported_verdicts contains steps.analyze.output.structured_output.verdict and steps.analyze.output.structured_output.summary_markdown != blank }}"

  # An analysis with no usable classification has classified nothing. Emitting it
  # would instead send an unknown verdict through the review's switch.
  #
  # `== false` rather than a bare negation, so an undefined never fires this.
  - name: require_supported_verdict
    type: workflow.fail
    if: "${{ steps.check_payload.output.payload_valid == false }}"
    with:
      message: >-
        FP/TP analysis produced no usable payload for Attack Discovery
        "{{ inputs.attack_discovery_id }}": verdict
        "{{ steps.analyze.output.structured_output.verdict }}" is not one of
        {{ consts.supported_verdicts | join: ", " }}, or the summary was empty.
        No classification was produced.

  # A truncated entity or event page is missing evidence. The review closes the
  # attack on `false_positive`, so that verdict becomes `inconclusive` before it is
  # emitted. `true_positive` is left alone: truncation blocks a clear, not an
  # escalation.
  #
  # Parentheses are required. `and` binds tighter than `or`, so an ungrouped
  # condition also rewrites a truncated `true_positive`.
  #
  # Event truncation is per-branch: any completed per-alert branch whose
  # own total exceeded its size cap means evidence was dropped. Per-alert
  # windows are small and hugging their alert, so a truncated branch is a
  # genuinely hot window rather than dilution noise — but the missing events
  # could still be the ones that clear the attack, so it still blocks a clear.
  - name: block_truncated_clear
    type: data.set
    with:
      downgraded: "${{ (steps.load_events.output.branches_truncated == '1' or steps.load_entities.output.hits.total.value > 50) and steps.analyze.output.structured_output.verdict == 'false_positive' }}"
      verdict: "{% if (steps.load_events.output.branches_truncated == '1' or steps.load_entities.output.hits.total.value > 50) and steps.analyze.output.structured_output.verdict == 'false_positive' %}inconclusive{% else %}{{ steps.analyze.output.structured_output.verdict }}{% endif %}"
      summary_markdown: "{% if (steps.load_events.output.branches_truncated == '1' or steps.load_entities.output.hits.total.value > 50) and steps.analyze.output.structured_output.verdict == 'false_positive' %}Evidence was truncated, so this cannot be cleared as a false positive.{% else %}{{ steps.analyze.output.structured_output.summary_markdown }}{% endif %}"

  # A world claim may only cite an id from the hits. `capture` records a miss
  # without depending on `assign` inside `for`. No claims is not a miss: claims
  # are optional. An already inconclusive verdict is left as the model wrote it.
  # The flag is `ungrounded`, not `downgraded`: it is the string "true" or
  # "false" because the loop cannot live in a typed `${{ }}` expression, while
  # `block_truncated_clear.downgraded` is a real boolean — a shared name would
  # let a copy-paste silently compare one against the other's type.
  - name: check_claim_grounding
    type: data.set
    with:
      ungrounded: |
        {%- assign world = steps.analyze.output.structured_output.claims.world -%}
        {%- assign event_ids = steps.load_events.output.hits | default: consts.no_rows | json_parse | map: '_id' -%}
        {%- assign entity_ids = steps.load_entities.output.hits.hits | default: consts.no_rows | map: '_source.entity.id' -%}
        {%- capture misses -%}{%- for claim in world -%}{%- if claim.source == 'raw_event' -%}{%- unless event_ids contains claim.id -%}x{%- endunless -%}{%- elsif claim.source == 'entity_store' -%}{%- unless entity_ids contains claim.id -%}x{%- endunless -%}{%- else -%}x{%- endif -%}{%- endfor -%}{%- endcapture -%}
        {%- if misses != blank and steps.block_truncated_clear.output.verdict != 'inconclusive' -%}true{%- else -%}false{%- endif -%}

  # Same shape as `block_truncated_clear`: a verdict that cites evidence the
  # search did not return becomes inconclusive, for a clear and for an escalation.
  - name: block_ungrounded_claims
    type: data.set
    with:
      verdict: "{% if steps.check_claim_grounding.output.ungrounded == 'true' %}inconclusive{% else %}{{ steps.block_truncated_clear.output.verdict }}{% endif %}"
      summary_markdown: "{% if steps.check_claim_grounding.output.ungrounded == 'true' %}A cited world-check id is not in the evidence, so this cannot be classified.{% else %}{{ steps.block_truncated_clear.output.summary_markdown }}{% endif %}"

  # The model's rationale, checks, and claims still argue the old verdict after it
  # is rewritten. The review attaches the rationale, so a downgrade omits them.
  # `where` plus `first` yields nothing when `keep` is false, and `${{ }}` leaves
  # that absence absent instead of `""`.
  - name: keep_model_writeup
    type: data.set
    with:
      rows:
        - keep: "${{ steps.block_truncated_clear.output.downgraded == false and steps.check_claim_grounding.output.ungrounded != 'true' }}"
          rationale_markdown: "${{ steps.analyze.output.structured_output.rationale_markdown }}"
          checks: "${{ steps.analyze.output.structured_output.checks }}"
          claims: "${{ steps.analyze.output.structured_output.claims }}"

  # `workflow.execute` resolves to the child's `context.output`, so a child with no
  # `workflow.output` step hands its parent nothing.
  #
  # Always `completed`: the failure path fails the run rather than reaching here,
  # which is what keeps `failed` out of the emitted verdict.
  #
  # Flat `verdict` / `summary_markdown` / `rationale_markdown` are what the review
  # attaches. `payload` and the fields under it are the same verdict.
  - name: emit_result
    type: workflow.output
    status: completed
    with:
      verdict: "{{ steps.block_ungrounded_claims.output.verdict }}"
      summary_markdown: "{{ steps.block_ungrounded_claims.output.summary_markdown }}"
      # `${{ }}`, not `{{ }}`: `{{ }}` stringifies undefined to `""`, and the
      # attachment null-checks the field, so an empty string would render an empty
      # `## Rationale` section. A downgrade matches no `keep` row, so this is absent.
      rationale_markdown: "${{ steps.keep_model_writeup.output.rows | where: 'keep', true | map: 'rationale_markdown' | first }}"
      analysis_execution_id: "{{ execution.id }}"
      # From the document, not `inputs`.
      attack_discovery_id: "{{ steps.load_attack_discovery.output.hits.hits | map: '_id' | first }}"
      # `${{ }}` omits the field when the caller named no Investigation, instead of
      # writing an empty id.
      investigation_id: "${{ inputs.investigation_id }}"
      workflow_id: "{{ workflow.id }}"
      workflow_version: "${{ workflow.version }}"
      coverage:
        alerts:
          seen: "${{ steps.count_alerts.output.found }}"
          total: "${{ steps.count_alerts.output.cited }}"
        entities:
          seen: "${{ steps.load_entities.output.hits.hits | default: consts.no_rows | size }}"
          cap: 50
          truncated: "${{ steps.load_entities.output.hits.total.value > 50 }}"
        events:
          seen: "${{ steps.load_events.output.hits | default: consts.no_rows | json_parse | size }}"
          cap: 10
          # Per-alert branch truncation, not a single shared total.
          truncated: "${{ steps.load_events.output.branches_truncated == '1' }}"
      payload:
        verdict: "${{ steps.block_ungrounded_claims.output.verdict }}"
        summary_markdown: "${{ steps.block_ungrounded_claims.output.summary_markdown }}"
        rationale_markdown: "${{ steps.keep_model_writeup.output.rows | where: 'keep', true | map: 'rationale_markdown' | first }}"
      checks: "${{ steps.keep_model_writeup.output.rows | where: 'keep', true | map: 'checks' | first }}"
      claims: "${{ steps.keep_model_writeup.output.rows | where: 'keep', true | map: 'claims' | first }}"
