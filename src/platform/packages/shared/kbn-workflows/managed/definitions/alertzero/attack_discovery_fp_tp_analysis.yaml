version: "1"
name: Attack Discovery FP/TP Analysis
description: >
  Judges whether one Attack Discovery's CORRELATION is supported by its evidence and
  returns a verdict. It returns a result and applies nothing: the review that calls
  it owns the verdict attachment and every lifecycle transition.

  The analysis body gathers the attack's title, summary, entities and correlated
  alert ids from the loaded document, hands them to one `ai.agent` call on its own
  backing conversation (so the Investigation agent is never woken), and classifies
  the correlation as false_positive, true_positive or inconclusive via structured
  output. An agent call that fails after the workflow's retries degrades to
  `inconclusive` rather than failing the run, so the review never records a
  transport failure as a classification.
enabled: true
tags:
  - security
  - attack-discovery
settings:
  # Provisional; the real bound is an open question in #19280.
  timeout: "30m"
  # Retried here rather than at the review's call site, so a transient ES or
  # conversation-read failure never reaches the review as a `failed` verdict.
  # Workflow-level because every step is a required source or depends on one.
  on-failure:
    retry:
      max-attempts: 3
      delay: "30s"
      strategy: exponential
  # No `concurrency` on purpose: the review already serializes per attack, and a
  # dropped run hands its caller an empty output that is indistinguishable from an
  # exhausted-retry failure.
triggers:
  # Launched by the review via `workflow.execute`. Owns no schedule.
  - type: manual
    inputs:
      properties:
        attack_discovery_id:
          type: string
          # Same bound the review takes.
          maxLength: 512
          description: >-
            Document id of the PERSISTED Attack Discovery under analysis, which
            equals its `kibana.alert.uuid`. Everything this workflow knows about the
            attack is read from that document rather than passed alongside the id.
        investigation_id:
          type: string
          maxLength: 128
          description: >-
            Conversation id of the Investigation the review opened for this attack.
            Read to confirm it exists before analysing; this workflow writes nothing
            to it, because the verdict attachment is the review's to write.
      # The whole input surface: space comes from `workflow.spaceId`, attempt
      # identity from `execution.id`, and everything about the attack from the
      # loaded document, so no caller can pass a stale copy of any of them.
      required:
        - attack_discovery_id
        - investigation_id
      additionalProperties: false
# The analyst-facing payload, matching the `security.attack_discovery.verdict`
# attachment (elastic/kibana#291932). `workflow.output` validates against this
# schema and fails the run on a mismatch.
#
# JSON Schema form rather than the legacy `- name:` array: only this form carries
# `maxLength`, which the legacy conversion silently drops.
outputs:
  properties:
    # Not an `enum` of the three, though that is where it belongs: the editor
    # type-checks the SOURCE of `workflow.output` `with:` values, so an enum
    # rejects the `"{{ ... }}"` template below. `require_supported_verdict` applies
    # it at runtime instead. Length caps have no such problem.
    #
    # `failed` is never emitted here; the review derives it from a failed run.
    verdict:
      type: string
    # Body markdown only — the attachment renders the verdict heading itself.
    #
    # Capped to the attachment's own `max(8000)`. Oversize would otherwise complete
    # the child and then fail `attach_verdict`, which continues on failure, letting
    # `apply_verdict` close or escalate with no evidence attached. The agent schema
    # applies the same bound upstream, so only a malformed agent answer can hit
    # this; when it does, it is loud.
    summary_markdown:
      type: string
      maxLength: 8000
    # Optional, body markdown only, capped to the attachment's `max(50_000)`.
    rationale_markdown:
      type: string
      maxLength: 50000
    # This attempt's execution id, so a verdict traces back to the run that
    # produced it.
    analysis_execution_id:
      type: string
    # Read off the loaded document, so the caller can confirm the payload describes
    # the attack it asked about.
    attack_discovery_id:
      type: string
  # Without these the review cannot tell a partial payload from a whole one, and
  # would pair a real verdict with its "analysis failed" summary.
  #
  # No `additionalProperties: false`: richer execution output may be added later
  # without breaking the contract.
  required:
    - verdict
    - summary_markdown
consts:
  # Enforced by `require_supported_verdict`. `failed` is absent deliberately: it is
  # an execution state the review derives, not a classification.
  supported_verdicts:
    - false_positive
    - true_positive
    - inconclusive
  # The degradation verdict `resolve_analysis` maps an absent structured output
  # onto. Same value as the third entry above; spelled out because Liquid's
  # `default:` needs a literal.
  inconclusive: inconclusive
  # Liquid has no array literal; `| default: consts.no_items` guards the
  # document-sourced arrays in `prepare_evidence`. Same idiom as the review.
  no_items: []
steps:
  # Loaded rather than received, so a retry cannot reason over a copy that went
  # stale. `ids` works because a persisted discovery is indexed under its
  # `kibana.alert.uuid`, making `_id` the same value.
  #
  # A required source, so no `on-failure`: a failed search fails the run, which the
  # review records as `failed`.
  - name: load_attack_discovery
    type: elasticsearch.search
    with:
      index: .adhoc.alerts-security.attack.discovery.alerts-{{ workflow.spaceId }}
      size: 1
      query:
        ids:
          values:
            - "{{ inputs.attack_discovery_id }}"

  # An empty search SUCCEEDS, so the step above cannot catch an id that names no
  # document.
  - name: require_attack_discovery
    type: workflow.fail
    if: "${{ steps.load_attack_discovery.output.hits.total.value == 0 }}"
    with:
      message: >-
        No persisted Attack Discovery found for id
        "{{ inputs.attack_discovery_id }}" in space {{ workflow.spaceId }}.
        Required source unavailable; no classification was produced.

  # A required source, so no `on-failure`. A metadata READ and nothing else:
  # posting to this conversation, or running `ai.agent` against it, wakes the
  # Investigation agent — the analysis runs on its own backing conversation.
  - name: load_investigation
    type: ai.conversation.metadata.read
    with:
      conversation_id: "{{ inputs.investigation_id }}"

  # The analysis body. Bounded evidence is pre-built first so the agent call needs
  # no tool belt and no follow-up questions (the alert_analysis batching rationale,
  # #292579): one prompt, one structured answer.
  #
  # Everything comes from the loaded document, never from `inputs`, so a retry
  # cannot reason over a caller-supplied stale copy. Arrays default to empty rather
  # than to the string "[]" — Liquid has no array literal.
  - name: prepare_evidence
    type: data.set
    with:
      attack_title: "{{ steps.load_attack_discovery.output.hits.hits[0]._source.attack_title | default: '' }}"
      attack_summary: "{{ steps.load_attack_discovery.output.hits.hits[0]._source.attack_summary | default: steps.load_attack_discovery.output.hits.hits[0]._source.message | default: '' | truncate: 8000, '' }}"
      entities: "${{ steps.load_attack_discovery.output.hits.hits[0]._source.related_entities | default: consts.no_items }}"
      alert_ids: "${{ steps.load_attack_discovery.output.hits.hits[0]._source.alert_ids | default: consts.no_items }}"
      investigation_status: "{{ steps.load_investigation.output.status | default: 'unknown' }}"

  # One tool-less agent call classifies the correlation. `connector-id-by-feature`
  # routes to the AlertZero agentic connector; keep in sync with
  # ALERTZERO_AGENTIC_INFERENCE_FEATURE_ID in @kbn/alertzero-common (the
  # rule_tuning_review pattern). `plugin-id`/`aggregate-by` are per-Worker cost
  # attribution under the shared AlertZero parent.
  #
  # Its own backing conversation (`create-conversation: true`, no
  # `conversation_id`): against the Investigation's conversation it would wake the
  # Investigation agent.
  - name: analyze
    type: ai.agent
    connector-id-by-feature: alertzero_agentic
    plugin-id: alertzero_attack_discovery_fp_tp
    aggregate-by: alertzero_parent
    timeout: "10m"
    # An agent failure after the workflow's retries degrades to `inconclusive` in
    # `resolve_analysis` rather than failing the run: the review can act on
    # "inconclusive" and record why, but a failed child would leave the
    # Investigation with no payload at all.
    on-failure:
      continue: true
    create-conversation: true
    with:
      # The evidence is pre-built and bounded, so the tool belt is dead weight and
      # prompt cost (same rationale as alert_analysis's batched agent calls).
      configuration_overrides:
        enable_elastic_capabilities: false
        tools: []
        skill_ids: []
      message: |-
        You are judging ONE Attack Discovery. Decide whether its correlation is
        supported by the evidence, and answer ONLY through the structured output.

        Attack title: {{ steps.prepare_evidence.output.attack_title }}
        Attack summary: {{ steps.prepare_evidence.output.attack_summary }}
        Entities: {{ steps.prepare_evidence.output.entities | join: ", " }}
        Correlated alert ids: {{ steps.prepare_evidence.output.alert_ids | join: ", " }}
        Investigation status: {{ steps.prepare_evidence.output.investigation_status }}

        Return false_positive when the evidence contradicts the correlation,
        true_positive when the evidence supports it, and inconclusive when the
        evidence is insufficient to decide — do not guess. Keep the summary under
        8000 characters and, when you justify the verdict, the rationale under
        50000.
      schema:
        type: object
        properties:
          verdict:
            type: string
            enum:
              - false_positive
              - true_positive
              - inconclusive
          confidence:
            type: number
            minimum: 0
            maximum: 1
          summary_markdown:
            type: string
            maxLength: 8000
          rationale_markdown:
            type: string
            maxLength: 50000
        required:
          - verdict
          - summary_markdown

  # The single place the agent result is interpreted. An absent structured output
  # (the `on-failure: continue` path) IS `inconclusive`: the review cannot tell a
  # degradation from a classification, and `inconclusive` asserts nothing about
  # the attack. The same degradation substitutes an honest summary, so the
  # attachment never renders an empty analyst-facing payload.
  #
  # Split from `check_payload` because Liquid has no `not` and no parentheses, so
  # the failure condition cannot be the inline negation of the check.
  - name: resolve_analysis
    type: data.set
    with:
      verdict: "{{ steps.analyze.output.structured_output.verdict | default: consts.inconclusive }}"
      summary_markdown: "{{ steps.analyze.output.structured_output.summary_markdown | default: 'FP/TP analysis could not reach a classification for this attack: the agent call did not return a usable verdict. Returned inconclusive, which asserts nothing about the attack.' }}"

  # The contract boundary: it checks what the analysis produced, so the agent step
  # is held to the same payload the review consumes.
  - name: check_payload
    type: data.set
    with:
      payload_valid: "${{ consts.supported_verdicts contains steps.resolve_analysis.output.verdict and steps.resolve_analysis.output.summary_markdown != blank }}"

  # An analysis with no usable classification has classified nothing. Emitting it
  # would instead send an unknown verdict through the review's switch, whose default
  # arm does nothing.
  #
  # `== false` rather than a bare negation, so an undefined never fires this.
  - name: require_supported_verdict
    type: workflow.fail
    if: "${{ steps.check_payload.output.payload_valid == false }}"
    with:
      message: >-
        FP/TP analysis produced no usable payload for Attack Discovery
        "{{ inputs.attack_discovery_id }}": verdict
        "{{ steps.resolve_analysis.output.verdict }}" is not one of
        {{ consts.supported_verdicts | join: ", " }}, or the summary was empty.
        No classification was produced.

  # `workflow.execute` resolves to the child's `context.output`, so a child with no
  # `workflow.output` step hands its parent nothing.
  #
  # Always `completed`: the failure path fails the run rather than reaching here,
  # which is what keeps `failed` out of the emitted verdict.
  - name: emit_result
    type: workflow.output
    status: completed
    with:
      verdict: "{{ steps.resolve_analysis.output.verdict }}"
      summary_markdown: "{{ steps.resolve_analysis.output.summary_markdown }}"
      # `${{ }}`, not `{{ }}`: `{{ }}` stringifies undefined to `""`, and the
      # attachment null-checks the field, so an empty string would render an empty
      # `## Rationale` section.
      rationale_markdown: "${{ steps.resolve_analysis.output.rationale_markdown }}"
      analysis_execution_id: "{{ execution.id }}"
      # From the document, not `inputs`.
      attack_discovery_id: "{{ steps.load_attack_discovery.output.hits.hits | map: '_id' | first }}"
