version: "1"
name: Suspend process
description: >
  AlertZero action: suspends a process on an Elastic Defend endpoint.
  Executed by the investigation proposal gate once an analyst approves, so
  the response action is attributed to the approver.
enabled: true
tags:
  # Generic tag every action workflow carries, so the catalog can be
  # discovered by tag rather than a hardcoded list.
  - action
  - alertzero
consts:
  # Self-describing catalog metadata, read back by the catalog when a
  # proposal referencing this workflow is created or rendered. Metadata has
  # to live under `consts`: unknown top-level keys are stripped by the schema.
  actionMetadata:
    name: Suspend process
    description: Suspends a process on an Elastic Defend endpoint, identified by PID or entity_id.
    category: contain
    impact: medium
    reversible: false
    approvalPolicy: always-gate
  actionLabel: Suspend process
triggers:
  - type: manual
    inputs:
      properties:
        actionInput:
          type: object
          description: >
            Suspend-process fields. Every action workflow takes a single `actionInput`
            object so the generic gate workflow never needs to know an
            action's parameter names.
          properties:
            endpoint_ids:
              type: array
              minItems: 1
              maxItems: 250
              items:
                type: string
                minLength: 1
                maxLength: 256
              description: Elastic Defend agent IDs (agent.id) of the endpoints.
            parameters:
              type: object
              description: Process selector. Provide either pid or entity_id.
              oneOf:
                - required:
                    - pid
                  properties:
                    pid:
                      type: integer
                      minimum: 1
                      description: Process ID (PID) of the process to suspend.
                - required:
                    - entity_id
                  properties:
                    entity_id:
                      type: string
                      minLength: 1
                      maxLength: 256
                      description: Elastic Defend entity_id of the process to suspend.
            comment:
              type: string
              maxLength: 30000
              description: Optional comment.
          required:
            - endpoint_ids
            - parameters
      required:
        - actionInput
      additionalProperties: false
outputs:
  - name: action_id
    type: string
  - name: status
    type: string
  - name: was_successful
    type: boolean
  - name: message
    type: string
steps:
  # POST queues the command; 200 means accepted, not that the process is suspended.
  # kibana.request is sent verbatim, so the path is prefixed with the executing space.
  - name: dispatch
    type: kibana.request
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
    with:
      method: POST
      path: "/s/{{ workflow.spaceId }}/api/endpoint/action/suspend_process"
      headers:
        kbn-xsrf: "true"
        elastic-api-version: "2023-10-31"
        Content-Type: application/json
      body:
        endpoint_ids: "${{ inputs.actionInput.endpoint_ids }}"
        parameters: "${{ inputs.actionInput.parameters }}"
        comment: "{{ inputs.actionInput.comment }}"
        agent_type: endpoint

  # Poll until the endpoint reports completion.
  # 10s interval, 60 attempts, 10 minutes. Do-while: the first GET always runs.
  - name: poll
    type: while
    condition: "${{ steps.poll_status.output.data.isCompleted != true }}"
    max-iterations:
      limit: 60
      on-limit: fail
    timeout: 10m
    steps:
      - name: poll_status
        type: kibana.request
        on-failure:
          retry:
            max-attempts: 3
            delay: 5s
        with:
          method: GET
          path: "/s/{{ workflow.spaceId }}/api/endpoint/action/{{ steps.dispatch.output.data.id }}"
          headers:
            kbn-xsrf: "true"
            elastic-api-version: "2023-10-31"
      - name: wait_if_pending
        type: if
        condition: "${{ steps.poll_status.output.data.isCompleted != true }}"
        steps:
          - name: poll_delay
            type: wait
            with:
              duration: 10s

  # `workflow.execute` declares its output as unknown, so the parent falls back
  # to a heuristic read of the last step unless the child emits explicitly.
  - name: emit_result
    type: workflow.output
    status: completed
    with:
      action_id: "{{ steps.poll_status.output.data.id }}"
      status: "{{ steps.poll_status.output.data.status }}"
      was_successful: "${{ steps.poll_status.output.data.wasSuccessful }}"
      message: "{% if steps.poll_status.output.data.wasSuccessful %}{{ consts.actionLabel }} completed successfully. Action ID: {{ steps.poll_status.output.data.id }}{% else %}{{ consts.actionLabel }} failed. Action ID: {{ steps.poll_status.output.data.id }}{% endif %}"
