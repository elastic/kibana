version: "1"
name: Suspend process
description: >
  AlertZero action: suspends a process on an Elastic Defend endpoint.
enabled: true
tags:
  - action
  - alertzero
consts:
  actionMetadata:
    name: Suspend process
    description: Suspends a process on an endpoint via the Elastic Defend response action. Reversible alternative to kill when the evidence is strong but you want to retain the process for investigation.
    category: contain
    impact: medium
    reversible: true
    approvalPolicy: always-gate
triggers:
  - type: manual
    inputs:
      properties:
        actionInput:
          type: object
          description: >
            Suspend-process parameters. Every action workflow takes a single
            `actionInput` object so the generic gate workflow never needs to
            know an action's parameter names.
          properties:
            endpoint_ids:
              type: array
              items:
                type: string
              description: Elastic Defend agent IDs (agent.id) of the endpoints.
            parameters:
              type: object
              description: Process selector — provide exactly one of pid or entity_id.
              properties:
                pid:
                  type: number
                  description: Process ID (PID) of the process to suspend.
                entity_id:
                  type: string
                  description: Elastic Defend entity_id of the process to suspend.
            comment:
              type: string
              description: Optional comment.
          required:
            - endpoint_ids
            - parameters
      required:
        - actionInput
      additionalProperties: false
outputs:
  - name: action_id
    type: string
  - name: was_successful
    type: boolean
  - name: message
    type: string
steps:
  - name: suspend_process
    type: security.endpointSuspendProcess
    with:
      endpoint_ids: "${{ inputs.actionInput.endpoint_ids }}"
      parameters: "${{ inputs.actionInput.parameters }}"
      comment: "{{ inputs.actionInput.comment | default: '' }}"

  # `workflow.execute` declares its output as unknown, so the parent falls back
  # to a heuristic read of the last step unless the child emits explicitly.
  - name: emit_result
    type: workflow.output
    status: completed
    with:
      action_id: "{{ steps.suspend_process.output.action_id }}"
      was_successful: "${{ steps.suspend_process.output.was_successful }}"
      message: "{{ steps.suspend_process.output.message }}"
