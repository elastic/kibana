version: "1"
name: Endpoint analysis
description: >
  Per-space forensics worker. Finds pending `security.analyze_endpoint` knowledge
  indicators in this space and dispatches the global endpoint analysis workflow for
  each one, which reconstructs the attack timeline, extracts IoCs, attaches the
  findings to the investigation, and proposes any justified containment actions for
  human approval.
enabled: false
tags:
  - watch
  - watch-forensics

settings:
  # A concurrency group is (key, spaceId): every slot query filters on the
  # execution's own space, so a constant key already means one sweep per space
  # rather than one across the deployment. One at a time: overlapping ticks would
  # dispatch the same pending indicators twice.
  concurrency:
    key: endpoint-analysis-sweep
    strategy: drop
    max: 1

triggers:
  # This worker owns the per-space sweep cadence; the analysis it dispatches stays
  # manual-only so there is one scheduler authority and no cross-space collision.
  # The interval is deliberately not a Worker setting: it is the poll rate of an
  # indicator queue rather than a knob an analyst tunes, and what actually bounds
  # the work is the batch below plus the child's per-indicator concurrency.
  - type: scheduled
    with:
      every: "1m"
  - type: manual
    inputs:
      properties:
        ai_index_id:
          type: string
          maxLength: 256
          # This is interpolated into the search target below, where a comma or a
          # `*` is valid multi-target syntax — so a length bound alone would let a
          # manual run point the sweep at indices outside the AI index. Mirrors
          # AI_INDEX_ID_PATTERN in the context engine, which is what an AI index id
          # is checked against when one is created.
          pattern: "^[a-z0-9][a-z0-9_-]*$"
          description: "AI index that holds the indicators. Default: security-investigations."
        batch_size:
          type: integer
          minimum: 1
          maximum: 2
          description: "How many new analysis runs to start per sweep. Default: 2."
        lookback_days:
          type: integer
          minimum: 1
          maximum: 90
          description: "How many days back the sweep looks for indicators, by creation time. Default: 7."
      additionalProperties: false

outputs:
  properties:
    pending:
      type: number
    started:
      type: number
    dispatch_failed:
      type: number
    search_failed:
      type: boolean

consts:
  worker_settings:
    settingsVersion: __WORKER_SETTINGS_VERSION__
    autonomy: "__WORKER_AUTONOMY_LEVEL__"
  ai_index_id: security-investigations
  batch_size: 2
  lookback_days: 7
  # Liquid has no array literal, so `| default: []` falls back to nothing at all
  # rather than to an empty array. A const is the only way to spell that fallback.
  no_rows: []

steps:
  - name: resolve_batch_size
    type: data.set
    with:
      size: "${{ inputs.batch_size | default: consts.batch_size }}"

  # Oldest first so an indicator about to leave the lookback window is dispatched
  # first. Scoped to this space: the indicator index is shared across spaces, and
  # each space's own worker is the opt-in gate for the hosts it covers.
  - name: search_pending_indicators
    type: elasticsearch.search
    on-failure:
      continue: true
    with:
      index: "ai-index-idx-{{ inputs.ai_index_id | default: consts.ai_index_id }}"
      ignore_unavailable: true
      allow_no_indices: true
      size: "${{ steps.resolve_batch_size.output.size }}"
      # The KI's own id, which is what `context-engine.updateKi` resolves a write on.
      # It happens to equal `_id` for the index-backed AI index `createKi` creates by
      # default, but not for a data-stream-backed one, where `_id` identifies a single
      # revision. Carrying it keeps the dispatch correct either way.
      _source:
        - id
      sort:
        - "@timestamp":
            order: asc
            unmapped_type: date
      query:
        bool:
          filter:
            - term:
                type: security.analyze_endpoint
            - term:
                attributes.status: pending
            - term:
                attributes.space_id: "{{ workflow.spaceId }}"
            - range:
                "@timestamp":
                  gte: "now-{{ inputs.lookback_days | default: consts.lookback_days }}d"

  - name: resolve_dispatch_batch
    type: data.set
    with:
      indicators: "${{ steps.search_pending_indicators.output.hits.hits | default: consts.no_rows | slice: 0, steps.resolve_batch_size.output.size }}"

  # `workflow.executeAsync` resolves the child in this worker's space and falls back
  # to the global space, so the globally installed analysis is found and runs with
  # this space's id — which is why it can keep using `workflow.spaceId` for its
  # alert indices. Async because a forensic run takes up to 15m: a synchronous call
  # would hold this worker's only concurrency slot for that whole time and stack
  # every later tick behind it.
  # An indicator stays pending until the child retires it, so the next tick
  # re-dispatches the same one; the child's per-indicator drop concurrency collapses
  # those duplicates. Because the batch is always the oldest pending indicators,
  # that also caps this space at `batch_size` analyses in flight.
  # `parallel` rather than `foreach` for the sake of the counts below: a `foreach`
  # keeps only its last iteration's output and publishes no aggregate, so there is
  # no way to tell from the far side how many dispatches were actually accepted.
  # Settled gives the same "one rejection must not cost the rest of the batch"
  # guarantee as `on-failure: continue`, but records each branch's outcome instead
  # of clearing it — which is what makes a failed dispatch reportable.
  - name: start_runs
    type: parallel
    foreach: "${{ steps.resolve_dispatch_batch.output.indicators | default: consts.no_rows }}"
    mode: settled
    concurrency:
      # Covers consts.batch_size, which the input can only lower.
      max: 2
    steps:
      - name: start_run
        type: workflow.executeAsync
        with:
          workflow-id: system-security-forensics-run-endpoint-analysis
          inputs:
            # The KI's own id, falling back to `_id` for a document written before
            # `createKi` stamped one. `updateKi` resolves on the `id` field and only
            # falls back to `_id` for documents that have none, so handing it the
            # revision `_id` of a data-stream-backed index would leave every write
            # unresolved and the indicator pending forever.
            ki_id: "{{ foreach.item._source.id | default: foreach.item._id }}"
            ai_index_id: "{{ inputs.ai_index_id | default: consts.ai_index_id }}"

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      pending: "${{ steps.search_pending_indicators.output.hits.total.value | default: 0 }}"
      # Runs actually accepted by the child, not indicators we tried to hand off.
      # An empty batch finishes the fan-out with a zero aggregate, so the common
      # nothing-pending tick reports 0 here without any special casing.
      started: "${{ steps.start_runs.output.succeeded | default: 0 }}"
      # The signal a silent dispatch failure would otherwise cost us. Those
      # indicators stay pending and the next tick retries them, so a non-zero value
      # is not data loss — but a value that stays non-zero is a real fault.
      dispatch_failed: "${{ steps.start_runs.output.failed | default: 0 }}"
      search_failed: "${{ steps.search_pending_indicators.error != null }}"
