version: "1"
name: Endpoint analysis
description: >
  Finds pending `security.analyze_endpoint` knowledge indicators created in this
  space and starts at most one Endpoint analysis run. Skips the sweep's dispatch
  when an analysis is already in flight. Does not write to indicators. One run
  is one sweep. This worker owns the per-space cadence; the child stays
  manual-only.
enabled: false
tags:
  - watch
  - watch-forensics
settings:
  # One sweep per space at a time. Two sweeps at once can start two runs for
  # one indicator; the child's drop concurrency is the backstop.
  concurrency:
    key: endpoint-analysis
    strategy: drop
    max: 1
triggers:
  # This worker is the single scheduler for the space. Keep manual so a sweep
  # can be kicked on demand without waiting for the next interval.
  - type: scheduled
    with:
      every: "__WORKER_SCHEDULE_INTERVAL__"
  - type: manual
    inputs:
      properties:
        ai_index_id:
          type: string
          maxLength: 256
          description: "AI index that holds the indicators. Default: security-investigations."
        max_open_checks:
          type: integer
          minimum: 1
          maximum: 1
          description: "Maximum number of active analysis runs in this space. Default: 1."
        batch_size:
          type: integer
          minimum: 1
          maximum: 1
          description: "How many new analysis runs to start per sweep. Default: 1."
        lookback_days:
          type: integer
          minimum: 1
          maximum: 90
          description: "How many days back the sweep looks for indicators, by creation time. Default: 7."
      additionalProperties: false
outputs:
  properties:
    pending:
      type: number
    started:
      type: number
    in_flight:
      type: number
    search_failed:
      type: boolean
    lookup_failed:
      type: boolean
consts:
  worker_settings:
    settingsVersion: __WORKER_SETTINGS_VERSION__
    autonomy: "__WORKER_AUTONOMY_LEVEL__"
    scheduleInterval: "__WORKER_SCHEDULE_INTERVAL__"
  ai_index_id: security-investigations
  max_open_checks: 1
  batch_size: 1
  lookback_days: 7
  # Liquid has no empty-list literal. `| default: []` returns nothing.
  no_rows: []

steps:
  # Count analysis runs that are active in this space. The child allows only
  # one. If this request fails, the sweep continues with a count of zero; the
  # child's drop concurrency still blocks a second run.
  - name: list_active_runs
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/api/workflows/workflow/system-security-forensics-endpoint-analysis-run/executions?statuses=pending&statuses=queued&statuses=waiting&statuses=waiting_for_input&statuses=waiting_for_child&statuses=running&size=100"
      headers:
        elastic-api-version: "2023-10-31"

  - name: collect_active_runs
    type: data.set
    with:
      count: "${{ steps.list_active_runs.output.results | default: consts.no_rows | size }}"

  - name: resolve_free_slots
    type: data.set
    with:
      free: "${{ inputs.max_open_checks | default: consts.max_open_checks | minus: steps.collect_active_runs.output.count | at_least: 0 }}"

  - name: resolve_batch_size
    type: data.set
    with:
      size: "${{ inputs.batch_size | default: consts.batch_size }}"

  # Oldest first so an indicator about to leave the lookback window is reviewed
  # first. `_source` is not read; only `_id` is passed to the child.
  - name: search_pending_indicators
    type: elasticsearch.search
    on-failure:
      continue: true
    with:
      index: "ai-index-idx-{{ inputs.ai_index_id | default: consts.ai_index_id }}"
      size: 1
      _source: false
      sort:
        - "@timestamp":
            order: asc
            unmapped_type: date
      query:
        bool:
          filter:
            - term:
                type: security.analyze_endpoint
            - term:
                attributes.status: pending
            - term:
                attributes.space_id: "{{ workflow.spaceId }}"
            - range:
                "@timestamp":
                  gte: "now-{{ inputs.lookback_days | default: consts.lookback_days }}d"

  - name: resolve_dispatch_batch
    type: data.set
    with:
      indicators: "${{ steps.search_pending_indicators.output.hits.hits | default: consts.no_rows | slice: 0, steps.resolve_free_slots.output.free | slice: 0, steps.resolve_batch_size.output.size }}"

  - name: start_runs
    type: foreach
    foreach: "${{ steps.resolve_dispatch_batch.output.indicators | default: consts.no_rows }}"
    steps:
      - name: start_run
        type: workflow.executeAsync
        on-failure:
          continue: true
        with:
          workflow-id: system-security-forensics-endpoint-analysis-run
          inputs:
            ki_id: "{{ foreach.item._id }}"
            ai_index_id: "{{ inputs.ai_index_id | default: consts.ai_index_id }}"

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      pending: "${{ steps.search_pending_indicators.output.hits.total.value | default: 0 }}"
      started: "${{ steps.resolve_dispatch_batch.output.indicators | default: consts.no_rows | size }}"
      in_flight: "${{ steps.collect_active_runs.output.count }}"
      search_failed: "${{ steps.search_pending_indicators.error != null }}"
      lookup_failed: "${{ steps.list_active_runs.error != null }}"
