version: "1"
name: Endpoint analysis
description: >
  Per-space forensics worker. Finds pending `security.analyze_endpoint` knowledge
  indicators in this space and dispatches the global endpoint analysis workflow for
  each one, which reconstructs the attack timeline, extracts IoCs, attaches the
  findings to the investigation, and proposes any justified containment actions.
  Manual autonomy waits for approval; supervised carries them out.
enabled: false
tags:
  - watch
  - watch-forensics

settings:
  # Concurrency is keyed per (key, spaceId), so a constant key means one
  # sweep per space, not one across the whole deployment. Capped at 1 so
  # overlapping ticks can't dispatch the same pending indicators twice.
  concurrency:
    key: endpoint-analysis-sweep
    strategy: drop
    max: 1

triggers:
  # This worker owns the sweep cadence per space; the analysis it dispatches
  # stays manual-only so there's a single scheduler and no cross-space
  # collisions. The interval isn't exposed as a Worker setting — it's a queue
  # poll rate, not something an analyst should tune. The batch size below and
  # the child's per-indicator concurrency are what actually bound the work.
  - type: scheduled
    with:
      every: "1m"
  - type: manual
    inputs:
      properties:
        ai_index_id:
          type: string
          maxLength: 256
          # Mirrors AI_INDEX_ID_PATTERN in the context engine, which is what an AI index id
          # is checked against when one is created.
          pattern: "^[a-z0-9][a-z0-9_-]*$"
          description: "AI index that holds the indicators. Default: security-investigations."
        batch_size:
          type: integer
          minimum: 1
          maximum: 2
          description: "How many new analyses runs to start per sweep. Default: 2."
        lookback_days:
          type: integer
          minimum: 1
          maximum: 90
          description: "How many days back the sweep looks for indicators, by creation time. Default: 7."
      additionalProperties: false

outputs:
  properties:
    pending:
      type: number
    started:
      type: number
    dispatch_failed:
      type: number
    search_failed:
      type: boolean

consts:
  worker_settings:
    settingsVersion: __WORKER_SETTINGS_VERSION__
    autonomy: "__WORKER_AUTONOMY_LEVEL__"
  ai_index_id: security-investigations
  batch_size: 2
  lookback_days: 7
  # Liquid has no array literal, so `| default: []` falls back to nothing at all
  # rather than to an empty array. A const is the only way to spell that fallback.
  no_rows: []

steps:
  - name: resolve_batch_size
    type: data.set
    with:
      size: "${{ inputs.batch_size | default: consts.batch_size }}"

  # Oldest first, so an indicator about to leave the lookback window is
  # dispatched first. Scoped to this space, since the indicator index is
  # shared across spaces and each space's own worker gates its own hosts.
  - name: search_pending_indicators
    type: elasticsearch.search
    on-failure:
      continue: true
    with:
      index: "ai-index-idx-{{ inputs.ai_index_id | default: consts.ai_index_id }}"
      ignore_unavailable: true
      allow_no_indices: true
      size: "${{ steps.resolve_batch_size.output.size }}"
      # The KI's own id, which is what `context-engine.updateKi` writes to. For
      # an index-backed AI index this happens to equal `_id`.
      _source:
        - id
      sort:
        - "@timestamp":
            order: asc
            unmapped_type: date
      query:
        bool:
          filter:
            - term:
                type: security.analyze_endpoint
            - term:
                attributes.status: pending
            - term:
                attributes.space_id: "{{ workflow.spaceId }}"
            - range:
                "@timestamp":
                  gte: "now-{{ inputs.lookback_days | default: consts.lookback_days }}d"

  - name: resolve_dispatch_batch
    type: data.set
    with:
      indicators: "${{ steps.search_pending_indicators.output.hits.hits | default: consts.no_rows | slice: 0, steps.resolve_batch_size.output.size }}"

  # `workflow.executeAsync` looks for the child in this worker's space first,
  # falling back to the global space where the analysis is actually installed
  # so it still runs with this space's id. Async because a forensic run takes
  # up to 15m, and a synchronous call would hold this worker's only concurrency
  # slot that whole time, queuing every later tick behind it.
  #
  # An indicator stays pending until the child retires it, so the next tick
  # re-dispatches it too; the child's per-indicator drop concurrency collapses
  # those duplicates. Since the batch is always the oldest pending indicators,
  # this also caps the space at `batch_size` analyses in flight.
  #
  # Uses `parallel`, not `foreach`, so the counts below are accurate — `foreach`
  # only keeps its last iteration's output, not a count of all of them.
  # `mode: settled` keeps one failed dispatch from blocking the rest of the
  # batch, like `on-failure: continue`, but still reports each outcome.
  - name: start_runs
    type: parallel
    foreach: "${{ steps.resolve_dispatch_batch.output.indicators | default: consts.no_rows }}"
    mode: settled
    concurrency:
      # Covers consts.batch_size, which the input can only lower.
      max: 2
    steps:
      # The child workflow reads autonomy from the KI. Only a scheduled
      # execution writes the saved watch setting, which may be supervised.
      # Every other trigger, including a manual run of this worker, writes
      # `manual`, so containment waits for approval.
      - name: set_ki_autonomy
        type: context-engine.updateKi
        on-failure:
          continue: true
        with:
          ai_index_id: "{{ inputs.ai_index_id | default: consts.ai_index_id }}"
          ki_id: "{{ foreach.item._source.id | default: foreach.item._id }}"
          ki:
            attributes:
              autonomy: "{%- if execution.triggeredBy == 'scheduled' -%}{{ consts.worker_settings.autonomy }}{%- else -%}manual{%- endif -%}"
      - name: start_run
        type: workflow.executeAsync
        if: "${{ steps.set_ki_autonomy.error == null }}"
        with:
          workflow-id: system-security-forensics-run-endpoint-analysis
          inputs:
            ki_id: "{{ foreach.item._source.id | default: foreach.item._id }}"
            ai_index_id: "{{ inputs.ai_index_id | default: consts.ai_index_id }}"

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      pending: "${{ steps.search_pending_indicators.output.hits.total.value | default: 0 }}"
      # Dispatches accepted, not analyses begun: a dropped duplicate still marks
      # the child SKIPPED and returns normally, so `executeAsync` succeeds and
      # counts here too. That means the same indicator gets counted again on
      # every tick while its 15m analysis holds the slot. Read this as
      # hand-off attempts that weren't outright rejected, and look at the
      # child's own execution records for the actual analyses. An empty
      # batch just reports 0 here, with no special-casing needed.
      started: "${{ steps.start_runs.output.succeeded | default: 0 }}"
      # Counts only a dispatch the engine refused outright, which a dropped duplicate is
      # not. Those indicators stay pending and the next tick retries them, so a non-zero
      # value is not data loss — but a value that stays non-zero is a real fault.
      dispatch_failed: "${{ steps.start_runs.output.failed | default: 0 }}"
      search_failed: "${{ steps.search_pending_indicators.error != null }}"
