version: "1"
name: Create detection rule
description: >
  AlertZero action: creates an ES|QL detection rule and enables it. Executed by
  the investigation proposal gate once an analyst approves, so the rule is
  attributed to the approver.
enabled: true
tags:
  # Generic tag every action workflow carries, so the catalog can be
  # discovered by tag rather than a hardcoded list.
  - action
  - alertzero
consts:
  # Self-describing catalog metadata, read back by the proposals service when a
  # proposal referencing this workflow is created or rendered. Metadata has to
  # live under `consts`: unknown top-level keys are stripped by the schema.
  actionMetadata:
    name: Create detection rule
    description: Creates a new ES|QL detection rule and enables it.
    category: configure
    impact: low
    reversible: true
    approvalPolicy: always-gate
triggers:
  - type: manual
    inputs:
      properties:
        actionInput:
          type: object
          description: >
            The create-rule request body as the creation worker drafts it,
            passed through to the API as is. Every action workflow takes a
            single `actionInput` object so the generic gate workflow never
            needs to know an action's parameter names.
          properties:
            type:
              type: string
              enum: ["esql"]
            language:
              type: string
              enum: ["esql"]
            name:
              type: string
              minLength: 1
              description: Rule name. Non-empty, as the detection engine requires.
            description:
              type: string
              minLength: 1
              description: Rule description. Non-empty, as the detection engine requires.
            query:
              type: string
              minLength: 1
              description: ES|QL query the rule runs; it names its own source.
            interval:
              type: string
            from:
              type: string
            to:
              type: string
            severity:
              type: string
              enum: ["low", "medium", "high", "critical"]
            risk_score:
              # Mirrors the engine's own `RiskScore`, an integer from 0 to 100. A
              # fractional score passes a bare `number` here and is only rejected
              # when the rule is created, after an analyst has already approved it.
              type: integer
              minimum: 0
              maximum: 100
            threat:
              type: array
              items:
                type: object
                additionalProperties: true
            tags:
              type: array
              items:
                type: string
          # The engine requires `severity` and `risk_score` on every rule, and the
          # body is passed through with no defaults, so a proposal without them
          # would only fail after an analyst approved it.
          required:
            - type
            - language
            - name
            - description
            - query
            - severity
            - risk_score
          additionalProperties: false
      required:
        - actionInput
      additionalProperties: false
outputs:
  - name: ruleId
    type: string
  - name: ruleName
    type: string
  - name: enabled
    type: boolean
steps:
  # The approval is meant to close the coverage gap, and a disabled rule detects
  # nothing, so the rule is created enabled and starts running on its first
  # scheduled interval as the approver. Creating it enabled is a single API call
  # rather than a create followed by an enable: the privilege check and the API
  # key for the approver happen before the rule is saved, so an approver who may
  # not enable rules gets one error and no rule. The gate then re-offers the
  # proposal as it does for any failed action.
  #
  # Spelled out field by field, because the action owns `enabled` and the drafted
  # body cannot carry it (`actionInput` rejects unknown fields). An optional field
  # the draft omits renders as undefined and is dropped from the request.
  - name: create_rule
    type: security.createRule
    with:
      rule:
        type: "${{ inputs.actionInput.type }}"
        language: "${{ inputs.actionInput.language }}"
        name: "${{ inputs.actionInput.name }}"
        description: "${{ inputs.actionInput.description }}"
        query: "${{ inputs.actionInput.query }}"
        interval: "${{ inputs.actionInput.interval }}"
        from: "${{ inputs.actionInput.from }}"
        to: "${{ inputs.actionInput.to }}"
        severity: "${{ inputs.actionInput.severity }}"
        risk_score: "${{ inputs.actionInput.risk_score }}"
        threat: "${{ inputs.actionInput.threat }}"
        tags: "${{ inputs.actionInput.tags }}"
        enabled: true

  # `workflow.execute` declares its output as unknown, so the parent falls back
  # to a heuristic read of the last step unless the child emits explicitly.
  - name: emit_result
    type: workflow.output
    status: completed
    with:
      ruleId: "{{ steps.create_rule.output.id }}"
      ruleName: "{{ steps.create_rule.output.name }}"
      enabled: "${{ steps.create_rule.output.enabled }}"
