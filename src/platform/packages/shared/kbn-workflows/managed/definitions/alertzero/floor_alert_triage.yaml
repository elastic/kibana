version: "1"
name: Alert Triage
description: Watch Floor alert triage worker stub.
enabled: false
tags:
  - watch
  - watch-floor
triggers:
  - type: alert
  # Keep manual for desk testing without a rule execution.
  - type: manual
consts:
  worker_settings:
    settingsVersion: __WORKER_SETTINGS_VERSION__
    autonomy: "__WORKER_AUTONOMY_LEVEL__"
    autoCloseConfidenceScoreMinThreshold: __WORKER_AUTO_CLOSE_CONFIDENCE_MIN_THRESHOLD__
steps:
  - name: triage_alerts
    type: ai.agent
    agent-id: alertzero-thin-agent
    # INVARIANT: exactly one of these renders non-empty at execution time. connector_id is the
    # standalone path (uiSettings); AlertZero Workers pass connector_id_by_feature instead and
    # leave connector_id empty, so the model comes from Model Management. Populating BOTH is a
    # validation error at execution time — do not set connector_id_by_feature on the standalone path.
    connector-id-by-feature: alertzero_alert_triage
    # LLM spend attribution — plugin-id is a free-form telemetry label (no registry validation).
    plugin-id: alertzero_alert_triage
    aggregate-by: security_search_inference_parent
    timeout: "10m"
    create-conversation: true
    with:
      configuration_overrides:
        skill_ids:
          - alert-analysis
        tools:
          - tool_ids:
              - security.alertzero.actions.list
      message: >
        Triage the security alert context below. Prefer
        recall over precision when unsure. Return a structured
        classification.

        Alert / event context:
        {{ event | json }}
      schema:
        type: object
        properties:
          classification:
            type: string
            enum:
              - true_positive
              - false_positive
              - inconclusive
            description: Classification of the alert based on analysis
          confidence_score:
            type: number
            minimum: 0
            maximum: 1
            description: Confidence from 0.0–1.0
          rationale:
            type: string
