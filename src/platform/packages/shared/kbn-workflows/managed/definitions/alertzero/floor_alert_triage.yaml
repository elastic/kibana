version: "1"
name: Alert Triage
description: >
  AlertZero Worker that triages alert batches produced by detection rule
  executions. Classifies each alert as true_positive / false_positive /
  inconclusive using the Security Alert Analysis workflow, records the
  reasoning in an Investigation conversation, writes each verdict as an
  alert tag and note, and — gated by the Worker's autonomy level — closes
  false positives via a HITL proposal.
enabled: false
tags:
  - watch
  - watch-floor

settings:
  # Must exceed the proposal gate's ceiling. `system-create-alertzero-proposal` parks this run for up
  # to 72 h at Manual autonomy, and a failed or unauthorized attempt re-parks within the same
  # deadline, so the Worker Investigation lifecycle contract puts the ceiling at 168 h. The 6 h
  # default would kill the run mid-gate.
  timeout: '170h'

triggers:
  - type: alert
  # Keep manual for desk testing without a rule execution.
  - type: manual

consts:
  worker_settings:
    settingsVersion: __WORKER_SETTINGS_VERSION__
    autonomy: "__WORKER_AUTONOMY_LEVEL__"
    # Minimum confidence score for a false_positive verdict to qualify for
    # proposal / auto-close. Alerts below this floor are tagged and noted
    # but not proposed for closure (R6).
    autoCloseConfidenceScoreMinThreshold: __WORKER_AUTO_CLOSE_CONFIDENCE_MIN_THRESHOLD__

# =============================================================================
# Steps
# =============================================================================
#
# ORDERING IS LOAD-BEARING — do not rearrange.
#
# Preflight steps MUST stay above create_investigation: a disabled Alert Analysis path must
# not open an Investigation.
#
# Tags and notes MUST be written before the gate (`workflow.execute system-create-alertzero-proposal`).
# The gate parks this Worker for up to 72 h at Manual autonomy; anything sequenced after it
# is invisible to the analyst until a decision arrives.
#
# Pipeline:
#   1. require_analysis_enabled  — fail the run before create_investigation when the space
#                                  has Alert Analysis turned off
#   2. create_investigation      — open an Investigation conversation
#   3. attach_alerts             — attach the alert batch
#   4. classify_alerts           — run the classification sub-workflow
#   5. compute_fp_candidates     — filter verdicts to false_positive at or above the floor
#   6. attach_impact             — entity × verdict summary
#   7. set_az_tags               — static AZ classification tags (R5, always)
#   8. add_verdict_notes         — verdict + Investigation reference per alert (R4/R13, always)
#   9. gate_fp_close             — proposal gate and one branch per outcome (if any FP candidates)
#  10. close_investigation_no_fp — explicit close when there are no FP candidates
#
# Investigation narrative: progress and outcome lines use `ai.conversation.add_user_message`
# (elastic/kibana#293743) so they are recorded without running the Investigation's agent.

steps:
  # ---------------------------------------------------------------------------
  # 1. Abort before opening an Investigation when Alert Analysis is off in this
  #    space. Enablement is checked at Worker turn-on; this is the runtime
  #    complement for the case where the operator later turns analysis off and
  #    leaves the Worker running. Empty verdicts are not a substitute — the
  #    sub-workflow also returns [] when no connector resolves for the model tier.
  #
  #    Same runtime_config endpoint the analysis workflow reads. Fail-closed: a
  #    failed fetch after retries fails the run rather than creating a hollow
  #    Investigation.
  # ---------------------------------------------------------------------------
  - name: fetch_analysis_runtime_config
    type: kibana.request
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/security_solution/alert_analysis_workflow/runtime_config"
      headers:
        kbn-xsrf: string
        elastic-api-version: "1"
        Content-Type: application/json

  - name: require_analysis_enabled
    type: if
    condition: "${{ steps.fetch_analysis_runtime_config.output.workflowEnabled == false }}"
    steps:
      - name: abort_analysis_disabled
        type: workflow.fail
        with:
          message: >-
            Alert Triage requires Alert Analysis to be enabled in this space.
            Turn it on under Alert analysis settings, or turn this Worker off.

  # ---------------------------------------------------------------------------
  # 2. Open an Investigation conversation seeded from the `investigation`
  #    template. Seeds status, severity, and the workflow_execution_id that links
  #    the Investigation to this run.
  # ---------------------------------------------------------------------------
  - name: create_investigation
    type: ai.conversation.create
    with:
      template_id: investigation
      title: "Alert Triage — {{ event.rule.name }}"
      access_control:
        access_mode: public
      metadata:
        status: open
        severity: "{{ event.rule.severity | default: 'medium' }}"
        description: >-
          Automated triage of {{ event.alerts.size }} alert{% if event.alerts.size != 1 %}s{% endif %} from rule
          "{{ event.rule.name }}" ({{ event.rule.id }}).
        workflow_execution_id: "{{ execution.id }}"

  # ---------------------------------------------------------------------------
  # 3. Attach the analysed alerts to the Investigation in chunks of 20.
  #    security.alerts caps at 20 ids per call; foreach+chunk splits larger
  #    batches into multiple chips. render_inline: true so chips show in the
  #    Investigation flyout without a separate attachment panel.
  # ---------------------------------------------------------------------------
  - name: init_attach_chunk_tracking
    type: data.set
    with:
      failed_attach_chunk_count: 0
      total_attach_chunk_count: "${{ event.alerts | map: '_id' | chunk: 20 | size }}"

  - name: attach_alerts
    type: foreach
    foreach: "${{ event.alerts | map: '_id' | chunk: 20 | json }}"
    steps:
      - name: attach_alert_chunk
        type: ai.attachment.add
        on-failure:
          retry:
            max-attempts: 3
            delay: 5s
          continue: true
        with:
          conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
          type: security.alerts
          render_inline: true
          data:
            alertIds: "${{ foreach.item }}"
          description: "Alerts analysed in this triage run"

      # Retries exhaust before continue: true takes over, so an error here means this
      # chunk never attached — those alert ids have no evidence chip in the
      # Investigation. Counted so post_comment_triage_started reports accurate
      # coverage instead of unconditionally claiming every alert is attached.
      - name: record_attach_alert_chunk_failure
        type: data.set
        if: "${{ steps.attach_alert_chunk.error != blank }}"
        with:
          failed_attach_chunk_count: "${{ variables.failed_attach_chunk_count | plus: 1 }}"

  - name: post_comment_triage_started
    type: ai.conversation.add_user_message
    on-failure:
      continue: true
    with:
      conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
      message: |-
        Triage started for rule **{{ event.rule.name }}** ({{ event.alerts.size }} alert{% if event.alerts.size != 1 %}s{% endif %}). Model routed via the `alertzero_reasoning` Model Management feature.
        {% if variables.failed_attach_chunk_count > 0 %}
        ⚠️ {{ variables.failed_attach_chunk_count }} of {{ variables.total_attach_chunk_count }} alert chunk(s) failed to attach as evidence after retries; some alerts are not visible in this Investigation.
        {% else %}
        Alerts attached above.
        {% endif %}

        [View execution]({{ execution.url }})
  # ---------------------------------------------------------------------------
  # 4. Run the Security Alert Analysis sub-workflow.
  #
  #    autoCloseEnabled: false — the Worker owns the close decision (R11: every
  #    close is a Proposal, so the sub-workflow must not close inline).
  #
  #    calledByWorker: true — the sub-workflow classifies and tags but leaves the
  #    verdict note to this Worker (add_verdict_notes), so each alert gets one note.
  #
  #    connectorIdByFeature: alertzero_reasoning — the Reasoning tier rather than
  #    Fast. Each verdict drives a tag, a note, and potentially a HITL proposal, so
  #    classification quality matters more than throughput here. Operators pick the
  #    model for the tier in Stack Management → Model Settings.
  #
  #    autoCloseConfidenceScoreMinThreshold is passed through so the sub-workflow
  #    reports against the same floor this Worker applies in compute_fp_candidates.
  #
  #    investigationConversationId lets the sub-workflow post per-batch progress
  #    comments into the Investigation.
  # ---------------------------------------------------------------------------
  - name: classify_alerts
    type: workflow.execute
    on-failure:
      fallback:
        - name: post_comment_classify_failed
          type: ai.conversation.add_user_message
          on-failure:
            continue: true
          with:
            conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
            message: >-
              ⚠️ Classification step failed for {{ event.alerts.size }} alert{% if event.alerts.size != 1 %}s{% endif %}.
              The Alert Analysis workflow may be disabled, or `workflow.execute` threw.
              Alerts have NOT been tagged or closed.

        # Fallback handles the comment only. Without this fail the parent continues into
        # empty FP candidates and close_investigation_no_fp — a hollow "triage complete".
        - name: abort_classify_failed
          type: workflow.fail
          with:
            message: >-
              Alert Triage classification failed. The Alert Analysis workflow may be
              disabled in this deployment, or the sub-workflow threw. Alerts were not
              tagged or closed.
    with:
      workflow-id: system-security-alert-analysis
      inputs:
        # A child run has no trigger event of its own, so the batch must be passed
        # explicitly or the sub-workflow analyses nothing and returns empty verdicts.
        alerts: "${{ event.alerts }}"
        autoCloseEnabled: false
        autoCloseConfidenceScoreMinThreshold: "${{ consts.worker_settings.autoCloseConfidenceScoreMinThreshold }}"
        connectorIdByFeature: alertzero_reasoning
        calledByWorker: true
        investigationConversationId: "{{ steps.create_investigation.output.conversation_id }}"

  # ---------------------------------------------------------------------------
  # 5. Compute the FP candidate list: verdicts classified as false_positive
  #    at or above the configured confidence floor.
  # ---------------------------------------------------------------------------
  # The confidence floor is applied here rather than in the sub-workflow: this path passes
  # autoCloseEnabled: false, so the Worker owns the close decision (R11) and therefore owns
  # R6's threshold too. Built as a string first because the expression filters take a
  # pre-rendered predicate, matching `reject_exp` usage in alert_analysis_workflow.yaml.
  - name: build_fp_threshold_expr
    type: data.set
    with:
      fp_threshold_expr: "v.confidence_score >= {{ consts.worker_settings.autoCloseConfidenceScoreMinThreshold }}"

  - name: compute_fp_candidates
    type: data.set
    with:
      fp_candidate_ids: >-
        ${{ steps.classify_alerts.output.verdicts
            | where: 'classification', 'false_positive'
            | where_exp: 'v', variables.fp_threshold_expr
            | map: 'alert_id' }}

  # Counted in its own step so the filter above stays the single source of truth. Both
  # autonomy branches gate on this value, so leaving it unset makes every run a silent
  # no-op: no proposal is created and the Investigation is never closed.
  - name: count_fp_candidates
    type: data.set
    with:
      fp_candidate_count: "${{ variables.fp_candidate_ids | size }}"

  # Guard: analysis is on (or this run would have aborted at step 1) but the
  # sub-workflow returned 0 verdicts for a non-empty batch — a missing Model
  # Management connector, or the sub-workflow skipped.
  # Counts are materialised first: `${{ event.alerts | size > 0 }}` is invalid Liquid
  # (the engine parses `size > 0` as a filter name). The if-condition engine also
  # rejects `and`, so the two comparisons stay nested.
  - name: compute_classification_guard_counts
    type: data.set
    with:
      alert_count: "${{ event.alerts | size }}"
      verdict_count: "${{ steps.classify_alerts.output.verdicts | size }}"
      missing_alert_count: "${{ steps.classify_alerts.output.missing_alert_ids | size }}"

  - name: guard_classification_nonempty
    type: if
    condition: "${{ variables.alert_count > 0 }}"
    steps:
      - name: guard_classification_nonempty_inner
        type: if
        condition: "${{ variables.verdict_count == 0 }}"
        steps:
          - name: post_comment_classification_empty
            type: ai.conversation.add_user_message
            on-failure:
              continue: true
            with:
              conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
              message: >-
                ⚠️ Alert Analysis returned no verdicts for {{ event.alerts.size }} alert{% if event.alerts.size != 1 %}s{% endif %}.
                Analysis is on for this space (a disabled setting aborts before an Investigation is opened).
                Likely causes: the `alertzero_reasoning` Model Management feature has no connector,
                or the sub-workflow skipped the batch.
                Alerts have NOT been tagged or closed.
        else:
          # Partial miss: at least one verdict came back (the all-empty case is handled
          # above), but the sub-workflow's missing_alert_ids is nonempty — the model
          # dropped one or more alerts from its reply, or a batch failed after retries.
          # Those alerts get no az: tag, note, or FP-candidate consideration, so the
          # Investigation would otherwise look fully triaged with no record that some
          # alerts still need a verdict.
          - name: guard_missing_alert_ids
            type: if
            condition: "${{ variables.missing_alert_count > 0 }}"
            steps:
              - name: post_comment_missing_alert_ids
                type: ai.conversation.add_user_message
                on-failure:
                  continue: true
                with:
                  conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
                  message: >-
                    ⚠️ Alert Analysis returned no verdict for {{ variables.missing_alert_count }} of
                    {{ variables.alert_count }} alert{% if variables.alert_count != 1 %}s{% endif %} in this batch (see the sub-workflow's
                    missing_alert_ids). {% if variables.missing_alert_count == 1 %}That alert was{% else %}Those alerts were{% endif %} NOT tagged, noted, or considered for
                    closure by this Worker; only the {{ variables.verdict_count }} matched
                    alert{% if variables.verdict_count != 1 %}s{% endif %} will be triaged below. Re-run the Worker or follow up manually on
                    the missing alert{% if variables.missing_alert_count != 1 %}s{% endif %}.

  - name: post_comment_classification_results
    type: ai.conversation.add_user_message
    on-failure:
      continue: true
    with:
      conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
      message: |-
        Classification complete: {{ steps.classify_alerts.output.true_positive_count }} true positive, {{ steps.classify_alerts.output.false_positive_count }} false positive, {{ steps.classify_alerts.output.inconclusive_count }} inconclusive.

        {{ steps.classify_alerts.output.grouped_counts_summary }}

        {{ steps.classify_alerts.output.generated_summary }}{% if steps.classify_alerts.output.connector_id != '' %} _(Connector: `{{ steps.classify_alerts.output.connector_id }}`, Agent: `{{ steps.classify_alerts.output.agent_id }}`)_{% endif %}

  # ---------------------------------------------------------------------------
  # 6. Attach impact summary (entity × verdict breakdown) to the Investigation.
  #    The sub-workflow caps impacted_entities at MAX_IMPACTED_ENTITIES and sets
  #    impacted_entities_truncated when it dropped any.
  # ---------------------------------------------------------------------------
  - name: attach_impact
    type: ai.attachment.add
    on-failure:
      continue: true
    with:
      conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
      type: security.impact
      render_inline: true
      data:
        entities: "${{ steps.classify_alerts.output.impacted_entities }}"
        total_alert_count: "${{ steps.classify_alerts.output.verdicts | size }}"
        truncated: "{{ steps.classify_alerts.output.impacted_entities_truncated }}"
      description: "Impacted entities from alert triage"

  # ---------------------------------------------------------------------------
  # 7. Apply static AZ classification tags to every analysed alert (R5).
  #    Tags are always written — never gated on autonomy level or FP count.
  #    Replaces any stale AZ classification tag before adding the current one.
  # ---------------------------------------------------------------------------
  # Removing and adding are two calls, not one: kibana.SetAlertTags rejects a tag present in
  # both lists ("Duplicate tags ... were found"), and the tag being added is always one of the
  # three being cleared. Listing abbreviations in tags_to_remove dodges the collision but
  # matches no real tag, leaving a re-analysed alert carrying both its old verdict and its new.
  # Same remove-then-add split alert_analysis_workflow.yaml uses for its own tags.
  - name: set_az_tags
    foreach: "${{ steps.classify_alerts.output.verdicts | json }}"
    type: foreach
    steps:
      - name: remove_stale_az_tags
        type: kibana.SetAlertTags
        on-failure:
          retry:
            max-attempts: 3
            delay: 5s
        with:
          ids:
            - "{{ foreach.item.alert_id }}"
          tags:
            tags_to_remove:
              - "az:true_positive"
              - "az:false_positive"
              - "az:inconclusive"
            tags_to_add: []

      - name: add_az_classification_tag
        type: kibana.SetAlertTags
        on-failure:
          retry:
            max-attempts: 3
            delay: 5s
        with:
          ids:
            - "{{ foreach.item.alert_id }}"
          tags:
            tags_to_remove: []
            tags_to_add:
              - "az:{{ foreach.item.classification }}"

  # ---------------------------------------------------------------------------
  # 8. Write a verdict note to each alert referencing the Investigation (R4, R13).
  #    Always written — never gated on autonomy level. The only verdict note on the
  #    Worker path: the sub-workflow skips its own when calledByWorker is true.
  # ---------------------------------------------------------------------------
  - name: add_verdict_notes
    foreach: "${{ steps.classify_alerts.output.verdicts | json }}"
    type: kibana.request
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
    with:
      method: PATCH
      path: "/s/{{ workflow.spaceId }}/api/note"
      body:
        note:
          eventId: "{{ foreach.item.alert_id }}"
          timelineId: ''
          note: |
            [Alert Triage Investigation](/s/{{ workflow.spaceId }}/app/agent_builder/conversations/{{ steps.create_investigation.output.conversation_id }}) · [Workflow execution]({{ execution.url }})

            **Verdict:** {{ foreach.item.classification }}
            **Confidence:** {{ foreach.item.confidence_score }}

            {{ foreach.item.rationale }}
            {% if foreach.item.contributing_factors.size > 0 %}
            **Contributing factors**
            {% for factor in foreach.item.contributing_factors %}
            - {{ factor }}
            {%- endfor %}
            {% endif %}
      headers:
        kbn-xsrf: string
        Content-Type: application/json

  - name: post_comment_alert_updates
    type: ai.conversation.add_user_message
    on-failure:
      continue: true
    with:
      conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
      message: >-
        Tags and verdict notes written to {{ steps.classify_alerts.output.verdicts.size }} alert{% if steps.classify_alerts.output.verdicts.size != 1 %}s{% endif %}.

  # ---------------------------------------------------------------------------
  # 9. Autonomy gate — create a proposal to close FP alerts if any qualify.
  #
  #    Autonomy mapping (two levels — `assisted` from WATCH_AUTONOMY_LEVELS is not offered):
  #      manual     → autoApprove: false  (human gate, 72 h queue row)
  #      supervised → autoApprove: true   (closes without waiting; the analyst can reopen)
  #
  #    Both levels go through the proposal gate so the proposal record always
  #    exists (R11) and there is one mapping site if the semantics ever change.
  #    `autoApprove` only takes effect because the close action declares
  #    `approvalPolicy: autonomy-dependent`; `always-gate` would override it.
  #
  #    The gate completes normally on every outcome, including an unanswered
  #    deadline (`status: expired`), so each outcome gets its own branch below.
  # ---------------------------------------------------------------------------
  - name: gate_fp_close
    type: if
    condition: "${{ variables.fp_candidate_count > 0 }}"
    steps:
      - name: post_comment_proposal
        type: ai.conversation.add_user_message
        on-failure:
          continue: true
        with:
          conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
          message: >-
            Proposing closure of {{ variables.fp_candidate_count }} alert{% if variables.fp_candidate_count != 1 %}s{% endif %} classified as false positive at or above the {{ consts.worker_settings.autoCloseConfidenceScoreMinThreshold }} confidence floor.
            Autonomy level: {{ consts.worker_settings.autonomy }}.
            {% if consts.worker_settings.autonomy == 'supervised' %}The closure is approved automatically at this autonomy level; reopen any alert you disagree with.{% else %}A human decision is required.{% endif %}

      - name: create_fp_proposal
        type: workflow.execute
        # Reached only when the proposal workflow itself fails (for example, the proposal could
        # not be created); gate outcomes, including an expired deadline, complete normally and
        # are handled by the branches below. The fallback re-throws afterwards, so the run
        # fails and shows up in execution history.
        on-failure:
          fallback:
            - name: post_comment_proposal_failed
              type: ai.conversation.add_user_message
              on-failure:
                continue: true
              with:
                conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
                message: >-
                  ⚠️ The closure proposal could not be completed: {{ error.message }}.
                  {{ variables.fp_candidate_count }} alert{% if variables.fp_candidate_count != 1 %}s{% endif %} {% if variables.fp_candidate_count == 1 %}remains{% else %}remain{% endif %} open and tagged az:false_positive.
        with:
          workflow-id: system-create-alertzero-proposal
          inputs:
            conversationId: "{{ steps.create_investigation.output.conversation_id }}"
            comment: >-
              {{ variables.fp_candidate_count }} alert{% if variables.fp_candidate_count != 1 %}s{% endif %} from rule "{{ event.rule.name }}" {% if variables.fp_candidate_count == 1 %}was{% else %}were{% endif %} classified as false positives at or above the configured confidence floor ({{ consts.worker_settings.autoCloseConfidenceScoreMinThreshold }}).
              Approving this proposal will close them with workflow_reason=false_positive.
            actionWorkflowId: system-alertzero-action-close-alerts-fp
            actionInput:
              alertIds: "${{ variables.fp_candidate_ids }}"
              reason: "false_positive"
            impact: high
            confidence: high
            # Autonomy → autoApprove mapping. One site: update here if semantics change.
            autoApprove: "${{ consts.worker_settings.autonomy == 'supervised' }}"

      # Fetch proposal details for outcome comment attribution (decision, decidedBy,
      # dismissReason, rationale). handle_dismissed below must not derive the retag from a
      # failed read, so retry before continue: true takes over.
      - name: get_proposal
        type: proposals.getProposal
        on-failure:
          retry:
            max-attempts: 3
            delay: 5s
          continue: true
        with:
          proposalId: "{{ steps.create_fp_proposal.output.proposalId }}"

      # One value per outcome so every branch below is a single comparison (if-conditions
      # take neither filters nor `and`). `decision` and `status` are separate axes (D48):
      # an approved close ends `succeeded`, a dismissal ends with `decision: dismissed`, and
      # an unanswered deadline ends `expired` with no decision.
      - name: resolve_proposal_outcome
        type: data.set
        with:
          proposal_outcome: >-
            {% if steps.create_fp_proposal.output.status == 'succeeded' %}approved{% elsif steps.create_fp_proposal.output.decision == 'dismissed' %}dismissed{% elsif steps.create_fp_proposal.output.status == 'expired' %}expired{% else %}unknown{% endif %}

      - name: handle_approved
        type: if
        condition: "${{ variables.proposal_outcome == 'approved' }}"
        steps:
          # Everything the analyst approved has already happened by this point: the alerts are
          # closed and the proposal is `succeeded`. Failing the run on the bookkeeping patch
          # would report a successful triage as a failure, so the patch is allowed to fail.
          # `continue: true` is required for that: fallback alone still re-throws the original
          # error afterwards (see on_failure/README.md), which would abort the run and skip
          # the outcome comment below. Also the failure mode `ai.conversation.metadata.patch`
          # hits when `agentBuilder:experimentalFeatures` is off.
          - name: close_investigation_after_approval
            type: ai.conversation.metadata.patch
            on-failure:
              continue: true
              fallback:
                - name: log_investigation_close_failed
                  type: console
                  with:
                    message: >-
                      Alerts were closed and the proposal succeeded, but the Investigation
                      could not be marked closed: {{ error.message }}. Investigation
                      {{ steps.create_investigation.output.conversation_id }} stays open.
            with:
              conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
              updates:
                status: closed
                close_reason: false_positive

          - name: post_comment_outcome_approved
            type: ai.conversation.add_user_message
            on-failure:
              continue: true
            with:
              conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
              message: >-
                Proposal {{ steps.get_proposal.output.decision | default: 'approved' }}{% if steps.get_proposal.output.decidedBy %} by @{{ steps.get_proposal.output.decidedBy.username }}{% endif %}. {{ variables.fp_candidate_count }} alert{% if variables.fp_candidate_count != 1 %}s{% endif %} closed as false positive.

      - name: handle_dismissed
        type: if
        condition: "${{ variables.proposal_outcome == 'dismissed' }}"
        steps:
          # get_proposal is allowed to fail-and-continue (retried above first). Deriving the
          # retag from a missing dismissReason would default every candidate to
          # az:inconclusive — including one an analyst actually contradicted as `wrong`
          # (which maps to az:true_positive) — and then close the Investigation as if that
          # mapped decision had been applied. Gate the whole re-tag/close on the read having
          # actually succeeded; a failed read leaves tags and the Investigation untouched.
          - name: guard_get_proposal_readable
            type: if
            condition: "${{ steps.get_proposal.error == blank }}"
            steps:
              # Map the dismiss reason to the correct re-tag:
              #   wrong → az:true_positive (analyst contradicts the classification itself)
              #   any other reason → az:inconclusive (analyst rejects the *action*, not the verdict)
              - name: map_dismiss_reason_to_tag
                type: data.set
                with:
                  dismissed_tag: >-
                    {% if steps.get_proposal.output.dismissReason == 'wrong' %}az:true_positive{% else %}az:inconclusive{% endif %}
                  failed_retag_count: 0

              # Two calls per alert: kibana.SetAlertTags rejects combining add+remove of the
              # same tag (e.g. az:false_positive removed and re-added), so keep them separate.
              # `continue: true` sits on each SetAlertTags step, next to its retry, like
              # attach_alert_chunk does: on the foreach it would leave the whole loop at the first
              # failure and skip the remaining candidates and record_retag_failure.
              - name: retag_dismissed_alerts
                type: foreach
                foreach: "${{ variables.fp_candidate_ids }}"
                steps:
                  - name: remove_fp_tag
                    type: kibana.SetAlertTags
                    on-failure:
                      retry:
                        max-attempts: 3
                        delay: 5s
                      continue: true
                    with:
                      ids:
                        - "{{ foreach.item }}"
                      tags:
                        tags_to_remove:
                          - "az:false_positive"
                        tags_to_add: []
                  - name: add_dismissed_tag
                    type: kibana.SetAlertTags
                    on-failure:
                      retry:
                        max-attempts: 3
                        delay: 5s
                      continue: true
                    with:
                      ids:
                        - "{{ foreach.item }}"
                      tags:
                        tags_to_remove: []
                        tags_to_add:
                          - "{{ variables.dismissed_tag }}"

                  # Both calls above retry, then continue past a persistent failure, so this
                  # alert's tags may be left partway through the swap and the loop moves on to
                  # the next candidate. Counted (not failed
                  # loudly) so post_comment_outcome_dismissed can report the shortfall instead
                  # of unconditionally claiming every FP candidate was re-tagged.
                  - name: record_retag_failure
                    type: data.set
                    if: "${{ steps.remove_fp_tag.error != blank or steps.add_dismissed_tag.error != blank }}"
                    with:
                      failed_retag_count: "${{ variables.failed_retag_count | plus: 1 }}"

              # Same failure tolerance as close_investigation_after_approval: the decision has
              # landed, so a failed bookkeeping patch must not fail the run.
              - name: close_investigation_after_dismissal
                type: ai.conversation.metadata.patch
                on-failure:
                  continue: true
                  fallback:
                    - name: log_dismissed_close_failed
                      type: console
                      with:
                        message: >-
                          The proposal was dismissed, but the Investigation could not be marked
                          closed: {{ error.message }}. Investigation
                          {{ steps.create_investigation.output.conversation_id }} stays open.
                with:
                  conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
                  updates:
                    status: closed
                    close_reason: other

              - name: post_comment_outcome_dismissed
                type: ai.conversation.add_user_message
                on-failure:
                  continue: true
                with:
                  conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
                  message: >-
                    Proposal {{ steps.get_proposal.output.decision | default: 'dismissed' }}{% if steps.get_proposal.output.decidedBy %} by @{{ steps.get_proposal.output.decidedBy.username }}{% endif %} (reason: {{ steps.get_proposal.output.dismissReason | default: 'not specified' }}). {% if variables.failed_retag_count > 0 %}{{ variables.fp_candidate_count | minus: variables.failed_retag_count }} of {{ variables.fp_candidate_count }} alert{% if variables.fp_candidate_count != 1 %}s{% endif %} re-tagged {{ variables.dismissed_tag }}; {{ variables.failed_retag_count }} failed after retries and {% if variables.failed_retag_count == 1 %}needs{% else %}need{% endif %} manual re-tagging.{% else %}{{ variables.fp_candidate_count }} alert{% if variables.fp_candidate_count != 1 %}s{% endif %} re-tagged {{ variables.dismissed_tag }}.{% endif %}{% if steps.get_proposal.output.rationale != blank %} Rationale: "{{ steps.get_proposal.output.rationale | truncate: 500 | escape }}".{% endif %}
            else:
              - name: post_comment_dismissed_read_failed
                type: ai.conversation.add_user_message
                on-failure:
                  continue: true
                with:
                  conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
                  message: >-
                    ⚠️ The proposal was dismissed, but its details could not be read after
                    retries ({{ steps.get_proposal.error.message }}). {{ variables.fp_candidate_count }}
                    alert{% if variables.fp_candidate_count != 1 %}s{% endif %} {% if variables.fp_candidate_count == 1 %}remains{% else %}remain{% endif %} tagged az:false_positive and untouched; this Investigation
                    stays open for manual follow-up.

      # An unanswered deadline is not a dismissal: nobody rejected the verdict, so the alerts
      # keep their az:false_positive tag and stay open for an analyst to pick up.
      - name: handle_expired
        type: if
        condition: "${{ variables.proposal_outcome == 'expired' }}"
        steps:
          - name: close_investigation_after_expiry
            type: ai.conversation.metadata.patch
            on-failure:
              continue: true
              fallback:
                - name: log_expired_close_failed
                  type: console
                  with:
                    message: >-
                      The proposal expired, but the Investigation could not be marked
                      closed: {{ error.message }}. Investigation
                      {{ steps.create_investigation.output.conversation_id }} stays open.
            with:
              conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
              updates:
                status: closed
                close_reason: other

          - name: post_comment_outcome_expired
            type: ai.conversation.add_user_message
            on-failure:
              continue: true
            with:
              conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
              message: >-
                No decision was made before the proposal expired. {{ variables.fp_candidate_count }} alert{% if variables.fp_candidate_count != 1 %}s{% endif %} {% if variables.fp_candidate_count == 1 %}remains{% else %}remain{% endif %} open and tagged az:false_positive.

      # Any other terminal status means the gate settled in a way this Worker does not
      # expect. Leave the Investigation open so an analyst looks at it.
      - name: handle_unknown_outcome
        type: if
        condition: "${{ variables.proposal_outcome == 'unknown' }}"
        steps:
          - name: post_comment_outcome_unknown
            type: ai.conversation.add_user_message
            on-failure:
              continue: true
            with:
              conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
              # Does not assert every candidate remains open: this outcome can follow
              # action_close_alerts_false_positive's fail_incomplete_close, which fires after
              # a partial SetAlertsStatus update (conflicts: proceed lets some alerts close
              # before the count mismatch throws). Whether that happened is not observable
              # here — the gate's own output carries no per-alert result — so this reports
              # the ambiguity instead of a specific (possibly wrong) closed/open count.
              message: >-
                ⚠️ The closure proposal ended in an unexpected state (status: "{{ steps.create_fp_proposal.output.status | default: 'unknown' }}"). Some of the {{ variables.fp_candidate_count }} candidate alert{% if variables.fp_candidate_count != 1 %}s{% endif %} may already be closed if a closure attempt partially succeeded before this outcome — check each alert's workflow_status rather than assuming all remain open and tagged az:false_positive. This Investigation stays open for review.

  # ---------------------------------------------------------------------------
  # 10. No-FP branch: close the Investigation immediately.
  #
  #     This branch MUST be explicit. A batch that classifies nothing as a
  #     false positive still needs a closed Investigation — it is the branch
  #     that gets forgotten in tests and in code review.
  #
  #     Nested rather than `and`-combined (see compute_classification_guard_counts):
  #     fp_candidate_count is also 0 for a zero-verdict batch (missing connector,
  #     skipped sub-workflow), and that case already posted a warning via
  #     guard_classification_nonempty_inner above. Requiring verdict_count > 0 here
  #     stops that batch from ALSO closing the Investigation and posting "Triage
  #     complete" as if a real zero-FP analysis had run; it stays open instead.
  # ---------------------------------------------------------------------------
  - name: close_investigation_no_fp
    type: if
    condition: "${{ variables.fp_candidate_count == 0 }}"
    steps:
      - name: close_investigation_no_fp_when_analyzed
        type: if
        condition: "${{ variables.verdict_count > 0 }}"
        steps:
          # This is the most common branch (no FP candidates), so an unhandled patch failure
          # here would fail most triage runs. `ai.conversation.metadata.patch` errors when
          # `agentBuilder:experimentalFeatures` is off; `continue: true` is required alongside
          # `fallback` — fallback alone still re-throws the original error afterwards (see
          # on_failure/README.md) and would skip post_comment_outcome_no_fp below.
          - name: close_no_fp
            type: ai.conversation.metadata.patch
            on-failure:
              continue: true
              fallback:
                - name: log_no_fp_close_failed
                  type: console
                  with:
                    message: >-
                      Triage completed with no false-positive candidates, but the Investigation
                      could not be marked closed: {{ error.message }}. Investigation
                      {{ steps.create_investigation.output.conversation_id }} stays open.
            with:
              conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
              updates:
                status: closed

          - name: post_comment_outcome_no_fp
            type: ai.conversation.add_user_message
            on-failure:
              continue: true
            with:
              conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
              message: >-
                Triage complete. No false positive alerts met the {{ consts.worker_settings.autoCloseConfidenceScoreMinThreshold }} confidence floor; no proposal created.
                {{ steps.classify_alerts.output.true_positive_count }} true positive, {{ steps.classify_alerts.output.false_positive_count }} false positive (below threshold), {{ steps.classify_alerts.output.inconclusive_count }} inconclusive.
