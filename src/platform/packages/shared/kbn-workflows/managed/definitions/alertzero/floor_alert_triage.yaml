version: "1"
name: Alert Triage
description: Watch Floor alert triage worker stub.
enabled: false
tags:
  - watch
  - watch-floor
triggers:
  - type: manual
consts:
  worker_settings:
    settingsVersion: __WORKER_SETTINGS_VERSION__
    autonomy: "__WORKER_AUTONOMY_LEVEL__"
steps:
  - name: triage_alerts
    type: ai.agent
    # `agent-id` IS template-rendered: `getRenderedConfig` (custom_step_impl.ts) renders
    # the config keys declared in the step's `configSchema.shape`, and `agent-id` is one.
    # (`timeout` below is NOT in that shape, which is why it must stay a literal —
    # elastic/kibana#290258.)
    #
    # Substituted at INSTALL time by `renderWorkerAgentId`. A Worker with no agent picked
    # keeps `alertzero-thin-agent`, so this step's behaviour is unchanged unless an
    # operator deliberately chose an agent.
    agent-id: "__WORKER_AGENT_ID_OR:alertzero-thin-agent__"
    # Keep in sync with ALERTZERO_FAST_INFERENCE_FEATURE_ID in @kbn/alertzero-common.
    connector-id-by-feature: alertzero_fast
    # plugin-id: per-Worker cost attribution; aggregate-by: ALERTZERO_INFERENCE_PARENT_FEATURE_ID.
    plugin-id: alertzero_alert_triage
    aggregate-by: alertzero_parent
    timeout: "10m"
    create-conversation: true
    with:
      configuration_overrides:
        skill_ids:
          - alert-analysis
        tools:
          - tool_ids:
              - security.alertzero.actions.list
      message: >
        Triage the security alert context below. Prefer
        recall over precision when unsure. Return a structured
        classification.

        Alert / event context:
        {{ event | json }}
      schema:
        type: object
        properties:
          classification:
            type: string
            enum:
              - true_positive
              - false_positive
              - inconclusive
            description: Classification of the alert based on analysis
          confidence_score:
            type: number
            minimum: 0
            maximum: 1
            description: Confidence from 0.0–1.0
          rationale:
            type: string
