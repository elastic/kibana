version: "1"
name: Alert Triage
description: >
  AlertZero Worker that triages alerts on a schedule. Each sweep checks that Task Manager has room,
  plans a fair, budgeted batch of waiting alerts per detection rule, claims them, and starts one
  batch workflow per rule. The batch classifies the alerts with the Security Alert Analysis
  workflow, writes each verdict as an alert tag and note, and, gated by the Worker's autonomy
  level, proposes closing the confident false positives through a separate review workflow.
  The sweep only plans and starts batches, so it finishes in seconds and never waits for a human.
enabled: false
tags:
  - watch
  - watch-floor

settings:
  __WORKER_RUN_AS_LINE__:
  # One planner per space. The sweep is the only writer of claims (`az:triage_pending`), which is
  # what makes the claim and execution tags safe without locking. It only plans and starts batches,
  # so dropping an overlapping sweep loses no analysis: the alerts wait for the next one.
  concurrency:
    key: alert-triage-sweep
    strategy: drop
    max: 1

triggers:
  - type: scheduled
    with:
      every: "__WORKER_SCHEDULE_INTERVAL__"
  # Keep manual for desk testing without waiting for the schedule.
  - type: manual

# Written by `emit_result` on every sweep, so an idle sweep can be told from a blocked one.
# `aged_out_alerts` is -1 when its count query failed.
outputs:
  - name: skip_reason
    type: string
  - name: pending_alerts
    type: number
  - name: aged_out_alerts
    type: number
  - name: claimed_alerts
    type: number
  - name: reclaimed_alerts
    type: number
  - name: live_batches
    type: number
  - name: planned_batches
    type: number
  - name: planned_alerts
    type: number
  - name: sweep_budget
    type: number
  - name: planned_cost
    type: number

consts:
  worker_settings:
    settingsVersion: __WORKER_SETTINGS_VERSION__
    autonomy: "__WORKER_AUTONOMY_LEVEL__"
    scheduleInterval: "__WORKER_SCHEDULE_INTERVAL__"
    # `autoCloseConfidenceScoreMinThreshold`, `budgetPerHour` and `lookbackHours`.
    extras: __WORKER_EXTRAS__
  # The sweep interval in minutes, derived from `scheduleInterval` when the YAML is rendered. The
  # budget per sweep is the hourly budget scaled to this.
  schedule_interval_minutes: __WORKER_SCHEDULE_INTERVAL_MINUTES__
  # Must equal the id in `start_batch`.
  batch_workflow_id: system-security-floor-alert-triage-batch

# =============================================================================
# Steps
# =============================================================================
#
# Pipeline:
#   1. require_analysis_enabled — fail the sweep when the space has Alert Analysis turned off
#   2. read_headroom            — is Task Manager keeping up? behind or unknown starts nothing
#   3. plan_sweep               — reclaim dead claims, pick a fair batch per rule, claim the alerts
#   4. start_batches            — one batch per rule, asynchronously, then record each execution id
#                                 on the batch's alerts
#   5. emit_result              — the sweep's status and planning numbers
#
# The claim → start → record order is load-bearing. The alerts are claimed first so no other
# sweep plans them, then the batch starts, then its execution id is written as
# `az:triage_exec:<id>` so the next sweep can tell which rule has a live batch. A sweep that dies
# between claim and record leaves claims the next sweep finds dead and plans again.

steps:
  # ---------------------------------------------------------------------------
  # 1. Abort when Alert Analysis is off in this space. Enablement is checked at Worker turn-on;
  #    this is the runtime complement for an operator who later turns analysis off and leaves the
  #    Worker running. Fail-closed: a failed fetch after retries fails the sweep. The same read
  #    gives the tag prefix of Alert Analysis, so alerts it analysed on its own are left alone.
  # ---------------------------------------------------------------------------
  - name: fetch_analysis_runtime_config
    type: kibana.request
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/security_solution/alert_analysis_workflow/runtime_config"
      headers:
        kbn-xsrf: string
        elastic-api-version: "1"
        Content-Type: application/json

  - name: require_analysis_enabled
    type: if
    condition: "${{ steps.fetch_analysis_runtime_config.output.workflowEnabled == false }}"
    steps:
      - name: abort_analysis_disabled
        type: workflow.fail
        with:
          message: >-
            Alert Triage requires Alert Analysis to be enabled in this space.
            Turn it on under Alert analysis settings, or turn this Worker off.

  # ---------------------------------------------------------------------------
  # 2. Task Manager headroom. `behind` (workflow:run tasks overdue by more than two minutes,
  #    cluster-wide) and `unknown` (the read failed) both start nothing.
  # ---------------------------------------------------------------------------
  - name: read_headroom
    type: alertzero.triage.headroom
    with:
      batch_workflow_id: "{{ consts.batch_workflow_id }}"

  # ---------------------------------------------------------------------------
  # 3. Plan the sweep and claim the chosen alerts with `az:triage_pending`.
  # ---------------------------------------------------------------------------
  - name: plan_sweep
    type: alertzero.triage.planSweep
    with:
      batch_workflow_id: "{{ consts.batch_workflow_id }}"
      analysis_tag_prefix: "{{ steps.fetch_analysis_runtime_config.output.tagPrefix }}"
      budget_per_hour: "${{ consts.worker_settings.extras.budgetPerHour }}"
      interval_minutes: "${{ consts.schedule_interval_minutes }}"
      lookback_hours: "${{ consts.worker_settings.extras.lookbackHours }}"
      headroom: "${{ steps.read_headroom.output }}"

  # ---------------------------------------------------------------------------
  # 4. Start one batch per planned rule. `workflow.executeAsync` returns as soon as the batch is
  #    started, so the sweep never waits for analysis. The batch's concurrency queues what exceeds
  #    its parallelism. A batch that cannot be started is not retried here: its alerts stay
  #    claimed with no execution tag and the next sweep reclaims and plans them again.
  # ---------------------------------------------------------------------------
  - name: start_batches
    type: foreach
    foreach: "${{ steps.plan_sweep.output.batches | json }}"
    steps:
      - name: start_batch
        type: workflow.executeAsync
        on-failure:
          continue: true
        with:
          workflow-id: system-security-floor-alert-triage-batch
          run-as-mode: inherit
          inputs:
            rule_id: "{{ foreach.item.rule_id }}"
            rule_name: "{{ foreach.item.rule_name }}"
            alert_ids: "${{ foreach.item.alert_ids }}"
            autonomy: "{{ consts.worker_settings.autonomy }}"
            confidence_floor: "${{ consts.worker_settings.extras.autoCloseConfidenceScoreMinThreshold }}"

      # Links the rule to its batch: the executions list does not return inputs, so the next sweep
      # reads this tag off the alerts to tell which rule has a live batch. The batch removes it,
      # with the claim, when it has written the outcome.
      - name: record_batch_execution
        type: kibana.SetAlertTags
        if: "${{ steps.start_batch.error == blank }}"
        on-failure:
          retry:
            max-attempts: 3
            delay: 5s
          continue: true
        with:
          ids: "${{ foreach.item.alert_ids }}"
          tags:
            tags_to_add:
              - "az:triage_exec:{{ steps.start_batch.output.executionId }}"
            tags_to_remove: []

  # ---------------------------------------------------------------------------
  # 5. Report the sweep. `skip_reason` is `none`, `tm_behind`, `tm_unknown`,
  #    `live_batches_unreadable`, `in_flight_ceiling`, `budget_too_small` or
  #    `nothing_pending`.
  # ---------------------------------------------------------------------------
  - name: emit_result
    type: workflow.output
    status: completed
    with:
      skip_reason: "{{ steps.plan_sweep.output.skip_reason }}"
      pending_alerts: "${{ steps.plan_sweep.output.numbers.pending_alerts }}"
      aged_out_alerts: "${{ steps.plan_sweep.output.numbers.aged_out_alerts | default: -1 }}"
      claimed_alerts: "${{ steps.plan_sweep.output.numbers.claimed_alerts }}"
      reclaimed_alerts: "${{ steps.plan_sweep.output.numbers.reclaimed_alerts }}"
      live_batches: "${{ steps.plan_sweep.output.numbers.live_batches }}"
      planned_batches: "${{ steps.plan_sweep.output.numbers.planned_batches }}"
      planned_alerts: "${{ steps.plan_sweep.output.numbers.planned_alerts }}"
      sweep_budget: "${{ steps.plan_sweep.output.numbers.sweep_budget }}"
      planned_cost: "${{ steps.plan_sweep.output.numbers.planned_cost }}"
