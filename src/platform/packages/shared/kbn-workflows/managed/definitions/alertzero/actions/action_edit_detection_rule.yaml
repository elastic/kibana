version: "1"
name: Edit detection rule
description: >
  AlertZero action: changes one or more fields of an existing detection rule,
  leaving every field it is not given untouched. Executed by the investigation
  proposal gate once an analyst approves, so the change is attributed to the
  approver.
enabled: true
tags:
  # Generic tag every action workflow carries, so the catalog can be
  # discovered by tag rather than a hardcoded list.
  - action
  - alertzero
consts:
  # Self-describing catalog metadata, read back by the proposals service when a
  # proposal referencing this workflow is created or rendered. Metadata has to
  # live under `consts`: unknown top-level keys are stripped by the schema.
  #
  # `impact` is deliberately absent. The service reads
  # `metadata.impact ?? params.impact`, so leaving it out lets each caller
  # declare the impact of the specific edit it is proposing: rewriting a query
  # is not the same risk as lowering a severity. An action that pinned `impact`
  # here would override every caller.
  actionMetadata:
    name: Edit detection rule
    description: Changes the given fields of an existing detection rule. Fields that are not supplied are left exactly as they are.
    category: configure
    reversible: true
    approvalPolicy: always-gate
triggers:
  - type: manual
    inputs:
      properties:
        actionInput:
          type: object
          description: >
            The edit to apply. `id` identifies the rule; every other property is
            an optional field to change, and anything not supplied is left
            alone. This object is handed to the patch step as a whole, which is
            what makes a partial edit possible: a literal YAML object cannot omit
            a key conditionally, so spelling the fields out in the step would
            force every caller to supply all of them and blank whatever it left
            unset.

            To support editing another field, add it here. No new action, and no
            change to the step below, is needed.
          properties:
            id:
              type: string
              maxLength: 512
              description: >-
                Saved-object id of the rule, so the edit lands on the exact rule
                incarnation the proposal was built against.
            query:
              type: string
              maxLength: 65536
              description: New query, written in the rule's own language.
            risk_score:
              type: integer
              minimum: 0
              maximum: 100
              description: New risk score, on the detection engine's 0-100 scale.
            severity:
              type: string
              enum: [low, medium, high, critical]
              description: New severity, which should stay consistent with the risk score.
          required:
            - id
          # Rejects a field this action does not know how to edit, at proposal
          # creation time rather than at apply time.
          additionalProperties: false
      required:
        - actionInput
      additionalProperties: false
outputs:
  - name: id
    type: string
  - name: name
    type: string
  - name: query
    type: string
  - name: risk_score
    type: number
  - name: severity
    type: string
steps:
  # The whole `actionInput` object is the patch body. The API applies only the
  # keys it receives, so an edit that carries just `risk_score` leaves the
  # query, schedule and exceptions exactly as they were.
  - name: patch_rule
    type: security.patchRule
    with:
      patch: "${{ inputs.actionInput }}"

  # `workflow.execute` declares its output as unknown, so the parent falls back
  # to a heuristic read of the last step unless the child emits explicitly.
  - name: emit_result
    type: workflow.output
    status: completed
    with:
      id: "{{ steps.patch_rule.output.id }}"
      name: "{{ steps.patch_rule.output.name }}"
      query: "{{ steps.patch_rule.output.query }}"
      risk_score: "${{ steps.patch_rule.output.risk_score }}"
      severity: "{{ steps.patch_rule.output.severity }}"
