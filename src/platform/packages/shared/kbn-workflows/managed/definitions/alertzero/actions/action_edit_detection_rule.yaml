version: "1"
name: Edit detection rule
description: >
  AlertZero action: changes one or more fields of an existing detection rule,
  leaving every field it is not given untouched. Executed by the investigation
  proposal gate once an analyst approves, so the change is attributed to the
  approver.
enabled: true
tags:
  # Generic tag every action workflow carries, so the catalog can be
  # discovered by tag rather than a hardcoded list.
  - action
  - alertzero
consts:
  # Self-describing catalog metadata, read back by the proposals service when a
  # proposal referencing this workflow is created or rendered. Metadata has to
  # live under `consts`: unknown top-level keys are stripped by the schema.
  #
  # No `impact`: the caller's value wins, and each edit declares its own.
  actionMetadata:
    name: Edit detection rule
    description: Changes the given fields of an existing detection rule. Fields that are not supplied are left exactly as they are.
    category: configure
    reversible: true
    approvalPolicy: always-gate
triggers:
  - type: manual
    inputs:
      properties:
        actionInput:
          type: object
          description: >
            The edit to apply. `id` identifies the rule; every other property is
            optional, and fields not supplied are left unchanged. To make another
            field editable, add it here.
          properties:
            id:
              type: string
              maxLength: 512
              description: >-
                Saved-object id of the rule, so the edit lands on the exact rule
                incarnation the proposal was built against.
            expected_revision:
              type: integer
              minimum: 0
              description: >-
                The rule's `revision` when the proposal was built. When set, an
                edit to a rule that changed since is reported as not applicable
                instead of overwriting it. Not a rule field, so it is never sent
                to the patch API.
            query:
              type: string
              maxLength: 65536
              description: New query, written in the rule's own language.
            risk_score:
              type: integer
              minimum: 0
              maximum: 100
              description: New risk score, on the detection engine's 0-100 scale.
            severity:
              type: string
              enum: [low, medium, high, critical]
              description: New severity, which should stay consistent with the risk score.
            threshold:
              type: object
              description: >-
                New threshold settings. Treated as an atomic replacement: the
                detection API replaces the whole threshold object, so callers
                must supply every field. Use [] to clear optional arrays.
              properties:
                value:
                  type: integer
                  minimum: 1
                  description: Minimum event count to trigger an alert.
                field:
                  type: array
                  items:
                    type: string
                    maxLength: 512
                  maxItems: 5
                  description: Fields to group events by before counting. Use [] to count all events.
                cardinality:
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        maxLength: 512
                      value:
                        type: integer
                        minimum: 0
                    required: [field, value]
                  description: Unique-value conditions. Use [] to remove all cardinality conditions.
            interval:
              type: string
              maxLength: 32
              description: >-
                How often the rule runs, e.g. "5m" or "1h". Must be a valid
                Elasticsearch date math duration.
            from:
              type: string
              maxLength: 64
              description: >-
                How far back each rule execution looks, e.g. "now-6m". Must be
                a valid Elasticsearch date math expression and should overlap
                with interval to avoid gaps.
          required:
            - id
          additionalProperties: false
      required:
        - actionInput
      additionalProperties: false
outputs:
  # `not_applicable` when the edit can never land (the rule changed or was
  # deleted since the proposal was built), with `message` saying why for the
  # analyst. The proposal gate closes such a proposal instead of re-offering it.
  - name: outcome
    type: string
  - name: message
    type: string
  # `rule_changed` or `rule_deleted` with a `not_applicable` outcome. Kept out of
  # `message` so the analyst reads plain text, while the run output can still be
  # counted by cause.
  - name: reason
    type: string
  - name: id
    type: string
  - name: name
    type: string
  - name: query
    type: string
  - name: risk_score
    type: number
  - name: severity
    type: string
  - name: interval
    type: string
  - name: from
    type: string
steps:
  # `revision` is the rule's change counter: it moves on every content edit and
  # ignores enable/disable and run status. `version` does not move on custom
  # rule edits, so it cannot detect one. Read even without `expected_revision`,
  # so a deleted rule is reported as such rather than as a failed patch.
  - name: fetch_rule
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules?id={{ inputs.actionInput.id | url_encode }}"
      headers:
        kbn-xsrf: string
        elastic-api-version: "2023-10-31"
        Content-Type: application/json
    on-failure:
      continue: true

  # Looked up by saved-object id, so a rule deleted and recreated under the same
  # rule_id lands here too: the edit was built for a rule that no longer exists.
  # The step error carries only a message, which the engine formats as
  # `HTTP <status>: <body>` for every failed Kibana request.
  - name: report_rule_deleted
    type: workflow.output
    status: completed
    if: >-
      ${{ steps.fetch_rule.error != nil
        and steps.fetch_rule.error.message contains 'HTTP 404' }}
    with:
      outcome: not_applicable
      reason: rule_deleted
      message: >-
        The rule was deleted after this proposal was created, so nothing was
        applied.

  # Any other read failure (permissions, a timeout) may pass on a retry, so it
  # fails the action and the gate re-offers the proposal.
  - name: fail_rule_read
    type: workflow.fail
    if: "${{ steps.fetch_rule.error != nil }}"
    with:
      message: "{{ steps.fetch_rule.error.message }}"

  # Not a failure: retrying can never succeed, so the gate closes the proposal
  # with this message instead of re-offering it, and nothing overwrites the
  # newer edit.
  - name: report_rule_changed
    type: workflow.output
    status: completed
    if: >-
      ${{ inputs.actionInput.expected_revision != nil
        and steps.fetch_rule.output.revision != inputs.actionInput.expected_revision }}
    with:
      outcome: not_applicable
      reason: rule_changed
      message: >-
        The rule was changed by {{ steps.fetch_rule.output.updated_by }} after
        this proposal was created, so nothing was applied.

  # The API changes only the keys it receives. `pick` drops absent keys, so only
  # supplied fields are patched, and `expected_revision` never reaches the
  # strict patch schema. Keep this list in sync with the editable fields above.
  - name: patch_rule
    type: security.patchRule
    with:
      patch: >-
        ${{ inputs.actionInput | pick: 'id', 'query', 'risk_score', 'severity',
          'threshold', 'interval', 'from' }}

  # `workflow.execute` declares its output as unknown, so the parent falls back
  # to a heuristic read of the last step unless the child emits explicitly.
  - name: emit_result
    type: workflow.output
    status: completed
    with:
      outcome: applied
      id: "{{ steps.patch_rule.output.id }}"
      name: "{{ steps.patch_rule.output.name }}"
      query: "{{ steps.patch_rule.output.query }}"
      risk_score: "${{ steps.patch_rule.output.risk_score }}"
      severity: "{{ steps.patch_rule.output.severity }}"
      threshold: "${{ steps.patch_rule.output.threshold }}"
      interval: "{{ steps.patch_rule.output.interval }}"
      from: "{{ steps.patch_rule.output.from }}"
