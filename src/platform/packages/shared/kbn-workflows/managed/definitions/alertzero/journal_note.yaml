version: "1"
name: Investigation journal note
description: >
  Appends a user_message to an Investigation conversation without running the
  agent (`ai.conversation.add_user_message`). AlertZero workers call this at
  inflection points so the Investigation reads as a journal. A failed note
  continues rather than failing the caller.
enabled: true
tags:
  - security
  - alertzero
triggers:
  - type: manual
    inputs:
      properties:
        conversation_id:
          type: string
          maxLength: 256
          description: Conversation id of the Investigation to append to.
        message:
          type: string
          maxLength: 8000
          description: Human-readable journal line persisted as a user_message.
        author_name:
          type: string
          minLength: 1
          maxLength: 256
          description: >
            Display name for the note when the caller runs as a Worker's service account,
            e.g. "Endpoint Analysis worker". Temporary until service accounts carry a display name
            (elastic/security-team#20422). Defaults to this workflow's name.
      required:
        - conversation_id
        - message
      additionalProperties: false
steps:
  - name: append_note
    type: ai.conversation.add_user_message
    with:
      conversation_id: "{{ inputs.conversation_id }}"
      message: "{{ inputs.message }}"
      author_name: "{{ inputs.author_name | default: workflow.name }}"
    on-failure:
      continue: true
