version: "1"
name: Investigation journal note
description: >
  Appends a user_message to an Investigation conversation without running the
  agent (`POST /api/chat/converse` with `trigger_mode: never`; elastic/kibana#290223).
  AlertZero workers call this at inflection points so the Investigation reads as a
  journal. A failed note continues rather than failing the caller.
enabled: true
tags:
  - security
  - alertzero
triggers:
  - type: manual
    inputs:
      properties:
        conversation_id:
          type: string
          maxLength: 256
          description: Conversation id of the Investigation to append to.
        message:
          type: string
          maxLength: 8000
          description: Human-readable journal line persisted as a user_message.
      required:
        - conversation_id
        - message
      additionalProperties: false
steps:
  # kibana.request is sent verbatim, so the path is prefixed with the executing space.
  # Flat with: (method/path/headers/body), matching every other kibana.request step
  # in this package (hunt.yaml, hunt_continuous_threat_hunt.yaml): the nested
  # `with: { request: {...} } }` shape this step previously used returns
  # `valid: false` from both POST /api/workflows/test and POST /api/workflows/workflow
  # (confirmed live, 2026-09-25) -- both resolve the strict per-connector step
  # schema (getWorkflowZodSchemaFromConnectors). Confirmed harmless in production:
  # managed-workflow installation builds its schema with `lightweight: true`
  # (generateLightweightYamlSchema), which types every step as z.unknown() and never
  # validates step shape at all, so this file's nested shape has always executed
  # fine there; the runtime request builder (kibana_request_builder.ts) also accepts
  # it directly. Flattened anyway so it validates against the strict schema too
  # (testable via the ad-hoc endpoints) and matches this package's convention.
  - name: append_note
    type: kibana.request
    with:
      method: POST
      path: "/s/{{ workflow.spaceId }}/api/chat/converse"
      headers:
        kbn-xsrf: "true"
        elastic-api-version: "2023-10-31"
        Content-Type: application/json
      body:
        conversation_id: "{{ inputs.conversation_id }}"
        input: "{{ inputs.message }}"
        trigger_mode: never
    on-failure:
      continue: true
