version: "1"
name: Alert Triage closure review
description: >
  Reviews the false positive closure the Alert Triage Worker proposes for one
  batch of alerts. Raises the closure proposal, waits for the decision, and
  applies the outcome: approved closes the Investigation, dismissed re-tags the
  alerts and closes the Investigation, expired closes the Investigation and
  leaves the tags alone.

  Started by the Worker with `workflow.executeAsync` after the batch has been
  classified, tagged and noted, so the Worker never waits for a human. There is
  no limit on how many reviews wait at once.
enabled: true
tags:
  - security
  - alertzero
  - alert-triage

settings:
  # This run parks in WAITING_FOR_CHILD for as long as the proposal gate holds the decision. The
  # workflow timeout is wall-clock from `startedAt`, so that park counts against it: at the
  # engine's 6h default a gated review is cancelled under the analyst, leaving the Investigation
  # open and the proposal dangling. `system-create-alertzero-proposal` parks for up to 72 h at
  # Manual autonomy, and a failed or unauthorized attempt re-parks within the same deadline, so
  # the Worker Investigation lifecycle contract puts the ceiling at 168 h. Keep this above it.
  timeout: "170h"
  # No concurrency limit: every batch with confident false positives raises its proposal. A noisy
  # rule can therefore have many proposals waiting for a decision at once. Spotting noisy rules,
  # for example from knowledge indicators, is handled separately and is not decided here.

triggers:
  # Started by the Alert Triage Worker. Manual so it owns no schedule of its own.
  - type: manual
    inputs:
      properties:
        conversation_id:
          type: string
          minLength: 1
          maxLength: 512
          description: Investigation conversation the Worker opened for this batch.
        rule_id:
          type: string
          minLength: 1
          maxLength: 512
          description: >-
            Id of the detection rule that produced the batch.
        rule_name:
          type: string
          maxLength: 1024
          description: Name of the detection rule, shown in the proposal.
        fp_candidate_ids:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: string
            maxLength: 512
          description: >-
            Alert `_id` values classified as false positive at or above the confidence floor.
            These are the alerts the proposal closes.
        title:
          type: string
          minLength: 1
          maxLength: 512
          description: Proposal title, built by the grouping step together with `comment`.
        comment:
          type: string
          minLength: 1
          maxLength: 8192
          description: >-
            Proposal comment: what the proposal closes and what is inside it. Built by the
            grouping step, which also rebuilds it on every join.
        proposal_id:
          type: string
          maxLength: 64
          description: >-
            The UUID to create the proposal under, so the batch knows its root id for the
            `az:proposal` tag. When another batch created it first, the alerts join that one.
        confidence_floor:
          type: number
          description: Confidence floor the candidates passed, quoted in the proposal and its comment.
        autonomy:
          type: string
          enum:
            - manual
            - supervised
          description: >-
            Worker autonomy level. `manual` waits for an analyst, `supervised` approves the
            closure automatically. Defaults to `manual`.
      required:
        - conversation_id
        - rule_id
        - fp_candidate_ids
        - title
        - comment
        - confidence_floor
      additionalProperties: false

# =============================================================================
# Steps
# =============================================================================
#
# The Worker has already tagged every alert `az:<verdict>` and written its note before it starts
# this workflow. The dismissal branch below relies on that: it swaps `az:false_positive` for the
# analyst's verdict, which only works once the first tag exists.
#
# Pipeline:
#   1. count_fp_candidates  — size of the candidate list, used by every comment below
#   2. gate_fp_close        — post the proposal comment, raise the proposal, wait for the decision
#   3. one branch per outcome — approved, dismissed, expired, unknown
#
# No outcome leaves an alert open as `az:false_positive`. Only an approved closure keeps it (the
# alerts are closed). Dismissal, expiry, an unknown outcome and a failed proposal re-tag the
# candidates `az:inconclusive`. `az:model_fp` stays on the alerts so Rule Tuning still sees the
# model's judgement. A dismissal removes it, because a human disagreed.

consts:
  # Temporary: service accounts have no display name, so the chat would show the raw account
  # id. Remove once they carry one (elastic/security-team#20422).
  author_name: "Alert Triage worker"

steps:
  - name: count_fp_candidates
    type: data.set
    with:
      fp_candidate_count: "${{ inputs.fp_candidate_ids | size }}"

  # ---------------------------------------------------------------------------
  # 2. Autonomy gate — create a proposal to close FP alerts.
  #
  #    Autonomy mapping (two levels — `assisted` from WATCH_AUTONOMY_LEVELS is not offered):
  #      manual     → autoApprove: false  (human gate, 72 h queue row)
  #      supervised → autoApprove: true   (closes without waiting; the analyst can reopen)
  #
  #    Both levels go through the proposal gate so the proposal record always
  #    exists (R11) and there is one mapping site if the semantics ever change.
  #    `autoApprove` only takes effect because the close action declares
  #    `approvalPolicy: autonomy-dependent`; `always-gate` would override it.
  #
  #    The gate completes normally on every outcome, including an unanswered
  #    deadline (`status: expired`), so each outcome gets its own branch below.
  # ---------------------------------------------------------------------------
  - name: post_comment_proposal
    type: ai.conversation.add_user_message
    on-failure:
      continue: true
    with:
      author_name: "{{ consts.author_name }}"
      conversation_id: "{{ inputs.conversation_id }}"
      message: >-
        Proposing closure of {{ variables.fp_candidate_count }} alert{% if variables.fp_candidate_count != 1 %}s{% endif %} classified as false positive at or above the {{ inputs.confidence_floor }} confidence floor.
        Autonomy level: {{ inputs.autonomy | default: 'manual' }}.
        {% if inputs.autonomy == 'supervised' %}The closure is approved automatically at this autonomy level; reopen any alert you disagree with.{% else %}A human decision is required.{% endif %}

  - name: create_fp_proposal
    type: workflow.execute
    # Reached only when the proposal workflow itself fails (for example, the proposal could
    # not be created); gate outcomes, including an expired deadline, complete normally and
    # are handled by the branches below. The usual cause is a collision: `proposal_id` is
    # derived from the pattern, and a batch that started its review late can find that another
    # batch created it first. The fallback then joins the alerts to that proposal. It cannot
    # inspect the error class (YAML sees only `error.message`), so it just tries the join.
    # `continue: true` is required: a fallback alone still re-throws the original error
    # afterwards (see on_failure/fallback_step/README.md). `handle_proposal_failed` below
    # re-creates that failure when the join did not happen.
    on-failure:
      continue: true
      fallback:
        - name: join_on_collision
          type: alertzero.triage.joinProposal
          # The owner was created moments ago, so the usual reason the join fails is that its search
          # index has not refreshed yet. The step fails then, and a few seconds later it finds it.
          on-failure:
            retry:
              max-attempts: 3
              delay: 5s
            continue: true
          if: "${{ inputs.proposal_id != blank }}"
          with:
            proposal_id: "{{ inputs.proposal_id }}"
            alert_ids: "${{ inputs.fp_candidate_ids }}"
            rule_name: "{{ inputs.rule_name }}"
            confidence_floor: "${{ inputs.confidence_floor }}"
    with:
      workflow-id: system-create-alertzero-proposal
      run-as-mode: inherit
      inputs:
        conversationId: "{{ inputs.conversation_id }}"
        title: "{{ inputs.title }}"
        comment: "{{ inputs.comment }}"
        actionWorkflowId: system-alertzero-action-close-alerts-fp
        actionInput:
          alertIds: "${{ inputs.fp_candidate_ids }}"
          reason: "false_positive"
        impact: high
        confidence: high
        # Autonomy → autoApprove mapping. One site: update here if semantics change.
        autoApprove: "${{ inputs.autonomy == 'supervised' }}"
        proposalId: "${{ inputs.proposal_id }}"

  # The create failed and another batch's proposal took these alerts: this Investigation has
  # nothing left to review. The owner's review decides, and reports the outcome.
  - name: handle_proposal_joined
    type: if
    condition: "${{ steps.create_fp_proposal.error != blank and steps.join_on_collision.output.joined == true }}"
    steps:
      - name: post_comment_proposal_joined
        type: ai.conversation.add_user_message
        on-failure:
          continue: true
        with:
          author_name: "{{ consts.author_name }}"
          conversation_id: "{{ inputs.conversation_id }}"
          message: >-
            Another closure proposal for the same pattern was created first. {{ variables.fp_candidate_count }} alert{% if variables.fp_candidate_count != 1 %}s were{% else %} was{% endif %} added to it, in Investigation {{ steps.join_on_collision.output.conversation_id }}, and its review decides.

      # Same as a join made when the batch ran: the alerts go into the owner's Investigation and the
      # owner hears why. Alerts the owner already held add nothing, so nothing is posted for them.
      - name: count_joined_alerts
        type: data.set
        with:
          joined_alert_count: "${{ steps.join_on_collision.output.alert_ids | size }}"

      - name: attach_joined_alerts
        type: foreach
        foreach: "${{ steps.join_on_collision.output.alert_ids | chunk: 20 | json }}"
        steps:
          - name: attach_joined_alert_chunk
            type: ai.attachment.add
            on-failure:
              retry:
                max-attempts: 3
                delay: 5s
              continue: true
            with:
              conversation_id: "{{ steps.join_on_collision.output.conversation_id }}"
              type: security.alerts
              render_inline: true
              data:
                alertIds: "${{ foreach.item }}"
              description: "Alerts added to this closure proposal"

      - name: post_comment_joined_owner
        type: ai.conversation.add_user_message
        if: "${{ variables.joined_alert_count > 0 }}"
        on-failure:
          continue: true
        with:
          author_name: "{{ consts.author_name }}"
          conversation_id: "{{ steps.join_on_collision.output.conversation_id }}"
          message: >-
            +{{ variables.joined_alert_count }} alert{% if variables.joined_alert_count != 1 %}s{% endif %} from rule "{{ inputs.rule_name }}" with the same pattern joined this proposal (revision {{ steps.join_on_collision.output.revision }}).
            [View the added alert{% if variables.joined_alert_count != 1 %}s{% endif %}](/s/{{ workflow.spaceId }}/app/security/alerts{{ steps.join_on_collision.output.alerts_page_query }})

      - name: close_investigation_after_join
        type: ai.conversation.metadata.patch
        on-failure:
          continue: true
        with:
          conversation_id: "{{ inputs.conversation_id }}"
          updates:
            status: closed
            close_reason: other

      - name: report_investigation_closed_after_join
        type: alertzero.reportWorkerOutcome
        if: "${{ steps.close_investigation_after_join.error == blank and steps.close_investigation_after_join.output.changed_fields contains 'status' }}"
        on-failure:
          continue: true
        with:
          event: worker_investigation_closed
          investigation_id: "{{ inputs.conversation_id }}"
          close_reason: other

      - name: end_joined
        type: workflow.output
        status: completed
        with: {}

  # The create failed and nothing took the alerts. They leave az:false_positive, which nothing
  # would revisit, and the run fails so it shows up in execution history.
  - name: handle_proposal_failed
    type: if
    condition: "${{ steps.create_fp_proposal.error != blank }}"
    steps:
      - name: retag_proposal_failed
        type: foreach
        foreach: "${{ inputs.fp_candidate_ids | chunk: 500 | json }}"
        steps:
          - name: retag_proposal_failed_call
            type: kibana.SetAlertTags
            on-failure:
              retry:
                max-attempts: 3
                delay: 5s
              continue: true
            with:
              ids: "${{ foreach.item }}"
              tags:
                tags_to_remove:
                  - "az:false_positive"
                tags_to_add:
                  - "az:inconclusive"
      - name: post_comment_proposal_failed
        type: ai.conversation.add_user_message
        on-failure:
          continue: true
        with:
          author_name: "{{ consts.author_name }}"
          conversation_id: "{{ inputs.conversation_id }}"
          message: >-
            ⚠️ The closure proposal could not be completed: {{ steps.create_fp_proposal.error.message }}.
            {{ variables.fp_candidate_count }} alert{% if variables.fp_candidate_count != 1 %}s{% endif %} {% if variables.fp_candidate_count == 1 %}remains{% else %}remain{% endif %} open and {% if variables.fp_candidate_count == 1 %}was{% else %}were{% endif %} re-tagged az:inconclusive.
      - name: fail_proposal_failed
        type: workflow.fail
        with:
          message: >-
            The Alert Triage closure proposal could not be created: {{ steps.create_fp_proposal.error.message }}

  # The head of the chain. Joins add alerts to a proposal while it waits, so every outcome
  # below acts on the live revision's alerts, not on the ones this review started with. The
  # approve close already runs the head, because the gate adopts the latest revision before it
  # acts. A failed read falls back to the input list for re-tagging only; dismissal and expiry
  # do not close the Investigation then, because joined alerts would be left with no review.
  - name: get_live_revision
    type: proposals.getLatestRevision
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
      continue: true
    with:
      proposalId: "{{ steps.create_fp_proposal.output.proposalId }}"

  - name: resolve_live_alerts
    type: data.set
    with:
      live_alert_ids: "${{ steps.get_live_revision.output.actionInput.alertIds | default: inputs.fp_candidate_ids }}"
      live_revision: "${{ steps.get_live_revision.output.revision | default: 1 }}"

  - name: count_live_alerts
    type: data.set
    with:
      fp_candidate_count: "${{ variables.live_alert_ids | size }}"

  # Fetch proposal details for outcome comment attribution (decision, decidedBy,
  # dismissReason, rationale). handle_dismissed below must not derive the retag from a
  # failed read, so retry before continue: true takes over.
  - name: get_proposal
    type: proposals.getProposal
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
      continue: true
    with:
      proposalId: "{{ steps.create_fp_proposal.output.proposalId }}"

  # One value per outcome so every branch below is a single comparison (if-conditions
  # take no filters, and `and`/`or` have no precedence). `decision` and `status` are
  # separate axes (D48): an approved close ends `succeeded`, a dismissal ends with
  # `decision: dismissed`, and an unanswered deadline ends `expired` with no decision.
  - name: resolve_proposal_outcome
    type: data.set
    with:
      proposal_outcome: >-
        {% if steps.create_fp_proposal.output.status == 'succeeded' %}approved{% elsif steps.create_fp_proposal.output.decision == 'dismissed' %}dismissed{% elsif steps.create_fp_proposal.output.status == 'expired' %}expired{% else %}unknown{% endif %}

  - name: handle_approved
    type: if
    condition: "${{ variables.proposal_outcome == 'approved' }}"
    steps:
      # Everything the analyst approved has already happened by this point: the alerts are
      # closed and the proposal is `succeeded`. Failing the run on the bookkeeping patch
      # would report a successful triage as a failure, so the patch is allowed to fail.
      # `continue: true` is required for that: fallback alone still re-throws the original
      # error afterwards (see on_failure/README.md), which would abort the run and skip
      # the outcome comment below. Also the failure mode `ai.conversation.metadata.patch`
      # hits when `agentBuilder:experimentalFeatures` is off.
      - name: close_investigation_after_approval
        type: ai.conversation.metadata.patch
        on-failure:
          continue: true
          fallback:
            - name: log_investigation_close_failed
              type: console
              with:
                message: >-
                  Alerts were closed and the proposal succeeded, but the Investigation
                  could not be marked closed: {{ error.message }}. Investigation
                  {{ inputs.conversation_id }} stays open.
        with:
          conversation_id: "{{ inputs.conversation_id }}"
          updates:
            status: closed
            close_reason: false_positive

      - name: report_investigation_closed_after_approval
        type: alertzero.reportWorkerOutcome
        if: "${{ steps.close_investigation_after_approval.error == blank and steps.close_investigation_after_approval.output.changed_fields contains 'status' }}"
        on-failure:
          continue: true
        with:
          event: worker_investigation_closed
          investigation_id: "{{ inputs.conversation_id }}"
          close_reason: false_positive

      - name: post_comment_outcome_approved
        type: ai.conversation.add_user_message
        on-failure:
          continue: true
        with:
          author_name: "{{ consts.author_name }}"
          conversation_id: "{{ inputs.conversation_id }}"
          message: >-
            Proposal {{ steps.get_proposal.output.decision | default: 'approved' }}{% if steps.get_proposal.output.decidedBy %} by @{{ steps.get_proposal.output.decidedBy.username }}{% endif %}. {{ variables.fp_candidate_count }} alert{% if variables.fp_candidate_count != 1 %}s{% endif %} closed as false positive.

  - name: handle_dismissed
    type: if
    condition: "${{ variables.proposal_outcome == 'dismissed' }}"
    steps:
      # get_proposal is allowed to fail-and-continue (retried above first). The retag does
      # not depend on its content, but the outcome comment and the decision itself do:
      # without a successful read there is no decider or reason to report, and closing the
      # Investigation would hide that. Gate the whole re-tag/close on the read having
      # actually succeeded; a failed read leaves tags and the Investigation untouched.
      - name: guard_get_proposal_readable
        type: if
        condition: "${{ steps.get_proposal.error == blank }}"
        steps:
          # Every dismissal re-tags as az:inconclusive: the decline reasons the proposal API
          # offers (no_reason, duplicate, false_positive, handled_elsewhere, risk_accepted,
          # other) reject the *action*, and none says the classification itself was wrong,
          # so none can justify az:true_positive. The reason is reported in the comment below.
          - name: map_dismiss_reason_to_tag
            type: data.set
            with:
              dismissed_tag: az:inconclusive
              failed_retag_count: 0

          # One call per chunk swaps the tags: kibana.SetAlertTags rejects a tag in both lists,
          # and dismissed_tag (az:inconclusive) is never az:false_positive, so they do not collide.
          # Candidates go in chunks of 500 ids, not one call per alert: every step of a loop is
          # recorded in the execution, so up to 10000 candidates would otherwise be 20000
          # records. A chunk is also the unit that can fail, so one bad call leaves the other
          # chunks re-tagged.
          # `continue: true` sits on each SetAlertTags step, next to its retry, like
          # attach_alert_chunk does in the Worker: on the foreach it would leave the whole loop at
          # the first failure and skip the remaining chunks and the shortfall counters.
          - name: retag_dismissed_alerts
            type: foreach
            foreach: "${{ variables.live_alert_ids | chunk: 500 | json }}"
            steps:
              - name: retag_dismissed_chunk
                type: kibana.SetAlertTags
                on-failure:
                  retry:
                    max-attempts: 3
                    delay: 5s
                  continue: true
                with:
                  ids: "${{ foreach.item }}"
                  tags:
                    tags_to_remove:
                      - "az:false_positive"
                      - "az:model_fp"
                    tags_to_add:
                      - "{{ variables.dismissed_tag }}"

              # The call above retries, then continues past a persistent failure. SetAlertTags
              # returns the raw Elasticsearch update-by-query body on HTTP 200, which can list
              # `failures` and an `updated` count below the chunk size without setting `.error`.
              # Checking only the step error would report every candidate as re-tagged while
              # some still carry az:false_positive. Count HTTP failures as the whole chunk, and
              # soft UBQ shortfalls as `size - updated`, so the outcome comment reports the
              # actual shortfall.
              - name: record_retag_step_failure
                type: data.set
                if: "${{ steps.retag_dismissed_chunk.error != blank }}"
                with:
                  failed_retag_count: "${{ variables.failed_retag_count | plus: foreach.item.size }}"

              - name: record_retag_partial_failure
                type: data.set
                if: "${{ steps.retag_dismissed_chunk.error == blank and (steps.retag_dismissed_chunk.output.updated | default: 0) != foreach.item.size }}"
                with:
                  failed_retag_count: "${{ variables.failed_retag_count | plus: foreach.item.size | minus: (steps.retag_dismissed_chunk.output.updated | default: 0) }}"

          # Same failure tolerance as close_investigation_after_approval: the decision has
          # landed, so a failed bookkeeping patch must not fail the run.
          - name: close_investigation_after_dismissal
            type: ai.conversation.metadata.patch
            if: "${{ steps.get_live_revision.error == blank }}"
            on-failure:
              continue: true
              fallback:
                - name: log_dismissed_close_failed
                  type: console
                  with:
                    message: >-
                      The proposal was dismissed, but the Investigation could not be marked
                      closed: {{ error.message }}. Investigation
                      {{ inputs.conversation_id }} stays open.
            with:
              conversation_id: "{{ inputs.conversation_id }}"
              updates:
                status: closed
                close_reason: other

          - name: report_investigation_closed_after_dismissal
            type: alertzero.reportWorkerOutcome
            if: "${{ steps.close_investigation_after_dismissal.error == blank and steps.close_investigation_after_dismissal.output.changed_fields contains 'status' }}"
            on-failure:
              continue: true
            with:
              event: worker_investigation_closed
              investigation_id: "{{ inputs.conversation_id }}"
              close_reason: other

          - name: post_comment_outcome_dismissed
            type: ai.conversation.add_user_message
            on-failure:
              continue: true
            with:
              author_name: "{{ consts.author_name }}"
              conversation_id: "{{ inputs.conversation_id }}"
              message: >-
                Proposal {{ steps.get_proposal.output.decision | default: 'dismissed' }}{% if steps.get_proposal.output.decidedBy %} by @{{ steps.get_proposal.output.decidedBy.username }}{% endif %} (reason: {{ steps.get_proposal.output.dismissReason | default: 'not specified' }}). {% if variables.failed_retag_count > 0 %}{{ variables.fp_candidate_count | minus: variables.failed_retag_count }} of {{ variables.fp_candidate_count }} alert{% if variables.fp_candidate_count != 1 %}s{% endif %} re-tagged {{ variables.dismissed_tag }}; {{ variables.failed_retag_count }} failed after retries and {% if variables.failed_retag_count == 1 %}needs{% else %}need{% endif %} manual re-tagging.{% else %}{{ variables.fp_candidate_count }} alert{% if variables.fp_candidate_count != 1 %}s{% endif %} re-tagged {{ variables.dismissed_tag }}.{% endif %}{% if steps.get_proposal.output.rationale != blank %} Rationale: "{{ steps.get_proposal.output.rationale | truncate: 500 | escape }}".{% endif %}{% if steps.get_live_revision.error != blank %} The live revision could not be read, so joined alerts may still be tagged az:false_positive; this Investigation stays open.{% endif %}
        else:
          - name: retag_dismissed_read_failed
            type: foreach
            foreach: "${{ variables.live_alert_ids | chunk: 500 | json }}"
            steps:
              - name: retag_dismissed_read_failed_call
                type: kibana.SetAlertTags
                on-failure:
                  retry:
                    max-attempts: 3
                    delay: 5s
                  continue: true
                with:
                  ids: "${{ foreach.item }}"
                  tags:
                    tags_to_remove:
                      - "az:false_positive"
                    tags_to_add:
                      - "az:inconclusive"
          - name: post_comment_dismissed_read_failed
            type: ai.conversation.add_user_message
            on-failure:
              continue: true
            with:
              author_name: "{{ consts.author_name }}"
              conversation_id: "{{ inputs.conversation_id }}"
              message: >-
                ⚠️ The proposal was dismissed, but its details could not be read after
                retries ({{ steps.get_proposal.error.message }}). {{ variables.fp_candidate_count }}
                alert{% if variables.fp_candidate_count != 1 %}s{% endif %} {% if variables.fp_candidate_count == 1 %}was{% else %}were{% endif %} re-tagged az:inconclusive; this Investigation
                stays open for manual follow-up.

  # Expiry is not a dismissal: nobody rejected the verdict, so the alerts keep `az:model_fp`. They
  # leave `az:false_positive`, which nothing would revisit. The gate also settles as expired when
  # an approved close failed and its re-parked retry ran out of time, and that failed attempt
  # may have closed some alerts, so the comment below does not claim they are all open.
  - name: handle_expired
    type: if
    condition: "${{ variables.proposal_outcome == 'expired' }}"
    steps:
      - name: init_expired_retag_count
        type: data.set
        with:
          failed_retag_count: 0

      - name: retag_expired_alerts
        type: foreach
        foreach: "${{ variables.live_alert_ids | chunk: 500 | json }}"
        steps:
          - name: retag_expired_alerts_call
            type: kibana.SetAlertTags
            on-failure:
              retry:
                max-attempts: 3
                delay: 5s
              continue: true
            with:
              ids: "${{ foreach.item }}"
              tags:
                tags_to_remove:
                  - "az:false_positive"
                tags_to_add:
                  - "az:inconclusive"

          - name: record_expired_retag_step_failure
            type: data.set
            if: "${{ steps.retag_expired_alerts_call.error != blank }}"
            with:
              failed_retag_count: "${{ variables.failed_retag_count | plus: foreach.item.size }}"

          - name: record_expired_retag_partial_failure
            type: data.set
            if: "${{ steps.retag_expired_alerts_call.error == blank and (steps.retag_expired_alerts_call.output.updated | default: 0) != foreach.item.size }}"
            with:
              failed_retag_count: "${{ variables.failed_retag_count | plus: foreach.item.size | minus: (steps.retag_expired_alerts_call.output.updated | default: 0) }}"

      - name: close_investigation_after_expiry
        type: ai.conversation.metadata.patch
        if: "${{ steps.get_live_revision.error == blank }}"
        on-failure:
          continue: true
          fallback:
            - name: log_expired_close_failed
              type: console
              with:
                message: >-
                  The proposal expired, but the Investigation could not be marked
                  closed: {{ error.message }}. Investigation
                  {{ inputs.conversation_id }} stays open.
        with:
          conversation_id: "{{ inputs.conversation_id }}"
          updates:
            status: closed
            close_reason: other

      - name: report_investigation_closed_after_expiry
        type: alertzero.reportWorkerOutcome
        if: "${{ steps.close_investigation_after_expiry.error == blank and steps.close_investigation_after_expiry.output.changed_fields contains 'status' }}"
        on-failure:
          continue: true
        with:
          event: worker_investigation_closed
          investigation_id: "{{ inputs.conversation_id }}"
          close_reason: other

      - name: post_comment_outcome_expired
        type: ai.conversation.add_user_message
        on-failure:
          continue: true
        with:
          author_name: "{{ consts.author_name }}"
          conversation_id: "{{ inputs.conversation_id }}"
          message: >-
            The closure proposal expired before a closure was completed. {% if variables.failed_retag_count > 0 %}{{ variables.fp_candidate_count | minus: variables.failed_retag_count }} of {{ variables.fp_candidate_count }} alert{% if variables.fp_candidate_count != 1 %}s{% endif %} re-tagged az:inconclusive; {{ variables.failed_retag_count }} failed after retries and {% if variables.failed_retag_count == 1 %}needs{% else %}need{% endif %} manual re-tagging.{% else %}{{ variables.fp_candidate_count }} alert{% if variables.fp_candidate_count != 1 %}s{% endif %} {% if variables.fp_candidate_count == 1 %}is{% else %}are{% endif %} re-tagged az:inconclusive.{% endif %} If a closure attempt partially succeeded before the proposal expired, some may already be closed, so check each alert's workflow_status rather than assuming {% if variables.fp_candidate_count == 1 %}it is{% else %}they are{% endif %} still open.{% if steps.get_live_revision.error != blank %} The live revision could not be read, so joined alerts may still be tagged az:false_positive; this Investigation stays open.{% endif %}

  # Defensive branch. The gate settles as succeeded, dismissed or expired: a failed close
  # action is recorded `failed`, cloned and re-parked for another decision, and an
  # exhausted attempt budget settles as `expired`, so this review never sees `failed`.
  # Anything else means the gate contract changed. Leave the Investigation open so an
  # analyst looks at it.
  - name: handle_unknown_outcome
    type: if
    condition: "${{ variables.proposal_outcome == 'unknown' }}"
    steps:
      - name: retag_unknown_alerts
        type: foreach
        foreach: "${{ variables.live_alert_ids | chunk: 500 | json }}"
        steps:
          - name: retag_unknown_alerts_call
            type: kibana.SetAlertTags
            on-failure:
              retry:
                max-attempts: 3
                delay: 5s
              continue: true
            with:
              ids: "${{ foreach.item }}"
              tags:
                tags_to_remove:
                  - "az:false_positive"
                tags_to_add:
                  - "az:inconclusive"

      - name: post_comment_outcome_unknown
        type: ai.conversation.add_user_message
        on-failure:
          continue: true
        with:
          author_name: "{{ consts.author_name }}"
          conversation_id: "{{ inputs.conversation_id }}"
          # Does not assert every candidate remains open: an earlier close attempt may have
          # partly succeeded (action_close_alerts_false_positive's fail_incomplete_close
          # fires after a partial SetAlertsStatus update, since conflicts: proceed lets some
          # alerts close before the count mismatch throws). The gate's own output carries no
          # per-alert result, so this reports the ambiguity instead of a specific (possibly
          # wrong) closed/open count.
          message: >-
            ⚠️ The closure proposal ended in an unexpected state (status: "{{ steps.create_fp_proposal.output.status | default: 'unknown' }}"). Some of the {{ variables.fp_candidate_count }} candidate alert{% if variables.fp_candidate_count != 1 %}s{% endif %} may already be closed if a closure attempt partially succeeded before this outcome — check each alert's workflow_status rather than assuming all remain open. The candidates were re-tagged az:inconclusive. This Investigation stays open for review.

  # Telemetry: how the closure proposal settled, once its outcome has been applied.
  - name: report_closure_resolved
    type: alertzero.reportWorkerOutcome
    on-failure:
      continue: true
    with:
      event: alert_triage_closure_resolved
      outcome: |-
        {%- if variables.proposal_outcome == 'approved' or variables.proposal_outcome == 'dismissed' or variables.proposal_outcome == 'expired' -%}
        {{ variables.proposal_outcome }}
        {%- else -%}
        unknown
        {%- endif -%}
      alerts_proposed: "${{ variables.fp_candidate_count | default: 0 }}"
      revisions: "${{ variables.live_revision | default: 1 }}"
      alerts_retag_failed: "${{ variables.failed_retag_count | default: 0 }}"
      auto_approve_requested: "${{ inputs.autonomy == 'supervised' }}"
      proposal_read_failed: "${{ steps.get_proposal.error != blank }}"
      investigation_id: "{{ inputs.conversation_id }}"
