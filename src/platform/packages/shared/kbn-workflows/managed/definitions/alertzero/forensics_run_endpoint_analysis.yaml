version: "1"
name: Endpoint analysis run
description: >
  Given an `analyze_endpoint` knowledge indicator, resolves the associated
  Attack Discovery alert and host, runs a forensic agent to reconstruct the
  attack timeline and extract IoCs, attaches the findings to the investigation,
  journals the assessment, and proposes any justified containment
  actions. Manual autonomy waits for approval; supervised carries them out.
enabled: true
tags:
  - security
  - endpoint-analysis

settings:
  # One run per indicator. The per-space worker will continue re-dispatching
  # an indicator on every tick until this run retires it; this setting
  # collapses those repeats into the in-progress run instead of re-analyzing the same KI.
  # Concurrency is keyed per (key, spaceId) even though this workflow is
  # installed globally, but that's still safe: a child run inherits its
  # parent's space, and each indicator's `attributes.space_id` means only one
  # space's sweep ever dispatches it.
  concurrency:
    key: "endpoint-analysis-{{ inputs.ki_id }}"
    strategy: drop
    max: 1

triggers:
  # Dispatched by the per-space Endpoint analysis worker, which owns the sweep cadence.
  - type: manual
    inputs:
      properties:
        ki_id:
          type: string
          minLength: 1
          maxLength: 512
          description: Id of the security.analyze_endpoint knowledge indicator to analyze.
        ai_index_id:
          type: string
          minLength: 1
          maxLength: 256
          # Mirrors AI_INDEX_ID_PATTERN in the context engine.
          pattern: "^[a-z0-9][a-z0-9_-]*$"
          description: AI index that holds the indicator. The result is written to the same index.
      required:
        - ki_id
        - ai_index_id
      additionalProperties: false

outputs:
  properties:
    ki_id:
      type: string
    ki_processed:
      type: boolean
    attachments_written:
      type: boolean
    proposals_submitted:
      type: number
    proposals_converged:
      type: number

consts:
  # Journal notes call `system-alertzero-journal-note` by literal id, not a const:
  # `run-as-mode: inherit` runs the note as this workflow's service account, and the
  # engine only allows that for a literal `workflow-id`.

  # Cap on the number of containment actions this run can propose.
  max_recommended_actions: 8
  # Fallback when the KI carries no `attributes.autonomy`.
  default_autonomy: manual
  # Liquid has no array literal, so `| default: []` falls back to nothing at all
  # rather than to an empty array. A const is the only way to spell that fallback.
  no_rows: []
  # The revision at which this run stops adding itself to a live Proposal's comment.
  # Same ceiling as Hunt's `MAX_AUTOMATIC_REVISION` (converge_on_live_proposal.ts):
  # every addition is a new revision row and a new card in the owner's conversation,
  # and an analyst reading revision N is refused when they decide it once N+1 lands.
  max_automatic_revision: 5
  # A comment this long or longer is not revised. The Proposals service caps a comment
  # at 8192 characters (`MAX_COMMENT_LENGTH`), and the "Also raised by" line this run
  # appends is under 192 with the longest conversation id and space id.
  max_revisable_comment_length: 8000

steps:
  # A read error fails the run, leaving the indicator pending for the next
  # sweep to retry.
  #
  # The type and space filters are the Spaces boundary for this workflow.
  # `attributes.status: pending` matches the sweep, so a re-dispatch of an
  # indicator that already settled finds nothing and is not analyzed again.
  - name: read_ki
    type: elasticsearch.search
    with:
      index: "ai-index-idx-{{ inputs.ai_index_id }}"
      size: 1
      sort:
        - "@timestamp":
            order: desc
            unmapped_type: date
      query:
        bool:
          filter:
            - bool:
                should:
                  - term:
                      id: "{{ inputs.ki_id }}"
                  - bool:
                      filter:
                        - ids:
                            values:
                              - "{{ inputs.ki_id }}"
                      must_not:
                        - exists:
                            field: id
                minimum_should_match: 1
            - term:
                type: security.analyze_endpoint
            - term:
                attributes.space_id: "{{ workflow.spaceId }}"
            - term:
                attributes.status: pending

  - name: resolve_request
    type: data.set
    with:
      attack_discovery_alert_id: "{{ steps.read_ki.output.hits.hits[0]._source.attributes.attack_discovery_alert_id }}"
      investigation_id: "{{ steps.read_ki.output.hits.hits[0]._source.attributes.investigation_id }}"
      # Set by an earlier run of this workflow, before the agent. Blank means this
      # indicator has not been analyzed yet.
      forensic_attempted_at: "{{ steps.read_ki.output.hits.hits[0]._source.attributes.forensic_attempted_at | default: '' }}"
      # Explicitly set whether we have the data we need to continue
      has_request: >-
        ${{ steps.read_ki.output.hits.hits[0]._source.attributes.attack_discovery_alert_id != blank
          and steps.read_ki.output.hits.hits[0]._source.attributes.investigation_id != blank }}

  # Verify the investigation exists and is readable before proceeding with the run.
  # If the investigation does not exist, the indicator is retired by `mark_unreachable`.
  - name: verify_investigation
    type: ai.conversation.metadata.read
    if: "${{ steps.resolve_request.output.investigation_id != blank }}"
    on-failure:
      continue: true
    with:
      conversation_id: "{{ steps.resolve_request.output.investigation_id }}"

  # Built with `{{ }}` so later `${{ }}` checks can use the values. Those
  # expressions do not expand a nested `{{ inputs.ki_id }}`.
  - name: finding_ids
    type: data.set
    with:
      timeline: "forensic-timeline-{{ inputs.ki_id }}"
      iocs: "forensic-iocs-{{ inputs.ki_id }}"

  - name: when_ki_valid
    type: if
    condition: >-
      ${{ steps.resolve_request.output.has_request == true
        and steps.verify_investigation.output.metadata != null }}
    steps:
      - name: append_workflow_execution
        type: investigations.appendWorkflowExecutionId
        with:
          conversationId: "{{ steps.resolve_request.output.investigation_id }}"
          workflowExecutionId: "{{ execution.id }}"
        on-failure:
          continue: true

      # Both of this indicator's attachments mean an earlier run finished the
      # analysis but could not retire the indicator. Finding them lets this run
      # skip the agent and retry just the write. Fewer than both after an attempt
      # was already recorded skips the agent too: a later run does not start
      # another 15m analysis. Another indicator's files do not count.
      #
      # Listing rather than reading an attachment by id, because `ai.attachment.read`
      # reports "no such attachment" and "the attachment service is broken" the same
      # way: it catches every error and returns no output, so a null version cannot
      # tell "no prior analysis" from "could not find out".
      - name: list_prior_findings
        type: ai.attachment.list
        with:
          conversation_id: "{{ steps.resolve_request.output.investigation_id }}"

      - name: resolve_prior_assessment
        type: data.set
        with:
          # A finished run leaves both ids, including an empty timeline or an
          # empty IoC list. One of the two is a partial write from this indicator.
          count: >-
            ${{ steps.list_prior_findings.output.attachments | map: 'id' | where_exp: 'attachment_id', 'attachment_id == steps.finding_ids.output.timeline or attachment_id == steps.finding_ids.output.iocs' | size }}

      # `workflow.spaceId` is the space of the worker that dispatched this run, not
      # the global space this workflow is installed in: a child execution inherits
      # its parent's space. That is what keeps these alert indices space-scoped.
      #
      # Both lookups fail the run rather than continue on error, same as
      # `read_ki` above: a read error is a gap, not a result. If it continued
      # instead, a transient Elasticsearch fault would reach `resolve_host` as
      # a blank host — indistinguishable from "the discovery names no host" —
      # and wrongly mark the indicator processed instead of retrying. Failing
      # leaves it pending for the next sweep, which is cheap since both
      # lookups happen before the agent runs.
      - name: fetch_attack_discovery_alert
        type: elasticsearch.search
        with:
          index: ".alerts-security.attack.discovery.alerts-{{ workflow.spaceId }},.adhoc.alerts-security.attack.discovery.alerts-{{ workflow.spaceId }}"
          ignore_unavailable: true
          size: 1
          _source:
            - host.name
            - kibana.alert.attack_discovery.alert_ids
          query:
            bool:
              should:
                - ids:
                    values:
                      - "{{ steps.resolve_request.output.attack_discovery_alert_id }}"
                - term:
                    kibana.alert.uuid: "{{ steps.resolve_request.output.attack_discovery_alert_id }}"
              minimum_should_match: 1

      - name: extract_host_from_ad_constituent_alerts
        type: elasticsearch.search
        if: "${{ steps.fetch_attack_discovery_alert.output.hits.hits[0]._source['kibana.alert.attack_discovery.alert_ids'] != blank }}"
        with:
          index: ".alerts-security.alerts-{{ workflow.spaceId }}"
          ignore_unavailable: true
          size: 0
          query:
            ids:
              values: "${{ steps.fetch_attack_discovery_alert.output.hits.hits[0]._source['kibana.alert.attack_discovery.alert_ids'] }}"
          aggregations:
            host_name:
              terms:
                field: host.name
                size: 1

      # Only the not-found case reaches here now: a read error failed the run above. A
      # missing alert is permanent — the discovery this indicator names is gone — so it
      # is narrated and the indicator is retired rather than retried. A failed note
      # fails the run instead, leaving the indicator pending for the next sweep.
      # This step is before the agent, so that retry is cheap.
      - name: journal_fetch_alert_problem
        type: workflow.execute
        if: "${{ steps.fetch_attack_discovery_alert.output.hits.hits[0]._id == blank }}"
        with:
          workflow-id: system-alertzero-journal-note
          run-as-mode: inherit
          inputs:
            conversation_id: "{{ steps.resolve_request.output.investigation_id }}"
            message: >-
              No Attack Discovery alert matching `{{ steps.resolve_request.output.attack_discovery_alert_id }}`
              was found, so endpoint analysis could not run.

      # The discovery's own `host.name` first, then the host its constituent alerts agree
      # on. Blank here means both lookups succeeded and neither named a host, since an
      # error in either would have failed the run.
      - name: resolve_host
        type: data.set
        with:
          host_name: "{{ steps.fetch_attack_discovery_alert.output.hits.hits[0]._source.host.name | default: steps.extract_host_from_ad_constituent_alerts.output.aggregations.host_name.buckets[0].key | default: '' }}"
      - name: when_host_known
        type: if
        condition: "${{ steps.resolve_host.output.host_name != blank }}"
        steps:
          # Whether there is anything for the agent to reconstruct. The Hunt Watch
          # worker makes the same check (`check_index_scope`) before it selects a
          # report. The forensic skill resolves `logs-endpoint.events.*` only once
          # the agent is running, so without this a host with no Elastic Defend
          # telemetry spends the indicator's single attempt on a 15m run that can
          # only report nothing.
          #
          # Gated like the agent, so a retry of a finished analysis does not depend
          # on telemetry still being there. Fails the run on a read error, like the
          # alert lookups above: a read error is a gap, not "no telemetry", and the
          # indicator stays pending for a cheap retry since this is before the agent.
          - name: check_endpoint_telemetry
            type: elasticsearch.search
            if: "${{ steps.resolve_prior_assessment.output.count != 2 and steps.resolve_request.output.forensic_attempted_at == blank }}"
            with:
              index: "logs-endpoint.events.*"
              ignore_unavailable: true
              size: 1
              _source: false
              query:
                bool:
                  filter:
                    - term:
                        host.name: "{{ steps.resolve_host.output.host_name }}"
                    - range:
                        "@timestamp":
                          gte: "now-72h"

          # `checked` tells "no telemetry" apart from "did not look": a skipped step
          # has no output, and that must not read as an empty index.
          - name: resolve_endpoint_telemetry
            type: data.set
            with:
              checked: "${{ steps.check_endpoint_telemetry.output != null }}"
              present: "${{ steps.check_endpoint_telemetry.output.hits.hits[0]._id != blank }}"

          # Before the agent and before the attempt is recorded, so a failed note
          # fails the run and the next sweep re-checks, the same as `journal_no_host`.
          - name: journal_no_telemetry
            type: workflow.execute
            if: >-
              ${{ steps.resolve_endpoint_telemetry.output.checked == true
                and steps.resolve_endpoint_telemetry.output.present != true }}
            with:
              workflow-id: system-alertzero-journal-note
              run-as-mode: inherit
              inputs:
                conversation_id: "{{ steps.resolve_request.output.investigation_id }}"
                message: >-
                  No Elastic Defend telemetry was found for `{{ steps.resolve_host.output.host_name }}`
                  in `logs-endpoint.events.*`, so endpoint analysis was not run.

          # Record the attempt before the agent. A later run reads it back from the
          # indicator and does not start another analysis. `attributes` merges, so
          # this does not change `status`. A failed write fails the run here, before
          # the agent, and the indicator stays pending for one more try.
          #
          # `present` already implies the check ran, which only happens on the path
          # where the agent would, so it is the whole telemetry condition here.
          - name: mark_attempted
            type: context-engine.updateKi
            if: >-
              ${{ steps.resolve_prior_assessment.output.count != 2
                and steps.resolve_request.output.forensic_attempted_at == blank
                and steps.resolve_endpoint_telemetry.output.present == true }}
            with:
              ai_index_id: "{{ inputs.ai_index_id }}"
              ki_id: "{{ inputs.ki_id }}"
              ki:
                attributes:
                  forensic_attempted_at: "{{ execution.startedAt }}"
          # Mark the start of the analysis in the journal. Continue on
          # failure: this note is before the agent, but a rejected note must not skip
          # the analysis or leave the indicator pending
          - name: journal_analysis_started
            type: workflow.execute
            if: >-
              ${{ steps.resolve_prior_assessment.output.count != 2
                and steps.resolve_request.output.forensic_attempted_at == blank
                and steps.resolve_endpoint_telemetry.output.present == true }}
            on-failure:
              continue: true
            with:
              workflow-id: system-alertzero-journal-note
              run-as-mode: inherit
              inputs:
                conversation_id: "{{ steps.resolve_request.output.investigation_id }}"
                message: >-
                  Starting endpoint analysis of `{{ steps.resolve_host.output.host_name }}`.
          - name: forensic_analysis
            type: ai.agent
            # Runs once per indicator: only when findings are still missing, no
            # earlier run has recorded an attempt, and the host has Defend telemetry.
            # Both attachments, or a recorded attempt with either still missing,
            # skips the agent.
            if: >-
              ${{ steps.resolve_prior_assessment.output.count != 2
                and steps.resolve_request.output.forensic_attempted_at == blank
                and steps.resolve_endpoint_telemetry.output.present == true }}
            # Continues on failure so the run still reaches its terminal write.
            # If this step failed the run instead, the indicator would stay
            # `pending`, and the sweep would re-run this 15m agent every minute
            # for the rest of the lookback window. Continuing instead lets
            # `journal_analysis_problem` log what happened and `mark_failed`
            # retire the indicator, at the cost of one handoff instead of a
            # 15m run every minute for the sweep lookback.
            on-failure:
              continue: true
            agent-id: alertzero-thin-agent
            # Keep in sync with ALERTZERO_BALANCED_INFERENCE_FEATURE_ID in @kbn/alertzero-common.
            # Balanced rather than frontier: this is a tool-driven reconstruction that
            # iterates over telemetry and then calls the action catalog, so its cost scales
            # with the round count rather than with one long answer.
            connector-id-by-feature: alertzero_balanced
            # plugin-id: per-Worker cost attribution; aggregate-by: ALERTZERO_INFERENCE_PARENT_FEATURE_ID.
            plugin-id: alertzero_endpoint_analysis
            aggregate-by: alertzero_parent
            timeout: "15m"
            create-conversation: false
            with:
              configuration_overrides:
                skill_ids:
                  - endpoint-forensic-analysis
                tools:
                  - tool_ids:
                      - security.alertzero.actions.list
              message: >
                I have an alert on {{ steps.resolve_host.output.host_name }}.
                Perform forensic analysis and extract all IoCs.
                Write the reconstruction to `timeline.events` and the indicators to `iocs`,
                matching this step's schema. Use `rationale` only for the assessment:
                - Whether this is a real incident, which other hosts are affected, what the
                  data gaps are, and why the evidence supports any actions you recommend.
                  Do not restate `timeline` or `iocs` there.

                After the forensic reconstruction,
                - Assess whether this represents a real incident that warrants containment.
                - Call `security.alertzero.actions.list` with categories `["respond"]` before proposing anything.
                  Use the returned catalog as the only allowed actions. Set each `actionId` to a catalog
                  `workflowId`. Do not invent workflow ids and do not recommend an action that is not in the
                  catalog. If the catalog is empty, set propose=false and return an empty `recommendedActions` list.
                - If this reconstruction justifies containment, recommend specific containment actions in
                  `recommendedActions` from that catalog. Recommend only what you can tie to the timeline
                  and indicators you returned.

                Each catalog entry carries an `inputSchema`: the JSON Schema of that action's manual
                trigger. The proposal checks `actionInput` against `inputSchema.properties.actionInput`,
                not against `inputSchema` itself. Set `actionInput` to an object that satisfies that
                inner schema. Do not wrap it in another `actionInput` key. Read that inner schema per
                action rather than assuming a shape from the action's description, from another entry,
                or from what an action required previously. Fill every property it marks required, and
                take the values only from the evidence: Elastic Defend `agent.id` for endpoint ids,
                telemetry pids and entity_ids for process selectors.

                Rules
                - Pick the most specific catalog action the evidence supports. Prefer kill/suspend when a process
                  entity_id or pid is present; isolate when only the host is known.
                - If the evidence cannot fill what an entry's `inputSchema.properties.actionInput` requires, drop that action. Set
                  propose=false when that leaves nothing. Never guess an id, pid, path, or command that is
                  not in the evidence.
                - Cite hosts, process/path, tactics, and why this action now in rationale.
                - Set `title` on every recommendation to a short plain-text label of that one action
                  and its target, using the catalog entry's `name`. A host action names the host
                  (`Isolate host WIN-ANALYST01`). A process action names the process and the host
                  (`Kill powershell.exe (PID 4212) on WIN-ANALYST01`). Include the target so two of
                  the same action still read as different cards.
                - Set `comment` on every recommendation to one or two sentences for the analyst
                  approving that one card: the evidence this action rests on and what it stops
                  (`powershell.exe (PID 4212) spawned from winword.exe and is encrypting files
                  under C:\Users; killing it stops the encryption`). Specific to this action and
                  target. Do not restate the assessment from `rationale`.
                - Set `confidence` per action, not for the reconstruction as a whole: how sure you are
                  that this action hits the right host or process and that the evidence justifies it
                  now. Identifiers read directly from the telemetry support high; an inference about
                  a host you saw only indirectly does not.

              schema:
                type: object
                required:
                  - propose
                  - rationale
                  - timeline
                  - iocs
                  - recommendedActions
                properties:
                  propose:
                    type: boolean
                    description: >
                      True only when the agent recommends one or more specific containment actions
                  # Required and non-empty: `timeline` and `iocs` can legitimately both be
                  # empty, so this rationale is the one thing a completed analysis always
                  # writes. It is journaled, and the journal note rejects a message
                  # longer than 8000 characters. Set less than 8000 to allow journal note
                  # to include additional text
                  rationale:
                    type: string
                    minLength: 1
                    maxLength: 7900
                    description: >
                      Assessment only: whether this is a real incident, other affected hosts,
                      data gaps, and why the evidence supports the recommended actions. The
                      reconstruction itself belongs in `timeline`, the indicators in `iocs`.
                  # `timeline` and `iocs` mirror the `security.investigation.timeline` and
                  # `security.investigation.iocs` attachment payloads exactly, so the attach steps
                  # below can pass them through untouched. Changing a field name here without
                  # changing it there makes the attachment fail validation at runtime.
                  # Both are required but may be empty: an empty `events` list is a real forensic
                  # result, and required-but-empty stops the model from folding them back into
                  # `rationale`.
                  timeline:
                    type: object
                    required:
                      - events
                    description: >
                      Chronological attack reconstruction. Same shape as the
                      `security.investigation.timeline` attachment payload, so the attach
                      step can pass it through untouched.
                    properties:
                      events:
                        type: array
                        maxItems: 50
                        description: Reconstructed events, ordered earliest first.
                        items:
                          type: object
                          required:
                            - timestamp
                            - host
                            - description
                          properties:
                            timestamp:
                              type: string
                              minLength: 1
                              maxLength: 64
                              description: Event `@timestamp`, copied verbatim from the telemetry.
                            host:
                              type: string
                              minLength: 1
                              maxLength: 256
                              description: Host this event occurred on.
                            description:
                              type: string
                              minLength: 1
                              maxLength: 2000
                              description: >
                                What happened, with the specifics an analyst can act on: process and parent
                                names, PIDs, acting user, command line, file paths, destination address and
                                port, registry key, alert rule name, MITRE technique.
                  iocs:
                    type: object
                    description: >
                      Indicators of compromise, grouped by category. Omit a category entirely when the
                      reconstruction found nothing in it.
                    properties:
                      # Every category is the same { value, comment } list. The shape is repeated rather
                      # than $ref'd because this schema is handed to the model as a structured output
                      # schema, and reference resolution is not guaranteed across providers.
                      shas:
                        type: array
                        maxItems: 50
                        description: File hashes.
                        items:
                          type: object
                          required: [value]
                          properties:
                            value: { type: string, minLength: 1, maxLength: 2048 }
                            comment:
                              type: string
                              maxLength: 1000
                              description: What it was dropped as and on which hosts.
                      ips:
                        type: array
                        maxItems: 50
                        description: C2 and other network destinations.
                        items:
                          type: object
                          required: [value]
                          properties:
                            value: { type: string, minLength: 1, maxLength: 2048 }
                            comment:
                              type: string
                              maxLength: 1000
                              description: Which hosts contacted it and over what protocol.
                      file_paths:
                        type: array
                        maxItems: 50
                        description: Dropped payloads, staging paths, persistence keys.
                        items:
                          type: object
                          required: [value]
                          properties:
                            value: { type: string, minLength: 1, maxLength: 2048 }
                            comment: { type: string, maxLength: 1000 }
                      ransom_note:
                        type: array
                        maxItems: 50
                        description: Ransom note paths.
                        items:
                          type: object
                          required: [value]
                          properties:
                            value: { type: string, minLength: 1, maxLength: 2048 }
                            comment: { type: string, maxLength: 1000 }
                      encryption_marker:
                        type: array
                        maxItems: 50
                        description: Markers of encryption, such as a renamed file extension.
                        items:
                          type: object
                          required: [value]
                          properties:
                            value: { type: string, minLength: 1, maxLength: 2048 }
                            comment: { type: string, maxLength: 1000 }
                      malicious_commands:
                        type: array
                        maxItems: 50
                        description: Command lines attributed to the attack.
                        items:
                          type: object
                          required: [value]
                          properties:
                            value: { type: string, minLength: 1, maxLength: 2048 }
                            comment: { type: string, maxLength: 1000 }
                      compromised_identities:
                        type: array
                        maxItems: 50
                        description: Accounts used by the attacker or stolen.
                        items:
                          type: object
                          required: [value]
                          properties:
                            value: { type: string, minLength: 1, maxLength: 2048 }
                            comment:
                              type: string
                              maxLength: 1000
                              description: How it was compromised and what it was then used for.
                      affected_hosts:
                        type: array
                        maxItems: 50
                        description: Every host the attack touched.
                        items:
                          type: object
                          required: [value]
                          properties:
                            value: { type: string, minLength: 1, maxLength: 2048 }
                            comment:
                              type: string
                              maxLength: 1000
                              description: >
                                This host's role — patient zero, encrypted domain controller,
                                spread with no alert coverage.
                  # Required but may be empty, same as `timeline` and `iocs`.
                  recommendedActions:
                    type: array
                    maxItems: "${{ consts.max_recommended_actions }}"
                    description: >
                      Containment this reconstruction justifies, taken from
                      `security.alertzero.actions.list`. Empty when the evidence
                      justifies none or the catalog returned nothing.
                    items:
                      type: object
                      required:
                        - actionId
                        - actionInput
                        - title
                        - comment
                        - confidence
                      properties:
                        actionId:
                          type: string
                          minLength: 1
                          maxLength: 256
                          description: >
                            workflowId from `security.alertzero.actions.list`. Must match a catalog
                            entry exactly. Never invent an id.
                        # 256 is the proposal step's title limit. A longer one fails the dispatch.
                        title:
                          type: string
                          minLength: 1
                          maxLength: 256
                          description: >
                            Short plain-text label of this action and its target, using the catalog
                            entry's name. A host action names the host (`Isolate host WIN-ANALYST01`).
                            A process action names the process and the host
                            (`Kill powershell.exe (PID 4212) on WIN-ANALYST01`).
                        # Required and bounded: this is the body of the approval card. The
                        # full assessment is in `rationale`, which is journaled once on the
                        # investigation; a card that repeats it is too long to review.
                        comment:
                          type: string
                          minLength: 1
                          maxLength: 500
                          description: >
                            One or two sentences for the analyst approving this one action: the
                            evidence it rests on and what it stops. Specific to this action and
                            target; do not restate `rationale`.
                        # Set per action, not per run: a run can be certain about one host and
                        # only suspect another, and each action becomes its own approval card.
                        # Required because the analyst is deciding whether to disrupt a
                        # production endpoint, and only the agent can judge how confident this
                        # particular recommendation is — an action's own `impact` doesn't say that.
                        confidence:
                          type: string
                          enum: [low, medium, high]
                          description: >
                            How sure the agent is that this action targets the right host or process
                            and that the evidence justifies taking it now.
                        # Deliberately unconstrained: this schema is fixed before the turn begins,
                        # but each action's real input contract (`inputSchema.properties.actionInput`
                        # on its catalog entry) is only known after the model calls
                        # `security.alertzero.actions.list`, and varies per action. Restating a shape
                        # here would either not fit every action (e.g. a required `endpoint_ids` for
                        # one that takes none) or drift from the real schema over time.
                        # `assertActionInputValid` validates the input against that inner schema when
                        # the proposal is created instead.
                        actionInput:
                          type: object
                          additionalProperties: true
                          description: >
                            Input for the catalog action, shaped to satisfy that entry's
                            `inputSchema.properties.actionInput`. Do not wrap it in another `actionInput`.

          # Timeline and IoCs are attached to the investigation; the assessment is a
          # journal note rather than an attachment. The forensic agent run itself is
          # ephemeral (no conversation), so its ES|QL transcript never lands there.
          # Continues on failure so a rejected attachment payload doesn't also block
          # the assessment note or containment proposals below.
          #
          # An empty reconstruction attaches too. "No events were reconstructed from the
          # available telemetry" is the answer to the question this run was dispatched to
          # ask, and both attachment types render exactly that sentence for an empty
          # payload.
          - name: resolve_finding_presence
            type: data.set
            with:
              timeline: "${{ steps.forensic_analysis.output.structured_output.timeline.events.size > 0 }}"
              iocs: >-
                ${{ steps.forensic_analysis.output.structured_output.iocs.shas.size > 0
                  or steps.forensic_analysis.output.structured_output.iocs.ips.size > 0
                  or steps.forensic_analysis.output.structured_output.iocs.file_paths.size > 0
                  or steps.forensic_analysis.output.structured_output.iocs.ransom_note.size > 0
                  or steps.forensic_analysis.output.structured_output.iocs.encryption_marker.size > 0
                  or steps.forensic_analysis.output.structured_output.iocs.malicious_commands.size > 0
                  or steps.forensic_analysis.output.structured_output.iocs.compromised_identities.size > 0
                  or steps.forensic_analysis.output.structured_output.iocs.affected_hosts.size > 0 }}

          - name: journal_timeline
            type: workflow.execute
            if: "${{ steps.resolve_finding_presence.output.timeline == true }}"
            on-failure:
              continue: true
            with:
              workflow-id: system-alertzero-journal-note
              run-as-mode: inherit
              inputs:
                conversation_id: "{{ steps.resolve_request.output.investigation_id }}"
                message: >-
                  Reconstructed forensic timeline for `{{ steps.resolve_host.output.host_name }}`.

          - name: attach_timeline
            type: ai.attachment.add
            if: >-
              ${{ steps.forensic_analysis.output.structured_output.timeline != null }}
            on-failure:
              continue: true
            with:
              conversation_id: "{{ steps.resolve_request.output.investigation_id }}"
              id: "{{ steps.finding_ids.output.timeline }}"
              render_inline: true
              type: security.investigation.timeline
              description: "Attack timeline: {{ steps.resolve_host.output.host_name }}"
              data: "${{ steps.forensic_analysis.output.structured_output.timeline }}"

          - name: journal_iocs
            type: workflow.execute
            if: "${{ steps.resolve_finding_presence.output.iocs == true }}"
            on-failure:
              continue: true
            with:
              workflow-id: system-alertzero-journal-note
              run-as-mode: inherit
              inputs:
                conversation_id: "{{ steps.resolve_request.output.investigation_id }}"
                message: >-
                  Extracted IoCs during forensic analysis of `{{ steps.resolve_host.output.host_name }}`.

          - name: attach_iocs
            type: ai.attachment.add
            if: >-
              ${{ steps.forensic_analysis.output.structured_output.iocs != null }}
            on-failure:
              continue: true
            with:
              conversation_id: "{{ steps.resolve_request.output.investigation_id }}"
              id: "{{ steps.finding_ids.output.iocs }}"
              render_inline: true
              type: security.investigation.iocs
              description: Extracted indicators of compromise
              data: "${{ steps.forensic_analysis.output.structured_output.iocs }}"

          - name: journal_rationale
            type: workflow.execute
            if: >-
              ${{ steps.forensic_analysis.error == null
                and steps.forensic_analysis.output.structured_output.rationale != blank }}
            on-failure:
              continue: true
            with:
              workflow-id: system-alertzero-journal-note
              run-as-mode: inherit
              inputs:
                conversation_id: "{{ steps.resolve_request.output.investigation_id }}"
                message: >-
                  {%- if steps.forensic_analysis.output.structured_output.propose == true -%}Rationale for proposed actions{%- else -%}Rationale for ending investigation{%- endif -%}: {{ steps.forensic_analysis.output.structured_output.rationale }}

        else:
          - name: journal_no_host
            type: workflow.execute
            # Only journal if there is an Attack Discovery alert to reference but no host.
            # A failed note fails the run and leaves the indicator pending. The next
            # sweep retries this lookup, which is still before the agent.
            if: "${{ steps.fetch_attack_discovery_alert.output.hits.hits[0]._id != blank }}"
            with:
              workflow-id: system-alertzero-journal-note
              run-as-mode: inherit
              inputs:
                conversation_id: "{{ steps.resolve_request.output.investigation_id }}"
                message: >-
                  Could not resolve a host for Attack Discovery alert `{{ steps.resolve_request.output.attack_discovery_alert_id }}`.
                  Endpoint analysis was not run.

    else:
      # Malformed indicator that is missing an Attack Discovery alert ID or investigation ID.
      # A retry won't fix this and leaving it `pending` would cause it to be re-dispatched
      # on every sweep for the rest of the lookback window, so it's explicitly retired here instead.
      - name: journal_invalid_request
        type: workflow.execute
        # Only possible when there is an investigation to write to, and only meaningful
        # when that investigation is the one this note is about: the other way into this
        # branch is an investigation that could not be read, where a write would fail for
        # the same reason the read did.
        if: >-
          ${{ steps.resolve_request.output.investigation_id != blank
            and steps.resolve_request.output.has_request != true }}
        on-failure:
          continue: true
        with:
          workflow-id: system-alertzero-journal-note
          run-as-mode: inherit
          inputs:
            conversation_id: "{{ steps.resolve_request.output.investigation_id }}"
            message: >-
              Indicator `{{ inputs.ki_id }}` names no Attack Discovery alert, so endpoint
              analysis could not run. The indicator was retired and will not be retried.

      # Mark investigation invalid. This is skipped when `read_ki` found nothing:
      # there is no document to retire, and the sweep cannot re-select one that does not
      # exist, so that case settles itself.
      - name: mark_invalid
        type: context-engine.updateKi
        if: >-
          ${{ steps.read_ki.output.hits.hits[0]._id != blank
            and steps.resolve_request.output.has_request != true }}
        with:
          ai_index_id: "{{ inputs.ai_index_id }}"
          ki_id: "{{ inputs.ki_id }}"
          ki:
            attributes:
              status: invalid
              invalid_reason: "Missing attack_discovery_alert_id or investigation_id"

  # Indicator is well-formed, but its investigation could not be read. Mark
  # `failed` rather than `invalid` since the problem is on the investigation's end.
  # Still retired, since a retry won't fix a deleted or unshared investigation
  - name: mark_unreachable
    type: context-engine.updateKi
    if: >-
      ${{ steps.resolve_request.output.has_request == true
        and steps.verify_investigation.output.metadata == null }}
    with:
      ai_index_id: "{{ inputs.ai_index_id }}"
      ki_id: "{{ inputs.ki_id }}"
      ki:
        attributes:
          status: failed
          failure_reason: "Could not read investigation {{ steps.resolve_request.output.investigation_id }}"

  # Reads back what's actually on the investigation instead of trusting the
  # add steps' output, because the adds continue on failure so we cannot
  # reliably determine if anything was actually added.
  - name: list_written_findings
    type: ai.attachment.list
    if: "${{ steps.verify_investigation.output.metadata != null }}"
    with:
      conversation_id: "{{ steps.resolve_request.output.investigation_id }}"

  - name: resolve_written_findings
    type: data.set
    with:
      ids: "${{ steps.list_written_findings.output.attachments | map: 'id' }}"

  - name: resolve_run_outcome
    type: data.set
    with:
      attached: >-
        ${{ steps.resolve_written_findings.output.ids contains steps.finding_ids.output.timeline
          and steps.resolve_written_findings.output.ids contains steps.finding_ids.output.iocs }}
      # Findings only exist when a host was known and had Defend telemetry, since
      # that's the only path where the agent runs. So no host, or a host with
      # nothing in `logs-endpoint.events.*`, means no findings is the correct
      # outcome, not a failure — and no retry will resolve a host that the
      # discovery and its constituent alerts never named, or produce telemetry
      # that was never shipped. `checked` keeps a run that did not look (findings
      # already attached, or a recorded attempt) from reading as "no telemetry".
      # One of this indicator's attachments is a partial write, not a finished
      # run. The assessment is a journal note and is not part of this check.
      settled: >-
        ${{ (steps.resolve_written_findings.output.ids contains steps.finding_ids.output.timeline
          and steps.resolve_written_findings.output.ids contains steps.finding_ids.output.iocs)
          or steps.resolve_host.output.host_name == blank
          or (steps.resolve_endpoint_telemetry.output.checked == true
            and steps.resolve_endpoint_telemetry.output.present != true) }}
      # Both findings are on the investigation, but not from this run: an
      # earlier run attached them and never recorded how it ended, whether
      # because its verdict write failed or because it died between the
      # attachments and the verdict. This run has no agent output to check the
      # proposals against, so it cannot vouch for them, and must not retire the
      # indicator as `processed` on their behalf.
      outcome_unrecorded: >-
        ${{ steps.resolve_written_findings.output.ids contains steps.finding_ids.output.timeline
          and steps.resolve_written_findings.output.ids contains steps.finding_ids.output.iocs
          and steps.forensic_analysis.output == null }}

  # The worker writes this onto the indicator before dispatch. A missing
  # attribute fails closed to manual.
  - name: resolve_autonomy
    type: data.set
    with:
      level: "{{ steps.read_ki.output.hits.hits[0]._source.attributes.autonomy | default: consts.default_autonomy }}"

  # ---------------------------------------------------------------------------
  # Duplicate check. Another Investigation can reach the same host first: an
  # Attack Discovery handoff and a Hunt handoff for one host open two
  # Investigations, and each would otherwise propose its own isolate for the
  # same agent. Hunt Watch solves this in TypeScript (`resolve_proposal_slot.ts`:
  # a deterministic Proposal id per subject, plus a walk of the Proposals
  # service's revision chain). This run is YAML only and the Proposals plugin
  # exposes neither a uuidv5 filter nor a latest-revision route, so it does the
  # list-and-filter version instead: read every live AlertZero Proposal in the
  # space, and treat a recommended action as covered when a live Proposal asks
  # for the same action on the same target.
  #
  # One subject namespace with Hunt, on purpose: the filter is `origin:
  # alertzero`, not this worker, and the match key below is the same target
  # fields Hunt's `holdsSubject` compares (`endpoint_ids`, `parameters.entity_id`,
  # `id_field`, `id_value`; `parameters.pid` added for a kill the agent could
  # only name by pid), so a Hunt isolate on an agent covers a Forensics isolate
  # on that agent and the other way round.
  #
  # Known gaps, accepted for this version and documented rather than hidden:
  # - No race protection. Two runs that list in the same moment both see the
  #   subject free and both mint. Hunt's `op_type: create` under a derived id is
  #   what closes that, and it needs a step type.
  # - `size` caps at 100 per status. A space carrying more than 100 live
  #   AlertZero Proposals of one status is only checked against the first 100.
  # - A live Proposal on an Investigation that has since been closed still
  #   counts as covering. The status route refuses to close over a pending
  #   Proposal, so this needs an executing one on a closed Investigation.
  #
  # Both lists continue on failure and the check fails OPEN: a run that cannot
  # tell what exists submits everything, as it did before this check existed,
  # and `journal_proposals_queued` says so. Hunt fails closed here, but a Hunt
  # report can be re-hunted by a manual run; this indicator's one attempt is
  # spent, and its recommendations exist only in this run's agent output, so
  # minting nothing would lose the containment for good. A duplicate card an
  # analyst dismisses is the lesser harm.
  #
  # `pending` is read with `excludeExpired` so a Proposal past its deadline
  # that the gate has not settled yet is not converged onto; `executing` keeps
  # running past its deadline, so it is not. `excludeSuperseded` on both leaves
  # only the live head of each revision chain, whose `id` is what `revise` wants.
  - name: list_pending_proposals
    type: kibana.request
    if: >-
      ${{ steps.resolve_run_outcome.output.attached == true
        and steps.forensic_analysis.output.structured_output.propose == true
        and steps.forensic_analysis.output.structured_output.recommendedActions.size > 0 }}
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals"
      headers:
        elastic-api-version: "1"
      query:
        origin: alertzero
        status: pending
        excludeSuperseded: "true"
        excludeExpired: "true"
        size: 100
    on-failure:
      continue: true

  - name: list_executing_proposals
    type: kibana.request
    if: >-
      ${{ steps.resolve_run_outcome.output.attached == true
        and steps.forensic_analysis.output.structured_output.propose == true
        and steps.forensic_analysis.output.structured_output.recommendedActions.size > 0 }}
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals"
      headers:
        elastic-api-version: "1"
      query:
        origin: alertzero
        status: executing
        excludeSuperseded: "true"
        size: 100
    on-failure:
      continue: true

  # `checked` is false when either read failed, so the note can say the check was
  # partial. `concat` treats a missing second list as empty, so one failed read
  # still filters against the other.
  - name: resolve_live_proposals
    type: data.set
    if: >-
      ${{ steps.resolve_run_outcome.output.attached == true
        and steps.forensic_analysis.output.structured_output.propose == true
        and steps.forensic_analysis.output.structured_output.recommendedActions.size > 0 }}
    with:
      checked: >-
        ${{ steps.list_pending_proposals.output.proposals != nil
          and steps.list_executing_proposals.output.proposals != nil }}
      proposals: "${{ steps.list_pending_proposals.output.proposals | default: consts.no_rows | concat: steps.list_executing_proposals.output.proposals }}"

  # Splits the agent's recommendations into what this run mints (`new`) and what
  # a live Proposal already holds (`covered`), as JSON text; the next step parses
  # it. Liquid cannot build an array any other way.
  #
  # The match key is the action plus every target field it names. Two keys are
  # equal only when both name the target the same way, so a kill by `entity_id`
  # never absorbs a kill by `pid` for what might be a different process. Hunt's
  # own kills always carry `endpoint_ids` + `parameters.entity_id` and nothing
  # else target-shaped, so a Forensics kill built to the same catalog schema
  # lands on the same key. The key is also what dedupes the agent's own list: a
  # recommendation repeating an earlier one in the same run is dropped silently.
  #
  # Each covered entry carries what the convergence loop below needs: whether the
  # live Proposal belongs to this Investigation (a rerun finding its own; counted,
  # not noted), whether it can still be revised (pending and undecided), whether
  # its comment already names this Investigation, and whether this run should add
  # itself to it (revisable, not yet named, under the revision ceiling, with room
  # left in the comment).
  - name: resolve_proposal_plan
    type: data.set
    if: >-
      ${{ steps.resolve_run_outcome.output.attached == true
        and steps.forensic_analysis.output.structured_output.propose == true
        and steps.forensic_analysis.output.structured_output.recommendedActions.size > 0 }}
    with:
      plan_json: |-
        {%- assign investigation_id = steps.resolve_request.output.investigation_id -%}
        {%- assign live = steps.resolve_live_proposals.output.proposals -%}
        {%- assign seen = '' -%}
        {%- assign new_items = '' -%}
        {%- assign covered_items = '' -%}
        {%- for action in steps.forensic_analysis.output.structured_output.recommendedActions -%}
          {%- capture key -%}<{{ action.actionId }}|{{ action.actionInput.endpoint_ids | join: ',' }}|{{ action.actionInput.parameters.entity_id }}|{{ action.actionInput.parameters.pid }}|{{ action.actionInput.id_field }}|{{ action.actionInput.id_value }}>{%- endcapture -%}
          {%- if seen contains key -%}{%- continue -%}{%- endif -%}
          {%- assign seen = seen | append: key -%}
          {%- assign covered = false -%}
          {%- for p in live -%}
            {%- capture live_key -%}<{{ p.actionWorkflowId }}|{{ p.actionInput.endpoint_ids | join: ',' }}|{{ p.actionInput.parameters.entity_id }}|{{ p.actionInput.parameters.pid }}|{{ p.actionInput.id_field }}|{{ p.actionInput.id_value }}>{%- endcapture -%}
            {%- if live_key != key -%}{%- continue -%}{%- endif -%}
            {%- assign covered = true -%}
            {%- assign comment = p.comment | default: '' -%}
            {%- assign revision = p.revision | default: 1 -%}
            {%- assign revisable = false -%}
            {%- if p.status == 'pending' and p.decision == nil -%}{%- assign revisable = true -%}{%- endif -%}
            {%- assign mentioned = false -%}
            {%- if comment contains investigation_id -%}{%- assign mentioned = true -%}{%- endif -%}
            {%- assign revise = false -%}
            {%- if revisable == true and mentioned == false and revision < consts.max_automatic_revision and comment.size < consts.max_revisable_comment_length -%}{%- assign revise = true -%}{%- endif -%}
            {%- capture item -%}
              {"title": {{ action.title | default: '' | json }}, "proposalId": {{ p.id | json }}, "ownerConversationId": {{ p.conversationId | json }}, "sameInvestigation": {% if p.conversationId == investigation_id %}true{% else %}false{% endif %}, "revisable": {{ revisable }}, "mentioned": {{ mentioned }}, "revise": {{ revise }}, "comment": {{ comment | json }}}
            {%- endcapture -%}
            {%- if covered_items != '' -%}{%- assign covered_items = covered_items | append: ',' -%}{%- endif -%}
            {%- assign covered_items = covered_items | append: item -%}
            {%- break -%}
          {%- endfor -%}
          {%- if covered == false -%}
            {%- capture item -%}{{ action | json }}{%- endcapture -%}
            {%- if new_items != '' -%}{%- assign new_items = new_items | append: ',' -%}{%- endif -%}
            {%- assign new_items = new_items | append: item -%}
          {%- endif -%}
        {%- endfor -%}
        {"new": [{{ new_items }}], "covered": [{{ covered_items }}]}

  - name: resolve_proposal_lists
    type: data.set
    if: >-
      ${{ steps.resolve_run_outcome.output.attached == true
        and steps.forensic_analysis.output.structured_output.propose == true
        and steps.forensic_analysis.output.structured_output.recommendedActions.size > 0 }}
    with:
      plan: "${{ steps.resolve_proposal_plan.output.plan_json | json_parse }}"

  # `converged` is what another Investigation holds: the journal reports it and
  # this run adds itself to it. A live Proposal this Investigation already holds
  # (a rerun landing on its own) is only counted: nothing to add, nothing to say.
  # Every later step keys off these counts; a skipped step leaves them nil, and
  # `nil > 0` is false.
  - name: resolve_proposal_counts
    type: data.set
    if: >-
      ${{ steps.resolve_run_outcome.output.attached == true
        and steps.forensic_analysis.output.structured_output.propose == true
        and steps.forensic_analysis.output.structured_output.recommendedActions.size > 0 }}
    with:
      new_count: "${{ steps.resolve_proposal_lists.output.plan.new.size }}"
      converged: "${{ steps.resolve_proposal_lists.output.plan.covered | where_exp: 'entry', 'entry.sameInvestigation != true' }}"
      converged_count: "${{ steps.resolve_proposal_lists.output.plan.covered | where_exp: 'entry', 'entry.sameInvestigation != true' | size }}"
      already_open_count: "${{ steps.resolve_proposal_lists.output.plan.covered | where_exp: 'entry', 'entry.sameInvestigation == true' | size }}"

  # Written before any proposal starts. Each proposal posts its own comment as
  # soon as it reaches the approval gate, and those runs are asynchronous, so a
  # note after the dispatch lands among them. The count is the list about to be
  # queued; a rejection after this is `journal_proposals_lost`. Also the one
  # place the duplicate check reports its totals: what was covered, by whom, and
  # whether the check could be made at all. The per-Proposal detail is in the
  # convergence notes below.
  - name: journal_proposals_queued
    type: workflow.execute
    if: >-
      ${{ steps.resolve_request.output.has_request == true
        and steps.verify_investigation.output.metadata != null
        and steps.resolve_run_outcome.output.attached == true
        and steps.forensic_analysis.output.structured_output.propose == true
        and steps.forensic_analysis.output.structured_output.recommendedActions.size > 0 }}
    on-failure:
      continue: true
    with:
      workflow-id: system-alertzero-journal-note
      run-as-mode: inherit
      inputs:
        conversation_id: "{{ steps.resolve_request.output.investigation_id }}"
        message: |-
          {%- assign new_count = steps.resolve_proposal_counts.output.new_count | default: 0 -%}
          {%- assign converged_count = steps.resolve_proposal_counts.output.converged_count | default: 0 -%}
          {%- assign already_open_count = steps.resolve_proposal_counts.output.already_open_count | default: 0 -%}
          {%- if new_count > 0 -%}
          Endpoint analysis of `{{ steps.resolve_host.output.host_name }}` is submitting {{ new_count }} containment proposal(s)
          {%- if steps.resolve_autonomy.output.level == 'supervised' %} for auto-approval{% else %} for analyst approval{% endif %}.
          {%- else -%}
          Endpoint analysis of `{{ steps.resolve_host.output.host_name }}` found containment worth proposing, but every proposal it would have raised already exists, so none was created.
          {%- endif -%}
          {%- if converged_count > 0 %} {{ converged_count }} already raised by another Investigation; the notes below say where.{% endif -%}
          {%- if already_open_count > 0 %} {{ already_open_count }} already open on this investigation.{% endif -%}
          {%- if steps.resolve_live_proposals.output.checked != true %} Existing proposals could not be fully checked, so a duplicate of one may have been submitted.{% endif -%}
          {%- if new_count > 0 %} The investigation closes once every proposal on it has been decided.{% else %} The investigation stays open until an analyst closes it.{% endif -%}

  # The gate closes the investigation once every proposal on it is settled, and
  # its creation barrier (`created >= expectedProposalCount`) counts every
  # proposal on the investigation, not just this run's. This investigation
  # already holds at least the approved handoff that requested the analysis,
  # and possibly triage or attack proposals, so the barrier has to be baselined
  # on what is there now or the first containment gate to settle would read
  # the handoff as "all created" and close under the siblings still queueing.
  # Same baseline Hunt's packaging takes inside `hunt.packageReport`; this run
  # has no step type, so it reads the route. `size: 1`: only `total` is read.
  # Failing open to `0` here is the lesser risk: a premature close is undone by
  # the bridge's own reopen on the next proposal, a blocked close is manual.
  #
  # Only what this run mints is added to the baseline. A finding that converged
  # onto another Investigation's Proposal mints nothing, and that Proposal is
  # counted on neither side; one this Investigation already holds is in the
  # baseline already.
  - name: count_existing_proposals
    type: kibana.request
    if: "${{ steps.resolve_proposal_counts.output.new_count > 0 }}"
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/proposals"
      headers:
        elastic-api-version: "1"
      query:
        conversationId: "{{ steps.resolve_request.output.investigation_id }}"
        size: 1
    on-failure:
      continue: true

  # Filters apply left to right, so `default: 0` covers only the count read
  # (skipped or failed) before this run's new proposals are added on.
  - name: resolve_expected_proposals
    type: data.set
    if: "${{ steps.resolve_proposal_counts.output.new_count > 0 }}"
    with:
      count: "${{ steps.count_existing_proposals.output.total | default: 0 | plus: steps.resolve_proposal_counts.output.new_count }}"

  # Containment is proposed on the investigation, not returned as run output.
  # `executeAsync` so this run does not sit in the 72h approval gate; each
  # gate parks on its own. Continue on failure so a single bad action cannot
  # fail the run. Runs after investigation items are attached. `parallel` with
  # `settled` keeps every dispatch's outcome: `foreach` would keep only the last
  # one, and continuing on failure would clear a rejection.
  #
  # The `if` gates the whole step, including `foreach`. `| default: []` does not
  # produce an array in this engine, and `foreach` hard-fails when its source is
  # missing. The step runs only when the list has items, so a missing or empty
  # list skips the fan-out instead of failing the run after the agent.
  #
  # Iterates `plan.new`, not the agent's list: what a live Proposal already
  # holds is not dispatched. A run whose every recommendation was covered
  # dispatches no gate, so nothing of this run's closes the Investigation; it
  # stays open until an analyst closes it, which `journal_proposals_queued` says.
  - name: propose_actions
    type: parallel
    if: "${{ steps.resolve_proposal_counts.output.new_count > 0 }}"
    foreach: "${{ steps.resolve_proposal_lists.output.plan.new }}"
    mode: settled
    concurrency:
      # must use a literal until https://github.com/elastic/security-team/issues/19967 is fixed
      max: 8
    steps:
      - name: propose_action
        type: workflow.executeAsync
        with:
          # The gate rather than the bridge: it wraps the bridge (so `origin` is
          # still stamped there) and closes the investigation once every
          # proposal on it is approved, dismissed or otherwise settled. Without
          # it the investigation stayed open after the last decision.
          workflow-id: system-security-forensics-proposal-gate
          run-as-mode: inherit
          inputs:
            conversationId: "{{ steps.resolve_request.output.investigation_id }}"
            investigationConversationId: "{{ steps.resolve_request.output.investigation_id }}"
            expectedProposalCount: "${{ steps.resolve_expected_proposals.output.count }}"
            # Without this the proposal stores the action's own name, so two isolates
            # of different hosts share one label. Truncated to the proposal step's
            # title limit: a longer one fails the dispatch.
            title: '{{ foreach.item.title | truncate: 256, "" }}'
            # The per-action comment, not the run's `rationale`: the rationale is the
            # whole assessment (up to 7900 characters) and is already journaled on the
            # investigation, so repeating it on each card buries the one sentence the
            # analyst needs. The schema requires a non-empty comment; the fallback only
            # keeps a card readable if a blank slips through, since the bridge rejects
            # a proposal with no comment.
            comment: "{{ foreach.item.comment | default: foreach.item.title }}"
            actionWorkflowId: "{{ foreach.item.actionId }}"
            actionInput: '${{ foreach.item.actionInput }}'
            # `impact` and `category` are deliberately not passed: both would override what
            # the action declares, and for containment they are intrinsic to the action
            # rather than to this run
            confidence: "{{ foreach.item.confidence | default: '' }}"
            autoApprove: "${{ steps.resolve_autonomy.output.level == 'supervised' }}"

  # A recommendation a live Proposal from another Investigation already holds
  # created nothing above. Two things tell the analyst where it went, the same
  # two Hunt writes when it converges (`converge_on_live_proposal.ts`):
  # - the live Proposal's comment gets an "Also raised by [Investigation]" line,
  #   so whoever approves it sees every Investigation that reached that host;
  # - this Investigation gets a journal line naming the Proposal and linking the
  #   Investigation that raised it.
  #
  # Sequential `foreach`, not `parallel`: the note's wording depends on whether
  # the revise just before it landed, and a `foreach` body is where a later
  # step can read an earlier one's output for the same item and still continue
  # past its failure. The list is at most `max_recommended_actions` long.
  #
  # Revising is a write the Proposals service does not check the caller for;
  # the route does, and this worker's role carries `feature_proposals.all`. A
  # refused or failed revise is not fatal: the duplicate was avoided either way,
  # and the line is a courtesy. The note then says only what is true.
  - name: converge_on_live_proposals
    type: foreach
    if: "${{ steps.resolve_proposal_counts.output.converged_count > 0 }}"
    foreach: "${{ steps.resolve_proposal_counts.output.converged }}"
    steps:
      - name: revise_live_proposal
        type: kibana.request
        if: "${{ foreach.item.revise == true }}"
        with:
          method: POST
          path: "/s/{{ workflow.spaceId }}/internal/proposals/{{ foreach.item.proposalId }}/revisions"
          headers:
            kbn-xsrf: "true"
            elastic-api-version: "1"
            Content-Type: application/json
          body:
            comment: |-
              {{ foreach.item.comment }}

              Also raised by [Investigation]({% if workflow.spaceId != 'default' %}/s/{{ workflow.spaceId }}{% endif %}/app/alertzero?selectedConversationId={{ steps.resolve_request.output.investigation_id }}).
        on-failure:
          continue: true

      # "Added to it" only when it was: the comment already named this
      # Investigation, or the revise above returned a new revision.
      - name: journal_convergence_note
        type: workflow.execute
        with:
          workflow-id: system-alertzero-journal-note
          run-as-mode: inherit
          inputs:
            conversation_id: "{{ steps.resolve_request.output.investigation_id }}"
            message: >-
              A Proposal for "{{ foreach.item.title }}"
              {%- if foreach.item.revisable == true %} is already awaiting a decision{% else %} has already been approved and is being carried out{% endif %},
              raised by [another Investigation]({% if workflow.spaceId != 'default' %}/s/{{ workflow.spaceId }}{% endif %}/app/alertzero?selectedConversationId={{ foreach.item.ownerConversationId }}).
              This run found the same thing, so no second Proposal was created.
              {%- if foreach.item.mentioned == true or steps.revise_live_proposal.output.proposalId != blank %} This Investigation was added to it.{% endif %}
        on-failure:
          continue: true

  # `0` when the step did not run: no host, findings did not land, the agent
  # did not propose, or the list was empty. A later check treats only a real
  # rejection as lost.
  - name: resolve_proposal_dispatch
    type: data.set
    with:
      failed: "${{ steps.propose_actions.output.failed | default: 0 }}"

  # Counted after the dispatch. Putting this on `resolve_run_outcome` would
  # always see zero failures, and a rejected proposal would still retire the
  # indicator as processed. The recommendation exists only in this agent
  # output, so a later sweep would skip the agent and never queue it.
  - name: resolve_proposals
    type: data.set
    with:
      proposals_lost: >-
        ${{ steps.forensic_analysis.output.structured_output.propose == true
          and steps.resolve_proposal_dispatch.output.failed > 0 }}

  # Retiring the indicator so that the sweep stops picking it up.
  # The verdict writes below do not continue on failure. Instead of swallowing
  # these failures and reporting a falsely-completed run, we fail the run. The
  # failure shows up in the execution record, and the next sweep re-dispatches.
  # That retry skips the agent (`resolve_prior_assessment` finds both findings),
  # but it also has nothing to check the assessment or the proposals against,
  # so it lands on `mark_outcome_unrecorded` rather than here. Each verdict
  # write therefore retries in place first: a short context-engine blip should
  # not cost the verdict.
  # Only `attributes.status` is written. `attributes` merges on update; `tags`
  # is a list and a partial update would replace the full list.
  - name: mark_processed
    type: context-engine.updateKi
    if: >-
      ${{ steps.resolve_request.output.has_request == true
        and steps.verify_investigation.output.metadata != null
        and steps.resolve_run_outcome.output.settled == true
        and steps.resolve_run_outcome.output.outcome_unrecorded != true
        and steps.resolve_proposals.output.proposals_lost != true }}
    on-failure:
      retry:
        max-attempts: 3
        delay: "5s"
        strategy: exponential
    with:
      ai_index_id: "{{ inputs.ai_index_id }}"
      ki_id: "{{ inputs.ki_id }}"
      ki:
        attributes:
          status: processed

  # Findings are on the investigation, but at least one containment proposal
  # never reached the queue. Document this then retire the indicator.
  - name: journal_proposals_lost
    type: workflow.execute
    if: >-
      ${{ steps.resolve_request.output.has_request == true
        and steps.verify_investigation.output.metadata != null
        and steps.resolve_run_outcome.output.settled == true
        and steps.resolve_proposals.output.proposals_lost == true }}
    on-failure:
      continue: true
    with:
      workflow-id: system-alertzero-journal-note
      run-as-mode: inherit
      inputs:
        conversation_id: "{{ steps.resolve_request.output.investigation_id }}"
        message: >-
          Endpoint analysis of `{{ steps.resolve_host.output.host_name }}` attached its findings,
          but {{ steps.resolve_proposal_dispatch.output.failed }} containment proposal(s) did not
          reach the approval queue. The indicator was retired and will not be retried.

  - name: mark_proposals_failed
    type: context-engine.updateKi
    if: >-
      ${{ steps.resolve_request.output.has_request == true
        and steps.verify_investigation.output.metadata != null
        and steps.resolve_run_outcome.output.settled == true
        and steps.resolve_proposals.output.proposals_lost == true }}
    on-failure:
      retry:
        max-attempts: 3
        delay: "5s"
        strategy: exponential
    with:
      ai_index_id: "{{ inputs.ai_index_id }}"
      ki_id: "{{ inputs.ki_id }}"
      ki:
        attributes:
          status: failed
          failure_reason: >-
            Containment proposals did not reach the queue for investigation
            {{ steps.resolve_request.output.investigation_id }}

  # An earlier run attached the findings and never recorded its verdict. The
  # assessment note and the containment proposals exist only in that run's
  # agent output; this run cannot re-check or redo them (a redo would duplicate
  # whichever proposals did land). So it does not claim `processed`: it says
  # what it knows and retires the indicator as `failed` so someone looks.
  # The investigation already holds whatever that run managed to write.
  - name: journal_outcome_unrecorded
    type: workflow.execute
    if: >-
      ${{ steps.resolve_request.output.has_request == true
        and steps.verify_investigation.output.metadata != null
        and steps.resolve_run_outcome.output.outcome_unrecorded == true }}
    on-failure:
      continue: true
    with:
      workflow-id: system-alertzero-journal-note
      run-as-mode: inherit
      inputs:
        conversation_id: "{{ steps.resolve_request.output.investigation_id }}"
        message: >-
          An earlier endpoint analysis of `{{ steps.resolve_host.output.host_name }}` attached its
          findings here but did not record how it ended. Its assessment and any containment
          proposals should be checked against the notes above. The indicator was retired and
          will not be retried.

  - name: mark_outcome_unrecorded
    type: context-engine.updateKi
    if: >-
      ${{ steps.resolve_request.output.has_request == true
        and steps.verify_investigation.output.metadata != null
        and steps.resolve_run_outcome.output.outcome_unrecorded == true }}
    on-failure:
      retry:
        max-attempts: 3
        delay: "5s"
        strategy: exponential
    with:
      ai_index_id: "{{ inputs.ai_index_id }}"
      ki_id: "{{ inputs.ki_id }}"
      ki:
        attributes:
          status: failed
          failure_reason: >-
            Findings reached investigation {{ steps.resolve_request.output.investigation_id }}
            from an earlier run that did not record its outcome; assessment and proposals unverified

  # The investigation needs to hear how this analysis ended — every other
  # problem path already narrates itself, but this one didn't, even though
  # it's the step that takes 15m and is most likely to fail. Without this,
  # silence would read as "never analyzed" instead of "analyzed, found nothing."
  #
  # The note names which case it was and links the execution. It does not include
  # `error.message`: a later agent round reads this journal as user input, and the
  # error itself stays on the execution.
  - name: journal_analysis_problem
    type: workflow.execute
    if: >-
      ${{ steps.resolve_request.output.has_request == true
        and steps.verify_investigation.output.metadata != null
        and steps.resolve_run_outcome.output.settled != true }}
    on-failure:
      continue: true
    with:
      workflow-id: system-alertzero-journal-note
      run-as-mode: inherit
      inputs:
        conversation_id: "{{ steps.resolve_request.output.investigation_id }}"
        message: >-
          Endpoint analysis of `{{ steps.resolve_host.output.host_name }}` left no findings on this investigation.
          {% if steps.forensic_analysis.error != null %}The forensic agent failed.{% elsif steps.resolve_request.output.forensic_attempted_at != blank %}A previous attempt did not finish, so this run did not start another analysis.{% else %}The analysis finished but none of its findings could be attached.{% endif %}
          See execution `{{ execution.id }}` ([full per-stage detail]({{ execution.url }})).

  # The run had a host to analyze but still landed no findings — e.g. no
  # OWNER access on the conversation, a deleted investigation, a rejected
  # attachment payload, or an agent error. A retry won't fix any of those, so
  # it's retired rather than left pending re-running every minute. Kept
  # distinct from `processed` so the indicator reflects that nothing landed.
  - name: mark_failed
    type: context-engine.updateKi
    if: >-
      ${{ steps.resolve_request.output.has_request == true
        and steps.verify_investigation.output.metadata != null
        and steps.resolve_run_outcome.output.settled != true }}
    on-failure:
      retry:
        max-attempts: 3
        delay: "5s"
        strategy: exponential
    with:
      ai_index_id: "{{ inputs.ai_index_id }}"
      ki_id: "{{ inputs.ki_id }}"
      ki:
        attributes:
          status: failed
          failure_reason: "No findings reached investigation {{ steps.resolve_request.output.investigation_id }}"

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      ki_id: "{{ inputs.ki_id }}"
      ki_processed: "${{ steps.mark_processed.output.result != null }}"
      # Reported so a run that analyzed a host but landed nothing on the investigation
      # is visible from its own output, which is what makes the handoff desk-testable.
      attachments_written: "${{ steps.resolve_run_outcome.output.attached == true }}"
      # Gates dispatched and findings a live Proposal already held, so a run that
      # proposed nothing because everything was covered reads as that, not as a
      # run that found nothing to propose. `0` when the agent did not propose.
      proposals_submitted: "${{ steps.resolve_proposal_counts.output.new_count | default: 0 }}"
      proposals_converged: "${{ steps.resolve_proposal_counts.output.converged_count | default: 0 }}"
