version: '1'
name: 'Automatic Troubleshooting: find endpoint artifacts'
description: >
  Reads one Elastic Defend artifact list and returns compact item summaries, the
  fetch population, and whether the caller could read the list. Internal: reached
  only by id through execute_workflow.
enabled: true
triggers:
  - type: manual
    inputs:
      properties:
        list_id:
          type: string
          enum:
            - endpoint_list
            - endpoint_trusted_apps
            - endpoint_trusted_devices
            - endpoint_event_filters
            - endpoint_host_isolation_exceptions
            - endpoint_blocklists
            - endpoint_custom_yara_signatures
          description: Which Elastic Defend artifact list to read.
        saved_object_ids:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 256
          description: Saved-object IDs to read instead of searching the list.
        search:
          type: string
          maxLength: 256
          description: Free-text filter passed to the artifact list route.
        policy_id:
          type: string
          maxLength: 256
          description: Keep only items scoped to this package policy.
        os:
          type: string
          enum: [windows, macos, linux]
          description: Keep only items for this operating system.
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
          description: Maximum number of item summaries to return.
      required:
        - list_id
      additionalProperties: false
outputs:
  type: object
  required: [summaries, population, unauthorized, not_found_ids]
  additionalProperties: false
  properties:
    summaries:
      type: array
      maxItems: 20
      items:
        type: object
        additionalProperties: true
    population:
      type: object
      required: [fetched, total, truncated]
      additionalProperties: true
      properties:
        fetched: { type: number }
        total: { type: number }
        truncated: { type: boolean }
    not_found_ids:
      type: array
      maxItems: 10
      items:
        type: string
    unauthorized:
      type: boolean
steps:
  - name: find
    type: security.findEndpointArtifacts
    with:
      list_id: "${{ inputs.list_id }}"
      saved_object_ids: "${{ inputs.saved_object_ids }}"
      search: "${{ inputs.search }}"
      policy_id: "${{ inputs.policy_id }}"
      os: "${{ inputs.os }}"
      limit: "${{ inputs.limit }}"
      fetch_cap: "${{ inputs.limit }}"
      sort_field: updated_at
      sort_order: desc
  - name: emit
    type: workflow.output
    with:
      summaries: "${{ steps.find.output.summaries }}"
      population: "${{ steps.find.output.population }}"
      unauthorized: "${{ steps.find.output.unauthorized }}"
      not_found_ids: "${{ steps.find.output.not_found_ids }}"
