version: '1'
name: '[Experimental] Nightshift Investigation from an Alert rule'
description: >
  Starts a Nightshift investigation when a v1 alerting rule fires.
  Attach this workflow as a rule action. One in-flight run per rule per space
  (extras dropped), and at most five alerts per firing.
enabled: true
settings:
  timeout: '10m'
  concurrency:
    key: 'nightshift-investigation-alert-trigger-{{ workflow.spaceId }}-{{ event.rule.id }}'
    strategy: drop
    max: 1
tags:
  - observability
  - investigation
  - nightshift
  - alerting

consts:
  max_alerts_per_run: 5

triggers:
  - type: alert

steps:
  - name: trigger_investigations
    type: foreach
    foreach: '{{ event.alerts | slice: 0, consts.max_alerts_per_run }}'
    max-iterations: 5
    steps:
      - name: start_investigation
        type: nightshift.triggerInvestigation
        with:
          subject_type: alert
          subject_id: '{{ foreach.item._id | default: foreach.item.kibana.alert.uuid }}'
          title: '{{ foreach.item.kibana.alert.rule.name | default: event.rule.name }}'
          summary: '{{ foreach.item.kibana.alert.reason | default: event.rule.name }}'
          concurrency_key: '{{ foreach.item._id | default: foreach.item.kibana.alert.uuid }}'
          trigger_type: automatic
          context:
            alerts:
              - '${{ foreach.item }}'
        on-failure:
          continue: true
