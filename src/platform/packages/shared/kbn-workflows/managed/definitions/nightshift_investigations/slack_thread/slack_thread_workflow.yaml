version: '1'
name: Nightshift Slack Thread Investigation
description: >
  Keeps one Nightshift investigation per Slack thread. Every human reply in a thread that already
  has an investigation re-runs it in the same conversation. The thread has one status
  message: the first run posts it, and every run edits it with the findings or the failure. A
  later run leaves it showing the previous findings until its own are ready.
enabled: true
settings:
  # Longer than the investigation's own timeout, since this run waits for it.
  timeout: '65m'
  # One run per thread at a time, in arrival order, so replies build on each other. The
  # investigation rejects a second concurrent run (409), so this queue is what makes a reply wait
  # rather than fail. Anything else that runs this thread's investigation must use the same key.
  concurrency:
    key: 'nightshift-slack-thread-{{ event.connectorId }}-{{ event.channel }}-{{ event.threadId | default: event.messageId }}'
    strategy: queue
    max: 1
tags:
  - observability
  - investigation
  - nightshift

triggers:
  # Only human replies with text in a thread. The Relay drops the app's own posts and edits, but a
  # connector that receives events straight from Slack does not: its posts carry botId, and its
  # edits carry a message_changed subtype that may lack botId. A reply also sent to the channel
  # carries the thread_broadcast subtype, and a reply with attached files the file_share subtype;
  # only its text is investigated.
  - type: slack2.message
    connector-id: elastic-apps-slack
    on:
      condition: 'event.threadId:* and event.text:* and not event.botId:* and (not event.subtype:* or event.subtype:thread_broadcast or event.subtype:file_share)'

steps:
  # A reply only continues an existing investigation; this workflow never creates one. Delivery
  # is at least once, so the thread records each event and a redelivered one is skipped.
  - name: find_investigation
    type: kibana.request
    with:
      method: POST
      path: '/s/{{ workflow.spaceId }}/internal/nightshift/investigations/_slack_thread'
      headers:
        x-elastic-internal-origin: 'kibana'
      body:
        workspace: '${{ event.workspace }}'
        channel: '{{ event.channel }}'
        thread_ts: '{{ event.threadId | default: event.messageId }}'
        text: '${{ event.text }}'
        create: false
        event_id: '${{ event.correlationKey }}'

  - name: in_investigation_thread
    type: if
    condition: '${{ steps.find_investigation.output.investigation_id != null and steps.find_investigation.output.duplicate != true }}'
    steps:
      - name: set_investigation_url
        type: data.set
        with:
          investigation_url: "{{ kibanaUrl }}{% if workflow.spaceId != 'default' %}/s/{{ workflow.spaceId }}{% endif %}/app/nightshift?investigationId={{ steps.find_investigation.output.investigation_id }}"

      # Only the first run announces itself, so a later run leaves the thread's status message
      # showing the previous findings rather than blanking it for as long as the run takes.
      - name: post_started
        type: slack2.sendMessage
        if: '${{ steps.find_investigation.output.status_message_ts == null }}'
        connector-id: '{{ event.connectorId }}'
        with:
          channel: '{{ event.channel }}'
          threadTs: '{{ event.threadId | default: event.messageId }}'
          text: 'Investigation started. <{{ variables.investigation_url }}|View the investigation>'
        on-failure:
          continue: true

      # Recorded before the investigation runs so a failed first run still leaves later runs a
      # message to edit.
      - name: record_status_message
        type: kibana.request
        if: '${{ steps.post_started.output.ts != null }}'
        with:
          method: POST
          path: '/s/{{ workflow.spaceId }}/internal/nightshift/investigations/_slack_thread'
          headers:
            x-elastic-internal-origin: 'kibana'
          body:
            workspace: '${{ event.workspace }}'
            channel: '{{ event.channel }}'
            thread_ts: '{{ event.threadId | default: event.messageId }}'
            create: false
            status_message_ts: '{{ steps.post_started.output.ts }}'
        on-failure:
          retry:
            max-attempts: 3
            delay: 5s
            strategy: exponential
          continue: true

      # A failed investigation is reported from its record below rather than failing this run.
      - name: investigate
        type: workflow.execute
        with:
          workflow-id: system-nightshift-investigation
          inputs:
            title: '{{ steps.find_investigation.output.title }}'
            # ai.agent has no input for the round's author, so the Slack author goes in the text.
            message: |
              Slack user <@{{ event.sender }}> wrote in the investigation's thread:

              {{ event.text }}
            investigation_id: '{{ steps.find_investigation.output.investigation_id }}'
        on-failure:
          continue: true

      - name: get_investigation
        type: kibana.request
        with:
          method: GET
          path: '/s/{{ workflow.spaceId }}/internal/nightshift/investigations/{{ steps.find_investigation.output.investigation_id }}'
          headers:
            x-elastic-internal-origin: 'kibana'

      # The record alone cannot tell this run's result: a run that failed before reopening the
      # investigation leaves the previous run's completed record in place.
      - name: set_result
        type: data.set
        with:
          # This run's own message on the first run, the recorded one on every later run.
          status_message_ts: '${{ steps.post_started.output.ts | default: steps.find_investigation.output.status_message_ts }}'
          result_text: |
            {% if steps.investigate.error == null and steps.get_investigation.output.status == 'completed' %}{% if steps.get_investigation.output.title %}*{{ steps.get_investigation.output.title }}*

            {% endif %}{{ steps.get_investigation.output.summary }}{% else %}Investigation failed.{% endif %}

            <{{ variables.investigation_url }}|View the investigation>

      - name: update_result
        type: slack2.updateMessage
        if: '${{ variables.status_message_ts != null }}'
        connector-id: '{{ event.connectorId }}'
        with:
          channel: '{{ event.channel }}'
          messageTs: '{{ variables.status_message_ts }}'
          text: '{{ variables.result_text }}'
        # Retried so that a transient failure does not leave the thread a second status message.
        on-failure:
          retry:
            max-attempts: 3
            delay: 5s
            strategy: exponential
          continue: true

      # The thread has no status message, or it could not be edited, for example because someone
      # deleted it, so the result goes in a new message that later runs edit instead.
      - name: post_result
        type: slack2.sendMessage
        if: '${{ steps.update_result.output.ts == null }}'
        connector-id: '{{ event.connectorId }}'
        with:
          channel: '{{ event.channel }}'
          threadTs: '{{ event.threadId | default: event.messageId }}'
          text: '{{ variables.result_text }}'
        on-failure:
          continue: true

      - name: set_result_message
        type: data.set
        with:
          result_message_ts: '${{ steps.post_result.output.ts | default: steps.update_result.output.ts }}'

      # Records the message now holding the result when it is a new one or when recording the first
      # run's message failed, so the thread keeps a single status message for later runs to edit.
      - name: record_result_message
        type: kibana.request
        if: '${{ variables.result_message_ts != null and (variables.result_message_ts != variables.status_message_ts or steps.record_status_message.error != null) }}'
        with:
          method: POST
          path: '/s/{{ workflow.spaceId }}/internal/nightshift/investigations/_slack_thread'
          headers:
            x-elastic-internal-origin: 'kibana'
          body:
            workspace: '${{ event.workspace }}'
            channel: '{{ event.channel }}'
            thread_ts: '{{ event.threadId | default: event.messageId }}'
            create: false
            status_message_ts: '{{ variables.result_message_ts }}'
        on-failure:
          retry:
            max-attempts: 3
            delay: 5s
            strategy: exponential
          continue: true
