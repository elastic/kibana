version: '1'
name: Decision Tree Reinforce
description: >
  Post-round workflow that distills a completed investigation into the decision
  tree for its symptom. Prepares the turn from the stored trees and learnings,
  then runs the reinforcement agent, which validates and persists its edits.
enabled: true
tags:
  - observability
  - nightshift
  - investigation
  - decision-tree

triggers:
  - type: manual
    inputs:
      properties:
        prompt:
          type: string
          description: The user message that started this round.
        response:
          type: string
          description: The assistant's final response for this round.
        conversation_id:
          type: string
          description: Conversation id for the completed round, when present.
        round_id:
          type: string
          description: Id of the completed conversation round.
        agent_id:
          type: string
          description: Agent id that produced the round.
        connector_id:
          type: string
          maxLength: 500
          description: Optional strict model override for a direct workflow run.
        round_connector_id:
          type: string
          maxLength: 500
          description: Model used by the investigation round that triggered this workflow.
        workflow_context:
          type: object
          description: Persisted non-model workflow state. Unused by this workflow.
          additionalProperties: true
        tool_calls:
          type: array
          description: >
            Tool calls from the completed round. Used to see which decision-tree
            files the investigator actually opened, and replayed to the
            reinforcement agent as tool messages.
          items:
            type: object
            additionalProperties: true
        tool_results:
          type: array
          description: >
            Results of the completed round's tool calls, keyed by tool_call_id.
            Replayed to the reinforcement agent as the tool result messages.
          items:
            type: object
            additionalProperties: true
      additionalProperties: false

steps:
  # Failures here are deliberately not swallowed: this workflow runs as a post-execution hook,
  # which logs a failed execution and moves on rather than aborting the investigation. Letting a
  # step fail loudly is what makes a broken reinforcement visible at all.
  - name: prepare_turn
    type: nightshift.decisionTreePrepare
    with:
      response: '{{ inputs.response }}'
      agent_id: '{{ inputs.agent_id }}'
      # ${{ }} keeps the array. Liquid `{{ }}` stringifies it as "[object Object]…"
      # and JSON.parse in preprocess falls back to [], so every round distills from scratch.
      tool_calls: '${{ inputs.tool_calls }}'

  - name: resolve_model
    type: nightshift.resolveModel
    if: '${{ steps.prepare_turn.output.skipped == false }}'
    with:
      step: investigation
      connector_id: '{{ inputs.connector_id }}'
      round_connector_id: '{{ inputs.round_connector_id }}'

  # Nothing else installs this agent: the investigation workflow only ensures the investigator,
  # and this workflow is the sole caller of the reinforcement agent.
  - name: ensure_reinforcement_agent
    type: nightshift.ensureInvestigationAgent
    if: '${{ steps.prepare_turn.output.skipped == false }}'
    with:
      agent_id: significant-events.decision-tree-reinforcement

  # The investigator's round is replayed as conversation history, so the agent sees each tool
  # call and its result as real tool messages rather than a transcript pasted into one message.
  # The run gets its own conversation id, so its beforeAgent hook hydrates the trees into that
  # conversation's sandbox rather than the investigator's.
  - name: reinforce_decision_trees
    type: nightshift.decisionTreeReinforce
    if: '${{ steps.prepare_turn.output.skipped == false }}'
    with:
      prompt: '{{ inputs.prompt }}'
      response: '{{ inputs.response }}'
      round_id: '{{ inputs.round_id }}'
      message: '{{ steps.prepare_turn.output.message }}'
      turn_kind: '{{ steps.prepare_turn.output.turn_kind }}'
      connector_id: '{{ steps.resolve_model.output.connector_id }}'
      tool_calls: '${{ inputs.tool_calls }}'
      tool_results: '${{ inputs.tool_results }}'
