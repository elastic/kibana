version: '1'
name: Decision Tree Hydrate
description: >
  Pre-execution workflow that materializes the stored decision trees into the
  reinforcement agent's sandbox before each round. Trees are written under
  /workspace/decision-trees so the agent can read and edit them with its file tools.
enabled: true
tags:
  - observability
  - nightshift
  - investigation
  - decision-tree

triggers:
  - type: manual
    inputs:
      properties:
        prompt:
          type: string
          description: The message for this round, forwarded by the agent's beforeAgent hook.
        conversation_id:
          type: string
          description: Conversation id that namespaces the sandbox. Absent for standalone runs.
        agent_id:
          type: string
          description: Agent id forwarded by the beforeAgent hook. Unused by this workflow.
        round_execution_index:
          type: integer
          minimum: 0
          default: 0
          description: Zero for the first execution, positive on HITL resume.
      additionalProperties: false

steps:
  # The reinforcement agent runs in its own conversation, so it allocates its own sandbox
  # rather than reusing the investigator's. Obtain once, then hand the sandbox_id to the
  # writer, which no longer resolves a session from a bare conversation id.
  - name: obtain_sandbox
    type: nightshift.obtainSandbox
    # `${{ }}` must render a boolean. A bare conversation id becomes a KQL string
    # and evaluateCondition treats it as a field query, which skips the step.
    if: '${{ inputs.round_execution_index == 0 and inputs.conversation_id != null }}'
    timeout: 45s
    with:
      conversation_id: '{{ inputs.conversation_id }}'
  - name: hydrate_decision_trees
    type: nightshift.decisionTreeHydrate
    if: '${{ steps.obtain_sandbox.output.sandbox_id != null }}'
    with:
      sandbox_id: '{{ steps.obtain_sandbox.output.sandbox_id }}'
      prompt: '{{ inputs.prompt }}'
    on-failure:
      continue: true
  # The writer catches its own failures and reports them in `notification`, but this workflow's
  # output is the agent hook result, and `run_before_agent_workflows.ts` reads only
  # `model_context` from it. Compose here so the reinforcement agent actually sees the notice
  # that its tree workspace may be incomplete.
  - name: compose_notifications
    type: nightshift.composeHydrateNotifications
    if: '${{ steps.obtain_sandbox.output.sandbox_id != null }}'
    with:
      writers:
        - directory: /workspace/decision-trees
          notification: '{{ steps.hydrate_decision_trees.output.notification }}'
          # False in exactly the case the writer produced no output at all (its `on-failure`
          # continuation), where compose has to synthesize the notice itself.
          completed: '${{ steps.hydrate_decision_trees.output != null }}'
      # This workflow runs no Semantic Memory writer, and the reinforcement agent has no
      # after-execution workflow to read a recall list, so there is nothing to recall.
      recalled_ids: []
