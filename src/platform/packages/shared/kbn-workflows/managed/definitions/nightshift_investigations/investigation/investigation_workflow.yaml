version: '1'
name: Nightshift Investigation
description: >
  General-purpose root cause investigation. One agent investigates available signals,
  including logs, traces, metrics, and topology, then produces a structured conclusion.
enabled: true
settings:
  timeout: '60m'
  concurrency:
    key: 'nightshift-investigation-{{ inputs.concurrency_key | default: execution.id }}'
    strategy: cancel-in-progress
    max: 1
tags:
  - observability
  - investigation
  - nightshift

triggers:
  - type: manual
    inputs:
      properties:
        message:
          type: string
          description: Description of the issue or event to investigate.
        title:
          type: string
          maxLength: 512
          description: >
            Short human-readable headline for the investigation (for example, an event title or
            alert rule name). Never an ID or UUID.
        stream_names:
          type: array
          items:
            type: string
          description: Optional logical stream names to scope observability queries.
        context:
          type: object
          additionalProperties: true
          description: Optional structured context from the start API.
        concurrency_key:
          type: string
          description: Optional key for concurrency deduplication. Defaults to the workflow execution ID.
        connector_id:
          type: string
          maxLength: 500
          description: Optional chat model connector or inference endpoint id for this run.
        investigation_id:
          type: string
          description: >
            Existing investigation to continue, in its own conversation. Defaults to a new
            investigation keyed by the workflow execution ID.
      required:
        - message
        - title
      additionalProperties: false

steps:
  # Resolve before any persisted state or lifecycle event, so a bad or blocked model cannot leave
  # a stale started investigation.
  - name: resolve_model
    type: nightshift.resolveModel
    with:
      step: investigation
      connector_id: '{{ inputs.connector_id }}'

  # Investigation agents are per-space documents. Ensuring the agent here covers direct and manual
  # workflow executions as well as client starts; it is idempotent and preserves existing edits.
  # It runs before persistence and lifecycle emission so an unavailable agent leaves no stale run.
  - name: ensure_investigation_agent
    type: nightshift.ensureInvestigationAgent
    with:
      agent_id: nightshift.investigation

  # Creates the record if needed before lifecycle emission, so a running investigation is always
  # visible. The server derives attributes from the execution document; retries cover startup races.
  # A run continuing an existing investigation reopens it instead and gets back its conversation.
  - name: persist_investigation_started
    type: kibana.request
    with:
      method: POST
      path: '/s/{{ workflow.spaceId }}/internal/nightshift/investigations/{{ inputs.investigation_id | default: execution.id }}/_ensure'
      headers:
        x-elastic-internal-origin: 'kibana'
      body:
        execution_id: '{{ execution.id }}'
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
        strategy: exponential

  - name: emit_investigation_started
    type: kibana.request
    with:
      method: POST
      path: '/s/{{ workflow.spaceId }}/internal/nightshift/investigations/{{ inputs.investigation_id | default: execution.id }}/lifecycle_events'
      headers:
        x-elastic-internal-origin: 'kibana'
      body:
        status: 'running'
    on-failure:
      continue: true

  - name: investigate
    type: ai.agent
    agent-id: nightshift.investigation
    connector-id: '{{ steps.resolve_model.output.connector_id }}'
    plugin-id: 'significant_events_investigation'
    aggregate-by: 'significant_events'
    product-solution: 'observability'
    product-feature: 'nightshift'
    create-conversation: true
    public-conversation: true
    timeout: 1800s
    with:
      # Correlates the workflow and generated agent executions for live progress lookup.
      metadata:
        workflow_execution_id: '{{ execution.id }}'
      conversation_id: '${{ steps.persist_investigation_started.output.conversation_id }}'
      message: |
        {{ inputs.message }}

        {% if inputs.stream_names and inputs.stream_names.size > 0 %}
        Related streams:
        {% for stream in inputs.stream_names %}- {{ stream }}
        {% endfor %}
        {% endif %}

        {% if inputs.context and inputs.context.size > 0 and inputs.context.source != 'alert' %}
        Additional context: {{ inputs.context | json }}
        {% endif %}
      schema:
        type: object
        properties:
          title:
            type: string
            maxLength: 512
            description: >
              Short headline (under ~80 characters) naming the affected entity and the problem.
              Start from the trigger's title and sharpen it as the cause becomes clear.
          summary:
            type: string
            maxLength: 10000
            description: >
              What happened: a short, factual TL;DR of the observed issue and your findings — the
              symptoms, what you observed, and what you established, in at most two sentences. The
              root-cause explanation belongs in conclusion.
          hypotheses:
            type: array
            maxItems: 50
            items:
              type: object
              properties:
                candidate:
                  type: string
                  maxLength: 10000
                confidence:
                  type: number
                  minimum: 0
                  maximum: 1
                status:
                  type: string
                  enum: [investigating, dismissed, confirmed]
                reason:
                  type: string
                  maxLength: 10000
                evidence:
                  type: array
                  description: >
                    What this hypothesis' verdict rests on — at most 3 entries. Every hypothesis
                    that ends "confirmed" or "dismissed" must carry at least one. Describe what you
                    observed in Markdown and add a chart when the observation is a trend or a
                    comparison; only chart data you actually retrieved.
                  maxItems: 3
                  items:
                    type: object
                    properties:
                      description:
                        type: string
                        maxLength: 10000
                        description: >
                          Markdown: what was observed and why it matters. With a chart, only what the chart does not
                          show; leave it out rather than restate the chart. No images, headings, or HTML.
                      chart:
                        type: object
                        description: >
                          Optional static chart of the observation. Every value must be copied from query or tool
                          output you actually have; never estimate, interpolate, or invent data points.
                        properties:
                          type:
                            type: string
                            enum: [line, bar]
                            description: Line charts for values over time, bar charts for comparisons or counts.
                          title:
                            type: string
                            maxLength: 255
                          x_axis:
                            type: object
                            properties:
                              type:
                                type: string
                                enum: [time, category]
                                description: '"time" when x values are ISO 8601 timestamps, "category" for labels.'
                              label:
                                type: string
                                maxLength: 128
                            required:
                              - type
                          y_axis:
                            type: object
                            properties:
                              label:
                                type: string
                                maxLength: 128
                              unit:
                                type: string
                                enum: [number, percent, bytes, ms, s]
                                description: How y values are formatted. Percent values are on a 0-100 scale.
                          stacked:
                            type: boolean
                            description: Stack the series on top of each other. Only for bar charts.
                          series:
                            type: array
                            minItems: 1
                            maxItems: 5
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                  maxLength: 128
                                points:
                                  type: array
                                  maxItems: 100
                                  description: Data points in x order. Downsample to at most 100 points per series.
                                  items:
                                    type: object
                                    properties:
                                      x:
                                        type: string
                                        maxLength: 128
                                        description: ISO 8601 timestamp for a time axis, or the category label.
                                      y:
                                        type: number
                                    required:
                                      - x
                                      - y
                              required:
                                - name
                                - points
                          annotations:
                            type: array
                            maxItems: 5
                            description: Marks key moments such as a deploy or the incident onset.
                            items:
                              type: object
                              properties:
                                x:
                                  type: string
                                  maxLength: 128
                                x_end:
                                  type: string
                                  maxLength: 128
                                  description: When set, highlights the range from x to x_end instead of a single point.
                                label:
                                  type: string
                                  maxLength: 255
                              required:
                                - x
                                - label
                        required:
                          - type
                          - title
                          - x_axis
                          - y_axis
                          - series
              required:
                - candidate
                - confidence
                - status
          conclusion:
            type: string
            maxLength: 10000
            description: >
              The mechanism/root-cause narrative, as plain prose — no Markdown headings or bullet
              lists. Actionable steps belong in recommendations, not here.
          severity:
            type: string
            enum: ['80-critical', '60-high', '40-medium', '20-low']
            description: >
              How severe the investigated situation is, rated from what this investigation confirmed:
              whether the affected operation fails, degrades, or still completes, and how broad the
              impact is. Set it for every investigation from your own findings rather than copying a
              severity supplied by the trigger.
          recommendations:
            type: array
            description: >
              Concrete, actionable steps to resolve or mitigate the issue — prefer specific commands,
              config changes, or code over general advice like "investigate further" or "monitor the
              situation". Score how strongly the findings support that each action will help, sort
              by confidence descending, and return only the 3 strongest items.
            maxItems: 3
            items:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 512
                  description: >
                    The action itself, stated concretely as concise plain text. Do not use Markdown
                    or HTML, including links, emphasis, backticks, headings, lists, or code fences.
                    Put explanations and links in description, and commands or snippets in code.
                confidence:
                  type: number
                  minimum: 0
                  maximum: 1
                  description: How strongly the findings support that this action will resolve or mitigate the confirmed problem.
                description:
                  type: string
                  maxLength: 10000
                  description: Why this step helps, or detail needed to carry it out, when the title alone isn't enough.
                code:
                  type: string
                  maxLength: 10000
                  description: >
                    A command, config snippet, or code change backing this step, when one applies.
                    Raw source, not a fenced markdown block.
              required:
                - title
                - confidence
          impact:
            type: object
            description: >
              The impact: a summary, backed either by one top-level evidence (usually) or, when two
              or more entities were affected in different ways, by entities. Never both. A confirmed
              non-issue gets a one-sentence summary; omit only when impact could not be assessed.
            properties:
              summary:
                type: string
                maxLength: 10000
                description: >
                  The business consequence in one or two sentences: what was affected, how badly, for
                  how long, and how broadly (users, requests, regions). Don't restate the summary.
              evidence:
                description: >
                  The usual backing, when the impact sits in one service or no specific component: a
                  chart of the user-facing failure signal, usually without a description since the
                  summary explains it. Omit when entities are listed.
                type: object
                properties:
                  description:
                    type: string
                    maxLength: 10000
                    description: >
                      Markdown: what was observed and why it matters. With a chart, only what the chart does not
                      show; leave it out rather than restate the chart. No images, headings, or HTML.
                  chart:
                    type: object
                    description: >
                      Optional static chart of the observation. Every value must be copied from query or tool
                      output you actually have; never estimate, interpolate, or invent data points.
                    properties:
                      type:
                        type: string
                        enum: [line, bar]
                        description: Line charts for values over time, bar charts for comparisons or counts.
                      title:
                        type: string
                        maxLength: 255
                      x_axis:
                        type: object
                        properties:
                          type:
                            type: string
                            enum: [time, category]
                            description: '"time" when x values are ISO 8601 timestamps, "category" for labels.'
                          label:
                            type: string
                            maxLength: 128
                        required:
                          - type
                      y_axis:
                        type: object
                        properties:
                          label:
                            type: string
                            maxLength: 128
                          unit:
                            type: string
                            enum: [number, percent, bytes, ms, s]
                            description: How y values are formatted. Percent values are on a 0-100 scale.
                      stacked:
                        type: boolean
                        description: Stack the series on top of each other. Only for bar charts.
                      series:
                        type: array
                        minItems: 1
                        maxItems: 5
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              maxLength: 128
                            points:
                              type: array
                              maxItems: 100
                              description: Data points in x order. Downsample to at most 100 points per series.
                              items:
                                type: object
                                properties:
                                  x:
                                    type: string
                                    maxLength: 128
                                    description: ISO 8601 timestamp for a time axis, or the category label.
                                  y:
                                    type: number
                                required:
                                  - x
                                  - y
                          required:
                            - name
                            - points
                      annotations:
                        type: array
                        maxItems: 5
                        description: Marks key moments such as a deploy or the incident onset.
                        items:
                          type: object
                          properties:
                            x:
                              type: string
                              maxLength: 128
                            x_end:
                              type: string
                              maxLength: 128
                              description: When set, highlights the range from x to x_end instead of a single point.
                            label:
                              type: string
                              maxLength: 255
                          required:
                            - x
                            - label
                    required:
                      - type
                      - title
                      - x_axis
                      - y_axis
                      - series
              entities:
                type: array
                description: >
                  Only when two or more services or components were affected in ways worth telling
                  apart, each with its own evidence. Prefer service-level entries. Omit when using
                  top-level evidence.
                maxItems: 10
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 512
                    type:
                      type: string
                      maxLength: 255
                      description: >
                        Entity category. Default to "service". Use "host", "database", and so on
                        only when no service-level entity applies.
                    feature_id:
                      type: string
                      maxLength: 255
                      description: Knowledge Indicator feature_id when this entity came from one.
                    stream_name:
                      type: string
                      maxLength: 255
                    evidence:
                      description: >
                        How this entity was affected: a short description and, when you have the
                        data, a chart of its failure signal.
                      type: object
                      properties:
                        description:
                          type: string
                          maxLength: 10000
                          description: >
                            Markdown: what was observed and why it matters. With a chart, only what the chart does not
                            show; leave it out rather than restate the chart. No images, headings, or HTML.
                        chart:
                          type: object
                          description: >
                            Optional static chart of the observation. Every value must be copied from query or tool
                            output you actually have; never estimate, interpolate, or invent data points.
                          properties:
                            type:
                              type: string
                              enum: [line, bar]
                              description: Line charts for values over time, bar charts for comparisons or counts.
                            title:
                              type: string
                              maxLength: 255
                            x_axis:
                              type: object
                              properties:
                                type:
                                  type: string
                                  enum: [time, category]
                                  description: '"time" when x values are ISO 8601 timestamps, "category" for labels.'
                                label:
                                  type: string
                                  maxLength: 128
                              required:
                                - type
                            y_axis:
                              type: object
                              properties:
                                label:
                                  type: string
                                  maxLength: 128
                                unit:
                                  type: string
                                  enum: [number, percent, bytes, ms, s]
                                  description: How y values are formatted. Percent values are on a 0-100 scale.
                            stacked:
                              type: boolean
                              description: Stack the series on top of each other. Only for bar charts.
                            series:
                              type: array
                              minItems: 1
                              maxItems: 5
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                    maxLength: 128
                                  points:
                                    type: array
                                    maxItems: 100
                                    description: Data points in x order. Downsample to at most 100 points per series.
                                    items:
                                      type: object
                                      properties:
                                        x:
                                          type: string
                                          maxLength: 128
                                          description: ISO 8601 timestamp for a time axis, or the category label.
                                        y:
                                          type: number
                                      required:
                                        - x
                                        - y
                                required:
                                  - name
                                  - points
                            annotations:
                              type: array
                              maxItems: 5
                              description: Marks key moments such as a deploy or the incident onset.
                              items:
                                type: object
                                properties:
                                  x:
                                    type: string
                                    maxLength: 128
                                  x_end:
                                    type: string
                                    maxLength: 128
                                    description: When set, highlights the range from x to x_end instead of a single point.
                                  label:
                                    type: string
                                    maxLength: 255
                                required:
                                  - x
                                  - label
                          required:
                            - type
                            - title
                            - x_axis
                            - y_axis
                            - series
                  required:
                    - name
        required:
          - summary
          - hypotheses
    on-failure:
      continue: true

  # Writes the completed structured output. It is idempotent because progress reporting may have
  # already marked the record running; retrying avoids silently losing a completed result.
  - name: persist_investigation_completed
    type: kibana.request
    if: '${{ steps.investigate.error == null }}'
    with:
      method: PATCH
      path: '/s/{{ workflow.spaceId }}/internal/nightshift/investigations/{{ inputs.investigation_id | default: execution.id }}'
      headers:
        x-elastic-internal-origin: 'kibana'
      body:
        status: 'completed'
        title: '${{ steps.investigate.output.structured_output.title }}'
        summary: '${{ steps.investigate.output.structured_output.summary }}'
        conclusion: '${{ steps.investigate.output.structured_output.conclusion }}'
        severity: '${{ steps.investigate.output.structured_output.severity }}'
        hypotheses: ${{ steps.investigate.output.structured_output.hypotheses }}
        recommendations: ${{ steps.investigate.output.structured_output.recommendations }}
        impact: ${{ steps.investigate.output.structured_output.impact }}
        conversation_id: '${{ steps.investigate.output.conversation_id }}'
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
        strategy: exponential

  # The canvas: one attachment per investigation, keyed by its ID, that each successful run
  # replaces. Update fails when no earlier run created it, and add creates it then. A failed run
  # leaves the previous canvas as it was.
  - name: render_investigation_canvas
    type: data.set
    if: '${{ steps.investigate.error == null }}'
    with:
      investigation_canvas: |
        ## {{ steps.investigate.output.structured_output.title }}

        {{ steps.investigate.output.structured_output.summary }}
        {% if steps.investigate.output.structured_output.conclusion %}
        ### Conclusion

        {{ steps.investigate.output.structured_output.conclusion }}
        {% endif %}
        {% if steps.investigate.output.structured_output.recommendations and steps.investigate.output.structured_output.recommendations.size > 0 %}
        ### Recommendations

        {% for recommendation in steps.investigate.output.structured_output.recommendations %}- {{ recommendation.title }}
        {% endfor %}
        {% endif %}

  - name: update_investigation_canvas
    type: ai.attachment.update
    if: '${{ steps.investigate.error == null }}'
    with:
      conversation_id: '${{ steps.investigate.output.conversation_id }}'
      attachment_id: '{{ inputs.investigation_id | default: execution.id }}'
      data:
        content: '{{ variables.investigation_canvas }}'
    on-failure:
      continue: true

  - name: add_investigation_canvas
    type: ai.attachment.add
    if: '${{ steps.investigate.error == null and steps.update_investigation_canvas.error != null }}'
    with:
      conversation_id: '${{ steps.investigate.output.conversation_id }}'
      id: '{{ inputs.investigation_id | default: execution.id }}'
      type: text
      description: 'Investigation findings'
      render_inline: true
      data:
        content: '{{ variables.investigation_canvas }}'
    on-failure:
      continue: true

  # Writes failure status when the agent step errors. Retry before continuing so the failure event
  # is still emitted even when the record cannot be updated.
  - name: persist_investigation_failed
    type: kibana.request
    if: '${{ steps.investigate.error != null }}'
    with:
      method: PATCH
      path: '/s/{{ workflow.spaceId }}/internal/nightshift/investigations/{{ inputs.investigation_id | default: execution.id }}'
      headers:
        x-elastic-internal-origin: 'kibana'
      body:
        status: 'failed'
        error: "${{ steps.investigate.error.message | default: 'Investigation failed' }}"
        conversation_id: '${{ steps.investigate.output.conversation_id }}'
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
        strategy: exponential
      # Without this, exhausting the retries aborts the run before emit_investigation_failed, so
      # nothing ever signals the failure.
      continue: true

  - name: emit_investigation_completed
    type: kibana.request
    if: '${{ steps.investigate.error == null }}'
    with:
      method: POST
      path: '/s/{{ workflow.spaceId }}/internal/nightshift/investigations/{{ inputs.investigation_id | default: execution.id }}/lifecycle_events'
      headers:
        x-elastic-internal-origin: 'kibana'
      body:
        status: 'completed'
    on-failure:
      continue: true

  - name: emit_investigation_failed
    type: kibana.request
    if: '${{ steps.investigate.error != null }}'
    with:
      method: POST
      path: '/s/{{ workflow.spaceId }}/internal/nightshift/investigations/{{ inputs.investigation_id | default: execution.id }}/lifecycle_events'
      headers:
        x-elastic-internal-origin: 'kibana'
      body:
        status: 'failed'
    on-failure:
      continue: true

  - name: fail_investigation
    type: workflow.fail
    if: '${{ steps.investigate.error != null }}'
