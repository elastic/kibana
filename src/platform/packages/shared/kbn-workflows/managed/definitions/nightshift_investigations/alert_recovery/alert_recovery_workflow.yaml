version: '1'
name: Nightshift Alert Recovery Investigation
description: >
  Follows up on an open Nightshift investigation when an alert recorded on it transitions to
  recovered. Closed or missing investigations are ignored.
enabled: true
settings:
  timeout: '65m'
  concurrency:
    key: 'nightshift-alert-recovery-{{ event.alert.uuid }}'
    strategy: queue
    max: 1
tags:
  - observability
  - investigation
  - nightshift

triggers:
  - type: alerting.v1.alertStatusChanged
    on:
      condition: 'event.alert.status: "recovered"'

steps:
  - name: find_investigation
    type: kibana.request
    with:
      method: POST
      path: '/s/{{ workflow.spaceId }}/internal/nightshift/investigations/_alert_recovered'
      headers:
        x-elastic-internal-origin: 'kibana'
      body:
        alert_uuid: '{{ event.alert.uuid }}'
        alert_id: '${{ event.alert.id }}'
        alert_start: '${{ event.alert.start }}'
        rule_id: '{{ event.rule.id }}'
        rule_name: '${{ event.rule.name }}'
        rule_type_id: '{{ event.rule.ruleTypeId }}'
        rule_tags: '${{ event.rule.tags }}'
        execution_id: '{{ execution.id }}'

  - name: in_open_investigation
    type: if
    condition: '${{ steps.find_investigation.output.investigation_id != null and steps.find_investigation.output.duplicate != true }}'
    steps:
      - name: investigate
        type: workflow.execute
        with:
          workflow-id: system-nightshift-investigation
          inputs:
            investigation_id: '{{ steps.find_investigation.output.investigation_id }}'
            message: '${{ steps.find_investigation.output.message }}'
        on-failure:
          continue: true

      - name: release_event
        type: kibana.request
        if: '${{ steps.investigate.error != null }}'
        with:
          method: POST
          path: '/s/{{ workflow.spaceId }}/internal/nightshift/investigations/_alert_recovered'
          headers:
            x-elastic-internal-origin: 'kibana'
          body:
            alert_uuid: '{{ event.alert.uuid }}'
            alert_id: '${{ event.alert.id }}'
            alert_start: '${{ event.alert.start }}'
            rule_id: '{{ event.rule.id }}'
            rule_name: '${{ event.rule.name }}'
            rule_type_id: '{{ event.rule.ruleTypeId }}'
            rule_tags: '${{ event.rule.tags }}'
            execution_id: '{{ execution.id }}'
            release_event: true
        on-failure:
          retry:
            max-attempts: 3
            delay: 5s
            strategy: exponential
          continue: true
