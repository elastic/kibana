version: "1"
# Every 4h: IOC extract, taxonomy, severity, and Diamond for pending reports.
# Driver `size: 50` caps wall clock and inference load. Each item runs several
# LLM steps sequentially; partial drain per pass is intentional.
# Installed once globally: enrichment is content-only and space-blind, so it
# selects all pending reports regardless of `space_id` (analyst-paste and
# future custom-source reports included). The `kibana.request` steps below
# call the enrich routes with no `/s/{id}/` prefix, so every request resolves
# to the `default` space, including the per-space LLM connector each route
# reads via Stack Management > Model Settings. That means every report in the
# deployment is enriched using only the `default` space's Model Settings
# regardless of which space it's tagged to. Accepted MVP simplification
# (sources are global-only for now too), not an oversight: once reports need
# distinct model config per owning space, these calls have to resolve a space
# per report inside `extract_each_report`, from that report's own `space_id`
# (already stamped by the ingest adapters).
name: Enrich threat report
description: Extract IOCs, taxonomy, severity, and Diamond from pending reports
tags:
  - threat-intel
enabled: false
settings:
  concurrency:
    key: "threat-intel-enrich"
    strategy: drop
    max: 1
triggers:
  - type: scheduled
    with:
      every: "4h"
steps:
  - name: load_pending_reports
    type: elasticsearch.search
    with:
      # Bare index name. `{index}/_search` is skipped if `index` is omitted, and the
      # engine falls through to cluster-wide `_search`.
      index: .kibana-threat-reports
      size: 50
      # Fingerprints only. Fetch bodies per item after the dedup skip (10 MB step cap).
      _source:
        - content_fingerprint
      query:
        bool:
          must:
            - term:
                lineage.extraction_method: pending
          # Space-blind: enrichment is content-only. Pinning to `*` would skip
          # analyst-paste reports (tagged their real space) and custom-source rows.
      # Field-name strings sort ascending. Object form `{ "@timestamp": "asc" }` is rejected.
      sort:
        - "@timestamp"

  - name: extract_each_report
    type: foreach
    foreach: "{{ steps.load_pending_reports.output.hits.hits }}"
    steps:
      # Per-item fingerprint lookup. KQL `if` has no array-containment operator.
      - name: check_already_extracted
        type: elasticsearch.search
        with:
          index: .kibana-threat-reports
          size: 0
          track_total_hits: true
          query:
            bool:
              must:
                - term:
                    content_fingerprint: "{{ foreach.item._source.content_fingerprint }}"
              must_not:
                # A different non-pending doc with this fingerprint means already extracted.
                - term:
                    lineage.extraction_method: pending
                - ids:
                    values:
                      - "{{ foreach.item._id }}"
      - name: skip_already_extracted
        type: loop.continue
        if: "steps.check_already_extracted.output.hits.total.value > 0"

      - name: load_full_doc
        type: elasticsearch.search
        with:
          index: "{{ foreach.item._index }}"
          size: 1
          query:
            ids:
              values:
                - "{{ foreach.item._id }}"

      # Materialize every linked RSS entry through unauthenticated Jina Reader.
      # The custom step is fail-safe: rejected URLs, HTTP failures, access
      # challenges, and suspiciously short renders all return the original RSS body.
      - name: materialize_article
        type: threat_intel.materialize_article
        with:
          source_type: "{{ steps.load_full_doc.output.hits.hits[0]._source.source.type }}"
          article_url: "{{ steps.load_full_doc.output.hits.hits[0]._source.content.article_url | default: '' }}"
          title: "{{ steps.load_full_doc.output.hits.hits[0]._source.content.title }}"
          rss_body_text: "{{ steps.load_full_doc.output.hits.hits[0]._source.content.rss_body_text | default: steps.load_full_doc.output.hits.hits[0]._source.content.body_text }}"
          existing_rendered_body_text: "{{ steps.load_full_doc.output.hits.hits[0]._source.content.rendered_body_text | default: '' }}"
          existing_status: "{{ steps.load_full_doc.output.hits.hits[0]._source.content.materialization.status | default: '' }}"

      - name: persist_materialization
        type: elasticsearch.update
        if: "steps.load_full_doc.output.hits.hits[0]._source.source.type: rss"
        with:
          index: "{{ foreach.item._index }}"
          id: "{{ foreach.item._id }}"
          doc:
            content:
              body_text: "{{ steps.materialize_article.output.body_text }}"
              rendered_body_text: "{{ steps.materialize_article.output.rendered_body_text }}"
              materialization: "${{ steps.materialize_article.output.materialization }}"
        on-failure:
          continue: true

      # Cheap hard gate: a negative Haiku verdict stops this report before
      # deterministic extraction, Sonnet core extraction, or Opus Diamond.
      - name: assess_relevance
        type: kibana.request
        with:
          method: POST
          path: "/internal/threat_intel/assess_relevance"
          headers:
            elastic-api-version: "1"
            x-elastic-internal-origin: "kibana"
          body:
            text: "{{ steps.materialize_article.output.body_text }}"
            title: "{{ steps.load_full_doc.output.hits.hits[0]._source.content.title }}"
            url: "{{ steps.load_full_doc.output.hits.hits[0]._source.content.article_url | default: '' }}"
        on-failure:
          continue: true

      # A gate outage is retryable, never a reason to spend through to Sonnet.
      - name: retry_gate_failure
        type: loop.continue
        if: "${{ steps.assess_relevance.error != null }}"

      - name: capture_gate_signals
        type: data.set
        with:
          gate_is_intelligence: "${{ steps.assess_relevance.output.is_intelligence }}"
          gate_quality_class: "{{ steps.assess_relevance.output.quality_class }}"
          gate_evidence_tier: "{{ steps.assess_relevance.output.evidence_tier }}"
          gate_needs_render: "${{ steps.assess_relevance.output.needs_render }}"
          gate_has_original_commentary: "${{ steps.assess_relevance.output.has_original_commentary }}"
          gate_reason: "{{ steps.assess_relevance.output.reason }}"

      - name: persist_gate_rejection
        type: elasticsearch.update
        if: "variables.gate_is_intelligence: false"
        with:
          index: "{{ foreach.item._index }}"
          id: "{{ foreach.item._id }}"
          doc:
            extracted:
              gate:
                is_intelligence: false
                quality_class: "{{ variables.gate_quality_class }}"
                evidence_tier: "{{ variables.gate_evidence_tier }}"
                needs_render: "${{ variables.gate_needs_render }}"
                has_original_commentary: "${{ variables.gate_has_original_commentary }}"
                reason: "{{ variables.gate_reason }}"
                assessed_at: "${{ now }}"
                context_mode: "{{ steps.assess_relevance.output.context.mode }}"
                context_coverage: "${{ steps.assess_relevance.output.context.coverage }}"
            lineage:
              extracted_at: "${{ now }}"
              extraction_method: workflow_v4_rejected

      - name: stop_rejected_report
        type: loop.continue
        if: "variables.gate_is_intelligence: false"

      - name: extract_iocs
        type: kibana.request
        with:
          method: POST
          path: "/internal/threat_intel/extract_iocs"
          headers:
            elastic-api-version: "1"
            x-elastic-internal-origin: "kibana"
          body:
            text: "{{ steps.materialize_article.output.body_text }}"
            defang: true
        on-failure:
          continue: true

      # One Sonnet read consolidates taxonomy, severity, behaviors, artifacts,
      # and semantic verdicts over byte-exact deterministic IOC candidate IDs.
      - name: enrich_report_core
        type: kibana.request
        with:
          method: POST
          path: "/internal/threat_intel/enrich_report_core"
          headers:
            elastic-api-version: "1"
            x-elastic-internal-origin: "kibana"
          body:
            text: "{{ steps.materialize_article.output.body_text }}"
            title: "{{ steps.load_full_doc.output.hits.hits[0]._source.content.title }}"
            article_url: "{{ steps.load_full_doc.output.hits.hits[0]._source.content.article_url }}"
            report_id: "{{ foreach.item._id }}"
            iocs: "${{ steps.extract_iocs.output.iocs }}"
            truncated: "${{ steps.extract_iocs.output.truncated | default: false }}"
        on-failure:
          continue: true

      # `${{ }}` keeps numbers typed.
      - name: capture_ranking_signals
        type: data.set
        with:
          relevance: "${{ steps.enrich_report_core.output.relevance | default: 0.5 }}"
          diamond_suitable: "${{ steps.enrich_report_core.output.diamond_suitable | default: false }}"

      # Core persistence is retryable independently of optional Diamond.
      - name: mark_llm_enrich_complete
        type: data.set
        if: "${{ steps.extract_iocs.error == null and steps.enrich_report_core.error == null }}"
        with:
          extraction_method: workflow_v4

      - name: mark_llm_enrich_incomplete
        type: data.set
        if: "${{ steps.extract_iocs.error != null or steps.enrich_report_core.error != null }}"
        with:
          extraction_method: pending

      # Diamond extraction when diamond_suitable. Do not set use_server_info: true.
      - name: extract_diamond
        type: kibana.request
        if: "variables.diamond_suitable: true"
        with:
          method: POST
          path: "/internal/threat_intel/extract_diamond"
          headers:
            elastic-api-version: "1"
            x-elastic-internal-origin: "kibana"
          body:
            text: "{{ steps.materialize_article.output.body_text }}"
            report_id: "{{ foreach.item._id }}"
        on-failure:
          continue: true

      # Separate write so a diamond failure does not block persist_extractions.
      - name: persist_diamond_fields
        type: elasticsearch.update
        if: "variables.diamond_suitable: true"
        with:
          index: "{{ foreach.item._index }}"
          id: "{{ foreach.item._id }}"
          doc:
            extracted:
              diamond:
                adversary: "${{ steps.extract_diamond.output.adversary }}"
                capability: "${{ steps.extract_diamond.output.capability }}"
                infrastructure: "${{ steps.extract_diamond.output.infrastructure }}"
                victim: "${{ steps.extract_diamond.output.victim }}"
                signal_count: "${{ steps.extract_diamond.output.signal_count }}"
                model_id: "{{ steps.extract_diamond.output.model_id }}"
                extracted_at: "{{ steps.extract_diamond.output.extracted_at }}"
                extraction_mode: "{{ steps.extract_diamond.output.extraction_mode }}"
                context_mode: "{{ steps.extract_diamond.output.context_mode }}"
                context_coverage: "${{ steps.extract_diamond.output.context_coverage }}"
                context_chars: "${{ steps.extract_diamond.output.context_chars }}"
                source_chars: "${{ steps.extract_diamond.output.source_chars }}"
        on-failure:
          continue: true

      # Related-report scoring is calibrated. Do not "simplify" these numbers.
      # size 15: 50 returned ~the whole corpus (related_reports_count 49).
      # min_score 4: one shared common domain stays below the floor.
      # boost 5 (exact ioc_set_hash) or boost 2 + score_mode sum (IOC overlap)
      # is what clears it. Technique overlap is omitted on purpose: common
      # ATT&CK IDs have low IDF and never cleared min_score 4 alone.
      - name: find_related_reports
        type: elasticsearch.search
        if: "steps.enrich_report_core.output.ioc_set_hash : *"
        with:
          index: .kibana-threat-reports
          size: 15
          _source: false
          min_score: 4
          query:
            bool:
              minimum_should_match: 1
              # Space-blind: relatedness is content-based, not space-scoped.
              must_not:
                - ids:
                    values:
                      - "{{ foreach.item._id }}"
              should:
                - term:
                    extracted.ioc_set_hash:
                      value: "{{ steps.enrich_report_core.output.ioc_set_hash }}"
                      boost: 5
                # `${{ }}` keeps the mapped IOC values as an array.
                - nested:
                    path: extracted.iocs
                    score_mode: sum
                    boost: 2
                    query:
                      terms:
                        extracted.iocs.value: "${{ steps.enrich_report_core.output.anchor_iocs | map: 'value' }}"
        on-failure:
          continue: true

      - name: persist_extractions
        type: elasticsearch.update
        if: "${{ steps.enrich_report_core.error == null }}"
        with:
          # Concrete `_index`; wildcards are rejected on update.
          index: "{{ foreach.item._index }}"
          id: "{{ foreach.item._id }}"
          # `${{ }}` keeps arrays, numbers, and dates typed. `{{ }}` stringifies them.
          # Omit `default: []`; Liquid has no array literal and would drop the field.
          doc:
            extracted:
              iocs: "${{ steps.enrich_report_core.output.iocs }}"
              ioc_set_hash: "{{ steps.enrich_report_core.output.ioc_set_hash }}"
              categories: "${{ steps.enrich_report_core.output.categories }}"
              behaviors: "${{ steps.enrich_report_core.output.behaviors }}"
              artifacts: "${{ steps.enrich_report_core.output.artifacts }}"
              relevance: "${{ variables.relevance }}"
              diamond:
                suitable: "${{ variables.diamond_suitable }}"
              gate:
                is_intelligence: "${{ variables.gate_is_intelligence }}"
                quality_class: "{{ variables.gate_quality_class }}"
                evidence_tier: "{{ variables.gate_evidence_tier }}"
                needs_render: "${{ variables.gate_needs_render }}"
                has_original_commentary: "${{ variables.gate_has_original_commentary }}"
                reason: "{{ variables.gate_reason }}"
                assessed_at: "${{ now }}"
                context_mode: "{{ steps.assess_relevance.output.context.mode }}"
                context_coverage: "${{ steps.assess_relevance.output.context.coverage }}"
            geography:
              regions: "${{ steps.enrich_report_core.output.regions }}"
            lineage:
              extracted_at: "${{ now }}"
              extraction_method: "{{ variables.extraction_method | default: 'pending' }}"
              related_reports: "${{ steps.find_related_reports.output.hits.hits | map: '_id' }}"
              related_reports_count: "${{ steps.find_related_reports.output.hits.total.value | default: 0 }}"
        on-failure:
          continue: true

      # Severity is part of the same Sonnet core result.
      - name: persist_classified_severity
        type: elasticsearch.update
        if: "steps.enrich_report_core.output.severity.level : *"
        with:
          index: "{{ foreach.item._index }}"
          id: "{{ foreach.item._id }}"
          doc:
            severity:
              level: "{{ steps.enrich_report_core.output.severity.level }}"
              score: "${{ steps.enrich_report_core.output.severity.score }}"
            rank_score: "${{ steps.enrich_report_core.output.severity.score | times: variables.relevance }}"
        on-failure:
          continue: true
