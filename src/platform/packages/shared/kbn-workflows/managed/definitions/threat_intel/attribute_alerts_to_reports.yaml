version: "1"
# Every 1h: for recently enriched threat reports, count how many Detection Engine
# alerts in the last 7d tie back to that report, then write the totals onto the doc.
# IOC promotion drives Indicator Match hits; extracted ATT&CK techniques drive overlap
# with other rules. Scoped to the workflow's Kibana space; up to 100 reports per pass.
# Includes `space_id: "*"` catalog rows. `attribution` is a nested per-space array, so
# spaces cannot clobber each other. Writes use `elasticsearch.update` + script (Bulk
# rejects scripts on indices with `semantic_text`). `retry_on_conflict` covers
# cross-space concurrency on shared global docs (`concurrency.key` is per-space only).
name: Attribute alerts to reports
description: Count environment alerts linked to each threat report and store totals on the report
tags:
  - threat-intel
enabled: false
settings:
  concurrency:
    key: "threat-intel-attribute-{{ workflow.spaceId }}"
    strategy: drop
    max: 1
triggers:
  - type: scheduled
    with:
      every: "1h"
steps:
  - name: set_space_context
    type: data.set
    with:
      spaceId: "{{ workflow.spaceId }}"

  - name: load_reports_with_extractions
    type: elasticsearch.search
    with:
      index: .kibana-threat-reports
      size: 100
      query:
        bool:
          filter:
            - range:
                lineage.extracted_at:
                  gte: "now-30d"
            - terms:
                space_id: ["{{ variables.spaceId }}", "*"]
          should:
            # nested `exists`; `exists` on the parent path matches nothing.
            - nested:
                path: extracted.iocs
                query:
                  exists:
                    field: extracted.iocs.value
            - nested:
                path: extracted.behaviors
                query:
                  exists:
                    field: extracted.behaviors.technique_id
          minimum_should_match: 1
      # Body sort must be a field name string, not `"@timestamp:desc"`.
      sort:
        - "@timestamp"

  # Static script, set once outside the loop. Params carry every per-report value;
  # the source never interpolates. Held in a variable so the update step can
  # reference it without embedding a multi-line string inside Liquid.
  - name: set_attribution_script
    type: data.set
    with:
      attribution_script: |
        if (!(ctx._source.attribution instanceof List)) { ctx._source.attribution = new ArrayList(); }
        boolean found = false;
        for (int i = 0; i < ctx._source.attribution.size(); i++) {
          if (ctx._source.attribution[i].space_id == params.space_id) {
            ctx._source.attribution[i].environment_hits = ['window': params.window, 'computed_at': params.computed_at, 'layer_1_ioc_match': params.layer_1_ioc_match, 'layer_2_behavioral': params.layer_2_behavioral];
            ctx._source.attribution[i].environment_hits_total = params.environment_hits_total;
            found = true;
          }
        }
        if (!found) {
          Map el = new HashMap();
          el.space_id = params.space_id;
          el.environment_hits = ['window': params.window, 'computed_at': params.computed_at, 'layer_1_ioc_match': params.layer_1_ioc_match, 'layer_2_behavioral': params.layer_2_behavioral];
          el.environment_hits_total = params.environment_hits_total;
          ctx._source.attribution.add(el);
        }

  # One search for all layer-1 counts. Per-report `term` queries inside foreach
  # were 100 sequential alert searches per hourly pass.
  - name: count_all_layer1_hits
    type: elasticsearch.search
    if: "steps.load_reports_with_extractions.output.hits.total.value > 0"
    with:
      index: .alerts-security.alerts-{{ variables.spaceId }}
      size: 0
      query:
        bool:
          filter:
            - range:
                "@timestamp":
                  gte: "now-7d"
            - term:
                kibana.alert.rule.type: threat_match
            - term:
                kibana.space_ids: "{{ variables.spaceId }}"
            - nested:
                path: threat.enrichments
                query:
                  regexp:
                    threat.enrichments.indicator.reference: "threat-report:({{ steps.load_reports_with_extractions.output.hits.hits | map: '_id' | join: '|' }})"
      aggs:
        by_report_ref:
          nested:
            path: threat.enrichments
          aggs:
            refs:
              terms:
                field: threat.enrichments.indicator.reference
                size: 100
                include: "threat-report:({{ steps.load_reports_with_extractions.output.hits.hits | map: '_id' | join: '|' }})"
              aggs:
                alert_count:
                  reverse_nested: {}
    on-failure:
      continue: true

  - name: backfill_each_report
    type: foreach
    if: "steps.load_reports_with_extractions.output.hits.total.value > 0"
    foreach: "{{ steps.load_reports_with_extractions.output.hits.hits }}"
    steps:
      - name: capture_report_ref
        type: data.set
        with:
          report_ref: "threat-report:{{ foreach.item._id }}"

      # Layer 2 — behavioral DE rule alerts whose ATT&CK techniques overlap
      # with this report's `extracted.behaviors.technique_id` values.
      - name: layer2_search
        type: elasticsearch.search
        with:
          index: .alerts-security.alerts-{{ variables.spaceId }}
          size: 0
          query:
            bool:
              filter:
                - range:
                    "@timestamp":
                      gte: "now-7d"
                - term:
                    kibana.space_ids: "{{ variables.spaceId }}"
                - terms:
                    kibana.alert.rule.threat.technique.id:
                      index: "{{ foreach.item._index }}"
                      id: "{{ foreach.item._id }}"
                      path: extracted.behaviors.technique_id
              must_not:
                - term:
                    kibana.alert.rule.type: threat_match
        on-failure:
          continue: true

      - name: capture_hit_counts
        type: data.set
        with:
          layer1_count: "${{ steps.count_all_layer1_hits.output.aggregations.by_report_ref.refs.buckets | default: [] | where: 'key', variables.report_ref | map: 'alert_count' | map: 'doc_count' | first | default: 0 }}"
          layer2_count: "${{ steps.layer2_search.output.hits.total.value | default: 0 }}"

      # Scripted per-space upsert into the nested `attribution` array.
      # Update API (not Bulk): Bulk rejects scripts on indices with `semantic_text`.
      # No upsert body: the report was just loaded, so a missing doc must fail
      # loudly rather than materialize a partial row. Never touches `revision`.
      - name: write_attribution
        type: elasticsearch.update
        with:
          index: "{{ foreach.item._index }}"
          id: "{{ foreach.item._id }}"
          retry_on_conflict: 3
          script:
            lang: painless
            source: "${{ variables.attribution_script }}"
            params:
              space_id: "{{ variables.spaceId }}"
              window: "7d"
              computed_at: "${{ now }}"
              layer_1_ioc_match: "${{ variables.layer1_count }}"
              layer_2_behavioral: "${{ variables.layer2_count }}"
              environment_hits_total: "${{ variables.layer1_count | plus: variables.layer2_count }}"
        on-failure:
          continue: true
