version: "1"
# Every 1h: count Indicator Match and technique-overlap alerts per report (last 7d).
name: Attribute alerts to reports
description: Count Detection Engine hits per report (indicator match and technique overlap)
tags:
  - threat-intel
enabled: true
triggers:
  - type: scheduled
    with:
      every: "1h"
steps:
  - name: load_reports_with_extractions
    type: elasticsearch.search
    with:
      index: .kibana-threat-reports
      size: 500
      query:
        bool:
          filter:
            - range:
                lineage.extracted_at:
                  gte: "now-30d"
          should:
            # nested `exists`; `exists` on the parent path matches nothing.
            - nested:
                path: extracted.iocs
                query:
                  exists:
                    field: extracted.iocs.value
            - nested:
                path: extracted.behaviors
                query:
                  exists:
                    field: extracted.behaviors.technique_id
          minimum_should_match: 1
      # Body sort must be a field name string, not `"@timestamp:desc"`.
      sort:
        - "@timestamp"

  - name: backfill_each_report
    type: foreach
    foreach: "{{ steps.load_reports_with_extractions.output.hits.hits }}"
    steps:
      - name: count_layer1_hits
        type: elasticsearch.search
        with:
          index: .alerts-security.alerts-*
          size: 0
          query:
            bool:
              filter:
                - range:
                    "@timestamp":
                      gte: "now-7d"
                - term:
                    kibana.alert.rule.type: threat_match
                - nested:
                    path: threat.enrichments
                    query:
                      term:
                        threat.enrichments.indicator.reference: "threat-report:{{ foreach.item._id }}"
        on-failure:
          continue: true

      - name: layer2_search
        type: elasticsearch.search
        with:
          index: .alerts-security.alerts-*
          size: 0
          query:
            bool:
              filter:
                - range:
                    "@timestamp":
                      gte: "now-7d"
                - terms:
                    kibana.alert.rule.threat.technique.id:
                      index: "{{ foreach.item._index }}"
                      id: "{{ foreach.item._id }}"
                      path: extracted.behaviors.technique_id
              must_not:
                - term:
                    kibana.alert.rule.type: threat_match
        on-failure:
          continue: true

      # `_update` needs the concrete backing index, not a wildcard.
      - name: write_attribution
        type: elasticsearch.update
        with:
          index: "{{ foreach.item._index }}"
          id: "{{ foreach.item._id }}"
          # `${{ }}` keeps numbers and dates typed. `{{ }}` stringifies them.
          doc:
            attribution:
              environment_hits:
                window: "7d"
                computed_at: "${{ now }}"
                layer_1_ioc_match: "${{ steps.count_layer1_hits.output.hits.total.value | default: 0 }}"
                layer_2_behavioral: "${{ steps.layer2_search.output.hits.total.value | default: 0 }}"
              # Liquid has no `+`. Use `plus`.
              environment_hits_total: "${{ steps.count_layer1_hits.output.hits.total.value | default: 0 | plus: steps.layer2_search.output.hits.total.value }}"
        on-failure:
          continue: true
