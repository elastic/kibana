version: "1"
name: Watch Floor
description: >
  Tier-1 Watch Floor (Daybreak). Triages alerts via the alert-analysis skill.
  Full Alert Analysis managed-workflow wrap (workflow.execute) is the next Floor spike.
enabled: true
tags:
  - watch
  - watch-floor
triggers:
  - type: alert
  - type: manual
  - type: scheduled
    with:
      every: "60m"
steps:
  - name: watch_policy
    type: data.set
    with:
      watch:
        mandate: Frontline triage
        autonomyLevel: 3
        handoff: officer
        onDemand: false
        draft: false
        cadence: stream
        mode: always
        ui:
          color: "#16b3a6"
          icon: alert
          order: 10
        scopeSummary: Security indices · APM · logs
        scopes:
          - name: Security indices
            access: full
            label: Read
          - name: APM · logs · SLOs
            access: full
            label: Read
          - name: Finance PII
            access: masked
            label: Masked
        # Display overrides only — capabilities are projected from steps below.
        callables:
          - id: alert-analysis
            name: Alert analysis
            kind: skill
            summary: On alert · classifies FP / TP / inconclusive
            gated: false
            enabled: true
  - name: triage_alerts
    type: ai.agent
    timeout: "10m"
    create-conversation: true
    with:
      # Public access so analysts can read via GET /conversations/{id}.
      access_control:
        access_mode: public
      message: >
        Use the [/alert-analysis](skill://alert-analysis) skill to triage the
        security alert context below. Prefer recall over precision when unsure.
        Return a structured classification.

        Alert / event context:
        {{ event | json }}
      schema:
        type: object
        properties:
          classification:
            type: string
            enum:
              - false_positive
              - true_positive
              - inconclusive
            description: Classification of the alert based on analysis
          confidence_score:
            type: number
            minimum: 0
            maximum: 1
            description: Confidence from 0.0–1.0
          rationale:
            type: string
            description: Brief human-readable explanation
        required:
          - classification
          - confidence_score
          - rationale
  - name: materialize_investigation
    # POC materialization — see FINDINGS "Workarounds vs platform gaps".
    # Missing (#15192): PATCH /conversations/{id}/metadata for typed investigation fields.
    # Workaround: PUT proposal envelope into state.daybreak_proposal + POST evidence attachment.
    # Limitation: envelope is storable but not ES-queryable; queue uses inbox ES projection + client filters.
    type: if
    condition: '${{ steps.triage_alerts.output.conversation_id != null and steps.triage_alerts.output.conversation_id != "" }}'
    steps:
      - name: write_proposal_envelope
        # Workaround only — replace with metadata PATCH when #15192 ships.
        type: kibana.request
        with:
          method: PUT
          path: /api/agent_builder/conversations/{{ steps.triage_alerts.output.conversation_id }}
          headers:
            elastic-api-version: "2023-10-31"
          body:
            title: >-
              Watch Floor · {{ steps.triage_alerts.output.structured_output.classification
              | default: "inconclusive" }}
            status: completed
            state:
              daybreak_proposal:
                title: >-
                  Watch Floor · {{ steps.triage_alerts.output.structured_output.classification
                  | default: "inconclusive" }}
                summary: >-
                  {{ steps.triage_alerts.output.structured_output.rationale
                  | default: "Watch Floor triage completed." }}
                severity: >-
                  {{ steps.triage_alerts.output.structured_output.classification
                  | default: "inconclusive" }}
                status: proposed
                recommended_action: Review triage output and escalate if true positive
                confidence: >-
                  {{ steps.triage_alerts.output.structured_output.confidence_score
                  | default: 0 }}
                source_watch_id: "{{ workflow.id }}"
                watch_execution_id: "{{ execution.id }}"
                evidence_ref:
                  - daybreak-evidence
      - name: attach_triage_evidence
        type: kibana.request
        with:
          method: POST
          path: /api/agent_builder/conversations/{{ steps.triage_alerts.output.conversation_id }}/attachments
          headers:
            elastic-api-version: "2023-10-31"
          body:
            id: daybreak-evidence
            type: text
            description: Watch Floor triage evidence
            data:
              content: "{{ steps.triage_alerts.output | json }}"
  - name: record_reasoning
    type: data.set
    with:
      reasoning:
        summary: >-
          {{ steps.triage_alerts.output.structured_output.rationale
          | default: "Watch Floor triage completed." }}
        sections:
          - title: Classification
            body: >-
              {{ steps.triage_alerts.output.structured_output.classification
              | default: "inconclusive" }}
              (confidence
              {{ steps.triage_alerts.output.structured_output.confidence_score
              | default: "n/a" }})
