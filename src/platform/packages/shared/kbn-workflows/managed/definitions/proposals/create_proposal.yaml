version: '1'
name: Create proposal
description: >
  Creates a proposal, gates it on a human decision unless the caller already
  resolved autonomy, records that decision, and runs the proposed action
  workflow once approved. Solution-agnostic: callers supply the action workflow
  id and its input.

  The gate sits inside a loop because a release is not the same thing as a
  decision. A resumer who lacks the privilege to decide, and an action that
  fails and is re-offered, both need the proposal parked again rather than
  settled.
enabled: true
tags:
  - proposals

settings:
  # A sentinel meaning "never". Every path is already bounded — the gate by the
  # remaining deadline, the action by its own workflow timeout, the loop by
  # `max-iterations` — so a ceiling adds no safety and one failure mode: it runs
  # no handler (`EnterWorkflowTimeoutZoneNodeImpl.monitor()` marks the execution
  # TIMED_OUT and `catchError` returns early), stranding the record `pending`.
  #
  # Omitting it is not an option; that applies `DEFAULT_WORKFLOW_TIMEOUT` (6h),
  # which would cut every parked gate short. Never tighten this to fit a
  # deadline: `inputs.expiresIn` is unbounded, and a ceiling that can fire
  # before the gate settles is worse than no ceiling.
  timeout: '52w'
  on-failure:
    # The engine wraps each non-flow-control step in its own try/fallback pair,
    # runs the fallback, then restores the original error — so the workflow
    # still fails and later steps are skipped. That is what makes this safe for
    # settling the record, and it is also what catches a gate timeout, since a
    # HITL step cannot carry its own `on-failure` (elastic/security-team#19315).
    #
    # One step, not a get-then-update chain: workflow-level fallback steps are
    # renamed to `workflow-level-on-failure_<failed>_<name>`, so Liquid
    # `steps.<yaml-name>` references resolve to nothing. The settle step adopts
    # the live head and discriminates decided→failed / undecided→expired itself.
    # It does not check manage_proposals — a denied resumer's API key may be on
    # the task when this runs.
    fallback:
      - name: settle_on_failure
        type: proposals.settleIncompleteProposal
        # Nothing to settle when creation itself failed.
        if: '${{ variables.current_proposal_id != blank }}'
        with:
          proposalId: '{{ variables.current_proposal_id }}'
          executionError: '{{ error.message }}'

triggers:
  - type: manual
    inputs:
      properties:
        conversationId:
          type: string
          description: Conversation this proposal belongs to.
        comment:
          type: string
          description: >
            Explains what is being proposed, rendered as markdown. Required:
            a proposal a human cannot read is not reviewable.
        actionWorkflowId:
          type: string
          description: >
            Managed action workflow to execute once approved. Omit for a
            proposal the analyst carries out themselves.
        actionInput:
          type: object
          additionalProperties: true
          description: >
            Input for the action workflow, passed through as its single
            `actionInput` object.
        impact:
          type: string
          enum: ['low', 'medium', 'high', 'critical', ''] # empty string is equivalent to undefined, adding it to prevent errors
          description: >
            Impact snapshotted at creation. Takes precedence over the action
            workflow's own declared impact, since the caller knows the
            situation the proposal came out of.
        category:
          type: string
          description: >
            Grouping axis for the decision queue. Overrides the action
            workflow's own declared category, and is the only way a proposal
            with no action gets one — consumers group by it, so without it such
            a proposal has nowhere to appear.
        confidence:
          type: string
          enum: ['low', 'medium', 'high', ''] # empty string is equivalent to undefined, adding it to prevent errors
          description: Confidence in the recommendation.
        expiresIn:
          type: string
          description: >
            How long the analyst has to decide, as a duration like `24h` or
            `1w2d`, units in descending order. Defaults to 72h. The gate parks
            against the deadline this resolves to, so the queue and the gate
            cannot disagree about when the decision expires.
        autoApprove:
          type: boolean
          description: >
            Set by the caller when its autonomy policy already permits this
            action. Defaults to false so the gate is fail-closed.
      required:
        - conversationId
        - comment
      additionalProperties: false

# Documentation for the caller: `workflow.execute` declares its output as
# unknown. The `workflow.output` step below emits the values.
outputs:
  - name: proposalId
    type: string
  - name: status
    type: string
  - name: decision
    type: string

steps:
  - name: create_proposal
    type: proposals.createProposal
    with:
      conversationId: '{{ inputs.conversationId }}'
      comment: '{{ inputs.comment }}'
      actionWorkflowId: '{{ inputs.actionWorkflowId }}'
      actionInput: '${{ inputs.actionInput }}'
      impact: '{{ inputs.impact }}'
      category: '{{ inputs.category }}'
      confidence: '{{ inputs.confidence }}'
      origin: worker
      # The only deadline in this workflow. Every park below derives from the
      # `expiresAt` it resolves to.
      expiresIn: "{{ inputs.expiresIn | default: '72h' }}"

  # Everything the loop carries lives in variables: `data.set` is the only step
  # type exempt from output eviction, so its values survive a HITL park, a task
  # resumption and the loop's exit. A step output survives none of those.
  - name: init_state
    type: data.set
    with:
      completed: false
      final_status: pending
      final_decision: ''
      current_proposal_id: '{{ steps.create_proposal.output.proposalId }}'
      # Captured once, so a failed attempt can never extend the deadline.
      #
      # The far-future default stands in for a proposal with no `expiresAt`,
      # which `createProposal` permits. Expressing it as a date the loop never
      # reaches keeps every deadline check a single comparison.
      expires_epoch: "${{ steps.create_proposal.output.expiresAt | default: '2999-01-01' | date: '%s' | plus: 0 }}"
      action_workflow_id: '{{ inputs.actionWorkflowId }}'
      # The trigger's input until the gate answers; the adopt steps below
      # replace it with the live revision's own value.
      action_input: '${{ inputs.actionInput }}'
      decided_by: ''
      # Any one of these holds the decision for a human: the caller's autonomy
      # did not permit running unattended; there is no action to run, since
      # autonomy governs whether an *action* runs without a human and approval
      # is a non-action proposal's whole lifecycle; or the action declares
      # `approvalPolicy: always-gate` — which covers metadata that could not be
      # read at all, since that is not "confirmed safe" either.
      #
      # All `or`, never mixed with `and`: Liquid has no operator precedence and
      # no parentheses, so a mixed expression would not bind the way it reads.
      needs_gate: '${{ inputs.autoApprove != true or inputs.actionWorkflowId == blank or steps.create_proposal.output.alwaysGate == true }}'

  - name: decision_loop
    type: while
    # do-while: the first iteration always runs, and the condition is
    # re-evaluated after each one.
    condition: '${{ variables.completed != true }}'
    # A runaway guard, not a settlement path — the deadline settles, and every
    # park is bounded by it. Only a `loop.continue` spends an iteration without
    # waiting, and this stops one from spinning forever.
    #
    # `continue` rather than `fail`: `ExitWhileNodeImpl` throws on `fail`, and
    # `handleWorkflowLevelOnFailure` skips flow-control steps, so that error
    # reaches no handler and strands the record. `continue` exits the loop
    # cleanly, and `settle_unfinished` below records the expiry the loop never
    # got to.
    max-iterations:
      limit: 200
      on-limit: continue
    # Deliberately NO `iteration-timeout`: it wraps the body in a step-timeout
    # zone, which would cut the parked approval gate short.
    steps:
      # Conditions throughout use a single `and` or a single comparison on
      # purpose. Liquid has no operator precedence and no parentheses, so a
      # mixed `and`/`or` expression binds in a way that does not match how it
      # reads.
      - name: gate_branch
        type: if
        condition: '${{ variables.needs_gate == true }}'
        steps:
          # Only the gate needs the clock; the autonomy path never waits.
          # Liquid cannot read a variable written by the same `data.set`, so
          # `now` is negated and added rather than stored and subtracted.
          - name: compute_remaining
            type: data.set
            with:
              remaining_seconds: "${{ 'now' | date: '%s' | times: -1 | plus: variables.expires_epoch }}"

          - name: await_decision
            type: waitForApproval
            # Parks for what is left of the deadline, so re-parks share one
            # budget instead of each opening a fresh window. Rendered once at
            # wait-entry and frozen on step state as `dynamicTimeout`, so the
            # idle wake-up and the resume check read the same deadline.
            #
            # `at_least: 1` because a proposal can reach here already past its
            # deadline — a cloned retry after a long action, say. It then parks
            # for a second and times out into `handle_gate_timeout`, which is
            # the single path that settles an expiry. A zero or negative render
            # would be rejected by `assertValidDuration` instead.
            timeout: '{{ variables.remaining_seconds | at_least: 1 }}s'
            on-failure:
              # A timeout is the expected end of an unanswered proposal, not a
              # malfunction, so `handle_gate_timeout` settles it inside the
              # loop. The workflow-level handler would settle the record too,
              # but end the run as `failed` and skip the output step.
              #
              # `WaitForApprovalStepSchema` does not model this key; it reaches
              # the engine only because managed workflows install under
              # lightweight validation. The engine honours it, and the
              # schema-parity test beside this file pins that it is still
              # declared. Schema gap: elastic/security-team#19315.
              continue: true
            with:
              message: "{{ inputs.comment | default: 'A proposal is awaiting your decision.' }}"
              approveLabel: Approve
              rejectLabel: Dismiss

          # `waitForApproval` is not exempt from output eviction, and a step
          # output resolves to its latest execution — so a later iteration that
          # skips this branch would read this pass's values. The failure
          # travels as a variable for the same reason: `handle_gate_timeout`
          # runs past the adopt below, where this output is out of reach.
          - name: resolve_gate
            type: data.set
            with:
              # Blank on a timeout, which is what `gate_timed_out` is for: a
              # gate nobody answered would otherwise read as a dismissal.
              gate_approved: '${{ steps.await_decision.output.response.approved == true }}'
              decided_by: '{{ steps.await_decision.output.respondedBy }}'
              gate_timed_out: '${{ steps.await_decision.error != blank }}'
              gate_error: '{{ steps.await_decision.error.message }}'
              # Someone answered, so there is a resumer to authorize. False on
              # a timeout, where the only principal is the workflow runner.
              gate_answered: '${{ steps.await_decision.error == blank }}'

        else:
          # No human here: the caller's autonomy policy already decided, so the
          # approval is attributed to the execution identity. Sets every
          # variable `resolve_gate` sets, because variables outlive an
          # iteration and a gated pass would otherwise leak its answer forward.
          - name: resolve_auto
            type: data.set
            with:
              gate_approved: true
              decided_by: ''
              gate_timed_out: false
              gate_error: ''
              # Nobody was asked, so there is nobody to authorize.
              gate_answered: false

      # Keyed on `gate_answered` rather than `needs_gate`, which skips both the
      # autonomy path and a timed-out gate. Neither has a decider: the only
      # principal is the Worker or the workflow runner, and the check could
      # only ever pass. Each write below asserts its own privilege regardless;
      # what is skipped here is the *decide* check.
      - name: authorize_decision
        type: if
        condition: '${{ variables.gate_answered == true }}'
        steps:
          # Ordering is load-bearing: after the gate, before any write. A write
          # that came first and threw would leave the gate claimed and spent,
          # stranding the proposal with no way for a privileged approver to
          # retry.
          - name: check_privileges
            type: proposals.checkDecidePrivileges
            with:
              proposalId: '{{ variables.current_proposal_id }}'
              # An external resume carries no request, so the execution wakes
              # under the workflow runner's key, which always holds the
              # privilege. `respondedBy` is the only thing that distinguishes
              # that from a human.
              respondedBy: '{{ variables.decided_by }}'

          - name: reject_unprivileged
            type: if
            condition: '${{ steps.check_privileges.output.canDecide != true }}'
            steps:
              # Nothing has been written, so re-parking leaves the proposal
              # exactly as a privileged approver will find it.
              - name: park_for_privileged
                type: loop.continue

      # The loop's only adopt, and the reason every branch below reads as a
      # plain sequence: a revision appended while the gate was parked moves the
      # chain head, and `updateProposal` refuses a superseded row.
      #
      # Placement carries the invariant. After `authorize_decision`, so an
      # unprivileged resumer re-parks before this reads the chain; before every
      # branch that writes, so all of them settle the live head.
      - name: get_last_revision
        type: proposals.getLatestRevision
        with:
          proposalId: '{{ variables.current_proposal_id }}'

      - name: adopt_last_revision
        type: data.set
        with:
          current_proposal_id: '{{ steps.get_last_revision.output.proposalId }}'
          # The revision's own input, not the trigger's: an analyst who
          # approved a corrected revision approved those parameters.
          action_input: '${{ steps.get_last_revision.output.actionInput }}'

      # The only expiry path. The gate's timeout is the time left on the
      # deadline, so a proposal nobody answered in time arrives here; one that
      # was already expired when it reached the gate parked for a second and
      # arrives here too.
      #
      # Must precede `handle_dismissal`: a timed-out gate answers blank,
      # leaving `gate_approved` false, which that branch would otherwise record
      # as a dismissal nobody made.
      - name: handle_gate_timeout
        type: if
        condition: '${{ variables.gate_timed_out == true }}'
        steps:
          # `expired`, not `failed`: the gate's timeout is the remaining
          # deadline, so a gate that times out has reached it by construction.
          # settleIncompleteProposal skips manage_proposals so a denied resumer's
          # key on the task cannot strand the record here.
          - name: record_gate_expiry
            type: proposals.settleIncompleteProposal
            with:
              proposalId: '{{ variables.current_proposal_id }}'
              status: expired
              executionError: '{{ variables.gate_error }}'
          - name: complete_gate_expiry
            type: data.set
            with:
              completed: true
              final_status: expired
          - name: break_gate_expiry
            type: loop.break

      - name: handle_dismissal
        type: if
        condition: '${{ variables.gate_approved != true }}'
        steps:
          - name: record_dismissal
            type: proposals.updateProposal
            with:
              proposalId: '{{ variables.current_proposal_id }}'
              decision: dismissed
              decidedBy: '{{ variables.decided_by }}'
              # The dismiss reason and rationale are written by the route
              # before it releases the gate, because `waitForApproval` reduces
              # its resume payload to a bare boolean.
              status: no_action
          - name: complete_dismissed
            type: data.set
            with:
              completed: true
              final_status: no_action
              final_decision: dismissed
          - name: break_dismissed
            type: loop.break

      # Decision and status are written together, one call per branch:
      # `approved` + `pending` is not a legal pair, so a decision-only write
      # would leave the record claiming an approval with no outcome. Both are
      # known here.
      #
      # Each branch carries the full condition rather than nesting under a
      # shared one, so no condition mixes `and` with `or`.
      - name: approve_without_action
        type: if
        # No action means the analyst carries it out themselves, so the
        # approval is the whole lifecycle.
        condition: '${{ variables.gate_approved == true and variables.action_workflow_id == blank }}'
        steps:
          - name: record_approval_no_action
            type: proposals.updateProposal
            with:
              proposalId: '{{ variables.current_proposal_id }}'
              decision: approved
              decidedBy: '{{ variables.decided_by }}'
              status: no_action
          - name: complete_no_action
            type: data.set
            with:
              completed: true
              final_status: no_action
              final_decision: approved
          - name: break_no_action
            type: loop.break

      - name: approve_with_action
        type: if
        condition: '${{ variables.gate_approved == true and variables.action_workflow_id != blank }}'
        steps:
          - name: record_approval_executing
            type: proposals.updateProposal
            with:
              proposalId: '{{ variables.current_proposal_id }}'
              decision: approved
              decidedBy: '{{ variables.decided_by }}'
              status: executing

          - name: execute_action
            type: workflow.execute
            on-failure:
              # Keeps the failure inside the loop so the clone branch below can
              # re-offer it; without this the workflow-level handler settles
              # the proposal and stops.
              #
              # `WorkflowExecuteStepSchema` does not model this key — same
              # lightweight-validation caveat and schema gap as the gate's
              # handler above (elastic/security-team#19315).
              continue: true
            with:
              workflow-id: '{{ variables.action_workflow_id }}'
              inputs:
                # Every action workflow takes one `actionInput` object, so this
                # workflow never needs to know an action's parameter names.
                #
                # From variables, not `inputs`: a revision may have corrected
                # the input while the gate was parked, and the trigger value
                # would execute parameters the analyst never approved.
                actionInput: '${{ variables.action_input }}'

          - name: handle_action_success
            type: if
            condition: '${{ steps.execute_action.error == blank }}'
            steps:
              - name: record_success
                type: proposals.updateProposal
                with:
                  proposalId: '{{ variables.current_proposal_id }}'
                  status: succeeded
              - name: complete_succeeded
                type: data.set
                with:
                  completed: true
                  final_status: succeeded
                  final_decision: approved
              - name: break_succeeded
                type: loop.break

          - name: handle_action_failure
            type: if
            condition: '${{ steps.execute_action.error != blank }}'
            steps:
              - name: record_action_failure
                type: proposals.updateProposal
                with:
                  proposalId: '{{ variables.current_proposal_id }}'
                  status: failed
                  executionError: '{{ steps.execute_action.error.message }}'

              # The failed proposal has settled, so the retry is a new record
              # against the same still-parked gate execution. It inherits the
              # deadline and creation time, so a chain of failures cannot
              # outlive the deadline the queue showed.
              - name: clone_proposal
                type: proposals.cloneProposal
                with:
                  proposalId: '{{ variables.current_proposal_id }}'

              # Assigned inside the branch that produced the id, because a step
              # that did not run this pass still returns its previous value.
              - name: adopt_clone
                type: data.set
                with:
                  current_proposal_id: '{{ steps.clone_proposal.output.proposalId }}'
                  # A human should see that the action failed, even if the
                  # first attempt ran under autonomy.
                  needs_gate: true
              - name: park_on_clone
                type: loop.continue

  # The loop can also end without settling anything: `on-limit: continue` exits
  # cleanly once `max-iterations` is spent, and nothing in the body wrote a
  # terminal status. Leaving it there would strand the record `pending` against
  # a finished execution, which is the outcome this whole definition exists to
  # prevent — so the budget gets the same treatment as every other way out.
  #
  # settleIncompleteProposal adopts the live head and skips manage_proposals, so
  # a denied resumer who burned the budget cannot leave the record pending.
  - name: settle_unfinished
    type: if
    condition: '${{ variables.completed != true }}'
    steps:
      - name: record_unfinished
        type: proposals.settleIncompleteProposal
        with:
          proposalId: '{{ variables.current_proposal_id }}'
          status: expired
          executionError: 'No decision was reached within the attempt budget.'
      - name: complete_unfinished
        type: data.set
        with:
          final_status: expired

  # Reads variables, never loop-body step outputs: those are evicted on exit.
  - name: output_result
    type: workflow.output
    status: completed
    with:
      proposalId: '{{ variables.current_proposal_id }}'
      status: '{{ variables.final_status }}'
      decision: '{{ variables.final_decision }}'
