version: "1"
name: "Significant Events Orchestrator"
description: "Sequences detection and discovery. Each workflow handles its own idle-skip logic."
enabled: true
tags:
  - observability
  - streams
  - significant-events
  - orchestrator
settings:
  # detection (≤5m) + discovery (≤45m) + 5m buffer
  timeout: "55m"
  concurrency:
    key: "significant-events-orchestrator"
    strategy: drop
    max: 1
  on-failure:
    # Sub-workflows exit cancelled (idle) or may fail transiently — always continue
    # so detection failure never blocks discovery and vice-versa.
    continue: true
triggers:
  - type: manual
    inputs:
      properties:
        connector_id:
          type: string
          maxLength: 255
          description: "Optional chat model connector or inference endpoint ID for discovery."
      additionalProperties: false
steps:
  # Runs as the space's detection engine service account, started by the space's entry point.
  # Detection and discovery sit inside the check: `on-failure: continue` would carry on past a
  # failing step before them.
  - name: run_as_service_account
    type: if
    condition: 'execution.effectiveIdentity.type : "service_account"'
    steps:
      - name: detect
        type: workflow.execute
        with:
          workflow-id: "system-significant-events-detection"
          run-as-mode: inherit

      - name: discover
        type: workflow.execute
        with:
          workflow-id: "system-significant-events-discovery"
          run-as-mode: inherit
          inputs:
            connector_id: "{{ inputs.connector_id }}"
    else:
      - name: refuse
        type: workflow.fail
        with:
          message: >-
            Detection and discovery run as the Nightshift service account. Start discovery from
            Nightshift in a space that is set up.
