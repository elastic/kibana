version: "1"

name: Significant Events Gap Detection
description: >
  Audits the significant events memory knowledge base against 11 required knowledge
  dimensions and writes a structured "_gaps/overview" memory page listing
  what is unknown, ambiguous, or missing. Runs on a weekly schedule.
enabled: false
settings:
  timeout: "30m"
  concurrency:
    key: "significant-events-memory-gap-detection"
    strategy: drop
    max: 1
tags:
  - observability
  - streams
  - significant-events
  - memory
  - gap-detection

triggers:
  - type: scheduled
    with:
      every: "168h"

consts:
  RUN_LEDGER_INDEX: ".significant_events-runs"
  RUN_BUDGET_GROUP: "memory"
  RUN_ENGINE: "context"
  RUN_QUOTA_ENABLED: __RUN_QUOTA_ENABLED__
  RUN_DAILY_LIMIT: __RUN_DAILY_LIMIT__
  RUN_QUOTA_TIME_ZONE: "__RUN_QUOTA_TIME_ZONE__"

steps:
  # -----------------------------------------------------------------------
  # Daily run-quota gate. The four memory workflows share one counter: they are
  # siblings (none invokes another), so one budget covers all memory upkeep.
  # See `server/lib/run_quotas` in the significant_events plugin.
  # -----------------------------------------------------------------------
  - name: quota_resolve_origin
    type: data.set
    with:
      # No workflow invokes this one, so its own trigger is the root origin.
      runOrigin: "{{ execution.triggeredBy }}"

  - name: quota_count_runs
    type: elasticsearch.request
    with:
      method: POST
      path: "/{{ consts.RUN_LEDGER_INDEX }}/_count"
      body:
        query:
          bool:
            filter:
              - term:
                  budget_group: "{{ consts.RUN_BUDGET_GROUP }}"
              - term:
                  outcome: "admitted"
              - range:
                  "@timestamp":
                    gte: "now/d"
                    time_zone: "{{ consts.RUN_QUOTA_TIME_ZONE }}"
    on-failure:
      continue: true

  - name: quota_evaluate
    type: data.set
    with:
      # Fail open on an unreadable ledger: a missing count must not stall the pipeline.
      quotaUsed: "${{ steps.quota_count_runs.output.count | default: 0 }}"
      # Fail closed on an unknown origin: only these three mean a person asked for
      # the run. Keep in sync with HUMAN_RUN_ORIGINS in the significant_events plugin.
      quotaAutomated: '${{ variables.runOrigin != "manual" and variables.runOrigin != "sigevents-investigation-ui" and variables.runOrigin != "significant-events-memory-ui" }}'

  - name: quota_decide
    type: data.set
    with:
      quotaRefused: "${{ consts.RUN_QUOTA_ENABLED and steps.quota_evaluate.output.quotaAutomated and steps.quota_evaluate.output.quotaUsed >= consts.RUN_DAILY_LIMIT }}"

  # Recorded before any work starts, so a run that later fails still consumed
  # budget. Refused runs are recorded too — as `refused`, which the counter
  # excludes — so a day spent at the cap does not inflate its own usage.
  # `refresh=wait_for` makes an admitted run visible to the next gate's count.
  - name: quota_record_run
    type: elasticsearch.request
    with:
      method: POST
      path: "/{{ consts.RUN_LEDGER_INDEX }}/_doc?refresh=wait_for"
      body:
        "@timestamp": '{{ "now" | date: "%Y-%m-%dT%H:%M:%S%:z" }}'
        budget_group: "{{ consts.RUN_BUDGET_GROUP }}"
        engine: "{{ consts.RUN_ENGINE }}"
        outcome: "{% if steps.quota_decide.output.quotaRefused %}refused{% else %}admitted{% endif %}"
        workflow_id: "{{ workflow.id }}"
        execution_id: "{{ execution.id }}"
        triggered_by: "{{ variables.runOrigin }}"
        kibana:
          space_ids:
            - "{{ workflow.spaceId }}"
    on-failure:
      continue: true

  - name: quota_stop_if_exhausted
    type: workflow.output
    if: "${{ steps.quota_decide.output.quotaRefused }}"
    with: {}

  - name: detect_gaps
    type: ai.agent
    # connector-id-by-feature: shared memory connector (SIGNIFICANT_EVENTS_MEMORY_INFERENCE_FEATURE_ID).
    # plugin-id: step-specific cost attribution; aggregate-by: SIGNIFICANT_EVENTS_INFERENCE_PARENT_FEATURE_ID.
    connector-id-by-feature: "significant_events_memory"
    plugin-id: "significant_events_memory_gap_detection"
    aggregate-by: "significant_events"
    create-conversation: true
    public-conversation: true
    with:
      timeout: 1800s
      message: |
        First, call the load_skill tool with skill path skills/platform/streams/streams-gap-detection.
        Wait for the skill to load before calling any other tools.

        Audit the memory knowledge base and produce an up-to-date gaps report.

        Review all existing memory pages, available knowledge indicators, the
        list of streams, and the configured connectors. Then assess coverage
        across the 11 required knowledge dimensions and write (or overwrite)
        the _gaps/overview memory page with a structured report of what is
        known, what is partial, what is missing, and concrete next steps.
      schema:
        type: object
        properties:
          gaps_found:
            type: array
            description: List of knowledge dimensions with identified gaps.
            items:
              type: string
          summary:
            type: string
            description: Brief summary of the overall knowledge coverage assessment.
        required:
          - gaps_found
          - summary
    on-failure:
      continue: false
