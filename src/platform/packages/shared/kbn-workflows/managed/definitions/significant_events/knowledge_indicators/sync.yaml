# Knowledge Indicator (KI) sync (groundedness) sweep workflow.
#
# Runs on its own schedule, independent of the continuous-extraction toggle, and
# reconciles every stream that has knowledge indicators. Streams and KIs are
# deployment-wide, so this workflow is installed once in the default space.

version: '1'
name: 'KI Sync'
enabled: false
description: 'This workflow is used by the system and should not be modified.'
tags:
  - observability
  - streams
  - significant-events
  - knowledge-indicators
  - sync
settings:
  timeout: '60m'
  concurrency:
    key: significant-events-ki-sync
    strategy: drop
    max: 1
triggers:
  - type: scheduled
    with:
      every: '24h'
  - type: manual
steps:
  - name: get_streams
    type: kibana.request
    with:
      method: GET
      path: '/internal/streams/_knowledge_indicators/_streams_with_indicators'
      headers:
        x-elastic-internal-origin: 'kibana'
    on-failure:
      retry:
        max-attempts: 3
        delay: '5s'
        strategy: exponential

  - name: has_candidates
    type: if
    condition: 'steps.get_streams.output.streams[0].streamName:*'
    steps:
      - name: reconcile_all
        type: foreach
        foreach: '${{ steps.get_streams.output.streams }}'
        iteration-on-failure:
          continue: true
        steps:
          - name: reconcile
            type: kibana.request
            with:
              method: POST
              path: '/internal/streams/{{ foreach.item.streamName }}/knowledge_indicators/_reconcile'
              headers:
                x-elastic-internal-origin: 'kibana'
            on-failure:
              retry:
                max-attempts: 3
                delay: '5s'
                strategy: exponential
