version: '1'
name: 'Significant Events Discovery'
description: 'Correlates unhandled detections into significant events using a discovery agent, writes final event versions, and propagates rule-level resolutions.'
enabled: true
settings:
  timeout: '45m'
  concurrency:
    key: significant-events-discovery
    strategy: drop
    max: 1
tags:
  - observability
  - streams
  - significant-events
  - discovery
triggers:
  - type: manual
    inputs:
      properties:
        detectionLookback:
          type: string
          default: 'now-24h'
          description: 'Lookback window for unprocessed detections; older detections are considered stale and excluded from the batch.'
        detectionBatchMax:
          type: number
          default: 10
          minimum: 1
          maximum: 1000
          description: 'Max rules per discovery invocation. Caps agent message size; remaining detections are picked up on the next cycle.'
        flakyRuleDetectionThreshold:
          type: number
          default: 10
          description: 'Rules with at least this many change-point detections inside the detectionLookback window are treated as flaky and suppressed from escalation until their oldest unprocessed detection ages past the probe interval.'
        flakyRuleProbeAfterMinutes:
          type: number
          default: 360
          description: 'A suppressed rule is let through to the agent once its oldest unprocessed detection is at least this old. Must stay below the detectionLookback window (default 24h=1440m) or the probe can never fire.'
        flakyRuleExemptSeverityScore:
          type: number
          default: 80
          description: 'Rules with severity_score at or above this value are never suppressed, however frequently they fire. Default matches the 80-critical investigation boundary; set above 100 to disable the exemption.'
        classifierProbeWindowMinutes:
          type: number
          default: 20
          minimum: 15
          maximum: 360
          description: "Window, ending now, over which the classifier re-runs a rule's stored query. Keep it short: on c0, windows over about 30 minutes let earlier matches hide recoveries from the agent."
        classifierProbeTimeoutMs:
          type: number
          default: 8000
          minimum: 1000
          maximum: 30000
          description: 'Per-probe timeout for re-running a stored query. A probe that times out sends its detection to the agent.'
        classifierProbeConcurrency:
          type: number
          default: 5
          minimum: 1
          maximum: 10
          description: 'Maximum stored-query probes the classifier runs at once.'
        classifierMaxSkipAgeHours:
          type: number
          default: 24
          minimum: 1
          maximum: 720
          description: "A detection is never skipped on the strength of a verdict older than this many hours (the rule's last verification in its live series): it goes to the agent, so a long-running event is re-judged at least this often."
        classifierBudgetMs:
          type: number
          default: 20000
          minimum: 2000
          maximum: 60000
          description: 'Shared time budget for all probes of one run. Probes not started when it is spent send their detection to the agent.'
        classifierReviewFreshMinutes:
          type: number
          default: 240
          minimum: 15
          maximum: 1440
          description: "How long the agent's last review of a rule stands in for its verdict while the rule's match count is unchanged. It is also the minimum gap between hand-offs of a held-back rule's change to the agent."
        classifierBaselineBucketMinutes:
          type: number
          default: 5
          minimum: 1
          maximum: 60
          description: "Bucket size of the rule's match series the classifier reads: its baseline, and its state at a review. Must not exceed classifierProbeWindowMinutes."
        classifierBaselineWindowMinutes:
          type: number
          default: 300
          minimum: 60
          maximum: 1440
          description: "How far back the classifier reads the rule's match series: the baseline sample, and how old a verdict or review can be and still be compared. classifierBaselineWindowMinutes / classifierBaselineBucketMinutes must be 11 to 288."
        rootTriggeredBy:
          type: string
          description: 'Root workflow trigger type propagated by a managed driver.'
        connector_id:
          type: string
          maxLength: 255
          description: 'Optional chat model connector or inference endpoint ID for this run.'
      additionalProperties: false
outputs:
  - name: processedCount
    type: number
  - name: hasWork
    type: boolean
  - name: skippedCount
    type: number
  - name: heldBackCount
    type: number
  - name: needsAgentCount
    type: number
  - name: classifierReasonCounts
    type: string
  - name: classifierProbeStatusCounts
    type: string
  - name: classifierFailed
    type: boolean
consts:
  DETECTIONS_INDEX: '.significant_events-detections'
  INVESTIGATABLE_SEVERITIES: ['critical', 'high']

steps:
  - name: bootstrap_cleanup_workflow
    type: kibana.request
    with:
      method: POST
      path: '/s/{{ workflow.spaceId }}/internal/significant_events/maintenance/cleanup/_bootstrap'
      headers:
        x-elastic-internal-origin: 'kibana'
    on-failure:
      continue: true

  - name: check_budget
    type: kibana.request
    if: '${{ inputs.rootTriggeredBy == "scheduled" }}'
    with:
      method: POST
      path: '/s/{{ workflow.spaceId }}/internal/significant_events/run_quotas/_consume'
      body:
        group: 'detection'
      headers:
        x-elastic-internal-origin: 'kibana'
    timeout: '10s'
    on-failure:
      continue: true

  - name: exit_if_budget_denied
    type: if
    condition: '${{ steps.check_budget.output.allowed == false }}'
    steps:
      - name: output_budget_denied
        type: workflow.output
        with:
          processedCount: 0
          hasWork: false
          skippedCount: 0
          heldBackCount: 0
          needsAgentCount: 0
          classifierReasonCounts: '{}'
          classifierProbeStatusCounts: '{}'
          classifierFailed: false

  # Copy workflow.spaceId into variables so ES body Liquid expressions can reference it.
  - name: set_initial_vars
    type: data.set
    with:
      spaceId: '{{ workflow.spaceId }}'

  # Unbounded processed-marker semijoin by detection_id, then reduce to the latest
  # unprocessed detection per rule (_id tie-break). `last_reviewed_at` is when the agent last processed
  # a detection of the rule it was given: the newest processed marker (a marker without `skip`;
  # every skip marker carries `skip.event_id`), not the detection's own time, since the agent reads
  # the data when it reviews. The marker is written when the run ends, so the classifier never lets
  # a review cover a detection that fired before it. Score by severity + age. The flaky-rule gate
  # flags a rule `held_back` instead of dropping it, and held rows sort last, so noisy rules never
  # take batch slots from quiet ones. The classifier reads the flag by name: it may skip a held row
  # and never hands it to the agent.
  - name: get_detections
    type: elasticsearch.esql.query
    with:
      query: |-
        FROM .significant_events-detections METADATA _id, _source
        | INLINE STATS processed_count = COUNT(processed_by), skipped_count = COUNT(skip.event_id), processed_at = MAX(@timestamp) WHERE processed_by IS NOT NULL BY detection_id
        | WHERE change_point_type IS NOT NULL
        | INLINE STATS recent_detection_count = COUNT(*), last_reviewed_at = MAX(processed_at) WHERE processed_count > 0 AND skipped_count == 0 BY rule_uuid
        | WHERE processed_count == 0
        | INLINE STATS oldest_unprocessed = MIN(@timestamp), latest_timestamp = MAX(@timestamp) BY rule_uuid
        | WHERE @timestamp == latest_timestamp
        | INLINE STATS latest_id = MAX(_id) BY rule_uuid
        | WHERE _id == latest_id
        | EVAL severity_score = COALESCE(severity_score, 0)
        | EVAL suppressed_age_minutes = DATE_DIFF("minute", oldest_unprocessed, NOW())
        | EVAL held_back = recent_detection_count >= ?2 AND suppressed_age_minutes < ?3 AND severity_score < ?4
        | EVAL flaky_probe = recent_detection_count >= ?2 AND suppressed_age_minutes >= ?3
        | EVAL staleness_minutes = DATE_DIFF("minute", @timestamp, NOW())
        | EVAL score = severity_score + staleness_minutes
        | SORT held_back ASC, score DESC, @timestamp ASC, _id ASC
        | LIMIT ?1
        | KEEP rule_uuid, _source, score, recent_detection_count, flaky_probe, held_back, last_reviewed_at
      params:
        - '${{ inputs.detectionBatchMax }}'
        - '${{ inputs.flakyRuleDetectionThreshold }}'
        - '${{ inputs.flakyRuleProbeAfterMinutes }}'
        - '${{ inputs.flakyRuleExemptSeverityScore }}'
      filter:
        bool:
          filter:
            - term:
                kibana.space_ids: '{{ variables.spaceId }}'
            - range:
                '@timestamp':
                  gte: '{{ inputs.detectionLookback }}'
    on-failure:
      continue: true

  # Decides per detection whether the agent needs to see it. Read-only.
  # A failure while classifying must never change behavior, so the step fails open itself: it hands
  # on every row the agent may read, unjudged, and reports `failed`. A step that cannot run at all
  # (an unregistered step, input it cannot read) is a defect, so it fails the run loudly: continuing
  # would end every cycle as having no work and starve the agent without a trace.
  - name: classify_detections
    type: significantEvents.classifyDetections
    with:
      # No `| default: []`: the engine evaluates that to undefined even for an empty array, and the
      # step already treats a missing `rows` as an empty batch.
      rows: '${{ steps.get_detections.output.values }}'
      columns: "${{ steps.get_detections.output.columns | map: 'name' }}"
      space_id: '{{ variables.spaceId }}'
      probe_window_minutes: '${{ inputs.classifierProbeWindowMinutes }}'
      probe_timeout_ms: '${{ inputs.classifierProbeTimeoutMs }}'
      probe_concurrency: '${{ inputs.classifierProbeConcurrency }}'
      budget_ms: '${{ inputs.classifierBudgetMs }}'
      max_skip_age_hours: '${{ inputs.classifierMaxSkipAgeHours }}'
      review_fresh_minutes: '${{ inputs.classifierReviewFreshMinutes }}'
      baseline_bucket_minutes: '${{ inputs.classifierBaselineBucketMinutes }}'
      baseline_window_minutes: '${{ inputs.classifierBaselineWindowMinutes }}'

  # Detections the classifier skipped are done: stamp them processed so they leave the queue. This
  # runs before the batch gate, so it does not depend on the agent running or succeeding. A failed
  # stamp only leaves the detection to be re-selected and re-classified next cycle.
  - name: stamp_skipped_detections
    type: if
    condition: '${{ steps.classify_detections.output.skipped_count > 0 }}'
    steps:
      # Same query shape as get_written_rules_backlog: markers carry no rule_uuid, so the rule
      # filter must stay a should alongside `exists: processed_by`. Each rule is stamped up to the
      # detection the classifier judged (the ids in ?1, comma-delimited): a newer one that arrived
      # after was never classified. One row per rule, so one marker request per rule.
      - name: get_skipped_rules_backlog
        type: elasticsearch.esql.query
        with:
          query: |-
            FROM .significant_events-detections
            | INLINE STATS processed_count = COUNT(processed_by) BY detection_id
            | WHERE change_point_type IS NOT NULL AND processed_count == 0
            | EVAL classified = LOCATE(?1, CONCAT(",", detection_id, ",")) > 0
            | INLINE STATS classified_at = MAX(@timestamp) WHERE classified BY rule_uuid
            | WHERE classified_at IS NOT NULL AND @timestamp <= classified_at
            | STATS detection_ids = VALUES(detection_id) BY rule_uuid
          params:
            - ",{{ steps.classify_detections.output.skipped_detection_ids | join: ',' }},"
          filter:
            bool:
              filter:
                - term:
                    kibana.space_ids: '{{ variables.spaceId }}'
                - bool:
                    should:
                      - terms:
                          rule_uuid: '${{ steps.classify_detections.output.skipped_rule_uuids }}'
                      - exists:
                          field: processed_by
                    minimum_should_match: 1
                - range:
                    '@timestamp':
                      gte: '{{ inputs.detectionLookback }}'
        on-failure:
          continue: true

      - name: foreach_stamp_skipped
        type: foreach
        foreach: '${{ steps.get_skipped_rules_backlog.output.values | default: [] }}'
        iteration-on-failure:
          continue: true
        steps:
          - name: prepare_skipped_marker
            type: data.set
            with:
              # A rule with one detection comes back as a string, with several as an array.
              detection_ids: '${{ foreach.item[0] | join: "," | split: "," }}'
              rule_uuid: '${{ foreach.item[1] }}'
          - name: foreach_skipped_detection_chunk
            type: foreach
            # The mark-processed route accepts at most 1,000 IDs per request.
            foreach: '${{ steps.prepare_skipped_marker.output.detection_ids | chunk: 1000 | json }}'
            iteration-on-failure:
              continue: true
            steps:
              - name: write_skipped_marker
                type: kibana.request
                with:
                  method: POST
                  path: '/s/{{ variables.spaceId }}/internal/significant_events/detections/_mark_processed'
                  headers:
                    x-elastic-internal-origin: 'kibana'
                  body:
                    detection_ids: '${{ foreach.item }}'
                    processed_by: '{{ execution.id }}'
                    # The classifier's decision for this rule, so the marker says why.
                    skip: "${{ steps.classify_detections.output.skips | where: 'rule_uuid', steps.prepare_skipped_marker.output.rule_uuid | map: 'skip' | first }}"
                on-failure:
                  continue: true

  # Rows for the agent.
  - name: compute_batch_size
    type: data.set
    with:
      processedCount: '${{ steps.classify_detections.output.row_count | default: 0 }}'

  - name: compute_has_work
    type: data.set
    with:
      hasWork: '${{ steps.compute_batch_size.output.processedCount > 0 }}'

  - name: maybe_exit_no_work
    type: if
    condition: '${{ steps.compute_has_work.output.hasWork == false }}'
    steps:
      - name: output_no_detections
        type: workflow.output
        with:
          processedCount: '${{ steps.compute_batch_size.output.processedCount }}'
          hasWork: false
          skippedCount: '${{ steps.classify_detections.output.skipped_count | default: 0 }}'
          heldBackCount: '${{ steps.classify_detections.output.held_back_count | default: 0 }}'
          needsAgentCount: '${{ steps.classify_detections.output.needs_agent_count | default: 0 }}'
          classifierReasonCounts: "${{ steps.classify_detections.output.reason_counts | json | default: '{}' }}"
          classifierProbeStatusCounts: "${{ steps.classify_detections.output.probe_status_counts | json | default: '{}' }}"
          classifierFailed: '${{ steps.classify_detections.error != null or steps.classify_detections.output.failed == true }}'

  # -----------------------------------------------------------------------
  # Correlate detections into discoveries.
  # -----------------------------------------------------------------------
  - name: resolve_model
    type: significantEvents.resolveModel
    with:
      step: discovery
      connector_id: '{{ inputs.connector_id }}'

  - name: run_discovery_agent
    type: ai.agent
    agent-id: 'significant-events.discovery'
    connector-id: '{{ steps.resolve_model.output.connector_id }}'
    # Keep usage attribution IDs in sync with @kbn/significant-events-schema nightshift_usage_ids.ts.
    plugin-id: 'nightshift_discovery'
    aggregate-by: 'nightshift'
    product-solution: 'observability'
    product-feature: 'nightshift'
    create-conversation: true
    public-conversation: true
    with:
      message: |
        ## Detection batch

        {{ steps.classify_detections.output.batch | json }}
      schema:
        type: object
        properties:
          written_rule_uuids:
            type: array
            items:
              type: string
            description: >-
              rule_uuid of every detection that is done this cycle: a detection whose
              events_write result was written: true or skipped with reason
              existing_active_event or unchanged_outcome, or a detection intentionally
              determined not event-eligible for which no write was attempted.
              Failed (bulk_error or unknown_event_id) or unattempted event-eligible writes
              must not be included.
              Used both as a hallucination guardrail (schema validation forces the agent
              to report real activity) and as the per-rule filter for which detections
              get stamped as processed. Full discovery data is written via the
              events_write tool — this is a compact summary only.
          significant_events:
            type: array
            description: 'Final events_write outcomes from the discovery agent. Successful writes have written: true. The workflow uses only successful active items to gate trigger_investigation.'
            items:
              type: object
              properties:
                event_id:
                  type: string
                  description: 'Echo the event_id verbatim from the discovery. Also returned by events_write. Required for trigger_investigation context.'
                severity:
                  type: string
                  enum: ['critical', 'high', 'medium', 'low']
                  description: 'Severity of the event as decided by the discovery agent.'
                status:
                  type: string
                  enum: [active, recovering, inactive]
                  description: 'Echo of the status events_write returned. The agent decides nothing here: the server derives it from the per-rule verdicts (a breach is active, healthy members open an event recovering), and an operator or a close workflow owns inactive.'
                written:
                  type: boolean
                  description: 'true when events_write appended the event version.'
                reason:
                  type: string
                  description: 'Failure or skip reason when written is false.'
              required: [event_id, severity, status, written]
        required: [written_rule_uuids, significant_events]
    on-failure:
      continue: false

  - name: compute_written_rule_uuids
    # Normalise the agent's self-reported summary into a plain array for the stamping gate below.
    type: data.set
    with:
      written_rule_uuids: '${{ steps.run_discovery_agent.output.structured_output.written_rule_uuids | default: [] | uniq }}'

  # Size must be computed separately — comparison operators cannot follow a filter chain.
  - name: count_written_rules
    type: data.set
    with:
      writtenCount: '${{ variables.written_rule_uuids | size | default: 0 }}'

  # Mark processed detections for every written rule (one query, not N).
  # Gate with type: if — step-level `if` is stripped on elasticsearch.* schemas.
  - name: maybe_stamp_processed
    type: if
    condition: '${{ steps.run_discovery_agent.error == null and steps.count_written_rules.output.writtenCount > 0 }}'
    steps:
      # The rule filter must be a should alongside `exists: processed_by` — markers carry no
      # rule_uuid, so a bare terms filter drops them before the processed_count semijoin and
      # every backlog detection gets re-stamped each cycle (nightshift-program#961).
      # Each rule is stamped up to the detection the agent was given (the batch ids in ?1): one that
      # arrived during the run was never seen, stays pending, and never becomes the rule's last review.
      - name: get_written_rules_backlog
        type: elasticsearch.esql.query
        with:
          query: |-
            FROM .significant_events-detections
            | INLINE STATS processed_count = COUNT(processed_by) BY detection_id
            | WHERE change_point_type IS NOT NULL AND processed_count == 0
            | EVAL given = LOCATE(?1, CONCAT(",", detection_id, ",")) > 0
            | INLINE STATS given_at = MAX(@timestamp) WHERE given BY rule_uuid
            | WHERE given_at IS NOT NULL AND @timestamp <= given_at
            | KEEP detection_id
          params:
            - ",{{ steps.classify_detections.output.batch | map: 'detection_id' | join: ',' }},"
          filter:
            bool:
              filter:
                - term:
                    kibana.space_ids: '{{ variables.spaceId }}'
                - bool:
                    should:
                      - terms:
                          rule_uuid: '${{ variables.written_rule_uuids }}'
                      - exists:
                          field: processed_by
                    minimum_should_match: 1
                - range:
                    '@timestamp':
                      gte: '{{ inputs.detectionLookback }}'
        on-failure:
          continue: false

      - name: foreach_stamp_processed
        type: foreach
        foreach: '${{ steps.get_written_rules_backlog.output.values | default: [] }}'
        iteration-on-failure:
          continue: true
        steps:
          # Written through Kibana as its internal user, like detections in detection.yaml.
          - name: write_processed_marker
            type: kibana.request
            with:
              method: POST
              path: '/s/{{ variables.spaceId }}/internal/significant_events/detections/_mark_processed'
              headers:
                x-elastic-internal-origin: 'kibana'
              body:
                detection_ids:
                  - '{{ foreach.item[0] }}'
                processed_by: '{{ execution.id }}'
            on-failure:
              continue: true

  # -----------------------------------------------------------------------
  # Trigger root-cause investigation for newly-active high-severity events.
  # The discovery agent owns the event decision and events_write; deterministic
  # queue advancement stays in the workflow and does not consume agent turns.
  # -----------------------------------------------------------------------

  # Eviction-safe snapshot — ai.agent outputs are evictable; data.set outputs are not.
  - name: check_discovery_agent_output
    type: if
    condition: '${{ steps.run_discovery_agent.error == null and steps.run_discovery_agent.output.structured_output.significant_events != null }}'
    steps:
      - name: store_significant_events
        type: data.set
        with:
          significant_events: '${{ steps.run_discovery_agent.output.structured_output.significant_events }}'

      # Size must be computed in a separate step — comparison operators cannot follow
      # a filter chain in the same expression (see compute_batch_size above).
      - name: count_active_events
        type: data.set
        with:
          activeCount: >-
            ${{ steps.store_significant_events.output.significant_events
              | default: []
              | where: 'status', 'active'
              | reject: 'written', false
              | size
              | default: 0 }}

      - name: maybe_trigger_investigations
        type: if
        condition: '${{ steps.count_active_events.output.activeCount > 0 }}'
        steps:
          - name: foreach_significant_event
            type: foreach
            foreach: >-
              ${{
                steps.store_significant_events.output.significant_events
                  | default: []
                  | where: 'status', 'active'
                  | reject: 'written', false
                  | default: [] }}
            iteration-on-failure:
              continue: true
            steps:
              - name: gate_investigatable_severity
                type: if
                condition: '${{ foreach.item.event_id != null and consts.INVESTIGATABLE_SEVERITIES contains foreach.item.severity }}'
                steps:
                  # Reads the latest current-state version per event_id from `.rule-events`.
                  - name: resolve_active_event
                    type: kibana.request
                    with:
                      method: GET
                      path: '/s/{{ workflow.spaceId }}/internal/significant_events/events?event_id={{ foreach.item.event_id | url_encode }}&perPage=1'
                      headers:
                        x-elastic-internal-origin: 'kibana'
                    on-failure:
                      continue: true

                  # Fire-and-forget a root-cause investigation for each newly-active event that
                  # has not been investigated before. Async so discovery (45m) never blocks on the
                  # investigation (60m). A re-opened event whose investigation is still open
                  # continues that investigation, because the start matches open investigations
                  # by subject (the event id).
                  # Skip the launch when the event lookup fails or misses: the investigation
                  # requires the resolved title, summary, and symptom hypothesis as context.
                  - name: guard_resolved_event
                    type: if
                    condition: >-
                      ${{ steps.resolve_active_event.error == null
                        and steps.resolve_active_event.output.hits[0] != null }}
                    steps:
                      # Keep the dedupe condition as a wrapping step so an investigation starts
                      # only after event deduplication.
                      - name: guard_missing_investigation
                        type: if
                        condition: >-
                          ${{ (steps.resolve_active_event.output.hits[0].investigations | size | default: 0) == 0 }}
                        steps:
                          - name: trigger_investigation
                            type: nightshift.triggerInvestigation
                            with:
                              subject_type: significant_event
                              subject_id: '{{ foreach.item.event_id }}'
                              message: |
                                {{ steps.resolve_active_event.output.hits[0].title | truncate: 512, '' }}

                                {{ steps.resolve_active_event.output.hits[0].summary | truncate: 7000, '' }}

                                Probable cause: {{ steps.resolve_active_event.output.hits[0].symptom_hypothesis | truncate: 2000, '' }}
                              title: '{{ steps.resolve_active_event.output.hits[0].title }}'
                              summary: '{{ steps.resolve_active_event.output.hits[0].summary }}'
                              source_ids: '${{ steps.resolve_active_event.output.hits[0].source_ids | default: [] }}'
                              trigger_type: automatic
                              context:
                                event_id: '{{ foreach.item.event_id }}'
                                status: '{{ foreach.item.status }}'
                                causal_features: '${{ steps.resolve_active_event.output.hits[0].causal_features | default: [] }}'
                                blast_radius: '${{ steps.resolve_active_event.output.hits[0].blast_radius | default: [] }}'
                            on-failure:
                              continue: true

  - name: output_result
    type: workflow.output
    with:
      processedCount: '${{ steps.compute_batch_size.output.processedCount }}'
      hasWork: true
      skippedCount: '${{ steps.classify_detections.output.skipped_count | default: 0 }}'
      heldBackCount: '${{ steps.classify_detections.output.held_back_count | default: 0 }}'
      needsAgentCount: '${{ steps.classify_detections.output.needs_agent_count | default: 0 }}'
      classifierReasonCounts: "${{ steps.classify_detections.output.reason_counts | json | default: '{}' }}"
      classifierProbeStatusCounts: "${{ steps.classify_detections.output.probe_status_counts | json | default: '{}' }}"
      classifierFailed: '${{ steps.classify_detections.error != null or steps.classify_detections.output.failed == true }}'
