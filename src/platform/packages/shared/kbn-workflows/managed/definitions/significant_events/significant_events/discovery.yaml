version: '1'
name: 'Significant Events Discovery'
description: 'Correlates unhandled detections into significant events using a discovery agent, writes final event versions, and propagates rule-level resolutions.'
enabled: true
settings:
  timeout: '45m'
  concurrency:
    key: significant-events-discovery
    strategy: drop
    max: 1
tags:
  - observability
  - streams
  - significant-events
  - discovery
triggers:
  - type: manual
    inputs:
      - name: detectionLookback
        type: string
        default: 'now-24h'
        required: false
        description: 'Lookback window for unprocessed detections; older detections are considered stale and excluded from the batch.'
      - name: detectionBatchMax
        type: number
        default: 10
        required: false
        description: 'Max rules per discovery invocation. Caps agent message size; remaining detections are picked up on the next cycle.'
outputs:
  - name: processedCount
    type: number
  - name: hasWork
    type: boolean
consts:
  DETECTIONS_INDEX: '.significant_events-detections'
  EVENTS_INDEX: '.significant_events-events'
  INVESTIGATABLE_SEVERITIES: ['80-critical', '60-high']

steps:
  # Copy workflow.spaceId into variables so ES body Liquid expressions can reference it.
  - name: set_initial_vars
    type: data.set
    with:
      spaceId: '{{ workflow.spaceId }}'

  # Unbounded processed-marker semijoin by detection_id, then reduce to the latest
  # unprocessed detection per rule (_id tie-break). Score by severity + age.
  - name: get_detections
    type: elasticsearch.esql.query
    with:
      query: |-
        FROM .significant_events-detections METADATA _id, _source
        | INLINE STATS processed_count = COUNT(processed_by) BY detection_id
        | WHERE change_point_type IS NOT NULL AND processed_count == 0
        | INLINE STATS latest_timestamp = MAX(@timestamp) BY rule_uuid
        | WHERE @timestamp == latest_timestamp
        | INLINE STATS latest_id = MAX(_id) BY rule_uuid
        | WHERE _id == latest_id
        | EVAL severity_score = COALESCE(severity_score, 0)
        | EVAL staleness_minutes = DATE_DIFF("minute", @timestamp, NOW())
        | EVAL score = severity_score + staleness_minutes
        | SORT score DESC, @timestamp ASC, _id ASC
        | LIMIT ?1
        | KEEP rule_uuid, _source, score
      params:
        - '${{ inputs.detectionBatchMax }}'
      filter:
        bool:
          filter:
            - term:
                kibana.space_ids: '{{ variables.spaceId }}'
            - range:
                '@timestamp':
                  gte: '{{ inputs.detectionLookback }}'
    on-failure:
      continue: true

  # Size must be computed separately — comparison operators cannot follow a filter chain.
  - name: compute_batch_size
    type: data.set
    with:
      processedCount: '${{ steps.get_detections.output.values | size | default: 0 }}'

  - name: compute_has_work
    type: data.set
    with:
      hasWork: '${{ steps.compute_batch_size.output.processedCount > 0 }}'

  - name: maybe_exit_no_work
    type: if
    condition: '${{ steps.compute_has_work.output.hasWork == false }}'
    steps:
      - name: output_no_detections
        type: workflow.output
        with:
          processedCount: '${{ steps.compute_batch_size.output.processedCount }}'
          hasWork: false

  # -----------------------------------------------------------------------
  # Correlate detections into discoveries.
  # -----------------------------------------------------------------------
  - name: run_discovery_agent
    type: ai.agent
    agent-id: "significant-events.discovery"
    # Keep connector-id-by-feature/plugin-id/aggregate-by in sync with @kbn/significant-events-schema
    # inference_feature_ids.ts (SIGNIFICANT_EVENTS_DISCOVERY_INFERENCE_FEATURE_ID /
    # SIGNIFICANT_EVENTS_INFERENCE_PARENT_FEATURE_ID).
    connector-id-by-feature: 'significant_events_discovery'
    plugin-id: 'significant_events_discovery'
    aggregate-by: 'significant_events'
    create-conversation: true
    public-conversation: true
    with:
      message: |
        ## Detection batch

        Columns: {{ steps.get_detections.output.columns | map: 'name' | json }}
        Rows: {{ steps.get_detections.output.values | json }}
      schema:
        type: object
        properties:
          written_rule_uuids:
            type: array
            items:
              type: string
            description: >-
              rule_uuid of every entry across signals[] whose final events_write
              result was either written: true or skipped with
              reason: duplicate_within_window. Failed or unattempted writes must not
              be included. Used both
              as a hallucination guardrail (schema validation forces the agent to
              report real activity) and as the per-rule filter for which detections
              get stamped as processed. Full discovery data is written via the
              events_write tool — this is a compact summary only.
          significant_events:
            type: array
            description: 'Final events_write outcomes from the discovery agent. Successful writes include event_uuid; failed writes have written: false. The workflow uses only successful open items to gate trigger_investigation.'
            items:
              type: object
              properties:
                event_id:
                  type: string
                  description: 'Echo the event_id verbatim from the discovery. Also returned by events_write. Required for trigger_investigation context.'
                event_uuid:
                  type: string
                  description: 'UUID assigned by events_write. Present only when written is true and required for trigger_investigation context.'
                severity:
                  type: string
                  enum: ['80-critical', '60-high', '40-medium', '20-low']
                  description: 'Severity of the event as decided by the discovery agent.'
                status:
                  type: string
                  enum: [open, dismissed, closed]
                  description: 'Status decision.'
                written:
                  type: boolean
                  description: 'true when events_write appended the event version.'
                reason:
                  type: string
                  enum: [bulk_error, duplicate_within_window]
                  description: 'Failure or skip reason when written is false.'
              required: [event_id, severity, status, written]
        required: [written_rule_uuids, significant_events]
    on-failure:
      continue: false

  - name: compute_written_rule_uuids
    # Normalise the agent's self-reported summary into a plain array for the stamping gate below.
    type: data.set
    with:
      written_rule_uuids: '${{ steps.run_discovery_agent.output.structured_output.written_rule_uuids | default: [] | uniq }}'

  # Size must be computed separately — comparison operators cannot follow a filter chain.
  - name: count_written_rules
    type: data.set
    with:
      writtenCount: '${{ variables.written_rule_uuids | size | default: 0 }}'

  # Mark processed detections for every written rule (one query, not N).
  # Gate with type: if — step-level `if` is stripped on elasticsearch.* schemas.
  - name: maybe_stamp_processed
    type: if
    condition: '${{ steps.run_discovery_agent.error == null and steps.count_written_rules.output.writtenCount > 0 }}'
    steps:
      - name: get_written_rules_backlog
        type: elasticsearch.esql.query
        with:
          query: |-
            FROM .significant_events-detections
            | INLINE STATS processed_count = COUNT(processed_by) BY detection_id
            | WHERE change_point_type IS NOT NULL AND processed_count == 0
            | KEEP detection_id
          filter:
            bool:
              filter:
                - term:
                    kibana.space_ids: '{{ variables.spaceId }}'
                - terms:
                    rule_uuid: '${{ variables.written_rule_uuids }}'
                - range:
                    '@timestamp':
                      gte: '{{ inputs.detectionLookback }}'
        on-failure:
          continue: false

      - name: foreach_stamp_processed
        type: foreach
        foreach: '${{ steps.get_written_rules_backlog.output.values | default: [] }}'
        iteration-on-failure:
          continue: true
        steps:
          - name: write_processed_marker
            type: elasticsearch.request
            with:
              method: POST
              path: '/{{ consts.DETECTIONS_INDEX }}/_doc'
              body:
                '@timestamp': '{{ "now" | date: "%Y-%m-%dT%H:%M:%S%:z" }}'
                kibana:
                  space_ids:
                    - '{{ variables.spaceId }}'
                detection_id: '{{ foreach.item[0] }}'
                processed_by: '{{ execution.id }}'
            on-failure:
              continue: true

  # -----------------------------------------------------------------------
  # Trigger root-cause investigation for newly-opened high-severity events.
  # The discovery agent owns the event decision and events_write; deterministic
  # queue advancement stays in the workflow and does not consume agent turns.
  # -----------------------------------------------------------------------

  # Eviction-safe snapshot — ai.agent outputs are evictable; data.set outputs are not.
  - name: check_discovery_agent_output
    type: if
    condition: '${{ steps.run_discovery_agent.error == null and steps.run_discovery_agent.output.structured_output.significant_events != null }}'
    steps:
      - name: store_significant_events
        type: data.set
        with:
          significant_events: '${{ steps.run_discovery_agent.output.structured_output.significant_events }}'

      # Size must be computed in a separate step — comparison operators cannot follow
      # a filter chain in the same expression (see compute_batch_size above).
      - name: count_open_events
        type: data.set
        with:
          openCount: >-
            ${{ steps.store_significant_events.output.significant_events
              | default: []
              | where: 'status', 'open'
              | reject: 'written', false
              | size
              | default: 0 }}

      - name: maybe_trigger_investigations
        type: if
        condition: '${{ steps.count_open_events.output.openCount > 0 }}'
        steps:
          - name: foreach_significant_event
            type: foreach
            foreach: >-
              ${{
                steps.store_significant_events.output.significant_events
                  | default: []
                  | where: 'status', 'open'
                  | reject: 'written', false
                  | default: [] }}
            iteration-on-failure:
              continue: true
            steps:
              - name: gate_investigatable_severity
                type: if
                condition: '${{ foreach.item.event_uuid != null and consts.INVESTIGATABLE_SEVERITIES contains foreach.item.severity }}'
                steps:
                  - name: resolve_open_event
                    type: elasticsearch.request
                    with:
                      method: POST
                      path: '/{{ consts.EVENTS_INDEX }}/_search?ignore_unavailable=true'
                      body:
                        size: 1
                        sort:
                          - '@timestamp':
                              order: desc
                        query:
                          bool:
                            filter:
                              - term:
                                  kibana.space_ids: '{{ variables.spaceId }}'
                              - term:
                                  event_id: '{{ foreach.item.event_id }}'
                    on-failure:
                      continue: true

                  # Skip events that already have an investigation attached. events_write carries
                  # the investigations lineage forward on re-open, so any version of the event_id
                  # that carries an investigations entry means this episode was already investigated.
                  # The field is a mapped object, so an `exists` filter matches only versions that
                  # actually carry an entry (an empty investigations array does not count).
                  - name: check_prior_investigation
                    type: elasticsearch.request
                    with:
                      method: POST
                      path: '/{{ consts.EVENTS_INDEX }}/_count?ignore_unavailable=true'
                      body:
                        query:
                          bool:
                            filter:
                              - term:
                                  kibana.space_ids: '{{ variables.spaceId }}'
                              - term:
                                  event_id: '{{ foreach.item.event_id }}'
                              - exists:
                                  field: investigations
                    on-failure:
                      continue: true

                  # Fire-and-forget a root-cause investigation for each newly-opened event that
                  # has not been investigated before. Async so discovery (45m) never blocks on the
                  # investigation (60m). concurrency_key per event_id ensures a re-opened event
                  # cancels the prior in-progress investigation rather than queuing alongside it
                  # (cancel-in-progress / max:1 in the investigation workflow).
                  # Skip the launch when the event lookup fails or misses: the investigation
                  # requires the resolved title, summary, and symptom hypothesis as context.
                  - name: guard_resolved_event
                    type: if
                    condition: >-
                      ${{ steps.resolve_open_event.error == null
                        and steps.resolve_open_event.output.hits.hits[0] != null }}
                    steps:
                      # The dedupe gate lives on this wrapping `if` step because
                      # `workflow.executeAsync` does not support an inline `if`
                      # (it is silently stripped during schema parsing).
                      - name: guard_missing_investigation
                        type: if
                        condition: >-
                          ${{ steps.check_prior_investigation.error != null
                            or steps.check_prior_investigation.output.count == 0 }}
                        steps:
                          - name: trigger_investigation
                            type: workflow.executeAsync
                            with:
                              workflow-id: 'system-significant-events-investigation'
                              inputs:
                                message: |
                                  {{ steps.resolve_open_event.output.hits.hits[0]._source.title }}

                                  {{ steps.resolve_open_event.output.hits.hits[0]._source.summary }}

                                  Probable cause: {{ steps.resolve_open_event.output.hits.hits[0]._source.symptom_hypothesis }}
                                stream_names: '${{ steps.resolve_open_event.output.hits.hits[0]._source.stream_names | default: [] }}'
                                concurrency_key: '{{ foreach.item.event_id }}'
                                context:
                                  source: 'significant_event'
                                  event_uuid: '{{ foreach.item.event_uuid }}'
                                  event_id: '{{ foreach.item.event_id }}'
                                  status: '{{ foreach.item.status }}'

  - name: output_result
    type: workflow.output
    with:
      processedCount: '${{ steps.compute_batch_size.output.processedCount }}'
      hasWork: true
