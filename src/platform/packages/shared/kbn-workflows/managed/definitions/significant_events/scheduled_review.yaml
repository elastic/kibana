version: "1"
name: "Significant Events Scheduled Review"
description: "Runs bounded Significant Events discovery passes on a schedule for the current space."
enabled: false
tags:
  - observability
  - streams
  - significant-events
  - scheduled
  - review
settings:
  concurrency:
    key: "significant-events-scheduled-review"
    strategy: drop
    max: 1
triggers:
  - type: scheduled
    with:
      every: "__REVIEW_INTERVAL_MINUTES__m"
  - type: manual
steps:
  - name: run_review_until_drained
    type: while
    # Re-run while discovery found work this pass. A child error is deliberately
    # NOT part of this condition and the child step has no `on-failure: continue`,
    # so the first failing pass bails out of the loop and fails the run — surfacing
    # the error instead of spinning until `max-iterations` is exhausted.
    # Do-while semantics: the first pass always runs; an empty follow-up pass exits.
    condition: "${{ steps.discover.output.hasWork == true }}"
    max-iterations: __MAX_REVIEW_PASSES__
    # Bound each pass to discovery (45m) worst case + 5m buffer instead of capping
    # the whole loop with a single, necessarily-too-small workflow-level timeout.
    # The buffer ensures the iteration does not race with the child workflow's own
    # 45m hard timeout if discovery runs right to its limit.
    iteration-timeout: "50m"
    steps:
      - name: discover
        type: workflow.execute
        with:
          workflow-id: "system-significant-events-discovery"
          inputs:
            detectionBatchMax: __DISCOVERY_BATCH_SIZE__
            flakyRuleDetectionThreshold: __FLAKY_RULE_DETECTION_THRESHOLD__
            flakyRuleProbeAfterMinutes: __FLAKY_RULE_PROBE_AFTER_MINUTES__
            flakyRuleExemptSeverityScore: __FLAKY_RULE_EXEMPT_SEVERITY_SCORE__
            rootTriggeredBy: '${{ execution.triggeredBy }}'
