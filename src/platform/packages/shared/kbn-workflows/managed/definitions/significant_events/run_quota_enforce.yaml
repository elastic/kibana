version: "1"
name: "Significant Events Run Quota Enforce"
description: >
  Soft daily run-quota enforcement (not a hard admit-time limit). Every 5 minutes
  it asks Kibana to reconcile engine pause state with the day's usage: engines over
  their budget are paused, engines back within budget (after the UTC day rolls over,
  or after an admin raises a limit) are resumed. Because nothing is blocked at
  admission, in-flight and concurrent runs can overshoot until the next pass.
  Harder Workflows execution rate-limits are the planned follow-up.
enabled: true
settings:
  timeout: "5m"
  concurrency:
    key: "significant-events-run-quota-enforce"
    strategy: drop
    max: 1
tags:
  - observability
  - streams
  - significant-events
  - run-quota
  - system

triggers:
  - type: scheduled
    with:
      every: "5m"
  - type: manual

steps:
  # All of the decision-making lives server-side: it needs the group -> engine
  # mapping and the record of what each engine pause disabled.
  - name: enforce_run_quotas
    type: kibana.request
    with:
      method: POST
      path: '/internal/significant_events/run_quotas/_enforce'
      headers:
        x-elastic-internal-origin: 'kibana'
    on-failure:
      continue: true
