version: "1"
name: "Significant Events Run Quota Enforce"
description: >
  Soft daily run-quota enforcer (good enough for now — not a hard admit-time
  limit). Counts usage via GET /run_quotas (backed by .workflows-executions) and
  pauses automation for any engine whose budget group is already exhausted.
  Concurrent / in-flight runs may overshoot until this workflow next ticks.
  Harder Workflows execution rate-limits are the planned follow-up.
enabled: true
settings:
  timeout: "5m"
  concurrency:
    key: "significant-events-run-quota-enforce"
    strategy: drop
    max: 1
tags:
  - observability
  - streams
  - significant-events
  - run-quota
  - system

triggers:
  - type: scheduled
    with:
      every: "5m"
  - type: manual

steps:
  - name: fetch_quotas
    type: kibana.request
    with:
      method: GET
      path: '/internal/significant_events/run_quotas'
      headers:
        x-elastic-internal-origin: 'kibana'
    on-failure:
      continue: false

  # One pause call per exhausted group. Pausing the same engine twice is
  # idempotent; context may fire twice (ki_extraction + memory) and that is fine.
  - name: pause_exhausted_engines
    type: foreach
    foreach: '${{ steps.fetch_quotas.output.groups | default: [] }}'
    iteration-on-failure:
      continue: true
    steps:
      - name: pause_engine
        type: kibana.request
        if: '${{ foreach.item.exhausted == true }}'
        with:
          method: POST
          path: '/internal/significant_events/maintenance/_pause'
          headers:
            x-elastic-internal-origin: 'kibana'
          body:
            engines:
              - '{{ foreach.item.engine }}'
            reason: 'run_quota'
        on-failure:
          continue: true
