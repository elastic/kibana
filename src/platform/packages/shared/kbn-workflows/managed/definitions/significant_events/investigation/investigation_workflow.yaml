version: '1'
name: Investigation
description: >
  Root cause analysis for an observability issue. One agent investigates using
  available signals — logs, traces, metrics, topology, and memory — then
  produces a structured root cause conclusion.
enabled: true
settings:
  timeout: '60m'
  concurrency:
    key: 'significant-events-investigation-{{ inputs.concurrency_key | default: execution.id }}'
    strategy: cancel-in-progress
    max: 1
tags:
  - observability
  - streams
  - significant-events
  - investigation

triggers:
  - type: manual
    inputs:
      properties:
        message:
          type: string
          description: Description of the issue or event to investigate.
        stream_names:
          type: array
          items:
            type: string
          description: Optional logical stream names to scope observability queries.
        context:
          type: object
          additionalProperties: true
          description: Optional structured context (e.g. discovery metadata when invoked from sigevents).
        concurrency_key:
          type: string
          description: Optional key for concurrency deduplication. Defaults to the workflow execution ID.
      required:
        - message
      additionalProperties: false

steps:
  # Records a pending investigation on the Significant Event as soon as the workflow starts,
  # so the UI can show an in-progress indicator before the agent step finishes.
  # Only runs when a sig-event context was supplied (discovery or chat-agent paths).
  - name: attach_pending_to_significant_event
    type: kibana.request
    if: '${{ inputs.context.event_uuid != null }}'
    with:
      method: POST
      path: '/internal/significant_events/events/{{ inputs.context.event_uuid }}/investigations'
      headers:
        x-elastic-internal-origin: 'kibana'
      body:
        workflow_execution_id: "{{ execution.id }}"
        started_at: '{{ execution.startedAt | date: "%Y-%m-%dT%H:%M:%S%:z" }}'
    on-failure:
      continue: true

  - name: investigate
    type: ai.agent
    agent-id: significant-events.investigation
    # Keep connector-id-by-feature/plugin-id/aggregate-by in sync with @kbn/significant-events-schema
    # inference_feature_ids.ts (SIGNIFICANT_EVENTS_INVESTIGATION_INFERENCE_FEATURE_ID /
    # SIGNIFICANT_EVENTS_INFERENCE_PARENT_FEATURE_ID).
    connector-id-by-feature: 'significant_events_investigation'
    plugin-id: 'significant_events_investigation'
    aggregate-by: 'significant_events'
    create-conversation: true
    public-conversation: true
    template-id: 'observability.nightshift.investigation'
    timeout: 1800s
    with:
      # Tag the agent execution with the workflow execution id so callers that already know
      # it (e.g. the UI, or the significant event this investigation is attached to) can look
      # up the agent execution's (auto-generated) id via findExecutions and follow its live
      # progress before this step returns.
      metadata:
        workflow_execution_id: "{{ execution.id }}"
      message: |
        Investigate the root cause of the following issue:

        {{ inputs.message }}

        {% if inputs.stream_names and inputs.stream_names.size > 0 %}
        Related streams:
        {% for stream in inputs.stream_names %}- {{ stream }}
        {% endfor %}
        {% endif %}
        {% if inputs.context %}
        Additional context: {{ inputs.context | json }}
        {% endif %}

        As you work, use the set_conversation_metadata tool to record structured findings:
        - At the start: set status = "in_progress" and an initial severity ("critical", "high", "medium", or "low") based on the signal.
        - As you identify affected services: set affected_services as an array of service names.
        - When you reach a conclusion (and again if you revise it), call set_conversation_metadata with all of the following at once:
          • summary: one concise paragraph describing what happened
          • conclusion: the mechanism/root-cause narrative as plain prose
          • hypotheses: the full hypotheses array (each entry has candidate, confidence, status, and optionally reason and evidence)
          • recommendations: the full recommendations array (each entry has title, and optionally description and code)
          • blind_spots: the full blind_spots array (each entry has title and description)
          • severity: final severity after analysis (update if your initial estimate was wrong)
          • affected_services: final list of impacted service names
        - At the end: set status = "resolved" if the issue has a clear fix or is self-correcting, or "false_positive" if the signal is not a real problem.
        Only set severity = "critical" or "high" if there is active user impact or confirmed data exposure.

        When you have completed the investigation, reply with exactly: "Investigation completed. Any followup questions?" All detailed structured data has already been recorded via set_conversation_metadata.
    on-failure:
      continue: true

  # Connects this investigation back to the Significant Event that triggered it, so the
  # UI can surface investigation history and link to the full RCA result, and — in the same
  # append-only version — applies any field changes the agent proposed via
  # `significant_event_updates` (severity/summary/status). Recording the completed investigation
  # and its reassessed fields as one write keeps the lifecycle to a single meaningful version
  # rather than two. Only runs when a sig-event context was supplied (i.e. the investigation was
  # triggered from discovery or from the chat agent for a specific event). Other callers (free-form
  # issues, alerts) that do not supply `inputs.context.event_uuid` are unaffected.
  #
  # The agent only *proposes* field changes; this deterministic step performs the write. Each
  # attribute the agent didn't reassess resolves to `undefined` (empty `first`) and is dropped from
  # the request; proposing the current value is a server-side no-op. `reason`/`evidence` stay in the
  # `investigate` structured output and are intentionally never forwarded to the event document —
  # the version records only the changed field values plus this execution's id as the audit trail.
  # `on-failure: continue` so a failed write never fails the overall workflow run.
  - name: attach_to_significant_event
    type: kibana.request
    if: '${{ inputs.context.event_uuid != null }}'
    with:
      method: POST
      path: '/internal/significant_events/events/{{ inputs.context.event_uuid }}/investigations'
      headers:
        x-elastic-internal-origin: 'kibana'
      body:
        workflow_execution_id: "{{ execution.id }}"
        started_at: '{{ execution.startedAt | date: "%Y-%m-%dT%H:%M:%S%:z" }}'
        completed_at: '{{ "now" | date: "%Y-%m-%dT%H:%M:%S%:z" }}'
        severity: "${{ steps.investigate.output.structured_output.significant_event_updates | default: [] | where: 'field', 'severity' | map: 'to' | first }}"
        summary: "${{ steps.investigate.output.structured_output.significant_event_updates | default: [] | where: 'field', 'summary' | map: 'to' | first }}"
        status: "${{ steps.investigate.output.structured_output.significant_event_updates | default: [] | where: 'field', 'status' | map: 'to' | first }}"
    on-failure:
      continue: true

  # Reconcile the gaps this investigation surfaced into the _gaps/overview memory
  # page. Deliberately minimal: a cheap model, memory read/write only, no auditing.
  # connector-id-by-feature: shared memory connector (SIGNIFICANT_EVENTS_MEMORY_INFERENCE_FEATURE_ID).
  # plugin-id: step-specific cost attribution; aggregate-by: SIGNIFICANT_EVENTS_INFERENCE_PARENT_FEATURE_ID.
  - name: merge_investigation_gaps
    type: ai.agent
    connector-id-by-feature: 'significant_events_memory'
    plugin-id: 'significant_events_memory_investigation_gaps'
    aggregate-by: 'significant_events'
    create-conversation: false
    timeout: 120s
    with:
      message: |
        Call load_skill with path skills/platform/streams/significant-events-memory to get the memory tools.

        {% if steps.investigate.output.structured_output.blind_spots %}
        The following knowledge gaps were identified during an investigation, as JSON objects each carrying a `title` (the missing data source, named concisely) and a `description` (why that gap mattered):

        {{ steps.investigate.output.structured_output.blind_spots | json }}

        Keep only gaps whose `title` is an actionable structural deficiency — a data source or access that is missing and could reasonably be provided (e.g. "No traces for the cart service", "No infrastructure metrics for host X", "No code repository access for service Y"). Discard incident-specific observations that just describe what happened during the outage (e.g. "the pod crashed", "no logs during the failure window").

        Read the current _gaps/overview page with platform_sig_events_memory_read. Compare the filtered gaps against it. If every gap is already reflected there, stop and write nothing. If there are genuinely new gaps, weave them into the existing sections (do not add a separate section) and save the page with platform_sig_events_memory_write using categories ["_system/gaps"].
        {% else %}
        No blind spots data was recorded for this investigation. Write nothing.
        {% endif %}
    on-failure:
      continue: true
