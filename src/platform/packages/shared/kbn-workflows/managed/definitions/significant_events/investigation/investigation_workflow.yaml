version: '1'
name: Investigation
description: >
  Root cause analysis for an observability issue. One agent investigates using
  available signals — logs, traces, metrics, topology, and memory — then
  produces a structured root cause conclusion.
enabled: true
settings:
  timeout: '60m'
  concurrency:
    key: 'significant-events-investigation-{{ inputs.concurrency_key | default: execution.id }}'
    strategy: cancel-in-progress
    max: 1
tags:
  - observability
  - streams
  - significant-events
  - investigation

triggers:
  - type: manual
    inputs:
      properties:
        message:
          type: string
          description: Description of the issue or event to investigate.
        stream_names:
          type: array
          items:
            type: string
          description: Optional data stream names to scope observability queries.
        context:
          type: object
          additionalProperties: true
          description: Optional structured context (e.g. discovery metadata when invoked from sigevents).
        concurrency_key:
          type: string
          description: Optional key for concurrency deduplication. Defaults to the workflow execution ID.
      required:
        - message
      additionalProperties: false

steps:
  # Records a pending investigation on the Significant Event as soon as the workflow starts,
  # so the UI can show an in-progress indicator before the agent step finishes.
  # Only runs when a sig-event context was supplied (triage or chat-agent paths).
  - name: attach_pending_to_significant_event
    type: kibana.request
    if: '${{ inputs.context.event_id != null }}'
    with:
      method: POST
      path: '/internal/significant_events/events/{{ inputs.context.event_id }}/investigations'
      headers:
        x-elastic-internal-origin: 'kibana'
      body:
        workflow_execution_id: "{{ execution.id }}"
        started_at: '{{ execution.startedAt | date: "%Y-%m-%dT%H:%M:%S%:z" }}'
    on-failure:
      continue: true

  - name: investigate
    type: ai.agent
    agent-id: platform.sig_events.investigation
    # Keep connector-id-by-feature/plugin-id/aggregate-by in sync with @kbn/significant-events-schema
    # inference_feature_ids.ts (SIGNIFICANT_EVENTS_INVESTIGATION_INFERENCE_FEATURE_ID /
    # SIGNIFICANT_EVENTS_INFERENCE_PARENT_FEATURE_ID).
    connector-id-by-feature: 'significant_events_investigation'
    plugin-id: 'significant_events_investigation'
    aggregate-by: 'significant_events'
    create-conversation: true
    with:
      timeout: 1800s
      # Tag the agent execution with the workflow execution id so callers that already know
      # it (e.g. the UI, or the significant event this investigation is attached to) can look
      # up the agent execution's (auto-generated) id via findExecutions and follow its live
      # progress before this step returns.
      metadata:
        workflow_execution_id: "{{ execution.id }}"
      message: |
        Investigate the root cause of the following issue:

        {{ inputs.message }}

        {% if inputs.stream_names and inputs.stream_names.size > 0 %}
        Data streams (use get_index_info to discover available fields in each):
        {% for stream in inputs.stream_names %}- {{ stream }}
        {% endfor %}
        {% endif %}
        {% if inputs.context %}
        Additional context: {{ inputs.context | json }}
        {% endif %}
      # Keep this in sync with investigationStateSchema in @kbn/significant-events-schema
      # (x-pack/platform/packages/shared/kbn-significant-events-schema/src/significant_events/investigation_state.ts)
      # — this is the same schema the investigation_progress_report tool streams live, so the
      # final structured output here must match exactly (including maxLength/maxItems: the UI
      # parses the persisted result with the zod schema and rejects anything over its limits).
      schema:
        type: object
        properties:
          summary:
            type: string
            maxLength: 10000
          hypotheses:
            type: array
            maxItems: 50
            items:
              type: object
              properties:
                candidate:
                  type: string
                  maxLength: 10000
                confidence:
                  type: number
                  minimum: 0
                  maximum: 1
                status:
                  type: string
                  enum: [investigating, dismissed, confirmed]
                reason:
                  type: string
                  maxLength: 10000
              required:
                - candidate
                - confidence
                - status
          conclusion:
            type: string
            maxLength: 10000
          gaps_found:
            type: array
            description: >
              Actionable knowledge gaps discovered during this investigation — data sources that were
              missing or inaccessible and would have helped diagnose the issue. Each item must be a
              concrete, actionable statement of missing data that could reasonably be provided, such as:
              "No traces available for the cart service", "Infrastructure metrics absent for host X",
              "No code repository access for service Y".
              Do NOT include incident-specific observations (e.g. "the pod crashed", "no logs during the
              outage window") — those are incident facts, not actionable knowledge gaps. Reduce the
              finding to what data source is missing and why it matters, not what happened during the incident.
            items:
              type: string
              maxLength: 10000
          tree:
            type: array
            maxItems: 200
            description: >
              The investigation trail: a decision tree of every step of the investigation in the
              order it happened — observations, hypotheses, actions, evidence, decisions, dead
              ends, and the conclusion — including branches that led nowhere. Every claim grounded
              in data must cite references; nodes may embed a small chart when a timeseries
              materially supports them.
            items:
              type: object
              properties:
                id:
                  type: string
                  maxLength: 255
                parent_id:
                  type: string
                  maxLength: 255
                kind:
                  type: string
                  enum: [observation, hypothesis, action, evidence, decision, dead_end, conclusion]
                title:
                  type: string
                  maxLength: 512
                detail:
                  type: string
                  maxLength: 10000
                status:
                  type: string
                  enum: [active, done, abandoned, confirmed, dismissed]
                references:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [query, ki, rule]
                      label:
                        type: string
                        maxLength: 512
                      esql:
                        type: string
                        maxLength: 10000
                      time_range:
                        type: object
                        properties:
                          from:
                            type: string
                            maxLength: 64
                          to:
                            type: string
                            maxLength: 64
                        required:
                          - from
                          - to
                      ki_name:
                        type: string
                        maxLength: 512
                      stream_name:
                        type: string
                        maxLength: 255
                      rule_name:
                        type: string
                        maxLength: 512
                      rule_uuid:
                        type: string
                        maxLength: 255
                    required:
                      - type
                chart:
                  type: object
                  properties:
                    title:
                      type: string
                      maxLength: 512
                    type:
                      type: string
                      enum: [line, bar]
                    unit:
                      type: string
                      maxLength: 255
                    series:
                      type: array
                      maxItems: 5
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            maxLength: 512
                          points:
                            type: array
                            maxItems: 120
                            items:
                              type: object
                              properties:
                                x:
                                  type: string
                                  maxLength: 64
                                y:
                                  type: number
                              required:
                                - x
                                - y
                        required:
                          - points
                    annotations:
                      type: array
                      maxItems: 10
                      items:
                        type: object
                        properties:
                          x:
                            type: string
                            maxLength: 64
                          label:
                            type: string
                            maxLength: 512
                        required:
                          - x
                          - label
                  required:
                    - type
                    - series
              required:
                - id
                - kind
                - title
          next_steps:
            type: array
            maxItems: 20
            description: >
              Structured recommended next steps, populated alongside the conclusion. Every
              actionable recommendation gets a `description`; a step additionally carries a
              `mitigation` proposal when it is backed by a mitigation workflow discovered via
              find_mitigation_workflows. Only propose a mitigation when the workflow genuinely
              addresses the confirmed root cause — never invent workflow ids.
            items:
              type: object
              properties:
                description:
                  type: string
                  maxLength: 10000
                mitigation:
                  type: object
                  description: >
                    A concrete proposal to run a mitigation workflow. `workflow_id` must be
                    copied verbatim from the find_mitigation_workflows tool result; `inputs`
                    must satisfy the workflow's declared trigger inputs. `confidence` is how
                    likely this mitigation resolves the issue; `risk` is its blast radius.
                  properties:
                    workflow_id:
                      type: string
                      maxLength: 255
                    workflow_name:
                      type: string
                      maxLength: 512
                    inputs:
                      type: object
                      propertyNames:
                        type: string
                    rationale:
                      type: string
                      maxLength: 10000
                    confidence:
                      type: string
                      enum: [low, medium, high]
                    risk:
                      type: string
                      enum: [low, medium, high]
                  required:
                    - workflow_id
                    - confidence
                    - risk
              required:
                - description
        required:
          - summary
          - hypotheses
    on-failure:
      continue: true

  # Connects this investigation back to the Significant Event that triggered it, so the
  # UI can surface investigation history and link to the full RCA result. Only runs when
  # a sig-event context was supplied (i.e. the investigation was triggered from triage or
  # from the chat agent for a specific event). Other callers (free-form issues, alerts)
  # that do not supply `inputs.context.event_id` are unaffected.
  - name: attach_to_significant_event
    type: kibana.request
    if: '${{ inputs.context.event_id != null }}'
    with:
      method: POST
      path: '/internal/significant_events/events/{{ inputs.context.event_id }}/investigations'
      headers:
        x-elastic-internal-origin: 'kibana'
      body:
        workflow_execution_id: "{{ execution.id }}"
        started_at: '{{ execution.startedAt | date: "%Y-%m-%dT%H:%M:%S%:z" }}'
        completed_at: '{{ "now" | date: "%Y-%m-%dT%H:%M:%S%:z" }}'
    on-failure:
      continue: true

  # ── Mitigation phase ──────────────────────────────────────────────────────────
  # Runs after the terminal attach so the investigation itself settles promptly for the
  # UI; every decision made here is recorded on the event via the append route below.

  # Fetch the curated mitigation workflows (tag: mitigation) so the auto-run gate can
  # compare each proposal against the workflow's own policy (metadata.mitigation).
  - name: fetch_mitigation_workflows
    type: kibana.request
    if: '${{ inputs.context.event_id != null and steps.investigate.output.structured_output.next_steps != null }}'
    with:
      method: GET
      path: '/api/workflows'
      query:
        tags: 'mitigation'
      headers:
        x-elastic-internal-origin: 'kibana'
    on-failure:
      continue: true

  # The auto-run gate: a deliberately tool-less agent call that judges, per proposed
  # mitigation, whether the investigation outcome clears the workflow's own thresholds.
  # It can only choose between auto_run / suggested / rejected — it cannot execute anything.
  - name: decide_mitigations
    type: ai.agent
    connector-id-by-feature: 'significant_events_triage'
    plugin-id: 'significant_events_investigation'
    aggregate-by: 'significant_events'
    create-conversation: false
    if: '${{ steps.fetch_mitigation_workflows.output.results != null and steps.fetch_mitigation_workflows.output.results.size > 0 }}'
    with:
      timeout: 300s
      message: |
        You are an automated change-safety gate. An investigation has concluded and proposed
        running one or more curated mitigation workflows. For EACH proposal below, decide:

        - "auto_run" — ONLY when ALL of these hold for the matching workflow (same id):
          1. the workflow's auto-run policy has auto_run: true;
          2. the proposal's confidence is at or above the policy's min_confidence (low < medium < high);
          3. the proposal's risk is at or below the policy's max_risk (low < medium < high);
          4. the policy's guardrail text (if any) is satisfied by the investigation conclusion;
          5. the proposal's inputs satisfy the workflow's declared trigger inputs.
        - "suggested" — the mitigation looks appropriate but does not clear the auto-run bar;
          a human should trigger it.
        - "rejected" — the mitigation does not fit the confirmed root cause, its inputs look
          wrong, or running it would be unsafe.

        Judge strictly: when in doubt, "suggested" over "auto_run", and "rejected" over
        "suggested". Copy workflow_id, workflow_name, and inputs VERBATIM from the proposal.
        Give a one-sentence reason for every decision. If a proposal references a workflow id
        that is not in the list below, reject it.

        ONLY judge proposals that carry a mitigation with a workflow_id — skip proposals that
        are plain recommendations without one (do NOT emit a decision for them). If no proposal
        carries a mitigation, return an empty decisions array.

        Proposed mitigations:
        {{ steps.investigate.output.structured_output.next_steps | json }}

        Investigation conclusion:
        {{ steps.investigate.output.structured_output.conclusion }}

        Available mitigation workflows (id, auto-run policy, trigger inputs):
        {% for wf in steps.fetch_mitigation_workflows.output.results %}
        - id: {{ wf.id }} | name: {{ wf.name }} | description: {{ wf.description }} | auto_run_policy: {{ wf.definition.metadata.mitigation | json }} | trigger_inputs: {{ wf.definition.triggers | json }}
        {% endfor %}
      schema:
        type: object
        properties:
          decisions:
            type: array
            maxItems: 20
            items:
              type: object
              properties:
                workflow_id:
                  type: string
                  maxLength: 255
                workflow_name:
                  type: string
                  maxLength: 512
                inputs:
                  type: object
                  propertyNames:
                    type: string
                decision:
                  type: string
                  enum: [auto_run, suggested, rejected]
                reason:
                  type: string
                  maxLength: 10000
              required:
                - workflow_id
                - decision
                - reason
        required:
          - decisions
    on-failure:
      continue: true

  # Trigger the approved mitigations (fire-and-forget — the run route returns the execution
  # id immediately) and record EVERY decision on the event's investigation pointer, so the
  # UI can show what was auto-run, what is merely suggested, and what was rejected and why.
  - name: process_mitigation_decisions
    type: foreach
    if: '${{ steps.decide_mitigations.output.structured_output.decisions != null }}'
    foreach: '{{ steps.decide_mitigations.output.structured_output.decisions | json }}'
    steps:
      - name: run_mitigation
        type: kibana.request
        if: '${{ foreach.item.decision == "auto_run" }}'
        with:
          method: POST
          path: '/api/workflows/workflow/{{ foreach.item.workflow_id }}/run'
          headers:
            x-elastic-internal-origin: 'kibana'
          body:
            inputs: '${{ foreach.item.inputs }}'
        on-failure:
          continue: true
      # Keep the path in sync with the eventsAppendMitigationRunRoute in the
      # significant_events plugin. execution_id renders empty when run_mitigation was
      # skipped or failed — the route treats that as "not triggered".
      - name: record_mitigation_decision
        type: kibana.request
        with:
          method: POST
          path: '/internal/significant_events/events/{{ inputs.context.event_id }}/investigations/{{ execution.id }}/mitigation_runs'
          headers:
            x-elastic-internal-origin: 'kibana'
          body:
            workflow_id: '{{ foreach.item.workflow_id }}'
            workflow_name: '{{ foreach.item.workflow_name }}'
            decision: '{{ foreach.item.decision }}'
            reason: '{{ foreach.item.reason }}'
            execution_id: '${{ steps.run_mitigation.output.workflowExecutionId }}'
        on-failure:
          continue: true

  # Reconcile the gaps this investigation surfaced into the _gaps/overview memory
  # page. Deliberately minimal: a cheap model, memory read/write only, no auditing.
  # Keep connector-id-by-feature in sync with @kbn/significant-events-schema
  # inference_feature_ids.ts (SIGNIFICANT_EVENTS_MEMORY_INFERENCE_FEATURE_ID).
  - name: merge_investigation_gaps
    type: ai.agent
    connector-id-by-feature: 'significant_events_memory'
    create-conversation: false
    with:
      timeout: 120s
      message: |
        Call load_skill with path skills/platform/streams/significant-events-memory to get the memory tools.

        The following knowledge gaps were identified during an investigation:

        {{ steps.investigate.output.structured_output.gaps_found | json }}

        Keep only gaps that are actionable structural deficiencies — a data source or access that is missing and could reasonably be provided (e.g. "No traces for the cart service", "No infrastructure metrics for host X", "No code repository access for service Y"). Discard incident-specific observations that just describe what happened during the outage (e.g. "the pod crashed", "no logs during the failure window").

        Read the current _gaps/overview page with platform_sig_events_memory_read. Compare the filtered gaps against it. If every gap is already reflected there, stop and write nothing. If there are genuinely new gaps, weave them into the existing sections (do not add a separate section) and save the page with platform_sig_events_memory_write using categories ["_system/gaps"].
    on-failure:
      continue: true
