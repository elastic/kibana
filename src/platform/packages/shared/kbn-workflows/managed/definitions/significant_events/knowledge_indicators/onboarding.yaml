# KI Onboarding Workflow
#
# Orchestrates the full KI onboarding pipeline for a source:
#   1. Features recency check (auto-skips identification if features are recent)
#   2. Features identification (optional, skippable)
#   3. Queries generation (conditional — skipped when no new features were found)

version: "1"
name: "KI Onboarding"
enabled: true
description: "Orchestrates KI feature identification and query generation for a stream."
tags:
  - observability
  - streams
  - knowledge-indicators
  - onboarding
settings:
  timeout: "30m"
  concurrency:
    key: "nightshift-source-onboarding-{{ inputs.sourceSlug }}:{{ inputs.sourceId }}"
    strategy: drop
    max: 1
triggers:
  - type: manual
    inputs:
      - name: sourceId
        type: string
        required: true
        description: "Target source id."
      - name: sourceRevision
        type: string
        required: true
        description: "Source query revision used by this onboarding run."
      - name: sourceSlug
        type: string
        required: true
        description: "Slug of the target source. Together with the source id it keys concurrency."
      - name: sourceType
        type: string
        required: true
        description: "Type of the target source."
      - name: metricsEntitiesEnabled
        type: boolean
        default: false
        description: "Run deterministic entity extraction for a metrics source."
      - name: skipFeatures
        type: boolean
        default: false
        description: "Skip the features identification step."
      - name: skipQueries
        type: boolean
        default: false
        description: "Skip the queries generation step."
      - name: featuresConnectorId
        type: string
        description: "Optional connector ID override for features identification."
      - name: queriesConnectorId
        type: string
        description: "Optional connector ID override for queries generation."
      - name: featuresStart
        type: number
        description: "Start timestamp (epoch ms) for feature sampling window. Defaults to 24 h ago."
      - name: featuresEnd
        type: number
        description: "End timestamp (epoch ms) for feature sampling window. Defaults to now."
      - name: featuresMaxIterations
        type: number
        default: 5
        description: "Maximum number of LLM sampling iterations for features identification."
      - name: featuresConvergencePatience
        type: number
        default: 2
        description: "Stop features identification after this many healthy-successful passes without a new feature (degraded iterations are neutral and not counted)."
      - name: featuresSampleSize
        type: number
        default: 20
        description: "Number of documents sampled per features identification iteration."
      - name: featuresTtlDays
        type: number
        description: "Days before a KI feature expires."
      - name: featuresEntityFilteredRatio
        type: number
        default: 0.4
        description: "Fraction (0–1) of sample for entity-filtered documents in features identification."
      - name: featuresDiverseRatio
        type: number
        default: 0.4
        description: "Fraction (0–1) of sample for diverse documents in features identification."
      - name: featuresMaxExcludedInPrompt
        type: number
        default: 10
        description: "Max excluded features sent in LLM prompt during features identification."
      - name: featuresMaxEntityFilters
        type: number
        default: 10
        description: "Max entity filters applied during features identification sampling."
      - name: featuresSamplingTimeoutMs
        type: number
        default: 60000
        description: "Deadline (ms) per ES|QL sampling query during features identification sampling."
      - name: featuresComputedTimeoutMs
        type: number
        default: 60000
        description: "Deadline (ms) for the whole computed-feature generation pass during features identification."
      - name: featuresMaxPreviouslyIdentified
        type: number
        description: "Max previously identified features sent in LLM prompt during features identification."
      - name: featuresRecencyThresholdHours
        type: number
        default: 12
        description: "Skip features identification if features were identified within this many hours."
      - name: queriesMaxExistingForContext
        type: number
        description: "Max existing queries for LLM context in query generation."
      - name: rootTriggeredBy
        type: string
        required: false
        description: "Root workflow trigger type propagated by a managed driver."
steps:
  - name: check_budget
    type: kibana.request
    if: '${{ inputs.rootTriggeredBy == "scheduled" }}'
    with:
      method: POST
      path: '/s/{{ workflow.spaceId }}/internal/significant_events/run_quotas/_consume'
      body:
        group: 'ki_extraction'
      headers:
        x-elastic-internal-origin: 'kibana'
        x-nightshift-source-revision: "{{ inputs.sourceRevision }}"
    timeout: '10s'
    on-failure:
      continue: true

  - name: exit_if_budget_denied
    type: if
    condition: '${{ steps.check_budget.output.allowed == false }}'
    steps:
      - name: output_budget_denied
        type: workflow.output
        status: cancelled
        with:
          sourceId: '${{ inputs.sourceId }}'
          featuresSkipped: true
          featuresConnectorUsed: ''
          discoveredFeatures: []
          featuresTokensUsed: { prompt: 0, completion: 0, total: 0 }
          queriesSkipped: true
          queriesConnectorUsed: ''
          persistedQueries: []
          queriesTokensUsed: { prompt: 0, completion: 0, total: 0 }
          metricsEntitiesCount: 0
          metricsEntitiesUncoveredDataStreamsCount: 0
          metricsEntitiesDroppedOwnerlessRows: 0
          metricsEntitiesHandled: false
          metricsEntitiesSkipReason: ''
          keepAliveRefreshed: 0

  # -----------------------------------------------------------------------
  # Step 0: Initialize variables.
  # -----------------------------------------------------------------------
  - name: init
    type: data.set
    with:
      discoveredFeatures: []
      generatedQueries: []
      persistedQueries: []
      skipFeatures: "${{ inputs.skipFeatures }}"
      skipQueries: "${{ inputs.skipQueries }}"
      featuresTokensUsed: {}
      queriesTokensUsed: {}
      featuresConnectorUsed: ""
      queriesConnectorUsed: ""
      metricsEntitiesCount: 0
      metricsEntitiesUncoveredDataStreamsCount: 0
      metricsEntitiesDroppedOwnerlessRows: 0
      metricsEntitiesHandled: false
      metricsEntitiesSkipReason: ""
      cycleStartedAt: '{{ "now" | date: "%Y-%m-%dT%H:%M:%S.000Z" }}'

  - name: run_metrics_source_onboarding
    type: if
    condition: '${{ inputs.sourceType == "metrics" and inputs.metricsEntitiesEnabled == true }}'
    steps:
      - name: run_metrics_entities
        type: kibana.request
        with:
          method: POST
          path: "/s/{{ workflow.spaceId }}/internal/streams/{{ inputs.sourceId }}/features/_identify/metrics_entities"
          headers:
            x-elastic-internal-origin: "kibana"
            x-nightshift-source-revision: "{{ inputs.sourceRevision }}"
        on-failure:
          continue: true
      - name: save_metrics_entities_output
        type: data.set
        with:
          metricsEntitiesCount: "${{ steps.run_metrics_entities.output.metricsEntitiesCount | default: 0 }}"
          metricsEntitiesUncoveredDataStreamsCount: "${{ steps.run_metrics_entities.output.uncoveredDataStreamsCount | default: 0 }}"
          metricsEntitiesDroppedOwnerlessRows: "${{ steps.run_metrics_entities.output.droppedRows.ownerless | default: 0 }}"
          metricsEntitiesHandled: >-
            ${{ steps.run_metrics_entities.error != null
              or steps.run_metrics_entities.output.handled != false }}
          metricsEntitiesSkipReason: "${{ steps.run_metrics_entities.output.skipReason | default: '' }}"
      - name: set_metrics_skips
        type: if
        condition: "${{ variables.metricsEntitiesHandled == true }}"
        steps:
          - name: skip_metrics_features_and_queries
            type: data.set
            with:
              skipFeatures: true
              skipQueries: true

  - name: run_source_onboarding
    type: if
    condition: >-
      ${{ inputs.sourceType != "metrics"
        or inputs.metricsEntitiesEnabled != true
        or variables.metricsEntitiesHandled == false }}
    steps:
      - name: check_should_identify
        type: if
        condition: "${{ variables.skipFeatures == false and inputs.skipQueries == false }}"
        steps:
          - name: should_identify
            type: kibana.request
            with:
              method: GET
              path: "/s/{{ workflow.spaceId }}/internal/streams/{{ inputs.sourceId }}/features/_should_identify?thresholdHours={{ inputs.featuresRecencyThresholdHours }}"
              headers:
                x-elastic-internal-origin: "kibana"
                x-nightshift-source-revision: "{{ inputs.sourceRevision }}"
          - name: skip_if_recent
            type: if
            condition: "${{ steps.should_identify.output.shouldIdentify == false }}"
            steps:
              - name: set_skip_features
                type: data.set
                with:
                  skipFeatures: true

      - name: run_features
        type: if
        condition: "${{ variables.skipFeatures == false }}"
        steps:
          - name: identify_features
            type: workflow.execute
            with:
              workflow-id: "system-streams-ki-features-identification"
              inputs:
                sourceId: "${{ inputs.sourceId }}"
                sourceSlug: "${{ inputs.sourceSlug }}"
                sourceRevision: "${{ inputs.sourceRevision }}"
                connectorId: "${{ inputs.featuresConnectorId }}"
                start: "${{ inputs.featuresStart }}"
                end: "${{ inputs.featuresEnd }}"
                maxIterations: "${{ inputs.featuresMaxIterations }}"
                convergencePatience: "${{ inputs.featuresConvergencePatience }}"
                sampleSize: "${{ inputs.featuresSampleSize }}"
                featureTtlDays: "${{ inputs.featuresTtlDays }}"
                entityFilteredRatio: "${{ inputs.featuresEntityFilteredRatio }}"
                diverseRatio: "${{ inputs.featuresDiverseRatio }}"
                maxExcludedFeaturesInPrompt: "${{ inputs.featuresMaxExcludedInPrompt }}"
                maxEntityFilters: "${{ inputs.featuresMaxEntityFilters }}"
                samplingTimeoutMs: "${{ inputs.featuresSamplingTimeoutMs }}"
                computedFeaturesTimeoutMs: "${{ inputs.featuresComputedTimeoutMs }}"
                maxPreviouslyIdentifiedFeatures: "${{ inputs.featuresMaxPreviouslyIdentified }}"
          - name: save_features_output
            type: data.set
            with:
              discoveredFeatures: "${{ steps.identify_features.output.discoveredFeatures }}"
              featuresTokensUsed: "${{ steps.identify_features.output.tokensUsed }}"
              featuresConnectorUsed: "${{ steps.identify_features.output.connectorId }}"

      - name: check_should_generate_queries
        type: if
        condition: "${{ inputs.skipFeatures == false and variables.discoveredFeatures.size == 0 }}"
        steps:
          - name: set_skip_queries
            type: data.set
            with:
              skipQueries: true

      - name: run_queries
        type: if
        condition: "${{ variables.skipQueries == false }}"
        steps:
          - name: generate_queries
            type: workflow.execute
            with:
              workflow-id: "system-streams-ki-queries-generation"
              inputs:
                sourceId: "${{ inputs.sourceId }}"
                sourceSlug: "${{ inputs.sourceSlug }}"
                sourceRevision: "${{ inputs.sourceRevision }}"
                connectorId: "${{ inputs.queriesConnectorId }}"
                maxExistingQueriesForContext: "${{ inputs.queriesMaxExistingForContext }}"
          - name: save_queries_output
            type: data.set
            with:
              generatedQueries: "${{ steps.generate_queries.output.queries }}"
              persistedQueries: "${{ steps.generate_queries.output.persistedQueries }}"
              queriesTokensUsed: "${{ steps.generate_queries.output.tokensUsed }}"
              queriesConnectorUsed: "${{ steps.generate_queries.output.connectorId }}"

  # -----------------------------------------------------------------------
  # Step 5: Keep-alive — re-stamp persistent KIs (durable ones, plus excluded
  #         features whose exclusion must be remembered) not refreshed this
  #         cycle so DSL retention does not physically delete them.
  # -----------------------------------------------------------------------
  - name: keep_alive_persistent
    type: kibana.request
    with:
      method: POST
      path: "/s/{{ workflow.spaceId }}/internal/streams/{{ inputs.sourceId }}/knowledge_indicators/_keep_alive"
      headers:
        x-elastic-internal-origin: "kibana"
        x-nightshift-source-revision: "{{ inputs.sourceRevision }}"
      body:
        lastRefreshedBefore: "${{ variables.cycleStartedAt }}"

  # -----------------------------------------------------------------------
  # Step 6: Output summary
  # -----------------------------------------------------------------------
  - name: output_result
    type: workflow.output
    with:
      sourceId: "${{ inputs.sourceId }}"
      featuresSkipped: "${{ variables.skipFeatures }}"
      featuresConnectorUsed: "${{ variables.featuresConnectorUsed }}"
      discoveredFeatures: "${{ variables.discoveredFeatures }}"
      featuresTokensUsed: "${{ variables.featuresTokensUsed }}"
      queriesSkipped: "${{ variables.skipQueries }}"
      queriesConnectorUsed: "${{ variables.queriesConnectorUsed }}"
      persistedQueries: "${{ variables.persistedQueries }}"
      queriesTokensUsed: "${{ variables.queriesTokensUsed }}"
      metricsEntitiesCount: "${{ variables.metricsEntitiesCount }}"
      metricsEntitiesUncoveredDataStreamsCount: "${{ variables.metricsEntitiesUncoveredDataStreamsCount }}"
      metricsEntitiesDroppedOwnerlessRows: "${{ variables.metricsEntitiesDroppedOwnerlessRows }}"
      metricsEntitiesHandled: "${{ variables.metricsEntitiesHandled }}"
      metricsEntitiesSkipReason: "${{ variables.metricsEntitiesSkipReason }}"
      keepAliveRefreshed: "${{ steps.keep_alive_persistent.output.refreshed }}"
