version: "1"
name: Attack Discovery Worker
description: >
  Runs Attack Discovery on demand for the Watch Floor: retrieves recent security
  alerts, generates discoveries with an LLM, and persists them to the shared
  ad-hoc Attack Discovery index. The Watch Floor orchestrator owns the schedule
  and invokes this worker via workflow.execute on each scheduled tick.
enabled: true
tags:
  - security
  - watch-floor
  - attack-discovery
settings:
  # Overlapping scheduled ticks would stack redundant AD generations, so drop a
  # new run while one is already in flight.
  concurrency:
    key: watch-floor-attack-discovery
    strategy: drop
    max: 1
triggers:
  - type: manual
    inputs:
      properties:
        connector_id:
          type: string
          description: >
            LLM connector UUID used for generation. When omitted, the server
            resolves the configured default AI connector.
        size:
          type: number
          default: 100
          description: Maximum number of alerts to retrieve for the run.
        start:
          type: string
          default: now-24h
          description: Alert retrieval window start (Elasticsearch date math).
        end:
          type: string
          default: now
          description: Alert retrieval window end (Elasticsearch date math).
        filter:
          type: object
          additionalProperties: true
          description: Optional Elasticsearch DSL filter applied during alert retrieval.
      additionalProperties: false
outputs:
  - name: discovery_count
    type: number
  - name: execution_uuid
    type: string
  - name: status
    type: string
  - name: investigation_conversation_id
    type: string
steps:
  # Kick off the full pipeline (retrieve -> generate -> validate -> persist) in
  # async mode so the step returns an execution_uuid immediately. Running via the
  # workflow (non-alerting) path persists to the shared ad-hoc AD index and
  # creates no alerting rule / Attacks-page schedule.
  - name: run_attack_discovery
    type: security.attack-discovery.run
    timeout: "10m"
    with:
      connector_id: "{{ inputs.connector_id }}"
      alert_retrieval_mode: custom_query
      mode: async
      size: "${{ inputs.size }}"
      start: "{{ inputs.start }}"
      end: "{{ inputs.end }}"
      filter: "${{ inputs.filter }}"

  # Generation runs longer than the run step's soft deadline, so poll the
  # event-log-backed status by execution_uuid until it leaves the running state.
  # `not_found` is also transient right after launch (the event log lags), so we
  # keep polling through it; the iteration bound (40 x 15s = 10m) caps the wait.
  - name: poll_status
    type: while
    condition: >-
      ${{ steps.check_status.output.status == 'running'
        or steps.check_status.output.status == 'not_found' }}
    max-iterations:
      limit: 40
      on-limit: continue
    steps:
      - name: wait_before_poll
        type: wait
        with:
          duration: "15s"
      - name: check_status
        type: security.attack-discovery.status
        with:
          execution_uuid: "{{ steps.run_attack_discovery.output.execution_uuid }}"

  # Re-read once outside the loop so the terminal status and discoveries are
  # available at a stable top-level step reference for the steps below.
  - name: final_status
    type: security.attack-discovery.status
    with:
      execution_uuid: "{{ steps.run_attack_discovery.output.execution_uuid }}"

  - name: write_investigation
    type: ai.agent
    if: >-
      ${{ steps.final_status.output.status == 'succeeded'
        and steps.final_status.output.discovery_count > 0 }}
    timeout: "10m"
    create-conversation: true
    with:
      message: >
        Summarize the Attack Discoveries below into a concise investigation
        brief for a Tier-1 analyst: the likely attack narrative, the entities
        involved, and the immediate next steps to verify or contain it.

        Attack Discoveries:
        {{ steps.final_status.output.attack_discoveries | json }}

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      discovery_count: "${{ steps.final_status.output.discovery_count | default: 0 }}"
      execution_uuid: "{{ steps.run_attack_discovery.output.execution_uuid }}"
      status: "{{ steps.final_status.output.status }}"
      investigation_conversation_id: "{{ steps.write_investigation.output.conversation_id }}"
