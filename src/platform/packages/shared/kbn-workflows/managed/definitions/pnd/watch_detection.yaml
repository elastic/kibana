version: "1"
name: Detection Watch
description: >
  Runs detection engineering work by dispatching to one worker per run: rule tuning by
  default, or rule creation when a caller supplies a detection gap.
enabled: false
tags:
  - watch
  - watch-detection
settings:
  # Keyed by technique so a pending creation approval cannot block the sweep, and two
  # gaps for different techniques can be worked at once.
  concurrency:
    key: "detection-watch-{{ inputs.technique | default: 'sweep' }}"
    strategy: drop
    max: 1
triggers:
  # Per-space Detection Watch owns the tuning cadence and dispatches the global
  # worker. Its suffixed document id keeps scheduler tasks isolated by space.
  - type: scheduled
    with:
      every: "2h"
  - type: manual
    inputs:
      properties:
        source_watch:
          type: string
          description: Watch that produced the detection gap.
        run_id:
          type: string
          description: Producing workflow execution id.
        technique:
          type: string
          description: >
            MITRE ATT&CK technique id for a new rule. Supplying it switches the run
            from rule tuning to rule creation.
        gap_description:
          type: string
          description: Detection gap the new rule should cover.
        evidence:
          type: string
          description: Hunt findings or event examples supporting the gap.
        confidence:
          type: number
          description: Confidence in the detection gap from 0 to 1.
      additionalProperties: false
consts:
  watch_policy:
    settingsVersion: __WATCH_SETTINGS_VERSION__
    # Persisted plumbing only; runtime autonomy semantics are defined separately.
    autonomy: "__WATCH_AUTONOMY_LEVEL__"
    mandate: Detection engineering
    ui:
      color: "#e7664c"
      order: 50
    config:
      previewInvocationCount: 2
    callables:
      - id: system-security-rule-tuning
        name: Rule Tuning Worker
        kind: workflow
        summary: Diagnose noisy rules and apply approved query changes
        gated: true
        enabled: true
      - id: system-security-rule-creation
        name: Rule Creation Worker
        kind: workflow
        summary: Draft an ES|QL rule for a detection gap and create it on approval
        gated: true
        enabled: true
steps:
  # A supplied technique means a caller wants one rule drafted; anything else is
  # the tuning sweep. Exactly one worker runs per execution.
  - name: select_worker
    type: data.set
    with:
      worker: "{% if inputs.technique and inputs.technique != '' %}creation{% else %}tuning{% endif %}"

  # An explicit branch, so the two workers cannot both run even if one condition is
  # ever authored wrong.
  - name: dispatch_worker
    type: if
    condition: "${{ steps.select_worker.output.worker == 'tuning' }}"
    steps:
      # Tuning thresholds (FP count, FP rate, analysis window) live as consts on the
      # worker itself; the watch only forwards the preview depth it also hands to
      # rule creation.
      - name: run_rule_tuning
        type: workflow.execute
        with:
          workflow-id: system-security-rule-tuning
          inputs:
            preview_invocation_count: "${{ consts.watch_policy.config.previewInvocationCount }}"
    else:
      - name: run_rule_creation
        type: workflow.execute
        with:
          workflow-id: system-security-rule-creation
          inputs:
            technique: "{{ inputs.technique }}"
            gap_description: "{{ inputs.gap_description }}"
            evidence: "{{ inputs.evidence }}"
            confidence: "${{ inputs.confidence }}"
            preview_invocation_count: "${{ consts.watch_policy.config.previewInvocationCount }}"
