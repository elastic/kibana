version: "1"
name: Detection Rule Tuning Proposal
description: >
  Diagnoses one rule whose alerts analysts closed as false positives, parks on its own
  approval gate, and applies an approved query change. Launched per rule by the rule
  tuning sweep so every proposal's gate can be pending at the same time.
enabled: true
tags:
  - security
  - detection-rule-tuning
settings:
  # Keyed per rule so a later sweep cannot open a second gate for a rule whose
  # proposal is still pending: alerts are only tagged after the gate resolves,
  # so the harvest keeps returning such a rule until then.
  concurrency:
    key: "rule-tuning-proposal-{{ inputs.rule_id }}"
    strategy: drop
    max: 1
triggers:
  - type: manual
    inputs:
      properties:
        rule_uuid:
          type: string
          maxLength: 512
          description: Saved-object id of the rule incarnation that produced the alerts.
        rule_id:
          type: string
          maxLength: 512
          description: Public rule_id used to fetch the rule from the detection engine API.
        fp_count:
          type: integer
          minimum: 2
          description: Unreviewed false-positive alerts that put the rule in the sweep.
        last_fp_at:
          type: string
          format: date-time
          maxLength: 64
          description: Timestamp of the newest false positive; anchors both backtest previews.
        alert_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
            maxLength: 512
          description: >-
            Document ids of the harvested false positives. The agent retrieves these by
            id to ground the diagnosis; they are tagged once the gate resolves.
        analysis_window_days:
          type: integer
          minimum: 1
          maximum: 30
          description: Days of alerts the sweep analyzed. Shown to the diagnosing agent.
        preview_invocation_count:
          type: integer
          minimum: 1
          maximum: 10
          description: Rule executions each backtest preview simulates.
        parent_run_id:
          type: string
          maxLength: 128
          description: >-
            Execution id of the sweep that launched this proposal. Recorded for
            traceability only; no step reads it. Empty on a standalone run.
      # Only the rule identity and alert evidence are required. The operational
      # parameters default from consts so the sweep and this workflow can upgrade
      # independently without a one-sided input-validation failure.
      required:
        - rule_uuid
        - rule_id
        - fp_count
        - last_fp_at
        - alert_ids
      additionalProperties: false
outputs:
  - name: rule_id
    type: string
  - name: approved
    type: boolean
  - name: applied
    type: boolean
consts:
  # Fallbacks for the optional operational inputs; keep in sync with the sweep's
  # consts in rule_tuning.yaml.
  analysis_window_days: 14
  preview_invocation_count: 2
  # Written onto every alert that reached a decision, and filtered out by the sweep's
  # harvest (consts.reviewed_tag in rule_tuning.yaml must match the shared
  # detection-watch:tuning-reviewed entry), so a later sweep cannot rediagnose the
  # same alerts into the same proposal.
  dismissed_tags:
    - detection-watch:tuning-reviewed
    - detection-watch:tuning-dismissed
  applied_tags:
    - detection-watch:tuning-reviewed
    - detection-watch:tuning-applied
  handoff_tags:
    - detection-watch:tuning-reviewed
    - detection-watch:tuning-handoff
  no_items: []
steps:
  - name: fetch_rule
    type: kibana.request
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules?rule_id={{ inputs.rule_id | url_encode }}"
      headers:
        kbn-xsrf: string
        elastic-api-version: "2023-10-31"
        Content-Type: application/json
    on-failure:
      continue: true

  - name: diagnose_rule
    type: ai.agent
    if: >-
      ${{ steps.fetch_rule.error == null
        and steps.fetch_rule.output.enabled == true
        and steps.fetch_rule.output.id == inputs.rule_uuid }}
    timeout: "10m"
    create-conversation: true
    with:
      # The 100-id cap must match ALERTS_BY_IDS_MAX in the security_solution skill
      # (investigate_rule_skill.ts), the most ids one get_alerts_by_ids call accepts.
      message: |-
        Use the [/investigate-rule](skill://investigate-rule) skill to investigate
        rule_id "{{ inputs.rule_id }}" ({{ steps.fetch_rule.output.name }}).

        {{ inputs.fp_count }} alerts from this rule were closed as false positives
        during the last {{ inputs.analysis_window_days | default: consts.analysis_window_days }} days. Their document ids
        {%- if inputs.alert_ids.size > 100 %} (first 100 of {{ inputs.alert_ids.size }}){%- endif %}:
        ["{{ inputs.alert_ids | slice: 0, 100 | join: '", "' }}"]

        Retrieve exactly these alerts with the investigate-rule.get_alerts_by_ids
        tool, passing the rule's investigation_fields as additional_fields, and use
        them as the confirmed false positives grounding the diagnosis; do not
        re-derive the closed set. Return one structured tuning proposal.

        Run the alert queries with time_window_hours set to
        {{ inputs.analysis_window_days | default: consts.analysis_window_days | times: 24 | at_most: 168 }} — the analysis
        window above, capped at the tool maximum. The false-positive ids span the
        full {{ inputs.analysis_window_days | default: consts.analysis_window_days }} days, so call out any totals that
        cover a shorter window than the ids.

        This pipeline backtests and applies query changes directly, so prefer
        change_type "query": narrow the KQL to exclude the confirmed benign
        pattern while keeping detection coverage. Pick exception, suppression, or
        threshold only when narrowing the query is genuinely unsafe for this rule,
        since those stay manual analyst actions. This rule has type
        "{{ steps.fetch_rule.output.type }}", so propose a query change only when
        that type is "query".
      schema:
        type: object
        properties:
          change_type:
            type: string
            enum: [exception, suppression, query, threshold]
          summary:
            type: string
          current_query:
            type: string
          proposed_query:
            type: string
          exception_condition:
            type: string
          rekey_required:
            type: boolean
        required: [change_type, summary, current_query, proposed_query, exception_condition, rekey_required]

  # Keep both previews in this execution. Consecutive synchronous child workflows
  # share one immediate-resume task and can strand the proposal in waiting_for_child.
  # Both previews end at the last false positive so the rule's lookback covers the
  # events analysts judged; anchoring at now can miss those events.
  - name: preview_current_rule
    type: kibana.request
    if: >-
      ${{ steps.diagnose_rule.output.structured_output.change_type == 'query'
        and steps.diagnose_rule.output.structured_output.proposed_query != ''
        and steps.fetch_rule.output.type == 'query' }}
    with:
      method: POST
      path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules/preview"
      headers:
        kbn-xsrf: string
        elastic-api-version: "2023-10-31"
        Content-Type: application/json
      body:
        type: query
        name: "{{ steps.fetch_rule.output.name }}"
        description: "{{ steps.fetch_rule.output.description }}"
        query: "{{ steps.fetch_rule.output.query }}"
        language: "{{ steps.fetch_rule.output.language }}"
        index: "${{ steps.fetch_rule.output.index }}"
        filters: "${{ steps.fetch_rule.output.filters | default: consts.no_items }}"
        exceptions_list: "${{ steps.fetch_rule.output.exceptions_list | default: consts.no_items }}"
        severity: "{{ steps.fetch_rule.output.severity }}"
        severity_mapping: "${{ steps.fetch_rule.output.severity_mapping | default: consts.no_items }}"
        risk_score: "${{ steps.fetch_rule.output.risk_score }}"
        risk_score_mapping: "${{ steps.fetch_rule.output.risk_score_mapping | default: consts.no_items }}"
        max_signals: "${{ steps.fetch_rule.output.max_signals }}"
        threat: "${{ steps.fetch_rule.output.threat | default: consts.no_items }}"
        tags: "${{ steps.fetch_rule.output.tags | default: consts.no_items }}"
        author: "${{ steps.fetch_rule.output.author | default: consts.no_items }}"
        false_positives: "${{ steps.fetch_rule.output.false_positives | default: consts.no_items }}"
        references: "${{ steps.fetch_rule.output.references | default: consts.no_items }}"
        interval: "{{ steps.fetch_rule.output.interval }}"
        from: "{{ steps.fetch_rule.output.from }}"
        to: "{{ steps.fetch_rule.output.to }}"
        invocationCount: "${{ inputs.preview_invocation_count | default: consts.preview_invocation_count }}"
        timeframeEnd: "{{ inputs.last_fp_at }}"
    on-failure:
      continue: true

  - name: count_current_preview_alerts
    type: elasticsearch.search
    if: "${{ steps.preview_current_rule.error == null and steps.preview_current_rule.output.previewId != null }}"
    with:
      index: ".preview.alerts-security.alerts-{{ workflow.spaceId }}"
      size: 0
      track_total_hits: true
      allow_partial_search_results: false
      query:
        term:
          kibana.alert.rule.uuid: "{{ steps.preview_current_rule.output.previewId }}"
    on-failure:
      continue: true

  - name: collect_current_preview_errors
    type: data.set
    with:
      error_text: |-
        {%- for log in steps.preview_current_rule.output.logs -%}
        {%- for err in log.errors -%}{{ err }}; {% endfor -%}
        {%- endfor -%}

  - name: preview_proposed_rule
    type: kibana.request
    if: >-
      ${{ steps.diagnose_rule.output.structured_output.change_type == 'query'
        and steps.diagnose_rule.output.structured_output.proposed_query != ''
        and steps.fetch_rule.output.type == 'query' }}
    with:
      method: POST
      path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules/preview"
      headers:
        kbn-xsrf: string
        elastic-api-version: "2023-10-31"
        Content-Type: application/json
      body:
        type: query
        name: "{{ steps.fetch_rule.output.name }}"
        description: "{{ steps.fetch_rule.output.description }}"
        query: "{{ steps.diagnose_rule.output.structured_output.proposed_query }}"
        language: "{{ steps.fetch_rule.output.language }}"
        index: "${{ steps.fetch_rule.output.index }}"
        filters: "${{ steps.fetch_rule.output.filters | default: consts.no_items }}"
        exceptions_list: "${{ steps.fetch_rule.output.exceptions_list | default: consts.no_items }}"
        severity: "{{ steps.fetch_rule.output.severity }}"
        severity_mapping: "${{ steps.fetch_rule.output.severity_mapping | default: consts.no_items }}"
        risk_score: "${{ steps.fetch_rule.output.risk_score }}"
        risk_score_mapping: "${{ steps.fetch_rule.output.risk_score_mapping | default: consts.no_items }}"
        max_signals: "${{ steps.fetch_rule.output.max_signals }}"
        threat: "${{ steps.fetch_rule.output.threat | default: consts.no_items }}"
        tags: "${{ steps.fetch_rule.output.tags | default: consts.no_items }}"
        author: "${{ steps.fetch_rule.output.author | default: consts.no_items }}"
        false_positives: "${{ steps.fetch_rule.output.false_positives | default: consts.no_items }}"
        references: "${{ steps.fetch_rule.output.references | default: consts.no_items }}"
        interval: "{{ steps.fetch_rule.output.interval }}"
        from: "{{ steps.fetch_rule.output.from }}"
        to: "{{ steps.fetch_rule.output.to }}"
        invocationCount: "${{ inputs.preview_invocation_count | default: consts.preview_invocation_count }}"
        timeframeEnd: "{{ inputs.last_fp_at }}"
    on-failure:
      continue: true

  - name: count_proposed_preview_alerts
    type: elasticsearch.search
    if: "${{ steps.preview_proposed_rule.error == null and steps.preview_proposed_rule.output.previewId != null }}"
    with:
      index: ".preview.alerts-security.alerts-{{ workflow.spaceId }}"
      size: 0
      track_total_hits: true
      allow_partial_search_results: false
      query:
        term:
          kibana.alert.rule.uuid: "{{ steps.preview_proposed_rule.output.previewId }}"
    on-failure:
      continue: true

  - name: collect_proposed_preview_errors
    type: data.set
    with:
      error_text: |-
        {%- for log in steps.preview_proposed_rule.output.logs -%}
        {%- for err in log.errors -%}{{ err }}; {% endfor -%}
        {%- endfor -%}

  - name: record_preview_outcome
    type: data.set
    with:
      current_succeeded: >-
        ${{ steps.preview_current_rule.error == null
          and steps.count_current_preview_alerts.error == null
          and steps.count_current_preview_alerts.output.timed_out == false
          and steps.count_current_preview_alerts.output._shards.failed == 0
          and steps.collect_current_preview_errors.output.error_text == '' }}
      current_alert_count: "${{ steps.count_current_preview_alerts.output.hits.total.value | default: -1 }}"
      current_is_aborted: "${{ steps.preview_current_rule.output.isAborted | default: false }}"
      current_error_text: "{{ steps.collect_current_preview_errors.output.error_text }}"
      proposed_succeeded: >-
        ${{ steps.preview_proposed_rule.error == null
          and steps.count_proposed_preview_alerts.error == null
          and steps.count_proposed_preview_alerts.output.timed_out == false
          and steps.count_proposed_preview_alerts.output._shards.failed == 0
          and steps.collect_proposed_preview_errors.output.error_text == '' }}
      proposed_alert_count: "${{ steps.count_proposed_preview_alerts.output.hits.total.value | default: -1 }}"
      proposed_is_aborted: "${{ steps.preview_proposed_rule.output.isAborted | default: false }}"
      proposed_error_text: "{{ steps.collect_proposed_preview_errors.output.error_text }}"

  # A timeout fails this run before the tag steps, so the alerts stay unreviewed
  # and the next sweep proposes the rule again with a fresh diagnosis.
  - name: review_tuning
    type: waitForApproval
    if: "${{ steps.diagnose_rule.output.structured_output.summary != null }}"
    timeout: "72h"
    with:
      approveLabel: Approve proposal
      rejectLabel: Dismiss
      message: |-
        Rule tuning proposal for {{ steps.fetch_rule.output.name }}
        {{ inputs.fp_count }} alerts were closed as false positives in the last
        {{ inputs.analysis_window_days | default: consts.analysis_window_days }} days.
        {% if inputs.alert_ids.size > 100 %}
        The diagnosis examined 100 of the {{ inputs.alert_ids.size }} harvested alert
        documents. This decision tags all {{ inputs.alert_ids.size }} harvested alerts.
        {% endif %}

        {{ steps.diagnose_rule.output.structured_output.summary }}

        {% if steps.diagnose_rule.output.structured_output.change_type == "query" %}
        Current query:
        {{ steps.diagnose_rule.output.structured_output.current_query }}

        Proposed query:
        {{ steps.diagnose_rule.output.structured_output.proposed_query }}

        Backtest ({{ inputs.preview_invocation_count | default: consts.preview_invocation_count }} simulated executions of interval {{ steps.fetch_rule.output.interval }},
        lookback {{ steps.fetch_rule.output.from }}, ending at the newest false positive
        {{ inputs.last_fp_at }} — usually a much shorter span than the false positives cover):
        current {% if steps.record_preview_outcome.output.current_succeeded and steps.record_preview_outcome.output.current_is_aborted == false %}{{ steps.record_preview_outcome.output.current_alert_count }}{% else %}inconclusive{% endif %},
        proposed {% if steps.record_preview_outcome.output.proposed_succeeded and steps.record_preview_outcome.output.proposed_is_aborted == false %}{{ steps.record_preview_outcome.output.proposed_alert_count }}{% else %}inconclusive{% endif %}.
        {% if steps.record_preview_outcome.output.current_error_text != '' %}
        Current query preview errors: {{ steps.record_preview_outcome.output.current_error_text }}
        {% endif %}
        {% if steps.record_preview_outcome.output.proposed_error_text != '' %}
        Proposed query preview errors: {{ steps.record_preview_outcome.output.proposed_error_text }}
        {% endif %}
        Approving applies the proposed query only if both backtests succeeded and the
        rule has not been edited since this diagnosis. Otherwise no rule or alert tags
        change, and a later sweep can retry with current data.
        {% else %}
        {% if steps.diagnose_rule.output.structured_output.change_type == "exception" %}
        Proposed exception:
        {{ steps.diagnose_rule.output.structured_output.exception_condition }}
        {% endif %}
        Apply this {{ steps.diagnose_rule.output.structured_output.change_type }}
        proposal manually in the Detection Rules UI. Approving records the handoff;
        it does not change the rule.
        {% endif %}

        {% if steps.diagnose_rule.output.conversation_id %}
        Continue investigation: /s/{{ workflow.spaceId }}/app/agent_builder/conversations/{{ steps.diagnose_rule.output.conversation_id }}
        {% endif %}

  # The gate can stay open for 72h; re-read the rule so an analyst edit made in the
  # meantime is not clobbered by a stale proposal.
  - name: refetch_rule
    type: kibana.request
    if: >-
      ${{ steps.review_tuning.output.response.approved == true
        and steps.diagnose_rule.output.structured_output.proposed_query != ''
        and steps.fetch_rule.output.type == 'query' }}
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules?rule_id={{ inputs.rule_id | url_encode }}"
      headers:
        kbn-xsrf: string
        elastic-api-version: "2023-10-31"
        Content-Type: application/json
    on-failure:
      continue: true

  - name: decide_apply
    type: data.set
    with:
      eligible: >-
        ${{ steps.review_tuning.output.response.approved == true
          and steps.diagnose_rule.output.structured_output.proposed_query != ''
          and steps.fetch_rule.output.type == 'query'
          and steps.record_preview_outcome.output.current_succeeded == true
          and steps.record_preview_outcome.output.current_is_aborted == false
          and steps.record_preview_outcome.output.proposed_succeeded == true
          and steps.record_preview_outcome.output.proposed_is_aborted == false
          and steps.refetch_rule.error == null
          and steps.refetch_rule.output.updated_at == steps.fetch_rule.output.updated_at }}

  - name: apply_query_tuning
    type: kibana.request
    if: "${{ steps.decide_apply.output.eligible == true }}"
    with:
      method: PATCH
      path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules"
      headers:
        kbn-xsrf: string
        elastic-api-version: "2023-10-31"
        Content-Type: application/json
      body:
        id: "{{ steps.refetch_rule.output.id }}"
        query: "{{ steps.diagnose_rule.output.structured_output.proposed_query }}"

  # Mirrors apply_query_tuning's condition plus its error check, so the tag steps
  # and the `applied` output cannot claim a change that never landed.
  - name: record_outcome
    type: data.set
    with:
      rule_patched: >-
        ${{ steps.decide_apply.output.eligible == true
          and steps.apply_query_tuning.error == null }}

  - name: mark_alerts_dismissed
    type: security.setAlertTags
    if: "${{ steps.review_tuning.output.response.approved == false }}"
    with:
      alert_ids: "${{ inputs.alert_ids }}"
      tags_to_add: "${{ consts.dismissed_tags }}"

  - name: mark_alerts_applied
    type: security.setAlertTags
    if: >-
      ${{ steps.review_tuning.output.response.approved == true
        and steps.diagnose_rule.output.structured_output.change_type == 'query'
        and steps.record_outcome.output.rule_patched == true }}
    with:
      alert_ids: "${{ inputs.alert_ids }}"
      tags_to_add: "${{ consts.applied_tags }}"

  # A non-query proposal is a manual handoff, not an applied rule change.
  - name: mark_alerts_handoff
    type: security.setAlertTags
    if: >-
      ${{ steps.review_tuning.output.response.approved == true
        and steps.diagnose_rule.output.structured_output.change_type != 'query' }}
    with:
      alert_ids: "${{ inputs.alert_ids }}"
      tags_to_add: "${{ consts.handoff_tags }}"

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      rule_id: "{{ inputs.rule_id }}"
      approved: "${{ steps.review_tuning.output.response.approved == true }}"
      applied: "${{ steps.record_outcome.output.rule_patched }}"
