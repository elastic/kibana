version: "1"
name: Forensic Watch
description: >
  Forensic Watch. Invokable investigation worker: given an attack
  discovery alert id it extracts the affected host, runs
  endpoint-forensic-analysis, and returns isIncident, rationale,
  proposal, and the containment it recommends. Stops without forensics
  when no host.name is extractable from the attack or alert. Still runs
  standalone from an alert or manual trigger. The orchestrated Attack
  Discovery lifecycle this watch used to carry now runs on the Watch
  Floor (ADR-015).
enabled: false
tags:
  - watch
  - watch-deep
triggers:
  - type: alert
  - type: manual
    inputs:
      properties:
        attack_discovery_alert_id:
          type: string
          description: >
            Attack discovery alert id this run investigates. Passed when
            the Floor invokes this watch. Unset on a standalone alert
            trigger, which then reads the event instead.
        space_id:
          type: string
          description: >
            Space this run investigates in. Unset on a standalone alert
            trigger, which then uses the workflow space.
      additionalProperties: false
# JSON Schema form, not the legacy `- name:/type:` list, because the legacy form
# hardcodes array items to `anyOf: [string, number, boolean]`
# (`convertLegacyFieldToJsonSchemaProperty`). `recommendedActions` carries objects,
# so under the legacy form every element failed output validation.
outputs:
  properties:
    isIncident:
      type: boolean
    # Why this verdict was reached: `assessed` = forensics ran;
    # `no_host_resolved` = the host gate could not resolve an affected host, so
    # nothing was assessed. Surfaced because a silently-false isIncident on a
    # data-shape mismatch is indistinguishable from a genuine "not an incident"
    # verdict — ops and evals must be able to tell them apart.
    gate:
      type: string
      enum:
        - assessed
        - no_host_resolved
        - agent_no_structured_output
    rationale:
      type: string
    proposal:
      type: string
    # Recommendations only. Nothing in this repo executes them: the Floor renders
    # them on the promote gate so the analyst sees what containment the forensics
    # justify before escalating.
    recommendedActions:
      type: array
      # Deliberately only `object`, not the full action shape. The agent step's
      # `schema` already constrains what the model emits; restating it here would
      # fail the whole run over one missing field on a list that is advisory
      # anyway. The UI validates each action's structure before rendering it.
      items:
        type: object
consts:
  watch_policy:
    settingsVersion: __WATCH_SETTINGS_VERSION__
    # Persisted plumbing only; runtime autonomy is request-time from template values.
    autonomy: "__WATCH_AUTONOMY_LEVEL__"
    mandate: Endpoint forensics
    autonomyLevel: manual
    handoff: records
    onDemand: true
    draft: false
    cadence: manual
    from: 8
    to: 18
    mode: window
    ui:
      color: "#8b5cf6"
      icon: console
      order: 40
    scopeSummary: Security indices · EDR · DNS
    scopes:
      - name: Security indices
        access: full
        label: Read
      - name: EDR telemetry
        access: full
        label: Read
      - name: DNS · netflow
        access: full
        label: Read
    # Capabilities projected from executable steps — see Watch Floor.
    callables: []
steps:
  # Conversation ids and Attack Discovery markdown only. Host extraction
  # is the YAML steps below so this watch can skip forensics when none
  # is extractable. continue so a standalone alert with no
  # attack-discovery id still reaches host resolution.
  - name: derive_ids
    type: kibana.request
    on-failure:
      continue: true
      retry:
        max-attempts: 3
        delay: 5s
    with:
      method: GET
      path: "/s/{{ inputs.space_id | default: workflow.spaceId }}/internal/pnd/conversations/_derive"
      query:
        correlationId: "{{ inputs.attack_discovery_alert_id | default: event.attackDiscoveryAlertId }}"
      headers:
        kbn-xsrf: "true"
        elastic-api-version: "1"

  # The triggering detection alert, or the Attack Discovery document
  # (scheduled + ad-hoc indices). host.name on that doc is enough; AD
  # 2.0 usually has none and carries constituent ids instead.
  - name: fetch_alert
    type: elasticsearch.search
    on-failure:
      continue: true
    with:
      index: ".alerts-security.attack.discovery.alerts-{{ inputs.space_id | default: workflow.spaceId }}*,.adhoc.alerts-security.attack.discovery.alerts-{{ inputs.space_id | default: workflow.spaceId }}*,.alerts-security.alerts-{{ inputs.space_id | default: workflow.spaceId }}"
      ignore_unavailable: true
      size: 1
      _source:
        - host.name
        - kibana.alert.attack_discovery.alert_ids
      query:
        bool:
          should:
            - ids:
                values:
                  - "{{ inputs.attack_discovery_alert_id | default: event.attackDiscoveryAlertId | default: event._id }}"
            - term:
                kibana.alert.uuid: "{{ inputs.attack_discovery_alert_id | default: event.attackDiscoveryAlertId | default: event['kibana.alert.uuid'] }}"
          minimum_should_match: 1

  # Leading host.name from the discovery's constituent detection alerts.
  # Attack Discovery 2.0 has no structured host field.
  - name: extract_host_from_alerts
    type: elasticsearch.search
    if: "${{ steps.fetch_alert.output.hits.hits[0]._source['kibana.alert.attack_discovery.alert_ids'] != blank }}"
    on-failure:
      continue: true
    with:
      index: ".alerts-security.alerts-{{ inputs.space_id | default: workflow.spaceId }}"
      ignore_unavailable: true
      size: 0
      query:
        ids:
          values: "${{ steps.fetch_alert.output.hits.hits[0]._source['kibana.alert.attack_discovery.alert_ids'] }}"
      aggregations:
        host_name:
          terms:
            field: host.name
            size: 1

  - name: resolve_host
    type: data.set
    with:
      host_name: "{{ event.host.name | default: event['host.name'] | default: steps.fetch_alert.output.hits.hits[0]._source.host.name | default: steps.extract_host_from_alerts.output.aggregations.host_name.buckets[0].key | default: '' }}"

  - name: when_host_known
    type: if
    condition: "${{ steps.resolve_host.output.host_name != blank }}"
    steps:
      - name: forensic_analysis
        type: ai.agent
        agent-id: alertzero-thin-agent
        timeout: "15m"
        create-conversation: true
        public-conversation: true
        with:
          conversation_id: "{{ steps.derive_ids.output.investigationConversationId }}"
          configuration_overrides:
            enable_elastic_capabilities: false
            skill_ids:
              - endpoint-forensic-analysis
          metadata:
            pnd_conversation_kind: investigation
            pnd_attack_discovery_alert_id: "{{ inputs.attack_discovery_alert_id | default: event.attackDiscoveryAlertId }}"
          message: >
            Use the [/endpoint-forensic-analysis](skill://endpoint-forensic-analysis)
            skill.

            I have a ransomware alert on {{ steps.resolve_host.output.host_name }}.
            Perform forensic analysis and extract all IoCs, then check if
            other hosts are affected.

            Do not execute Endpoint response actions (isolate, kill-process,
            retrieve) and do not run osquery. This investigation is read-only
            telemetry reconstruction.

            Attack Discovery context:
            {{ steps.derive_ids.output.attackDiscoveryMarkdown }}

            Alert / event context:
            {{ event | json }}

            After the forensic reconstruction, assess whether this represents
            a real security incident that warrants escalation. Put the
            forensic narrative (timeline, IoCs, other affected hosts, data
            gaps) in `rationale`. End your response by stating plainly
            (a) what you will propose for human approval, (b) the exact
            change or action that approval authorizes, and (c) what
            happens if it is declined. Return that same statement in
            `proposal`.

            If the telemetry implicates other hosts whose involvement you did
            not fully reconstruct, name them in `followUpHosts` with the
            evidence that leaves each one unexplained. Name a host only when
            you can cite that evidence; leave the list empty otherwise.

            Finally, put the containment this reconstruction justifies in
            `recommendedActions`, per the skill's "Recommend response actions"
            step. Nothing executes them — a human reads them on the escalation
            gate — so recommend only what you can tie to a finding above, and
            return an empty list when the evidence justifies none.

            You MUST conclude by invoking the structured-answer tool with ALL
            required fields (isIncident, rationale, proposal, ...). A prose
            final message is not a valid conclusion: this workflow reads only
            the structured output, and a prose-only finish fails the run.

            Scoping rule for `isIncident` (binding): the verdict applies to
            {{ steps.resolve_host.output.host_name }} and to hosts named in the
            Attack Discovery context above ONLY. Telemetry on OTHER hosts —
            including anything your queries surface in shared indices — may go
            in `rationale` and `followUpHosts`, but must NOT by itself set
            `isIncident` true. A host with no signal of its own never inherits
            an incident verdict from another host's kill chain.
          schema:
            type: object
            properties:
              isIncident:
                type: boolean
                description: >
                  True only when this represents a real security incident
                  that warrants escalation. Scoped to the host under
                  investigation and hosts named in the Attack Discovery
                  context — never inherited from unrelated hosts in shared
                  telemetry.
              rationale:
                type: string
                maxLength: 16000
                description: >
                  Forensic narrative: timeline, IoCs, other affected hosts,
                  and why this is or is not a real incident.
              proposal:
                type: string
                maxLength: 2000
                description: >
                  One short paragraph stating plainly (a) what you propose
                  for human approval, (b) the exact change or action
                  approval authorizes, and (c) what happens if it is
                  declined.
              followUpHosts:
                type: array
                maxItems: 3
                description: >
                  Hosts, other than the one investigated above, carrying
                  concrete unexplained evidence of this attack. A generally
                  advisable next step is not a lead. Default is an empty list.
                items:
                  type: object
                  properties:
                    host:
                      type: string
                      description: The host.name to reconstruct next.
                    reason:
                      type: string
                      description: >
                        The observation that leaves this host unexplained
                        (shared IoC, timestamp, event, or alert id).
                  required:
                    - host
                    - reason
              recommendedActions:
                type: array
                maxItems: 8
                description: >
                  Containment this reconstruction justifies, for a human to
                  approve. Nothing here is executed. Empty when the evidence
                  justifies none.
                items:
                  type: object
                  properties:
                    action_type:
                      type: string
                      description: >
                        Scoped to what Elastic can action today. An Endpoint
                        response action outside this list (kill-process,
                        suspend-process, execute, get-file, upload, runscript,
                        memory-dump) is unsupported, so recommending it would
                        propose containment no executor accepts.
                      enum:
                        - isolate_host
                        - release_host
                        - scan_host
                        - list_running_processes
                        - hunt_indicator
                        - create_case
                        - block_indicator
                        - revoke_user_account
                    execution:
                      type: string
                      enum:
                        - kibana_api
                        - manual
                      description: >
                        kibana_api when Kibana could carry the action out on
                        approval, manual when the analyst performs it outside
                        Kibana.
                    capability_ref:
                      type: string
                      description: >
                        The Kibana capability that would carry the action out.
                        Omitted on a manual action.
                    title:
                      type: string
                      maxLength: 200
                      description: Short imperative naming the action.
                    rationale:
                      type: string
                      maxLength: 1000
                      description: The finding that justifies this action.
                    priority:
                      type: string
                      enum:
                        - immediate
                        - investigation
                        - hardening
                    targets:
                      type: object
                      description: >
                        What the action touches. Every field is present; an
                        empty array means the action names none of that kind.
                      properties:
                        hosts:
                          type: array
                          maxItems: 20
                          items:
                            type: string
                        users:
                          type: array
                          maxItems: 20
                          items:
                            type: string
                        ips:
                          type: array
                          maxItems: 20
                          items:
                            type: string
                        alert_ids:
                          type: array
                          maxItems: 50
                          items:
                            type: string
                      required:
                        - hosts
                        - users
                        - ips
                        - alert_ids
                  required:
                    - action_type
                    - execution
                    - title
                    - rationale
                    - priority
                    - targets
            required:
              - isIncident
              - rationale
              - proposal
      # "Is it a host?" is answered by the data, not the model: keep only the
      # leads that actually carry telemetry or alerts, so a hallucinated name
      # never costs a second agent pass. Excludes the host already covered.
      - name: verify_lead_hosts
        type: elasticsearch.search
        if: "${{ steps.forensic_analysis.output.structured_output.followUpHosts != blank }}"
        on-failure:
          continue: true
        with:
          index: "logs-endpoint.events.*,.alerts-security.alerts-{{ inputs.space_id | default: workflow.spaceId }}"
          ignore_unavailable: true
          allow_no_indices: true
          size: 0
          query:
            bool:
              filter:
                - terms:
                    host.name: "${{ steps.forensic_analysis.output.structured_output.followUpHosts | map: 'host' }}"
              must_not:
                - term:
                    host.name: "{{ steps.resolve_host.output.host_name }}"
          aggregations:
            lead_hosts:
              terms:
                field: host.name
                size: 3

      # One extra pass, over every confirmed lead at once. Leads this pass
      # raises are not followed, so the investigation stays bounded at one
      # level regardless of how much the attack sprawls.
      - name: follow_up_analysis
        type: ai.agent
        agent-id: alertzero-thin-agent
        if: "${{ steps.verify_lead_hosts.output.aggregations.lead_hosts.buckets != blank }}"
        timeout: "10m"
        create-conversation: true
        public-conversation: true
        with:
          conversation_id: "{{ steps.derive_ids.output.investigationConversationId }}"
          configuration_overrides:
            enable_elastic_capabilities: false
            skill_ids:
              - endpoint-forensic-analysis
          metadata:
            pnd_conversation_kind: investigation
            pnd_attack_discovery_alert_id: "{{ inputs.attack_discovery_alert_id | default: event.attackDiscoveryAlertId }}"
          message: >
            Continue this investigation with the
            [/endpoint-forensic-analysis](skill://endpoint-forensic-analysis)
            skill.

            Your pass on {{ steps.resolve_host.output.host_name }} left these
            hosts unexplained, and each is confirmed present in telemetry:
            {% for bucket in steps.verify_lead_hosts.output.aggregations.lead_hosts.buckets %}
            - {{ bucket.key }}
            {% endfor %}

            Reconstruct the timeline on each, correlate it against the IoCs you
            already extracted, and state whether each host is part of the same
            attack.

            Do not execute Endpoint response actions (isolate, kill-process,
            retrieve) and do not run osquery. This investigation is read-only
            telemetry reconstruction.

            Return a consolidated `rationale` covering
            {{ steps.resolve_host.output.host_name }} and these hosts together.
            `isIncident` is NOT reassessed for the whole attack: it remains
            scoped, per the binding rule below, and your `proposal` states
            what the scoped verdict justifies.

            Scoping rule for `isIncident` (binding, overrides any other
            instruction in this message): `isIncident` is true ONLY when the
            evidence ON {{ steps.resolve_host.output.host_name }} — the host
            this investigation was opened for — warrants escalation. Evidence
            found on other hosts NEVER raises it: report that evidence in
            `rationale` and, if it justifies action, in `recommendedActions`
            and `followUpHosts` instead. A host whose own telemetry shows no
            attack signal stays not-an-incident even when the consolidated
            narrative includes it. Consolidating hosts into one narrative does
            NOT consolidate their verdicts: there is exactly one incident
            verdict here and it belongs to
            {{ steps.resolve_host.output.host_name }}. If the investigated
            host's own telemetry shows no attack signal, `isIncident` is
            false — no matter what any other host shows.

            Restate `recommendedActions` for the whole attack too: this list
            supersedes the one from your first pass, so carry forward the
            recommendations that still stand and add the ones these hosts
            justify. Nothing executes them.

            You MUST conclude by invoking the structured-answer tool with ALL
            required fields. A prose final message is not a valid conclusion:
            this workflow reads only the structured output, and a prose-only
            finish fails the run.
          schema:
            type: object
            properties:
              isIncident:
                type: boolean
                description: >
                  True only when the evidence on the investigated host
                  ({{ steps.resolve_host.output.host_name }}) warrants
                  escalation. Never raised by evidence found on other hosts
                  in the consolidated narrative — that evidence goes in
                  rationale / followUpHosts / recommendedActions instead.
              rationale:
                type: string
                maxLength: 16000
                description: >
                  Consolidated forensic narrative across every host
                  investigated: timeline, IoCs, correlation, and data gaps.
              proposal:
                type: string
                maxLength: 2000
                description: >
                  One short paragraph stating plainly (a) what you propose
                  for human approval, (b) the exact change or action
                  approval authorizes, and (c) what happens if it is
                  declined.
              recommendedActions:
                type: array
                maxItems: 8
                description: >
                  Containment the whole attack justifies, superseding the
                  first pass. Nothing here is executed. Empty when the
                  evidence justifies none.
                items:
                  type: object
                  properties:
                    action_type:
                      type: string
                      description: >
                        Scoped to what Elastic can action today. An Endpoint
                        response action outside this list (kill-process,
                        suspend-process, execute, get-file, upload, runscript,
                        memory-dump) is unsupported, so recommending it would
                        propose containment no executor accepts.
                      enum:
                        - isolate_host
                        - release_host
                        - scan_host
                        - list_running_processes
                        - hunt_indicator
                        - create_case
                        - block_indicator
                        - revoke_user_account
                    execution:
                      type: string
                      enum:
                        - kibana_api
                        - manual
                      description: >
                        kibana_api when Kibana could carry the action out on
                        approval, manual when the analyst performs it outside
                        Kibana.
                    capability_ref:
                      type: string
                      description: >
                        The Kibana capability that would carry the action out.
                        Omitted on a manual action.
                    title:
                      type: string
                      maxLength: 200
                      description: Short imperative naming the action.
                    rationale:
                      type: string
                      maxLength: 1000
                      description: The finding that justifies this action.
                    priority:
                      type: string
                      enum:
                        - immediate
                        - investigation
                        - hardening
                    targets:
                      type: object
                      description: >
                        What the action touches. Every field is present; an
                        empty array means the action names none of that kind.
                      properties:
                        hosts:
                          type: array
                          maxItems: 20
                          items:
                            type: string
                        users:
                          type: array
                          maxItems: 20
                          items:
                            type: string
                        ips:
                          type: array
                          maxItems: 20
                          items:
                            type: string
                        alert_ids:
                          type: array
                          maxItems: 50
                          items:
                            type: string
                      required:
                        - hosts
                        - users
                        - ips
                        - alert_ids
                  required:
                    - action_type
                    - execution
                    - title
                    - rationale
                    - priority
                    - targets
            required:
              - isIncident
              - rationale
              - proposal

      - name: record_reasoning
        type: data.set
        with:
          reasoning:
            summary: >-
              {{ steps.follow_up_analysis.output.structured_output.rationale
              | default: steps.forensic_analysis.output.structured_output.rationale
              | default: "Forensic Watch analysis completed." }}
            sections:
              - title: Incident
                body: >-
                  {{ steps.follow_up_analysis.output.structured_output.isIncident
                  | default: steps.forensic_analysis.output.structured_output.isIncident
                  | default: "n/a" }}
              - title: Proposal
                body: >-
                  {{ steps.follow_up_analysis.output.structured_output.proposal
                  | default: steps.forensic_analysis.output.structured_output.proposal
                  | default: "n/a" }}
              - title: Follow-up hosts
                body: >-
                  {% for bucket in steps.verify_lead_hosts.output.aggregations.lead_hosts.buckets %}{{ bucket.key }} {% else %}None{% endfor %}
              - title: Recommended actions
                body: >-
                  {{ steps.follow_up_analysis.output.structured_output.recommendedActions
                  | default: steps.forensic_analysis.output.structured_output.recommendedActions
                  | json }}

      # The follow-up pass supersedes the first when it ran: its outputs are
      # consolidated across every host. Floor still sees the same three
      # outputs either way.
      - name: when_structured_output
        type: if
        # An agent run that ended without a structured output must not be
        # readable as an assessed verdict. Distinguish it explicitly: evals
        # and ops treat agent_no_structured_output as a harness error,
        # never as "not an incident".
        condition: >-
          steps.follow_up_analysis.output.structured_output.isIncident : true
          or steps.forensic_analysis.output.structured_output.isIncident : true
          or steps.follow_up_analysis.output.structured_output.isIncident : false
          or steps.forensic_analysis.output.structured_output.isIncident : false
        steps:
          - name: emit_result
            type: workflow.output
            status: completed
            with:
              isIncident: "${{ steps.follow_up_analysis.output.structured_output.isIncident | default: steps.forensic_analysis.output.structured_output.isIncident }}"
              gate: assessed
              rationale: "{{ steps.follow_up_analysis.output.structured_output.rationale | default: steps.forensic_analysis.output.structured_output.rationale }}"
              proposal: "{{ steps.follow_up_analysis.output.structured_output.proposal | default: steps.forensic_analysis.output.structured_output.proposal }}"
              recommendedActions: "${{ steps.follow_up_analysis.output.structured_output.recommendedActions | default: steps.forensic_analysis.output.structured_output.recommendedActions }}"
        else:
          - name: emit_no_structured_output
            type: workflow.output
            status: completed
            with:
              isIncident: false
              gate: agent_no_structured_output
              rationale: >
                Forensic Watch harness error: the forensic agent run ended
                without a structured output (no isIncident was produced).
                This is not a verdict — re-run or investigate the agent
                execution.
              proposal: >
                No proposal: the agent produced no structured assessment.
              recommendedActions: []
    else:
      - name: emit_no_host
        type: workflow.output
        status: completed
        with:
          isIncident: false
          gate: no_host_resolved
          rationale: >
            Forensic Watch skipped: no host.name on the triggering alert
            or on the Attack Discovery's constituent detection alerts.
          proposal: >
            No forensic investigation is proposed because no affected host
            could be identified.
          # Explicitly empty, not absent: nothing was reconstructed, so there is
          # nothing to contain — which is a different claim from "not assessed".
          recommendedActions: []
