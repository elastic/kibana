version: "1"
name: Deep Watch
description: >
  Deep Watch Orchestrator (D10). Specialist, draft-only depth. Activated by
  escalation from Dark Watch or an analyst. Runs the Deep Worker under the demo
  service identity, emits a DRAFT forensic proposal, and gates any containment
  behind human review. Never auto-executes response actions.
enabled: true
tags:
  - watch
  - watch-deep
settings:
  timeout: "25m"
  concurrency:
    key: "watch-deep-orchestrator"
    strategy: drop
    max: 1
triggers:
  - type: manual
steps:
  - name: watch_policy
    type: data.set
    with:
      watch:
        mandate: Deep investigation & hunts
        autonomyLevel: 3
        handoff: records
        onDemand: true
        draft: true
        cadence: manual
        from: 8
        to: 18
        mode: window
        runAs: pnd-watch-service
        hilRequired: true
        ui:
          color: "#8b5cf6"
          icon: console
          order: 40
        scopeSummary: Security indices - EDR - DNS
        scopes:
          - name: Security indices
            access: full
            label: Read
          - name: EDR telemetry
            access: full
            label: Read
          - name: DNS - netflow
            access: full
            label: Read
        callables:
          - id: deep-watch-forensics
            name: Forensic analysis
            kind: skill
            summary: On-demand - patient-zero timeline, lateral movement, persistence
            gated: false
            enabled: true
          - id: endpoint-forensic-analysis
            name: Endpoint forensics
            kind: skill
            summary: EDR telemetry - process trees, IoC validation, evidence packaging
            gated: false
            enabled: true
  - name: run_deep_worker
    type: workflow.execute
    with:
      workflow-id: "system-security-watch-deep-worker"
      inputs:
        escalation: "{{ inputs.escalation | default: trigger.context }}"
  - name: emit_draft_proposal
    # Draft-only proposal; HIL-gated. No response action executes here.
    type: http
    on-failure:
      continue: true
    with:
      method: POST
      url: "kbn://internal/pnd/investigations/_emit_proposal"
      headers:
        kbn-xsrf: "true"
        Elastic-Api-Version: "1"
      body:
        sourceWatch: watch-deep
        draft: true
        hilRequired: true
        workerRun: "{{ steps.run_deep_worker.output.workerRun }}"
