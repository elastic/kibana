version: "1"
name: Watch Floor
description: >
  Watch Floor Orchestrator. Subscribes to security.attackDiscoveryCreated and drives
  the four-phase Attack Discovery lifecycle — Signal Triage, Investigation, Incident
  Response, and Post-Incident Follow-on — through deterministic Agent Builder
  conversations and fail-closed waitForInput HITL gates. Conversation ids are derived
  (UUIDv5) by a PND route because Liquid has no uuid5. Every HITL gate always parks as a
  real waitForInput; autonomy is enforced server-side at approval time, never by a YAML
  branch. Each investigation and incident conversation is titled for Agent Builder
  with an `[Investigation]` / `[Incident]` prefix (PND strips those on its own
  surfaces). Each conversation carries the attack discovery as a
  security.alert attachment, and records every HITL ask and its outcome — including a
  dismissal — so the thread is the durable audit surface for the loop.
enabled: false
tags:
  - watch
  - watch-floor
settings:
  # 30d, matching each waitForInput. The engine default is 6h from run start; idle HITL
  # resume takes min(step timeout, workflow timeout), so omitting this expires a recently
  # parked gate as soon as the Floor run itself is 6h old.
  timeout: 30d
# Fires on a real security.attackDiscoveryCreated event (AD 2.0 only, opt-in per space)
# and stays manually runnable. The custom trigger's `on.condition` is fail-open by design:
# it only requires an attack-discovery id to be present, and the engine's default
# `avoid-loop` cycle guard applies.
triggers:
  - type: security.attackDiscoveryCreated
    on:
      condition: 'event.attackDiscoveryAlertId : *'
  - type: manual
consts:
  # Liquid cannot express an empty array as a reliable filter fallback.
  no_rows: []
  watch_policy:
    settingsVersion: __WATCH_SETTINGS_VERSION__
    # Persisted plumbing only; runtime autonomy is request-time from template values.
    autonomy: "__WATCH_AUTONOMY_LEVEL__"
    mandate: Frontline triage
    autonomyLevel: supervised
    handoff: officer
    onDemand: false
    draft: false
    cadence: stream
    mode: always
    ui:
      color: "#16b3a6"
      icon: alert
      order: 10
    scopeSummary: Security indices · APM · logs
    scopes:
      - name: Security indices
        access: full
        label: Read
      - name: APM · logs · SLOs
        access: full
        label: Read
      - name: Finance PII
        access: masked
        label: Masked
    # Display overrides only — capabilities are projected from steps below.
    callables:
      - id: alert-analysis
        name: Alert analysis
        kind: skill
        summary: On alert · classifies FP / TP / inconclusive
        gated: false
        enabled: true
steps:
  # ============================================================================
  # Phase 1 — Signal Triage
  # ============================================================================

  # Liquid has no uuid5, so all three conversation ids (and the rendered attack-discovery
  # markdown, its title, the per-phase agent ids and the demo switch) are derived by a PND
  # route. The path is prefixed with /s/{spaceId} explicitly because the kibana.request step
  # sends `path` verbatim — buildKibanaRequest short-circuits on the `kibana.request` type
  # before applySpacePrefix, so only the named-connector branch prefixes the space. The
  # internal route also needs `elastic-api-version`, which the engine does not inject (it
  # injects x-elastic-internal-origin and kbn-xsrf for us).
  #
  # GRACEFUL DEGRADATION (kibana-idjb.20): retry transient failures, then `continue: true`.
  # Without `continue`, a persistent 403/500/timeout here (e.g. the AD-generating identity
  # lacks pnd_read) fails the ENTIRE run before the first HITL gate is reached, so the
  # investigation vanishes as a failed execution instead of surfacing in the queue. With
  # `continue`, the exhausted step is recorded FAILED but the run proceeds; the derived
  # ids/markdown are then unset, so the gate below opens with empty context for manual
  # review. This matches the documented intent ("failed read -> gate OPENS"). Proved by I1
  # (kibana-idjb.12) on isolated slot 4: with `continue` the run reaches waiting_for_input.
  #
  # It is also what makes the demo switch fail in the right direction: a degraded read renders
  # `demoForceIncident` empty, KQL yields false, and `assess_investigation` falls through to the
  # model's REAL verdict. A broken demo switch can never silently force-escalate.
  - name: derive_ids
    type: kibana.request
    on-failure:
      continue: true
      retry:
        max-attempts: 3
        delay: 5s
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/pnd/conversations/_derive"
      query:
        correlationId: "{{ event.attackDiscoveryAlertId }}"
      headers:
        kbn-xsrf: "true"
        elastic-api-version: "1"

  # ============================================================================
  # Phase 2 — Investigation
  # ============================================================================

  # kibana-tjil.8 / B2 + C4. Mint the Investigation container BEFORE the first
  # gate parks, so a thread never exists without a parent. POST the public
  # create route (no LLM turn); title is set here with an `[Investigation]`
  # prefix for Agent Builder (kibana-tjil.15 / D5). continue: a 409 on a
  # re-trigger means the container already exists, which is success for this
  # step. Retry is for transient 5xx, not for the 409. Self-call depth:
  # workflow → POST /conversations is 2 against Core's MAX_SELF_CALL_DEPTH = 4;
  # the create route does not nested-self-call.
  - name: create_investigation_container
    type: kibana.request
    on-failure:
      continue: true
      retry:
        max-attempts: 2
        delay: 5s
    with:
      method: POST
      path: "/s/{{ workflow.spaceId }}/api/agent_builder/conversations"
      headers:
        kbn-xsrf: "true"
        elastic-api-version: "2023-10-31"
      body:
        access_control:
          access_mode: public
        agent_id: "{{ steps.derive_ids.output.investigationAgentId }}"
        conversation_id: "{{ steps.derive_ids.output.investigationConversationId }}"
        title: "[Investigation] {{ steps.derive_ids.output.attackDiscoveryTitle | default: 'Attack Discovery' }}"

  # Gate: open an investigation? Always parks as a waitForInput.
  # Autonomy is enforced server-side at approval time, never by an if/else here.

  # D5 / ADR-012: materialise the `[Thread]` conversation paired 1:1 with this proposal, EAGERLY,
  # so the proposal has a thread the moment it parks rather than only if someone clicks. One
  # step per gate rather than one per file: the thread id is uuidv5(`${adId}:${gateId}`) (D1), so
  # the gate id a step sends is what decides which proposal the thread belongs to — a single
  # step would leave the escalation and containment proposals threadless.
  #
  # The body is `{ correlationId, gateId }` and nothing else, forever. `_ensure` builds
  # the title server-side and POSTs the public create route; a `prompt` or `message` field here
  # would be unused caller-supplied text on a route every holder of `pnd_threads_write` can reach.
  #
  # ⚠️ PLACEMENT IS LOAD-BEARING, AND WRONG PLACEMENT FAILS SILENTLY. `list_pending_pnd_gates`
  # attaches a gate's reasoning from the single COMPLETED step with the greatest
  # `finishedAt <= gate.startedAt` — timestamp order, not graph order. Slotting this step between
  # the reasoning block and the gate would make IT that predecessor, and a `kibana.request`
  # output carries no `reasoning`, so every proposal card would lose its whole body with no error
  # anywhere. It therefore runs BEFORE the reasoning block, never between it and the gate.
  #
  # Before the `waitForInput`, because a step after the gate only
  # runs once the analyst has answered, which is the opposite of eager. Being pre-gate means
  # `_ensure` finds no proposal row yet (`listPendingPndGates` reads only executions already
  # `WAITING_FOR_INPUT`), so the attachments degrade to the gate registry plus the attack
  # narrative — real content, not placeholders, and expected rather than a bug.
  #
  # `continue: true` is non-negotiable: a thread failure aborting the watch would be the same
  # class of defect as R2, which is the reason this epic exists. It DOES retry, unlike the
  # `ai.agent` steps, because `_ensure` is idempotent by construction (D6: pre-read,
  # per-registration in-flight map, post-failure re-read, deterministic attachment ids), so a
  # retry answers `created: false` instead of opening a second thread. Two attempts, not three,
  # bounds the delay the analyst waits for the proposal to appear.
  #
  # Self-call depth: workflow → `_ensure` → POST /conversations is 3 against Core's
  # MAX_SELF_CALL_DEPTH = 4, with the `_find` read and the three attachment POSTs as siblings at
  # the same depth. There is no budget for another hop. The create route does not nested-self-call.

  # kibana-tjil.6 / A5. Arm the per-run auto-approver so parked gates can be answered
  # the way a human would. `workflow.executeAsync` forwards this run's request, so the
  # child's `_auto_respond` POSTs as the identity already running the watch. Sits
  # immediately before `ensure_thread_*` — same placement, never between `reason_*`
  # and `await_*`. continue, no retry: a failed arm must not abort the watch or spawn
  # a second child.
  - name: arm_auto_approver_open_investigation
    type: workflow.executeAsync
    on-failure:
      continue: true
    with:
      workflow-id: system-security-watch-auto-approver
      inputs:
        space_id: "{{ workflow.spaceId }}"
        watch_id: system-security-watch-floor
  - name: ensure_thread_open_investigation
    type: kibana.request
    on-failure:
      continue: true
      retry:
        max-attempts: 2
        delay: 5s
    with:
      method: POST
      path: "/s/{{ workflow.spaceId }}/internal/pnd/threads/_ensure"
      headers:
        kbn-xsrf: "true"
        elastic-api-version: "1"
      body:
        correlationId: "{{ event.attackDiscoveryAlertId }}"
        gateId: open_investigation

  # The reasoning block sits immediately before its waitForInput, so
  # resolvePredecessorReasoning (greatest finishedAt <= wait.startedAt) attaches it
  # to this gate. Nothing may sit between them.
  #
  # A7: the queue renders `message` as the row headline and `reasoning.summary` as its
  # body, and `build_proposal_rows` projects ONLY the summary — `extractReasoningSummary`
  # drops `sections` (security finding D3). So the summary, not the sections, has to say
  # what approval authorizes and what a decline does. No agent has run yet at this gate,
  # so there is no closing statement to quote; the summary names the specific attack
  # instead.
  - name: reason_open_investigation
    type: data.set
    with:
      reasoning:
        summary: >-
          Approving opens an Investigation conversation for
          "{{ steps.derive_ids.output.attackDiscoveryTitle }}" and runs a full alert
          analysis against this space's live data; that investigation's own verdict then
          decides whether an escalation gate is raised. Declining ends the run now,
          records your rationale in the thread, and opens nothing.
        sections:
          - title: Attack discovery
            body: "{{ steps.derive_ids.output.attackDiscoveryMarkdown }}"
  - name: await_open_investigation
    type: waitForInput
    # 30d, not the 72h default. Expiry FAILS the step, which is fail-closed.
    timeout: 30d
    with:
      message: >-
        Open an investigation into
        "{{ steps.derive_ids.output.attackDiscoveryTitle }}"?
      schema:
        type: object
        properties:
          decision:
            type: string
            enum: [approve, dismiss]
          rationale:
            type: string
        required: [decision, rationale]
  # Step context only holds predecessors, so the dismissal check must live where
  # await_open_investigation is in scope.
  - name: stop_if_dismissed_investigation
    type: if
    condition: 'steps.await_open_investigation.output.response.decision : "dismiss"'
    steps:
      # A6: a dismissal is the human overriding the machine — the single most important
      # thing to preserve — and it used to leave NOTHING in any conversation. Agent
      # Builder exposes no plain conversation-append endpoint (its internal conversation
      # routes are `_rename` and `_mark_read`; `sml/_attach` attaches memory entries to an
      # existing round), so this is the documented fallback: a minimal ai.agent turn.
      #
      # Unlike the other three records this one still sets create-conversation:
      # true as a degrade path: the container is minted before this gate, so a
      # healthy run appends; if minting failed the dismissal can still create
      # the conversation at the same deterministic UUIDv5.
      #
      # `continue: true` and no retry: the workflow output below is the authoritative
      # record, the conversation is the additional audit surface, and retrying an LLM call
      # on a purely-audit path doubles latency and cost for no correctness gain.
      - name: record_dismissed_investigation
        type: ai.agent
        agent-id: "{{ steps.derive_ids.output.investigationAgentId }}"
        create-conversation: true
        public-conversation: true
        timeout: "5m"
        on-failure:
          continue: true
        with:
          conversation_id: "{{ steps.derive_ids.output.investigationConversationId }}"
          metadata:
            pnd_conversation_kind: investigation
            pnd_attack_discovery_alert_id: "{{ event.attackDiscoveryAlertId }}"
          attachments:
            - type: "security.alert"
              id: "pnd-ad-{{ event.attackDiscoveryAlertId }}"
              data:
                alert: "{{ steps.derive_ids.output.attackDiscoveryMarkdown }}"
                attachmentLabel: "Attack discovery: {{ steps.derive_ids.output.attackDiscoveryTitle }}"
          message: >
            {{ steps.derive_ids.output.attackDiscoveryMarkdown }}


            AUDIT RECORD — do not investigate, do not analyze, do not use any tools.


            A human analyst was asked whether to open an investigation into the attack
            discovery above, and DECLINED. Record the decision below verbatim, then
            acknowledge it in one line. Nothing further happens on this attack discovery.


            Responder: {{ steps.await_open_investigation.output.respondedBy }}

            Decision: dismissed

            Rationale: {{ steps.await_open_investigation.output.response.rationale }}
      - name: dismissed_investigation
        type: workflow.output
        status: completed
        with:
          outcome: dismissed
          phase: investigation
          rationale: "{{ steps.await_open_investigation.output.response.rationale }}"

  # kibana-tjil.8 / B2. The Floor no longer investigates inline. After the
  # analyst (or auto-approver) answers the gate, invoke Deep Watch as a sync
  # child and read its isIncident. Self-call depth: watch → workflow.execute
  # (in-process, forwards this run's request) → child's kibana.request is 3
  # against Core's MAX_SELF_CALL_DEPTH = 4. No continue: a failed worker must
  # not look like a false-positive and skip to not_an_incident.
  #
  # Catalog watches install per-space as `${definitionId}-${spaceId}` (register
  # #43). `workflow.execute` looks up the document id exactly — it does not
  # apply `workflowIdSuffix` — so the child must be `system-security-watch-deep-{{ workflow.spaceId }}`,
  # not the catalog id. Static helpers (auto-approver, rule workers) stay
  # unsuffixed: they still live at `*`.
  - name: investigate
    type: workflow.execute
    with:
      workflow-id: system-security-watch-deep-{{ workflow.spaceId }}
      inputs:
        attack_discovery_alert_id: "{{ event.attackDiscoveryAlertId }}"
        space_id: "{{ workflow.spaceId }}"

  # 2.6 The real assessment. kibana-tjil.8 reads `steps.investigate.output.isIncident`
  # from the Deep Watch worker rather than an inline agent's structured_output.
  #
  # The demo override is OR'd in FRONT of the real verdict, and it arrives as Kibana config
  # (`xpack.pnd.demo.forceIncident`, default false) surfaced through _derive rather than as a
  # workflow const — so flipping it for a staged run needs no YAML edit, no version bump and
  # no workflow re-install. `or` is safe: every condition goes through evaluateKql and KQL
  # supports it natively. Do NOT add `| default: false` to demoForceIncident: an absent value
  # must render empty so KQL yields false and the real verdict decides.
  #
  # NOT a gate, so a positive condition is correct here. Everything that promotes to an
  # incident lives inside this branch.
  - name: assess_investigation
    type: if
    condition: >-
      steps.derive_ids.output.demoForceIncident : true
      or steps.investigate.output.isIncident : true
    steps:
      # Gate: promote to an incident? Always parks as a waitForInput.
      # Autonomy is enforced server-side at approval time, never by an if/else here.
      # D5 / ADR-012, second gate. Same contract, placement and degradation reasoning as
      # ensure_thread_open_investigation above; only the gate id differs, and it is the gate id
      # that keys the thread.
      # kibana-tjil.6 / A5. Same arm as open_investigation, for the escalation gate.
      - name: arm_auto_approver_promote_incident
        type: workflow.executeAsync
        on-failure:
          continue: true
        with:
          workflow-id: system-security-watch-auto-approver
          inputs:
            space_id: "{{ workflow.spaceId }}"
            watch_id: system-security-watch-floor
      - name: ensure_thread_promote_incident
        type: kibana.request
        on-failure:
          continue: true
          retry:
            max-attempts: 2
            delay: 5s
        with:
          method: POST
          path: "/s/{{ workflow.spaceId }}/internal/pnd/threads/_ensure"
          headers:
            kbn-xsrf: "true"
            elastic-api-version: "1"
          body:
            correlationId: "{{ event.attackDiscoveryAlertId }}"
            gateId: promote_incident

      # A7: the summary asserts NO verdict of its own. It used to claim "The investigation
      # assessed this as a real incident" while quoting a rationale that could have
      # concluded the opposite — and in demo mode the branch is forced, so a fixed verdict
      # claim would be flatly wrong. Sourcing it from the agent's own closing statement is
      # what keeps card and conversation from drifting.
      - name: reason_promote_incident
        type: data.set
        with:
          reasoning:
            summary: >-
              Approval escalates
              "{{ steps.derive_ids.output.attackDiscoveryTitle }}" to an incident: an
              Incident conversation is opened and containment actions are staged for a
              second gate that is always human. Declining ends the run and records your
              rationale in the thread. The investigation's own closing statement follows.
              {{ steps.investigate.output.proposal }}
            sections:
              - title: Investigation assessment
                body: "{{ steps.investigate.output.rationale }}"
              - title: Attack discovery
                body: "{{ steps.derive_ids.output.attackDiscoveryMarkdown }}"
      - name: await_promote_incident
        type: waitForInput
        timeout: 30d
        with:
          message: >-
            Escalate "{{ steps.derive_ids.output.attackDiscoveryTitle }}" to an incident?
          schema:
            type: object
            properties:
              decision:
                type: string
                enum: [approve, dismiss]
              rationale:
                type: string
            required: [decision, rationale]
      - name: stop_if_dismissed_incident
        type: if
        condition: 'steps.await_promote_incident.output.response.decision : "dismiss"'
        steps:
          # A6: the escalation dismissal is recorded in the INVESTIGATION conversation —
          # the thread where the escalation was proposed. The incident conversation does
          # not exist yet, and creating one for a refused escalation would be a lie.
          # Appends rather than creates: the investigation container was minted
          # before the first gate.
          - name: record_dismissed_incident
            type: ai.agent
            agent-id: "{{ steps.derive_ids.output.investigationAgentId }}"
            create-conversation: false
            timeout: "5m"
            on-failure:
              continue: true
            with:
              conversation_id: "{{ steps.derive_ids.output.investigationConversationId }}"
              metadata:
                pnd_conversation_kind: investigation
                pnd_attack_discovery_alert_id: "{{ event.attackDiscoveryAlertId }}"
              message: >
                AUDIT RECORD — do not investigate, do not analyze, do not use any tools.


                A human analyst was asked whether to escalate this investigation to an
                incident, and DECLINED. Record the decision below verbatim, then
                acknowledge it in one line. No incident is opened and the run ends here.


                Responder: {{ steps.await_promote_incident.output.respondedBy }}

                Decision: dismissed

                Rationale: {{ steps.await_promote_incident.output.response.rationale }}
          - name: dismissed_incident
            type: workflow.output
            status: completed
            with:
              outcome: dismissed
              phase: incident
              rationale: "{{ steps.await_promote_incident.output.response.rationale }}"

      # Open the Incident conversation at the second caller-supplied UUIDv5. public again,
      # for the same queue-readability reason as the investigation.
      #
      # A6(ii): the escalation decision, its rationale and its responder are passed INTO this
      # step's message, so the human's answer lands in the thread naturally and costs nothing
      # extra. At a raised autonomy level the gate was auto-accepted and never executed, so
      # all three render empty — the prompt says so explicitly, or the model reads the blanks
      # as a missing human.
      # Continuing is what gets the run TO the containment gate (same reasoning as
      # draft_tuning): a tool-call hallucination or an empty structured response from the
      # incident agent must not kill the run after a human already approved the escalation.
      # Phase 3 no longer depends on this brief — recommend_actions stages the containment
      # actions from the attack discovery and the investigation assessment, and
      # reason_incident_contained says plainly when the incident brief is absent. No retry:
      # this turn creates a conversation at a FIXED id, so a retry after a partial failure
      # re-runs the whole turn into a likely id conflict.
      - name: open_incident
        type: ai.agent
        agent-id: "{{ steps.derive_ids.output.incidentAgentId }}"
        create-conversation: true
        public-conversation: true
        timeout: "1800s"
        on-failure:
          continue: true
        with:
          conversation_id: "{{ steps.derive_ids.output.incidentConversationId }}"
          metadata:
            pnd_conversation_kind: incident
            pnd_attack_discovery_alert_id: "{{ event.attackDiscoveryAlertId }}"
          attachments:
            - type: "security.alert"
              id: "pnd-ad-{{ event.attackDiscoveryAlertId }}"
              data:
                alert: "{{ steps.derive_ids.output.attackDiscoveryMarkdown }}"
                attachmentLabel: "Attack discovery: {{ steps.derive_ids.output.attackDiscoveryTitle }}"
          message: >
            {{ steps.derive_ids.output.attackDiscoveryMarkdown }}


            This attack discovery has been promoted to an incident.


            Human decision on the escalation gate — responder:
            {{ steps.await_promote_incident.output.respondedBy }}; decision:
            {{ steps.await_promote_incident.output.response.decision }}; rationale:
            {{ steps.await_promote_incident.output.response.rationale }}. All three are empty
            when the gate was auto-accepted at a raised autonomy level rather than answered by
            a person.


            The investigation's assessment:
            {{ steps.investigate.output.rationale }}


            Recommend and stage containment and response actions, and explain the reasoning
            behind each. Do not execute anything — a human gate approves containment.


            End your response by stating plainly (a) what you will propose for human approval,
            (b) the exact change or action that approval authorizes, and (c) what happens if
            it is declined. Return that same statement in `proposal`.
          schema:
            type: object
            properties:
              summary:
                type: string
                maxLength: 4000
                description: What happened, and what containment is being staged
              rationale:
                type: string
                maxLength: 4000
                description: Why these containment and response actions, in this order
              proposal:
                type: string
                maxLength: 2000
                description: >
                  One short paragraph stating plainly (a) what you propose for human
                  approval, (b) the exact change or action approval authorizes, and (c) what
                  happens if it is declined. Rendered verbatim on the approver's queue card,
                  so it must stand on its own without the conversation.
            required: [summary, rationale, proposal]

      # A3 / D5: deterministic title for the incident conversation. The incident is still
      # opened by an ai.agent turn, so title is not set at create and `_rename` remains.
      # Unversioned route, cosmetic-only. `[Incident]` is an Agent Builder title tag
      # (a surface PND cannot badge); PND strips it on read.
      - name: rename_incident
        type: kibana.request
        on-failure:
          continue: true
          retry:
            max-attempts: 2
            delay: 5s
        with:
          method: POST
          path: "/s/{{ workflow.spaceId }}/internal/agent_builder/conversations/{{ steps.derive_ids.output.incidentConversationId }}/_rename"
          headers:
            kbn-xsrf: "true"
          body:
            title: "[Incident] {{ steps.derive_ids.output.attackDiscoveryTitle | default: 'Attack Discovery' }}"
    # E3, a latent-bug fix rather than demo behavior. While the verdict was a hardcoded
    # `true` this branch was unreachable; once the condition can be false, a "not an incident"
    # result would fall through to the top-level reason_incident_contained /
    # await_incident_contained, which read
    # `steps.open_incident.output.structured_output.summary`, render empty, and OPEN A
    # CONTAINMENT GATE FOR A NON-INCIDENT. `workflow.output` terminates the run instead.
    #
    # Note the direction of failure: KQL yields false for a missing path, so a failed or
    # timed-out investigate ends the run rather than escalating. Fail-closed.
    else:
      # kibana-tjil.20: a coverage gap does not require an incident. The investigation
      # worker has no gap verdict (an LLM-behaviour change, out of budget), so this
      # terminal is a deterministic emit site. The rationale is the worker's own words,
      # never summarised. continue: a signalling failure must not fail a valid
      # not-an-incident outcome. Retry is for transient 5xx, matching _ensure.
      - name: emit_coverage_gap
        type: kibana.request
        on-failure:
          continue: true
          retry:
            max-attempts: 2
            delay: 5s
        with:
          method: POST
          path: "/s/{{ workflow.spaceId }}/internal/pnd/signals/_detection_change"
          headers:
            kbn-xsrf: "true"
            elastic-api-version: "1"
          body:
            correlationId: "{{ event.attackDiscoveryAlertId }}"
            gapDescription: "{{ steps.investigate.output.rationale }}"
            sourceRunId: "{{ execution.id }}"
      - name: not_an_incident
        type: workflow.output
        status: completed
        with:
          outcome: not_an_incident
          phase: investigation
          rationale: "{{ steps.investigate.output.rationale }}"

  # ============================================================================
  # Phase 3 — Incident Response (containment via recommended actions)
  # ============================================================================

  # Containment gets NO `if` wrapper at all: it is an alwaysGate gate, enforced
  # structurally here AND server-side in _sweep (defense in depth), with a regression test
  # pinning the structure. Do not "optimise" a fail-closed wrapper back in — it would let a
  # raised autonomy level auto-accept a gate that must always require a human, and it must
  # never gain an `else` auto-accept marker either. Its reasoning block precedes it directly.
  #
  # The containment gate is no longer a bare "confirm containment" prose card: the
  # recommended-actions skill stages a machine-readable action list, the analyst approves a
  # per-action subset on the gate (approved_actions), and the approved Kibana-executable
  # actions are executed by the steps AFTER the gate — post-gate placement is
  # identity-correct, because a resume re-keys the execution to the responder, so the
  # consequential writes run as the approving analyst.

  # Stage the containment actions. A tool-call hallucination (e.g. guessing a skill-as-tool
  # name instead of calling load_skill) must not fail the run before the gate is reached, so
  # this continues on failure and the gate then says plainly that nothing was staged.
  - name: recommend_actions
    type: ai.agent
    timeout: "10m"
    on-failure:
      continue: true
    with:
      message: >
        Call the load_skill tool for the
        [/recommended-actions](skill://recommended-actions) skill, then follow
        its instructions on the incident below. Recommend only justified
        containment and response actions, classify each as Kibana-executable or
        analyst-manual, include manual actions when warranted, and return the
        required structured output. Do not execute any action — a human gate
        approves execution.

        Attack Discovery:
        {{ steps.derive_ids.output.attackDiscoveryMarkdown }}

        Investigation assessment:
        {{ steps.investigate.output.rationale }}

        Incident summary:
        {{ steps.open_incident.output.structured_output.summary }}

        Staged response rationale:
        {{ steps.open_incident.output.structured_output.rationale }}
      # Guarantees the skill is present in this run's skill store so load_skill
      # succeeds (fixes "Tool ... called but was not available" from the model
      # guessing a skill-as-tool name instead of loading it).
      configuration_overrides:
        skill_ids:
          - recommended-actions
        enable_elastic_capabilities: false
      schema:
        type: object
        additionalProperties: false
        properties:
          recommended_actions:
            type: array
            maxItems: 8
            description: Evidence-based containment actions recommended for this incident.
            items:
              type: object
              additionalProperties: false
              properties:
                action_type:
                  type: string
                  enum:
                    - isolate_host
                    - kill_process
                    - hunt_process_persistence
                    - create_case
                    - set_asset_criticality
                    - analyze_exfiltration_ips
                    - revoke_user_account
                    - enforce_step_up_auth
                    - onboard_integration
                execution:
                  type: string
                  enum:
                    - kibana_api
                    - manual
                title:
                  type: string
                  maxLength: 150
                rationale:
                  type: string
                  maxLength: 600
                priority:
                  type: string
                  enum:
                    - immediate
                    - investigation
                    - hardening
                targets:
                  type: object
                  additionalProperties: false
                  properties:
                    hosts:
                      type: array
                      items:
                        type: string
                    users:
                      type: array
                      items:
                        type: string
                    ips:
                      type: array
                      items:
                        type: string
                    alert_ids:
                      type: array
                      items:
                        type: string
                  required:
                    - hosts
                    - users
                    - ips
                    - alert_ids
                capability_ref:
                  type: string
                  enum:
                    - endpoint.isolate
                    - endpoint.kill_process
                    - endpoint.running_procs
                    - cases.create
                    - asset_criticality.set
                    - threat_hunting.exfil_ips
                  description: Required for kibana_api actions and omitted for manual actions.
                execution_params:
                  type: object
                  additionalProperties: false
                  properties:
                    process_entity_id:
                      type: string
                      maxLength: 256
                    process_name:
                      type: string
                      maxLength: 1024
                    pid:
                      type: integer
                      minimum: 1
                    criticality_level:
                      type: string
                      enum:
                        - low_impact
                        - medium_impact
                        - high_impact
                        - extreme_impact
              required:
                - action_type
                - execution
                - title
                - rationale
                - priority
                - targets
        required:
          - recommended_actions

  # Guard the structured output (it may be absent if recommend_actions failed and was
  # caught by its on-failure: continue), so every downstream reference reads a
  # guaranteed array. Also seeds the execution ledger.
  - name: capture_recommended_actions
    type: data.set
    with:
      phase3_recommended_actions: >-
        ${{ steps.recommend_actions.output.structured_output.recommended_actions
          | default: consts.no_rows }}
      executed_actions: []

  # D5 / ADR-012, third gate. Same contract, placement and degradation reasoning as
  # ensure_thread_open_investigation. Top level, with no `if` wrapper, matching the alwaysGate it
  # precedes — a wrapper here would hand a raised autonomy level a branch to skip.
  - name: ensure_thread_incident_contained
    type: kibana.request
    on-failure:
      continue: true
      retry:
        max-attempts: 2
        delay: 5s
    with:
      method: POST
      path: "/s/{{ workflow.spaceId }}/internal/pnd/threads/_ensure"
      headers:
        kbn-xsrf: "true"
        elastic-api-version: "1"
      body:
        correlationId: "{{ event.attackDiscoveryAlertId }}"
        gateId: incident_contained

  # A7: only reasoning.summary reaches the proposal card, so the summary carries BOTH the
  # human explanation and the machine-readable staged actions behind a stable label anchor
  # ("Staged containment actions JSON:") — the same label-anchored `| json` contract
  # reason_apply_tuning uses, parsed back by the PND queue's recommended-actions form.
  # Short, load-bearing anchors first; the model's free prose last (extractReasoningSummary
  # truncates at 8192 characters silently, so what sits late is what gets lost).
  - name: reason_incident_contained
    type: data.set
    with:
      reasoning:
        summary: >-
          {% if variables.phase3_recommended_actions.size == 0 %}NO CONTAINMENT ACTIONS WERE
          STAGED: the recommended-actions skill returned nothing for this incident, so there
          is nothing to execute. Approving closes out the incident without running anything;
          declining records your rationale in the thread.
          {% endif %}{% if steps.open_incident.output.structured_output.summary == blank %}The
          incident responder did not produce an incident brief (its agent turn failed and the
          run continued), so the incident sections below are empty; the staged actions were
          derived directly from the attack discovery and the investigation assessment.
          {% endif %}Approving executes ONLY the Kibana-executable actions you toggle on —
          an action left toggled off is never executed — then closes out the incident and
          emits pnd.incidentClosed, which wakes the Detection Watch to draft a rule tuning.
          Manual actions are listed for the analyst to perform outside Kibana; the workflow
          never executes them. Declining executes nothing and records your rationale in the
          thread. This gate is always human — no autonomy level can auto-accept it.
          Staged containment actions JSON:
          {{ variables.phase3_recommended_actions | json }}.
          The incident responder's own closing statement follows.
          {{ steps.open_incident.output.structured_output.proposal }}
        sections:
          - title: Incident
            body: "{{ steps.open_incident.output.structured_output.summary }}"
          - title: Staged containment actions
            body: "{{ variables.phase3_recommended_actions | json }}"
  - name: await_incident_contained
    type: waitForInput
    timeout: 30d
    with:
      message: >-
        Review the staged containment actions for
        "{{ steps.derive_ids.output.attackDiscoveryTitle }}" — approve to execute only the
        actions you toggle on, and close the incident.
      schema:
        type: object
        properties:
          decision:
            type: string
            enum: [approve, dismiss]
          rationale:
            type: string
          approved_actions:
            type: array
            maxItems: 50
            description: >-
              The staged actions the analyst toggled on. Echoed back by the PND queue's
              per-action toggle form; absent or empty means nothing is executed.
            items:
              type: object
              additionalProperties: true
        required: [decision, rationale]

  # Everything below runs AFTER the gate, i.e. as the approving analyst (a resume re-keys
  # the execution to the responder). Approved actions are the analyst's toggled subset;
  # a dismissal executes nothing because approved_actions is empty and every execute block
  # is additionally gated on decision == approve.
  - name: capture_approved_actions
    type: data.set
    with:
      approved_actions: >-
        ${{ steps.await_incident_contained.output.response.approved_actions
          | default: consts.no_rows }}

  # Resolve the most recent Endpoint agent id for every approved endpoint-action host.
  # Each request below selects only ids belonging to its recommendation.
  - name: resolve_endpoint_agent_ids
    type: elasticsearch.esql.query
    if: >-
      ${{ steps.await_incident_contained.output.response.decision == 'approve' }}
    with:
      format: json
      query: |-
        FROM metrics-endpoint.metadata_current_*
        | WHERE host.name IN (
            "__workflow_no_matching_host__"
            {%- for action in variables.approved_actions -%}
              {%- if action.action_type == "isolate_host" or action.action_type == "kill_process" or action.action_type == "hunt_process_persistence" -%}
                {%- for host in action.targets.hosts -%}
            , {{ host | json }}
                {%- endfor -%}
              {%- endif -%}
            {%- endfor -%}
          )
        | KEEP agent.id, host.name
        | LIMIT 1000
    on-failure:
      continue: true

  - name: execute_create_case_actions
    type: foreach
    if: >-
      ${{ steps.await_incident_contained.output.response.decision == 'approve' }}
    foreach: >-
      ${{ variables.approved_actions | where: 'action_type', 'create_case' }}
    steps:
      # Captured so nested foreach loops below (which shadow foreach.item with
      # their own loop variable) can still reach this recommendation.
      - name: capture_case_action
        type: data.set
        with:
          current_case_action: "${{ foreach.item }}"

      - name: create_case
        type: kibana.request
        with:
          method: POST
          path: "/s/{{ workflow.spaceId }}/api/cases"
          headers:
            kbn-xsrf: string
            elastic-api-version: "2023-10-31"
            Content-Type: application/json
          body:
            title: "{{ foreach.item.title }}"
            description: |-
              {{ foreach.item.rationale }}

              Recommended action targets:
              {{ foreach.item.targets | json }}
            tags:
              - attack-discovery
              - recommended-action
            owner: securitySolution
            connector:
              id: none
              name: none
              type: .none
              fields: null
            settings:
              syncAlerts: false
            severity: high
        on-failure:
          continue: true

      - name: build_create_case_success_record
        type: data.set
        if: "${{ steps.create_case.error == null }}"
        with:
          execution_record:
            action_type: "{{ foreach.item.action_type }}"
            title: "{{ foreach.item.title }}"
            targets: "${{ foreach.item.targets }}"
            status: succeeded
            output: "${{ steps.create_case.output }}"

      - name: record_create_case_success
        type: data.set
        if: "${{ steps.create_case.error == null }}"
        with:
          executed_actions: >-
            ${{ variables.executed_actions
              | push: steps.build_create_case_success_record.output.execution_record }}

      - name: build_create_case_failure_record
        type: data.set
        if: "${{ steps.create_case.error != null }}"
        with:
          execution_record:
            action_type: "{{ foreach.item.action_type }}"
            title: "{{ foreach.item.title }}"
            targets: "${{ foreach.item.targets }}"
            status: failed
            error: "${{ steps.create_case.error }}"

      - name: record_create_case_failure
        type: data.set
        if: "${{ steps.create_case.error != null }}"
        with:
          executed_actions: >-
            ${{ variables.executed_actions
              | push: steps.build_create_case_failure_record.output.execution_record }}

      # Resolve the source alerts' index and rule so they can be attached to
      # the case as proper alert attachments (not just referenced in the
      # free-text description above).
      - name: resolve_case_alert_rows
        type: elasticsearch.esql.query
        if: >-
          ${{ steps.create_case.error == null
            and variables.current_case_action.targets.alert_ids.size > 0 }}
        with:
          format: json
          query: |-
            FROM .alerts-security.alerts-{{ workflow.spaceId }}
            METADATA _id, _index
            | WHERE _id IN (
                "__workflow_no_matching_alert__"
                {%- for alert_id in variables.current_case_action.targets.alert_ids -%}
            , {{ alert_id | json }}
                {%- endfor -%}
              )
            | KEEP _id, _index, kibana.alert.rule.uuid, kibana.alert.rule.name
            | LIMIT 1000
        on-failure:
          continue: true

      - name: attach_case_alerts
        type: foreach
        if: "${{ steps.create_case.error == null }}"
        foreach: "${{ steps.resolve_case_alert_rows.output.values | default: consts.no_rows }}"
        steps:
          - name: attach_case_alert
            type: kibana.request
            with:
              method: POST
              path: "/s/{{ workflow.spaceId }}/api/cases/{{ steps.create_case.output.id }}/comments"
              headers:
                kbn-xsrf: string
                elastic-api-version: "2023-10-31"
                Content-Type: application/json
              body:
                type: alert
                alertId: "{{ foreach.item[0] }}"
                index: "{{ foreach.item[1] }}"
                rule:
                  id: "{{ foreach.item[2] }}"
                  name: "{{ foreach.item[3] }}"
                owner: securitySolution
            on-failure:
              continue: true

          - name: build_attach_case_alert_record
            type: data.set
            with:
              execution_record:
                action_type: "{{ variables.current_case_action.action_type }}"
                title: "{{ variables.current_case_action.title }}"
                target:
                  alert_id: "{{ foreach.item[0] }}"
                  case_id: "{{ steps.create_case.output.id }}"
                status: >-
                  {%- if steps.attach_case_alert.error == null -%}succeeded{%- else -%}failed{%- endif -%}

          - name: record_attach_case_alert
            type: data.set
            with:
              executed_actions: >-
                ${{ variables.executed_actions
                  | push: steps.build_attach_case_alert_record.output.execution_record }}

      # Attach hosts and IPs as case observables (the create-case API has no
      # observables field; they must be added one at a time after creation).
      # Requires a Platinum+ license and caps at 50 observables per case.
      - name: add_case_host_observables
        type: foreach
        if: "${{ steps.create_case.error == null }}"
        foreach: "${{ variables.current_case_action.targets.hosts }}"
        steps:
          - name: add_case_host_observable
            type: kibana.request
            with:
              method: POST
              path: "/s/{{ workflow.spaceId }}/api/cases/{{ steps.create_case.output.id }}/observables"
              headers:
                kbn-xsrf: string
                elastic-api-version: "1"
                Content-Type: application/json
              body:
                observable:
                  typeKey: observable-type-hostname
                  value: "{{ foreach.item }}"
                  description: null
            on-failure:
              continue: true

          - name: build_case_host_observable_record
            type: data.set
            with:
              execution_record:
                action_type: "{{ variables.current_case_action.action_type }}"
                title: "{{ variables.current_case_action.title }}"
                target:
                  observable_type: host
                  value: "{{ foreach.item }}"
                status: >-
                  {%- if steps.add_case_host_observable.error == null -%}succeeded{%- else -%}failed{%- endif -%}

          - name: record_case_host_observable
            type: data.set
            with:
              executed_actions: >-
                ${{ variables.executed_actions
                  | push: steps.build_case_host_observable_record.output.execution_record }}

      - name: add_case_ip_observables
        type: foreach
        if: "${{ steps.create_case.error == null }}"
        foreach: "${{ variables.current_case_action.targets.ips }}"
        steps:
          - name: add_case_ip_observable
            type: kibana.request
            with:
              method: POST
              path: "/s/{{ workflow.spaceId }}/api/cases/{{ steps.create_case.output.id }}/observables"
              headers:
                kbn-xsrf: string
                elastic-api-version: "1"
                Content-Type: application/json
              body:
                observable:
                  typeKey: >-
                    {%- if foreach.item contains ':' -%}
                    observable-type-ipv6
                    {%- else -%}
                    observable-type-ipv4
                    {%- endif -%}
                  value: "{{ foreach.item }}"
                  description: null
            on-failure:
              continue: true

          - name: build_case_ip_observable_record
            type: data.set
            with:
              execution_record:
                action_type: "{{ variables.current_case_action.action_type }}"
                title: "{{ variables.current_case_action.title }}"
                target:
                  observable_type: ip
                  value: "{{ foreach.item }}"
                status: >-
                  {%- if steps.add_case_ip_observable.error == null -%}succeeded{%- else -%}failed{%- endif -%}

          - name: record_case_ip_observable
            type: data.set
            with:
              executed_actions: >-
                ${{ variables.executed_actions
                  | push: steps.build_case_ip_observable_record.output.execution_record }}

  - name: execute_set_asset_criticality_actions
    type: foreach
    if: >-
      ${{ steps.await_incident_contained.output.response.decision == 'approve' }}
    foreach: >-
      ${{ variables.approved_actions | where: 'action_type', 'set_asset_criticality' }}
    steps:
      - name: capture_asset_criticality_action
        type: data.set
        with:
          current_action: "${{ foreach.item }}"

      - name: build_missing_asset_criticality_params_record
        type: data.set
        if: "${{ variables.current_action.execution_params.criticality_level == null }}"
        with:
          execution_record:
            action_type: "{{ variables.current_action.action_type }}"
            title: "{{ variables.current_action.title }}"
            targets: "${{ variables.current_action.targets }}"
            status: skipped
            error: missing execution_params.criticality_level

      - name: record_missing_asset_criticality_params
        type: data.set
        if: "${{ variables.current_action.execution_params.criticality_level == null }}"
        with:
          executed_actions: >-
            ${{ variables.executed_actions
              | push: steps.build_missing_asset_criticality_params_record.output.execution_record }}

      - name: set_host_asset_criticality_actions
        type: foreach
        if: "${{ variables.current_action.execution_params.criticality_level != null }}"
        foreach: "${{ variables.current_action.targets.hosts }}"
        steps:
          # Replicate the Entity Store v2 lookup the alerts flyout performs when
          # clicking a host.name: resolve the entity's canonical entity.id (EUID)
          # first, then write criticality keyed by it, instead of the legacy
          # name-keyed /api/asset_criticality API.
          - name: resolve_host_entity
            type: kibana.request
            with:
              method: GET
              path: "/s/{{ workflow.spaceId }}/api/security/entity_store/entities"
              headers:
                elastic-api-version: "2023-10-31"
              query:
                per_page: 1
                filterQuery: >-
                  {"bool":{"filter":[{"term":{"host.name":{{ foreach.item | json }}}}]}}
            on-failure:
              continue: true

          - name: capture_host_entity_id
            type: data.set
            with:
              host_entity_id: "${{ steps.resolve_host_entity.output.records[0].entity.id }}"

          - name: build_host_asset_criticality_missing_entity_record
            type: data.set
            if: "${{ variables.host_entity_id == null }}"
            with:
              execution_record:
                action_type: "{{ variables.current_action.action_type }}"
                title: "{{ variables.current_action.title }}"
                target:
                  id_field: host.name
                  id_value: "{{ foreach.item }}"
                status: skipped
                error: entity not found in Entity Store

          - name: record_host_asset_criticality_missing_entity
            type: data.set
            if: "${{ variables.host_entity_id == null }}"
            with:
              executed_actions: >-
                ${{ variables.executed_actions
                  | push: steps.build_host_asset_criticality_missing_entity_record.output.execution_record }}

          - name: set_host_asset_criticality
            type: kibana.request
            if: "${{ variables.host_entity_id != null }}"
            with:
              method: PUT
              path: "/s/{{ workflow.spaceId }}/api/security/entity_store/entities/bulk"
              query:
                force: true
              headers:
                kbn-xsrf: string
                elastic-api-version: "2023-10-31"
                Content-Type: application/json
              body:
                entities:
                  - type: host
                    doc:
                      entity:
                        id: "{{ variables.host_entity_id }}"
                      asset:
                        criticality: "{{ variables.current_action.execution_params.criticality_level }}"
            on-failure:
              continue: true

          - name: build_host_asset_criticality_record
            type: data.set
            if: "${{ variables.host_entity_id != null }}"
            with:
              execution_record:
                action_type: "{{ variables.current_action.action_type }}"
                title: "{{ variables.current_action.title }}"
                target:
                  id_field: entity.id
                  id_value: "{{ variables.host_entity_id }}"
                  host_name: "{{ foreach.item }}"
                status: >-
                  {%- if steps.set_host_asset_criticality.error == null -%}succeeded{%- else -%}failed{%- endif -%}

          - name: record_host_asset_criticality
            type: data.set
            if: "${{ variables.host_entity_id != null }}"
            with:
              executed_actions: >-
                ${{ variables.executed_actions
                  | push: steps.build_host_asset_criticality_record.output.execution_record }}

      - name: set_user_asset_criticality_actions
        type: foreach
        if: "${{ variables.current_action.execution_params.criticality_level != null }}"
        foreach: "${{ variables.current_action.targets.users }}"
        steps:
          - name: resolve_user_entity
            type: kibana.request
            with:
              method: GET
              path: "/s/{{ workflow.spaceId }}/api/security/entity_store/entities"
              headers:
                elastic-api-version: "2023-10-31"
              query:
                per_page: 1
                filterQuery: >-
                  {"bool":{"filter":[{"term":{"user.name":{{ foreach.item | json }}}}]}}
            on-failure:
              continue: true

          - name: capture_user_entity_id
            type: data.set
            with:
              user_entity_id: "${{ steps.resolve_user_entity.output.records[0].entity.id }}"

          - name: build_user_asset_criticality_missing_entity_record
            type: data.set
            if: "${{ variables.user_entity_id == null }}"
            with:
              execution_record:
                action_type: "{{ variables.current_action.action_type }}"
                title: "{{ variables.current_action.title }}"
                target:
                  id_field: user.name
                  id_value: "{{ foreach.item }}"
                status: skipped
                error: entity not found in Entity Store

          - name: record_user_asset_criticality_missing_entity
            type: data.set
            if: "${{ variables.user_entity_id == null }}"
            with:
              executed_actions: >-
                ${{ variables.executed_actions
                  | push: steps.build_user_asset_criticality_missing_entity_record.output.execution_record }}

          - name: set_user_asset_criticality
            type: kibana.request
            if: "${{ variables.user_entity_id != null }}"
            with:
              method: PUT
              path: "/s/{{ workflow.spaceId }}/api/security/entity_store/entities/bulk"
              query:
                force: true
              headers:
                kbn-xsrf: string
                elastic-api-version: "2023-10-31"
                Content-Type: application/json
              body:
                entities:
                  - type: user
                    doc:
                      entity:
                        id: "{{ variables.user_entity_id }}"
                      asset:
                        criticality: "{{ variables.current_action.execution_params.criticality_level }}"
            on-failure:
              continue: true

          - name: build_user_asset_criticality_record
            type: data.set
            if: "${{ variables.user_entity_id != null }}"
            with:
              execution_record:
                action_type: "{{ variables.current_action.action_type }}"
                title: "{{ variables.current_action.title }}"
                target:
                  id_field: entity.id
                  id_value: "{{ variables.user_entity_id }}"
                  user_name: "{{ foreach.item }}"
                status: >-
                  {%- if steps.set_user_asset_criticality.error == null -%}succeeded{%- else -%}failed{%- endif -%}

          - name: record_user_asset_criticality
            type: data.set
            if: "${{ variables.user_entity_id != null }}"
            with:
              executed_actions: >-
                ${{ variables.executed_actions
                  | push: steps.build_user_asset_criticality_record.output.execution_record }}

  - name: execute_isolate_host_actions
    type: foreach
    if: >-
      ${{ steps.await_incident_contained.output.response.decision == 'approve' }}
    foreach: >-
      ${{ variables.approved_actions | where: 'action_type', 'isolate_host' }}
    steps:
      - name: prepare_isolate_host_action
        type: data.set
        with:
          current_action: "${{ foreach.item }}"
          endpoint_ids: >-
            ${{ steps.resolve_endpoint_agent_ids.output.values | default: consts.no_rows
              | where_exp: 'row', 'foreach.item.targets.hosts contains row.1'
              | map: '0' | uniq }}

      - name: isolate_host
        type: kibana.request
        if: "${{ variables.endpoint_ids.size > 0 }}"
        with:
          method: POST
          path: "/s/{{ workflow.spaceId }}/api/endpoint/action/isolate"
          headers:
            kbn-xsrf: string
            elastic-api-version: "2023-10-31"
            Content-Type: application/json
          body:
            endpoint_ids: "${{ variables.endpoint_ids }}"
            comment: "{{ variables.current_action.rationale }}"
        on-failure:
          continue: true

      - name: build_isolate_host_record
        type: data.set
        if: "${{ variables.endpoint_ids.size > 0 }}"
        with:
          execution_record:
            action_type: "{{ variables.current_action.action_type }}"
            title: "{{ variables.current_action.title }}"
            targets: "${{ variables.current_action.targets }}"
            status: >-
              {%- if steps.isolate_host.error == null -%}submitted{%- else -%}failed{%- endif -%}

      - name: record_isolate_host
        type: data.set
        if: "${{ variables.endpoint_ids.size > 0 }}"
        with:
          executed_actions: >-
            ${{ variables.executed_actions
              | push: steps.build_isolate_host_record.output.execution_record }}

      - name: build_isolate_host_missing_agent_record
        type: data.set
        if: "${{ variables.endpoint_ids.size == 0 }}"
        with:
          execution_record:
            action_type: "{{ variables.current_action.action_type }}"
            title: "{{ variables.current_action.title }}"
            targets: "${{ variables.current_action.targets }}"
            status: skipped
            error: no Endpoint agent id resolved for target hosts

      - name: record_isolate_host_missing_agent
        type: data.set
        if: "${{ variables.endpoint_ids.size == 0 }}"
        with:
          executed_actions: >-
            ${{ variables.executed_actions
              | push: steps.build_isolate_host_missing_agent_record.output.execution_record }}

  - name: execute_kill_process_actions
    type: foreach
    if: >-
      ${{ steps.await_incident_contained.output.response.decision == 'approve' }}
    foreach: >-
      ${{ variables.approved_actions | where: 'action_type', 'kill_process' }}
    steps:
      - name: prepare_kill_process_action
        type: data.set
        with:
          current_action: "${{ foreach.item }}"
          endpoint_ids: >-
            ${{ steps.resolve_endpoint_agent_ids.output.values | default: consts.no_rows
              | where_exp: 'row', 'foreach.item.targets.hosts contains row.1'
              | map: '0' | uniq }}
          kill_process_parameters: null

      - name: use_process_entity_id
        type: data.set
        if: "${{ variables.current_action.execution_params.process_entity_id != null }}"
        with:
          kill_process_parameters:
            entity_id: "{{ variables.current_action.execution_params.process_entity_id }}"

      - name: use_process_pid
        type: data.set
        if: >-
          ${{ variables.current_action.execution_params.process_entity_id == null
            and variables.current_action.execution_params.pid != null }}
        with:
          kill_process_parameters:
            pid: "${{ variables.current_action.execution_params.pid }}"

      - name: use_process_name
        type: data.set
        if: >-
          ${{ variables.current_action.execution_params.process_entity_id == null
            and variables.current_action.execution_params.pid == null
            and variables.current_action.execution_params.process_name != null }}
        with:
          kill_process_parameters:
            process_name: "{{ variables.current_action.execution_params.process_name }}"

      - name: kill_process
        type: kibana.request
        if: >-
          ${{ variables.endpoint_ids.size > 0
            and variables.kill_process_parameters != null }}
        with:
          method: POST
          path: "/s/{{ workflow.spaceId }}/api/endpoint/action/kill_process"
          headers:
            kbn-xsrf: string
            elastic-api-version: "2023-10-31"
            Content-Type: application/json
          body:
            endpoint_ids: "${{ variables.endpoint_ids }}"
            comment: "{{ variables.current_action.rationale }}"
            parameters: "${{ variables.kill_process_parameters }}"
        on-failure:
          continue: true

      - name: build_kill_process_record
        type: data.set
        if: >-
          ${{ variables.endpoint_ids.size > 0
            and variables.kill_process_parameters != null }}
        with:
          execution_record:
            action_type: "{{ variables.current_action.action_type }}"
            title: "{{ variables.current_action.title }}"
            targets: "${{ variables.current_action.targets }}"
            status: >-
              {%- if steps.kill_process.error == null -%}submitted{%- else -%}failed{%- endif -%}

      - name: record_kill_process
        type: data.set
        if: >-
          ${{ variables.endpoint_ids.size > 0
            and variables.kill_process_parameters != null }}
        with:
          executed_actions: >-
            ${{ variables.executed_actions
              | push: steps.build_kill_process_record.output.execution_record }}

      - name: build_kill_process_missing_params_record
        type: data.set
        if: "${{ variables.kill_process_parameters == null }}"
        with:
          execution_record:
            action_type: "{{ variables.current_action.action_type }}"
            title: "{{ variables.current_action.title }}"
            targets: "${{ variables.current_action.targets }}"
            status: skipped
            error: missing process execution params

      - name: record_kill_process_missing_params
        type: data.set
        if: "${{ variables.kill_process_parameters == null }}"
        with:
          executed_actions: >-
            ${{ variables.executed_actions
              | push: steps.build_kill_process_missing_params_record.output.execution_record }}

      - name: build_kill_process_missing_agent_record
        type: data.set
        if: >-
          ${{ variables.kill_process_parameters != null
            and variables.endpoint_ids.size == 0 }}
        with:
          execution_record:
            action_type: "{{ variables.current_action.action_type }}"
            title: "{{ variables.current_action.title }}"
            targets: "${{ variables.current_action.targets }}"
            status: skipped
            error: no Endpoint agent id resolved for target hosts

      - name: record_kill_process_missing_agent
        type: data.set
        if: >-
          ${{ variables.kill_process_parameters != null
            and variables.endpoint_ids.size == 0 }}
        with:
          executed_actions: >-
            ${{ variables.executed_actions
              | push: steps.build_kill_process_missing_agent_record.output.execution_record }}

  - name: execute_hunt_process_persistence_actions
    type: foreach
    if: >-
      ${{ steps.await_incident_contained.output.response.decision == 'approve' }}
    foreach: >-
      ${{ variables.approved_actions | where: 'action_type', 'hunt_process_persistence' }}
    steps:
      - name: prepare_hunt_process_persistence_action
        type: data.set
        with:
          current_action: "${{ foreach.item }}"
          endpoint_ids: >-
            ${{ steps.resolve_endpoint_agent_ids.output.values | default: consts.no_rows
              | where_exp: 'row', 'foreach.item.targets.hosts contains row.1'
              | map: '0' | uniq }}

      - name: hunt_process_persistence
        type: kibana.request
        if: "${{ variables.endpoint_ids.size > 0 }}"
        with:
          method: POST
          path: "/s/{{ workflow.spaceId }}/api/endpoint/action/running_procs"
          headers:
            kbn-xsrf: string
            elastic-api-version: "2023-10-31"
            Content-Type: application/json
          body:
            endpoint_ids: "${{ variables.endpoint_ids }}"
            comment: "{{ variables.current_action.rationale }}"
        on-failure:
          continue: true

      - name: build_hunt_process_persistence_record
        type: data.set
        if: "${{ variables.endpoint_ids.size > 0 }}"
        with:
          execution_record:
            action_type: "{{ variables.current_action.action_type }}"
            title: "{{ variables.current_action.title }}"
            targets: "${{ variables.current_action.targets }}"
            status: >-
              {%- if steps.hunt_process_persistence.error == null -%}submitted{%- else -%}failed{%- endif -%}

      - name: record_hunt_process_persistence
        type: data.set
        if: "${{ variables.endpoint_ids.size > 0 }}"
        with:
          executed_actions: >-
            ${{ variables.executed_actions
              | push: steps.build_hunt_process_persistence_record.output.execution_record }}

      - name: build_hunt_process_persistence_missing_agent_record
        type: data.set
        if: "${{ variables.endpoint_ids.size == 0 }}"
        with:
          execution_record:
            action_type: "{{ variables.current_action.action_type }}"
            title: "{{ variables.current_action.title }}"
            targets: "${{ variables.current_action.targets }}"
            status: skipped
            error: no Endpoint agent id resolved for target hosts

      - name: record_hunt_process_persistence_missing_agent
        type: data.set
        if: "${{ variables.endpoint_ids.size == 0 }}"
        with:
          executed_actions: >-
            ${{ variables.executed_actions
              | push: steps.build_hunt_process_persistence_missing_agent_record.output.execution_record }}

  # Account for every staged action that was NOT covered by an execution attempt
  # above, so the ledger is complete: every staged action ends with either an
  # executed/submitted/failed/skipped record (from the execute_* loops) or a
  # not_executed record with a reason (manual action, surfaced-only, containment
  # dismissed, or not approved by the analyst).
  - name: account_unexecuted_actions
    type: foreach
    foreach: "${{ variables.phase3_recommended_actions }}"
    steps:
      - name: capture_accounting_action
        type: data.set
        with:
          matching_approved: >-
            ${{ variables.approved_actions | where: 'title', foreach.item.title }}

      - name: build_manual_action_record
        type: data.set
        if: "${{ foreach.item.execution == 'manual' }}"
        with:
          execution_record:
            action_type: "{{ foreach.item.action_type }}"
            title: "{{ foreach.item.title }}"
            targets: "${{ foreach.item.targets }}"
            status: not_executed
            reason: manual action; analyst executes outside Kibana

      - name: record_manual_action
        type: data.set
        if: "${{ foreach.item.execution == 'manual' }}"
        with:
          executed_actions: >-
            ${{ variables.executed_actions
              | push: steps.build_manual_action_record.output.execution_record }}

      - name: build_surfaced_only_record
        type: data.set
        if: "${{ foreach.item.action_type == 'analyze_exfiltration_ips' }}"
        with:
          execution_record:
            action_type: "{{ foreach.item.action_type }}"
            title: "{{ foreach.item.title }}"
            targets: "${{ foreach.item.targets }}"
            status: not_executed
            reason: surfaced-only in this workflow

      - name: record_surfaced_only
        type: data.set
        if: "${{ foreach.item.action_type == 'analyze_exfiltration_ips' }}"
        with:
          executed_actions: >-
            ${{ variables.executed_actions
              | push: steps.build_surfaced_only_record.output.execution_record }}

      - name: build_dismissed_record
        type: data.set
        if: >-
          ${{ foreach.item.execution == 'kibana_api'
            and foreach.item.action_type != 'analyze_exfiltration_ips'
            and steps.await_incident_contained.output.response.decision == 'dismiss' }}
        with:
          execution_record:
            action_type: "{{ foreach.item.action_type }}"
            title: "{{ foreach.item.title }}"
            targets: "${{ foreach.item.targets }}"
            status: not_executed
            reason: containment dismissed by analyst

      - name: record_dismissed
        type: data.set
        if: >-
          ${{ foreach.item.execution == 'kibana_api'
            and foreach.item.action_type != 'analyze_exfiltration_ips'
            and steps.await_incident_contained.output.response.decision == 'dismiss' }}
        with:
          executed_actions: >-
            ${{ variables.executed_actions
              | push: steps.build_dismissed_record.output.execution_record }}

      - name: build_not_approved_record
        type: data.set
        if: >-
          ${{ foreach.item.execution == 'kibana_api'
            and foreach.item.action_type != 'analyze_exfiltration_ips'
            and steps.await_incident_contained.output.response.decision == 'approve'
            and variables.matching_approved.size == 0 }}
        with:
          execution_record:
            action_type: "{{ foreach.item.action_type }}"
            title: "{{ foreach.item.title }}"
            targets: "${{ foreach.item.targets }}"
            status: not_executed
            reason: not approved by analyst

      - name: record_not_approved
        type: data.set
        if: >-
          ${{ foreach.item.execution == 'kibana_api'
            and foreach.item.action_type != 'analyze_exfiltration_ips'
            and steps.await_incident_contained.output.response.decision == 'approve'
            and variables.matching_approved.size == 0 }}
        with:
          executed_actions: >-
            ${{ variables.executed_actions
              | push: steps.build_not_approved_record.output.execution_record }}

  # Stable marker for the four-phase execution projection: its output carries the
  # final per-action ledger, which GET /internal/pnd/executions/{correlationId}
  # projects into the lifecycle flyout's action-status section. The phase catalog
  # keys the "Execute approved actions" row on exactly this step name.
  - name: collect_executed_actions
    type: data.set
    with:
      containment_executed_actions: "${{ variables.executed_actions }}"

  # A6: this gate is TERMINAL for the incident conversation — nothing follows it that could
  # carry the decision into the thread — so the outcome is appended explicitly. Agent Builder
  # exposes no plain conversation-append endpoint, so this is the documented fallback: a
  # minimal ai.agent turn on the same conversation with create-conversation: false.
  - name: record_containment_outcome
    type: ai.agent
    agent-id: "{{ steps.derive_ids.output.incidentAgentId }}"
    create-conversation: false
    timeout: "5m"
    on-failure:
      continue: true
    with:
      conversation_id: "{{ steps.derive_ids.output.incidentConversationId }}"
      metadata:
        pnd_conversation_kind: incident
        pnd_attack_discovery_alert_id: "{{ event.attackDiscoveryAlertId }}"
      message: >
        AUDIT RECORD — do not investigate, do not analyze, do not use any tools.


        A human analyst answered the containment gate for this incident. Record the decision
        below verbatim, then acknowledge it in one line.


        Responder: {{ steps.await_incident_contained.output.respondedBy }}

        Decision: {{ steps.await_incident_contained.output.response.decision }}

        Rationale: {{ steps.await_incident_contained.output.response.rationale }}

        Approved actions: {{ variables.approved_actions | json }}

        Action execution ledger: {{ variables.executed_actions | json }}

  # Terminal marker for the execution projection. pnd.incidentClosed is emitted server-side
  # when _respond resolves the containment gate on an approval; security.detectionChangeSignal
  # is emitted from _respond at every Floor HITL terminal and from emit_coverage_gap on the
  # not-an-incident branch. The orchestrator does not emit either event itself at this step.
  - name: incident_closed
    type: workflow.output
    status: completed
    with:
      outcome: contained
      phase: incident_response
      decision: "{{ steps.await_incident_contained.output.response.decision }}"
      rationale: "{{ steps.await_incident_contained.output.response.rationale }}"
      recommended_actions: "${{ variables.phase3_recommended_actions }}"
      executed_actions: "${{ variables.executed_actions }}"
