version: "1"
name: Watch Floor
description: >
  Tier-1 Security Watch Floor. On an alert it triages via the alert-analysis
  skill; on a schedule it runs the Attack Discovery worker to generate
  discoveries and draft an investigation. Steps are routed by execution.triggeredBy.
enabled: true
tags:
  - watch
  - watch-floor
triggers:
  - type: alert
  - type: manual
  # The orchestrator owns the Attack Discovery cadence: each scheduled tick runs
  # only the AD worker (step routing below keys off execution.triggeredBy).
  - type: scheduled
    with:
      every: "15m"
consts:
  watch_policy:
    mandate: Frontline triage
    autonomyLevel: 3
    handoff: officer
    onDemand: false
    draft: false
    cadence: stream
    mode: always
    ui:
      color: "#16b3a6"
      icon: alert
      order: 10
    scopeSummary: Security indices · APM · logs
    scopes:
      - name: Security indices
        access: full
        label: Read
      - name: APM · logs · SLOs
        access: full
        label: Read
      - name: Finance PII
        access: masked
        label: Masked
    # Attack Discovery worker config passed as inputs on each scheduled tick.
    # No durable user-editable home yet (security-team#18717), so it lives here.
    config:
      adAlertSize: 100
      adLookback: now-24h
    # Display overrides only — capabilities are projected from steps below.
    callables:
      - id: alert-analysis
        name: Alert analysis
        kind: skill
        summary: On alert · classifies FP / TP / inconclusive
        gated: false
        enabled: true
      - id: system-security-watch-attack-discovery
        name: Attack Discovery Worker
        kind: workflow
        summary: On schedule · generates attack discoveries and drafts an investigation
        gated: false
        enabled: true
steps:
  # Alert triage runs only on the alert trigger. A scheduled tick has no `event`
  # to classify, so this step (and record_reasoning) are gated off and only the
  # AD worker runs.
  - name: triage_alerts
    type: ai.agent
    if: "${{ execution.triggeredBy == 'alert' }}"
    timeout: "10m"
    create-conversation: true
    with:
      message: >
        Use the [/alert-analysis](skill://alert-analysis) skill to triage the
        security alert context below. Prefer recall over precision when unsure.
        Return a structured classification.

        Alert / event context:
        {{ event | json }}
      schema:
        type: object
        properties:
          classification:
            type: string
            enum:
              - false_positive
              - true_positive
              - inconclusive
            description: Classification of the alert based on analysis
          confidence_score:
            type: number
            minimum: 0
            maximum: 1
            description: Confidence from 0.0–1.0
          rationale:
            type: string
            description: Brief human-readable explanation
        required:
          - classification
          - confidence_score
          - rationale
  - name: record_reasoning
    type: data.set
    if: "${{ execution.triggeredBy == 'alert' }}"
    with:
      reasoning:
        summary: >-
          {{ steps.triage_alerts.output.structured_output.rationale
          | default: "Watch Floor triage completed." }}
        sections:
          - title: Classification
            body: >-
              {{ steps.triage_alerts.output.structured_output.classification
              | default: "inconclusive" }}
              (confidence
              {{ steps.triage_alerts.output.structured_output.confidence_score
              | default: "n/a" }})

  # On a scheduled tick, hand off to the AD worker (workflow.execute, same
  # pluginId so no cross-owner concern). The worker generates discoveries,
  # persists them to the shared ad-hoc AD index, and drafts an investigation.
  - name: run_attack_discovery
    type: workflow.execute
    if: "${{ execution.triggeredBy == 'scheduled' }}"
    with:
      workflow-id: system-security-watch-attack-discovery
      inputs:
        size: "${{ consts.watch_policy.config.adAlertSize }}"
        start: "{{ consts.watch_policy.config.adLookback }}"
        end: now
