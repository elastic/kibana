version: "1"
name: Detection Rule Tuning Worker
description: >
  Harvests rules whose alerts analysts closed as false positives, fans out one
  tuning proposal workflow per rule so every proposal holds its own approval gate,
  and joins once every gate has settled to report the decision totals.
enabled: true
tags:
  - security
  - detection-rule-tuning
settings:
  # The sweep now runs as long as its slowest gate (up to 72h). Dropping overlaps
  # serializes sweeps on purpose: alerts are only tagged once a gate resolves, so
  # a second sweep started mid-join would rediagnose the same rules.
  concurrency:
    key: detection-rule-tuning
    strategy: drop
    max: 1
triggers:
  # Detection Watch owns the per-space 2h schedule. This global worker stays
  # manual-only so there is one scheduler authority and no cross-space task collision.
  - type: manual
    inputs:
      properties:
        min_fp_count:
          type: integer
          # Floor of 2: a single-FP group makes ES|QL return alert_ids as a scalar,
          # which would fail the proposal's array input schema.
          minimum: 2
          maximum: 1000000
          description: Overrides the minimum unreviewed false-positive alerts a rule needs before it is diagnosed.
        min_fp_rate_pct:
          type: number
          minimum: 0
          maximum: 100
          description: Overrides the minimum share of a rule's alerts, in percent, that analysts closed as false positives.
        analysis_window_days:
          type: integer
          minimum: 1
          maximum: 30
          description: Overrides how many days of alerts feed the analysis.
        preview_invocation_count:
          type: integer
          minimum: 1
          maximum: 10
          description: Overrides the rule executions each backtest preview simulates.
      additionalProperties: false
outputs:
  - name: proposals_requested
    type: number
  - name: proposals_approved
    type: number
  - name: proposals_failed
    type: number
  - name: rules_applied
    type: number
  - name: harvest_failed
    type: boolean
consts:
  # Worker settings. Scheduled runs carry no inputs, so every use goes through
  # `inputs.x | default: consts.x`; a manual run can override any of them.
  analysis_window_days: 14
  min_fp_count: 10
  min_fp_rate_pct: 50
  max_rules_per_sweep: 10
  # Ids handed to the diagnosing agent; must match ALERTS_BY_IDS_MAX in the
  # investigate-rule skill (investigate_rule_skill.ts).
  max_diagnosis_ids: 100
  preview_invocation_count: 2
  # Liquid has no array literal, so `| default: []` yields undefined rather than an
  # empty array. A const is the only way to spell an empty-array fallback.
  no_rows: []
  # Written onto every alert that reached a decision (by the proposal workflow).
  # The harvest treats the newest tagged alert as a per-rule watermark: any false
  # positive at or before it counts as addressed, tagged or not, so even FPs past
  # the 1000-id tag cap cannot be rediagnosed.
  reviewed_tag: detection-watch:tuning-reviewed
steps:
  # Scoped to one space because the tag API writes to the space's own alerts index, so
  # a cross-space harvest would keep rediagnosing alerts it can never mark.
  # `allow_partial_results: false` because a partial aggregation would both undercount
  # fp_count and return a short alert_ids list, leaving alerts that drove a decision
  # untagged. TOP bounds the per-rule id collection at 1000 inside the aggregation
  # (VALUES would buffer every id first), which also keeps the proposal's bulk tag
  # request inside Kibana's payload limit; FPs past the cap stay untagged but the
  # reviewed watermark still retires them once the batch resolves.
  # `total_count` spans every alert the rule produced in the window. `fp_rate_count`
  # includes reviewed false positives so processing a batch does not dilute the rule's
  # measured FP rate; `fp_count` and `alert_ids` include only work still to review.
  # TOP sorts by the collected value itself, so `alert_ids` (plain _id strings) has no
  # meaningful order and only feeds the bulk tag request. The diagnosis needs the most
  # recent evidence, so `recent_alert_ids` collects sortable `timestamp|id` keys and
  # the proposal strips the prefix when prompting the agent.
  - name: harvest_fp_alerts_by_rule
    type: elasticsearch.esql.query
    with:
      allow_partial_results: false
      query: |-
        FROM .alerts-security.alerts-{{ workflow.spaceId }} METADATA _id
        | WHERE @timestamp >= NOW() - {{ inputs.analysis_window_days | default: consts.analysis_window_days }} days
          AND `kibana.alert.building_block_type` IS NULL
        | EVAL is_fp = `kibana.alert.workflow_status` == "closed"
            AND `kibana.alert.workflow_reason` == "false_positive"
        | EVAL reviewed_ts = CASE(
            COALESCE(MV_CONTAINS(`kibana.alert.workflow_tags`, "{{ consts.reviewed_tag }}"), false),
            @timestamp, NULL)
        | INLINE STATS reviewed_watermark = MAX(reviewed_ts) BY `kibana.alert.rule.uuid`
        | EVAL is_unreviewed_fp = is_fp
            AND (reviewed_watermark IS NULL OR @timestamp > reviewed_watermark)
        | EVAL fp_recency_key = CONCAT(DATE_FORMAT("yyyyMMddHHmmssSSS", @timestamp), "|", _id)
        | STATS total_count = COUNT(*),
            fp_rate_count = COUNT(*) WHERE is_fp,
            fp_count = COUNT(*) WHERE is_unreviewed_fp,
            last_fp_at = MAX(@timestamp) WHERE is_unreviewed_fp,
            alert_ids = TOP(_id, 1000, "desc") WHERE is_unreviewed_fp,
            recent_alert_ids = TOP(fp_recency_key, {{ consts.max_diagnosis_ids }}, "desc") WHERE is_unreviewed_fp
          BY `kibana.alert.rule.uuid`, `kibana.alert.rule.rule_id`
        | WHERE fp_count >= {{ inputs.min_fp_count | default: consts.min_fp_count }}
          AND fp_rate_count * 100 >= total_count * {{ inputs.min_fp_rate_pct | default: consts.min_fp_rate_pct }}
        | KEEP `kibana.alert.rule.uuid`, fp_count, `kibana.alert.rule.rule_id`, last_fp_at, alert_ids, recent_alert_ids
        | SORT fp_count DESC
        | LIMIT {{ consts.max_rules_per_sweep }}
    on-failure:
      continue: true

  # One proposal execution per rule, launched synchronously inside a parallel
  # branch so this sweep joins once every gate has settled. The gate itself cannot
  # live in this run: waitForApproval is rejected inside a parallel branch, and one
  # execution has exactly one resume slot. Each child parks on its own gate for up
  # to 72h while its branch sits in WAITING_FOR_CHILD.
  # No `timeout` or `branch-timeout` here: either one aborts the branch and cancels
  # the child while the approver is still thinking. The gate's own 72h timeout is
  # the only clock.
  - name: run_proposals
    type: parallel
    foreach: "${{ steps.harvest_fp_alerts_by_rule.output.values | default: consts.no_rows }}"
    # Settled: one dropped or failed proposal must not skip the other rules'
    # gates. Failures stay visible in the aggregate results and counts.
    mode: settled
    concurrency:
      # Must cover consts.max_rules_per_sweep so every gate opens at once.
      max: 10
      # A branch parked in WAITING_FOR_CHILD frees its slot.
      count-waiting: false
    steps:
      # ES|QL rows arrive as positional arrays in the harvest's KEEP order.
      # `${{ }}` preserves the value's type (numbers, arrays); `{{ }}` stringifies.
      - name: run_proposal
        type: workflow.execute
        with:
          workflow-id: system-security-rule-tuning-proposal
          inputs:
            rule_uuid: "{{ foreach.item.0 }}"
            fp_count: "${{ foreach.item.1 }}"
            rule_id: "{{ foreach.item.2 }}"
            last_fp_at: "{{ foreach.item.3 }}"
            alert_ids: "${{ foreach.item.4 }}"
            recent_alert_ids: "${{ foreach.item.5 }}"
            analysis_window_days: "${{ inputs.analysis_window_days | default: consts.analysis_window_days }}"
            preview_invocation_count: "${{ inputs.preview_invocation_count | default: consts.preview_invocation_count }}"
            parent_run_id: "{{ execution.id }}"

  # Fan-in: every branch has settled, so each child either resolved its gate and
  # tagged its alerts, or failed (its error stays in the aggregate results). A
  # branch output is the child's workflow.output payload: rule_id, approved, applied.
  # Size is computed on its own because comparison operators cannot follow a filter chain.
  - name: summarize_decisions
    type: data.set
    with:
      proposals_requested: "${{ steps.harvest_fp_alerts_by_rule.output.values | size | default: 0 }}"
      proposals_failed: "${{ steps.run_proposals.output.failed | default: 0 }}"
      proposals_approved: "${{ steps.run_proposals.output.results | map: 'output' | where: 'approved' | size | default: 0 }}"
      rules_applied: "${{ steps.run_proposals.output.results | map: 'output' | where: 'applied' | size | default: 0 }}"

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      proposals_requested: "${{ steps.summarize_decisions.output.proposals_requested }}"
      proposals_approved: "${{ steps.summarize_decisions.output.proposals_approved }}"
      proposals_failed: "${{ steps.summarize_decisions.output.proposals_failed }}"
      rules_applied: "${{ steps.summarize_decisions.output.rules_applied }}"
      harvest_failed: "${{ steps.harvest_fp_alerts_by_rule.error != null }}"
