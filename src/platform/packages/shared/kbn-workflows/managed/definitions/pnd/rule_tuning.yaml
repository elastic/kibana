version: "1"
name: Detection Rule Tuning Worker
description: >
  Harvests rules whose alerts analysts closed as false positives, diagnoses each one,
  and applies the approved tuning change: a rule exception, a narrowed query,
  alert suppression, a risk score adjustment, or a rule disable.
enabled: true
tags:
  - security
  - detection-rule-tuning
settings:
  concurrency:
    key: detection-rule-tuning
    strategy: drop
    max: 1
triggers:
  - type: manual
    inputs:
      properties:
        min_fp_count:
          type: number
          default: 1
          description: Minimum false-positive alerts a rule needs before it is diagnosed.
        preview_invocation_count:
          type: number
          default: 2
          description: Rule executions each backtest preview simulates.
        lookback_hours:
          type: number
          default: 24
          description: How far back to look for alerts analysts closed as false positives.
      additionalProperties: false
outputs:
  - name: rules_examined
    type: number
  - name: harvest_failed
    type: boolean
consts:
  # Liquid has no array literal, so `| default: []` yields undefined rather than an
  # empty array. A const is the only way to spell an empty-array fallback.
  no_rows: []
  # Written onto every alert that reached a decision, and filtered out by the harvest,
  # so a later sweep cannot rediagnose the same alerts into the same proposal.
  reviewed_tag: detection-watch:tuning-reviewed
  dismissed_tag: detection-watch:tuning-dismissed
  applied_tag: detection-watch:tuning-applied
  dismissed_tags:
    - detection-watch:tuning-reviewed
    - detection-watch:tuning-dismissed
  applied_tags:
    - detection-watch:tuning-reviewed
    - detection-watch:tuning-applied
steps:
  # Scoped to one space because the tag API writes to the space's own alerts index, so
  # a cross-space harvest would keep rediagnosing alerts it can never mark.
  # `allow_partial_results: false` because a partial aggregation would both undercount
  # fp_count and return a short alert_ids list, leaving alerts that drove a decision
  # untagged. The 1000-id slice keeps the bulk tag request inside Kibana's payload
  # limit; a rule noisier than that surfaces again on the next sweep.
  - name: harvest_fp_alerts_by_rule
    type: elasticsearch.esql.query
    with:
      allow_partial_results: false
      query: |-
        FROM .alerts-security.alerts-{{ workflow.spaceId }} METADATA _id
        | WHERE `kibana.alert.workflow_status` == "closed"
          AND `kibana.alert.workflow_reason` == "false_positive"
          AND @timestamp >= NOW() - {{ inputs.lookback_hours }} hours
          AND NOT MV_CONTAINS(`kibana.alert.workflow_tags`, "{{ consts.reviewed_tag }}")
        | STATS fp_count = COUNT(*), last_fp_at = MAX(@timestamp), alert_ids = MV_SLICE(VALUES(_id), 0, 999) BY `kibana.alert.rule.uuid`, `kibana.alert.rule.name`, `kibana.alert.rule.rule_id`
        | WHERE fp_count >= {{ inputs.min_fp_count }}
        | KEEP `kibana.alert.rule.uuid`, `kibana.alert.rule.name`, fp_count, `kibana.alert.rule.rule_id`, last_fp_at, alert_ids
        | SORT fp_count DESC
        | LIMIT 10
    on-failure:
      continue: true

  # No iteration-timeout: an enclosing step-timeout zone would cut short the 72h
  # approval gate below. Runaway work is bounded by the agent step's own timeout.
  - name: tune_each_rule
    type: foreach
    foreach: "${{ steps.harvest_fp_alerts_by_rule.output.values | default: consts.no_rows }}"
    steps:
      - name: fetch_rule
        type: kibana.request
        with:
          method: GET
          path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules?rule_id={{ foreach.item.3 }}"
          headers:
            kbn-xsrf: string
            elastic-api-version: "2023-10-31"
            Content-Type: application/json
        on-failure:
          continue: true

      - name: diagnose_rule
        type: ai.agent
        if: "${{ steps.fetch_rule.error == null and steps.fetch_rule.output.enabled == true }}"
        timeout: "10m"
        create-conversation: true
        with:
          message: |-
            Use the [/investigate-rule](skill://investigate-rule) skill to investigate
            rule_id "{{ foreach.item.3 }}" ({{ foreach.item.1 }}).

            {{ foreach.item.2 }} alerts from this rule were closed as false positives
            during the last {{ inputs.lookback_hours }} hours. These are confirmed
            analyst dispositions — not suspected noise.

            After investigating, return one structured tuning proposal using the schema.
            Choose exactly one change_type in this order of preference:

            exception  — The rule logic is correct but fires on a known-good entity.
              Use the entity breakdown above to identify the tightest conditions.
              Populate exception_entries; each entry is one field condition the step
              will AND together. Supported operators:
                is / is_not              → single value string
                is_one_of / is_not_one_of → values array
                matches / does_not_match  → glob pattern string (* and ?)
                exists / does_not_exist   → no value needed

            query  — The query is too broad and FPs share a pattern not worth
              excepting individually. Only valid for rule type "query". Populate
              proposed_query with the full narrowed KQL in the same language.

            suppression  — The same entity is generating repeated duplicate alerts.
              Populate suppression_group_by with 1–3 field names to group by. Prefer
              this over exception only when the entity itself is legitimately active
              but the alert volume is the problem (e.g. a known scanner host).

            risk_score  — The rule has real detection value but the alerts are
              low-priority noise. Populate proposed_risk_score (0–100) and
              proposed_severity (low / medium / high / critical).

            disable  — Last resort. The rule has no detection value or is fully
              redundant with another active rule.

            manual  — None of the above is safe to apply automatically. Use summary
              to describe the recommended manual change.
          schema:
            type: object
            properties:
              change_type:
                type: string
                enum: [exception, query, suppression, risk_score, disable, manual]
              summary:
                type: string
              exception_entries:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    operator:
                      type: string
                      enum: [is, is_not, is_one_of, is_not_one_of, matches, does_not_match, exists, does_not_exist]
                    value:
                      type: string
                    values:
                      type: array
                      items:
                        type: string
                  required: [field, operator]
              proposed_query:
                type: string
              suppression_group_by:
                type: array
                items:
                  type: string
                minItems: 1
                maxItems: 3
              proposed_risk_score:
                type: integer
                minimum: 0
                maximum: 100
              proposed_severity:
                type: string
                enum: [low, medium, high, critical]
            required: [change_type, summary]

      # Both previews end at the last false positive, not at now, so the rule's own
      # `from` lookback covers the events analysts judged. Anchoring at now would
      # backtest a window where those events no longer exist.
      - name: preview_current_query
        type: workflow.execute
        if: >-
          ${{ steps.diagnose_rule.output.structured_output.change_type == 'query'
            and steps.diagnose_rule.output.structured_output.proposed_query != ''
            and steps.fetch_rule.output.type == 'query' }}
        with:
          workflow-id: system-security-rule-preview
          inputs:
            space_id: "{{ workflow.spaceId }}"
            preview_body:
              type: query
              name: "{{ steps.fetch_rule.output.name }}"
              description: "{{ steps.fetch_rule.output.description }}"
              query: "{{ steps.fetch_rule.output.query }}"
              language: "{{ steps.fetch_rule.output.language }}"
              index: "${{ steps.fetch_rule.output.index }}"
              severity: "{{ steps.fetch_rule.output.severity }}"
              risk_score: "${{ steps.fetch_rule.output.risk_score }}"
              interval: "{{ steps.fetch_rule.output.interval }}"
              from: "{{ steps.fetch_rule.output.from }}"
              to: "{{ steps.fetch_rule.output.to }}"
              invocationCount: "${{ inputs.preview_invocation_count }}"
              timeframeEnd: "{{ foreach.item.4 }}"

      - name: preview_proposed_query
        type: workflow.execute
        if: >-
          ${{ steps.diagnose_rule.output.structured_output.change_type == 'query'
            and steps.diagnose_rule.output.structured_output.proposed_query != ''
            and steps.fetch_rule.output.type == 'query' }}
        with:
          workflow-id: system-security-rule-preview
          inputs:
            space_id: "{{ workflow.spaceId }}"
            preview_body:
              type: query
              name: "{{ steps.fetch_rule.output.name }}"
              description: "{{ steps.fetch_rule.output.description }}"
              query: "{{ steps.diagnose_rule.output.structured_output.proposed_query }}"
              language: "{{ steps.fetch_rule.output.language }}"
              index: "${{ steps.fetch_rule.output.index }}"
              severity: "{{ steps.fetch_rule.output.severity }}"
              risk_score: "${{ steps.fetch_rule.output.risk_score }}"
              interval: "{{ steps.fetch_rule.output.interval }}"
              from: "{{ steps.fetch_rule.output.from }}"
              to: "{{ steps.fetch_rule.output.to }}"
              invocationCount: "${{ inputs.preview_invocation_count }}"
              timeframeEnd: "{{ foreach.item.4 }}"

      - name: review_tuning
        type: waitForApproval
        if: "${{ steps.diagnose_rule.output.structured_output.summary != null }}"
        timeout: "72h"
        with:
          approveLabel: Apply tuning
          rejectLabel: Dismiss
          message: |-
            Rule tuning proposal for {{ foreach.item.1 }}
            {{ foreach.item.2 }} alerts were closed as false positives.

            {{ steps.diagnose_rule.output.structured_output.summary }}

            {% if steps.diagnose_rule.output.structured_output.change_type == "exception" %}
            Proposed exception:
            {% for entry in steps.diagnose_rule.output.structured_output.exception_entries %}
            - {{ entry.field }} {{ entry.operator }} {{ entry.value }}
            {% endfor %}
            Approving adds the exception to the rule's own exception list. It can be removed in the Detection Rules UI.
            {% endif %}
            {% if steps.diagnose_rule.output.structured_output.change_type == "query" %}
            Current query:
            {{ steps.fetch_rule.output.query }}

            Proposed query:
            {{ steps.diagnose_rule.output.structured_output.proposed_query }}

            Backtest:
            current {% if steps.preview_current_query.output.succeeded and steps.preview_current_query.output.is_aborted == false %}{{ steps.preview_current_query.output.alert_count }}{% else %}inconclusive{% endif %},
            proposed {% if steps.preview_proposed_query.output.succeeded and steps.preview_proposed_query.output.is_aborted == false %}{{ steps.preview_proposed_query.output.alert_count }}{% else %}inconclusive{% endif %}.
            {% if steps.preview_current_query.output.error_text != '' %}
            Current query preview errors: {{ steps.preview_current_query.output.error_text }}
            {% endif %}
            {% if steps.preview_proposed_query.output.error_text != '' %}
            Proposed query preview errors: {{ steps.preview_proposed_query.output.error_text }}
            {% endif %}
            Approving replaces the rule query. It can be edited back in the Detection Rules UI.
            {% endif %}
            {% if steps.diagnose_rule.output.structured_output.change_type == "suppression" %}
            Proposed alert suppression, grouped by:
            {% for field in steps.diagnose_rule.output.structured_output.suppression_group_by %}
            - {{ field }}
            {% endfor %}
            Approving enables alert suppression on the rule. Suppression cannot be removed
            automatically; undo it manually in the Detection Rules UI.
            {% endif %}
            {% if steps.diagnose_rule.output.structured_output.change_type == "risk_score" %}
            Proposed risk score: {{ steps.diagnose_rule.output.structured_output.proposed_risk_score }}
            Proposed severity: {{ steps.diagnose_rule.output.structured_output.proposed_severity }}
            Approving patches the rule's risk score and severity. It can be changed back in the Detection Rules UI.
            {% endif %}
            {% if steps.diagnose_rule.output.structured_output.change_type == "disable" %}
            This proposal disables the rule entirely. This is a last resort — only approve
            if you are confident the rule provides no detection value or is fully redundant.
            Approving disables the rule. It can be re-enabled in the Detection Rules UI.
            {% endif %}
            {% if steps.diagnose_rule.output.structured_output.change_type == "manual" %}
            No automated change can be applied safely. Approving records the handoff;
            apply the recommended change manually in the Detection Rules UI.
            {% endif %}

            {% if steps.diagnose_rule.output.conversation_id %}
            Continue investigation: /app/agent_builder/conversations/{{ steps.diagnose_rule.output.conversation_id }}
            {% endif %}

      # Decided once so the apply and hand-off branches stay exact complements.
      - name: classify_proposal
        type: data.set
        with:
          can_apply_query: >-
            ${{ steps.diagnose_rule.output.structured_output.change_type == 'query'
              and steps.diagnose_rule.output.structured_output.proposed_query != ''
              and steps.fetch_rule.output.type == 'query'
              and steps.preview_proposed_query.output.succeeded == true
              and steps.preview_proposed_query.output.is_aborted == false }}
          can_apply_exception: >-
            ${{ steps.diagnose_rule.output.structured_output.change_type == 'exception'
              and steps.diagnose_rule.output.structured_output.exception_entries != null }}
          can_apply_suppression: >-
            ${{ steps.diagnose_rule.output.structured_output.change_type == 'suppression'
              and steps.diagnose_rule.output.structured_output.suppression_group_by != null }}
          can_apply_risk_score: >-
            ${{ steps.diagnose_rule.output.structured_output.change_type == 'risk_score'
              and steps.diagnose_rule.output.structured_output.proposed_risk_score != null }}
          can_apply_disable: >-
            ${{ steps.diagnose_rule.output.structured_output.change_type == 'disable' }}

      - name: apply_query_tuning
        type: kibana.request
        if: >-
          ${{ steps.review_tuning.output.response.approved == true
            and steps.classify_proposal.output.can_apply_query == true }}
        on-failure:
          continue: true
        with:
          method: PATCH
          path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules"
          headers:
            kbn-xsrf: string
            elastic-api-version: "2023-10-31"
            Content-Type: application/json
          body:
            id: "{{ foreach.item.0 }}"
            query: "{{ steps.diagnose_rule.output.structured_output.proposed_query }}"

      # Stable item_id so a re-approved proposal for the same rule overwrites
      # its exception item instead of stacking duplicates run after run.
      - name: apply_exception_tuning
        type: security.createRuleException
        if: >-
          ${{ steps.review_tuning.output.response.approved == true
            and steps.classify_proposal.output.can_apply_exception == true }}
        on-failure:
          continue: true
        with:
          rule_id: "{{ foreach.item.0 }}"
          item_id: "tuning-{{ foreach.item.0 }}"
          overwrite: true
          name: "Tuning: {{ foreach.item.1 }}"
          description: "Added by the rule tuning workflow."
          entries: "${{ steps.diagnose_rule.output.structured_output.exception_entries }}"

      - name: apply_suppression_tuning
        type: kibana.request
        if: >-
          ${{ steps.review_tuning.output.response.approved == true
            and steps.classify_proposal.output.can_apply_suppression == true }}
        on-failure:
          continue: true
        with:
          method: PATCH
          path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules"
          headers:
            kbn-xsrf: string
            elastic-api-version: "2023-10-31"
            Content-Type: application/json
          body:
            id: "{{ foreach.item.0 }}"
            alert_suppression:
              group_by: "${{ steps.diagnose_rule.output.structured_output.suppression_group_by }}"

      - name: apply_risk_score_tuning
        type: kibana.request
        if: >-
          ${{ steps.review_tuning.output.response.approved == true
            and steps.classify_proposal.output.can_apply_risk_score == true }}
        on-failure:
          continue: true
        with:
          method: PATCH
          path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules"
          headers:
            kbn-xsrf: string
            elastic-api-version: "2023-10-31"
            Content-Type: application/json
          body:
            id: "{{ foreach.item.0 }}"
            risk_score: "${{ steps.diagnose_rule.output.structured_output.proposed_risk_score }}"
            severity: "{{ steps.diagnose_rule.output.structured_output.proposed_severity }}"

      - name: apply_disable_tuning
        type: security.disableRule
        if: >-
          ${{ steps.review_tuning.output.response.approved == true
            and steps.classify_proposal.output.can_apply_disable == true }}
        on-failure:
          continue: true
        with:
          ids: ["{{ foreach.item.0 }}"]

      - name: record_manual_tuning
        type: data.set
        if: >-
          ${{ steps.review_tuning.output.response.approved == true
            and steps.classify_proposal.output.can_apply_query == false
            and steps.classify_proposal.output.can_apply_exception == false
            and steps.classify_proposal.output.can_apply_suppression == false
            and steps.classify_proposal.output.can_apply_risk_score == false
            and steps.classify_proposal.output.can_apply_disable == false }}
        with:
          rule_id: "{{ foreach.item.0 }}"
          note: Apply the approved proposal in the Detection Rules UI.

      # An approved proposal whose apply step errored must not vanish silently.
      - name: record_failed_apply
        type: data.set
        if: >-
          ${{ steps.apply_query_tuning.error != null
            or steps.apply_exception_tuning.error != null
            or steps.apply_suppression_tuning.error != null
            or steps.apply_risk_score_tuning.error != null
            or steps.apply_disable_tuning.error != null }}
        with:
          rule_id: "{{ foreach.item.0 }}"
          note: >-
            The approved tuning change failed to apply automatically. Apply it in the
            Detection Rules UI.

      # ES|QL rows arrive as positional arrays, so `item.5` is the sixth field the
      # harvest's KEEP projects: the alert_ids multivalue.
      - name: mark_alerts_dismissed
        type: security.setAlertTags
        if: "${{ steps.review_tuning.output.response.approved == false }}"
        with:
          alert_ids: "${{ foreach.item.5 }}"
          tags_to_add:
            - detection-watch:tuning-reviewed
            - detection-watch:tuning-dismissed
          tags_to_remove: []
        on-failure:
          continue: true

      - name: mark_alerts_applied
        type: security.setAlertTags
        if: "${{ steps.review_tuning.output.response.approved == true }}"
        with:
          alert_ids: "${{ foreach.item.5 }}"
          tags_to_add:
            - detection-watch:tuning-reviewed
            - detection-watch:tuning-applied
          tags_to_remove: []
        on-failure:
          continue: true

  # Size is computed on its own because comparison operators cannot follow a filter chain.
  - name: count_examined_rules
    type: data.set
    with:
      rules_examined: "${{ steps.harvest_fp_alerts_by_rule.output.values | size | default: 0 }}"

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      rules_examined: "${{ steps.count_examined_rules.output.rules_examined }}"
      harvest_failed: "${{ steps.harvest_fp_alerts_by_rule.error != null }}"
