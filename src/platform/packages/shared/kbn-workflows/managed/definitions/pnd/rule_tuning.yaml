version: "1"
name: Detection Rule Tuning Worker
description: >
  Harvests rules whose alerts analysts closed as false positives, diagnoses each one,
  and applies the approved tuning change: a rule exception or a narrowed query.
enabled: true
tags:
  - security
  - detection-rule-tuning
settings:
  concurrency:
    key: detection-rule-tuning
    strategy: drop
    max: 1
triggers:
  - type: manual
    inputs:
      properties:
        min_fp_count:
          type: number
          default: 1
          description: Minimum false-positive alerts a rule needs before it is diagnosed.
        preview_invocation_count:
          type: number
          default: 2
          description: Rule executions each backtest preview simulates.
        lookback_hours:
          type: number
          default: 24
          description: How far back to look for alerts analysts closed as false positives.
      additionalProperties: false
outputs:
  - name: rules_examined
    type: number
  - name: harvest_failed
    type: boolean
consts:
  # Liquid has no array literal, so `| default: []` yields undefined rather than an
  # empty array. A const is the only way to spell an empty-array fallback.
  no_rows: []
steps:
  - name: harvest_fp_alerts_by_rule
    type: elasticsearch.esql.query
    with:
      query: |-
        FROM .alerts-security.alerts-*
        | WHERE `kibana.alert.workflow_status` == "closed"
          AND `kibana.alert.workflow_reason` == "false_positive"
          AND @timestamp >= NOW() - {{ inputs.lookback_hours }} hours
        | STATS fp_count = COUNT(*), last_fp_at = MAX(@timestamp) BY `kibana.alert.rule.uuid`, `kibana.alert.rule.name`, `kibana.alert.rule.rule_id`
        | WHERE fp_count >= {{ inputs.min_fp_count }}
        | KEEP `kibana.alert.rule.uuid`, `kibana.alert.rule.name`, fp_count, `kibana.alert.rule.rule_id`, last_fp_at
        | SORT fp_count DESC
        | LIMIT 25
    on-failure:
      continue: true

  # No iteration-timeout: an enclosing step-timeout zone would cut short the 72h
  # approval gate below. Runaway work is bounded by the diagnose step's own timeout.
  - name: tune_each_rule
    type: foreach
    foreach: "${{ steps.harvest_fp_alerts_by_rule.output.values | default: consts.no_rows }}"
    steps:
      - name: fetch_rule
        type: kibana.request
        with:
          method: GET
          path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules?rule_id={{ foreach.item.3 }}"
          headers:
            kbn-xsrf: string
            elastic-api-version: "2023-10-31"
            Content-Type: application/json
        on-failure:
          continue: true

      - name: diagnose_rule
        type: ai.agent
        if: "${{ steps.fetch_rule.error == null and steps.fetch_rule.output.enabled == true }}"
        timeout: "10m"
        create-conversation: true
        with:
          message: |-
            Use the [/investigate-rule](skill://investigate-rule) skill to investigate
            rule_id "{{ foreach.item.3 }}" ({{ foreach.item.1 }}).

            {{ foreach.item.2 }} alerts from this rule were closed as false positives
            during the last {{ inputs.lookback_hours }} hours. These are confirmed
            analyst dispositions — not suspected noise.

            Return one structured tuning proposal. For confirmed false positives,
            prefer change_type "exception": identify the shared field values across
            the closed alerts and propose the tightest condition that matches the
            confirmed pattern. Use change_type "query" only when the query is
            genuinely over-broad and this rule has type
            "{{ steps.fetch_rule.output.type }}" — include the full replacement
            query in proposed_query. Use "manual" when neither applies.
          schema:
            type: object
            properties:
              change_type:
                type: string
                enum: [exception, query, manual]
              summary:
                type: string
              proposed_query:
                type: string
              exception_entries:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    operator:
                      type: string
                      enum: [is, is_not, is_one_of, is_not_one_of, matches, does_not_match]
                    value:
                      type: string
                  required: [field, operator, value]
            required: [change_type, summary]

      # Both previews end at the last false positive, not at now, so the rule's own
      # `from` lookback covers the events analysts judged. Anchoring at now would
      # backtest a window where those events no longer exist.
      - name: preview_current_query
        type: workflow.execute
        if: >-
          ${{ steps.diagnose_rule.output.structured_output.proposed_query != ''
            and steps.fetch_rule.output.type == 'query' }}
        with:
          workflow-id: system-security-rule-preview
          inputs:
            space_id: "{{ workflow.spaceId }}"
            preview_body:
              type: query
              name: "{{ steps.fetch_rule.output.name }}"
              description: "{{ steps.fetch_rule.output.description }}"
              query: "{{ steps.fetch_rule.output.query }}"
              language: "{{ steps.fetch_rule.output.language }}"
              index: "${{ steps.fetch_rule.output.index }}"
              severity: "{{ steps.fetch_rule.output.severity }}"
              risk_score: "${{ steps.fetch_rule.output.risk_score }}"
              interval: "{{ steps.fetch_rule.output.interval }}"
              from: "{{ steps.fetch_rule.output.from }}"
              to: "{{ steps.fetch_rule.output.to }}"
              invocationCount: "${{ inputs.preview_invocation_count }}"
              timeframeEnd: "{{ foreach.item.4 }}"

      - name: preview_proposed_query
        type: workflow.execute
        if: >-
          ${{ steps.diagnose_rule.output.structured_output.proposed_query != ''
            and steps.fetch_rule.output.type == 'query' }}
        with:
          workflow-id: system-security-rule-preview
          inputs:
            space_id: "{{ workflow.spaceId }}"
            preview_body:
              type: query
              name: "{{ steps.fetch_rule.output.name }}"
              description: "{{ steps.fetch_rule.output.description }}"
              query: "{{ steps.diagnose_rule.output.structured_output.proposed_query }}"
              language: "{{ steps.fetch_rule.output.language }}"
              index: "${{ steps.fetch_rule.output.index }}"
              severity: "{{ steps.fetch_rule.output.severity }}"
              risk_score: "${{ steps.fetch_rule.output.risk_score }}"
              interval: "{{ steps.fetch_rule.output.interval }}"
              from: "{{ steps.fetch_rule.output.from }}"
              to: "{{ steps.fetch_rule.output.to }}"
              invocationCount: "${{ inputs.preview_invocation_count }}"
              timeframeEnd: "{{ foreach.item.4 }}"

      - name: review_tuning
        type: waitForApproval
        if: "${{ steps.diagnose_rule.output.structured_output.summary != null }}"
        timeout: "72h"
        with:
          approveLabel: Apply tuning
          rejectLabel: Dismiss
          message: |-
            Rule tuning proposal for {{ foreach.item.1 }}
            {{ foreach.item.2 }} alerts were closed in the last {{ inputs.lookback_hours }} hours.

            {{ steps.diagnose_rule.output.structured_output.summary }}

            {% if steps.diagnose_rule.output.structured_output.change_type == "exception" %}
            Proposed exception:
            {% for entry in steps.diagnose_rule.output.structured_output.exception_entries %}
            - {{ entry.field }} {{ entry.operator }} {{ entry.value }}
            {% endfor %}
            Approving adds the exception to the rule's own exception list. It can be removed in the Detection Rules UI.
            {% endif %}
            {% if steps.diagnose_rule.output.structured_output.change_type == "query" %}
            Current query:
            {{ steps.fetch_rule.output.query }}

            Proposed query:
            {{ steps.diagnose_rule.output.structured_output.proposed_query }}

            Backtest:
            current {% if steps.preview_current_query.output.succeeded and steps.preview_current_query.output.is_aborted == false %}{{ steps.preview_current_query.output.alert_count }}{% else %}inconclusive{% endif %},
            proposed {% if steps.preview_proposed_query.output.succeeded and steps.preview_proposed_query.output.is_aborted == false %}{{ steps.preview_proposed_query.output.alert_count }}{% else %}inconclusive{% endif %}.

            Approving replaces the rule query. It can be edited back in the Detection Rules UI.
            {% endif %}
            {% if steps.diagnose_rule.output.structured_output.change_type == "manual" %}
            No automated change can be applied safely. Approving records the handoff;
            apply the recommended change manually in the Detection Rules UI.
            {% endif %}

      # Decided once so the apply and hand-off branches stay exact complements. Grouping
      # an `or` chain with parentheses is a tokenization error in these expressions.
      - name: classify_proposal
        type: data.set
        with:
          can_apply_query: >-
            ${{ steps.diagnose_rule.output.structured_output.change_type == 'query'
              and steps.diagnose_rule.output.structured_output.proposed_query != ''
              and steps.fetch_rule.output.type == 'query'
              and steps.preview_proposed_query.output.succeeded == true
              and steps.preview_proposed_query.output.is_aborted == false }}
          can_apply_exception: >-
            ${{ steps.diagnose_rule.output.structured_output.change_type == 'exception'
              and steps.diagnose_rule.output.structured_output.exception_entries != null }}

      - name: apply_query_tuning
        type: kibana.request
        if: >-
          ${{ steps.review_tuning.output.response.approved == true
            and steps.classify_proposal.output.can_apply_query == true }}
        on-failure:
          continue: true
        with:
          method: PATCH
          path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules"
          headers:
            kbn-xsrf: string
            elastic-api-version: "2023-10-31"
            Content-Type: application/json
          body:
            id: "{{ foreach.item.0 }}"
            query: "{{ steps.diagnose_rule.output.structured_output.proposed_query }}"

      # Stable item_id so a re-approved proposal for the same rule overwrites
      # its exception item instead of stacking duplicates run after run.
      - name: apply_exception_tuning
        type: security.createRuleException
        if: >-
          ${{ steps.review_tuning.output.response.approved == true
            and steps.classify_proposal.output.can_apply_exception == true }}
        on-failure:
          continue: true
        with:
          rule_id: "{{ foreach.item.0 }}"
          item_id: "tuning-{{ foreach.item.0 }}"
          overwrite: true
          name: "Tuning: {{ foreach.item.1 }}"
          description: "Added by the rule tuning workflow."
          entries: "${{ steps.diagnose_rule.output.structured_output.exception_entries }}"

      - name: record_manual_tuning
        type: data.set
        if: >-
          ${{ steps.review_tuning.output.response.approved == true
            and steps.classify_proposal.output.can_apply_query == false
            and steps.classify_proposal.output.can_apply_exception == false }}
        with:
          rule_id: "{{ foreach.item.0 }}"
          note: Apply the approved proposal in the Detection Rules UI.

      # An approved proposal whose apply step errored must not vanish silently.
      - name: record_failed_apply
        type: data.set
        if: >-
          ${{ steps.apply_query_tuning.error != null
            or steps.apply_exception_tuning.error != null }}
        with:
          rule_id: "{{ foreach.item.0 }}"
          note: >-
            The approved tuning change failed to apply automatically. Apply it in the
            Detection Rules UI.

  # Size is computed on its own because comparison operators cannot follow a filter chain.
  - name: count_examined_rules
    type: data.set
    with:
      rules_examined: "${{ steps.harvest_fp_alerts_by_rule.output.values | size | default: 0 }}"

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      rules_examined: "${{ steps.count_examined_rules.output.rules_examined }}"
      harvest_failed: "${{ steps.harvest_fp_alerts_by_rule.error != null }}"
