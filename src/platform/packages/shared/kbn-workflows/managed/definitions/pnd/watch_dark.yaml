version: "1"
name: Dark Watch
description: >
  Dark Watch skeleton. Continuous, technology-aware hunting with overnight UTC
  sweeps and reviewable findings.
enabled: false
tags:
  - watch
  - watch-dark
triggers:
  - type: scheduled
    with:
      rrule:
        freq: DAILY
        interval: 1
        tzid: UTC
        byhour: [22, 23, 0, 1, 2, 3, 4, 5]
        byminute: [0]
  - type: manual
consts:
  watch_policy:
    settingsVersion: __WATCH_SETTINGS_VERSION__
    # Persisted plumbing only; runtime autonomy semantics are defined separately.
    autonomy: "__WATCH_AUTONOMY_LEVEL__"
    mandate: Continuous, technology-aware hunting for relevant threats and coverage gaps
    ui:
      color: "#f59e0b"
      order: 30
steps:
  - name: hunt_stub
    type: console
    with:
      message: "Dark Watch skeleton hunt pass — add ai.agent / skill steps (see Floor)"
