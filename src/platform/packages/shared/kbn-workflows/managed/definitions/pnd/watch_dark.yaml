version: "1"
name: Dark Watch
description: >
  Dark Watch. Continuous hunt-style sweeps with threat-intelligence
  correlation and IoC validation against environment telemetry.
  Escalates findings to Deep Watch for specialist analysis.
enabled: true
tags:
  - watch
  - watch-dark
triggers:
  - type: scheduled
    with:
      every: "60m"
  - type: manual
steps:
  - name: watch_policy
    type: data.set
    with:
      watch:
        mandate: Continuous threat hunting & IoC correlation
        autonomyLevel: 5
        handoff: brief
        onDemand: false
        draft: false
        cadence: sweep
        every: 60
        from: 22
        to: 6
        mode: window
        ui:
          color: "#f59e0b"
          icon: bolt
          order: 30
        scopeSummary: Threat intel · Security indices · EDR · network
        scopes:
          - name: Threat intelligence
            access: full
            label: Read
          - name: Security indices
            access: full
            label: Read
          - name: EDR · network
            access: full
            label: Read
        callables:
          - id: threat-intelligence
            name: Threat intel hunt
            kind: skill
            summary: Scheduled · correlates threat reports with environment telemetry
            gated: false
            enabled: true
          - id: alert-analysis
            name: Alert analysis
            kind: skill
            summary: On alert · classifies FP / TP / inconclusive
            gated: false
            enabled: true
  - name: threat_intel_hunt
    type: ai.agent
    timeout: "10m"
    create-conversation: true
    with:
      message: >
        Use the [/threat-intelligence](skill://threat-intelligence) skill to
        perform a threat-intelligence hunt sweep.

        1. Scan indexed threat reports for newly published IoCs and TTPs
        2. Correlate IoCs (IPs, hashes, domains) against environment telemetry
           using ES|QL queries against endpoint events, network flows, and alerts
        3. Identify coverage gaps — MITRE techniques in reports without matching
           detection rules
        4. Produce findings with confidence scores and recommended hunts
        5. Escalate high-confidence hits to Deep Watch for forensic investigation

        Escalation context: {{trigger.context}}
  - name: escalate_to_deep
    type: data.set
    with:
      reasoning:
        summary: "Dark Watch sweep complete — high-confidence findings escalated to Deep Watch"
        sections:
          - title: FINDINGS
            body: "{{steps.threat_intel_hunt.output}}"
          - title: NEXT
            body: "Deep Watch will perform forensic analysis on escalated IoCs and produce a draft report."
