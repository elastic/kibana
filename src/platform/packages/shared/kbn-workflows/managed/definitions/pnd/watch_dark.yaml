version: "1"
name: Dark Watch
description: >
  Dark Watch skeleton. Continuous, technology-aware hunting with overnight UTC
  sweeps and reviewable findings.
enabled: true
tags:
  - watch
  - watch-dark
triggers:
  - type: scheduled
    with:
      rrule:
        freq: DAILY
        interval: 1
        tzid: UTC
        byhour: [22, 23, 0, 1, 2, 3, 4, 5]
        byminute: [0]
  - type: manual
consts:
  watch_policy:
    mandate: Continuous, technology-aware hunting for relevant threats and coverage gaps
    autonomyLevel: 2
    handoff: brief
    onDemand: true
    draft: false
    cadence: sweep
    every: 60
    from: 22
    to: 6
    mode: window
    ui:
      color: "#f59e0b"
      icon: bolt
      order: 30
    scopeSummary: Mail · IdP · edge / VPN
    scopes:
      - name: Mail · IdP
        access: full
        label: Read + monitor
      - name: Edge / VPN
        access: full
        label: Read + monitor
      - name: Customer data
        access: denied
        label: No access
    # Capabilities projected from executable steps — see Watch Floor.
    callables: []
steps:
  - name: hunt_stub
    type: console
    with:
      message: "Dark Watch skeleton hunt pass — add ai.agent / skill steps (see Floor)"
