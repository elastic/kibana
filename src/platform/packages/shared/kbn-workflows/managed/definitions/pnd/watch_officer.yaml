version: "1"
name: Watch Officer
description: >
  Tier-2 Security Watch Officer skeleton. Escalates criticals, drafts briefs,
  and stages gated response proposals for human approval.
enabled: false
tags:
  - watch
  - watch-officer
triggers:
  - type: manual
consts:
  watch_policy:
    settingsVersion: __WATCH_SETTINGS_VERSION__
    # Persisted plumbing only; runtime autonomy semantics are defined separately.
    autonomy: "__WATCH_AUTONOMY_LEVEL__"
    mandate: Escalation & briefs
    ui:
      color: "#3b82f6"
      order: 20
steps:
  - name: draft_proposal
    type: data.set
    with:
      reasoning:
        summary: "Watch Officer skeleton — staged a gated proposal for review."
        sections:
          - title: NEXT
            body: "Replace with investigation / proposal skills and real evidence."
  - name: await_approval
    type: waitForInput
    with:
      message: "Approve the Watch Officer draft proposal?"
      schema:
        type: object
        properties:
          decision:
            type: string
            enum: [approve, modify, dismiss]
        required: [decision]
