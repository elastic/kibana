version: "1"
name: Watch Officer
description: >
  Tier-2 Security Watch Officer skeleton. Escalates criticals, drafts briefs,
  and stages gated response proposals for human approval.
enabled: false
tags:
  - watch
  - watch-officer
triggers:
  - type: manual
consts:
  watch_policy:
    settingsVersion: __WATCH_SETTINGS_VERSION__
    # Persisted plumbing only; runtime autonomy is request-time from template values.
    autonomy: "__WATCH_AUTONOMY_LEVEL__"
    mandate: Escalation & briefs
    autonomyLevel: manual
    handoff: oncall
    onDemand: false
    draft: false
    cadence: stream
    mode: always
    ui:
      color: "#3b82f6"
      icon: bell
      order: 20
    scopeSummary: Open threads · on-call · deploys
    scopes:
      - name: Open threads · cases
        access: full
        label: Read
      - name: On-call schedule
        access: full
        label: Read
      - name: Deploy history
        access: full
        label: Read
    # Capabilities are projected from executable steps (see Floor). Add
    # ai.agent skill://… or workflow.execute targets, then optional overrides here.
    callables: []
steps:
  - name: draft_proposal
    type: data.set
    with:
      reasoning:
        summary: "Watch Officer skeleton — staged a gated proposal for review."
        sections:
          - title: NEXT
            body: "Replace with investigation / proposal skills and real evidence."
  - name: await_approval
    type: waitForInput
    with:
      message: "Approve the Watch Officer draft proposal?"
      schema:
        type: object
        properties:
          decision:
            type: string
            enum: [approve, modify, dismiss]
        required: [decision]
