version: "1"
name: PoC action worker
description: >
  Temporary AlertZero worker proving the action proposal flow end to end: an
  agent suggests a detection rule, the proposal gate collects a human decision,
  and the action runs as the approver. Remove once the flow is validated.
enabled: false
tags:
  - watch
  - alertzero
  - poc
triggers:
  - type: manual
steps:
  - name: suggest_action
    type: ai.agent
    timeout: "10m"
    create-conversation: true
    with:
      message: >
        You are proposing a detection rule for an analyst to review. Propose a
        single "create detection rule" action using the action workflow id
        `system-alertzero-action-create-rule`.

        Invent a plausible but harmless rule for a proof of concept: a short
        name prefixed with "PoC", a one-sentence description, a simple KQL
        query, and the index pattern `logs-*`. Explain in `comment` what the
        rule would detect and why it is worth creating.
      schema:
        type: object
        properties:
          actionWorkflowId:
            type: string
            enum:
              - system-alertzero-action-create-rule
            description: The action workflow to run once approved.
          comment:
            type: string
            description: What is being proposed and why, for the analyst to read.
          impact:
            type: string
            enum:
              - low
              - medium
              - high
              - critical
          confidence:
            type: string
            enum:
              - low
              - medium
              - high
          actionInput:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              query:
                type: string
              index:
                type: array
                items:
                  type: string
              severity:
                type: string
                enum:
                  - low
                  - medium
                  - high
                  - critical
              risk_score:
                type: number
            required:
              - name
              - description
              - query
        required:
          - actionWorkflowId
          - comment
          - actionInput

  # A managed parent is required to execute a managed child, which this
  # workflow is. autoApprove is left unset so the gate always runs.
  - name: propose_action
    type: workflow.execute
    with:
      workflow-id: system-create-conversation-proposal
      inputs:
        conversationId: "{{ steps.suggest_action.output.conversation_id }}"
        comment: "{{ steps.suggest_action.output.structured_output.comment }}"
        actionWorkflowId: "{{ steps.suggest_action.output.structured_output.actionWorkflowId }}"
        actionInput: "${{ steps.suggest_action.output.structured_output.actionInput }}"
        impact: "{{ steps.suggest_action.output.structured_output.impact | default: 'low' }}"
        confidence: "{{ steps.suggest_action.output.structured_output.confidence | default: 'medium' }}"

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      conversationId: "{{ steps.suggest_action.output.conversation_id }}"
      proposalOutcome: "${{ steps.propose_action.output }}"
