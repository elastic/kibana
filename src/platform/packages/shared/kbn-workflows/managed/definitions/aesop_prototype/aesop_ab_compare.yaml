version: '1'
name: 'AESOP A/B Skill Compare (prototype)'
description: >-
  AESOP prototype: A/B tests up to three candidate skill variants against a
  no-skill baseline (and the live skill, when one exists) through the evals
  plugin, picks a winner, and proposes deploying it. On approval it creates or
  updates the skill; a rejected or dismissed candidate is recorded as a
  knowledge indicator so the explorer does not propose it again.
enabled: true
tags:
  - security
  - aesop_prototype
settings:
  # The whole run (every arm, the compare and the parked approval gate) must
  # fit inside one workflow timeout, or the gate is cancelled under the
  # analyst. 72h decision window plus evaluation headroom.
  timeout: '96h'
  concurrency:
    # A run that proposes a new skill has no skill id yet, so it keys on its
    # own execution id and never collides.
    key: 'aesop-ab-{{ inputs.skill_id | default: execution.id }}'
    strategy: drop
    max: 1
consts:
  AI_INDEX_ID: aesop
  # Deterministic evaluators: an arm below 1 on any of these is rejected.
  CODE_EVALUATORS: ['skill-secret-scanner', 'skill-prompt-injection', 'skill-pii', 'esql-compile', 'skill-index-resolves']
outputs:
  - name: baseline_experiment_id
    type: string
  - name: winner_experiment_id
    type: string
  - name: decision
    type: string
  - name: deployed
    type: boolean
  - name: skill_id
    type: string
  - name: skip_reason
    type: string
triggers:
  - type: manual
    inputs:
      properties:
        skill_id:
          type: string
          maxLength: 128
          description: >-
            Id of the live skill being optimized. When set, the live skill is
            an extra arm and the winner is written back to it. Leave empty to
            propose a new skill instead.
        new_skill_name:
          type: string
          maxLength: 64
          description: Name of the new skill, used only when skill_id is empty.
        dataset_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Evals dataset id every arm runs against.
        connector_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Model connector every arm (and the judge) runs through.
        agent_id:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Agent the arms converse with. The AESOP task provider pins each
            arm's skill through configuration_overrides.skill_ids, so every arm
            runs the same agent and differs only in the skill.
        variants:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            minLength: 1
            maxLength: 60000
          description: >-
            Candidate instructions (markdown), one per variant. Each is
            compared with a no-skill baseline.
        repetitions:
          type: integer
          minimum: 1
          maximum: 10
          default: 2
          description: Runs per example per arm.
        concurrency:
          type: integer
          minimum: 1
          maximum: 10
          default: 2
          description: Max examples evaluated in parallel within each arm.
        investigation_id:
          type: string
          minLength: 1
          maxLength: 512
          description: >-
            Investigation (conversation) the A/B proposal is recorded on, so
            the analyst sees the decision next to the evidence.
      required: [dataset_id, connector_id, agent_id, variants, investigation_id]
      additionalProperties: false
steps:
  # ----------------------------------------------------------------------
  # State. Everything the later steps read lives in variables: data.set is
  # the only step type that survives a human-gate park. LiquidJS has no
  # array literal, so the empty lists are made here.
  # ----------------------------------------------------------------------
  - name: init_state
    type: data.set
    with:
      has_live_skill: "${{ inputs.skill_id != blank }}"
      target_skill_id: >-
        {% if inputs.skill_id != blank %}{{ inputs.skill_id }}{% else %}aesop-new-{{ execution.id }}{% endif %}
      target_skill_name: "{{ inputs.new_skill_name | default: 'AESOP skill' }}"
      baseline_scored: false
      experiment_ids: []
      arm_variant_indexes: []
      arm_count: 0
      can_compare: false
      winner_variant: ''
      winner_content: ''
      deploy_candidate: false
      reject_reason: ''
      deployed: false

  # ----------------------------------------------------------------------
  # Baseline arm: no skill at all. Every other arm is judged against it.
  # ----------------------------------------------------------------------
  - name: baseline_start
    type: ai.evals.startExperiment
    with:
      task_model:
        id: '{{ inputs.connector_id }}'
      suite_id: 'aesop-prototype'
    on-failure:
      continue: true

  - name: baseline_run
    type: ai.evals.evaluateDataset
    if: '${{ steps.baseline_start.error == null }}'
    with:
      connector_id: '{{ inputs.connector_id }}'
      agent_id: '{{ inputs.agent_id }}'
      task_ref: 'security.aesopVariant'
      params:
        no_skill: true
      experiment_id: '${{ steps.baseline_start.output.experiment_id }}'
      execution_id: '${{ steps.baseline_start.output.execution_id }}'
      suite_id: 'aesop-prototype'
      dataset_ids: ['{{ inputs.dataset_id }}']
      evaluators:
        - name: skill-secret-scanner
        - name: skill-prompt-injection
        - name: skill-pii
        - name: esql-compile
        - name: skill-index-resolves
        - name: correctness
          connector_id: '{{ inputs.connector_id }}'
      repetitions: '${{ inputs.repetitions }}'
      concurrency: '${{ inputs.concurrency }}'
    on-failure:
      continue: true

  # An arm with no ingested scores has no experiment to compare (the compare
  # API 404s), so it is left out of the list instead of failing the compare.
  - name: record_baseline
    type: data.set
    if: '${{ (steps.baseline_run.output.scores_ingested | default: 0) > 0 }}'
    with:
      baseline_scored: true
      experiment_ids: ['{{ steps.baseline_start.output.experiment_id }}']

  # ----------------------------------------------------------------------
  # Live-skill arm, only when there is a live skill. Its marker in
  # arm_variant_indexes is `live`, so the winner can be told apart from a
  # variant.
  # ----------------------------------------------------------------------
  - name: live_start
    type: ai.evals.startExperiment
    if: '${{ variables.has_live_skill == true and variables.baseline_scored == true }}'
    with:
      task_model:
        id: '{{ inputs.connector_id }}'
      suite_id: 'aesop-prototype'
    on-failure:
      continue: true

  - name: live_run
    type: ai.evals.evaluateDataset
    if: '${{ variables.has_live_skill == true and variables.baseline_scored == true and steps.live_start.error == null }}'
    with:
      connector_id: '{{ inputs.connector_id }}'
      agent_id: '{{ inputs.agent_id }}'
      task_ref: 'security.aesopVariant'
      params:
        skill_id: '{{ inputs.skill_id }}'
      experiment_id: '${{ steps.live_start.output.experiment_id }}'
      execution_id: '${{ steps.live_start.output.execution_id }}'
      suite_id: 'aesop-prototype'
      dataset_ids: ['{{ inputs.dataset_id }}']
      evaluators:
        - name: skill-secret-scanner
        - name: skill-prompt-injection
        - name: skill-pii
        - name: esql-compile
        - name: skill-index-resolves
        - name: correctness
          connector_id: '{{ inputs.connector_id }}'
      repetitions: '${{ inputs.repetitions }}'
      concurrency: '${{ inputs.concurrency }}'
    on-failure:
      continue: true

  - name: wrap_live_arm
    type: data.set
    if: '${{ (steps.live_run.output.scores_ingested | default: 0) > 0 }}'
    with:
      new_ids: "${{ steps.live_start.output.experiment_id | split: ',' }}"
      new_markers: ['live']

  - name: record_live_arm
    type: data.set
    if: '${{ (steps.live_run.output.scores_ingested | default: 0) > 0 }}'
    with:
      experiment_ids: "${{ variables.experiment_ids | concat: variables.new_ids }}"
      arm_variant_indexes: "${{ variables.arm_variant_indexes | concat: variables.new_markers }}"

  # ----------------------------------------------------------------------
  # Variant arms. Each candidate is created as a user skill (POST), so its
  # instructions live in the skills registry like any user skill and the
  # AESOP task provider can pin it by id. The ids are derived from the
  # execution id and the variant index (lowercase, <=64 chars), so the
  # cleanup below can delete them without a list. The arms run one after
  # another: each already runs `concurrency` examples in parallel.
  # ----------------------------------------------------------------------
  - name: run_variants
    type: foreach
    if: '${{ variables.baseline_scored == true }}'
    foreach: '${{ inputs.variants | json }}'
    steps:
      - name: create_variant
        type: kibana.request
        timeout: '30s'
        with:
          method: POST
          path: '/s/{{ workflow.spaceId }}/api/agent_builder/skills'
          headers:
            kbn-xsrf: 'true'
            elastic-api-version: '2023-10-31'
            Content-Type: application/json
          body:
            id: 'aesop-variant-{{ execution.id }}-{{ foreach.index }}'
            name: 'AESOP variant {{ execution.id }} {{ foreach.index }}'
            description: >-
              AESOP prototype candidate variant {{ foreach.index }}. Created by
              the A/B compare workflow; safe to delete when no run is active.
            content: '{{ foreach.item }}'
        on-failure:
          continue: true

      - name: resolve_variant
        type: data.set
        with:
          ok: >-
            ${{ steps.create_variant.error == null
              and steps.create_variant.output.id != null
              and steps.create_variant.output.id != '' }}

      - name: variant_start
        type: ai.evals.startExperiment
        if: '${{ steps.resolve_variant.output.ok == true }}'
        with:
          task_model:
            id: '{{ inputs.connector_id }}'
          suite_id: 'aesop-prototype'
        on-failure:
          continue: true

      - name: variant_run
        type: ai.evals.evaluateDataset
        if: '${{ steps.resolve_variant.output.ok == true and steps.variant_start.error == null }}'
        with:
          connector_id: '{{ inputs.connector_id }}'
          agent_id: '{{ inputs.agent_id }}'
          task_ref: 'security.aesopVariant'
          params:
            skill_id: '{{ steps.create_variant.output.id }}'
          experiment_id: '${{ steps.variant_start.output.experiment_id }}'
          execution_id: '${{ steps.variant_start.output.execution_id }}'
          suite_id: 'aesop-prototype'
          dataset_ids: ['{{ inputs.dataset_id }}']
          evaluators:
            - name: skill-secret-scanner
            - name: skill-prompt-injection
            - name: skill-pii
            - name: esql-compile
            - name: skill-index-resolves
            - name: correctness
              connector_id: '{{ inputs.connector_id }}'
          repetitions: '${{ inputs.repetitions }}'
          concurrency: '${{ inputs.concurrency }}'
        on-failure:
          continue: true

      - name: wrap_variant_arm
        type: data.set
        if: '${{ (steps.variant_run.output.scores_ingested | default: 0) > 0 }}'
        with:
          new_ids: "${{ steps.variant_start.output.experiment_id | split: ',' }}"
          new_markers: ['{{ foreach.index }}']

      - name: record_variant_arm
        type: data.set
        if: '${{ (steps.variant_run.output.scores_ingested | default: 0) > 0 }}'
        with:
          experiment_ids: "${{ variables.experiment_ids | concat: variables.new_ids }}"
          arm_variant_indexes: "${{ variables.arm_variant_indexes | concat: variables.new_markers }}"

  # ----------------------------------------------------------------------
  # Compare every arm against the baseline, then pick the winner.
  # compareExperiments returns an opaque comparison blob; the proposal
  # renders it as JSON so the analyst reads the matrix.
  # ----------------------------------------------------------------------
  - name: count_arms
    type: data.set
    with:
      arm_count: '${{ variables.arm_variant_indexes | size }}'

  - name: resolve_can_compare
    type: data.set
    with:
      can_compare: '${{ variables.baseline_scored == true and variables.arm_count > 0 }}'

  - name: compare
    type: ai.evals.compareExperiments
    if: '${{ variables.can_compare == true }}'
    with:
      experiment_ids: '${{ variables.experiment_ids }}'
    on-failure:
      continue: true

  - name: winner
    type: security.aesopSelectWinner
    if: '${{ variables.can_compare == true and steps.compare.error == null }}'
    with:
      comparison: '${{ steps.compare.output.comparison }}'
      primary_evaluator: correctness
      code_evaluators: '${{ consts.CODE_EVALUATORS }}'
    on-failure:
      continue: true

  - name: resolve_comparison
    type: data.set
    if: '${{ variables.can_compare == true and steps.compare.error == null and steps.winner.error == null }}'
    with:
      comparison_json: '${{ steps.compare.output.comparison | json }}'
      has_winner: '${{ steps.winner.output.winner_index >= 0 }}'
      compared: true

  # The marker at the winner's position says which arm it was: `live` or the
  # index of a variant.
  - name: resolve_winner
    type: data.set
    if: '${{ steps.resolve_comparison.output.has_winner == true }}'
    with:
      winner_variant: '${{ variables.arm_variant_indexes[steps.winner.output.winner_index] }}'

  - name: resolve_winner_content
    type: data.set
    if: '${{ steps.resolve_comparison.output.has_winner == true and variables.winner_variant != "live" }}'
    with:
      winner_content: '{{ inputs.variants[variables.winner_variant] }}'

  # A variant is deployed only when it won, beat the no-skill baseline, and is
  # not the live skill itself. Anything else is a rejection.
  - name: resolve_deploy_candidate
    type: data.set
    if: '${{ steps.resolve_comparison.output.compared == true }}'
    with:
      deploy_candidate: >-
        ${{ steps.resolve_comparison.output.has_winner == true
          and variables.winner_variant != 'live'
          and steps.winner.output.beats_baseline == true }}
      reject_reason: >-
        {% if steps.resolve_comparison.output.has_winner != true %}No variant won. {% elsif variables.winner_variant == 'live' %}The live skill outperformed every variant. {% elsif steps.winner.output.beats_baseline != true %}The best variant did not beat the no-skill baseline. {% endif %}{{ steps.winner.output.reasons | join: ' ' }}

  # ----------------------------------------------------------------------
  # Rejection: no deployable winner. Record why, so the explorer reads it
  # before proposing the same thing again. The variants are stored in the KI
  # content for the same reason.
  # ----------------------------------------------------------------------
  - name: write_rejection_ki
    type: context-engine.createKi
    if: '${{ steps.resolve_comparison.output.compared == true and variables.deploy_candidate != true }}'
    with:
      ai_index_id: '{{ consts.AI_INDEX_ID }}'
      ki_id: 'rejection-{{ execution.id }}'
      ki:
        type: aesop.rejection
        title: "AESOP rejected the candidates for {{ variables.target_skill_id }}"
        description: '{{ variables.reject_reason | truncate: 1500 }}'
        content: '{{ inputs.variants | json | truncate: 60000, "" }}'
        tags:
          - aesop
          - aesop:rejected
        attributes:
          skill_id: '{{ variables.target_skill_id }}'
          source: ab_compare
          reason: '{{ variables.reject_reason | truncate: 5000 }}'
          rejected: '{{ steps.winner.output.rejected | json | truncate: 8000 }}'
          dataset_id: '{{ inputs.dataset_id }}'
          workflow_execution_id: '{{ execution.id }}'
    on-failure:
      continue: true

  # ----------------------------------------------------------------------
  # Approval gate. Propose the winner with the matrix and its content.
  # ----------------------------------------------------------------------
  - name: propose_deploy
    type: workflow.execute
    if: '${{ variables.deploy_candidate == true }}'
    # Straight to the proposals gate in default run-as mode, not through the
    # AlertZero bridge: the bridge delegates with `run-as-mode: inherit`, which
    # needs a parent running as a bound service account, and this run executes
    # as the user who started it. `origin: alertzero` puts the proposal in the
    # AlertZero decision queue.
    with:
      workflow-id: system-create-proposal
      inputs:
        origin: alertzero
        conversationId: '{{ inputs.investigation_id }}'
        title: "AESOP: {% if variables.has_live_skill == true %}update {{ variables.target_skill_id }}{% else %}create the skill {{ variables.target_skill_name }}{% endif %}"
        comment: |-
          **AESOP: {% if variables.has_live_skill == true %}deploy the winning variant of `{{ variables.target_skill_id }}`{% else %}create the new skill `{{ variables.target_skill_name }}`{% endif %}?**

          Winner: experiment `{{ steps.winner.output.winner_target_id }}`, variant {{ variables.winner_variant }} of {{ inputs.variants.size }}, against the no-skill baseline `{{ steps.baseline_start.output.experiment_id }}`.
          {{ steps.winner.output.reasons | join: ' ' }}

          **A/B matrix** (baseline, {% if variables.has_live_skill == true %}live skill, {% endif %}every variant that scored):

          ```json
          ${{ steps.resolve_comparison.output.comparison_json }}
          ```

          **Winner content**
          ```markdown
          {{ variables.winner_content }}
          ```

          **Evaluators:** skill-secret-scanner, skill-prompt-injection, skill-pii, esql-compile, skill-index-resolves, correctness (judge)

          **On approval**
          {% if variables.has_live_skill == true %}If you approve, the agent stores the current content of `{{ variables.target_skill_id }}` (so a drift rollback can restore it), PUTs the winner onto it under your identity, and enables the skill's drift monitor.{% else %}If you approve, the agent creates the skill under your identity and enables its drift monitor.{% endif %} Scratch variant skills are deleted either way. If you dismiss, the decision and your reason are recorded and nothing is deployed.
        impact: medium
        confidence: medium
        autoApprove: false
        expiresIn: '72h'
    on-failure:
      continue: true

  - name: resolve_decision
    type: data.set
    with:
      approved: '${{ steps.propose_deploy.output.decision == "approved" }}'
      dismissed: '${{ steps.propose_deploy.output.decision == "dismissed" }}'

  # ----------------------------------------------------------------------
  # Dismissal: record the analyst's reason and rationale.
  # ----------------------------------------------------------------------
  - name: get_dismissal
    type: proposals.getProposal
    if: '${{ steps.resolve_decision.output.dismissed == true and steps.propose_deploy.output.proposalId != blank }}'
    with:
      proposalId: '{{ steps.propose_deploy.output.proposalId }}'
    on-failure:
      continue: true

  - name: write_dismissal_ki
    type: context-engine.createKi
    if: '${{ steps.resolve_decision.output.dismissed == true }}'
    with:
      ai_index_id: '{{ consts.AI_INDEX_ID }}'
      ki_id: 'rejection-{{ execution.id }}'
      ki:
        type: aesop.rejection
        title: 'AESOP winner dismissed for {{ variables.target_skill_id }}'
        description: >-
          An analyst dismissed the winning variant: {{ steps.get_dismissal.output.dismissReason | default: 'no reason recorded' }}.
        content: '{{ variables.winner_content | truncate: 60000, "" }}'
        tags:
          - aesop
          - aesop:dismissed
        attributes:
          skill_id: '{{ variables.target_skill_id }}'
          source: ab_compare
          dismissReason: "{{ steps.get_dismissal.output.dismissReason | default: '' }}"
          rationale: "{{ steps.get_dismissal.output.rationale | default: '' | truncate: 5000 }}"
          dataset_id: '{{ inputs.dataset_id }}'
          workflow_execution_id: '{{ execution.id }}'
    on-failure:
      continue: true

  # ----------------------------------------------------------------------
  # Approval, update of a live skill: read the current content, store it as a
  # KI keyed by the skill id, and only then PUT the winner. The PUT is gated on
  # the KI write: without the prior content a rollback has nothing to restore.
  # ----------------------------------------------------------------------
  - name: get_prior_skill
    type: kibana.request
    if: '${{ steps.resolve_decision.output.approved == true and variables.has_live_skill == true }}'
    timeout: '30s'
    with:
      method: GET
      path: '/s/{{ workflow.spaceId }}/api/agent_builder/skills/{{ variables.target_skill_id }}'
      headers:
        elastic-api-version: '2023-10-31'
    on-failure:
      continue: true

  # A KI holds at most 65536 characters; a longer prior skill could not be
  # restored whole, so the deploy is refused instead of storing a truncation.
  - name: resolve_prior_skill
    type: data.set
    if: '${{ steps.resolve_decision.output.approved == true and variables.has_live_skill == true }}'
    with:
      prior_ok: >-
        ${{ steps.get_prior_skill.error == null
          and steps.get_prior_skill.output.content != null
          and (steps.get_prior_skill.output.content | size) <= 65000 }}

  - name: store_prior_content
    type: context-engine.createKi
    if: '${{ steps.resolve_prior_skill.output.prior_ok == true }}'
    with:
      ai_index_id: '{{ consts.AI_INDEX_ID }}'
      ki_id: 'skill-prior-{{ variables.target_skill_id }}'
      refresh: true
      ki:
        type: aesop.prior_skill_content
        title: 'Content of {{ variables.target_skill_id }} before AESOP replaced it'
        description: >-
          The skill content that was live before workflow execution {{ execution.id }} deployed the winning variant. A drift rollback restores it.
        content: '{{ steps.get_prior_skill.output.content }}'
        tags:
          - aesop
          - aesop:prior
        attributes:
          skill_id: '{{ variables.target_skill_id }}'
          replaced_by_execution: '{{ execution.id }}'
    on-failure:
      continue: true

  - name: update_skill
    type: kibana.request
    if: '${{ steps.resolve_prior_skill.output.prior_ok == true and steps.store_prior_content.error == null }}'
    timeout: '30s'
    with:
      method: PUT
      path: '/s/{{ workflow.spaceId }}/api/agent_builder/skills/{{ variables.target_skill_id }}'
      headers:
        kbn-xsrf: 'true'
        elastic-api-version: '2023-10-31'
        Content-Type: application/json
      body:
        content: '{{ variables.winner_content }}'
    on-failure:
      continue: true

  # ----------------------------------------------------------------------
  # Approval, new skill: create it under the approver's identity.
  # ----------------------------------------------------------------------
  - name: create_skill
    type: kibana.request
    if: '${{ steps.resolve_decision.output.approved == true and variables.has_live_skill != true }}'
    timeout: '30s'
    with:
      method: POST
      path: '/s/{{ workflow.spaceId }}/api/agent_builder/skills'
      headers:
        kbn-xsrf: 'true'
        elastic-api-version: '2023-10-31'
        Content-Type: application/json
      body:
        id: '{{ variables.target_skill_id }}'
        name: '{{ variables.target_skill_name }}'
        description: 'Created by the AESOP A/B compare workflow ({{ execution.id }}).'
        content: '{{ variables.winner_content }}'
    on-failure:
      continue: true

  - name: mark_updated
    type: data.set
    if: '${{ steps.update_skill.output != null and steps.update_skill.error == null }}'
    with:
      deployed: true

  - name: mark_created
    type: data.set
    if: '${{ steps.create_skill.output != null and steps.create_skill.error == null }}'
    with:
      deployed: true

  # ----------------------------------------------------------------------
  # Post-deploy: install + enable the per-skill drift monitor through the
  # security internal route, which enables it as the identity that approved
  # the deploy (the run's API key). Non-fatal: a failed monitor enable must
  # not mark the deploy itself failed.
  # ----------------------------------------------------------------------
  - name: enable_drift_monitor
    type: kibana.request
    if: '${{ variables.deployed == true }}'
    timeout: '30s'
    with:
      method: POST
      path: '/s/{{ workflow.spaceId }}/internal/security_solution/aesop/drift_monitor'
      headers:
        kbn-xsrf: 'true'
        Content-Type: application/json
        elastic-api-version: '1'
        x-elastic-internal-origin: 'Kibana'
      body:
        skill_id: '{{ variables.target_skill_id }}'
    on-failure:
      continue: true

  # ----------------------------------------------------------------------
  # Cleanup. The variant skills are scratch artifacts: delete them on every
  # path (rejection, dismissal, deploy), so the registry only ever holds them
  # while a run is active. Every step above continues on failure, so an arm,
  # compare or proposal error still reaches this step. The ids are derived,
  # so a variant that was never created just 404s. A run that times out or is
  # cancelled never gets here; its variants then outlive it until deleted by
  # hand (no sweeper in the prototype).
  # ----------------------------------------------------------------------
  - name: cleanup_variants
    type: foreach
    foreach: '${{ inputs.variants | json }}'
    steps:
      - name: cleanup_variant
        type: kibana.request
        timeout: '30s'
        with:
          method: DELETE
          path: '/s/{{ workflow.spaceId }}/api/agent_builder/skills/aesop-variant-{{ execution.id }}-{{ foreach.index }}'
          headers:
            kbn-xsrf: 'true'
            elastic-api-version: '2023-10-31'
        on-failure:
          continue: true

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      baseline_experiment_id: '${{ steps.baseline_start.output.experiment_id }}'
      winner_experiment_id: "${{ steps.winner.output.winner_target_id | default: '' }}"
      decision: "${{ steps.propose_deploy.output.decision | default: '' }}"
      deployed: '${{ variables.deployed }}'
      skill_id: '{{ variables.target_skill_id }}'
      skip_reason: >-
