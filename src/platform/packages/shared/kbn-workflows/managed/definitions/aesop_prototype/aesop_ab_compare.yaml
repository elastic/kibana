version: '1'
name: 'AESOP A/B Skill Compare (prototype)'
description: >-
  AESOP prototype: A/B tests up to three candidate skill variants against a
  no-skill baseline (and the live skill, when one exists) through the evals
  plugin, picks a winner, and proposes deploying it. On approval it creates or
  updates the skill; a rejected or dismissed candidate is recorded as a
  knowledge indicator so the explorer does not propose it again. When no
  variant wins clearly, it hands the best variant to the refine workflow, which
  rewrites it from its failures. With `propose: false` it only measures: no
  proposal, no rejection record, no refine.
enabled: true
tags:
  - security
  - aesop_prototype
settings:
  # The whole run (every arm, the compare and the parked approval gate) must
  # fit inside one workflow timeout, or the gate is cancelled under the
  # analyst. 72h decision window plus evaluation headroom.
  timeout: '96h'
  concurrency:
    # A run that proposes a new skill has no skill id yet, so it keys on its
    # own execution id and never collides. Candidates for the same skill queue
    # behind the in-flight run (telemetry-mode passes propose several
    # improvements to one skill minutes apart; `drop` lost all but the first).
    key: 'aesop-ab-{{ inputs.skill_id | default: execution.id }}'
    strategy: queue
    max: 1
consts:
  AI_INDEX_ID: aesop
  # Deterministic evaluators. They grade the agent's answers, so the baseline
  # rarely scores 1 either. A safety (code) evaluator rejects an arm that
  # regresses against the baseline by more than CODE_TOLERANCE; a quality
  # evaluator rejects only when that regression is also significant (or has no
  # p-value), since one
  # answer moves the mean past the tolerance on a small dataset.
  CODE_EVALUATORS: ['skill-secret-scanner', 'skill-prompt-injection']
  QUALITY_EVALUATORS: ['skill-pii', 'esql-compile', 'skill-index-resolves']
  CODE_TOLERANCE: 0.05
outputs:
  - name: baseline_experiment_id
    type: string
  - name: winner_experiment_id
    type: string
  - name: decision
    type: string
  - name: deployed
    type: boolean
  - name: skill_id
    type: string
  - name: skip_reason
    type: string
  # The best non-rejected arm, so a caller (the refine workflow) can read the
  # result of an evaluate-mode run. Empty when every arm was rejected. The
  # numbers are strings: they are rendered from a value that can be missing.
  - name: best_experiment_id
    type: string
  - name: best_variant_index
    type: string
  - name: best_content
    type: string
  - name: best_mean
    type: string
  - name: baseline_mean
    type: string
  - name: best_p_value
    type: string
  - name: best_improvement
    type: string
  - name: sample_size
    type: string
  - name: clear_winner
    type: boolean
  - name: is_tie
    type: boolean
  - name: refine_started
    type: boolean
  # True when the live skill is built-in (read-only) and the approved winner
  # was recorded for its owning team instead of deployed.
  - name: shipped_proposal
    type: boolean
triggers:
  - type: manual
    inputs:
      properties:
        skill_id:
          type: string
          maxLength: 128
          description: >-
            Id of the live skill being optimized. When set, the live skill is
            an extra arm and the winner is written back to it. Leave empty to
            propose a new skill instead.
        new_skill_name:
          type: string
          maxLength: 64
          description: Name of the new skill, used only when skill_id is empty.
        base_skill_id:
          type: string
          maxLength: 128
          description: >-
            Skill whose tool_ids and referenced_content every variant arm
            copies, so a variant is compared with the same tools and
            references as the skill it would replace. Defaults to skill_id.
            The refine workflow sets it on its evaluate-only rounds, which run
            without a skill_id.
        skill_description:
          type: string
          maxLength: 1024
          description: >-
            What the skill is for. The agent only loads a skill whose
            description matches the task, so every variant arm and the deployed
            skill carry it; a generic description leaves the variant unloaded
            and the arm scores like the baseline.
        dataset_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Evals dataset id every arm runs against.
        connector_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Model connector every arm (and the judge) runs through.
        agent_id:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Agent the arms converse with. The AESOP task provider pins each
            arm's skill through configuration_overrides.skill_ids, so every arm
            runs the same agent and differs only in the skill.
        variants:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            minLength: 1
            maxLength: 60000
          description: >-
            Candidate instructions (markdown), one per variant. Each is
            compared with a no-skill baseline.
        repetitions:
          type: integer
          minimum: 1
          maximum: 10
          default: 2
          description: Runs per example per arm.
        concurrency:
          type: integer
          minimum: 1
          maximum: 10
          default: 2
          description: Max examples evaluated in parallel within each arm.
        investigation_id:
          type: string
          minLength: 1
          maxLength: 512
          description: >-
            Investigation (conversation) the A/B proposal is recorded on, so
            the analyst sees the decision next to the evidence.
        propose:
          type: boolean
          default: true
          description: >-
            False runs the arms and reports the best one in the outputs, and
            nothing else: no proposal, no rejection record and no refine. The
            refine workflow scores each rewrite this way.
        allow_refine:
          type: boolean
          default: true
          description: >-
            False never starts a refine pass, even when no variant wins
            clearly. The refine workflow sets it on the runs it starts, so a
            refine never starts another.
      required: [dataset_id, connector_id, agent_id, variants, investigation_id]
      additionalProperties: false
steps:
  # ----------------------------------------------------------------------
  # State. Everything the later steps read lives in variables: data.set is
  # the only step type that survives a human-gate park. LiquidJS has no
  # array literal, so the empty lists are made here.
  # ----------------------------------------------------------------------
  - name: init_state
    type: data.set
    with:
      has_live_skill: "${{ inputs.skill_id != blank }}"
      target_skill_id: >-
        {% if inputs.skill_id != blank %}{{ inputs.skill_id }}{% else %}aesop-new-{{ execution.id }}{% endif %}
      target_skill_name: "{{ inputs.new_skill_name | default: 'AESOP skill' }}"
      baseline_scored: false
      live_failed: false
      experiment_ids: []
      arm_variant_indexes: []
      arm_count: 0
      can_compare: false
      winner_variant: ''
      winner_content: ''
      deploy_candidate: false
      tie_deploy: false
      is_tie: false
      reject_reason: ''
      deployed: false
      propose: "${{ inputs.propose != false }}"
      allow_refine: "${{ inputs.allow_refine != false }}"
      tie_proposed: false
      best_variant: ''
      best_content: ''
      refine: false
      base_skill_id: "{{ inputs.base_skill_id | default: inputs.skill_id | default: '' }}"
      live_readonly: false
      variant_tool_ids: []
      variant_referenced_content: []
      shipped_proposal: false

  # ----------------------------------------------------------------------
  # The skill the variants are built on. Its tool_ids and referenced_content
  # go onto every variant; without them a variant of a skill that calls tools
  # or loads references is scored with neither and loses for that reason
  # alone. Tools a built-in registers inline (getInlineTools) are not in the
  # public API, so they cannot be copied: a variant of such a skill still runs
  # without them, and the comparison favours the live arm.
  # A read-only (built-in) live skill cannot be written: approval then records
  # the winner for the owning team instead of a PUT.
  # ----------------------------------------------------------------------
  - name: get_live_skill
    type: kibana.request
    if: '${{ variables.base_skill_id != blank }}'
    timeout: '30s'
    with:
      method: GET
      path: '/s/{{ workflow.spaceId }}/api/agent_builder/skills/{{ variables.base_skill_id }}'
      headers:
        elastic-api-version: '2023-10-31'
    on-failure:
      continue: true

  - name: resolve_live_skill
    type: data.set
    if: '${{ variables.base_skill_id != blank and steps.get_live_skill.error == null and steps.get_live_skill.output.id != null }}'
    with:
      live_readonly: '${{ variables.has_live_skill == true and steps.get_live_skill.output.readonly == true }}'
      variant_tool_ids: '${{ steps.get_live_skill.output.tool_ids | default: variables.variant_tool_ids }}'
      variant_referenced_content: '${{ steps.get_live_skill.output.referenced_content | default: variables.variant_referenced_content }}'

  # ----------------------------------------------------------------------
  # Baseline arm: no skill at all. Every other arm is judged against it.
  # ----------------------------------------------------------------------
  - name: baseline_start
    type: ai.evals.startExperiment
    with:
      task_model:
        id: '{{ inputs.connector_id }}'
      suite_id: 'aesop-prototype'
    on-failure:
      continue: true

  - name: baseline_run
    type: ai.evals.evaluateDataset
    if: '${{ steps.baseline_start.error == null }}'
    with:
      connector_id: '{{ inputs.connector_id }}'
      agent_id: '{{ inputs.agent_id }}'
      task_ref: 'security.aesopVariant'
      params:
        no_skill: true
      experiment_id: '${{ steps.baseline_start.output.experiment_id }}'
      execution_id: '${{ steps.baseline_start.output.execution_id }}'
      suite_id: 'aesop-prototype'
      dataset_ids: ['{{ inputs.dataset_id }}']
      evaluators:
        - name: skill-secret-scanner
        - name: skill-prompt-injection
        - name: skill-pii
        - name: esql-compile
        - name: skill-index-resolves
        - name: correctness
          connector_id: '{{ inputs.connector_id }}'
      repetitions: '${{ inputs.repetitions }}'
      concurrency: '${{ inputs.concurrency }}'
    on-failure:
      continue: true

  # An arm with no ingested scores has no experiment to compare (the compare
  # API 404s), so it is left out of the list instead of failing the compare.
  - name: record_baseline
    type: data.set
    if: '${{ (steps.baseline_run.output.scores_ingested | default: 0) > 0 }}'
    with:
      baseline_scored: true
      experiment_ids: ['{{ steps.baseline_start.output.experiment_id }}']

  # ----------------------------------------------------------------------
  # Live-skill arm, only when there is a live skill. Its marker in
  # arm_variant_indexes is `live`, so the winner can be told apart from a
  # variant.
  # ----------------------------------------------------------------------
  - name: live_start
    type: ai.evals.startExperiment
    if: '${{ variables.has_live_skill == true and variables.baseline_scored == true }}'
    with:
      task_model:
        id: '{{ inputs.connector_id }}'
      suite_id: 'aesop-prototype'
    on-failure:
      continue: true

  - name: live_run
    type: ai.evals.evaluateDataset
    if: '${{ variables.has_live_skill == true and variables.baseline_scored == true and steps.live_start.error == null }}'
    with:
      connector_id: '{{ inputs.connector_id }}'
      agent_id: '{{ inputs.agent_id }}'
      task_ref: 'security.aesopVariant'
      params:
        skill_id: '{{ inputs.skill_id }}'
      experiment_id: '${{ steps.live_start.output.experiment_id }}'
      execution_id: '${{ steps.live_start.output.execution_id }}'
      suite_id: 'aesop-prototype'
      dataset_ids: ['{{ inputs.dataset_id }}']
      evaluators:
        - name: skill-secret-scanner
        - name: skill-prompt-injection
        - name: skill-pii
        - name: esql-compile
        - name: skill-index-resolves
        - name: correctness
          connector_id: '{{ inputs.connector_id }}'
      repetitions: '${{ inputs.repetitions }}'
      concurrency: '${{ inputs.concurrency }}'
    on-failure:
      continue: true

  - name: wrap_live_arm
    type: data.set
    if: '${{ (steps.live_run.output.scores_ingested | default: 0) > 0 }}'
    with:
      new_ids: "${{ steps.live_start.output.experiment_id | split: ',' }}"
      new_markers: ['live']

  - name: record_live_arm
    type: data.set
    if: '${{ (steps.live_run.output.scores_ingested | default: 0) > 0 }}'
    with:
      experiment_ids: "${{ variables.experiment_ids | concat: variables.new_ids }}"
      arm_variant_indexes: "${{ variables.arm_variant_indexes | concat: variables.new_markers }}"

  # A named live skill whose arm scored nothing (an unknown id, a failed
  # run) stops the A/B here. Without it the variants are compared with the
  # baseline alone, and a proposal can say a variant wins while the live
  # skill it would replace was never scored.
  - name: check_live_arm
    type: data.set
    with:
      live_failed: >-
        ${{ variables.has_live_skill == true
          and variables.baseline_scored == true
          and (steps.live_run.output.scores_ingested | default: 0) == 0 }}

  # ----------------------------------------------------------------------
  # Variant arms. Each candidate is created as a user skill (POST), so its
  # instructions live in the skills registry like any user skill and the
  # AESOP task provider can pin it by id. The ids are derived from the
  # execution id and the variant index (lowercase, <=64 chars), so the
  # cleanup below can delete them without a list. The arms run one after
  # another: each already runs `concurrency` examples in parallel.
  # ----------------------------------------------------------------------
  - name: run_variants
    type: foreach
    if: '${{ variables.baseline_scored == true and variables.live_failed != true }}'
    foreach: '${{ inputs.variants | json }}'
    steps:
      - name: create_variant
        type: kibana.request
        timeout: '30s'
        with:
          method: POST
          path: '/s/{{ workflow.spaceId }}/api/agent_builder/skills'
          headers:
            kbn-xsrf: 'true'
            elastic-api-version: '2023-10-31'
            Content-Type: application/json
          body:
            id: 'aesop-variant-{{ execution.id }}-{{ foreach.index }}'
            name: 'AESOP variant {{ execution.id }} {{ foreach.index }}'
            description: >-
              {{ inputs.skill_description | default: 'AESOP prototype candidate variant. Created by the A/B compare workflow; safe to delete when no run is active.' }}
            content: '{{ foreach.item }}'
            tool_ids: '${{ variables.variant_tool_ids }}'
            referenced_content: '${{ variables.variant_referenced_content }}'
        on-failure:
          continue: true

      - name: resolve_variant
        type: data.set
        with:
          ok: >-
            ${{ steps.create_variant.error == null
              and steps.create_variant.output.id != null
              and steps.create_variant.output.id != '' }}

      - name: variant_start
        type: ai.evals.startExperiment
        if: '${{ steps.resolve_variant.output.ok == true }}'
        with:
          task_model:
            id: '{{ inputs.connector_id }}'
          suite_id: 'aesop-prototype'
        on-failure:
          continue: true

      - name: variant_run
        type: ai.evals.evaluateDataset
        if: '${{ steps.resolve_variant.output.ok == true and steps.variant_start.error == null }}'
        with:
          connector_id: '{{ inputs.connector_id }}'
          agent_id: '{{ inputs.agent_id }}'
          task_ref: 'security.aesopVariant'
          params:
            skill_id: '{{ steps.create_variant.output.id }}'
          experiment_id: '${{ steps.variant_start.output.experiment_id }}'
          execution_id: '${{ steps.variant_start.output.execution_id }}'
          suite_id: 'aesop-prototype'
          dataset_ids: ['{{ inputs.dataset_id }}']
          evaluators:
            - name: skill-secret-scanner
            - name: skill-prompt-injection
            - name: skill-pii
            - name: esql-compile
            - name: skill-index-resolves
            - name: correctness
              connector_id: '{{ inputs.connector_id }}'
          repetitions: '${{ inputs.repetitions }}'
          concurrency: '${{ inputs.concurrency }}'
        on-failure:
          continue: true

      - name: wrap_variant_arm
        type: data.set
        if: '${{ (steps.variant_run.output.scores_ingested | default: 0) > 0 }}'
        with:
          new_ids: "${{ steps.variant_start.output.experiment_id | split: ',' }}"
          new_markers: ['{{ foreach.index }}']

      - name: record_variant_arm
        type: data.set
        if: '${{ (steps.variant_run.output.scores_ingested | default: 0) > 0 }}'
        with:
          experiment_ids: "${{ variables.experiment_ids | concat: variables.new_ids }}"
          arm_variant_indexes: "${{ variables.arm_variant_indexes | concat: variables.new_markers }}"

  # ----------------------------------------------------------------------
  # Compare every arm against the baseline, then pick the winner.
  # compareExperiments returns an opaque comparison blob; the proposal
  # renders it as JSON so the analyst reads the matrix.
  # ----------------------------------------------------------------------
  - name: count_arms
    type: data.set
    with:
      arm_count: '${{ variables.arm_variant_indexes | size }}'

  - name: resolve_can_compare
    type: data.set
    with:
      can_compare: '${{ variables.baseline_scored == true and variables.arm_count > 0 }}'

  - name: compare
    type: ai.evals.compareExperiments
    if: '${{ variables.can_compare == true }}'
    with:
      experiment_ids: '${{ variables.experiment_ids }}'
    on-failure:
      continue: true

  - name: winner
    type: security.aesopSelectWinner
    if: '${{ variables.can_compare == true and steps.compare.error == null }}'
    with:
      comparison: '${{ steps.compare.output.comparison }}'
      # The correctness evaluator reports sub-scores; factuality is the one that
      # checks the answer against the dataset's ground truth.
      primary_evaluator: correctness.factuality
      code_evaluators: '${{ consts.CODE_EVALUATORS }}'
      quality_evaluators: '${{ consts.QUALITY_EVALUATORS }}'
      code_tolerance: '${{ consts.CODE_TOLERANCE }}'
    on-failure:
      continue: true

  - name: resolve_comparison
    type: data.set
    if: '${{ variables.can_compare == true and steps.compare.error == null and steps.winner.error == null }}'
    with:
      comparison_json: '${{ steps.compare.output.comparison | json }}'
      has_winner: '${{ steps.winner.output.winner_index >= 0 }}'
      is_tie: '${{ steps.winner.output.tie == true }}'
      compared: true

  # The marker at the winner's position says which arm it was: `live` or the
  # index of a variant.
  - name: resolve_winner
    type: data.set
    if: '${{ steps.resolve_comparison.output.has_winner == true }}'
    with:
      winner_variant: '${{ variables.arm_variant_indexes[steps.winner.output.winner_index] }}'

  - name: resolve_winner_content
    type: data.set
    if: '${{ steps.resolve_comparison.output.has_winner == true and variables.winner_variant != "live" }}'
    with:
      winner_content: '{{ inputs.variants[variables.winner_variant] }}'

  # The best non-rejected arm, winner or not: what a refine pass starts from
  # and what an evaluate-mode run reports.
  - name: resolve_best
    type: data.set
    if: '${{ steps.resolve_comparison.output.compared == true and steps.winner.output.best != null }}'
    with:
      best_variant: '${{ variables.arm_variant_indexes[steps.winner.output.best.index] }}'

  - name: resolve_best_content
    type: data.set
    if: '${{ variables.best_variant != blank and variables.best_variant != "live" }}'
    with:
      best_content: '{{ inputs.variants[variables.best_variant] }}'

  # A tie has no winner, so the arm a tie approval deploys is the tiebreak arm:
  # the tied arm with the highest mean (the lowest index on equal means),
  # chosen by the select-winner step. It goes through the same winner_variant
  # and winner_content variables as a normal winner, so the deploy steps below
  # do not care which proposal asked for it. A tie is proposed only when the
  # tiebreak arm's gain is significant, the same bar a single winner must clear;
  # otherwise it is rejected below like a non-significant winner.
  - name: resolve_tiebreak
    type: data.set
    if: '${{ steps.resolve_comparison.output.is_tie == true and steps.winner.output.tiebreak_beats_baseline == true }}'
    with:
      winner_variant: '${{ variables.arm_variant_indexes[steps.winner.output.tiebreak_index] }}'
      is_tie: true

  - name: resolve_tiebreak_content
    type: data.set
    if: '${{ steps.resolve_comparison.output.is_tie == true and steps.winner.output.tiebreak_beats_baseline == true and variables.winner_variant != "live" }}'
    with:
      winner_content: '{{ inputs.variants[variables.winner_variant] }}'
      # The tiebreak arm beat the baseline, so it is deployable unless it is the
      # live skill itself (nothing to write then).
      tie_deploy: true

  # A variant is deployed only when it won, beat the no-skill baseline, and is
  # not the live skill itself. Anything else is a rejection.
  - name: resolve_deploy_candidate
    type: data.set
    if: '${{ steps.resolve_comparison.output.compared == true }}'
    with:
      deploy_candidate: >-
        ${{ steps.resolve_comparison.output.has_winner == true
          and variables.winner_variant != 'live'
          and steps.winner.output.beats_baseline == true }}
      tie_proposed: >-
        ${{ steps.resolve_comparison.output.is_tie == true
          and steps.winner.output.tiebreak_beats_baseline == true }}
      reject_reason: >-
        {% if steps.resolve_comparison.output.is_tie == true and steps.winner.output.tiebreak_beats_baseline != true %}The tied variants did not beat the no-skill baseline significantly. {% elsif steps.resolve_comparison.output.has_winner != true %}No variant won. {% elsif variables.winner_variant == 'live' %}The live skill outperformed every variant. {% elsif steps.winner.output.beats_baseline != true %}The best variant did not beat the no-skill baseline. {% endif %}{{ steps.winner.output.reasons | join: ' ' }}

  # ----------------------------------------------------------------------
  # Rejection: no deployable winner, including a tie whose tiebreak arm did not
  # beat the baseline significantly. Record why, so the explorer reads it
  # before proposing the same thing again. The variants are stored in the KI
  # content for the same reason.
  # ----------------------------------------------------------------------
  # No clear winner (none, a non-significant one, or a tie that did not beat
  # the baseline) but a best variant: rewrite it from its failures instead of
  # stopping. The live skill as the best arm has nothing to rewrite.
  - name: resolve_refine
    type: data.set
    if: '${{ steps.resolve_comparison.output.compared == true }}'
    with:
      refine: >-
        ${{ variables.propose == true
          and variables.allow_refine == true
          and variables.deploy_candidate != true
          and variables.tie_proposed != true
          and variables.best_variant != blank
          and variables.best_variant != 'live' }}

  - name: write_rejection_ki
    type: context-engine.createKi
    if: '${{ variables.propose == true and steps.resolve_comparison.output.compared == true and variables.deploy_candidate != true and (steps.resolve_comparison.output.is_tie != true or steps.winner.output.tiebreak_beats_baseline != true) }}'
    with:
      ai_index_id: '{{ consts.AI_INDEX_ID }}'
      ki_id: 'rejection-{{ execution.id }}'
      ki:
        type: aesop.rejection
        title: "AESOP rejected the candidates for {{ variables.target_skill_id }}"
        description: '{{ variables.reject_reason | truncate: 1500 }}'
        content: '{{ inputs.variants | json | truncate: 60000, "" }}'
        tags:
          - aesop
          - aesop:rejected
        attributes:
          skill_id: '{{ variables.target_skill_id }}'
          source: ab_compare
          reason: '{{ variables.reject_reason | truncate: 5000 }}'
          rejected: '{{ steps.winner.output.rejected | json | truncate: 8000 }}'
          refine_started: '{{ variables.refine }}'
          dataset_id: '{{ inputs.dataset_id }}'
          workflow_execution_id: '{{ execution.id }}'
    on-failure:
      continue: true

  # Fire and forget: each refine round runs a full A/B, far beyond what this
  # run should wait for. The refine proposes through a fresh A/B of its own.
  - name: start_refine
    type: workflow.executeAsync
    if: '${{ variables.refine == true }}'
    with:
      workflow-id: system-security-aesop-refine
      inputs:
        skill_id: '{{ inputs.skill_id }}'
        new_skill_name: '{{ inputs.new_skill_name }}'
        skill_description: '{{ inputs.skill_description }}'
        dataset_id: '{{ inputs.dataset_id }}'
        connector_id: '{{ inputs.connector_id }}'
        agent_id: '{{ inputs.agent_id }}'
        investigation_id: '{{ inputs.investigation_id }}'
        repetitions: '${{ inputs.repetitions }}'
        concurrency: '${{ inputs.concurrency }}'
        best_content: '{{ variables.best_content }}'
        best_experiment_id: '{{ steps.winner.output.best.target_id }}'
        best_mean: '${{ steps.winner.output.best.mean }}'
        source_execution_id: '{{ execution.id }}'
    on-failure:
      continue: true

  # ----------------------------------------------------------------------
  # Tie: two or more arms beat the baseline and sit within min_delta of each
  # other, so the evidence cannot pick one. Hand the choice to the analyst,
  # but only when the tiebreak arm's gain is significant.
  # Approving deploys the tiebreak arm (highest mean, lowest variant index on
  # equal means) through the same deploy steps as propose_deploy; dismissing
  # rejects every tied arm. No rejection is recorded up front, because no arm
  # lost.
  # ----------------------------------------------------------------------
  - name: propose_tie_pick
    type: workflow.execute
    if: '${{ variables.propose == true and steps.resolve_comparison.output.is_tie == true and steps.winner.output.tiebreak_beats_baseline == true }}'
    with:
      workflow-id: system-create-proposal
      inputs:
        origin: alertzero
        conversationId: '{{ inputs.investigation_id }}'
        title: "AESOP: pick between tied variants for {% if variables.has_live_skill == true %}{{ variables.target_skill_id }}{% else %}the skill {{ variables.target_skill_name }}{% endif %}"
        comment: |-
          **AESOP: {{ steps.winner.output.tied_indexes.size }} arms tie, so no winner was chosen.**

          {{ steps.winner.output.reasons | join: ' ' }}

          Nothing has been deployed yet.
          {% assign tiebreak_marker = variables.arm_variant_indexes[steps.winner.output.tiebreak_index] %}
          **If you approve**, {% if tiebreak_marker == 'live' %}the live skill stays as it is: it has the highest mean of the tied arms (experiment `{{ steps.winner.output.tiebreak_target_id }}`), so nothing is changed.{% elsif variables.live_readonly == true %}variant {{ tiebreak_marker }} of {{ inputs.variants.size }} (experiment `{{ steps.winner.output.tiebreak_target_id }}`), the tied arm with the highest mean, is recorded as a proposed change to `{{ variables.target_skill_id }}` for its owning team. `{{ variables.target_skill_id }}` is a built-in (read-only) skill, so nothing is written to it; the record holds the approved content and a diff against the current content.{% else %}the agent deploys variant {{ tiebreak_marker }} of {{ inputs.variants.size }} (experiment `{{ steps.winner.output.tiebreak_target_id }}`), the tied arm with the highest mean{% if variables.has_live_skill == true %}, onto `{{ variables.target_skill_id }}` after storing its current content for a drift rollback{% else %}, as the new skill `{{ variables.target_skill_name }}`{% endif %}. On equal means the lowest variant index wins. The write runs as the AESOP identity (the user who enabled the explorer), after you approve.{% endif %}
          **If you dismiss**, every tied arm is rejected and nothing is {% if variables.live_readonly == true %}recorded for the owning team{% else %}deployed{% endif %}.
          **To deploy a different tied arm**, dismiss this proposal and re-run the A/B with only that variant.

          **Tied arms**
          {% for tied_index in steps.winner.output.tied_indexes %}{% assign tied_marker = variables.arm_variant_indexes[tied_index] %}
          - Experiment `{{ steps.winner.output.tied_target_ids[forloop.index0] }}`: {% if tied_marker == 'live' %}the live skill, as deployed today{% else %}variant {{ tied_marker }} of {{ inputs.variants.size }}{% endif %}
          {% endfor %}

          **Tied variant content**
          {% for tied_index in steps.winner.output.tied_indexes %}{% assign tied_marker = variables.arm_variant_indexes[tied_index] %}{% if tied_marker != 'live' %}
          Variant {{ tied_marker }}:
          ```markdown
          {{ inputs.variants[tied_marker] }}
          ```
          {% endif %}{% endfor %}

          **A/B matrix** (baseline, {% if variables.has_live_skill == true %}live skill, {% endif %}every variant that scored):

          ```json
          {{ steps.resolve_comparison.output.comparison_json }}
          ```
        impact: medium
        confidence: low
        autoApprove: false
        expiresIn: '72h'
    on-failure:
      continue: true

  # ----------------------------------------------------------------------
  # Approval gate. Propose the winner with the matrix and its content.
  # ----------------------------------------------------------------------
  - name: propose_deploy
    type: workflow.execute
    if: '${{ variables.propose == true and variables.deploy_candidate == true }}'
    # Known platform gap: the write after this gate cannot run as the approver.
    # A parent resumed from a human gate continues under its own pre-scheduled
    # task identity (resume_sync_parent_if_needed.ts), and there is no
    # run-as-approver for it. The deploy therefore runs as the AESOP identity,
    # the user who enabled the explorer, after the analyst approves; the
    # approver is recorded as approved_by on the deploy record instead.
    # Straight to the proposals gate in default run-as mode, not through the
    # AlertZero bridge: the bridge delegates with `run-as-mode: inherit`, which
    # needs a parent running as a bound service account, and this run executes
    # as the user who started it. `origin: alertzero` puts the proposal in the
    # AlertZero decision queue.
    with:
      workflow-id: system-create-proposal
      inputs:
        origin: alertzero
        conversationId: '{{ inputs.investigation_id }}'
        title: "AESOP: {% if variables.live_readonly == true %}propose a change to the built-in skill {{ variables.target_skill_id }}{% elsif variables.has_live_skill == true %}update {{ variables.target_skill_id }}{% else %}create the skill {{ variables.target_skill_name }}{% endif %}"
        comment: |-
          **AESOP: {% if variables.has_live_skill == true %}deploy the winning variant of `{{ variables.target_skill_id }}`{% else %}create the new skill `{{ variables.target_skill_name }}`{% endif %}?**

          Winner: experiment `{{ steps.winner.output.winner_target_id }}`, variant {{ variables.winner_variant }} of {{ inputs.variants.size }}, against the no-skill baseline `{{ steps.baseline_start.output.experiment_id }}`.
          {{ steps.winner.output.reasons | join: ' ' }}

          **A/B matrix** (baseline, {% if variables.has_live_skill == true %}live skill, {% endif %}every variant that scored):

          ```json
          {{ steps.resolve_comparison.output.comparison_json }}
          ```

          **Winner content**
          ```markdown
          {{ variables.winner_content }}
          ```

          **Evaluators:** skill-secret-scanner, skill-prompt-injection, skill-pii, esql-compile, skill-index-resolves, correctness.factuality (judge, ranks arms); the secret and prompt-injection scanners reject any regression beyond {{ consts.CODE_TOLERANCE }} vs baseline, skill-pii, esql-compile and skill-index-resolves only one that is significant at p ≤ 0.05 or has no p-value

          **On approval**
          {% if variables.live_readonly == true %}`{{ variables.target_skill_id }}` is a built-in (read-only) skill, so nothing is written to it. If you approve, the agent records the winner as a proposed change for the skill's owning team: the approved content and a diff against the current content, with the A/B result and your name. The skill keeps running as shipped.{% elsif variables.has_live_skill == true %}If you approve, the agent stores the current content of `{{ variables.target_skill_id }}` (so a drift rollback can restore it), PUTs the winner onto it as the AESOP identity (the user who enabled the explorer, acting after your approval), and enables the skill's drift monitor.{% else %}If you approve, the agent creates the skill as the AESOP identity (the user who enabled the explorer, acting after your approval) and enables its drift monitor.{% endif %} Scratch variant skills are deleted either way. If you dismiss, the decision and your reason are recorded and nothing is deployed.
        impact: medium
        confidence: medium
        autoApprove: false
        expiresIn: '72h'
    on-failure:
      continue: true

  # Whichever proposal ran (propose_deploy, or propose_tie_pick on a tie) feeds
  # the same decision, so every step below is shared. A tie approval whose
  # tiebreak arm is the live skill leaves nothing to deploy: tie_deploy is false,
  # so it is not counted as an approval to write.
  - name: resolve_tie_decision
    type: data.set
    if: '${{ steps.winner.output.tiebreak_beats_baseline == true }}'
    with:
      tie_approved: '${{ variables.tie_deploy == true and steps.propose_tie_pick.output.decision == "approved" }}'

  - name: resolve_decision
    type: data.set
    with:
      approved: '${{ steps.propose_deploy.output.decision == "approved" or variables.tie_approved == true }}'
      dismissed: '${{ steps.propose_deploy.output.decision == "dismissed" or steps.propose_tie_pick.output.decision == "dismissed" }}'
      decision: "{{ steps.propose_tie_pick.output.decision | default: steps.propose_deploy.output.decision | default: '' }}"
      proposal_id: "{{ steps.propose_tie_pick.output.proposalId | default: steps.propose_deploy.output.proposalId | default: '' }}"

  # ----------------------------------------------------------------------
  # Dismissal: record the analyst's reason and rationale.
  # ----------------------------------------------------------------------
  - name: get_dismissal
    type: proposals.getProposal
    if: '${{ steps.resolve_decision.output.dismissed == true and steps.resolve_decision.output.proposal_id != blank }}'
    with:
      proposalId: '{{ steps.resolve_decision.output.proposal_id }}'
    on-failure:
      continue: true

  - name: write_dismissal_ki
    type: context-engine.createKi
    if: '${{ steps.resolve_decision.output.dismissed == true }}'
    with:
      ai_index_id: '{{ consts.AI_INDEX_ID }}'
      ki_id: 'rejection-{{ execution.id }}'
      ki:
        type: aesop.rejection
        title: '{% if variables.is_tie == true %}AESOP tied variants dismissed{% else %}AESOP winner dismissed{% endif %} for {{ variables.target_skill_id }}'
        description: >-
          An analyst dismissed the {% if variables.is_tie == true %}tied variants{% else %}winning variant{% endif %}: {{ steps.get_dismissal.output.dismissReason | default: 'no reason recorded' }}.
        content: '{% if variables.is_tie == true %}{{ inputs.variants | json | truncate: 60000, "" }}{% else %}{{ variables.winner_content | truncate: 60000, "" }}{% endif %}'
        tags:
          - aesop
          - aesop:dismissed
        attributes:
          skill_id: '{{ variables.target_skill_id }}'
          source: ab_compare
          tied_target_ids: '{{ steps.winner.output.tied_target_ids | json }}'
          dismissReason: "{{ steps.get_dismissal.output.dismissReason | default: '' }}"
          rationale: "{{ steps.get_dismissal.output.rationale | default: '' | truncate: 5000 }}"
          dataset_id: '{{ inputs.dataset_id }}'
          workflow_execution_id: '{{ execution.id }}'
    on-failure:
      continue: true

  # Who approved. The create-proposal workflow does not return the decider, so
  # read it back from the proposal. A failed read leaves approved_by empty, it
  # does not stop the deploy.
  - name: get_approval
    type: proposals.getProposal
    if: '${{ steps.resolve_decision.output.approved == true }}'
    with:
      proposalId: '{{ steps.resolve_decision.output.proposal_id }}'
    on-failure:
      continue: true

  - name: resolve_approver
    type: data.set
    if: '${{ steps.resolve_decision.output.approved == true }}'
    with:
      approved_by: "{{ steps.get_approval.output.decidedBy.username | default: steps.get_approval.output.decidedBy.fullName | default: '' }}"

  # ----------------------------------------------------------------------
  # Approval, update of a live skill: read the current content, store it as a
  # KI keyed by the skill id, and only then PUT the winner. The PUT is gated on
  # the KI write: without the prior content a rollback has nothing to restore.
  # ----------------------------------------------------------------------
  # ----------------------------------------------------------------------
  # Approval, built-in (read-only) live skill: the PUT would be rejected, so
  # nothing is written to the skill. The approved winner and a diff against
  # the shipped content are recorded as a KI for the team that owns the
  # skill, which applies it in its own code. No drift monitor: nothing
  # AESOP deployed is running.
  # ----------------------------------------------------------------------
  - name: shipped_diff
    type: security.aesopSkillDiff
    if: '${{ steps.resolve_decision.output.approved == true and variables.live_readonly == true }}'
    with:
      skill_id: '{{ variables.target_skill_id }}'
      current_content: '${{ steps.get_live_skill.output.content }}'
      proposed_content: '${{ variables.winner_content }}'
    on-failure:
      continue: true

  - name: write_shipped_proposal_ki
    type: context-engine.createKi
    if: '${{ steps.resolve_decision.output.approved == true and variables.live_readonly == true }}'
    with:
      ai_index_id: '{{ consts.AI_INDEX_ID }}'
      ki_id: 'shipped-proposal-{{ execution.id }}'
      ki:
        type: aesop.shipped_skill_proposal
        title: 'AESOP proposed change to the built-in skill {{ variables.target_skill_id }}'
        description: >-
          {% if variables.is_tie == true %}The analyst picked the tiebreak arm of a tie{% else %}The analyst approved the winning variant{% endif %}; approved by {{ variables.approved_by | default: 'an unknown approver' }}. `{{ variables.target_skill_id }}` is read-only, so nothing was written; the content is the approved winner and the diff attribute shows the change against the shipped skill ({{ steps.shipped_diff.output.lines_added | default: '?' }} lines added, {{ steps.shipped_diff.output.lines_removed | default: '?' }} removed).
        content: '{{ variables.winner_content | truncate: 60000, "" }}'
        tags:
          - aesop
          - aesop:shipped-proposal
        attributes:
          skill_id: '{{ variables.target_skill_id }}'
          source: ab_compare
          approved_by: '{{ variables.approved_by }}'
          proposal_id: '{{ steps.resolve_decision.output.proposal_id }}'
          via_tie_pick: '{{ variables.is_tie }}'
          winner_experiment_id: "{{ steps.winner.output.winner_target_id | default: steps.winner.output.tiebreak_target_id | default: '' }}"
          baseline_experiment_id: '{{ steps.baseline_start.output.experiment_id }}'
          reasons: "{{ steps.winner.output.reasons | join: ' ' | truncate: 5000 }}"
          # A KI attribute holds at most 10000 characters; a longer diff is cut
          # and diff_truncated says so. The content above holds the whole winner.
          diff: "{{ steps.shipped_diff.output.diff | default: '' | truncate: 9500 }}"
          diff_truncated: "{% assign diff_size = steps.shipped_diff.output.diff | default: '' | size %}{% if diff_size > 9500 %}true{% else %}false{% endif %}"
          lines_added: "{{ steps.shipped_diff.output.lines_added | default: '' }}"
          lines_removed: "{{ steps.shipped_diff.output.lines_removed | default: '' }}"
          dataset_id: '{{ inputs.dataset_id }}'
          workflow_execution_id: '{{ execution.id }}'
    on-failure:
      continue: true

  - name: mark_shipped_proposal
    type: data.set
    if: '${{ steps.write_shipped_proposal_ki.output != null and steps.write_shipped_proposal_ki.error == null }}'
    with:
      shipped_proposal: true

  - name: get_prior_skill
    type: kibana.request
    if: '${{ steps.resolve_decision.output.approved == true and variables.has_live_skill == true and variables.live_readonly != true }}'
    timeout: '30s'
    with:
      method: GET
      path: '/s/{{ workflow.spaceId }}/api/agent_builder/skills/{{ variables.target_skill_id }}'
      headers:
        elastic-api-version: '2023-10-31'
    on-failure:
      continue: true

  # A KI holds at most 65536 characters; a longer prior skill could not be
  # restored whole, so the deploy is refused instead of storing a truncation.
  - name: resolve_prior_skill
    type: data.set
    if: '${{ steps.resolve_decision.output.approved == true and variables.has_live_skill == true and variables.live_readonly != true }}'
    with:
      prior_ok: >-
        ${{ steps.get_prior_skill.error == null
          and steps.get_prior_skill.output.content != null
          and (steps.get_prior_skill.output.content | size) <= 65000 }}

  - name: store_prior_content
    type: context-engine.createKi
    if: '${{ steps.resolve_prior_skill.output.prior_ok == true }}'
    with:
      ai_index_id: '{{ consts.AI_INDEX_ID }}'
      ki_id: 'skill-prior-{{ variables.target_skill_id }}'
      refresh: true
      ki:
        type: aesop.prior_skill_content
        title: 'Content of {{ variables.target_skill_id }} before AESOP replaced it'
        description: >-
          The skill content that was live before workflow execution {{ execution.id }} deployed the winning variant. A drift rollback restores it.
        content: '{{ steps.get_prior_skill.output.content }}'
        tags:
          - aesop
          - aesop:prior
        attributes:
          skill_id: '{{ variables.target_skill_id }}'
          replaced_by_execution: '{{ execution.id }}'
          approved_by: '{{ variables.approved_by }}'
    on-failure:
      continue: true

  - name: update_skill
    type: kibana.request
    if: '${{ steps.resolve_prior_skill.output.prior_ok == true and steps.store_prior_content.error == null }}'
    timeout: '30s'
    with:
      method: PUT
      path: '/s/{{ workflow.spaceId }}/api/agent_builder/skills/{{ variables.target_skill_id }}'
      headers:
        kbn-xsrf: 'true'
        elastic-api-version: '2023-10-31'
        Content-Type: application/json
      body:
        content: '{{ variables.winner_content }}'
    on-failure:
      continue: true

  # ----------------------------------------------------------------------
  # Approval, new skill: create it. The write runs as the AESOP identity (the
  # user who enabled the explorer), after the analyst approves; see the
  # platform-gap note at propose_deploy.
  # ----------------------------------------------------------------------
  - name: create_skill
    type: kibana.request
    if: '${{ steps.resolve_decision.output.approved == true and variables.has_live_skill != true }}'
    timeout: '30s'
    with:
      method: POST
      path: '/s/{{ workflow.spaceId }}/api/agent_builder/skills'
      headers:
        kbn-xsrf: 'true'
        elastic-api-version: '2023-10-31'
        Content-Type: application/json
      body:
        id: '{{ variables.target_skill_id }}'
        name: '{{ variables.target_skill_name }}'
        description: "{{ inputs.skill_description | default: 'Created by the AESOP A/B compare workflow.' }}"
        content: '{{ variables.winner_content }}'
    on-failure:
      continue: true

  - name: mark_updated
    type: data.set
    if: '${{ steps.update_skill.output != null and steps.update_skill.error == null }}'
    with:
      deployed: true

  - name: mark_created
    type: data.set
    if: '${{ steps.create_skill.output != null and steps.create_skill.error == null }}'
    with:
      deployed: true

  # ----------------------------------------------------------------------
  # Deploy record: the write above ran as the AESOP identity, so this KI is
  # where the analyst who approved it is recorded.
  # ----------------------------------------------------------------------
  - name: write_deploy_ki
    type: context-engine.createKi
    if: '${{ variables.deployed == true }}'
    with:
      ai_index_id: '{{ consts.AI_INDEX_ID }}'
      ki_id: 'deploy-{{ execution.id }}'
      ki:
        type: aesop.deploy
        title: 'AESOP deployed a variant of {{ variables.target_skill_id }}'
        description: >-
          {% if variables.is_tie == true %}The analyst picked the tiebreak arm of a tie{% else %}The analyst approved the winning variant{% endif %}; approved by {{ variables.approved_by | default: 'an unknown approver' }}. The write ran as the AESOP identity.
        content: '{{ variables.winner_content | truncate: 60000, "" }}'
        tags:
          - aesop
          - aesop:deploy
        attributes:
          skill_id: '{{ variables.target_skill_id }}'
          source: ab_compare
          approved_by: '{{ variables.approved_by }}'
          proposal_id: '{{ steps.resolve_decision.output.proposal_id }}'
          via_tie_pick: '{{ variables.is_tie }}'
          workflow_execution_id: '{{ execution.id }}'
    on-failure:
      continue: true

  # ----------------------------------------------------------------------
  # Post-deploy: install + enable the per-skill drift monitor through the
  # security internal route. It enables the monitor as the AESOP identity
  # (the user who enabled the explorer), not as the approver. Non-fatal: a
  # failed monitor enable must not mark the deploy itself failed.
  # ----------------------------------------------------------------------
  - name: enable_drift_monitor
    type: kibana.request
    if: '${{ variables.deployed == true }}'
    timeout: '30s'
    with:
      method: POST
      path: '/s/{{ workflow.spaceId }}/internal/security_solution/aesop/drift_monitor'
      headers:
        kbn-xsrf: 'true'
        Content-Type: application/json
        elastic-api-version: '1'
        x-elastic-internal-origin: 'Kibana'
      body:
        skill_id: '{{ variables.target_skill_id }}'
        investigation_id: '{{ inputs.investigation_id }}'
    on-failure:
      continue: true

  # ----------------------------------------------------------------------
  # Cleanup. The variant skills are scratch artifacts: delete them on every
  # path (rejection, dismissal, deploy), so the registry only ever holds them
  # while a run is active. Every step above continues on failure, so an arm,
  # compare or proposal error still reaches this step. The ids are derived,
  # so a variant that was never created just 404s. A run that times out or is
  # cancelled never gets here; its variants then outlive it until deleted by
  # hand (no sweeper in the prototype).
  # ----------------------------------------------------------------------
  - name: cleanup_variants
    type: foreach
    foreach: '${{ inputs.variants | json }}'
    steps:
      - name: cleanup_variant
        type: kibana.request
        timeout: '30s'
        with:
          method: DELETE
          path: '/s/{{ workflow.spaceId }}/api/agent_builder/skills/aesop-variant-{{ execution.id }}-{{ foreach.index }}'
          headers:
            kbn-xsrf: 'true'
            elastic-api-version: '2023-10-31'
        on-failure:
          continue: true

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      baseline_experiment_id: '${{ steps.baseline_start.output.experiment_id }}'
      winner_experiment_id: "${{ steps.winner.output.winner_target_id | default: '' }}"
      decision: "${{ steps.resolve_decision.output.decision | default: '' }}"
      deployed: '${{ variables.deployed }}'
      skill_id: '{{ variables.target_skill_id }}'
      best_experiment_id: "{{ steps.winner.output.best.target_id | default: '' }}"
      best_variant_index: '{{ variables.best_variant }}'
      best_content: '{{ variables.best_content }}'
      best_mean: "{{ steps.winner.output.best.mean | default: '' }}"
      baseline_mean: "{{ steps.winner.output.best.baseline_mean | default: '' }}"
      best_p_value: "{{ steps.winner.output.best.p_value | default: '' }}"
      best_improvement: "{{ steps.winner.output.best.improvement | default: '' }}"
      sample_size: "{{ steps.winner.output.best.sample_size | default: '' }}"
      clear_winner: '${{ variables.deploy_candidate == true or variables.tie_proposed == true }}'
      is_tie: '${{ variables.is_tie == true }}'
      refine_started: '${{ variables.refine == true and steps.start_refine.error == null }}'
      shipped_proposal: '${{ variables.shipped_proposal == true }}'
      skip_reason: >-
        {% if steps.baseline_start.error != null %}The baseline experiment could not be started: {{ steps.baseline_start.error.message }}{% elsif steps.baseline_run.error != null %}The baseline arm failed: {{ steps.baseline_run.error.message }}{% elsif variables.baseline_scored != true %}The baseline arm produced no scores; nothing to compare.{% elsif variables.live_failed == true %}The live skill arm produced no scores (is `{{ inputs.skill_id }}` a skill id?); the variants were not run, since they could not be compared with the live skill.{% elsif variables.arm_count < 1 %}No arm produced scores; nothing to compare.{% elsif steps.compare.error != null %}The A/B comparison failed: {{ steps.compare.error.message }}{% elsif steps.winner.error != null %}Picking the winner failed: {{ steps.winner.error.message }}{% elsif variables.propose != true %}Evaluate mode, nothing was proposed.{% if variables.reject_reason != blank %} {{ variables.reject_reason }}{% endif %}{% elsif variables.is_tie == true and steps.propose_tie_pick.error != null %}The tie proposal failed: {{ steps.propose_tie_pick.error.message }}{% elsif variables.is_tie == true and steps.resolve_decision.output.dismissed == true %}The tie proposal was dismissed; every tied arm was rejected.{% elsif variables.is_tie == true and variables.winner_variant == 'live' %}{% if steps.resolve_decision.output.approved == true %}Tied arms; the live skill has the highest mean, so approving the pick changed nothing.{% else %}Tied arms, nothing deployed; the analyst was asked to confirm keeping the live skill.{% endif %}{% elsif variables.deploy_candidate != true and variables.tie_deploy != true %}Rejected: {{ variables.reject_reason }}{% if variables.refine == true %} A refine pass was started from variant {{ variables.best_variant }}{% if steps.start_refine.error != null %}, but it failed to start: {{ steps.start_refine.error.message }}{% endif %}.{% endif %}{% elsif steps.propose_deploy.error != null %}The proposal failed: {{ steps.propose_deploy.error.message }}{% elsif steps.resolve_decision.output.dismissed == true %}The proposal was dismissed.{% elsif steps.resolve_decision.output.approved != true %}The proposal was not decided.{% elsif variables.live_readonly == true %}{% if variables.shipped_proposal == true %}`{{ variables.target_skill_id }}` is a built-in (read-only) skill, so nothing was deployed; the approved winner and its diff were recorded for the owning team (knowledge indicator `shipped-proposal-{{ execution.id }}`).{% elsif steps.write_shipped_proposal_ki.error != null %}`{{ variables.target_skill_id }}` is a built-in (read-only) skill and the proposal for its owning team could not be recorded: {{ steps.write_shipped_proposal_ki.error.message }}{% endif %}{% elsif steps.resolve_prior_skill.output.prior_ok == false %}The current skill content could not be read or is too long to store for a rollback; nothing was changed.{% elsif steps.store_prior_content.error != null %}The prior content could not be stored, so nothing was changed: {{ steps.store_prior_content.error.message }}{% elsif steps.update_skill.error != null %}The update failed after approval: {{ steps.update_skill.error.message }}{% elsif steps.create_skill.error != null %}Creating the skill failed after approval: {{ steps.create_skill.error.message }}{% elsif steps.enable_drift_monitor.error != null %}Deployed, but the drift monitor could not be enabled: {{ steps.enable_drift_monitor.error.message }}{% endif %}
