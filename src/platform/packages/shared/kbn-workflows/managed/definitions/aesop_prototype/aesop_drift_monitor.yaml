version: '1'
name: 'AESOP Drift Monitor (prototype)'
description: >-
  AESOP prototype: online evaluation of a deployed skill. Every tick reads
  the newest agent traces that invoked the skill, grades each with the CODE
  evaluators, and persists the scores as online scores attributed to this
  monitor.
enabled: false
tags:
  - security
  - aesop_prototype
  - scheduled
settings:
  timeout: '45m'
  concurrency:
    key: 'aesop-drift-__SKILL_ID__'
    strategy: drop
    max: 1
consts:
  SKILL_ID: '__SKILL_ID__'
  SKILL_NAME: '__SKILL_NAME__'
  # LiquidJS has no array literal, so `| default: []` does not produce one.
  EMPTY_ARRAY: []
outputs:
  - name: traces_graded
    type: number
  - name: scores_persisted
    type: number
  - name: evaluator_failures
    type: number
triggers:
  - type: scheduled
    with:
      every: '__INTERVAL_MINUTES__m'
  - type: manual
steps:
  # Traces that invoked the skill in the lookback window. Spans carry no
  # skill attribute, so the join is the load_skill tool call: a trace
  # belongs to the skill when a load_skill span resolved it. load_skill
  # resolves its `skill` argument by name or by a `<basePath>/<name>` (or
  # SKILL.md) path, never by id, so the argument filter matches the name.
  # The result carries the resolved `skill.id`, which drops errored calls and
  # same-named skills under another base path. The result is a keyword with
  # ignore_above 1024, so a long skill's result reads back null; those spans
  # fall back to the argument match alone. Tool-call arguments and results
  # are only on spans when `agentBuilder:tracing:includeToolDetails` is on;
  # with it off this finds nothing (the enable route warns about that).
  # The operation/tool filter runs inside KQL(), not raw column refs:
  # attributes.* is dynamic and unmapped on fresh clusters, where ES|QL
  # rejects unknown columns at compile time while KQL() just matches
  # nothing. `unmapped_fields` nullifies the remaining columns until the
  # first agent trace creates the data stream; otherwise every tick on a
  # trace-less cluster fails with `Unknown column [trace_id]`. The STATS BY
  # dedupes a trace that loaded the skill more than once; newest first.
  - name: find_traces
    type: elasticsearch.esql.query
    timeout: '60s'
    with:
      allow_partial_results: false
      filter:
        bool:
          filter:
            - range:
                '@timestamp':
                  gte: 'now-__LOOKBACK_MINUTES__m'
      query: |-
        SET unmapped_fields="nullify";
        FROM traces-agent_builder.otel-*
        | WHERE KQL("attributes.gen_ai.operation.name:execute_tool AND attributes.gen_ai.tool.name:load_skill")
        | GROK attributes.gen_ai.tool.call.arguments "\"skill\"\\s*:\\s*\"%{DATA:skill_ref}\""
        | EVAL skill_ref = REPLACE(TRIM(skill_ref), "/SKILL\\.md$", "")
        | WHERE skill_ref == "{{ consts.SKILL_NAME }}" OR ENDS_WITH(skill_ref, "/{{ consts.SKILL_NAME }}")
        | GROK attributes.gen_ai.tool.call.result "\"skill\":\\{\"id\":\"%{DATA:resolved_id}\""
        | WHERE attributes.gen_ai.tool.call.result IS NULL OR resolved_id == "{{ consts.SKILL_ID }}"
        | STATS last_seen = MAX(@timestamp) BY trace_id
        | SORT last_seen DESC
        | LIMIT 25
        | KEEP trace_id

  # Each row is `[trace_id]`; the loop reads the first column. A trace whose
  # evaluate/persist exhausts its retries is skipped (iteration-on-failure);
  # finalize_counts below counts every trace that was found but not graded
  # as a failure, matching the online evals generator's failure model. `foreach` has no aggregated output and
  # inner outputs are evicted per iteration, so the totals accumulate in
  # variables (`data.set` is exempt from output eviction; each iteration's
  # `data.set` reads the snapshot written by the previous iteration).
  - name: grade_loop
    type: foreach
    foreach: '${{ steps.find_traces.output.values }}'
    iteration-on-failure:
      continue: true
    steps:
      - name: evaluate
        type: ai.evals.evaluateTrace
        timeout: '10m'
        with:
          trace_id: '{{ foreach.item[0] }}'
          evaluators:
            - name: skill-secret-scanner
            - name: skill-prompt-injection
            - name: skill-pii
            - name: esql-compile
            - name: skill-index-resolves
        on-failure:
          retry:
            max-attempts: 3
            condition: '${{ error.details.status == blank or error.details.status == 404 or error.details.status == 429 or error.details.status >= 500 }}'
            delay: '5s'
            strategy: 'exponential'
            max-delay: '1m'
            jitter: true

      # Resolves per-iteration values once so the accumulate below is a
      # single `plus` on a plain number (Liquid has no operator precedence;
      # a filter expression cannot be a `plus:` argument).
      - name: resolve_iteration
        type: data.set
        with:
          has_results: >-
            ${{ steps.evaluate.error == null
              and steps.evaluate.output.results != null
              and steps.evaluate.output.results.size > 0 }}
          errors_size: '${{ steps.evaluate.output.errors | default: consts.EMPTY_ARRAY | size }}'

      - name: persist
        type: ai.evals.persistOnlineScores
        if: '${{ steps.resolve_iteration.output.has_results == true }}'
        with:
          monitor:
            id: 'aesop-drift-{{ consts.SKILL_ID }}'
            name: 'AESOP drift monitor ({{ consts.SKILL_ID }})'
          trace_id: '{{ foreach.item[0] }}'
          results: '${{ steps.evaluate.output.results }}'
          errors: '${{ steps.evaluate.output.errors | default: consts.EMPTY_ARRAY }}'

      # Runs only when persist ran, so `steps.persist.output.created` is
      # always defined here. Reads the totals the previous iteration wrote.
      # Ungraded traces are counted after the loop, not here: an evaluate
      # error skips the rest of the iteration.
      - name: accumulate
        type: data.set
        if: '${{ steps.resolve_iteration.output.has_results == true }}'
        with:
          traces_graded: '${{ variables.traces_graded | default: 0 | plus: 1 }}'
          scores_persisted: '${{ variables.scores_persisted | default: 0 | plus: steps.persist.output.created }}'
          evaluator_failures: '${{ variables.evaluator_failures | default: 0 | plus: steps.resolve_iteration.output.errors_size }}'

  # Pins every total to a number so emit_result is a plain left-to-right
  # filter chain: evaluator_failures = per-evaluator errors on graded traces
  # plus one per trace that was found but not graded.
  - name: finalize_counts
    type: data.set
    with:
      traces_found: '${{ steps.find_traces.output.values | size | default: 0 }}'
      traces_graded: '${{ variables.traces_graded | default: 0 }}'
      scores_persisted: '${{ variables.scores_persisted | default: 0 }}'
      evaluator_failures: '${{ variables.evaluator_failures | default: 0 }}'

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      traces_graded: '${{ variables.traces_graded }}'
      scores_persisted: '${{ variables.scores_persisted }}'
      evaluator_failures: '${{ variables.evaluator_failures | plus: variables.traces_found | minus: variables.traces_graded }}'
