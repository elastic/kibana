version: '1'
name: 'AESOP Drift Monitor (prototype)'
description: >-
  AESOP prototype: online evaluation of a deployed skill. Every tick reads
  the newest agent traces that invoked the skill, grades each with the CODE
  evaluators, and persists the scores as online scores attributed to this
  monitor. When the mean score over the lookback falls below the threshold,
  it proposes rolling the skill back to the content stored before AESOP
  replaced it, and restores that content if the proposal is approved. A
  restored rollback is not proposed again until a new deploy stores a prior.
enabled: false
tags:
  - security
  - aesop_prototype
  - scheduled
settings:
  # A rollback proposal parks this run until an analyst decides (72h window),
  # so the ceiling covers the window plus grading. While it is parked the
  # concurrency key below drops further ticks, which also keeps one pending
  # proposal per skill.
  timeout: '96h'
  concurrency:
    key: 'aesop-drift-__SKILL_ID__'
    strategy: drop
    max: 1
consts:
  AI_INDEX_ID: aesop
  # Unquoted so it renders as a YAML number the comparison below can use.
  DRIFT_THRESHOLD: __DRIFT_THRESHOLD__
  INVESTIGATION_ID: '__INVESTIGATION_ID__'
  SKILL_ID: '__SKILL_ID__'
  SKILL_NAME: '__SKILL_NAME__'
  # LiquidJS has no array literal, so `| default: []` does not produce one.
  EMPTY_ARRAY: []
outputs:
  - name: traces_graded
    type: number
  - name: scores_persisted
    type: number
  - name: evaluator_failures
    type: number
  - name: mean_score
    type: number
  - name: rollback_proposed
    type: boolean
  - name: rolled_back
    type: boolean
  - name: prior_forget_warning
    type: string
  - name: skill_retired
    type: boolean
  - name: retire_warning
    type: string
triggers:
  - type: scheduled
    with:
      every: '__INTERVAL_MINUTES__m'
  - type: manual
steps:
  # A retired (deleted) skill leaves this instance scheduled with nothing to
  # grade, and managed workflows cannot be deleted. A 404 on the skill turns
  # the monitor off and ends the run; any other read failure keeps monitoring,
  # so a transient error never disables it.
  - name: check_skill
    type: kibana.request
    timeout: '30s'
    with:
      method: GET
      path: '/s/{{ workflow.spaceId }}/api/agent_builder/skills/{{ consts.SKILL_ID }}'
      headers:
        elastic-api-version: '2023-10-31'
    on-failure:
      continue: true

  - name: resolve_skill
    type: data.set
    with:
      skill_retired: '${{ steps.check_skill.error != null and steps.check_skill.error.details.status == 404 }}'

  - name: disable_self
    type: kibana.request
    if: '${{ steps.resolve_skill.output.skill_retired == true }}'
    timeout: '30s'
    with:
      method: PUT
      path: '/s/{{ workflow.spaceId }}/api/workflows/workflow/{{ workflow.id }}'
      headers:
        kbn-xsrf: 'true'
        elastic-api-version: '2023-10-31'
        Content-Type: application/json
      body:
        enabled: false
    on-failure:
      continue: true

  - name: emit_retired
    type: workflow.output
    status: completed
    if: '${{ steps.resolve_skill.output.skill_retired == true }}'
    with:
      skill_retired: true
      retire_warning: >-
        {% if steps.disable_self.error != null %}WARNING: skill {{ consts.SKILL_ID }} no longer exists, but this monitor could not disable itself ({{ steps.disable_self.error.message }}); disable it by hand.{% endif %}

  # Traces that invoked the skill in the lookback window. Spans carry no
  # skill attribute, so the join is the load_skill tool call: a trace
  # belongs to the skill when a load_skill span resolved it. load_skill
  # resolves its `skill` argument by name or by a `<basePath>/<name>` (or
  # SKILL.md) path, never by id, so the argument filter matches the name.
  # The result carries the resolved `skill.id`, which drops errored calls and
  # same-named skills under another base path. The result is a keyword with
  # ignore_above 1024, so a long skill's result reads back null; those spans
  # fall back to the argument match alone. Tool-call arguments and results
  # are only on spans when `agentBuilder:tracing:includeToolDetails` is on;
  # with it off this finds nothing (the enable route warns about that).
  # The operation/tool filter runs inside KQL(), not raw column refs:
  # attributes.* is dynamic and unmapped on fresh clusters, where ES|QL
  # rejects unknown columns at compile time while KQL() just matches
  # nothing. `unmapped_fields` nullifies the remaining columns until the
  # first agent trace creates the data stream; otherwise every tick on a
  # trace-less cluster fails with `Unknown column [trace_id]`. The STATS BY
  # dedupes a trace that loaded the skill more than once; newest first.
  - name: find_traces
    type: elasticsearch.esql.query
    timeout: '60s'
    with:
      allow_partial_results: false
      filter:
        bool:
          filter:
            - range:
                '@timestamp':
                  gte: 'now-__LOOKBACK_MINUTES__m'
      query: |-
        SET unmapped_fields="nullify";
        FROM traces-agent_builder.otel-*
        | WHERE KQL("attributes.gen_ai.operation.name:execute_tool AND attributes.gen_ai.tool.name:load_skill")
        | GROK attributes.gen_ai.tool.call.arguments "\"skill\"\\s*:\\s*\"%{DATA:skill_ref}\""
        | EVAL skill_ref = REPLACE(TRIM(skill_ref), "/SKILL\\.md$", "")
        | WHERE skill_ref == "{{ consts.SKILL_NAME }}" OR ENDS_WITH(skill_ref, "/{{ consts.SKILL_NAME }}")
        | GROK attributes.gen_ai.tool.call.result "\"skill\":\\{\"id\":\"%{DATA:resolved_id}\""
        | WHERE attributes.gen_ai.tool.call.result IS NULL OR resolved_id == "{{ consts.SKILL_ID }}"
        | STATS last_seen = MAX(@timestamp) BY trace_id
        | SORT last_seen DESC
        | LIMIT 25
        | KEEP trace_id

  # Each row is `[trace_id]`; the loop reads the first column. A trace whose
  # evaluate/persist exhausts its retries is skipped (iteration-on-failure);
  # finalize_counts below counts every trace that was found but not graded
  # as a failure, matching the online evals generator's failure model. `foreach` has no aggregated output and
  # inner outputs are evicted per iteration, so the totals accumulate in
  # variables (`data.set` is exempt from output eviction; each iteration's
  # `data.set` reads the snapshot written by the previous iteration).
  - name: grade_loop
    type: foreach
    foreach: '${{ steps.find_traces.output.values }}'
    iteration-on-failure:
      continue: true
    steps:
      - name: evaluate
        type: ai.evals.evaluateTrace
        timeout: '10m'
        with:
          trace_id: '{{ foreach.item[0] }}'
          evaluators:
            - name: skill-secret-scanner
            - name: skill-prompt-injection
            - name: skill-pii
            - name: esql-compile
            - name: skill-index-resolves
        on-failure:
          retry:
            max-attempts: 3
            condition: '${{ error.details.status == blank or error.details.status == 404 or error.details.status == 429 or error.details.status >= 500 }}'
            delay: '5s'
            strategy: 'exponential'
            max-delay: '1m'
            jitter: true

      # Resolves per-iteration values once so the accumulate below is a
      # single `plus` on a plain number (Liquid has no operator precedence;
      # a filter expression cannot be a `plus:` argument).
      - name: resolve_iteration
        type: data.set
        with:
          has_results: >-
            ${{ steps.evaluate.error == null
              and steps.evaluate.output.results != null
              and steps.evaluate.output.results.size > 0 }}
          errors_size: '${{ steps.evaluate.output.errors | default: consts.EMPTY_ARRAY | size }}'

      - name: persist
        type: ai.evals.persistOnlineScores
        if: '${{ steps.resolve_iteration.output.has_results == true }}'
        with:
          monitor:
            id: 'aesop-drift-{{ consts.SKILL_ID }}'
            name: 'AESOP drift monitor ({{ consts.SKILL_ID }})'
          trace_id: '{{ foreach.item[0] }}'
          results: '${{ steps.evaluate.output.results }}'
          errors: '${{ steps.evaluate.output.errors | default: consts.EMPTY_ARRAY }}'

      # Runs only when persist ran, so `steps.persist.output.created` is
      # always defined here. Reads the totals the previous iteration wrote.
      # Ungraded traces are counted after the loop, not here: an evaluate
      # error skips the rest of the iteration.
      - name: accumulate
        type: data.set
        if: '${{ steps.resolve_iteration.output.has_results == true }}'
        with:
          traces_graded: '${{ variables.traces_graded | default: 0 | plus: 1 }}'
          scores_persisted: '${{ variables.scores_persisted | default: 0 | plus: steps.persist.output.created }}'
          evaluator_failures: '${{ variables.evaluator_failures | default: 0 | plus: steps.resolve_iteration.output.errors_size }}'

  # Pins every total to a number so emit_result is a plain left-to-right
  # filter chain: evaluator_failures = per-evaluator errors on graded traces
  # plus one per trace that was found but not graded.
  - name: finalize_counts
    type: data.set
    with:
      traces_found: '${{ steps.find_traces.output.values | size | default: 0 }}'
      traces_graded: '${{ variables.traces_graded | default: 0 }}'
      scores_persisted: '${{ variables.scores_persisted | default: 0 }}'
      evaluator_failures: '${{ variables.evaluator_failures | default: 0 }}'

  # ----------------------------------------------------------------------
  # Drift check. The mean of every online score this monitor has persisted
  # over the lookback, including the scores written above. No scores gives a
  # null mean and a zero count, which never counts as drift.
  # ----------------------------------------------------------------------
  - name: read_scores
    type: elasticsearch.esql.query
    timeout: '60s'
    with:
      allow_partial_results: false
      filter:
        bool:
          filter:
            - range:
                '@timestamp':
                  gte: 'now-__LOOKBACK_MINUTES__m'
      query: |-
        SET unmapped_fields="nullify";
        FROM .evaluation-online-scores
        | WHERE monitor.id == "aesop-drift-{{ consts.SKILL_ID }}"
        | STATS mean = AVG(score.value), n = COUNT(*)
    on-failure:
      continue: true

  - name: resolve_drift
    type: data.set
    with:
      read_ok: '${{ steps.read_scores.error == null and steps.read_scores.output.values != null and steps.read_scores.output.values.size > 0 }}'
      mean_score: '${{ steps.read_scores.output.values[0][0] | default: 0 }}'
      score_count: '${{ steps.read_scores.output.values[0][1] | default: 0 }}'

  - name: resolve_drifted
    type: data.set
    with:
      drifted: '${{ steps.resolve_drift.output.read_ok == true and steps.resolve_drift.output.score_count > 0 and steps.resolve_drift.output.mean_score < consts.DRIFT_THRESHOLD }}'

  # The KI read below must name the index that stores the KI. The AI index's
  # dest is that index, whether createKi derived it or someone else created it.
  - name: get_ai_index
    type: kibana.request
    if: '${{ steps.resolve_drifted.output.drifted == true }}'
    timeout: '30s'
    with:
      method: GET
      path: '/s/{{ workflow.spaceId }}/api/context_engine/ai_index/{{ consts.AI_INDEX_ID }}'
      headers:
        elastic-api-version: '2023-10-31'
    on-failure:
      continue: true

  # The content AESOP stored when it replaced the skill. A skill AESOP created
  # has none (nothing to roll back to), and a failed read skips the proposal.
  - name: get_prior_content
    type: kibana.request
    if: '${{ steps.resolve_drifted.output.drifted == true and steps.get_ai_index.error == null and steps.get_ai_index.output.dest.value != blank }}'
    timeout: '30s'
    with:
      method: GET
      path: '/s/{{ workflow.spaceId }}/internal/context_engine/ai_index/{{ consts.AI_INDEX_ID }}/kis/skill-prior-{{ consts.SKILL_ID }}'
      headers:
        elastic-api-version: '1'
        x-elastic-internal-origin: 'Kibana'
      query:
        index: '{{ steps.get_ai_index.output.dest.value }}'
    on-failure:
      continue: true

  - name: resolve_rollback
    type: data.set
    with:
      can_propose: >-
        ${{ steps.resolve_drifted.output.drifted == true
          and steps.get_prior_content.error == null
          and steps.get_prior_content.output.document.content != null
          and consts.INVESTIGATION_ID != blank }}

  - name: propose_rollback
    type: workflow.execute
    if: '${{ steps.resolve_rollback.output.can_propose == true }}'
    # Same route into the gate as the A/B compare: default run-as mode,
    # `origin: alertzero` for the decision queue.
    #
    # Known platform gap: the restore below runs as the AESOP identity, not as
    # the approver. A resumed parent has no run-as-approver: see
    # resume_sync_parent_if_needed.ts lines 34-38 and 74-81 in
    # workflows_execution_engine, and the explorer's start_ab_compare
    # workflow.executeAsync that picks the identity this run inherits. The
    # approver is recorded in the rollback KI instead.
    with:
      workflow-id: system-create-proposal
      inputs:
        origin: alertzero
        conversationId: '{{ consts.INVESTIGATION_ID }}'
        title: 'AESOP: roll back {{ consts.SKILL_ID }}'
        comment: |-
          **AESOP: roll back `{{ consts.SKILL_ID }}` to its previous content?**

          The deployed skill's mean online score is {{ steps.resolve_drift.output.mean_score | round: 3 }} over {{ steps.resolve_drift.output.score_count }} scores in the last __LOOKBACK_MINUTES__ minutes, below the threshold of {{ consts.DRIFT_THRESHOLD }}.

          **Previous content**
          ```markdown
          {{ steps.get_prior_content.output.document.content | truncate: 20000, "" }}
          ```

          **On approval**
          If you approve, the agent PUTs the previous content back onto `{{ consts.SKILL_ID }}` as the AESOP identity (the user who enabled the explorer, acting after your approval). If you dismiss, nothing changes.
        impact: medium
        confidence: medium
        autoApprove: false
        expiresIn: '72h'
    on-failure:
      continue: true

  - name: resolve_decision
    type: data.set
    with:
      approved: '${{ steps.propose_rollback.output.decision == "approved" }}'

  # Who approved. The create-proposal workflow does not return the decider, so
  # read it back from the proposal. A failed read leaves the approver empty.
  - name: get_approval
    type: proposals.getProposal
    if: '${{ steps.resolve_decision.output.approved == true }}'
    with:
      proposalId: '{{ steps.propose_rollback.output.proposalId }}'
    on-failure:
      continue: true

  - name: restore_skill
    type: kibana.request
    if: '${{ steps.resolve_decision.output.approved == true }}'
    timeout: '30s'
    with:
      method: PUT
      path: '/s/{{ workflow.spaceId }}/api/agent_builder/skills/{{ consts.SKILL_ID }}'
      headers:
        kbn-xsrf: 'true'
        elastic-api-version: '2023-10-31'
        Content-Type: application/json
      body:
        content: '{{ steps.get_prior_content.output.document.content }}'
    on-failure:
      continue: true

  # The restored content is live again and the stored prior is spent. Without
  # this the next tick still finds the prior, sees the restored (still low)
  # scores as drift, and proposes the same rollback again. The delete is a
  # soft delete the GET above reads as 404; the next A/B deploy stores a new
  # prior and re-arms the monitor.
  - name: forget_prior_content
    type: context-engine.deleteKi
    if: '${{ steps.restore_skill.output != null and steps.restore_skill.error == null }}'
    with:
      ai_index_id: '{{ consts.AI_INDEX_ID }}'
      ki_id: 'skill-prior-{{ consts.SKILL_ID }}'
      refresh: true
    on-failure:
      continue: true

  # Rollback record: the restore ran as the AESOP identity, so this KI is
  # where the analyst who approved it is recorded.
  - name: write_rollback_ki
    type: context-engine.createKi
    if: '${{ steps.restore_skill.output != null and steps.restore_skill.error == null }}'
    with:
      ai_index_id: '{{ consts.AI_INDEX_ID }}'
      ki_id: 'rollback-{{ execution.id }}'
      ki:
        type: aesop.rollback
        title: 'AESOP rolled back {{ consts.SKILL_ID }}'
        description: >-
          Rolled back to the previous content; approved by {{ steps.get_approval.output.decidedBy.username | default: steps.get_approval.output.decidedBy.fullName | default: 'an unknown approver' }}. The write ran as the AESOP identity.
        content: '{{ steps.get_prior_content.output.document.content | truncate: 60000, "" }}'
        tags:
          - aesop
          - aesop:rollback
        attributes:
          skill_id: '{{ consts.SKILL_ID }}'
          approved_by: "{{ steps.get_approval.output.decidedBy.username | default: steps.get_approval.output.decidedBy.fullName | default: '' }}"
          proposal_id: '{{ steps.propose_rollback.output.proposalId }}'
          workflow_execution_id: '{{ execution.id }}'
    on-failure:
      continue: true

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      traces_graded: '${{ variables.traces_graded }}'
      scores_persisted: '${{ variables.scores_persisted }}'
      evaluator_failures: '${{ variables.evaluator_failures | plus: variables.traces_found | minus: variables.traces_graded }}'
      mean_score: '${{ steps.resolve_drift.output.mean_score }}'
      rollback_proposed: '${{ steps.resolve_rollback.output.can_propose == true and steps.propose_rollback.error == null }}'
      rolled_back: '${{ steps.restore_skill.output != null and steps.restore_skill.error == null }}'
      prior_forget_warning: >-
        {% if steps.forget_prior_content.error != null %}WARNING: the rollback restored the skill but the stored prior content for {{ consts.SKILL_ID }} could not be deleted, so the next tick may propose the same rollback again.{% endif %}
      skill_retired: false
