version: '1'
name: 'AESOP Explorer (prototype)'
description: >-
  AESOP prototype: on a schedule, an explorer agent looks for skill
  improvements and hands each candidate to the A/B compare workflow, which
  proposes a deploy the analyst approves. Mode `discovery` reads security data
  and proposes new skills; mode `telemetry` reads how existing skills are used
  and proposes variants of them. The explorer reads what AESOP already learned
  (rejections, dismissals, earlier findings) before it proposes anything.
# Installed disabled, then enabled with the request of whoever turned the
# explorer on: the enable is what registers the schedule and mints the API key
# the runs execute under.
enabled: false
tags:
  - security
  - aesop_prototype
  - scheduled
settings:
  timeout: '70m'
  concurrency:
    key: 'aesop-explorer-__MODE__'
    strategy: drop
    max: 1
consts:
  AI_INDEX_ID: aesop
  MODE: '__MODE__'
  DEFAULT_DATASET_ID: '__DATASET_ID__'
  # LiquidJS has no array literal, so `| default: []` does not produce an empty array.
  EMPTY_ARRAY: []
outputs:
  - name: mode
    type: string
triggers:
  - type: scheduled
    with:
      every: '__INTERVAL_MINUTES__m'
  - type: manual
steps:
  # ----------------------------------------------------------------------
  # What AESOP already knows: rejected and dismissed candidates, prior skill
  # content, earlier findings. A failed read leaves the agent without the
  # list, not without a run: it can still query the AI index itself.
  # ----------------------------------------------------------------------
  - name: read_prior_knowledge
    type: kibana.request
    timeout: '30s'
    with:
      method: GET
      path: '/s/{{ workflow.spaceId }}/internal/context_engine/ai_index/{{ consts.AI_INDEX_ID }}/kis?size=100'
      headers:
        elastic-api-version: '1'
        x-elastic-internal-origin: 'Kibana'
    on-failure:
      continue: true

  # ----------------------------------------------------------------------
  # The eval datasets each candidate can be scored on, so the explorer can
  # pick the one that fits the task it is proposing. Read at runtime, not
  # rendered into the YAML: a dataset created after this instance was
  # enabled is still discovered. A failed read leaves the agent without
  # the list; candidates then fall back to the default dataset.
  # ----------------------------------------------------------------------
  - name: read_datasets
    type: kibana.request
    timeout: '30s'
    with:
      method: GET
      path: '/s/{{ workflow.spaceId }}/internal/evals/datasets'
      headers:
        elastic-api-version: '1'
        x-elastic-internal-origin: 'Kibana'
    on-failure:
      continue: true

  # ----------------------------------------------------------------------
  # Bounded exploration. Each pass asks the explorer for up to two
  # candidates, records them as findings and hands them to the A/B compare.
  # The agent decides whether another pass is worth it; the limit of three is
  # the ceiling, and a failed pass ends the loop.
  # ----------------------------------------------------------------------
  - name: explore
    type: while
    condition: '${{ steps.explorer_pass.output.structured_output.continue_exploring == true }}'
    max-iterations:
      limit: 3
      on-limit: continue
    timeout: '65m'
    on-failure:
      continue: true
    steps:
      - name: explorer_pass
        type: ai.agent
        agent-id: aesop-explorer
        plugin-id: 'securitySolution'
        connector-id: '__CONNECTOR_ID__'
        create-conversation: false
        ephemeral: true
        timeout: '20m'
        on-failure:
          continue: true
        with:
          message: |-
            {% if consts.MODE == 'discovery' %}Mode: discovery. Look through the security data in this space (alerts, detection rules, the indices you can list) for a recurring analyst task no existing skill covers, and propose new skills for it.{% else %}Mode: telemetry. Look at how the existing skills are used (invocation counts, tool patterns, failure rates in the traces) and propose improved variants of the skills that underperform.{% endif %}

            This is pass {{ while.iteration | plus: 1 }} of at most 3. Pick a different angle from earlier passes.
            {% if variables.explored and variables.explored.size > 0 %}Already proposed in this run (do not repeat them or a near-duplicate of them): {{ variables.explored | join: '; ' }}{% endif %}

            What AESOP already recorded (do not propose these again; a rejection or dismissal stands unless you have new evidence):
            {{ steps.read_prior_knowledge.output.kis | json | truncate: 6000 }}

            Read the `aesop` AI index for the details of any entry before you rely on it. One re-proposal rule: a rejection earned on a dataset that does not fit the task does not bind once a fitting dataset exists in the list below — re-propose that candidate with the fitting dataset_id. A second rule: a rejection whose `rejected` reasons name a quality evaluator (for example esql-compile or skill-index-resolves) and not the primary one does not bind either, once per candidate: re-propose it with variants that remove that cause, and say in the rationale which cause they remove.

            Eval datasets the A/B can score a candidate on (id, name, description, examples):
            {{ steps.read_datasets.output.datasets | default: consts.EMPTY_ARRAY | json | truncate: 4000 }}

            Return at most two candidates. A candidate that improves an existing skill sets skill_id to that skill's id; a candidate for a new skill leaves skill_id empty and names the skill. Every candidate also sets dataset_id, required, no default: copy the id of the dataset from the list above whose examples fit the task it improves. Propose only tasks one of the datasets covers: its examples must ask the same kind of question the skill answers, over the same kind of data. A candidate scored on a dataset that does not fit its task is scored out of domain and is wasted, so drop it instead; returning no candidates from a pass is a valid result. Each candidate carries one to three complete variants of the skill's instructions (markdown), a rationale and the evidence behind it. The agent that runs a skill only has ES|QL and does not see the mapping, and it guesses fields that are not there (geo, user_agent, related.ip) when a skill asks for checks the data cannot answer. So read the mapping of every index a skill names, list the fields the skill may use in its text, and do not ask for checks that need a field the index lacks. Set continue_exploring to true only when another pass would look somewhere new.
          schema:
            type: object
            properties:
              candidates:
                type: array
                maxItems: 2
                items:
                  type: object
                  properties:
                    skill_id:
                      type: string
                      maxLength: 128
                    skill_name:
                      type: string
                      maxLength: 64
                    dataset_id:
                      type: string
                      minLength: 1
                      maxLength: 128
                    title:
                      type: string
                      maxLength: 400
                    rationale:
                      type: string
                      maxLength: 1500
                    evidence:
                      type: string
                      maxLength: 8000
                    variants:
                      type: array
                      minItems: 1
                      maxItems: 3
                      items:
                        type: string
                        minLength: 1
                        maxLength: 20000
                  required: [skill_id, skill_name, dataset_id, title, rationale, evidence, variants]
              continue_exploring:
                type: boolean
            required: [candidates, continue_exploring]

      - name: record_findings
        type: foreach
        foreach: '${{ steps.explorer_pass.output.structured_output.candidates | default: consts.EMPTY_ARRAY }}'
        steps:
          - name: write_finding_ki
            type: context-engine.createKi
            with:
              ai_index_id: '{{ consts.AI_INDEX_ID }}'
              ki_id: 'finding-{{ execution.id }}-{{ while.iteration }}-{{ foreach.index }}'
              ki:
                type: aesop.finding
                title: '{{ foreach.item.title | truncate: 500 }}'
                description: '{{ foreach.item.rationale | truncate: 1900 }}'
                content: '{{ foreach.item.evidence | truncate: 60000, "" }}'
                tags:
                  - aesop
                  - aesop:finding
                  - 'aesop:{{ consts.MODE }}'
                attributes:
                  skill_id: '{{ foreach.item.skill_id }}'
                  skill_name: '{{ foreach.item.skill_name }}'
                  dataset_id: '{{ foreach.item.dataset_id }}'
                  mode: '{{ consts.MODE }}'
                  workflow_execution_id: '{{ execution.id }}'
            on-failure:
              continue: true

      # Fire and forget: the A/B run parks on an analyst approval for up to
      # 72h, far beyond this workflow's own timeout.
      #
      # Known platform gap: the child inherits this run's identity (the user
      # who enabled the explorer, the AESOP identity) and a resumed parent has
      # no run-as-approver (resume_sync_parent_if_needed.ts lines 34-38 and
      # 74-81 in workflows_execution_engine). The deploy therefore runs as the
      # AESOP identity after approval; the approver is recorded in the deploy
      # KI, not used as the write identity.
      - name: hand_to_ab_compare
        type: foreach
        foreach: '${{ steps.explorer_pass.output.structured_output.candidates | default: consts.EMPTY_ARRAY }}'
        steps:
          - name: start_ab_compare
            type: workflow.executeAsync
            with:
              workflow-id: system-security-aesop-ab-compare
              inputs:
                skill_id: '{{ foreach.item.skill_id }}'
                new_skill_name: '{{ foreach.item.skill_name }}'
                # Empty dataset_id means the candidate named no fitting
                # dataset; the explorer's default dataset applies.
                dataset_id: '{{ foreach.item.dataset_id | default: consts.DEFAULT_DATASET_ID }}'
                connector_id: '__CONNECTOR_ID__'
                agent_id: '__AB_AGENT_ID__'
                variants: '${{ foreach.item.variants }}'
                investigation_id: '__INVESTIGATION_ID__'
                repetitions: 6
            on-failure:
              continue: true

      # Carries this pass's titles into the next pass's prompt so the agent
      # sees what this run already proposed. `data.set` writes variables that
      # survive inner-output eviction between while iterations. The titles are
      # resolved first (a failed pass yields [] before concat ever runs, the
      # same resolve-then-accumulate shape as the drift monitor).
      - name: resolve_explored_titles
        type: data.set
        with:
          titles: >-
            ${{ steps.explorer_pass.output.structured_output.candidates
              | default: consts.EMPTY_ARRAY
              | map: 'title' }}

      - name: remember_explored
        type: data.set
        with:
          explored: '${{ variables.explored | default: consts.EMPTY_ARRAY | concat: steps.resolve_explored_titles.output.titles }}'

  - name: output_result
    type: workflow.output
    with:
      mode: '{{ consts.MODE }}'
