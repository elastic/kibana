version: '2'
id: okta-user-to-aws-resources
name: Okta user to AWS resources
description: >
  Blast radius of a compromised Okta user across AWS, from the entity store alone. The user
  entity lists the IAM roles its Okta groups federate into; role, instance and bucket entities
  list what they reach through configuration: roles they may assume (trust policies),
  instances they may open a session on, the role an instance runs as (instance profile), and
  the buckets a role may access (attached and bucket policies). The walk follows those
  relationships until the hop budget or the frontier runs out.
seed:
  type: user
  description: The entity store id of the compromised user, for example user:john.doe@acmecrm.com@okta
limits:
  max_hops: 6
  max_nodes: 2000
  max_frontier: 500
  max_edges_per_hop: 5000
  max_edges_total: 5000
  hub_degree: 500
hops:
  - name: okta_federation_roles
    description: IAM roles the user's Okta groups map to on the AWS federation app
    relationships:
      - can_assume
    payload_fields:
      - entity.name
    source_type: user
    target_type: role
  - name: aws_asset_relationships
    description: >
      Configuration edges on AWS asset entities: trust policies, Session Manager access,
      instance profiles and bucket access. Repeated so a role can chain into another role,
      reach an instance, pick up the instance role and reach a bucket.
    relationships:
      - can_assume
      - can_connect
      - runs_as
      - grants_access_to
    payload_fields:
      - entity.name
      - entity.sub_type
    source_type: asset
    target_type: asset
    repeat: 5
