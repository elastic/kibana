version: "1"
# Hourly: fetch the vendor advisory feeds again and rematch only the OS releases whose feed
# bytes or software inventory changed since the last release that matched them; unchanged
# releases are skipped and their open findings stay untouched. Installed disabled next to the
# daily scan and sharing its concurrency key, so a refresh never runs beside a full scan.
name: Refresh vulnerability feeds
description: Refetch vendor advisories hourly and rematch only releases whose feed or inventory changed
tags:
  - native-vuln-scanner
enabled: false
settings:
  concurrency:
    key: "native-vuln-scan"
    strategy: drop
    max: 1
triggers:
  - type: scheduled
    with:
      every: "1h"
steps:
  - name: fetch_feed
    type: native_vuln.fetch_feed
    on-failure:
      continue: true

  - name: match_when_fetched
    type: if
    condition: "${{ steps.fetch_feed.error == blank and steps.fetch_feed.output.pack_missing != true }}"
    steps:
      - name: match
        type: native_vuln.match
        with:
          feeds: "${{ steps.fetch_feed.output.feeds }}"
        on-failure:
          continue: true

  - name: summarize
    type: native_vuln.summarize
    with:
      fetch: "${{ steps.fetch_feed.output }}"
      match: "${{ steps.match.output }}"
      fetch_error: "${{ steps.fetch_feed.error.message }}"
      match_error: "${{ steps.match.error.message }}"
    on-failure:
      continue: true

  - name: fail_when_incomplete
    type: if
    condition: "${{ steps.fetch_feed.error != blank or steps.match.error != blank or steps.summarize.error != blank }}"
    steps:
      - name: fail_run
        type: workflow.fail
        with:
          message: >-
            The vulnerability feed refresh did not complete. Fetch: {{ steps.fetch_feed.error.message | default: "ok" }}.
            Match: {{ steps.match.error.message | default: "ok" }}.
            Summary: {{ steps.summarize.error.message | default: "ok" }}.
