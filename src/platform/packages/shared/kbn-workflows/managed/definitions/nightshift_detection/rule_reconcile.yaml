# Installed per space, bound to the detection engine service account, by the space's setup. It
# calls the engine's rule reconcile route as that account whenever knowledge indicators or sources
# change, and every six hours to catch a change whose event was lost.
version: "1"
name: "Nightshift Detection Rule Reconcile"
description: "Keeps the alerting rules of the Nightshift detection strategies in the space up to date with its knowledge indicators and sources."
# A first install starts off; the space's setup turns it on after checking the binding. A later
# install keeps whatever state the installed workflow has.
enabled: false
tags:
  - observability
  - nightshift
  - detection-engine
settings:
  # Replaced with the bound service account when the workflow is installed in a space.
  run_as: __SERVICE_ACCOUNT_ID__
  timeout: "5m"
  # A burst of changes gives one reconciliation: each new run cancels the one still waiting, and
  # the last one reads the knowledge as it is once the burst is over.
  concurrency:
    key: "nightshift-detection-rule-reconcile"
    strategy: cancel-in-progress
    max: 1
triggers:
  - type: nightshift-detection.rulesStale
  - type: scheduled
    with:
      every: "6h"
steps:
  # Only the schedule and the engine's own trigger start this workflow. Anyone allowed to run
  # workflows could otherwise change rules as the service account. Only server code sets
  # `triggeredBy`.
  - name: refuse_direct_runs
    type: if
    condition: 'not (execution.triggeredBy : "scheduled" or execution.triggeredBy : "nightshift-detection.rulesStale")'
    steps:
      - name: refuse
        type: workflow.fail
        with:
          message: >-
            This workflow reconciles the Nightshift detection rules as its service account when
            knowledge or sources change, and cannot be run directly. This run was started by
            {{ execution.triggeredBy }}.

  # Waits for the burst of writes to settle; a run started meanwhile cancels this one.
  - name: settle
    type: wait
    with:
      duration: 30s

  - name: reconcile
    type: kibana.request
    with:
      method: POST
      path: "/s/{{ workflow.spaceId }}/internal/nightshift/detection/rules/_reconcile"
      body: {}
