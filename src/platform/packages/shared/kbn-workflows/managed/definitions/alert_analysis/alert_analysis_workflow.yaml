# =============================================================================
# Security Alert Analysis Workflow
# =============================================================================
#
# Purpose:
#   Automatically triages security alerts using an AI agent. This workflow is
#   attached to a detection rule and receives a batch of alerts. It reads the
#   invoking space's runtime config once, then fans out over the batch, invoking
#   the per-alert child workflow ("Security Alert Analysis (single alert)") once
#   per alert (in parallel) via a `workflow.execute` step. Each child gathers
#   contextual enrichment data, classifies the alert with an LLM-based agent,
#   records the verdict as an alert note, applies workflow tags, and optionally
#   auto-closes false positives.
#
# Flow:
#   - Initialise the workflow version, then read per-space runtime config (tag prefix,
#     connector, thresholds, enabled) from the invoking space's uiSettings.
#   - Guard on the runtime enabled flag and a configured connector; a disabled or
#     unconfigured space no-ops.
#   - Fan out over the alert batch, running the per-alert child workflow once per
#     alert with bounded concurrency. Each child owns its own `variables.*` namespace
#     and navigation runtime, so per-alert accumulators and flow-control stay isolated.
#   - `mode: settled` lets every child reach a terminal state, so one failing alert
#     does not abort the others; each failed child writes its own error note.
#
#
# Author: Elastic
# =============================================================================

name: "Security Alert Analysis"
enabled: true
description: "Security alert analysis workflow. Author: Elastic"
version: "1"
tags:
  - security
  - alert_analysis

triggers:
  - type: alert

# NOTE: no workflow-level `settings.on-failure` here. A workflow-level retry/continue handler wraps
# every step in a retry zone, including the single `workflow.execute` body of the `analyze_alerts`
# parallel step. The parallel executor requires a straight-line branch body (no enter-/exit- wrapper
# nodes), so a workflow-level on-failure would make the fan-out fail to compile. Steps that need
# retry declare their own step-level `on-failure` (e.g. fetch_runtime_config, and the child steps).

# ---------------------------------------------------------------------------
# Configuration constants
# ---------------------------------------------------------------------------
# Adjust these values to tune workflow behaviour without editing step logic.

consts:
  workflow_version: "v0.0.1"

  # When false, the workflow exits early if the alert already carries the
  # workflow tag prefix. Set to true to re-evaluate previously analyzed alerts.
  override_previous: false

  # Tag suffix appended when an alert is auto-closed by this workflow
  closed_tag_suffix: "closed"

  # Maximum number of alerts fanned out per batch. Matches the parallel step's
  # DEFAULT_PARALLEL_MAX_FAN_OUT (100) and the default rule `max_signals` (100).
  # Batches larger than this are truncated to the cap (see analyze_alerts) rather
  # than failing the whole run; the remaining alerts keep their un-analyzed state.
  max_fan_out: 100

# NOTE: the tag prefix, connector, auto-close, create-conversation, and enabled settings are NOT
# constants here. They are per-space and read at run time from the invoking space's uiSettings (see
# the fetch_runtime_config step below), so a single global install serves every space with live
# config.

# =============================================================================
# Steps
# =============================================================================
steps:

  # ---------------------------------------------------------------------------
  # Initialise workflow-scoped variables
  # ---------------------------------------------------------------------------
  # Derive the normalised version used throughout the workflow. The tag prefix is per-space and set
  # from runtime config below (set_runtime_config_variables), not here.
  - name: set_workflow_variables
    type: data.set
    with:
      running_note: false
      normalized_version: "{{ consts.workflow_version | downcase | replace: ' ', '_' }}"

  # ---------------------------------------------------------------------------
  # Read this space's configuration at run time
  # ---------------------------------------------------------------------------
  # The workflow is installed once in the global space; configuration lives in each space's
  # uiSettings, not in this document. A raw kibana.request is not space-scoped automatically, so the
  # path is prefixed with the execution's space to read the invoking space's settings.
  - name: fetch_runtime_config
    type: kibana.request
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/security_solution/alert_analysis_workflow/runtime_config"
      headers:
        kbn-xsrf: string
        elastic-api-version: "1"
        Content-Type: application/json

  - name: set_runtime_config_variables
    type: data.set
    with:
      # `${{ }}` preserves booleans/numbers; `{{ }}` is used for the connector id, agent id, and tag prefix strings.
      workflow_enabled: "${{ steps.fetch_runtime_config.output.workflowEnabled }}"
      connector_id: "{{ steps.fetch_runtime_config.output.connectorId }}"
      agent_id: "{{ steps.fetch_runtime_config.output.agentId }}"
      create_conversation: "${{ steps.fetch_runtime_config.output.createConversation }}"
      auto_close_enabled: "${{ steps.fetch_runtime_config.output.autoCloseEnabled }}"
      auto_close_confidence_score_min_threshold: "${{ steps.fetch_runtime_config.output.autoCloseConfidenceScoreMinThreshold }}"
      auto_close_confidence_score_max_threshold: "${{ steps.fetch_runtime_config.output.autoCloseConfidenceScoreMaxThreshold }}"
      # Prefix for the tags written to and matched on each analyzed alert (dedup gate + auto-close).
      tag_prefix: "{{ steps.fetch_runtime_config.output.tagPrefix }}"

  # ---------------------------------------------------------------------------
  # Fan out over the alert batch, one child workflow execution per alert
  # ---------------------------------------------------------------------------
  # Runtime guard: enrichment, the AI agent call, and auto-close only run when this space has the
  # workflow enabled and a connector configured. A disabled or unconfigured space no-ops, which is
  # why enabled-by-default with an empty connector is safe. The `parallel` step schema has no `if`,
  # so the guard lives on this single enclosing `if` step, keeping it in exactly one place.
  - name: run_alert_analysis
    type: if
    condition: "${{ variables.workflow_enabled and variables.connector_id != '' }}"
    steps:

      # Warn (do not fail) when the batch exceeds the parallel fan-out cap. The default `max_signals`
      # (100) equals the cap (100), so this only fires for rules that raised `max_signals` above it.
      # We truncate to the cap in analyze_alerts rather than failing the whole batch, so the first
      # `max_fan_out` alerts are still analyzed and the remainder keep their un-analyzed state and are
      # picked up on a later run.
      - name: log_fan_out_batch
        type: console
        with:
          message: >-
            {% assign alert_count = event.alerts | size -%}
            Alert analysis fan-out: {{ alert_count }} alert(s) in batch.
            {% if alert_count > consts.max_fan_out -%}
            WARNING: batch exceeds the fan-out cap ({{ consts.max_fan_out }}); only the first
            {{ consts.max_fan_out }} alert(s) will be analyzed this run.
            {%- endif %}

      # One child execution per alert, bounded to `concurrency` at a time. Each child owns its own
      # `variables.*` namespace and navigation runtime, so the per-alert accumulators and flow-control
      # that ran sequentially in the old loop stay isolated per alert. `mode: settled` lets every child
      # reach a terminal state so one failing alert does not abort the others (each failed child writes
      # its own error note). `concurrency: 1` is the sequential kill-switch.
      - name: analyze_alerts
        type: parallel
        foreach: "{{ event.alerts | slice: 0, consts.max_fan_out | json }}"
        concurrency: 5
        mode: settled
        steps:
          - name: analyze_single_alert
            type: workflow.execute
            with:
              workflow-id: system-security-alert-analysis-single
              inputs:
                # `${{ }}` preserves the object/number/boolean types; a plain `{{ }}` would stringify.
                alert: "${{ foreach.item }}"
                rule_id: "{{ event.rule.id }}"
                connector_id: "{{ variables.connector_id }}"
                agent_id: "{{ variables.agent_id }}"
                tag_prefix: "{{ variables.tag_prefix }}"
                create_conversation: "${{ variables.create_conversation }}"
                auto_close_enabled: "${{ variables.auto_close_enabled }}"
                auto_close_confidence_score_min_threshold: "${{ variables.auto_close_confidence_score_min_threshold }}"
                auto_close_confidence_score_max_threshold: "${{ variables.auto_close_confidence_score_max_threshold }}"

      # Surface aggregate outcomes so `settled` does not hide failures from operators. Per-alert error
      # notes are written by the child; this is the batch-level summary.
      - name: log_fan_out_results
        type: console
        with:
          message: >-
            Alert analysis fan-out complete:
            {{ steps.analyze_alerts.output.succeeded | default: 0 }} succeeded,
            {{ steps.analyze_alerts.output.failed | default: 0 }} failed
            of {{ steps.analyze_alerts.output.total | default: 0 }} total.
