title: 'Add rotate uninstall token API and UI '
description: Added a **Rotate uninstall token** button to the agent policy tamper protection settings and a corresponding `POST /api/fleet/uninstall_tokens/{agentPolicyId}/rotate` API endpoint. This allows operators to invalidate a leaked uninstall token without having to recreate the policy and migrate agents.
