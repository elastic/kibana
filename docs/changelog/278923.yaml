title: Add API and UI to rotate Fleet agent uninstall tokens
description: Adds a "Rotate uninstall token" button to agent policy tamper protection
  settings and a `POST /api/fleet/uninstall_tokens/{agentPolicyId}/rotate` endpoint.
  Operators can invalidate a leaked uninstall token without recreating the policy
  and migrating agents.
