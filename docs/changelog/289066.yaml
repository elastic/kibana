title: Fix time range picker labels for custom presets and rounded ranges
description: "Fixes custom quick ranges showing raw time values instead of their configured label. Rounded relative ranges now end with a (rounded) suffix, for example Last 1 year (rounded) for `-1y/y`. Also fixes the absolute date format used for display."
