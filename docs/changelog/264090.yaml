title: 'Allow users to snooze/unsnooze an alert '
description: Users can now snooze individual alert instance with optional time-based expiry, field-change, severity-change, or severity-equals conditions. They can also unsnooze an individual alert instance. A new `kibana.alert.snoozed` field is written to alert documents.
