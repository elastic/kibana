title: Remove elastic-charts imports from server side build
description: Fixes a startup crash that could occur when upgrading Kibana if the `node.options` configuration file from a previous version was preserved. The crash was caused by server-side code importing the browser-only `@elastic/charts` library, which transitively loaded an ESM-only dependency incompatible with Node.js `require()`.
