title: Fix histogram granularity
description: "Fixed Lens as-code histogram `granularity` to preserve the target bar count on round-trip instead of clamping values above `7` to `auto`. The API no longer enforces a fixed upper bound; the effective ceiling remains the `histogram:maxBars` advanced setting at render time."
