title: Add AI Agent announcement modal with opt-out to classic assistant
description: '**Security and Observability:** The default chat experience is now **AI Agent** in these contexts. A one-time announcement appears for users who have not seen it yet in the current space, explaining the change, what to expect, and how to return to the classic **AI Assistant** via GenAI Settings if they prefer. The dismissal state is remembered per space.'
