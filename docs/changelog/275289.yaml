title: Fix duplicate APM anomaly detection alerts
description: APM anomaly detection rules could fire duplicate alerts because each
  run re-queried overlapping time windows. Rules now filter ML results on `event.ingested`
  (result write time) instead of anomaly bucket time, so each anomaly is matched once.
