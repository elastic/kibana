title: Fix false validation errors for Liquid dynamic keys in workflow property paths
description: Fixes the Workflows editor incorrectly flagging valid Liquid map lookups as invalid when the key is a variable, such as `{{ inputs.payload.rules[ep.rule_id].name }}`. Those expressions already ran correctly; the editor no longer shows a false error.
