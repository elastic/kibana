title: Disable "Use without saving" when a custom data view ID is set
description: Fixes an issue where two ad hoc (unsaved) data views could be created with the same custom ID, causing unpredictable behavior. Use without saving is now disabled when a custom data view ID is entered — save the data view instead to use a custom ID.
