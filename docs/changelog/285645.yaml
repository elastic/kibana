- product: kibana
title: "Require `workflow:read` for workflow execution detail APIs"
impact: |
  The following routes now require the `workflow:read` privilege:

  ```
  GET /api/workflows/workflow/{workflowId}/executions
  GET /api/workflows/workflow/{workflowId}/executions/steps
  ```

  This change is transparent for the UI, which already requires the `workflow:read` privilege.
action: |
  API users with only the `workflows:readExecution` privilege must be granted the `workflow:read` privilege to use these APIs.
