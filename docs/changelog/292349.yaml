title: Fix Agent Builder tools hanging when querying data streams that span the frozen tier
description: Fixes Agent Builder tools hanging or timing out when querying data streams that span the frozen tier. Tools now exclude frozen tier indices from the data they inspect and query, so requests no longer wait on searchable snapshots recovering from object storage.
