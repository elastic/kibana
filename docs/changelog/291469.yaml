title: Bridge local Windows user entities to Active Directory by SID
description: Automated entity resolution now links local Windows and CrowdStrike endpoint user entities to the matching Active Directory user by SID. The CrowdStrike-namespace SID bridge and the Microsoft 365 UPN bridge are off by default.
