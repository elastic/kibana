title: "Reject invalid `additional_datastreams_permissions` in Fleet package policies"
impact: "Package policies with `additional_datastreams_permissions` values that do not match the documented `<type>-<suffix>` datastream grammar (for example `logs*` without a dash) are now rejected."
action: "Update any non-matching `additional_datastreams_permissions` values to the `<type>-<suffix>` form (for example `logs-nginx-*`)."
