title: Fix global field defaults not applied to cases created by API or workflows
description: "Fixes an issue where default values of global case fields were not applied to cases created by the API or workflow steps. Also hardens the cases template migration backfill: it now uses version checks so concurrent edits are never overwritten, and it never modifies a field value a user has set or cleared."
