title: Fix Fleet skipping asset updates across Kibana upgrades
description: Fixed an issue where Kibana assets from an installed integration package (such as dashboards used by prebuilt detection rules) could remain stale across a Kibana upgrade because Fleet never overwrote existing assets on reinstall.
