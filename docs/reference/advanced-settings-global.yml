---
# This file is used to generate "Logging settings" page in the product docs
# For the schema and an example refer to the automated settings reference: 
# https://github.com/elastic/docs-builder/blob/main/docs/syntax/automated_settings.md

product: Kibana
collection: Global advanced settings in Kibana
id: kibana-global-settings-reference
page_description: |
  Change the settings that apply to all of {{product.kibana}}.

  1. Go to the **Advanced settings** page using the navigation menu or the [global search field](docs-content://explore-analyze/find-and-organize/find-apps-and-objects.md).
  2. Click **Global Settings**.
  3. Scroll or search for the setting.
  4. Make your change, then click **Save changes**.

groups:
  - group: General
    id: kibana-general-global-settings
    settings:

      - setting: hideAnnouncements
        id: hideAnnouncements-global
        description: |
          Stops showing messages and tours that highlight new features.
        datatype: bool
        default: false
        applies_to:
          stack: ga 9.4+
          ech: ga
          ece: ga
          eck: ga
          self: ga
          serverless: unavailable

      - setting: "contextEngine:memoryEnabled"
        id: context-engine-memory-enabled
        description: |
          When on, turns on [memory](docs-content://explore-analyze/ai-features/context-engine/concepts.md#memory) for [Context Engine](docs-content://explore-analyze/ai-features/context-engine.md) AI indices.
        datatype: bool
        default: false
        applies_to:
          stack: experimental 9.6+
          ech: ga
          ece: ga
          eck: ga
          self: ga
          serverless:
            elasticsearch: ga
            observability: ga
            vectordb: ga

  - group: Universal Alerting
    id: kibana-alerting-v2-global-settings
    settings:

      - setting: "alerting:v2:enabled"
        id: alerting-v2-enabled
        description: |
          Makes the {{esql}}-based Universal Alerting system available in {{product.kibana}}, including its rules, action policies, and APIs. When this setting is off, {{product.kibana}} hides the **Universal Alerting** interface and rejects requests to its APIs, but rules and action policies that already exist keep running. Disable your rules before you turn this setting off.

          For the steps to turn the system on, confirm that it is available, and stop rules from running, refer to [Set up Universal Alerting](docs-content://explore-analyze/alerting/experimental-alerting-system/get-started/setup.md).
        datatype: bool
        default: true
        applies_to:
          stack: experimental =9.5, ga 9.6+
          ech: ga
          ece: ga
          eck: ga
          self: ga
          serverless: ga
        note: |
          :applies_to: security: ga
          This setting is unavailable on the [Elastic AI SOC Engine (EASE)](docs-content://solutions/security/ai/ease/ease-intro.md) Security project type.

  - group: "{{esql}} Data Federation"
    id: kibana-data-federation-global-settings
    settings:

      - setting: "dataFederation:enabled"
        id: data-federation-enabled
        description: |
          When on, {{product.kibana}} shows the [{{esql}} Data Federation](elasticsearch://reference/query-languages/esql/esql-data-federation.md) management UI. Turning this setting off hides the UI but doesn't affect existing data sources or datasets. You can still manage them through the API and reference datasets in {{esql}} queries. Refresh the page to apply the change.
        datatype: bool
        default: true
        applies_to:
          stack: preview 9.6+
          ech: ga
          ece: ga
          eck: ga
          self: ga
          serverless: unavailable
        note: |
          :applies_to: {stack: preview 9.6+}
          {{esql}} Data Federation requires an Enterprise [subscription](https://www.elastic.co/subscriptions).

  - group: Custom branding
    id: kibana-custom-branding-settings
    note: "Custom branding is a [subscription feature](https://www.elastic.co/subscriptions)."
    settings:

      - setting: "xpackCustomBranding:logo"
        id: custom-logo
        description: |
          A custom image that appears in the header of all {{product.kibana}} pages. Images must have a transparent background, and 128x128 pixels or smaller.
        datatype: image
        applies_to:
          stack: ga
          ech: ga
          ece: ga
          eck: ga
          self: ga
          serverless: ga

      - setting: "xpackCustomBranding:customizedLogo"
        id: organization-name
        description: |
          The custom image that replaces the text next to the logo in the header of all {{product.kibana}} pages. Images look best when they are no larger than 200 x 84 pixels and have a transparent background.
        datatype: image
        applies_to:
          stack: ga
          ech: ga
          ece: ga
          eck: ga
          self: ga
          serverless: ga

      - setting: "xpackCustomBranding:pageTitle"
        id: page-title
        description: |
          The custom text that appears on {{product.kibana}} browser tabs.
        datatype: string
        applies_to:
          stack: ga
          ech: ga
          ece: ga
          eck: ga
          self: ga
          serverless: unavailable

      - setting: "xpackCustomBranding:faviconSVG"
        id: favicon-svg
        description: |
          The URL of a custom SVG image that appears on {{product.kibana}} browser tabs. Images must be 16x16 pixels.
        datatype: string
        applies_to:
          stack: ga
          ech: ga
          ece: ga
          eck: ga
          self: ga
          serverless: ga

      - setting: "xpackCustomBranding:faviconPNG"
        id: favicon-png
        description: |
          The URL of a custom PNG image that appears on {{product.kibana}} browser tabs.
        datatype: string
        applies_to:
          stack: ga
          ech: ga
          ece: ga
          eck: ga
          self: ga
          serverless: ga
