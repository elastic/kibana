---
# This file is used to generate "Security Solution settings" page in the product docs
# For the schema and an example refer to the automated settings reference:
# https://github.com/elastic/docs-builder/blob/main/docs/syntax/automated_settings.md

product: Kibana
collection: Security Solution settings in Kibana
id: security-solution-settings
page_description: |
  Configure the following Security Solution settings in the `kibana.yml` file:

groups:
  - group: Cloud Security Posture settings
    id: cloud-security-posture-settings
    settings:

      - setting: xpack.cloudSecurityPosture.enabled
        description: |
          Set to `false` to disable the Kibana UI for Elastic's Cloud Security Posture solution, which provides compliance checks on Cloud and Kubernetes environments.
        datatype: bool
        default: true
        applies_to:
          stack: ga 8.3
          ech: ga
          ece: ga
          eck: ga
          self: ga
          serverless: unavailable

  - group: Value lists settings
    id: value-lists-settings
    settings:

      - setting: xpack.lists.maxImportPayloadBytes
        description: |
          Sets the maximum number of bytes allowed for uploading Security Solution [value lists](docs-content://solutions/security/detect-and-alert/value-lists-exceptions.md). For every 10 MB, it is recommended to have an additional 1 GB of RAM reserved for Kibana.
        datatype: int
        default: 9000000
        applies_to:
          stack: ga
          ech: ga
          ece: ga
          eck: ga
          self: ga
          serverless: unavailable
        note: |
          :applies_to: ech: ga
          On {{ech}}, the value must be between `1000000` and `100000000`.

      - setting: xpack.lists.importBufferSize
        description: |
          Sets the buffer size used for uploading Security Solution [value lists](docs-content://solutions/security/detect-and-alert/value-lists-exceptions.md). Increase the value to improve upload throughput at the expense of higher Kibana memory usage; decrease it to reduce memory usage at the cost of throughput.
        datatype: int
        default: 1000
        applies_to:
          stack: ga
          ech: ga
          ece: ga
          eck: ga
          self: ga
          serverless: unavailable
        note: |
          :applies_to: ech: ga
          On {{ech}}, the value must be between `1` and `10000`.

  - group: Elastic Defend settings
    id: elastic-defend-settings
    settings:

      - setting: xpack.securitySolution.maxUploadResponseActionFileBytes
        description: |
          Configure the maximum file size, in bytes, for use with the `upload` response action available with the Elastic Defend integration. There is no upper limit. To learn more, check [Endpoint response actions](docs-content://solutions/security/endpoint-response-actions.md#_upload).
        datatype: int
        default: 209715200
        applies_to:
          stack: ga 8.9
          ech: ga
          ece: ga
          eck: ga
          self: ga
          serverless: unavailable
        note: |
          :applies_to: stack: ga 8.9-9.4
          In these versions, the default is `26214400` bytes (25 MB) and the maximum is `104857600` bytes (100 MB).
        warning: |
          :applies_to: stack: ga 9.5+
          Setting this value too high may cause timeouts, depending on your cluster's setup and resources.

      - setting: xpack.securitySolution.disableEndpointRuleAutoInstall
        description: |
          Set to `true` to stop Kibana from automatically installing the **Endpoint Security (Elastic Defend)** prebuilt rule when a new Elastic Defend integration policy is created. Set to `false` to keep the automatic installation.
        datatype: bool
        default: false
        applies_to:
          stack: ga 9.1.10!+
          ech: ga
          ece: ga
          eck: ga
          self: ga
          serverless: unavailable
        note: |
          :applies_to: stack: ga 9.2.0!-9.2.3!
          This setting is not available in these versions.

      - setting: xpack.securitySolution.maxEndpointScriptFileSize
        description: |
          The maximum file size, in bytes, for scripts uploaded to the Elastic Defend script library.
        datatype: int
        default: 26214400
        applies_to:
          stack: ga 9.4+
          ech: ga
          ece: ga
          eck: ga
          self: ga
          serverless: unavailable

  - group: Entity analytics settings
    id: entity-analytics-settings
    settings:

      - setting: xpack.securitySolution.entityAnalytics.riskEngine.alertSampleSizePerShard
        description: |
          The maximum number of alerts per index shard that the risk engine samples for each entity when calculating risk scores. A value set in the risk engine configuration takes precedence over this setting.
        datatype: int
        default: 10000
        applies_to:
          stack: ga
          ech: unavailable
          ece: ga
          eck: ga
          self: ga
          serverless: unavailable

      - setting: xpack.securitySolution.entityAnalytics.monitoring.privileges.users.maxPrivilegedUsersAllowed
        description: |
          The maximum number of privileged users that [privileged user monitoring](docs-content://solutions/security/advanced-entity-analytics/privileged-user-monitoring.md) can track.
        datatype: int
        default: 10000
        applies_to:
          stack: ga 9.2, deprecated 9.4+
          ech: unavailable
          ece: ga
          eck: ga
          self: ga
          serverless: unavailable
        deprecation_details: |
          This setting has no effect since 9.4. Kibana accepts it but ignores the value. Privileged user monitoring is replaced by [watchlists](docs-content://solutions/security/advanced-entity-analytics/watchlists.md).

  - group: Experimental features
    id: experimental-features
    settings:

      - setting: xpack.securitySolution.enableExperimental
        description: |
          A list of experimental feature flags to enable.
        datatype: array of strings
        applies_to:
          stack: ga
          ech: ga
          ece: ga
          eck: ga
          self: ga
          serverless: unavailable
        note: "Experimental features should not be enabled in production environments. Experimental features may be changed or removed completely in future releases. Elastic will make a best effort to fix any issues, but experimental features are not supported to the same level as generally available (GA) features."
        example: |
          ```yaml
          xpack.securitySolution.enableExperimental:
            - featureFlagName
          ```
