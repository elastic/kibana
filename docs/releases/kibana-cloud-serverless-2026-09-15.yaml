- file:
    name: 275716.yaml
    checksum: b22adef55368d8d88e657c0b02ea292b3b0b0e9d
  type: breaking-change
  title: Enforce size limits on Detection Engine rule response action payloads
  products:
  - product: cloud-serverless
  - product: kibana
  description: Detection Engine rule response-action payloads now enforce nested size limits on Osquery and Endpoint fields across create, update, patch, preview, and import operations.
  impact: API requests that include `response_actions` fields exceeding the new limits are rejected. Stored rules with oversized values can fail when read or executed through validated paths.
  action: 'Review all `response_actions` payloads sent to Detection Engine rules APIs and ensure values stay within limits: Osquery SQL, ECS mapping values, and Endpoint comments up to 30,000 characters; IDs, query metadata, and script identifiers up to 256 characters; run-script input up to 8,192 characters; ECS mapping field paths up to 2,000 characters. Update any stored rules that exceed these limits before using create, update, patch, preview, or import endpoints.'
  prs:
  - https://github.com/elastic/kibana/pull/275716
