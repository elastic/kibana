- file:
    name: 285645.yaml
    checksum: 325dad31d1906b314243f910f0650a3c63d7bef6
  type: breaking-change
  title: Require the `read` privilege for workflow execution detail APIs
  products:
  - product: cloud-serverless
    target: 2026-08-25
  - product: kibana
  impact: >
    The following routes now require the `workflowsManagement:read` privilege in addition to `workflowsManagement:readExecution`:


    ```

    GET /api/workflows/workflow/{workflowId}/executions

    GET /api/workflows/workflow/{workflowId}/executions/steps

    ```


    This change is transparent for the UI, which already requires the `workflow:read` privilege.
  action: >
    API users with only the `workflowsManagement:readExecution` privilege must also be granted `workflowsManagement:read` to use these APIs.
  subtype: api
  prs:
  - https://github.com/elastic/kibana/pull/285645
  issues:
  - '# PRIVATE: https://github.com/elastic/security-team/issues/18893'
