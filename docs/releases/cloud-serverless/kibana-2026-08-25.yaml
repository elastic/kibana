  type: enhancement
  title: Allow Elastic videos and related iframes to load in Kibana
  products:
  - product: cloud-serverless
    target: 2026-08-25
  - product: kibana
  description: Adds a default Content Security Policy `frame-src` allow list so in-product videos and Elastic-hosted iframes keep working when stricter CSP defaults are enforced. Allowed origins include `videos.elastic.co`, `play.vidyard.com`, `kibana.estccdn.com`, and `ela.st`. Operators only need to extend `csp.frame_src` for additional iframe sources.
