  title: Validate the `data_stream.dataset` field for the `integration` package type
  products:
  - product: cloud-serverless
  - product: kibana
  description: 'The `data_stream.dataset` field is now validated for all package types in the Fleet policy editor, not only `type: input` packages. Integration packages that expose a user-configurable dataset name (such as Custom AWS Logs) will now correctly reject names containing invalid characters (hyphens, spaces, uppercase letters, etc.). If you have existing integration policies with invalid dataset names, you will need to update them manually — a validation error will appear the next time you edit or upgrade those policies.'
