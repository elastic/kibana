  title: Add write actions to the Gmail connector
  products:
  - product: cloud-serverless
  - product: kibana
  description: Adds eight write actions to the Gmail connector — `listLabels`, `modifyLabels`, `markAsRead`, `markAsUnread`, `trashMessage`, `untrashMessage`, `sendMessage`, and `replyMessage`. They enable phishing-remediation workflows that can label, quarantine, and reply to emails directly from Kibana. Write actions require OAuth 2.0 authorization code authentication with the `gmail.modify` scope.
