- file:
    name: 287729.yaml
    checksum: 57a89f0c5d48948a0f7903bdf3c1934760df64c3
  type: breaking-change
  title: Change `actions` case attachments to return `security.endpoint` shape
  products:
  - product: cloud-serverless
  - product: kibana
  description: The legacy `actions` attachment type in Cases is now normalized to the `security.endpoint` / `externalReference` shape on all read and write API responses. Documented attachment types (`user` and `alert`) are byte-identical and unchanged.
  impact: Any consumer reading `actions` attachments from Cases endpoints (`GET /api/cases/{caseId}/comments`, `_find`, POST/PATCH responses) now receives the `security.endpoint` / `externalReference` shape instead of the `actions` shape.
  action: Update any code that inspects `actions` attachment responses to handle the `security.endpoint` / `externalReference` shape. No changes are required for `user` or `alert` attachment types.
  areas:
  - Alerting and reporting
  prs:
  - https://github.com/elastic/kibana/pull/287729
