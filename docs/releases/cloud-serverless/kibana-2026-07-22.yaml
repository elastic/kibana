    name: 275289.yaml
    checksum: 96fd67e6e6182c41eec448288919afedcf1a3d71
  type: bug-fix
  title: Fix duplicate APM anomaly detection alerts
  products:
  - product: cloud-serverless
    target: 2026-07-22
  - product: kibana
  description: APM anomaly detection rules could fire duplicate alerts because each run re-queried overlapping time windows. Rules now filter ML results on `event.ingested` (result write time) instead of anomaly bucket time, so each anomaly is matched once.
  prs:
  - https://github.com/elastic/kibana/pull/275289
  issues:
  - https://github.com/elastic/kibana/issues/259298
