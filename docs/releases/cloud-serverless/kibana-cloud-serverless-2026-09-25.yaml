- file:
    name: 291995.yaml
    checksum: 313c456f9310c4447a30a258a38d0a6038a4cdab
  type: deprecation
  title: Deprecate single-evaluation feature flag APIs on the plugin start contract
  products:
  - product: cloud-serverless
  - product: kibana
  description: Deprecates `getBooleanValue`, `getStringValue`, and `getNumberValue` on the browser and server plugin start contracts. One-shot evaluation on the HTTP request-handler context remains supported.
  impact: Plugin authors who call `core.featureFlags.getBooleanValue`, `getStringValue`, or `getNumberValue` from `start()` see those methods marked deprecated.
  action: Switch plugin `start()` callers to the observable `$` APIs (`getBooleanValue$`, `getStringValue$`, and `getNumberValue$`, or the React `use*Value` hooks). Continue using the request-handler context APIs in HTTP route handlers.
  areas:
  - Kibana platform
  prs:
  - https://github.com/elastic/kibana/pull/291995
  issues:
  - https://github.com/elastic/kibana/issues/291993
