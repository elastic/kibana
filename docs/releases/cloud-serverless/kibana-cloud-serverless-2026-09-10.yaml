- file:
    name: 287084.yaml
    checksum: 42acac41f4703ac4adfe1be2230160072125998d
  type: enhancement
  title: Stop treating IAM lifecycle events as identity-provider user sources
  products:
  - product: cloud-serverless
  - product: kibana
  description: 'Removes IAM lifecycle events as a source of high-confidence users in the Entity Store. Only `event.kind: asset` events create identity-provider (IdP) grade users. Host-local accounts with `user.name` and `host.id` become `local` entities instead. Alerts on users in identity-provider namespaces (Okta, Entra ID, Active Directory) continue to resolve to their stored entity, so risk scores, entity id stamps, and asset-criticality enrichment are unaffected.'
  prs:
  - https://github.com/elastic/kibana/pull/287084
  issues:
  - https://github.com/elastic/kibana/issues/284894
  - https://github.com/elastic/kibana/issues/268990
