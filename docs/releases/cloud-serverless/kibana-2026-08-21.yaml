- file:
    name: 282130.yaml
    checksum: 0c3a12ee8779b70bfe168b4c8603368f76e5692b
  type: breaking-change
  title: Entity Store v2 indices are renamed from Security-scoped names (`.entities.v2.*.security_{space}`) to solution-neutral names (`.entities.v2.*.{space}`).
  products:
  - product: cloud-serverless
    target: 2026-08-21
  - product: kibana
  impact: Custom Elasticsearch roles that only grant privileges on the old `security_*` patterns will get `403` when querying the new neutral names (such as `.entities.v2.latest.*`, `.entities.v2.latest.{space}`, concrete `-00001` indices, updates or metadata streams) until those roles are updated. Compatibility aliases preserve access for callers that still target the old names and enable or install privilege checks that accept either naming scheme during the transition.
  action: Existing deployments migrate automatically on Kibana upgrade (background task) and on Entity Store install.
  prs:
  - https://github.com/elastic/kibana/pull/282130
