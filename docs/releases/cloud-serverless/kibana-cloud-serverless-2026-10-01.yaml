  type: breaking-change
  title: Remove the Playground app
  products:
  - product: cloud-serverless
  - product: kibana
  description: Removes the Playground app. Saved playgrounds (prompts, queries, index selections, and connector settings) are deleted on upgrade and cannot be exported.
  impact: Playground is no longer available. Saved playgrounds are deleted when you upgrade, and you can't export them afterward. Any `xpack.searchPlayground.*` setting in `kibana.yml` is ignored and logs a deprecation warning. Kibana still starts.
  action: Use Agent Builder instead of Playground.
  subtype: other
  prs:
  - https://github.com/elastic/kibana/pull/291514
