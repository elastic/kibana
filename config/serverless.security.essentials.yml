# Security Essentials tier config

## Cloud settings
xpack.cloud.serverless.product_tier: essentials

xpack.fleet.internal.registry.excludePackages: [
  # Oblt integrations
  'apm',
  'synthetics',
  'synthetics_dashboards',

  # Deprecated security integrations
  'bluecoat',
  'cisco',
  'cyberark',
  'cylance',
  'f5',
  'fortinet_forticlient',
  'juniper_junos',
  'juniper_netscreen',
  'microsoft',
  'netscout',
  'radware',
  'symantec',
  'tomcat',

]

### Agent Builder should not be enabled in this tier
xpack.agentBuilder.enabled: false

### Workflows Management plugin is not available in this tier
workflowsManagement.available: false

xpack.features.overrides:
  ### The following features are Security features hidden in Role management UI for this specific tier.
  workflowsManagement.hidden: true
  ### Agentic investigations sits on the workflows platform, which is unavailable above, so no
  ### proposal can be created in this tier. Hiding keeps its privileges out of Role management.
  # agenticInvestigations.hidden: true # TODO: uncomment when agentic investigations plugin is enabled
