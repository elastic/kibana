$schema: https://moonrepo.dev/schemas/v2/tasks.json

inheritedBy:
  tags:
    - ftr-tests

tasks:
  # CI selection target: `moon query tasks --affected` reports this task when the project's FTR
  # configs may be affected. CI maps it to the `ftr-config` files from the FTR manifests and runs
  # them through the existing Buildkite groups; the task itself executes nothing.
  ftr:
    command: noop
    deps:
      - target: '~:source-upstream'
        cacheStrategy: hash
    inputs:
      - '@group(src)'
      - '@group(excludeRunnerOnly)'
      - '@group(ftr-config)'
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
