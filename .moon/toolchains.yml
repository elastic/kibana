# https://moonrepo.dev/docs/config/toolchains
$schema: 'https://moonrepo.dev/schemas/v2/toolchains.json'


javascript:
  packageManager: pnpm
  inferTasksFromScripts: true # Automatically infer tasks from package.json scripts.
  dependencyVersionFormat: workspace
  rootPackageDependenciesOnly: true # Keep installs rooted at the workspace package.json only.
  syncPackageManagerField: false # packageManager is pinned by hand + corepack; don't let moon rewrite it.
  dedupeOnLockfileChange: true # Dedupe dependencies when the lockfile changes.
  syncProjectWorkspaceDependencies: false

node:
  syncVersionManagerConfig: nvm

# Required by moon v2 when javascript.packageManager is pnpm — enables the pnpm
# toolchain for `command: pnpm` tasks and moon-initiated installs/dedupe.
pnpm: {}

typescript:
  includeProjectReferenceSources: false # This would add references to tsconfigs
  syncProjectReferences: false # This would add references to tsconfigs
  syncProjectReferencesToPaths: false # This would add path mapping to compiler options
