name: Test flaky fix scripts

on:
  pull_request:
    paths:
      - '.github/scripts/label_flaky_fix_pr.ts'
      - '.github/scripts/label_flaky_fix_pr_test.ts'
      - '.github/scripts/team_labels.ts'
      - '.github/scripts/prefetch_pr_context.js'
      - '.github/scripts/flaky_fix_retrospective_context.js'
      - '.github/scripts/flaky_fix_retrospective_context.test.js'
      - '.github/workflows/flaky_fix_label_tests.yml'
      - '.nvmrc'

permissions:
  contents: read

concurrency:
  group: flaky-fix-label-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test flaky fix scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Run labeling tests
        run: node --test .github/scripts/label_flaky_fix_pr_test.ts

      - name: Run retrospective context tests
        run: node --test .github/scripts/flaky_fix_retrospective_context.test.js
