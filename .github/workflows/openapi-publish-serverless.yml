name: OpenAPI publish (serverless)

on:
  push:
    branches:
      - main
    paths:
      - 'oas_docs/output/kibana.serverless.yaml'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'elastic/kibana'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # TODO: switch to @v1 once elastic/docs-actions#207 merges and tags a release
      - uses: elastic/docs-actions/openapi/lint@355df64f39af21900e4d84afefd093f6b16bc841
        with:
          spec-path: oas_docs/output/kibana.serverless.yaml

      # TODO: switch to @v1 once elastic/docs-actions#208 merges and tags a release
      - uses: elastic/docs-actions/openapi/upload@52cc07161c895346db500376bfd58a37ed427f41
        with:
          spec-path: oas_docs/output/kibana.serverless.yaml
          spec-name: kibana-serverless
          s3-bucket: ${{ vars.OPENAPI_BUCKET }}
