name: Add Streams UI issue to Platform Ingest - UI & Integrations project

on:
  issues:
    types:
      - labeled

env:
  INGEST_PROJECT_ID: 'PVT_kwDOAGc3Zs4AogrP'
  STREAMS_UI_LABEL: 'Team:streams-ui'

jobs:
  add_to_ingest_project:
    runs-on: ubuntu-latest
    steps:
      - uses: octokit/graphql-action@ddde8ebb2493e79f390e6449c725c21663a67505 # v3.0.2
        id: add_to_project
        if: ${{ github.event.label.name == env.STREAMS_UI_LABEL }}
        with:
          query: |
            # Variables have to be snake cased because of https://github.com/octokit/graphql-action/issues/164
            mutation AddToIngestProject($project_id: ID!, $content_id: ID!) {
              addProjectV2ItemById(input: { projectId: $project_id, contentId: $content_id }) {
                  item {
                    id
                  }
                }
              }
          project_id: ${{ env.INGEST_PROJECT_ID }}
          content_id: ${{ github.event.issue.node_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.FLEET_PROJECT_TOKEN }}
