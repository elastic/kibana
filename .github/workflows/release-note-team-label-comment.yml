name: release-note-team-label-comment

on:
  pull_request_target:
    types:
      - opened
      - labeled
      - unlabeled
      - ready_for_review

jobs:
  comment:
    # Skip draft PRs — nudge is most useful when the PR is ready for review.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Comment when release note label is missing team/feature label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = require('./.github/scripts/release_note_team_label_comment');
            await run({ github, context });
