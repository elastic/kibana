name: openapi-publish

on:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+'
    paths:
      - 'oas_docs/output/kibana.yaml'
      - 'oas_docs/output/kibana.serverless.yaml'

concurrency:
  group: openapi-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'elastic/kibana'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: elastic/docs-actions/openapi/lint@v1
        with:
          spec-path: oas_docs/output/kibana.yaml
      - uses: elastic/docs-actions/openapi/lint@v1
        with:
          spec-path: oas_docs/output/kibana.serverless.yaml

      - uses: elastic/docs-actions/openapi/upload@v1
        with:
          spec-path: oas_docs/output/kibana.yaml
          spec-name: kibana

      # Serverless is always-latest: only publish from main.
      - uses: elastic/docs-actions/openapi/upload@v1
        if: github.ref_name == 'main'
        with:
          spec-path: oas_docs/output/kibana.serverless.yaml
          spec-name: kibana-serverless
