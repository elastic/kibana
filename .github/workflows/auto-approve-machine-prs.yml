# Generic auto-approve for machine-created PRs.
# Add new rules to the whitelist in the check step; approval runs when any rule matches.
name: Auto-approve machine PRs

on:
  pull_request_target:
    types:
      - opened

jobs:
  approve:
    name: Auto-approve machine PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - id: check
        name: Check if PR should be auto-approved
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const user = context.payload.pull_request.user.login;
            const headRef = context.payload.pull_request.head.ref;
            const baseRef = context.payload.pull_request.base.ref;

            const whitelist = [
              // { user: 'kibanamachine', branchPrefix: 'api_docs', baseMatch: /^main$/ },
              // { user: 'kibanamachine', branchPrefix: 'backport', baseNotMatch: /^main$/ },
              { user: 'elastic-vault-github-plugin-prod[bot]', branchPrefix: 'scout_metadata_update' },
              { user: 'kibanamachine', branchPrefix: 'update-pipeline-resource-defs', baseMatch: /^main$/ },
              { user: 'kibanamachine', branchPrefix: 'bump-versions' },
              { user: 'elastic-vault-github-plugin-prod[bot]', branchPrefix: 'update-bundled-packages', paths: ['fleet_packages.json'] },
            ];

            // Fetch the list of changed files in the PR
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const changedFiles = files.map(file => file.filename);
            core.info(`PR #${context.payload.pull_request.number} by ${user}: ${headRef} -> ${baseRef}`);
            core.info(`Changed files: ${changedFiles.join(', ')}`);

            const matchedRule = whitelist.find((rule) => {
              const ruleName = `${rule.user}/${rule.branchPrefix}`;
              const reject = (reason) => {
                core.info(`Rule ${ruleName} skipped: ${reason}`);
                return false;
              };

              if (rule.user !== user) return reject(`user is not ${rule.user}`);
              if (!headRef.startsWith(rule.branchPrefix)) return reject(`branch does not start with ${rule.branchPrefix}`);
              if (rule.baseMatch && !rule.baseMatch.test(baseRef)) return reject(`base does not match ${rule.baseMatch}`);
              if (rule.baseNotMatch && rule.baseNotMatch.test(baseRef)) return reject(`base matches ${rule.baseNotMatch}`);

              // If paths is specified, every changed file must match one of them
              if (rule.paths) {
                const allFilesMatch = changedFiles.length > 0 && changedFiles.every(file =>
                  rule.paths.some(path => {
                    // Support glob patterns
                    if (path.includes('*')) {
                      const regex = new RegExp('^' + path.replace(/\*/g, '.*') + '$');
                      return regex.test(file);
                    }
                    return file === path;
                  })
                );
                if (!allFilesMatch) return reject(`not all changed files match ${rule.paths.join(', ')}`);
              }

              return true;
            });

            if (matchedRule) {
              core.notice(`Approving: matched rule ${matchedRule.user}/${matchedRule.branchPrefix}`);
            } else {
              core.notice('Not approving: no rule matched');
            }
            core.setOutput('should_approve', matchedRule ? 'true' : 'false');

      - uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363 # v4.0.0
        name: Approve as github-actions[bot]
        if: steps.check.outputs.should_approve == 'true'
        with:
          github-token: ${{ github.token }}
