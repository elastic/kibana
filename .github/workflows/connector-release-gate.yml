name: Connector release gate

on:
  # Uses pull_request_target so the gate runs trusted base-branch code and can
  # read the production-manifest branch via a read-capable token — no PR code
  # is ever checked out or executed in this workflow.
  # Runs on every PR and exits quickly when the manifest is unchanged so that
  # this check can be made unconditionally required in branch protection rules.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: connector-release-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release_gate:
    name: Connector release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base workflow script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Run connector release gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.KIBANAMACHINE_TOKEN }}
          script: |
            const gate = require('./.github/scripts/connector_release_gate');
            await gate.runConnectorReleaseGate({ github, context, core });
