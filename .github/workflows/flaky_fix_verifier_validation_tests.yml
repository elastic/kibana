name: Flaky fix verifier validation tests

on:
  pull_request:
    paths:
      - '.github/scripts/flaky_fix_verifier_validation.test.ts'
      - '.github/workflows/flaky-fix-verifier.md'
      - '.github/workflows/flaky-fix-verifier.lock.yml'
      - '.github/workflows/flaky_fix_verifier_validation_tests.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/flaky_fix_verifier_validation.test.ts'
      - '.github/workflows/flaky-fix-verifier.md'
      - '.github/workflows/flaky-fix-verifier.lock.yml'
      - '.github/workflows/flaky_fix_verifier_validation_tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            .github/scripts/flaky_fix_verifier_validation.test.ts
            .github/workflows/flaky-fix-verifier.md
            .github/workflows/flaky-fix-verifier.lock.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node --test .github/scripts/flaky_fix_verifier_validation.test.ts
