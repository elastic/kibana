name: 'Trigger Fix Ralph'

on:
  issue_comment:
    types: [created]

# Shared condition: issue comment (not PR), from org member/collaborator, starting with /ralph-fix.
# Duplicated across jobs because job-level `if` cannot reference other jobs.

permissions:
  contents: none

concurrency:
  group: ralph-fix-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  acknowledge:
    name: 'Acknowledge /ralph-fix'
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/ralph-fix') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Post acknowledgment comment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "Fix Ralph has been triggered and is starting up. A follow-up comment with a progress link will appear shortly."

  fix:
    permissions:
      contents: read
      id-token: write
    name: 'Run Fix Ralph'
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/ralph-fix') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    uses: elastic/kibana-error-sentry/.github/workflows/fix-ralph.yml@main
    with:
      issue_number: '${{ github.event.issue.number }}'
    secrets: inherit
