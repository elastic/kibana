name: Label and backport on merge

on:
  pull_request_target:
    types:
      - closed
      - labeled
      - unlabeled

# Adding v9.6.0 (and any filled-in release label) starts another run. Cancel the
# in-debounce run so only the latest label set opens backport PRs.
concurrency:
  group: on-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  on-merge:
    name: 'Label and Backport'
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
        (github.event.action == 'closed' ||
          (github.event.action == 'labeled' &&
            (github.event.label.name == 'backport:all-open' ||
              github.event.label.name == 'backport:version' ||
              (startsWith(github.event.label.name, 'v') &&
                contains(github.event.label.name, '.') &&
                contains(github.event.pull_request.labels.*.name, 'backport:version')))) ||
          (github.event.action == 'unlabeled' &&
            github.event.label.name == 'backport:skip' &&
            (contains(github.event.pull_request.labels.*.name, 'backport:all-open') ||
              contains(github.event.pull_request.labels.*.name, 'backport:version'))))
    steps:
      - name: Checkout Actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'elastic/kibana-github-actions'
          ref: main
          path: ./actions
          persist-credentials: false

      - name: Install Actions
        run: npm install --production --prefix ./actions

      - name: Run On-Merge
        uses: ./actions/on-merge
        with:
          github_token: ${{secrets.KIBANAMACHINE_TOKEN}}
