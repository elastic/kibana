name: Flaky Fix Dispatcher

on:
  schedule:
    # Every 15 minutes, starting at minute 7.
    - cron: '7-59/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log admissions without dispatching fixes or posting receipts
        type: boolean
        default: true

permissions:
  actions: write
  issues: write
  contents: read

concurrency:
  group: flaky-fix-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'elastic/kibana'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts/flaky_fix_queue
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
          MAX_OUTSTANDING: '5'
          MAX_RUNNING: '1'
        with:
          # GITHUB_TOKEN can explicitly dispatch workflows. The fixer still uses
          # kibanamachine for PR creation and the resulting downstream events.
          retries: 0
          script: |
            const { pathToFileURL } = require('node:url');
            const base = `${process.env.GITHUB_WORKSPACE}/.github/scripts/flaky_fix_queue`;
            const { dispatchQueuedFixes } = await import(pathToFileURL(`${base}/queue.ts`).href);
            const { createQueueClient } = await import(pathToFileURL(`${base}/github_client.ts`).href);
            await dispatchQueuedFixes({
              client: createQueueClient(github, context.repo),
              log: core.info,
              dryRun: process.env.DRY_RUN === 'true',
              maxOutstanding: Number(process.env.MAX_OUTSTANDING),
              maxRunning: Number(process.env.MAX_RUNNING),
            });
