name: OpenAPI lint

on:
  pull_request:
    paths:
      - 'oas_docs/**'

permissions:
  contents: read

jobs:
  lint:
    if: github.repository == 'elastic/kibana'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec:
          - oas_docs/output/kibana.yaml
          - oas_docs/output/kibana.serverless.yaml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check if spec was modified
        id: spec-changed
        run: |
          if git diff --name-only HEAD^1 HEAD -- "${{ matrix.spec }}" | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.spec-changed.outputs.changed == 'true'
        uses: elastic/docs-actions/openapi/lint@v1
        with:
          spec-path: ${{ matrix.spec }}
