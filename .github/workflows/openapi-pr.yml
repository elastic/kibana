name: OpenAPI lint

on:
  pull_request:
    branches:
      - main
      - '[0-9]+.[0-9]+'
    paths:
      - 'oas_docs/**'
      - '.github/workflows/openapi-pr.yml'

permissions:
  contents: read

jobs:
  lint-stateful:
    if: github.repository == 'elastic/kibana'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: elastic/docs-actions/openapi/lint@v1
        with:
          spec-path: oas_docs/output/kibana.yaml

  lint-serverless:
    if: github.repository == 'elastic/kibana' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: elastic/docs-actions/openapi/lint@v1
        with:
          spec-path: oas_docs/output/kibana.serverless.yaml
