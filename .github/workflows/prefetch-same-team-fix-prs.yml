name: Prefetch same-team fix PRs

# Shortlist flaky-test-fixer PRs owned by the same team that may fix the same failure.
# The flaky fix verifier checks their diffs to confirm whether the fixes overlap.

on:
  workflow_call:
    inputs:
      pr_number:
        description: flaky-test-fixer PR to find same-team fix PRs for.
        required: true
        type: string
      artifact_name:
        description: Artifact name for the same-team fix PRs.
        required: true
        type: string

jobs:
  prefetch_same_team_fix_prs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Find same-team fix PRs
        # Non-fatal: a lookup failure must not block verification. No file is written, and the
        # verifier treats a missing file as "no candidates".
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { writeDuplicateCandidates } = require('./.github/scripts/find_duplicate_fix_prs.js');
            try {
              await writeDuplicateCandidates({
                github,
                core,
                prNumber: Number(process.env.PR_NUMBER),
                outputDir: '/tmp/same-team-fix-prs',
              });
            } catch (err) {
              core.warning(`Duplicate detection failed: ${err.message}`);
            }

      - name: Upload same-team fix PRs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: /tmp/same-team-fix-prs/duplicate-candidates.json
          if-no-files-found: ignore
          retention-days: 1
