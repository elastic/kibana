# release-notes-comments.yml runs after this workflow and finds it by this name.
# GitHub's workflow_run trigger matches workflows by name, not by file path,
# so rename both files together.
name: release-notes
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]
permissions: {}
jobs:
  release-notes:
    # Skip draft PRs; ready_for_review re-runs the check when the PR leaves draft.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      packages: read
    uses: elastic/docs-actions/.github/workflows/release-notes.yml@v1
    with:
      # Fail breaking-change PRs whose description or changelog entry lacks Impact and Action.
      require-impact-action: true
