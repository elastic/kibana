name: evals-gate

# Posts the `evals gate` commit status: PRs that touch an eval suite's `requireDecisionOnPaths`
# (.buildkite/pipelines/evals/evals.suites.json) need a run or skip label, and a gated suite's run
# must not regress. Re-runs when a `kibana-evals/<suite>` verdict or the `kibana-evals` build status
# arrives from Buildkite.
on:
  pull_request_target:
    # The regression baselines only exist for main.
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft
      # Only acted on when the base branch changed, e.g. a PR retargeted to main.
      - edited
  status:

permissions: {}

# PR and eval status events for one head commit share a group, so the newest run cancels an older
# one and the last status posted always comes from the freshest read of labels and verdicts.
# Workflow-level concurrency also applies to runs whose job is skipped, so every ignored event (an
# unrelated status, or an edit that didn't change the base branch) gets its own group instead;
# otherwise it could cancel an in-progress run.
concurrency:
  group: >-
    evals-gate-${{
      ((github.event.action != 'edited' || github.event.changes.base) && github.event.pull_request.head.sha)
      || ((github.event.context == 'kibana-evals' || startsWith(github.event.context, 'kibana-evals/'))
        && github.event.sha)
      || format('ignored-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  gate:
    name: Evals gate
    if: >-
      (github.event_name == 'pull_request_target'
        && (github.event.action != 'edited' || github.event.changes.base))
      || github.event.context == 'kibana-evals'
      || startsWith(github.event.context, 'kibana-evals/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      # The default branch, where pull_request_target takes the workflow and checkout from: never
      # check out or run PR code.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .buildkite/pipelines/evals
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Post the evals gate status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { runEvalsGateWorkflow } = require('./.buildkite/pipelines/evals/evals_gate_workflow.ts');
            await runEvalsGateWorkflow({ github, context, core });
