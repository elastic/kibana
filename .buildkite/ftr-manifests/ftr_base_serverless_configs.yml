disabled:
  # Base config files, only necessary to inform config finding script

  # Serverless deployment-agnostic default config for api-integration tests
  - x-pack/platform/test/api_integration_deployment_agnostic/default_configs/serverless.config.base.ts
  - x-pack/platform/test/api_integration_deployment_agnostic/default_configs/feature_flag.serverless.config.base.ts
  # Serverless base config files
  - x-pack/platform/test/serverless/shared/config.base.ts
  - x-pack/platform/test/serverless/api_integration/config.base.ts
  - x-pack/platform/test/serverless/functional/config.base.ts

enabled:
  # Serverless deployment-agnostic configs to run platform api-integration tests.
  # `project` is the solution domain of the config's `serverlessProject`. PR selective
  # testing runs a base config when platform code changes or when that solution is affected.
  - x-pack/platform/test/api_integration_deployment_agnostic/configs/serverless/oblt.serverless.config.ts: { project: observability }
  - x-pack/platform/test/api_integration_deployment_agnostic/configs/serverless/search.serverless.config.ts: { project: search }
  - x-pack/platform/test/api_integration_deployment_agnostic/configs/serverless/security.serverless.config.ts: { project: security }
  - x-pack/platform/test/api_integration_deployment_agnostic/configs/serverless/oblt.logs_essentials.serverless.config.ts: { project: observability }
  - x-pack/platform/test/api_integration_deployment_agnostic/configs/serverless/oblt.streams.serverless.config.ts: { project: observability }
  - x-pack/platform/test/api_integration_deployment_agnostic/configs/serverless/oblt.streams_definitions.feature_flag.serverless.config.ts: { project: observability }
  - x-pack/platform/test/api_integration_deployment_agnostic/configs/serverless/oblt.evals.feature_flag.serverless.config.ts: { project: observability }
