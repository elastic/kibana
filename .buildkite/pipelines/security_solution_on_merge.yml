# Owning-team Slack routing. Buildkite sends one step-level notification per
# step (not per parallel job), so a sharded suite pages its channel once.
# `errored` covers timeouts and agent loss, which are not hard_failed.
steps:
  - command: .buildkite/scripts/steps/functional/security_serverless_entity_analytics.sh
    label: 'Serverless Entity Analytics - Security Cypress Tests'
    branches: main
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-4
      preemptible: true
      spotZones: us-central1-f,us-central1-c,us-central1-a
    timeout_in_minutes: 60
    parallelism: 3
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
        - exit_status: '*'
          limit: 1
    notify:
      - slack:
          channels:
            - '#security-entity-analytics-alerts'
          message: ':alert: *Serverless Entity Analytics - Security Cypress Tests* failed on kibana-security-solution-on-merge. Parent kibana-on-merge is soft_fail, so treat this as release-blocking for Security. <${BUILDKITE_BUILD_URL}|View build #${BUILDKITE_BUILD_NUMBER}>'
        if: step.outcome == "hard_failed" || step.outcome == "errored"


