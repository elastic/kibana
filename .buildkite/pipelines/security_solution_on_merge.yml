  # Per-suite Slack followers: check the suite step's aggregate outcome (failed if
  # any parallel shard hard-failed), then soft_fail this step so Slack fires once
  # per suite rather than once per red shard. soft_fail also keeps a notify miss
  # from masking suite results; notify.if must be soft_failed (not hard_failed).
  - label: ':slack: Notify Serverless Entity Analytics - Security Cypress Tests failure'
    key: notify-serverless-entity-analytics
    depends_on:
      - step: serverless-entity-analytics
        allow_dependency_failure: true
    branches: main
    command: |
      if [ "$(buildkite-agent step get outcome --step serverless-entity-analytics)" = "hard_failed" ]; then
        exit 1
      fi
    timeout_in_minutes: 10
    soft_fail: true
    env:
      SKIP_NODE_SETUP: 'true'
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-2
      preemptible: false
    retry:
      automatic:
        - exit_status: '-1'
          limit: 2
    notify:
      - slack:
          channels:
            - '#security-entity-analytics-alerts'
          message: ':alert: *Serverless Entity Analytics - Security Cypress Tests* failed on kibana-security-solution-on-merge. Parent kibana-on-merge is soft_fail — treat as release-blocking for Security. <${BUILDKITE_BUILD_URL}|View build #${BUILDKITE_BUILD_NUMBER}>'
        if: step.outcome == "soft_failed"

  - label: ':slack: Notify Serverless Explore - Security Solution Cypress Tests failure'
    key: notify-serverless-explore
