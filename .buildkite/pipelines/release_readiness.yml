# Pipeline for https://github.com/elastic/kibana/issues/282202
#
# Evaluates release readiness signals for serverless (MKI) releases and posts a
# summary to #kibana-mission-control ahead of the release.
#
# Planned signals:
#   - FTR tests pass on MKI on the latest `dev` commit (appex-qa-serverless-kibana-ftr-tests)
#   - The commit in `dev` has been promoted less than 6h ago
#
# https://buildkite.com/elastic/kibana-serverless-release-readiness

agents:
  image: family/kibana-ubuntu-2404
  imageProject: elastic-images-prod
  provider: gcp
  machineType: n2-standard-2

env:
  TEAM_CHANNEL: '#kibana-mission-control'

steps:
  - label: ':mag: Evaluate release readiness signals'
    command: .buildkite/scripts/pipelines/release_readiness/notify_release_readiness.sh

notify:
  - slack: '#kibana-mission-control'
    if: build.state == "failed"
