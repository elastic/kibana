steps:
  - command: .buildkite/scripts/steps/next_docs/build_and_validate_docs.sh
    label: 'Build and Validate Next Docs'
    key: check_next_docs
    agents:
      machineType: n2-standard-4
      preemptible: true
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    timeout_in_minutes: 30
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
