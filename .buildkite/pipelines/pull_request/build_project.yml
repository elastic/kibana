steps:
  - command: .buildkite/scripts/steps/artifacts/docker_image.sh
    label: 'Build Project Image'
    key: build_project_image
    agents:
      machineType: c4-standard-4-lssd
      preemptible: true
      spotZones: us-central1-a,us-central1-b,us-central1-c,us-central1-f,us-east1-b,us-east1-c,us-east1-d,us-west1-a,us-west1-b,us-west1-c
      diskType: hyperdisk-balanced
      diskSizeGb: 150
    timeout_in_minutes: 90
    soft_fail: true
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
