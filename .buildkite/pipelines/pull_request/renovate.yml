steps:
  - command: .buildkite/scripts/steps/renovate.sh
    label: 'Renovate validation'
    agents:
      machineType: n2-highcpu-8
      preemptible: true
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    key: renovate_validation
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
