steps:
  - group: 'Self-timeout hook validation'
    key: self-timeout-hook-validation
    steps:
      - command: .buildkite/scripts/lifecycle/self_timeout_demo.sh opt_in_control
        label: 'Self-timeout: opt-in control'
        key: self-timeout-opt-in-control
        env:
          SKIP_NODE_SETUP: 'true'
        agents:
          machineType: n2-standard-2
          preemptible: true
          spotZones: us-central1-f,us-central1-c,us-central1-a
        timeout_in_minutes: 5
        retry:
          automatic:
            - exit_status: '*'
              limit: 0

      - command: .buildkite/scripts/lifecycle/self_timeout_demo.sh term_responsive
        label: 'Self-timeout: TERM-responsive'
        key: self-timeout-term-responsive
        env:
          SKIP_NODE_SETUP: 'true'
          KIBANA_SELF_TIMEOUT_MINUTES: '1'
        agents:
          machineType: n2-standard-2
          preemptible: true
          spotZones: us-central1-f,us-central1-c,us-central1-a
        timeout_in_minutes: 3
        soft_fail:
          - exit_status: 124
        retry:
          automatic:
            - exit_status: '*'
              limit: 0

      - command: .buildkite/scripts/lifecycle/self_timeout_demo.sh term_ignoring
        label: 'Self-timeout: TERM-ignoring'
        key: self-timeout-term-ignoring
        env:
          SKIP_NODE_SETUP: 'true'
          KIBANA_SELF_TIMEOUT_MINUTES: '1'
        agents:
          machineType: n2-standard-2
          preemptible: true
          spotZones: us-central1-f,us-central1-c,us-central1-a
        timeout_in_minutes: 3
        soft_fail:
          - exit_status: 124
        retry:
          automatic:
            - exit_status: '*'
              limit: 0

      - command: .buildkite/scripts/lifecycle/self_timeout_demo.sh exit_137
        label: 'Self-timeout: unmarked exit 137'
        key: self-timeout-exit-137
        env:
          SKIP_NODE_SETUP: 'true'
          KIBANA_SELF_TIMEOUT_MINUTES: '1'
        agents:
          machineType: n2-standard-2
          preemptible: true
          spotZones: us-central1-f,us-central1-c,us-central1-a
        timeout_in_minutes: 2
        soft_fail:
          - exit_status: 137
        retry:
          automatic:
            - exit_status: '*'
              limit: 0
