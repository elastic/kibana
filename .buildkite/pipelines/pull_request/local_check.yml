steps:
  - command: .buildkite/scripts/steps/checks/local_check.sh
    label: 'Local Check'
    agents:
      machineType: n4-standard-16
      diskType: hyperdisk-balanced
      preemptible: true
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,southamerica-east1-a,southamerica-east1-b,southamerica-east1-c
      diskSizeGb: 130
    key: check
    timeout_in_minutes: 35
    env:
      CHECK_GATE: 'true'
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
