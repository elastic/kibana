steps:
  - command: .buildkite/scripts/steps/check_saved_objects.sh
    label: 'Check changes in Saved Objects'
    key: check_saved_objects
    # POC-branch only, never to merge: this branch deliberately carries five
    # new alerting_rule model versions, which the checker's one-per-PR rule
    # rejects. The step still runs and reports; its failure does not fail the
    # build. A follow-up squashes the versions and reverts this line.
    soft_fail: true
    agents:
      machineType: n2-standard-2
      preemptible: true
      spotZones: us-central1-f,us-central1-c,us-central1-a
    depends_on:
      - linting
      - linting_with_types
      - linting_with_oxlint
      - check
      - checks
      - quick_checks
      - check_types
      - build
    timeout_in_minutes: 20
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
