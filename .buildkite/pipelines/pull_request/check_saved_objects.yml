steps:
  - command: .buildkite/scripts/steps/check_saved_objects.sh
    label: 'Check changes in Saved Objects'
    key: check_saved_objects
    agents:
      machineType: n2-standard-2
      preemptible: true
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    depends_on:
      - linting
      - linting_with_types
      - linting_with_oxlint
      - check
      - checks
      - quick_checks
      - check_types
      - build
    timeout_in_minutes: 20
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
