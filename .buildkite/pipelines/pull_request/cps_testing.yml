steps:
  - command: .buildkite/scripts/steps/test/scout/cps_testing.sh
    label: 'Cross Project Search (CPS) UI Tests'
    key: cps-testing
    agents:
      machineType: n2-standard-8
      preemptible: true
      diskType: pd-balanced
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    depends_on:
      - build
    timeout_in_minutes: 30
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
        - exit_status: '*'
          limit: 1
