steps:
  - command: .buildkite/scripts/steps/webpack_bundle_analyzer/build_and_upload.sh
    label: 'Build Webpack Bundle Analyzer reports'
    agents:
      machineType: n2-standard-8
      preemptible: true
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    key: webpack_bundle_analyzer
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
