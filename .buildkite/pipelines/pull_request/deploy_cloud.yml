steps:
  - command: .buildkite/scripts/steps/cloud/build_cloud_image.sh
    label: 'Build Cloud Image'
    key: build_cloud_image
    agents:
      machineType: n2-standard-16
      preemptible: true
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
  - command: .buildkite/scripts/steps/cloud/deploy.sh
    label: 'Deploy to Cloud'
    key: deploy_cloud
    agents:
      machineType: n2-standard-2
      preemptible: true
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    depends_on:
      - build_cloud_image
    timeout_in_minutes: 30
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
