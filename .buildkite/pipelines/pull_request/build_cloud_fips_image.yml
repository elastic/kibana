steps:
  - command: .buildkite/scripts/steps/fips/build_cloud_fips_image.sh
    label: 'Build Cloud FIPS Image'
    key: build_cloud_fips_image
    agents:
      machineType: n2-standard-2
      preemptible: true
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    depends_on:
      - build
    timeout_in_minutes: 60
    soft_fail: true
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
