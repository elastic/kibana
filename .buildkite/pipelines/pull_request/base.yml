env:
  KBN_ES_SNAPSHOT_USE_CACHED: 'true'

steps:
  - command: .buildkite/scripts/steps/build_kibana.sh
    label: Build Kibana Distribution
    agents:
      image: family/kibana-minimal-ubuntu-2604
      machineType: c4d-standard-16
      diskType: hyperdisk-balanced
      zones: us-central1-a,us-central1-b,us-central1-c,us-central1-f,us-east1-b,us-east1-c,us-east1-d
      diskSizeGb: 200
    key: build
    # [rspack-transition] Original condition (restore when legacy optimizer is removed):
    # if: "build.env('KIBANA_BUILD_ID') == null || build.env('KIBANA_BUILD_ID') == ''"
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3

  - command: .buildkite/scripts/steps/quick_checks.sh
    label: 'Quick Checks'
    agents:
      image: family/kibana-minimal-ubuntu-2604-aarch64
      machineType: n4a-standard-8
      diskType: hyperdisk-balanced
      preemptible: true
      spotZones: us-central1-a,us-central1-b,us-central1-c,us-east1-b,us-east1-c,us-west1-c
      diskSizeGb: 50
    key: quick_checks
    timeout_in_minutes: 60
    env:
      CHECK_GATE: 'true'
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3

  - command: .buildkite/scripts/steps/checks.sh
    label: 'Checks'
    key: checks
    env:
      CHECK_GATE: 'true'
    agents:
      image: family/kibana-minimal-ubuntu-2604-aarch64
      machineType: n4a-standard-2
      diskType: hyperdisk-balanced
      preemptible: true
      spotZones: us-central1-a,us-central1-b,us-central1-c,us-east1-b,us-east1-c,us-west1-c
      diskSizeGb: 50
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3

  - command: .buildkite/scripts/steps/lint.sh
    label: 'Linting'
    agents:
      image: family/kibana-minimal-ubuntu-2604-aarch64
      machineType: n4a-standard-16
      diskType: hyperdisk-balanced
      preemptible: true
      spotZones: us-central1-a,us-central1-b,us-central1-c,us-east1-b,us-east1-c,us-west1-c
      diskSizeGb: 50
    key: linting
    timeout_in_minutes: 60
    env:
      CHECK_GATE: 'true'
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3

  - command: .buildkite/scripts/steps/lint_with_types.sh
    label: 'Linting (with types)'
    agents:
      image: family/kibana-minimal-ubuntu-2604-aarch64
      machineType: n4a-standard-32
      diskType: hyperdisk-balanced
      preemptible: true
      spotZones: us-central1-a,us-central1-b,us-central1-c,us-east1-b,us-east1-c,us-west1-c
      diskSizeGb: 50
    key: linting_with_types
    timeout_in_minutes: 60
    env:
      CHECK_GATE: 'true'
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3

  - command: .buildkite/scripts/steps/lint_with_oxlint.sh
    label: 'Linting (with oxlint)'
    agents:
      image: family/kibana-minimal-ubuntu-2604-aarch64
      machineType: n4a-standard-4
      diskType: hyperdisk-balanced
      preemptible: true
      spotZones: us-central1-a,us-central1-b,us-central1-c,us-east1-b,us-east1-c,us-west1-c
      diskSizeGb: 50
    key: linting_with_oxlint
    timeout_in_minutes: 60
    env:
      CHECK_GATE: 'true'
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3

  - command: .buildkite/scripts/steps/typecheck/check_types.sh
    label: 'Check Types'
    agents:
      image: family/kibana-minimal-ubuntu-2604-aarch64
      machineType: n4a-highcpu-32
      diskType: hyperdisk-balanced
      preemptible: true
      spotZones: us-central1-a,us-central1-b,us-central1-c,us-east1-b,us-east1-c,us-west1-c
      diskSizeGb: 50
    key: check_types
    timeout_in_minutes: 60
    env:
      CHECK_GATE: 'true'
      RESTORE_ARCHIVE: 'true'
      UPLOAD_ARCHIVE: 'true'
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3

  - command: .buildkite/scripts/steps/test/pick_test_group_run_order.sh
    label: 'Pick Test Group Run Order'
    key: pick_test_group_run_order
    agents:
      provider: k8s
      image: docker.elastic.co/ci-agent-images/kibana/ci-minimal
      imageUID: 1000
    timeout_in_minutes: 15
    env:
      JEST_UNIT_SCRIPT: '.buildkite/scripts/steps/test/jest.sh'
      JEST_INTEGRATION_SCRIPT: '.buildkite/scripts/steps/test/jest_integration.sh'
      FTR_CONFIGS_SCRIPT: '.buildkite/scripts/steps/test/ftr_configs.sh'
      FTR_CONFIGS_DEPS: 'build'
      FTR_TEST_CHANNELS: ci-on-commit
    plugins:
      - sparse-checkout#v1.6.0:
          no_cone: true
          paths:
            - '/.buildkite/'
            - '/.node-version'
            - '/package.json'
            - '/tsconfig.base.json'
            - '/versions.json'
            - '/kibana.jsonc'
            - '**/kibana.jsonc'
            - '**/tsconfig.json'
            - '**/jest.config.js'
            - '**/jest.integration.config.js'
            - '**/*.test.js'
            - '**/*.test.mjs'
            - '**/*.test.ts'
            - '**/*.test.tsx'
          cleanup_sparse_state: true
          post_checkout:
            unshallow: true
    retry:
      automatic:
        - exit_status: '*'
          limit: 1

  - command: .buildkite/scripts/steps/test/scout/test_run_builder.sh
    label: 'Scout Test Run Builder'
    agents:
      image: family/kibana-minimal-ubuntu-2604-aarch64
      machineType: n4a-standard-8
      diskType: hyperdisk-balanced
      zones: us-central1-a,us-central1-b,us-central1-c,us-east1-b,us-east1-c,us-west1-c
      diskSizeGb: 50
    key: build_scout_tests
    timeout_in_minutes: 20
    env:
      SCOUT_TEST_DISTRIBUTION_STRATEGY: 'lanes'
      SCOUT_TEST_LANES_GROUP_DEPS: 'build_scout_tests,build'
      SCOUT_TEST_CHANNELS: ci-on-commit
      SCOUT_TEST_SERVER_START_TIMEOUT_SECONDS: 300
      SCOUT_TEST_LANE_ESTIMATED_SETUP_MINUTES: 5
      SCOUT_TEST_LANE_TARGET_RUNTIME_MINUTES: 20
      SELECTIVE_TESTING_ENABLED: 'true'
    retry:
      automatic:
        - exit_status: '*'
          limit: 1

  - command: .buildkite/scripts/steps/ci_stats_ready.sh
    label: Mark CI Stats as ready
    agents:
      machineType: n2-standard-2
    key: ci_stats_ready
    timeout_in_minutes: 10
    depends_on:
      - build
      - report_package_metrics
    retry:
      automatic:
        - exit_status: '*'
          limit: 1

  - command: .buildkite/scripts/steps/report_package_metrics.sh
    label: 'Report Package Metrics'
    agents:
      machineType: n2-standard-2
    key: report_package_metrics
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
