steps:
  - group: AppEx AI-Infra genAI tests
    key: ai-infra-gen-ai
    depends_on:
      - build
    steps:
      - command: |
          .buildkite/scripts/steps/test/ftr_configs.sh
          .buildkite/scripts/steps/test/annotate_llm_smoke_judgements.sh
        env:
          FTR_CONFIG: 'x-pack/platform/test/functional_gen_ai/inference/config.ts'
          FTR_CONFIG_GROUP_KEY: 'ftr-ai-infra-gen-ai-inference-api'
          FTR_GEN_AI: '1'
          FTR_EIS_CCM: '1'
        label: AppEx AI-Infra Inference APIs FTR tests
        key: ai-infra-gen-ai-inference-api
        timeout_in_minutes: 50
        parallelism: 1
        agents:
          machineType: n2-standard-4
          preemptible: true
          diskType: pd-balanced
          spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
        artifact_paths:
          - 'target/llm_smoke_judgements.jsonl'
        retry:
          automatic:
            - exit_status: '-1'
              limit: 3
            - exit_status: '*'
              limit: 1
