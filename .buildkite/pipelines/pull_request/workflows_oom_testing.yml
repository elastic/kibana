steps:
  - command: .buildkite/scripts/steps/test/scout/workflows_oom_testing.sh
    label: 'Workflow Schema OOM Prevention'
    key: workflows-oom-testing
    agents:
      machineType: n2-standard-4
      preemptible: true
      diskType: pd-balanced
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    depends_on:
      - build
    timeout_in_minutes: 30
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
        - exit_status: '*'
          limit: 1
