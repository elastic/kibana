steps:
  - command: .buildkite/scripts/steps/checks/prompt_changes_detector.sh
    label: 'Check Prompt Changes'
    key: prompt_changes
    agents:
      machineType: n2-standard-2
      preemptible: true
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
      diskSizeGb: 130
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
