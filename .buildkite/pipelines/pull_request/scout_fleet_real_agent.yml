steps:
  - command: .buildkite/scripts/steps/test/scout_fleet_real_agent.sh
    label: 'Scout Fleet Real Agent'
    key: scout-fleet-real-agent
    agents:
      machineType: n2-highmem-4
      preemptible: true
      diskType: pd-balanced
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    depends_on:
      - build
    # One stack with a Docker Fleet Server and Docker Elastic Agents.
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
        - exit_status: '*'
          limit: 1
