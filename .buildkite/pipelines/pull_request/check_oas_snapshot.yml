steps:
  - command: .buildkite/scripts/steps/checks/capture_oas_snapshot.sh
    label: 'Check OAS Snapshot'
    agents:
      machineType: n2-standard-2
      preemptible: true
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    key: check_oas_snapshot
    timeout_in_minutes: 60
    env:
      CHECK_GATE: 'true'
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
