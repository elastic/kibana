steps:
  - command: .buildkite/scripts/steps/functional/security_solution_explore.sh
    label: 'Explore - Security Solution Cypress Tests'
    key: security-explore
    agents:
      machineType: n2-standard-4
      diskSizeGb: 130
      preemptible: true
      diskType: pd-balanced
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    depends_on:
      - build
    timeout_in_minutes: 60
    parallelism: 2
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
        - exit_status: '*'
          limit: 1

  - command: .buildkite/scripts/steps/functional/security_serverless_explore.sh
    label: 'Serverless Explore - Security Solution Cypress Tests'
    key: security-serverless-explore
    if: "build.env('GITHUB_PR_TARGET_BRANCH') == 'main'"
    agents:
      machineType: n2-standard-4
      diskSizeGb: 130
      preemptible: true
      diskType: pd-balanced
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    depends_on:
      - build
    timeout_in_minutes: 60
    parallelism: 4
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
        - exit_status: '*'
          limit: 1
