steps:
  - command: .buildkite/scripts/steps/functional/cloud_security_posture.sh
    label: 'Cloud Security Posture Cypress Tests'
    key: cloud-security-posture
    agents:
      machineType: n2-standard-4
      diskSizeGb: 130
      preemptible: true
      diskType: pd-balanced
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    depends_on:
      - build
    timeout_in_minutes: 60
    parallelism: 1
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
        - exit_status: '*'
          limit: 1

  - command: .buildkite/scripts/steps/functional/cloud_security_posture_serverless.sh
    label: 'Cloud Security Posture Cypress Tests on Serverless'
    key: cloud-security-posture-serverless
    if: "build.env('GITHUB_PR_TARGET_BRANCH') == 'main'"
    agents:
      machineType: n2-standard-4
      diskSizeGb: 130
      preemptible: true
      diskType: pd-balanced
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    depends_on:
      - build
    timeout_in_minutes: 60
    parallelism: 1
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
        - exit_status: '*'
          limit: 1
