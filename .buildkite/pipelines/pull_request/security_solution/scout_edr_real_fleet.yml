steps:
  - command: .buildkite/scripts/steps/test/scout_edr_real_fleet.sh
    label: 'Scout EDR Real Fleet'
    key: scout-edr-real-fleet
    agents:
      enableNestedVirtualization: true
      machineType: n2-highmem-4
      preemptible: true
      spotZones: us-central1-f,us-central1-c,us-central1-a
    depends_on:
      - build
    # Stateful and serverless each boot UI and API (four stacks).
    timeout_in_minutes: 240
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
        - exit_status: '*'
          limit: 1
