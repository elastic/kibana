steps:
  - command: .buildkite/scripts/steps/report_flaky_tests.sh
    label: ':mag: Discover flaky tests'
    key: discover-flaky-tests
    timeout_in_minutes: 30
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-4
      preemptible: true
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3

  - command: .buildkite/scripts/steps/report_flaky_test_issues.sh
    label: ':github: Report flaky suites to GitHub issues'
    key: report-flaky-test-issues
    depends_on: discover-flaky-tests
    timeout_in_minutes: 30
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-4
      preemptible: true
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
