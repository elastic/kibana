steps:
  - command: .buildkite/scripts/steps/connector_vendor_api_drift.sh
    label: ':mag: Connector vendor API drift'
    key: connector-vendor-api-drift
    timeout_in_minutes: 60
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-4
      preemptible: true
      diskType: pd-balanced
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3

  # Runs the connectors' Scout suites through Kibana against the connector emulator, with the
  # committed vendor specs, to catch a change in Kibana that breaks a connector. Vendor drift is
  # found by the step above. A soft failure until it has run a few times.
  - command: .buildkite/scripts/steps/test/connector_emulator_scout.sh
    label: ':test_tube: Connector emulator Scout'
    key: connector-emulator-scout
    timeout_in_minutes: 60
    soft_fail: true
    env:
      CONNECTOR_EMULATOR_SCOUT_FROM_SOURCE: 'true'
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-8
      preemptible: true
      diskType: pd-balanced
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
