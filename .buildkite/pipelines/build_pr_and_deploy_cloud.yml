env:
  KIBANA_PR_COMMENTS_ENABLED: 'true'
  KIBANA_GITHUB_BUILD_COMMIT_STATUS_ENABLED: 'true'
  GITHUB_BUILD_COMMIT_STATUS_CONTEXT: kibana-deploy-cloud-from-pr

steps:
  - group: 'Notify if missing labels'
    if: "build.env('GITHUB_PR_LABELS') !~ /(ci:cloud-deploy|ci:cloud-redeploy)/"

    steps:
      - command: |
          node .buildkite/scripts/lifecycle/comment_on_pr.ts \
            --message "Cloud deployments require a Github label, please add \`ci:cloud-deploy\` or \`ci:cloud-redeploy\` and trigger the job through the checkbox again." \
            --context "cloud-deploy-job" \
            --clear-previous
        label: Comment missing labels
        agents:
          provider: gcp
          image: family/kibana-ubuntu-2404
          imageProject: elastic-images-prod
          machineType: n2-standard-2
        timeout_in_minutes: 5

  - group: 'Cloud Deployment'
    if: "build.env('GITHUB_PR_LABELS') =~ /(ci:cloud-deploy|ci:cloud-redeploy)/"

    steps:
      - command: .buildkite/scripts/lifecycle/pre_build.sh
        label: Pre-Build
        timeout_in_minutes: 10
        agents:
          provider: gcp
          image: family/kibana-ubuntu-2404
          imageProject: elastic-images-prod
          machineType: n2-standard-2
        retry:
          automatic:
            - exit_status: '*'
              limit: 1

      - command: |
          node .buildkite/scripts/lifecycle/comment_on_pr.ts \
            --message "PR Cloud deployment started at: $BUILDKITE_BUILD_URL" \
            --context "cloud-deploy-job" \
            --clear-previous
        label: Comment with job URL
        agents:
          provider: gcp
          image: family/kibana-ubuntu-2404
          imageProject: elastic-images-prod
          machineType: n2-standard-2
        timeout_in_minutes: 5

      - wait: ~

      - command: .buildkite/scripts/steps/cloud/build_cloud_image.sh
        label: 'Build Cloud Image'
        agents:
          provider: gcp
          image: family/kibana-ubuntu-2404
          imageProject: elastic-images-prod
          machineType: n2-standard-16
          preemptible: true
        timeout_in_minutes: 60
        key: build_cloud_image
        retry:
          automatic:
            - exit_status: '-1'
              limit: 3

      - command: .buildkite/scripts/steps/cloud/deploy.sh
        label: 'Deploy to Cloud'
        agents:
          provider: gcp
          image: family/kibana-ubuntu-2404
          imageProject: elastic-images-prod
          machineType: n2-standard-2
          preemptible: true
        timeout_in_minutes: 30
        depends_on: build_cloud_image
        retry:
          automatic:
            - exit_status: '-1'
              limit: 3

      - wait: ~

      - command: |
          node .buildkite/scripts/lifecycle/comment_on_pr.ts \
            --message "Cloud deployment initiated, see credentials at: $BUILDKITE_BUILD_URL" \
            --context "cloud-deploy-job" \
            --clear-previous
        label: Comment with job URL
        agents:
          provider: gcp
          image: family/kibana-ubuntu-2404
          imageProject: elastic-images-prod
          machineType: n2-standard-2
        timeout_in_minutes: 5
