steps:
  - command: .buildkite/scripts/steps/scout_report_flaky_tests.sh
    label: ':mag: Discover flaky tests'
    key: discover-flaky-tests
    timeout_in_minutes: 30
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-4
      preemptible: true
      spotZones: us-central1-f,us-central1-c,us-central1-a
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3

  - command: .buildkite/scripts/steps/scout_report_flaky_tests_github.sh
    label: ':github: Report flaky suites to GitHub'
    key: report-flaky-tests-github
    depends_on: discover-flaky-tests
    timeout_in_minutes: 30
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-4
      preemptible: true
      spotZones: us-central1-f,us-central1-c,us-central1-a
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
