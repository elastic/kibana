steps:
  - command: .buildkite/scripts/steps/otel_semconv_sync.sh
    label: OpenTelemetry Semantic Conventions Sync
    timeout_in_minutes: 15
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-2
      preemptible: true
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
    env:
      # Docker is available on these agents
      DOCKER_REQUIRED: 'true'