steps:
  - label: 'Pre-Build'
    command: .buildkite/scripts/lifecycle/pre_build.sh
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-2
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: '*'
          limit: 1

  - wait

  - label: 'Build Kibana Distribution'
    command: .buildkite/scripts/steps/build_kibana.sh
    key: build
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-8
    timeout_in_minutes: 20
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3

  - group: 'Dispatch tests'
    key: dispatch-tests
    steps:
      - command: .buildkite/scripts/steps/test/pick_test_group_run_order.sh
        label: 'FTR (on-prem)'
        key: dispatch-ftr-tests
        agents:
          provider: k8s
          image: docker.elastic.co/ci-agent-images/kibana/ci-minimal
          imageUID: 1000
        timeout_in_minutes: 15
        env:
          FTR_CONFIGS_SCRIPT: '.buildkite/scripts/steps/test/ftr_configs.sh'
          FTR_CONFIGS_DEPS: 'build'
          FTR_TEST_CHANNELS: "${TEST_CHANNELS}"
          LIMIT_CONFIG_TYPE: functional
          ALLOW_ZERO_JEST_OR_FTR_CONFIGS: true
        plugins:
          - sparse-checkout#v1.6.0:
              no_cone: true
              paths:
                - '/.buildkite/'
                - '/.node-version'
                - '/package.json'
                - '/tsconfig.base.json'
                - '/versions.json'
                - '/kibana.jsonc'
                - '**/kibana.jsonc'
                - '**/tsconfig.json'
                - '**/*.test.js'
                - '**/*.test.mjs'
                - '**/*.test.ts'
                - '**/*.test.tsx'
              cleanup_sparse_state: true
        retry:
          automatic:
            - exit_status: '*'
              limit: 1

      - command: .buildkite/scripts/steps/test/scout/test_run_builder.sh
        label: 'Scout (on-prem)'
        key: dispatch-scout-tests
        agents:
          image: family/kibana-ubuntu-2404
          imageProject: elastic-images-prod
          provider: gcp
          machineType: n2d-standard-8
        timeout_in_minutes: 20
        env:
          SCOUT_TEST_DISTRIBUTION_STRATEGY: 'lanes'
          SCOUT_TEST_LANES_GROUP_DEPS: 'dispatch-scout-tests,build'
          SCOUT_TEST_CHANNELS: "${TEST_CHANNELS}"
          SCOUT_TEST_SERVER_START_TIMEOUT_SECONDS: 300
          SCOUT_TEST_LANE_ESTIMATED_SETUP_MINUTES: 5
          SCOUT_TEST_LANE_TARGET_RUNTIME_MINUTES: 20
        retry:
          automatic:
            - exit_status: '*'
              limit: 1

  - wait: ~
    continue_on_failure: true

  - label: 'Post-Build'
    command: .buildkite/scripts/lifecycle/post_build.sh
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-2
    timeout_in_minutes: 10
