steps:
  - command: .buildkite/pipelines/fips/verify_fips_enabled.sh
    label: 'Verify FIPS Enabled'
    key: verify_fips_enabled
    depends_on: build
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3
    agents:
      machineType: n2-standard-2
      preemptible: true
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c
