notify:
  - slack:
      channels:
        - '#kibana-operations-alerts'
      message: ':red_circle: Kibana version bump to ${NEW_VERSION} (${WORKFLOW}, branch ${BRANCH}) failed — ${BUILDKITE_BUILD_URL}'
    if: (build.branch == 'main' || build.branch =~ /^[0-9]+\.[0-9x]+\$/) && build.state == 'failed'
  - slack:
      channels:
        - '#mission-control'
      message: |
        Kibana has been bumped to `${NEW_VERSION}` on branch `${BRANCH}`.
        Build: ${BUILDKITE_BUILD_URL}
    if: build.state == "passed"

steps:
  - command: .buildkite/scripts/steps/version_bump/bump.sh
    key: bump-version
    label: Bump version
    agents:
      image: family/kibana-minimal-ubuntu-2604
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-4

  - wait

  - label: 'Fetch DRA Artifacts'
    key: fetch-dra-artifacts
    depends_on: bump-version
    agents:
      image: docker.elastic.co/release-eng/wolfi-build-essential-release-eng:latest
      cpu: 2
      memory: 4G
      ephemeralStorage: 10G
    timeout_in_minutes: 240
    # The plugin only polls DRA manifests; a Kibana clone outgrows ephemeralStorage on a cold mirror.
    env:
      BUILDKITE_SKIP_CHECKOUT: 'true'
    # -1 covers lost agents and timeouts; other plugin failures (bad product/version, every manifest 404) are deterministic.
    retry:
      automatic:
        - exit_status: '-1'
          limit: 2
      manual:
        permit_on_passed: true

    plugins:
      - elastic/version-bump-dra#v1.0.0:
          product: 'kibana'
          version: '${NEW_VERSION}'
          workflow: '${WORKFLOW}'
          polling_interval: 30
          dry_run: '${DRY_RUN:-false}'

  - wait

  - key: verify-es-snapshot
    label: 'Verify ES Snapshot'
    if: build.env("DRY_RUN") != "true"
    agents:
      image: family/kibana-minimal-ubuntu-2604
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-4
    command: |
      ES_SNAPSHOT_MANIFEST="$(buildkite-agent meta-data get es_snapshot_manifest)"

      buildkite-agent pipeline upload << PIPELINE
      steps:
        - label: 'Verify ES Snapshot'
          trigger: kibana-elasticsearch-snapshot-verify
          async: true
          soft_fail: true
          build:
            branch: '$BRANCH'
            env:
              ES_SNAPSHOT_MANIFEST: '$${ES_SNAPSHOT_MANIFEST}'
      PIPELINE
