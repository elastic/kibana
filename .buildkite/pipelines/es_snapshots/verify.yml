env:
  IGNORE_SHIP_CI_STATS_ERROR: 'true'
  KBN_ES_SNAPSHOT_USE_CACHED: 'false'
steps:
  - block: 'Verify'
    prompt: "Enter the details for the snapshot you'd like to verify"
    if: "build.env('ES_SNAPSHOT_MANIFEST') == null"
    # Later, this could be a dropdown dynamically filled with recent builds
    fields:
      - text: 'ES_SNAPSHOT_MANIFEST'
        key: 'ES_SNAPSHOT_MANIFEST'
        hint: 'URL pointing to the manifest to promote'
        required: true

  - command: .buildkite/scripts/lifecycle/pre_build.sh
    label: Pre-Build
    timeout_in_minutes: 10
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-2

  - wait

  - command: .buildkite/scripts/steps/build_kibana.sh
    label: Build Kibana Distribution
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-8
      preemptible: true
    key: build
    if: "build.env('KIBANA_BUILD_ID') == null || build.env('KIBANA_BUILD_ID') == ''"
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3

  - command: .buildkite/scripts/steps/test/pick_test_group_run_order.sh
    label: 'Pick Test Group Run Order'
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-2
    timeout_in_minutes: 15
    env:
      JEST_UNIT_SCRIPT: '.buildkite/scripts/steps/test/jest.sh'
      JEST_INTEGRATION_SCRIPT: '.buildkite/scripts/steps/test/jest_integration.sh'
      FTR_CONFIGS_SCRIPT: '.buildkite/scripts/steps/test/ftr_configs.sh'
      FTR_TEST_CHANNELS: ci-on-commit
      LIMIT_CONFIG_TYPE: integration,functional
    retry:
      automatic:
        - exit_status: '*'
          limit: 1

  - command: .buildkite/scripts/steps/test/scout/test_run_builder.sh
    label: 'Scout Test Run Builder'
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-4
    key: build_scout_tests
    timeout_in_minutes: 15
    env:
      SCOUT_TEST_DISTRIBUTION_STRATEGY: 'lanes'
      SCOUT_TEST_LANES_GROUP_DEPS: 'build_scout_tests,build'
      SCOUT_TEST_CHANNELS: ci-on-commit
    retry:
      automatic:
        - exit_status: '*'
          limit: 1

  # Exercises real LLM interactions against the new ES snapshot to catch ES-side
  # inference changes that break them. Soft-fails for now: results are visible on the
  # build but do not block snapshot promotion.
  - group: Agent Builder LLM Smoke Tests
    key: agent-builder-smoke-tests
    depends_on:
      - build
    steps:
      - command: |
          mkdir -p target
          .buildkite/scripts/steps/test/discover_eis_models.sh || echo '{"models":[]}' > target/eis_models.json
          .buildkite/scripts/steps/test/scout/configs.sh
          .buildkite/scripts/steps/test/annotate_llm_smoke_judgements.sh
        env:
          FTR_GEN_AI: '1'
          FTR_EIS_CCM: '1'
          KBN_BOOTSTRAP_NO_PREBUILT: 'true'
          SCOUT_CONFIG: 'x-pack/platform/plugins/shared/agent_builder/test/scout_agent_builder_smoke/api/playwright.config.ts'
          SCOUT_CONFIG_GROUP_TYPE: 'scout-agent-builder-smoke-tests'
          SCOUT_SERVER_RUN_FLAGS: '--arch stateful --domain classic'
        label: Agent Builder Scout Smoke Tests
        key: scout-agent-builder-smoke-tests
        soft_fail: true
        timeout_in_minutes: 50
        parallelism: 1
        agents:
          image: family/kibana-ubuntu-2404
          imageProject: elastic-images-prod
          provider: gcp
          machineType: n2-standard-4
          preemptible: true
        artifact_paths:
          - 'target/eis_models.json'
          - 'target/llm_smoke_judgements.jsonl'
        retry:
          automatic:
            - exit_status: '-1'
              limit: 3

  - command: .buildkite/scripts/steps/es_snapshots/trigger_promote.sh
    label: Trigger promotion
    timeout_in_minutes: 10
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-2
    depends_on:
      - ftr-configs
      - jest-integration

  - wait: ~
    continue_on_failure: true

  - command: .buildkite/scripts/lifecycle/post_build.sh
    label: Post-Build
    timeout_in_minutes: 10
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-2
