env:
  KBN_EVALS: '1'
  KBN_EVALS_WEEKLY: '1'
  NIGHTSHIFT_EVAL_TASK: 'all'
  EVAL_MODEL_GROUPS: 'eis/anthropic-claude-4.6-sonnet,eis/openai-gpt-5.4'
steps:
