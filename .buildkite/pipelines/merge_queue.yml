env:
  GITHUB_COMMIT_STATUS_ENABLED: 'true'
  GITHUB_COMMIT_STATUS_CONTEXT: 'kibana-ci'
steps:
  # Registers every long-running step for cancel-on-gate-failure, so a failing
  # CHECK_GATE step ends the build (and releases the merge queue) right away.
  # Gate steps only start after pre_build, so registration always comes first.
  - command:
      - .buildkite/scripts/lifecycle/pre_build.sh
      - |
        buildkite-agent meta-data set cancel_on_gate_failure_batch:merge_queue \
          '["pick_test_group_run_order","build","check_oas_snapshot","quick_checks","checks","linting","linting_with_types","check_types"]'
    label: Pre-Build
    key: pre_build
    timeout_in_minutes: 10
    agents:
      image: family/kibana-minimal-ubuntu-2604
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-2
    retry:
      automatic:
        - exit_status: '*'
          limit: 1

  # E2E suites (FTR, Scout, Cypress) intentionally do not run in the merge queue.
  # Only Jest unit tests gate the queue.
  - command: .buildkite/scripts/steps/test/pick_test_group_run_order.sh
    label: 'Pick Test Group Run Order and Store Cache'
    key: pick_test_group_run_order
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2d-highcpu-8
      zones: us-central1-a,us-central1-b,us-central1-c,us-central1-f,us-east1-b,us-east1-c,us-east1-d,us-west1-a,us-west1-b,us-west1-c
    timeout_in_minutes: 15
    env:
      JEST_UNIT_SCRIPT: '.buildkite/scripts/steps/test/jest.sh'
      JEST_UNIT_MAX_MINUTES: '15.0'
      LIMIT_CONFIG_TYPE: 'unit'
      JEST_CONFIGS_DEPS: 'pick_test_group_run_order'
    retry:
      automatic:
        - exit_status: '*'
          limit: 1

  - wait: ~
    depends_on: pre_build

  - command: .buildkite/scripts/steps/spoof_status_checks.sh
    label: 'Spoof Status Checks'
    env:
      STATUS_CHECKS: |
        prbot:backport labels
        prbot:outdated
        prbot:release note labels
        prbot:update required
        security/snyk (Application Experience)
        buildkite/docs-build-pr
    agents:
      image: family/kibana-minimal-ubuntu-2604
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-2
      preemptible: true
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: '*'
          limit: 1

  - command: .buildkite/scripts/steps/on_merge_build_and_metrics.sh
    label: Build Kibana Distribution
    agents:
      image: family/kibana-minimal-ubuntu-2604
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2d-custom-16-32768
      diskSizeGb: 50
      buildDirectory: /dev/shm/bk
      zones: us-central1-a,us-central1-b,us-central1-c,us-central1-f,us-east1-b,us-east1-c,us-east1-d,us-west1-a,us-west1-b,us-west1-c
    key: build
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: '*'
          limit: 1

  - command: .buildkite/scripts/steps/checks/capture_oas_snapshot.sh
    label: 'Check OAS Snapshot'
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2d-highmem-4
      preemptible: true
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,europe-west2-a,europe-west2-b,europe-west2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c,southamerica-east1-a,southamerica-east1-b,southamerica-east1-c
      diskSizeGb: 130
    key: check_oas_snapshot
    env:
      CHECK_GATE: 'true'
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3

  - command: .buildkite/scripts/steps/quick_checks.sh
    label: 'Quick Checks'
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2d-standard-8
      zones: us-central1-a,us-central1-b,us-central1-c,us-central1-f,us-east1-b,us-east1-c,us-east1-d,us-west1-a,us-west1-b,us-west1-c
    key: quick_checks
    env:
      CHECK_GATE: 'true'
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3

  - command: .buildkite/scripts/steps/checks.sh
    label: 'Checks'
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2d-standard-2
      preemptible: true
      spotZones: asia-south2-a,asia-south2-b,asia-south2-c,europe-west2-a,europe-west2-b,europe-west2-c,northamerica-northeast2-a,northamerica-northeast2-b,northamerica-northeast2-c,southamerica-east1-a,southamerica-east1-b,southamerica-east1-c
    key: checks
    env:
      CHECK_GATE: 'true'
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3

  - command: .buildkite/scripts/steps/lint.sh
    label: 'Linting'
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n4-standard-16
      diskType: hyperdisk-balanced
      preemptible: true
    key: linting
    env:
      CHECK_GATE: 'true'
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3

  - command: .buildkite/scripts/steps/lint_with_types.sh
    label: 'Linting (with types)'
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n4-standard-32
      diskType: hyperdisk-balanced
      preemptible: true
    key: linting_with_types
    env:
      CHECK_GATE: 'true'
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3

  - command: .buildkite/scripts/steps/typecheck/check_types.sh
    label: 'Check Types'
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n4-highcpu-32
      diskType: hyperdisk-balanced
      preemptible: true
    key: check_types
    timeout_in_minutes: 60
    env:
      CHECK_GATE: 'true'
      RESTORE_ARCHIVE: 'true'
      UPLOAD_ARCHIVE: 'true'
    retry:
      automatic:
        - exit_status: '-1'
          limit: 3

  - command: .buildkite/scripts/steps/ci_stats_ready.sh
    label: Mark CI Stats as ready
    agents:
      image: family/kibana-minimal-ubuntu-2604
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-2
    timeout_in_minutes: 10
    depends_on:
      - build
    retry:
      automatic:
        - exit_status: '*'
          limit: 1

  - wait: ~
    continue_on_failure: true

  - command: .buildkite/scripts/lifecycle/post_build.sh
    label: Post-Build
    timeout_in_minutes: 10
    agents:
      provider: k8s
      image: docker.elastic.co/ci-agent-images/kibana/ci-minimal
      imageUID: 1000
    plugins:
      - sparse-checkout#v1.6.0:
          paths:
            - .buildkite
            - .nvmrc
            - package.json
            - tsconfig.base.json
            - versions.json
          cleanup_sparse_state: true
