env:
  FTR_GEN_AI: '1'
  FTR_EIS_CCM: '1'
steps:
  - label: '👨‍🔧 Pre-Build'
    command: .buildkite/scripts/lifecycle/pre_build.sh
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-2

  - wait

  # Always run this step: resolve_reusable_kibana_build.sh picks a recent
  # kibana-on-merge distributable (≤36h) when KIBANA_BUILD_ID is unset, then
  # build_kibana.sh short-circuits. Falls back to a full build if none found.
  # Shared with gen_ai_product_docs.yml. Force a rebuild with KIBANA_REUSE_BUILD=false
  # or pin a build by setting KIBANA_BUILD_ID on the Buildkite build.
  - label: '🧑‍🏭 Build Kibana Distribution'
    command: |
      set -euo pipefail
      source .buildkite/scripts/steps/gen_ai/resolve_reusable_kibana_build.sh
      .buildkite/scripts/steps/build_kibana.sh
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-8
    key: build

  - wait

  - label: AppEx AI-Infra Security Labs artifacts FTR build
    key: ai-infra-gen-ai-security-labs
    command: bash .buildkite/scripts/steps/gen_ai/run_security_labs_artifacts_ftr.sh
    env:
      FTR_CONFIG: 'x-pack/platform/test/functional_gen_ai/inference/generate_security_labs_artifacts.config.ts'
      FTR_CONFIG_GROUP_KEY: 'ftr-ai-infra-gen-ai-security-labs'
      FTR_GEN_AI: '1'
      FTR_EIS_CCM: '1'
    timeout_in_minutes: 120
    parallelism: 1
    agents:
      image: family/kibana-ubuntu-2404
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-4
      preemptible: true
    retry:
      automatic:
        - exit_status: '-1'
          limit: 1
        - exit_status: '*'
          limit: 1
