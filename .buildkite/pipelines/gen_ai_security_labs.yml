# Uploads gen_ai_security_labs_build.yml only when the build needs to run; webhook builds for
# unchanged Security Labs content stop here (see security_labs_content_gate.sh).
steps:
  - label: '🔎 Check for Security Labs content changes'
    command: .buildkite/scripts/steps/gen_ai/security_labs_content_gate.sh
    timeout_in_minutes: 10
    agents:
      image: family/kibana-minimal-ubuntu-2604
      imageProject: elastic-images-prod
      provider: gcp
      machineType: n2-standard-2
    retry:
      automatic:
        - exit_status: -1
          limit: 1
