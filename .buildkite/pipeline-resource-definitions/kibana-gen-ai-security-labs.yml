apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: bk-kibana-gen-ai-security-labs
  description: Builds and publishes the Security Labs KB artifact (ELSER + Jina). Triggered externally on article publish (trigger_mode none); pass SECURITY_LABS_REPO_REF (commit SHA) and SECURITY_LABS_VERSION (YYYY.MM.DD-HHMMSS UTC). Reuses a recent kibana-on-merge kibana-default.tar.zst when possible (set KIBANA_REUSE_BUILD=false to force a fresh Kibana build).
  links:
    - url: 'https://buildkite.com/elastic/kibana-gen-ai-security-labs'
      title: Pipeline link
spec:
  type: buildkite-pipeline
  owner: 'group:search-ml-ux'
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: kibana / gen-ai-security-labs
      description: Builds and publishes the Security Labs KB artifact (ELSER + Jina). Triggered externally on article publish (trigger_mode none); pass SECURITY_LABS_REPO_REF (commit SHA) and SECURITY_LABS_VERSION (YYYY.MM.DD-HHMMSS UTC). Reuses a recent kibana-on-merge kibana-default.tar.zst when possible (set KIBANA_REUSE_BUILD=false to force a fresh Kibana build).
    spec:
      env:
        SLACK_NOTIFICATIONS_CHANNEL: '#search-ml-ux-alerts'
        KIBANA_SLACK_NOTIFICATIONS_ENABLED: 'true'
      allow_rebuilds: true
      branch_configuration: main
      cancel_intermediate_builds: true
      default_branch: main
      repository: elastic/kibana
      pipeline_file: .buildkite/pipelines/gen_ai_security_labs.yml
      provider_settings:
        build_branches: false
        build_pull_requests: false
        publish_commit_status: false
        trigger_mode: none
        prefix_pull_request_fork_branch_names: false
        skip_pull_request_builds_for_existing_commits: false
      teams:
        everyone:
          access_level: BUILD_AND_READ
        search-ml-ux:
          access_level: MANAGE_BUILD_AND_READ
        kibana-operations:
          access_level: MANAGE_BUILD_AND_READ
        appex-qa:
          access_level: MANAGE_BUILD_AND_READ
        kibana-tech-leads:
          access_level: MANAGE_BUILD_AND_READ
      tags:
        - kibana
