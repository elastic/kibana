# yaml-language-server: $schema=https://gist.githubusercontent.com/elasticmachine/988b80dae436cafea07d9a4a460a011d/raw/rre.schema.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: bk-kibana-evals-daily-llm-evals
  description: 'Runs the Nightshift investigations evals every weekday'
  links:
    - url: 'https://buildkite.com/elastic/kibana-evals-daily-llm-evals'
      title: Pipeline link
spec:
  type: buildkite-pipeline
  owner: 'group:nightshift-context-and-research-team'
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: 'Kibana / Evals / Daily LLM Evals'
      description: 'Runs the latest golden, ORCA and connector datasets of the Nightshift investigations suite every weekday'
    spec:
      env:
        SLACK_NOTIFICATIONS_CHANNEL: '#kbn-evals-notifications'
        ELASTIC_SLACK_NOTIFICATIONS_ENABLED: 'true'
        KBN_EVALS: '1'
      allow_rebuilds: true
      branch_configuration: main
      cancel_intermediate_builds: false
      default_branch: main
      repository: elastic/kibana
      pipeline_file: .buildkite/pipelines/evals/daily_evals.yml
      initial_step_plugins:
        - sparse-checkout#v1.6.0:
            paths:
              - .buildkite/pipelines/evals/daily_evals.yml
            cleanup_sparse_state: true
      provider_settings:
        build_branches: false
        build_pull_requests: false
        publish_commit_status: false
        trigger_mode: none
        prefix_pull_request_fork_branch_names: false
        skip_pull_request_builds_for_existing_commits: false
        build_tags: false
      teams:
        kibana-operations:
          access_level: MANAGE_BUILD_AND_READ
        nightshift-context-and-research-team:
          access_level: MANAGE_BUILD_AND_READ
        everyone:
          access_level: READ_ONLY
      schedules:
        Daily build:
          cronline: 0 2 * * 1-5 GMT
          message: Daily LLM Evals (Nightshift investigations)
          branch: main
      tags:
        - kibana
        - kbn-evals
