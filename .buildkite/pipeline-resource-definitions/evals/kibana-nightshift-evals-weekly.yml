# yaml-language-server: $schema=https://gist.githubusercontent.com/elasticmachine/988b80dae436cafea07d9a4a460a011d/raw/rre.schema.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: bk-kibana-nightshift-evals-weekly
  description: 'Runs the weekly nightshift-evals tasks across EIS models'
  links:
    - url: 'https://buildkite.com/elastic/kibana-nightshift-evals-weekly'
      title: Pipeline link
spec:
  type: buildkite-pipeline
  owner: 'group:nightshift-context-and-research-team'
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: 'Kibana / Nightshift Evals / Weekly'
      description: 'Runs all nightshift-evals tasks against weekly EIS models on a weekly schedule'
    spec:
      env:
        SLACK_NOTIFICATIONS_CHANNEL: '#kbn-evals-notifications'
        ELASTIC_SLACK_NOTIFICATIONS_ENABLED: 'true'
        KBN_EVALS: '1'
      allow_rebuilds: true
      branch_configuration: main
      cancel_intermediate_builds: false
      default_branch: main
      repository: elastic/kibana
      pipeline_file: .buildkite/pipelines/nightshift_evals/weekly.yml
      initial_step_plugins:
        - sparse-checkout#v1.6.0:
            paths:
              - .buildkite/pipelines/nightshift_evals/weekly.yml
            cleanup_sparse_state: true
      provider_settings:
        build_branches: false
        build_pull_requests: false
        publish_commit_status: false
        trigger_mode: none
        prefix_pull_request_fork_branch_names: false
        skip_pull_request_builds_for_existing_commits: false
        build_tags: false
      teams:
        kibana-operations:
          access_level: MANAGE_BUILD_AND_READ
        nightshift-context-and-research-team:
          access_level: MANAGE_BUILD_AND_READ
        everyone:
          access_level: READ_ONLY
      schedules:
        Weekly build:
          cronline: 0 20 * * 0 GMT
          message: Weekly Nightshift Evals (all tasks)
          branch: main
      tags:
        - kibana
        - kbn-evals
