# yaml-language-server: $schema=https://gist.githubusercontent.com/elasticmachine/988b80dae436cafea07d9a4a460a011d/raw/rre.schema.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: bk-kibana-serverless-release-readiness
  description: Notifies teams of issues ahead of a serverless (MKI) release
  links:
    - url: 'https://buildkite.com/elastic/kibana-serverless-release-readiness'
      title: Pipeline link
spec:
  type: buildkite-pipeline
  owner: 'group:kibana-operations'
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: kibana / serverless / release readiness
      description: Evaluates release readiness signals and notifies #kibana-mission-control ahead of serverless releases
    spec:
      env:
        SLACK_NOTIFICATIONS_CHANNEL: '#kibana-mission-control'
        KIBANA_SLACK_NOTIFICATIONS_ENABLED: 'true'
      allow_rebuilds: true
      branch_configuration: main
      default_branch: main
      repository: elastic/kibana
      pipeline_file: .buildkite/pipelines/release_readiness.yml
      initial_step_plugins:
        - sparse-checkout#v1.6.0:
            paths:
              - .buildkite/pipelines/release_readiness.yml
            cleanup_sparse_state: true
      provider_settings:
        trigger_mode: none
        build_branches: true
        prefix_pull_request_fork_branch_names: true
        publish_commit_status: false
        skip_pull_request_builds_for_existing_commits: true
      teams:
        everyone:
          access_level: BUILD_AND_READ
        kibana-operations:
          access_level: MANAGE_BUILD_AND_READ
        appex-qa:
          access_level: MANAGE_BUILD_AND_READ
        kibana-tech-leads:
          access_level: MANAGE_BUILD_AND_READ
      schedules:
        Tuesday and Friday 8 am UTC:
          cronline: 0 8 * * 2,5
          message: Tuesday and Friday 8 am UTC
          branch: main
      tags:
        - kibana
        - ':kibana: Kibana release path'
