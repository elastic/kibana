# yaml-language-server: $schema=https://gist.githubusercontent.com/elasticmachine/988b80dae436cafea07d9a4a460a011d/raw/rre.schema.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: bk-kibana-report-flaky-tests
  description: Aggregates test events from the AppEx QA cluster into a flaky test report, publishes it as a build artifact and files a GitHub failed-test issue per flaky suite that has none yet
  links:
    - url: 'https://buildkite.com/elastic/kibana-report-flaky-tests'
      title: Pipeline link
spec:
  type: buildkite-pipeline
  owner: 'group:apps-dx'
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: kibana / report-flaky-tests
      description: Aggregates test events from the AppEx QA cluster into a flaky test report, publishes it as a build artifact and files a GitHub failed-test issue per flaky suite that has none yet
    spec:
      env:
        # Set a channel and flip to 'true' once the report has an owning channel
        KIBANA_SLACK_NOTIFICATIONS_ENABLED: 'false'
        # Inputs of .buildkite/scripts/steps/report_flaky_tests.sh. Schedules may override
        # them to produce different reports (other pipelines, consistently failing tests, ...).
        FLAKY_TESTS_PIPELINES: 'kibana-on-merge'
        FLAKY_TESTS_LOOKBACK_DAYS: '7'
        FLAKY_TESTS_CLASSIFICATIONS: 'flaky'
        # Repository .buildkite/scripts/steps/report_flaky_test_issues.sh files the suite issues in.
        # The AppEx QA sandbox while the issues are being tried out; suites that a failed-test
        # issue in elastic/kibana is already about get none there. Flip to elastic/kibana to go
        # live, or to '' for a dry run against elastic/kibana that writes nothing.
        FLAKY_TESTS_GITHUB_REPO: 'elastic/appex-qa-ai'
        # Suite issues created per run, worst suites first
        FLAKY_TESTS_MAX_NEW_ISSUES: '10'
      allow_rebuilds: true
      branch_configuration: main
      cancel_intermediate_builds: true
      default_branch: main
      repository: elastic/kibana
      pipeline_file: .buildkite/pipelines/report_flaky_tests.yml
      initial_step_plugins:
        - sparse-checkout#v1.6.0:
            paths:
              - .buildkite/pipelines/report_flaky_tests.yml
            cleanup_sparse_state: true
      provider_settings:
        build_branches: false
        build_pull_requests: false
        publish_commit_status: false
        trigger_mode: none
        prefix_pull_request_fork_branch_names: false
        skip_pull_request_builds_for_existing_commits: false
      teams:
        everyone:
          access_level: BUILD_AND_READ
        kibana-operations:
          access_level: MANAGE_BUILD_AND_READ
        appex-qa:
          access_level: MANAGE_BUILD_AND_READ
        kibana-tech-leads:
          access_level: MANAGE_BUILD_AND_READ
      schedules:
        Daily flaky tests (kibana-on-merge):
          cronline: 0 6 * * * America/New_York
          message: Daily flaky test report for kibana-on-merge
          branch: main
      tags:
        - kibana
