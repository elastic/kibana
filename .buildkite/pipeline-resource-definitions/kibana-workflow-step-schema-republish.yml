# yaml-language-server: $schema=https://gist.githubusercontent.com/elasticmachine/988b80dae436cafea07d9a4a460a011d/raw/rre.schema.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: bk-kibana-workflow-step-schema-republish
  description: Manually republishes the committed workflow step schema of a chosen commit to the workflows CDN
  links:
    - url: 'https://buildkite.com/elastic/kibana-workflow-step-schema-republish'
      title: Pipeline link
spec:
  type: buildkite-pipeline
  owner: 'group:kibana-operations'
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: kibana / workflow step schema / republish
      description: Manually republishes the committed workflow step schema of a chosen commit to the workflows CDN
    spec:
      allow_rebuilds: true
      # Manual runs only: pick the branch and the commit holding the schema to publish, and set
      # CHANNEL (release|serverless) plus BASE_VERSION/FULL_VERSION for release in the build env.
      branch_configuration: main
      default_branch: main
      repository: elastic/kibana
      pipeline_file: .buildkite/pipelines/workflow_step_schema_republish.yml
      initial_step_plugins:
        - sparse-checkout#v1.6.0:
            paths:
              - .buildkite/pipelines/workflow_step_schema_republish.yml
            cleanup_sparse_state: true
      provider_settings:
        build_branches: false
        build_pull_requests: false
        publish_commit_status: false
        trigger_mode: none
        prefix_pull_request_fork_branch_names: false
        skip_pull_request_builds_for_existing_commits: false
      teams:
        everyone:
          access_level: BUILD_AND_READ
        kibana-operations:
          access_level: MANAGE_BUILD_AND_READ
        kibana-tech-leads:
          access_level: MANAGE_BUILD_AND_READ
      tags:
        - kibana
