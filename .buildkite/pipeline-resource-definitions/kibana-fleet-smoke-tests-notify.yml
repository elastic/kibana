# yaml-language-server: $schema=https://gist.githubusercontent.com/elasticmachine/988b80dae436cafea07d9a4a460a011d/raw/rre.schema.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: bk-kibana-fleet-smoke-tests-notify
  description: Alerts #fleet-notifications when fleet-smoke-tests fails N times in a row
  links:
    - url: 'https://buildkite.com/elastic/kibana-fleet-smoke-tests-notify'
      title: Pipeline link
spec:
  type: buildkite-pipeline
  owner: 'group:kibana-operations'
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: kibana / fleet / smoke-tests-notify
      description: Alerts when fleet-smoke-tests has N consecutive failures
    spec:
      env:
        SLACK_NOTIFICATIONS_CHANNEL: '#fleet-notifications'
        KIBANA_SLACK_NOTIFICATIONS_ENABLED: 'true'
        CONSECUTIVE_FAILURES_THRESHOLD: '3'
      allow_rebuilds: true
      branch_configuration: main
      default_branch: main
      repository: elastic/kibana
      pipeline_file: .buildkite/pipelines/fleet/notify_smoke_tests.yml
      initial_step_plugins:
        - sparse-checkout#v1.6.0:
            paths:
              - .buildkite/pipelines/fleet/notify_smoke_tests.yml
            cleanup_sparse_state: true
      provider_settings:
        trigger_mode: none
        publish_commit_status: false
        prefix_pull_request_fork_branch_names: false
        skip_pull_request_builds_for_existing_commits: false
      teams:
        everyone:
          access_level: BUILD_AND_READ
        kibana-operations:
          access_level: MANAGE_BUILD_AND_READ
        fleet:
          access_level: MANAGE_BUILD_AND_READ
        kibana-tech-leads:
          access_level: MANAGE_BUILD_AND_READ
      schedules:
        Hourly check:
          cronline: 0 * * * *
          message: Hourly check for consecutive fleet-smoke-tests failures
          env: {}
          branch: main
      tags:
        - kibana
        - fleet
