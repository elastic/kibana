# yaml-language-server: $schema=https://gist.githubusercontent.com/elasticmachine/988b80dae436cafea07d9a4a460a011d/raw/rre.schema.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: bk-kibana-merge-queue
  description: 'Runs the fast (non-e2e) checks for each GitHub merge queue group before its PRs land'
  links:
    - url: 'https://buildkite.com/elastic/kibana-merge-queue'
      title: Pipeline link
spec:
  type: buildkite-pipeline
  owner: 'group:kibana-operations'
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: kibana / merge queue
      description: 'Runs the fast (non-e2e) checks for each GitHub merge queue group before its PRs land'
    spec:
      env:
        SLACK_NOTIFICATIONS_CHANNEL: '#kibana-merge-queue-alerts'
        KIBANA_GITHUB_BUILD_COMMIT_STATUS_ENABLED: 'true'
        GITHUB_COMMIT_STATUS_CONTEXT: 'kibana-ci'
        SLACK_NOTIFICATIONS_SKIP_FOR_RETRIES: 'true'
      allow_rebuilds: true
      branch_configuration: gh-readonly-queue/* gh-readonly-queue/*/*
      default_branch: main
      repository: elastic/kibana
      pipeline_file: .buildkite/pipelines/merge_queue.yml
      initial_step_plugins:
        - sparse-checkout#v1.6.0:
            paths:
              - .buildkite/pipelines/merge_queue.yml
            cleanup_sparse_state: true
      skip_intermediate_builds: false
      provider_settings:
        build_branches: true
        build_pull_requests: false
        publish_commit_status: false
        trigger_mode: code
        build_tags: false
        prefix_pull_request_fork_branch_names: false
        skip_pull_request_builds_for_existing_commits: false
      teams:
        everyone:
          access_level: BUILD_AND_READ
        kibana-operations:
          access_level: MANAGE_BUILD_AND_READ
        appex-qa:
          access_level: MANAGE_BUILD_AND_READ
        kibana-tech-leads:
          access_level: MANAGE_BUILD_AND_READ
        apps-dx:
          access_level: MANAGE_BUILD_AND_READ
      tags:
        - kibana
        - ':kibana: Kibana release path'
