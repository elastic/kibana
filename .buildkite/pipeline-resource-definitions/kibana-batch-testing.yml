# yaml-language-server: $schema=https://gist.githubusercontent.com/elasticmachine/988b80dae436cafea07d9a4a460a011d/raw/rre.schema.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: bk-kibana-batch-testing
  description: Kibana validation and testing beyond merging to `main`
  links:
    - url: 'https://buildkite.com/elastic/kibana-batch-testing'
      title: Pipeline link
spec:
  type: buildkite-pipeline
  system: buildkite
  owner: 'group:apps-dx'
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: kibana / batch-testing
      description: Kibana validation and testing beyond merging to `main`
    spec:
      env:
        KIBANA_SLACK_NOTIFICATIONS_ENABLED: 'false'
        SCOUT_REPORTER_ENABLED: 'true'
      allow_rebuilds: false
      branch_configuration: main
      default_branch: main
      repository: elastic/kibana
      pipeline_file: .buildkite/pipelines/batch-testing.yml
      initial_step_plugins:
        - sparse-checkout#v1.6.0:
            paths:
              - .buildkite/pipelines/batch-testing.yml
            cleanup_sparse_state: true
      provider_settings:
        prefix_pull_request_fork_branch_names: false
        skip_pull_request_builds_for_existing_commits: true
        trigger_mode: none
      teams:
        apps-dx:
          access_level: MANAGE_BUILD_AND_READ
        kibana-tech-leads:
          access_level: MANAGE_BUILD_AND_READ
        everyone:
          access_level: BUILD_AND_READ
      schedules:
        'Every 3h':
          cronline: 0 6/3 * * 0-5
          message: 'Scheduled batch (every 3 hours)'
          branch: main
          env:
            TEST_CHANNELS: 'ci-batch-3h'
        Daily:
          cronline: 0 0 * * 0-5
          message: 'Scheduled batch (daily)'
          branch: main
          env:
            TEST_CHANNELS: 'ci-batch-daily'
        Weekly:
          cronline: 0 6 * * 5
          message: 'Scheduled batch (weekly)'
          branch: main
          env:
            TEST_CHANNELS: 'ci-batch-weekly'
      tags:
        - kibana
