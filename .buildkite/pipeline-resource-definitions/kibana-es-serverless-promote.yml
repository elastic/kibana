# yaml-language-server: $schema=https://gist.githubusercontent.com/elasticmachine/988b80dae436cafea07d9a4a460a011d/raw/rre.schema.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: bk-kibana-elasticsearch-serverless-promote
  description: Promote ElasticSearch Serverless images verified by kibana-elasticsearch-serverless-verify-and-promote
  links:
    - url: 'https://buildkite.com/elastic/kibana-elasticsearch-serverless-promote'
      title: Pipeline link
spec:
  type: buildkite-pipeline
  owner: 'group:kibana-operations'
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: kibana / elasticsearch serverless promote
      description: Promote ElasticSearch Serverless images verified by kibana-elasticsearch-serverless-verify-and-promote
    spec:
      env:
        SLACK_NOTIFICATIONS_CHANNEL: '#kibana-operations-alerts'
        KIBANA_SLACK_NOTIFICATIONS_ENABLED: 'true'
      allow_rebuilds: false
      branch_configuration: main
      default_branch: main
      repository: elastic/kibana
      pipeline_file: .buildkite/pipelines/es_serverless/promote_es_serverless_image.yml
      initial_step_plugins:
        - sparse-checkout#v1.6.0:
            paths:
              - .buildkite/pipelines/es_serverless/promote_es_serverless_image.yml
            cleanup_sparse_state: true
      provider_settings:
        build_branches: false
        build_pull_requests: false
        publish_commit_status: false
        trigger_mode: none
        build_tags: false
        prefix_pull_request_fork_branch_names: false
        skip_pull_request_builds_for_existing_commits: false
      teams:
        everyone:
          access_level: READ_ONLY
        kibana-operations:
          access_level: MANAGE_BUILD_AND_READ
      tags:
        - kibana
        - ':kibana: Kibana release path'
