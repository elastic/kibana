# =============================================================================
# Incident <id>: <title>
# -----------------------------------------------------------------------------
# Date:        <YYYY-MM-DD>            Severity: <SEV or N/A>
# Summary:     <one-line summary of what went wrong and the user impact>
# Root cause:  <the confirmed root cause>
# Resolution:  <how it was resolved / mitigated>
# RCA doc:     <rootly.google_drive_url>
# Slack:       <#incident-<id>-...>
#
# This config captures a BROAD, real-world log slice (noise included) so the
# incident can be reproduced and analyzed. The "snapshot" query is reindexed &
# snapshotted; each doc is stored under its ORIGINAL source data-stream name. The
# "symptom" query (same Query DSL language) is stored so it can be replayed against
# the restored full-log indices to isolate just the error lines.
# =============================================================================

incident:
  id: '<id>'
  title: '<title>'
  date: '<YYYY-MM-DD>'
  slackChannel: '#incident-<id>-...'

source:
  # The source cluster's real Elasticsearch endpoint (Overview). Must be in the
  # local ES `reindex.remote.whitelist` (see the capture-incident README).
  host: 'https://<host>.<region>.aws.found.io:443'
  # Prefer the OVERVIEW_API_KEY env var over an inline key. Never commit a real key.
  # apiKey: '<base64-api-key>'
  # Prefer the BROAD all-datasets pattern so the capture spans every logs-*
  # dataset the affected entity emitted (kibana.log, elasticsearch.server,
  # container_logs, system.syslog, …), not just the symptom dataset. Scope volume
  # via the entity filter in `query.snapshot`, not by narrowing the dataset here.
  index: '<clusterAlias>:logs-*'
  #  index:
  #    - 'logs-*'
  #    - 'serverless-logging-*:logs-*'
  # Optional: patterns to drop from `index` (compiled to `-pattern` exclusions).
  # Use with a broad `logs-*` to skip unreadable / huge datasets (e.g. verbose GC
  # logs the source key can't read or that are too large to snapshot).
  #  exclude:
  #    - 'logs-elasticsearch.gc-*'
  # Optional provenance label (stored in metadata); may be a wildcard or omitted.
  cluster: '<clusterAlias>'

query:
  # Required time window bracketing the incident: 1 hour before the first symptom
  # log (gte) to 1 hour after the last symptom log (lt). If the incident's query
  # has no @timestamp bound, derive a sensible window from the incident date.
  timeRange:
    gte: '<first symptom @timestamp - 1h, ISO>'
    lt: '<last symptom @timestamp + 1h, ISO>'

  # symptom: narrow Query DSL query used to LOCATE and CONFIRM the incident. Write
  # ANY DSL that matches the incident — there is no required shape. NOT snapshotted;
  # stored so it can be replayed against the restored full-log index to pull out the
  # error lines. Do NOT include the @timestamp range (added by the tool from
  # `timeRange`). Examples of valid shapes:
  #
  #   symptom:
  #     query_string:
  #       query: '"<error string>" OR <status> OR <keyword>'
  #
  #   symptom:
  #     bool:
  #       filter:
  #         - term: { 'log.level': 'ERROR' }
  #         - prefix: { 'log.logger': '<logger prefix>' }
  #         - wildcard: { 'error.message': '*<substring>*' }
  symptom: <any Query DSL that matches the incident symptom>

  # snapshot: BROAD Query DSL query that IS reindexed and snapshotted (remote
  # _reindex accepts Query DSL only, not ES|QL). Scope it by an ENTITY key present
  # in EVERY dataset (serverless.project.id, or a k8s node/pod host.name) so the
  # slice spans ALL logs-* datasets that entity emitted (noise INCLUDED) — NOT by
  # narrowing the dataset. Leave empty ({}) only to capture the whole source.index
  # within `timeRange`. Do not add the symptom filter or drop noise here.
  snapshot:
    term:
      serverless.project.id: '<project-id>'
  #  terms: { 'host.name': ['<node-a>', '<node-b>'] }

snapshot:
  # Symptom hit count confirmed by the ES|QL symptom probe (informational).
  expectedSymptomDocCount: <n>
  # Optional: fail the run if the reindexed TOTAL count (across all captured indices) differs.
  # expectedDocCount: <n>
  # Optional: defaults to customer0-incidents/incident-<id>.
  # gcsBasePath: 'customer0-incidents/incident-<id>'
  # Optional (default true): keep the original _index / source cluster on each doc.
  preserveProvenance: true
