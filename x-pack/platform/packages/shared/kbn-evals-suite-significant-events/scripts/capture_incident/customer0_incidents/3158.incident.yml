# =============================================================================
# Incident 3158: topolvm pods pending, cannot pull image
# -----------------------------------------------------------------------------
# Date:        2026-05-29            Severity: N/A
# Summary:     topolvm storage pods in AWS ap-southeast-2 were stuck Pending
#              because the kubelet could not pull the topolvm-with-sidecar:0.41.0
#              image, so new serverless project creation stalled until the CDN
#              recovered.
# Root cause:  A single layer of the topolvm-with-sidecar:0.41.0 image failed to
#              pull from the CDN (CloudFlare 'short read'), so topolvm pods stayed
#              pending in ap-southeast-2.
# Resolution:  Resolved once the CDN (CloudFlare) recovered and the image layer
#              could be pulled again.
# RCA doc:     RCA [INTERNAL] - topolvm pods pending not able to pull image
# Slack:       #incident-3158-topolvm-pods-pending-not-able-to-pull-image
# Logs:        Overview (CCS) -> logging-ap-southeast-2. The symptom (kubelet
#              image-pull errors) is in data_stream.dataset system.syslog, but the
#              snapshot spans ALL logs-* datasets on the affected nodes (e.g.
#              system.syslog + container_logs) so the topolvm pod context is
#              captured too. https://overview.elastic-cloud.com/app/r/s/4mlXW
#
# This config captures a BROAD, real-world log slice (noise included) across every
# dataset the affected nodes emitted, so the incident can be reproduced and
# analyzed. The "snapshot" query is reindexed & snapshotted; each doc is stored
# under its ORIGINAL source data-stream name (e.g. logs-system.syslog-default), so
# restore brings the indices back under those names. The "symptom" query (same
# Query DSL language) is stored so it can be replayed against the restored full-log
# indices to isolate just the error lines.
# =============================================================================

incident:
  id: '3158'
  title: 'topolvm pods pending, cannot pull image'
  date: '2026-05-29'
  slackChannel: '#incident-3158-topolvm-pods-pending-not-able-to-pull-image'

source:
  # Overview cluster's real Elasticsearch endpoint (remote _reindex source). The
  # incident logs live on the CCS-linked logging-ap-southeast-2 remote, reached via
  # the CCS-prefixed index pattern below. Must be in the local ES
  # `reindex.remote.whitelist` (see the capture-incident README).
  host: 'https://1abe339b8ee8411bacfda74fc62f1fca.us-east-1.aws.found.io:443'
  # API key read from the OVERVIEW_API_KEY env var (preferred). Never commit a key.
  # apiKey: '<base64-api-key>'
  # BROAD `logs-*` capture: reindex every dataset the affected nodes emitted (the
  # entity scope in `query.snapshot` keeps it to the three nodes, so it stays a
  # manageable slice). `exclude` drops frozen `partial-` indices the source API key
  # can't read (e.g. logs-bootstrap_logs), which would otherwise abort the whole
  # reindex (allow_partial_search_results=false). Add any other unreadable /
  # oversized datasets here if a run aborts on them. Older windows sit in `partial-`
  # frozen indices — still searchable, but snapshot soon.
  index: 'logging-ap-southeast-2:logs-*'
  exclude:
    - 'logging-ap-southeast-2:logs-bootstrap_logs-*'
  cluster: 'logging-ap-southeast-2'

query:
  # Incident window bracketing 2026-05-29 (from the incident's canonical ES|QL).
  timeRange:
    gte: '2026-05-28T00:00:00Z'
    lt: '2026-05-30T00:00:00Z'

  # symptom: narrow query that LOCATES and CONFIRMS the incident (23 kubelet
  # image-pull errors). NOT snapshotted — stored so it can be replayed against the
  # restored full-log index to pull out just the error lines. Translated verbatim
  # from the incident's KQL(...) filter (Lucene phrase-ORs work as query_string).
  symptom:
    query_string:
      query: '"Failed to pull image" OR "short read" OR ImagePullBackOff OR ErrImagePull'

  # snapshot: BROAD slice that IS reindexed & snapshotted (noise INCLUDED). Scoped
  # by ENTITY (the three ap-southeast-2 nodes that produced the image-pull errors),
  # NOT by dataset, so it spans every logs-* dataset on those nodes (system.syslog
  # kubelet context + container_logs for the pending topolvm pods). The symptom
  # filter and noise-exclusion are intentionally NOT applied here.
  snapshot:
    terms:
      host.name:
        - 'ip-10-112-231-254.ap-southeast-2.compute.internal'
        - 'ip-10-112-236-190.ap-southeast-2.compute.internal'
        - 'ip-10-112-229-62.ap-southeast-2.compute.internal'

snapshot:
  # Symptom hit count confirmed by the ES|QL discovery probe (informational).
  expectedSymptomDocCount: 23
  # expectedDocCount is the TOTAL across all captured indices — set it from the
  # entity-scoped re-probe (the old single-dataset 11761 no longer applies).
  # expectedDocCount: <re-probe total>
  # Keep the original _index / source cluster on each doc so provenance survives.
  preserveProvenance: true
