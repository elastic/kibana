openapi: 3.0.0
info:
  title: Update Evaluation Dataset API endpoint
  version: '1'
paths:
  /internal/evals/datasets/{datasetId}:
    put:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: UpdateEvaluationDataset
      description: Update evaluation dataset metadata
      summary: Update evaluation dataset
      tags:
        - Evals API
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Only the supplied fields are changed; omitted fields keep their
                current value. Send an empty `tags` array or a null `maturity`
                to clear them.
              properties:
                description:
                  type: string
                  maxLength: 2048
                tags:
                  $ref: '../common_attributes.schema.yaml#/components/schemas/DatasetTags'
                # Inlined rather than $ref'd to DatasetMaturity because only this
                # request can clear the field, and a $ref cannot be made nullable.
                maturity:
                  type: string
                  nullable: true
                  enum:
                    - raw
                    - cleaned
                    - golden
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  tags:
                    $ref: '../common_attributes.schema.yaml#/components/schemas/DatasetTags'
                  maturity:
                    $ref: '../common_attributes.schema.yaml#/components/schemas/DatasetMaturity'
                  created_at:
                    type: string
                  updated_at:
                    type: string
                required:
                  - id
                  - name
                  - description
                  - created_at
                  - updated_at
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  message:
                    type: string
