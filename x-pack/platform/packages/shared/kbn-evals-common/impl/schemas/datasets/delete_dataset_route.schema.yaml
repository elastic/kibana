openapi: 3.0.0
info:
  title: Delete Evaluation Dataset API endpoint
  version: "1"
paths:
  /internal/evals/datasets/{datasetId}:
    delete:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: DeleteEvaluationDataset
      description: Delete an evaluation dataset and all associated examples
      summary: Delete evaluation dataset
      tags:
        - Evals API
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
            maxLength: 1024
        - name: intent
          in: query
          required: false
          description: >-
            The outcome the caller expects. `unshare` requires the dataset to be
            assigned to other spaces and removes it from the current one only.
            `delete` requires the current space to be the last one and removes
            the dataset with its examples. Returns 409 when the dataset's spaces
            no longer match the expected outcome. Defaults to whichever outcome
            the dataset's spaces call for.
          schema:
            type: string
            maxLength: 16
            enum:
              - unshare
              - delete
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  unshared:
                    type: boolean
                    description: >-
                      True when the dataset was removed from the current space
                      and remains in others, false when it was deleted.
                required:
                  - success
        "404":
          description: Dataset not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  message:
                    type: string
