openapi: 3.0.0
info:
  title: Copy Evaluation Dataset API endpoint
  version: '1'
paths:
  /internal/evals/datasets/{datasetId}/_copy:
    post:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: CopyEvaluationDataset
      description: Copy an evaluation dataset
      summary: Copy evaluation dataset
      tags:
        - Evals API
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
            maxLength: 1024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 256
                description:
                  type: string
                  maxLength: 2048
              required:
                - name
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataset_id:
                    type: string
                  name:
                    type: string
                  examples_count:
                    type: integer
                required:
                  - dataset_id
                  - name
                  - examples_count
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  message:
                    type: string
        '409':
          description: Dataset already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  message:
                    type: string
