openapi: 3.0.0
info:
  title: Get Pinned Evaluation Baseline Scores API endpoint
  version: '1'
paths:
  /internal/evals/baselines/{baselineId}/scores:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: GetPinnedBaselineScores
      description: >-
        Get the score documents snapshotted when a baseline was pinned. Same document shape
        as experiment scores, so comparisons pair them identically.
      summary: Get pinned evaluation baseline scores
      tags:
        - Evals API
      parameters:
        - name: baselineId
          in: path
          required: true
          schema:
            type: string
            maxLength: 256
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - scores
                  - total
                properties:
                  scores:
                    type: array
                    items:
                      $ref: '../common_attributes.schema.yaml#/components/schemas/EvaluationScoreDocument'
                  total:
                    type: integer
