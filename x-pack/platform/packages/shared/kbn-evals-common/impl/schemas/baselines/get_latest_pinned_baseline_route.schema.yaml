openapi: 3.0.0
info:
  title: Get Latest Pinned Evaluation Baseline API endpoint
  version: '1'
paths:
  /internal/evals/baselines/latest:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: GetLatestPinnedBaseline
      description: >-
        Get the most recently pinned baseline pointer for a suite, optionally narrowed to a
        task model. Returns a null baseline when nothing has been pinned yet.
      summary: Get the latest pinned evaluation baseline
      tags:
        - Evals API
      parameters:
        - in: query
          name: suite_id
          required: true
          schema:
            type: string
            maxLength: 256
        - in: query
          name: model_id
          required: false
          schema:
            type: string
            maxLength: 256
          description: Filter by task model ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - baseline
                properties:
                  baseline:
                    nullable: true
                    $ref: './pin_baseline_route.schema.yaml#/components/schemas/PinnedBaseline'
