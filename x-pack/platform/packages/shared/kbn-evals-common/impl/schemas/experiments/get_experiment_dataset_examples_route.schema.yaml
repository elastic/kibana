openapi: 3.0.0
info:
  title: Get Evaluation Experiment Dataset Examples API endpoint
  version: '1'
paths:
  /internal/evals/experiments/{experimentId}/datasets/{datasetId}/examples:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: GetEvaluationExperimentDatasetExamples
      description: Get compact evaluation scores grouped by example for an experiment and dataset
      summary: Get evaluation experiment dataset examples
      tags:
        - Evals API
      parameters:
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
            maxLength: 1024
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
            maxLength: 1024
        - name: execution_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
          description: When provided, fetches examples for all experiments in this execution
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 400
            default: 1
        - name: include_previews
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  examples:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvaluationExperimentDatasetExample'
                  page:
                    type: integer
                    minimum: 1
                    maximum: 400
                  per_page:
                    type: integer
                    minimum: 25
                    maximum: 25
                  total:
                    type: integer
                    minimum: 0
                required:
                  - examples
                  - page
                  - per_page
                  - total
components:
  schemas:
    EvaluationExperimentDatasetExample:
      type: object
      properties:
        example_id:
          type: string
          maxLength: 1024
        example_index:
          type: integer
          nullable: true
        scores:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationExperimentScoreSummary'
        preview:
          $ref: '#/components/schemas/EvaluationExperimentExamplePreview'
      required:
        - example_id
        - example_index
        - scores
    EvaluationExperimentExamplePreview:
      type: object
      properties:
        repetition_index:
          type: integer
        input:
          type: object
          nullable: true
          properties:
            content:
              type: string
              maxLength: 4096
            truncated:
              type: boolean
          required:
            - content
            - truncated
        output:
          type: object
          nullable: true
          properties:
            content:
              type: string
              maxLength: 4096
            truncated:
              type: boolean
          required:
            - content
            - truncated
      required:
        - repetition_index
        - input
        - output
    EvaluationExperimentScoreSummary:
      type: object
      properties:
        '@timestamp':
          type: string
          maxLength: 64
        task:
          type: object
          properties:
            repetition_index:
              type: integer
            trace_id:
              type: string
              maxLength: 256
              nullable: true
          required:
            - repetition_index
        evaluator:
          type: object
          properties:
            name:
              type: string
              maxLength: 256
            score:
              type: number
              nullable: true
            label:
              type: string
              maxLength: 256
              nullable: true
            trace_id:
              type: string
              maxLength: 256
              nullable: true
            model:
              $ref: '../common_attributes.schema.yaml#/components/schemas/Model'
          required:
            - name
      required:
        - '@timestamp'
        - task
        - evaluator
