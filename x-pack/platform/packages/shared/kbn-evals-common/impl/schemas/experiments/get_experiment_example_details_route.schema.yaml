openapi: 3.0.0
info:
  title: Get Evaluation Experiment Example Details API endpoint
  version: '1'
paths:
  /internal/evals/experiments/{experimentId}/datasets/{datasetId}/examples/{exampleId}/repetitions/{repetitionIndex}:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: GetEvaluationExperimentExampleDetails
      description: Get payload and evaluator details for one experiment example repetition
      summary: Get evaluation experiment example details
      tags:
        - Evals API
      parameters:
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
            maxLength: 1024
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
            maxLength: 1024
        - name: exampleId
          in: path
          required: true
          schema:
            type: string
            maxLength: 1024
        - name: repetitionIndex
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
        - name: execution_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
          description: When provided, fetches details from the matching experiment execution
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationExperimentExampleDetails'
components:
  schemas:
    EvaluationExperimentExampleDetails:
      type: object
      properties:
        example:
          $ref: '#/components/schemas/EvaluationExperimentExampleDetailsExample'
        task:
          $ref: '#/components/schemas/EvaluationExperimentExampleDetailsTask'
        evaluators:
          type: array
          items:
            $ref: '../common_attributes.schema.yaml#/components/schemas/EvaluatorInfo'
      required:
        - example
        - task
        - evaluators
    EvaluationExperimentExampleDetailsExample:
      type: object
      properties:
        id:
          type: string
          maxLength: 1024
        index:
          type: integer
          nullable: true
        input:
          type: object
          additionalProperties: true
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
      required:
        - id
        - index
        - input
        - metadata
    EvaluationExperimentExampleDetailsTask:
      type: object
      properties:
        repetition_index:
          type: integer
        output:
          type: object
          additionalProperties: true
          nullable: true
        model:
          $ref: '../common_attributes.schema.yaml#/components/schemas/Model'
        trace_id:
          type: string
          maxLength: 256
          nullable: true
      required:
        - repetition_index
        - output
        - model
        - trace_id
