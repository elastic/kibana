openapi: 3.0.0
info:
  title: Get Evaluation Experiment Protocol API endpoint
  version: '1'
paths:
  /internal/evals/experiments/{experimentId}/protocol:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: GetEvaluationExperimentProtocol
      description: >-
        Get the protocol (what was evaluated and how) and execution record
        (when, where, how completely) of an evaluation experiment. Read from
        the stored experiment record when the run created one, falling back
        to derivation from score documents for historical experiments that
        were never recorded.
      summary: Get evaluation experiment protocol and execution record
      tags:
        - Evals API
      parameters:
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
            maxLength: 1024
        - name: suite_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
          description: Filter by suite ID
        - name: model_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
          description: Filter by task model ID
        - name: execution_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
          description: >-
            When provided, derives the protocol from all experiments in this
            execution instead of the single experiment from the path param
        - name: workflow_execution_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
          description: >-
            The workflow execution that launched this experiment, when it was
            run through Workflows. Consulted when the stored experiment
            record is missing or not yet terminal, so the execution status
            can reflect the live workflow state; without either, an
            experiment with scores reads as completed.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  experiment_id:
                    type: string
                    maxLength: 1024
                  protocol:
                    $ref: '#/components/schemas/ExperimentProtocol'
                  execution:
                    $ref: '#/components/schemas/ExperimentExecutionRecord'
                required:
                  - experiment_id
                  - protocol
                  - execution
        '404':
          description: Experiment not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                    maxLength: 256
                  message:
                    type: string
                    maxLength: 1024
components:
  schemas:
    ExperimentProtocol:
      type: object
      description: >-
        What was evaluated and how. Taken from the protocol snapshot of the
        stored experiment record when one exists, otherwise derived from the
        score documents.
      properties:
        experiment_name:
          type: string
          maxLength: 256
          nullable: true
        task_model:
          $ref: '../common_attributes.schema.yaml#/components/schemas/Model'
        total_repetitions:
          type: integer
        datasets:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ExperimentDatasetInfo'
        evaluators:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ExperimentEvaluatorInfo'
      required:
        - experiment_name
        - total_repetitions
        - datasets
        - evaluators

    ExperimentDatasetInfo:
      type: object
      properties:
        id:
          type: string
          maxLength: 1024
        name:
          type: string
          maxLength: 256
        evaluated_example_count:
          type: integer
          description: Distinct examples of this dataset the experiment scored.
        exists:
          type: boolean
          description: >-
            Whether the dataset still exists in this space. When false, the
            description and example count are only present when a stored
            experiment record supplies the snapshot taken when the run
            started.
        description:
          type: string
          maxLength: 2048
        example_count:
          type: integer
          description: >-
            How many examples the dataset holds now, which may differ from
            `evaluated_example_count` if it changed since the run.
      required:
        - id
        - name
        - evaluated_example_count
        - exists

    ExperimentEvaluatorInfo:
      type: object
      properties:
        name:
          type: string
          maxLength: 256
        version:
          type: string
          maxLength: 64
        kind:
          type: string
          enum:
            - llm
            - code
          description: >-
            Whether the evaluator invoked a model. Absent on experiments
            recorded before per-evaluator attribution was introduced.
        model:
          $ref: '../common_attributes.schema.yaml#/components/schemas/Model'
          description: >-
            Model this evaluator judged with. Never present for code
            evaluators, which invoke no model.
        score_count:
          type: integer
          description: How many score documents this evaluator produced.
      required:
        - name
        - score_count

    ExperimentExecutionRecord:
      type: object
      description: When and where the experiment ran, and how completely.
      properties:
        execution_id:
          type: string
          maxLength: 1024
        suite_id:
          type: string
          maxLength: 256
          nullable: true
        first_score_at:
          type: string
          maxLength: 64
        last_score_at:
          type: string
          maxLength: 64
        git_branch:
          type: string
          maxLength: 256
          nullable: true
        git_commit_sha:
          type: string
          maxLength: 256
          nullable: true
        ci:
          $ref: '../common_attributes.schema.yaml#/components/schemas/BuildkiteMetadata'
        hostname:
          type: string
          maxLength: 256
        started_at:
          type: string
          maxLength: 64
          description: When execution began, from the stored experiment record.
        completed_at:
          type: string
          maxLength: 64
          description: When execution finished, from the stored experiment record.
        error:
          type: string
          maxLength: 4096
          description: Why the run failed, from the stored experiment record.
        status:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
            - cancelled
          description: >-
            Execution status. The stored experiment record is authoritative
            once terminal; a missing or still-running record defers to the
            live workflow execution when `workflow_execution_id` names one.
            Without either, an experiment with scores reads as completed,
            since score documents alone cannot distinguish a finished run
            from an interrupted one.
        status_source:
          type: string
          enum:
            - record
            - workflow
            - scores
          description: >-
            Whether `status` came from the stored experiment record, the live
            workflow execution, or was assumed from score presence.
        completeness:
          $ref: '#/components/schemas/ExperimentCompleteness'
        task_counters:
          $ref: '../common_attributes.schema.yaml#/components/schemas/ExperimentRecordCompleteness'
          description: >-
            Task-level counters reported when the run was finalized. Only
            present when a stored experiment record carries them.
      required:
        - status
        - status_source
        - completeness

    ExperimentCompleteness:
      type: object
      description: >-
        Distinct examples x repetitions x evaluators seen in the scores,
        against the score documents actually found. Approximate when not
        every evaluator ran on every dataset.
      properties:
        example_count:
          type: integer
          description: >-
            Examples scored across every dataset, summed per dataset because an
            example id only distinguishes examples within its own dataset.
        evaluator_count:
          type: integer
        total_repetitions:
          type: integer
        expected_scores:
          type: integer
        received_scores:
          type: integer
        complete:
          type: boolean
      required:
        - example_count
        - evaluator_count
        - total_repetitions
        - expected_scores
        - received_scores
        - complete
