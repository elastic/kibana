openapi: 3.0.0
info:
  title: Get Evaluation Experiment Protocol API endpoint
  version: '1'
paths:
  /internal/evals/experiments/{experimentId}/protocol:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: GetEvaluationExperimentProtocol
      description: >-
        Get the protocol (what was evaluated and how) and execution summary
        (when and where it ran) of an evaluation experiment, derived from its
        score documents.
        endpoint.
      summary: Get evaluation experiment protocol and execution summary
      tags:
        - Evals API
      parameters:
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
            maxLength: 1024
        - name: suite_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
          description: Filter by suite ID
        - name: model_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
          description: Filter by task model ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  experiment_id:
                    type: string
                    maxLength: 1024
                  protocol:
                    $ref: '#/components/schemas/ExperimentProtocol'
                  execution:
                    $ref: '#/components/schemas/ExperimentExecution'
                required:
                  - experiment_id
                  - protocol
                  - execution
        '404':
          description: Experiment not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                    maxLength: 256
                  message:
                    type: string
                    maxLength: 1024
components:
  schemas:
    ExperimentProtocol:
      type: object
      description: What was evaluated and how, derived from the score documents.
      properties:
        experiment_name:
          type: string
          maxLength: 256
          nullable: true
        task_model:
          $ref: '../common_attributes.schema.yaml#/components/schemas/Model'
        total_repetitions:
          type: integer
        datasets:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ExperimentDatasetInfo'
        evaluators:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ExperimentEvaluatorInfo'
      required:
        - experiment_name
        - total_repetitions
        - datasets
        - evaluators

    ExperimentDatasetInfo:
      type: object
      description: >-
        A dataset as the score documents recorded it. Its current state
        (description, example count, existence) is not consulted; use the
        datasets API for that.
      properties:
        id:
          type: string
          maxLength: 1024
        name:
          type: string
          maxLength: 256
        evaluated_example_count:
          type: integer
          description: Distinct examples of this dataset the experiment scored.
      required:
        - id
        - name
        - evaluated_example_count

    ExperimentEvaluatorInfo:
      type: object
      properties:
        name:
          type: string
          maxLength: 256
        version:
          type: string
          maxLength: 64
        kind:
          type: string
          enum:
            - llm
            - code
          description: >-
            Whether the evaluator invoked a model. Absent on experiments
            recorded before per-evaluator attribution was introduced.
        model:
          $ref: '../common_attributes.schema.yaml#/components/schemas/Model'
          description: >-
            Model this evaluator judged with. Never present for code
            evaluators, which invoke no model.
        score_count:
          type: integer
          description: How many score documents this evaluator produced.
      required:
        - name
        - score_count

    ExperimentExecution:
      type: object
      description: >-
        When and where the experiment ran, read from score document metadata
        and timestamps. Carries no execution status or completeness
        judgement: score documents cannot support either.
      properties:
        execution_id:
          type: string
          maxLength: 1024
        suite_id:
          type: string
          maxLength: 256
          nullable: true
        first_score_at:
          type: string
          maxLength: 64
        last_score_at:
          type: string
          maxLength: 64
        git_branch:
          type: string
          maxLength: 256
          nullable: true
        git_commit_sha:
          type: string
          maxLength: 256
          nullable: true
        ci:
          $ref: '../common_attributes.schema.yaml#/components/schemas/BuildkiteMetadata'
        hostname:
          type: string
          maxLength: 256
