openapi: 3.0.0
info:
  title: Compare Evaluation Experiments API endpoint
  version: '1'
paths:
  /internal/evals/experiments/compare:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: CompareExperiments
      description: Compare two evaluation experiments using paired t-tests
      summary: Compare two evaluation experiments
      tags:
        - Evals API
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [experiment, execution]
            default: experiment
          description: Comparison type — compare individual experiments or suite executions
        - name: baseline_id
          in: query
          required: true
          schema:
            type: string
            maxLength: 1024
          description: Baseline experiment or execution ID (depends on type)
        - name: target_id
          in: query
          required: true
          schema:
            type: string
            maxLength: 1024
          description: Target experiment or execution ID (depends on type)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PairedTTestResult'
                  pairing:
                    type: object
                    properties:
                      totalPairs:
                        type: integer
                      skippedMissingPairs:
                        type: integer
                      skippedNullScores:
                        type: integer
                      truncatedBaseline:
                        type: boolean
                        description: Whether the baseline scores were truncated due to size limits
                      truncatedTarget:
                        type: boolean
                        description: Whether the target scores were truncated due to size limits
                    required:
                      - totalPairs
                      - skippedMissingPairs
                      - skippedNullScores
                      - truncatedBaseline
                      - truncatedTarget
                required:
                  - results
                  - pairing

components:
  schemas:
    PairedTTestResult:
      type: object
      properties:
        datasetId:
          type: string
          maxLength: 1024
        datasetName:
          type: string
          maxLength: 256
        evaluatorName:
          type: string
          maxLength: 256
        sampleSize:
          type: integer
        meanBaseline:
          type: number
          description: Mean score of the baseline experiment
        meanTarget:
          type: number
          description: Mean score of the target experiment
        pValue:
          type: number
          nullable: true
        direction:
          type: string
          enum:
            - maximize
            - minimize
            - neutral
          description: >-
            Whether a higher score is an improvement (`maximize`), a lower
            score is an improvement (`minimize`), or the score cannot be
            compared across arms at all (`neutral`) for this evaluator.
      required:
        - datasetId
        - datasetName
        - evaluatorName
        - sampleSize
        - meanBaseline
        - meanTarget
        - pValue
        - direction
