openapi: 3.0.0
info:
  title: Get Evaluator API endpoint
  version: '1'
paths:
  /internal/evals/evaluators/{name}:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: GetEvaluator
      description: >-
        Get one evaluator by name. Resolves built-in and persisted evaluators
        alike; built-ins carry no judge configuration.
      summary: Get evaluator
      tags:
        - Evals API
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '../common_attributes.schema.yaml#/components/schemas/EvaluatorName'
        - name: version
          in: query
          required: false
          description: Pins the lookup to one version. Defaults to the latest.
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluator:
                    type: object
                    properties:
                      name:
                        type: string
                        maxLength: 256
                      version:
                        type: string
                        maxLength: 64
                      kind:
                        type: string
                        enum:
                          - llm
                          - code
                      origin:
                        $ref: '../common_attributes.schema.yaml#/components/schemas/EvaluatorOrigin'
                      description:
                        type: string
                        maxLength: 2048
                      judge:
                        $ref: '../common_attributes.schema.yaml#/components/schemas/LlmJudgeConfig'
                      created_at:
                        type: string
                        maxLength: 64
                      updated_at:
                        type: string
                        maxLength: 64
                      created_by:
                        type: string
                        maxLength: 256
                      versions:
                        type: array
                        maxItems: 500
                        items:
                          type: string
                          maxLength: 64
                        description: >-
                          Up to 500 stored versions of this evaluator, newest
                          first. Absent for built-ins.
                    required:
                      - name
                      - version
                      - kind
                      - origin
                      - description
                required:
                  - evaluator
        '404':
          description: Evaluator not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  message:
                    type: string
