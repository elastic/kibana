openapi: 3.0.0
info:
  title: Update Evaluator API endpoint
  version: '1'
paths:
  /internal/evals/evaluators/{name}:
    put:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: UpdateEvaluator
      description: >-
        Write the next version of a user-defined evaluator. Versions are
        immutable, so this stores a new version rather than replacing the
        current one, and earlier versions stay resolvable by `name@version`.
        Omitted fields carry forward from the previous version.
      summary: Update evaluator
      tags:
        - Evals API
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: '../common_attributes.schema.yaml#/components/schemas/EvaluatorName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                description:
                  type: string
                  minLength: 1
                  maxLength: 2048
                judge:
                  $ref: '../common_attributes.schema.yaml#/components/schemas/LlmJudgeConfig'
                base_version:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: >-
                    The version this edit was made from. When set and the
                    evaluator has since moved to another version, the update
                    is rejected with `409` instead of being written over the
                    newer version. Omit it to layer the update onto whatever
                    the latest version is.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluator:
                    $ref: '../common_attributes.schema.yaml#/components/schemas/PersistedEvaluator'
                required:
                  - evaluator
        '400':
          description: Invalid update
        '404':
          description: Evaluator not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  message:
                    type: string
        '409':
          description: >-
            The name is built-in and cannot be redefined, or `base_version` is
            no longer the latest version
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  message:
                    type: string
