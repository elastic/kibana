openapi: 3.0.0
info:
  title: Create Evaluator API endpoint
  version: '1'
paths:
  /internal/evals/evaluators:
    post:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: CreateEvaluator
      description: >-
        Create a user-defined evaluator definition. Currently, only
        LLM-as-a-judge evaluators are supported.
      summary: Create evaluator
      tags:
        - Evals API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '../common_attributes.schema.yaml#/components/schemas/EvaluatorName'
                description:
                  type: string
                  minLength: 1
                  maxLength: 2048
                judge:
                  $ref: '../common_attributes.schema.yaml#/components/schemas/LlmJudgeConfig'
              required:
                - name
                - description
                - judge
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluator:
                    $ref: '../common_attributes.schema.yaml#/components/schemas/PersistedEvaluator'
                required:
                  - evaluator
        '400':
          description: Invalid evaluator definition
        '409':
          description: An evaluator with that name already exists, or the name is built-in
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  message:
                    type: string
