openapi: 3.0.0
info:
  title: Evaluate API endpoint
  version: '1'
paths:
  /internal/evals/_evaluate:
    post:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: Evaluate
      description: Executes one or more evaluators against a subject
      summary: Evaluate
      tags:
        - Evals API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subject
                - evaluators
              properties:
                subject:
                  $ref: '../common_attributes.schema.yaml#/components/schemas/EvaluationSubject'
                evaluators:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        maxLength: 256
                      version:
                        type: string
                        maxLength: 64
                      connector_id:
                        type: string
                        maxLength: 256
                emit:
                  $ref: '#/components/schemas/EvaluateEmitOptions'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvaluateResult'
                  emission:
                    $ref: '#/components/schemas/EvaluateEmission'
components:
  schemas:
    EvaluateEmitOptions:
      type: object
      description: >-
        When set, successful scores are emitted as OTel `gen_ai.evaluation.result` events
        attached to the evaluated trace, and evaluators that already emitted results for this
        monitor and trace are skipped before they run.
      required:
        - monitor
      properties:
        monitor:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: string
              maxLength: 1024
            name:
              type: string
              maxLength: 256
    EvaluateEmission:
      type: object
      required:
        - emitted
        - skipped_evaluators
      properties:
        emitted:
          type: integer
          description: Number of evaluation events emitted.
        skipped_evaluators:
          type: array
          description: >-
            Evaluators (`name@version`) that were not run because they already emitted results
            for this monitor and trace. They are absent from `results`.
          items:
            type: string
    EvaluateResult:
      type: object
      required:
        - status
        - evaluator
      properties:
        status:
          type: string
          enum:
            - ok
            - error
        evaluator:
          $ref: '#/components/schemas/EvaluateResultEvaluator'
        scores:
          type: array
          items:
            $ref: '#/components/schemas/EvaluateResultScore'
        error:
          $ref: '#/components/schemas/EvaluateResultError'
    EvaluateResultEvaluator:
      type: object
      required:
        - name
        - version
        - kind
      properties:
        name:
          type: string
          maxLength: 256
        version:
          type: string
          maxLength: 64
        kind:
          type: string
          enum:
            - llm
            - code
        trace_id:
          type: string
          minLength: 32
          maxLength: 32
          pattern: '^[0-9a-f]{32}$'
        direction:
          type: string
          enum:
            - maximize
            - minimize
            - neutral
          description: >-
            Whether a higher score is an improvement (`maximize`),
            a lower score is an improvement (`minimize`), or the
            score cannot be compared across arms at all (`neutral`).
        model:
          $ref: '../common_attributes.schema.yaml#/components/schemas/Model'
          description: >-
            Model resolved from the evaluator's `connector_id`.
            Absent for code evaluators, which invoke no model.
    EvaluateResultScore:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 256
        score:
          type: number
          nullable: true
        label:
          type: string
          maxLength: 1024
        explanation:
          type: string
          maxLength: 8192
        metadata:
          type: object
          additionalProperties: true
        direction:
          $ref: '../common_attributes.schema.yaml#/components/schemas/Direction'
          description: >-
            This score's own direction, for evaluators whose scores do not all
            share one. Absent means the evaluator's `direction` applies.
    EvaluateResultError:
      type: object
      required:
        - message
      properties:
        code:
          type: string
          enum:
            - evidence_unmet
        message:
          type: string
          maxLength: 8192
