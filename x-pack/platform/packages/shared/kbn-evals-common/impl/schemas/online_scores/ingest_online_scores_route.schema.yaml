openapi: 3.0.0
info:
  title: Ingest Online Evaluation Scores API endpoint
  version: '1'
paths:
  /internal/evals/online_scores:
    post:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: IngestOnlineScores
      description: Ingest online evaluation scores for a single trace run
      summary: Ingest online evaluation scores
      tags:
        - Evals API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - monitor
                - trace_id
                - results
              properties:
                monitor:
                  type: object
                  required:
                    - id
                    - name
                  properties:
                    id:
                      type: string
                      maxLength: 1024
                    name:
                      type: string
                      maxLength: 256
                trace_id:
                  type: string
                  maxLength: 256
                connector_id:
                  type: string
                  maxLength: 256
                results:
                  type: array
                  items:
                    $ref: '../evaluators/evaluate_route.schema.yaml#/components/schemas/EvaluateResult'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - created
                  - skipped
                  - failed_evaluators
                properties:
                  created:
                    type: integer
                  skipped:
                    type: integer
                  failed_evaluators:
                    type: integer
