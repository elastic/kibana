title: Connector request properties for an OpenAI connector with Other provider
description: >
  Defines properties for connectors when type is `.gen-ai` and the API provider is `Other` (OpenAI-compatible service), including optional PKI authentication.
type: object
required:
  - apiProvider
  - apiUrl
  - defaultModel
properties:
  apiProvider:
    type: string
    description: The OpenAI API provider.
    enum: ['Other']
  apiUrl:
    type: string
    description: The OpenAI-compatible API endpoint.
  defaultModel:
    type: string
    description: The default model to use for requests.
  certificateData:
    type: string
    description: PEM-encoded certificate content.
    minLength: 1
  privateKeyData:
    type: string
    description: PEM-encoded private key content.
    minLength: 1
  caData:
    type: string
    description: PEM-encoded CA certificate content.
    minLength: 1
  verificationMode:
    type: string
    description: SSL verification mode for PKI authentication.
    enum: ['full', 'certificate', 'none']
    default: 'full'
  headers:
    type: object
    description: Custom headers to include in requests.
    additionalProperties:
      type: string
  extraBody:
    type: object
    description: |
      Additional JSON fields that are deep-merged into every chat completion request the connector sends to the model server, for example `chat_template_kwargs` for vLLM or SGLang. Values that Kibana sets on the request win over `extraBody`, and an explicit `null` in the request also wins. The keys `model`, `messages`, `stream`, `tools`, and `tool_choice` are reserved and are rejected.
    additionalProperties: true
    example:
      chat_template_kwargs:
        enable_thinking: false
