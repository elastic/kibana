title: Connector secrets properties for a Rootly Alerts connector
description: Defines secrets for connectors when type is `.rootly_alerts`.
type: object
additionalProperties: false
required:
  - secret
properties:
  secret:
    description: The secret of the Rootly alert source. It is sent as a bearer token.
    type: string
    minLength: 1
    maxLength: 1024
