get:
  summary: Get a case template by ID
  operationId: getCaseTemplateDefaultSpace
  description: >
    Returns the details of a case template.
    Requires the Cases feature to be enabled in the space.
  tags:
    - cases
  parameters:
    - $ref: '../components/parameters/template_id.yaml'
    - $ref: '../components/parameters/template_version.yaml'
  responses:
    '200':
      description: Indicates a successful call.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/template_v2_response.yaml'
          examples:
            getCaseTemplateResponse:
              $ref: '../components/examples/get_case_template_response.yaml'
    '404':
      description: The template was not found.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/response_4xx.yaml'
          examples:
            response404:
              $ref: '../components/examples/response_404.yaml'
    '401':
      description: Authorization information is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/response_4xx.yaml'
          examples:
            response401:
              $ref: '../components/examples/response_401.yaml'
put:
  summary: Update a case template
  operationId: updateCaseTemplateDefaultSpace
  description: >
    Fully replaces a case template. Every accepted update creates a new template version;
    previous versions stay retrievable with the `version` query parameter of the get template
    API, and cases keep the version they were created with. You must have the "Manage
    templates" sub-privilege for the Cases feature of the owning solution. Set `dry_run=true`
    to run the full validation without writing. Requires the Cases feature to be enabled in
    the space.
  x-state: Technical preview
  tags:
    - cases
  parameters:
    - $ref: '../components/parameters/template_id.yaml'
    - in: query
      name: dry_run
      description: 'When true, validates the request without updating the template and returns `{"valid": true}`.'
      required: false
      schema:
        type: boolean
        default: false
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/template_write_request.yaml'
        examples:
          updateCaseTemplateRequest:
            $ref: '../components/examples/template_write_request.yaml'
  responses:
    '200':
      description: 'Indicates a successful call. Returns the new template version, or `{"valid": true}` for a dry run.'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '../components/schemas/template_v2_response.yaml'
              - $ref: '../components/schemas/template_dry_run_response.yaml'
          examples:
            updateCaseTemplateResponse:
              $ref: '../components/examples/get_case_template_response.yaml'
            dryRunResponse:
              $ref: '../components/examples/template_dry_run_response.yaml'
    '400':
      description: >
        The request body, YAML definition, or template name is invalid, or a resource limit was
        exceeded (max 200 fields per template).
      content:
        application/json:
          schema:
            $ref: '../components/schemas/response_4xx.yaml'
          examples:
            response400:
              $ref: '../components/examples/response_400_template_limit.yaml'
    '401':
      description: Authorization information is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/response_4xx.yaml'
          examples:
            response401:
              $ref: '../components/examples/response_401.yaml'
    '403':
      description: The user does not have the manage templates privilege for the owner.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/response_4xx.yaml'
          examples:
            response403:
              $ref: '../components/examples/response_403.yaml'
    '404':
      description: The template was not found.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/response_4xx.yaml'
          examples:
            response404:
              $ref: '../components/examples/response_404.yaml'
    '409':
      description: A template with the same name already exists for the owner.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/response_4xx.yaml'
          examples:
            response409:
              $ref: '../components/examples/response_409.yaml'
delete:
  summary: Delete a case template
  operationId: deleteCaseTemplateDefaultSpace
  description: >
    Soft-deletes a case template (all versions). Existing cases keep their pinned template
    reference; the template stops appearing in the case creation flow and in find responses.
    You must have the "Manage templates" sub-privilege for the Cases feature of the owning
    solution. Requires the Cases feature to be enabled in the space.
  x-state: Technical preview
  tags:
    - cases
  parameters:
    - $ref: '../components/parameters/template_id.yaml'
  responses:
    '204':
      description: The template was deleted.
    '401':
      description: Authorization information is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/response_4xx.yaml'
          examples:
            response401:
              $ref: '../components/examples/response_401.yaml'
    '403':
      description: The user does not have the manage templates privilege for the owner.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/response_4xx.yaml'
          examples:
            response403:
              $ref: '../components/examples/response_403.yaml'
    '404':
      description: The template was not found.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/response_4xx.yaml'
          examples:
            response404:
              $ref: '../components/examples/response_404.yaml'
