title: Update case request
description: >-
  The update case API request body varies depending on the type of connector.
type: object
required:
  - cases
properties:
  cases:
    type: array
    description: An array containing one or more case objects.
    maxItems: 100
    minItems: 1
    items:
      type: object
      required:
        - id
        - version
      properties:
        assignees:
          $ref: 'assignees.yaml'
        category:
          $ref: 'case_category.yaml'
        connector:
          oneOf:
            - $ref: 'connector_properties_none.yaml'
            - $ref: 'connector_properties_cases_webhook.yaml'
            - $ref: 'connector_properties_jira.yaml'
            - $ref: 'connector_properties_resilient.yaml'
            - $ref: 'connector_properties_servicenow.yaml'
            - $ref: 'connector_properties_servicenow_sir.yaml'
            - $ref: 'connector_properties_swimlane.yaml'
        customFields:
          type: array
          deprecated: true
          description: >
            Deprecated. Use `extended_fields` instead.
            Custom field values for a case.
            Any optional custom fields that are not specified in the request are set to null.
            Values written here continue to work during the migration to `extended_fields`.
          minItems: 0
          maxItems: 10
          items:
            type: object
            required:
              - key
              - type
              - value
            properties:
              $ref: 'case_customfields.yaml'
        template:
          type: object
          nullable: true
          x-state: Technical preview
          description: >
            The case template. Requires the `xpack.cases.templates.enabled` setting. Updating
            `template` is validation-only: switching the template validates the case's
            `extended_fields` against the new template's fields but does not inject template
            defaults (unlike create). Omit to leave the current template unchanged; set to `null`
            to clear it; set to `{ id, version }` to switch. Unlike create, switching a template on
            update is an explicit versioned action: both `id` and `version` are required — the
            server does not resolve a latest version here. After switching, use the get case fields
            API (`GET /api/cases/{case_id}/fields`) to see the fields the new template exposes.
          required:
            - id
            - version
          properties:
            id:
              type: string
              description: The template identifier. Retrieve template ids with `GET /api/cases/templates`.
            version:
              type: integer
              description: >
                The template version to apply. Required on update: switching a template is an
                explicit versioned action, so the version must be specified.
              minimum: 1
        description:
          $ref: 'case_description.yaml'
        extended_fields:
          $ref: 'case_extended_fields.yaml'
        id:
          description: The identifier for the case.
          type: string
          maxLength: 30000
        settings:
          $ref: 'settings.yaml'
        severity:
          $ref: 'case_severity.yaml'
        status:
          $ref: 'case_status.yaml'
        tags:
          $ref: 'case_tags.yaml'
        title:
          $ref: 'case_title.yaml'
        closeReason:
          $ref: 'case_close_sync_reason.yaml'
        version:
          description: >
            The current version of the case.
            To determine this value, use the get case or search cases (`_find`) APIs.
          type: string
