in: query
name: type
description: >
  Filters the returned attachments by one or more attachment types, such as `comment` or
  `security.alert`. To filter by multiple types, repeat the parameter. Limited to 20 types.
required: false
schema:
  oneOf:
    - type: string
      minLength: 1
      maxLength: 50
    - type: array
      minItems: 1
      maxItems: 20
      items:
        type: string
        minLength: 1
        maxLength: 50
example: comment
