type: string
description: >
  The attachment type, such as `comment`, `security.alert`, `observability.alert`, `stack.alert`,
  `security.event`, `lens`, `dashboard`, or `file`. `security.*` types only work on Security
  cases, `observability.*` on Observability cases, and `stack.*` on Stack Management cases. Use
  `comment` (not the legacy `user` type) and a `*.alert` type (not `alert`). You can't add or
  replace file attachments with this API. To add a file, use `POST /api/cases/{caseId}/files`.
example: comment
