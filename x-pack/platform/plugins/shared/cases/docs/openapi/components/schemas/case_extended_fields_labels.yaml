type: object
additionalProperties:
  type: string
description: >
  A read-only, response-only map from each `extended_fields` storage key to its
  human-readable label. Only populated by the get case and search cases endpoints; absent
  on create, update, push, and comment responses. Not persisted. Including this field
  in a write request returns a 400 error.
example:
  priority_as_keyword: Priority
