type: object
required:
  - workflow
  - origin
properties:
  workflow:
    type: object
    required:
      - id
      - name
      - executionId
    properties:
      id:
        type: string
      name:
        type: string
      executionId:
        type: string
  origin:
    type: object
    required:
      - type
      - id
    properties:
      type:
        type: string
        enum:
          - cases.case
          - cases.observable
          - cases.alert
          - cases.alerts
          - cases.comment
          - cases.attachment
      id:
        type: string
      index:
        type: string
      typeKey:
        type: string
      value:
        type: string
