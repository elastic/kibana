type: object
description: >
  Technical preview. Controls automatic synchronization between the case and the external incident
  created by its connector. On a configuration these are the defaults of the configuration's connector
  and apply to new cases that use it. When `autoPush` is true, changes to the case are pushed to the external
  system without a manual push. `conflictStrategy` decides which side wins when a field changed on both
  sides since the last push: `external` applies the external value, `kibana` keeps the case value.
required:
  - autoPush
  - conflictStrategy
properties:
  autoPush:
    type: boolean
    example: true
  conflictStrategy:
    type: string
    enum:
      - external
      - kibana
    example: external
