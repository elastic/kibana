type: object
description: An object that contains the case settings.
required:
  - syncAlerts
properties:
  syncAlerts:
    description: Turns alert syncing on or off.
    type: boolean
    example: true
  extractObservables:
    description: >
      When true, observables (for example, IPs, hashes, and URLs) are automatically extracted from case comments.
      When omitted on create, the space configuration default is used. Falls back to `true` if no
      space configuration exists. Precedence: explicit value > template setting > space config > true.
    type: boolean
    example: true
