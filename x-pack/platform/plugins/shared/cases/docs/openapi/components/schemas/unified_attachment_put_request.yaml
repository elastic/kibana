title: Replace case attachment request
description: >
  The full replacement for the attachment. The `type` and `owner` must match the existing
  attachment. Reference attachment types require `attachmentId`. Value attachment types require
  `data` and don't accept `attachmentId`. Unknown properties are rejected.
oneOf:
  - title: Reference attachment
    type: object
    additionalProperties: false
    required:
      - attachmentId
      - owner
      - type
      - version
    properties:
      attachmentId:
        $ref: 'unified_attachment_attachment_id.yaml'
      data:
        $ref: 'unified_attachment_data.yaml'
      metadata:
        $ref: 'unified_attachment_metadata.yaml'
      owner:
        $ref: 'owner.yaml'
      type:
        $ref: 'unified_attachment_type.yaml'
      version:
        $ref: 'unified_attachment_version.yaml'
  - title: Value attachment
    type: object
    additionalProperties: false
    required:
      - data
      - owner
      - type
      - version
    properties:
      data:
        $ref: 'unified_attachment_data.yaml'
      metadata:
        $ref: 'unified_attachment_metadata.yaml'
      owner:
        $ref: 'owner.yaml'
      type:
        $ref: 'unified_attachment_type.yaml'
      version:
        $ref: 'unified_attachment_version.yaml'
