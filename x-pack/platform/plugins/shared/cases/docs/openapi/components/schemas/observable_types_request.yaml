type: array
description: >
  The custom observable types.
  To change how auto-extraction reads a type, use `observableTypeSettings`.
minItems: 0
maxItems: 10
items:
  type: object
  required:
    - key
    - label
  properties:
    key:
      type: string
      description: The observable type key.
      minLength: 1
      maxLength: 36
      pattern: ^[a-z0-9_-]+$
      example: employee-id
    label:
      type: string
      description: The observable type label.
      minLength: 1
      maxLength: 50
      example: Employee ID
