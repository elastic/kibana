closure_type:
  $ref: 'closure_types.yaml'
connector:
  type: object
  properties:
    $ref: 'case_configure_connector_properties.yaml'
created_at:
  type: string
  format: date-time
  example: 2022-06-01T17:07:17.767Z
created_by:
  type: object
  required:
    - email
    - full_name
    - username
  properties:
    $ref: 'user_properties.yaml'
customFields:
  type: array
  deprecated: true
  description: >
    Custom fields configuration details.
    Deprecated. Use the field library (`/api/cases/field_definitions`) to manage
    field definitions and `extended_fields` on case create/update to set field values.
  items:
    type: object
    properties:
      $ref: 'case_configure_customfields.yaml'
error:
  type: string
  nullable: true
  example: null
id:
  type: string
  example: 4a97a440-e1cd-11ec-be9b-9b1838238ee6
mappings:
  type: array
  items:
    type: object
    properties:
      action_type:
        type: string
        example: overwrite
      source:
        type: string
        example: title
      target:
        type: string
        example: summary
observableTypes:
  type: array
  description: Custom observable type configuration details.
  items:
    type: object
    properties:
      key:
        type: string
        description: The observable type key.
        example: d312efda-ec2b-42ec-9e2c-84981795c581
      label:
        type: string
        description: The observable type label.
        example: My observable type
observableTypeSettings:
  type: array
  description: >
    The auto-extraction settings of the built-in and custom observable types.
    A type without an entry uses its default settings.
  items:
    type: object
    properties:
      key:
        type: string
        description: The key of a built-in or custom observable type.
        example: employee-id
      paths:
        type: array
        description: >
          The alert fields that auto-extraction reads for this type.
          For a built-in type, these entries change or add to the default fields.
        items:
          type: object
          properties:
            path:
              type: string
              description: The name of the alert field.
              example: user.employee_id
            enabled:
              type: boolean
              description: When `false`, auto-extraction skips this field.
              example: true
            excludedValues:
              type: array
              description: Values of this field that auto-extraction skips. The match is exact and case-sensitive.
              items:
                type: string
              example:
                - E000000
      valuePattern:
        type: string
        description: A regular expression. Auto-extraction keeps only the values that match it.
        example: ^E\d{6}$
extractObservables:
  type: boolean
  description: >
    Indicates whether observables (for example, IPs, hashes, and URLs) are
    automatically extracted from case comments and events.
  example: true
owner:
  $ref: 'owner.yaml'
templates:
  $ref: 'templates.yaml'
workflowTags:
  type: array
  description: >
    Workflow tags that limit which workflows appear in Cases workflow selectors.
    An empty array shows all workflows.
  maxItems: 100
  items:
    type: string
    minLength: 1
    maxLength: 1024
updated_at:
  type: string
  format: date-time
  nullable: true
  example: 2022-06-01T19:58:48.169Z
updated_by:
  type: object
  required:
    - email
    - full_name
    - username
  properties:
    $ref: 'user_properties.yaml'
  nullable: true
version:
  type: string
  example: WzIwNzMsMV0=
