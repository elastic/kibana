title: Field definition PUT request
description: >
  The body for updating a reusable field definition.


  Identity constraints: the `name` property must match the `name` key in the YAML `definition`.
  When `name` is omitted, the server extracts it from the `definition` YAML automatically.
  A field's `name` and YAML `type` are immutable — an attempt to change either returns `409` with
  `attributes.code = "field_identity_immutable"` and `attributes.changed` listing which identity
  attributes were modified.


  Note: unlike the POST endpoint, the `definition` field has no enforced character limit on PUT.
  This allows existing field definitions whose stored YAML was created through internal tooling
  before the public API existed (and may exceed 30 000 characters) to remain modifiable.
type: object
additionalProperties: false
required:
  - owner
  - definition
properties:
  name:
    type: string
    minLength: 1
    maxLength: 50
    description: >
      The field name, unique per owner (case-insensitive). Must match the `name` key inside the YAML
      definition. When omitted, the name is extracted from the definition YAML automatically.
      Immutable after creation.
  owner:
    $ref: 'owner.yaml'
  definition:
    type: string
    description: The field definition as a YAML string describing a single field (type, label, control, metadata).
    example: |
      name: priority
      label: Priority
      type: keyword
      control: SELECT_BASIC
      metadata:
        options: [low, medium, high]
        default: medium
  description:
    type: string
    maxLength: 1000
    description: Optional human-readable description of the field's purpose.
  isGlobal:
    type: boolean
    description: >
      When true, this field is rendered in every case for this owner, regardless of the template
      used. Global fields cannot be demoted (set to false) while they are linked to an active v1
      custom field in the Cases configuration.
