title: Set case configuration request
description: External connection details, such as the closure type and default connector for cases.
type: object
required:
  - closure_type
  - connector
  - owner
properties:
  closure_type:
    $ref: 'closure_types.yaml'
  connector:
    description: An object that contains the connector configuration.
    type: object
    properties:
      $ref: 'case_configure_connector_properties.yaml'
    required:
      - fields
      - id
      - name
      - type
  customFields:
    type: array
    deprecated: true
    description: >
      Custom fields case configuration.
      Deprecated. Use the field library (`/api/cases/field_definitions`) to manage
      field definitions and `extended_fields` on case create/update to set field values.
    minItems: 0
    maxItems: 10
    items:
      type: object
      required:
        - key
        - label
        - required
        - type
      properties:
        $ref: 'case_configure_customfields.yaml'
  extractObservables:
    type: boolean
    description: >
      Indicates whether observables (for example, IPs, hashes, and URLs) are automatically extracted from case comments and events.
      When omitted, defaults to the owner's default: `true` for Security, `false` for Stack and Observability.
      Only Security can set this to `true`. For Stack and Observability, a request that sets this to `true`,
      in the configuration or in a template, fails with a 400 error.
  owner:
    $ref: 'owner.yaml'
  templates:
    $ref: 'templates.yaml'
  workflowTags:
    type: array
    description: >
      Workflow tags that limit which workflows appear in Cases workflow selectors.
      An empty array shows all workflows.
    maxItems: 100
    items:
      type: string
      minLength: 1
      maxLength: 1024
