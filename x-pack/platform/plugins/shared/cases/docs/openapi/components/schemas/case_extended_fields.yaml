title: Case extended fields
type: object
x-state: Technical preview; added in 9.5.0
description: >
  Case field values keyed by storage key. This replaces `customFields`. Keys follow the
  `<field_name>_as_<storage_type>` convention (for example `priority_as_keyword`) and map to
  the owner's global (library-wide) fields plus, when a template is applied to the case, that
  template's fields; any other key is rejected. On update, the keys provided are merged into
  the stored map; unlisted keys are left untouched. Legacy custom fields are migrated into
  this map, so a migrated field's value is found under its `<key>_as_<storage_type>` key.
  Requires the `xpack.cases.templates.enabled` setting (enabled by default); when disabled,
  field-library fields and templates are unavailable. To discover the writable keys, use the
  get case fields API (`GET /api/cases/fields`, or `GET /api/cases/{caseId}/fields` for an
  existing case).
maxProperties: 500
additionalProperties:
  type: string
  maxLength: 30000
example:
  priority_as_keyword: high
  ticket_number_as_integer: '4287'
  escalated_as_boolean: 'true'
