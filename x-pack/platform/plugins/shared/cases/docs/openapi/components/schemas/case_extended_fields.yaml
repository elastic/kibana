title: Case extended fields
type: object
x-state: Technical preview; added in 9.5.0
description: >
  Case field values keyed by storage key (for example, `priority_as_keyword`).
  Keys are validated against the fields exposed by the case's active template and global field library.
  On update, provided keys are merged into the stored map; unlisted keys are left untouched.
  Requires the `xpack.cases.templates.enabled` setting (enabled by default).
  Use the get case fields API to discover valid keys.
maxProperties: 500
additionalProperties:
  type: string
  maxLength: 30000
example:
  priority_as_keyword: high
  ticket_number_as_integer: '4287'
  escalated_as_boolean: 'true'
