title: Case extended fields
type: object
x-state: Technical preview; added in 9.5.0
description: >
  Case field values keyed by storage key. Keys follow the `<field_name>_as_<storage_type>`
  convention (for example `priority_as_keyword`) and map to the owner's global
  (library-wide) fields plus, when a template is applied to the case, that template's
  fields. On update, the keys provided are merged into the stored map; unlisted keys are
  left untouched. To discover the writable keys, use the get case fields API
  (`GET /api/cases/fields`).
maxProperties: 500
additionalProperties:
  type: string
  maxLength: 30000
