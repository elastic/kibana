title: Field definition response
description: >
  A field definition from the field library. The `legacyKey` attribute, which is a
  server-managed link to a migrated custom field, is not included in the public API response.
type: object
required:
  - fieldDefinitionId
  - name
  - definition
  - owner
properties:
  fieldDefinitionId:
    type: string
    maxLength: 36
    description: >
      Unique server-assigned identifier for the field definition (UUID). May be UUIDv4 for
      definitions created through the public API, or UUIDv5 for definitions created by internal
      migration processes.
  name:
    type: string
    description: >
      The field name. Must match the `name` property in the YAML definition and is unique per owner
      (case-insensitive). Immutable after creation.
  definition:
    type: string
    description: >
      The field definition as a YAML string. New definitions are limited to 30 000 characters, but
      existing definitions created via internal tooling may be longer.
  owner:
    type: string
    maxLength: 50
    description: The application that owns this field definition.
  description:
    type: string
    description: Optional human-readable description of the field's purpose.
  isGlobal:
    type: boolean
    description: >
      When true, this field is rendered in every case regardless of which template the case uses.
  displayOrder:
    type: integer
    minimum: 0
    description: >
      Position of a global field in the case details view. Assigned by the server and changed via
      the Field Library reorder controls.
