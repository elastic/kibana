openapi: 3.0.3
info:
  title: Task manager health Serverless APIs
  description: Kibana APIs for the task manager feature
  version: 1.0.0
  license:
    name: Elastic License 2.0
    url: https://www.elastic.co/licensing/elastic-license
tags:
  - name: task manager
    x-displayName: Task manager
    description: Task manager APIs enable you to check the health of the Kibana task manager, which is used by features such as alerting, actions, and reporting to run mission critical work as persistent background tasks.
    externalDocs:
      url: https://www.elastic.co/docs/deploy-manage/distributed-architecture/kibana-tasks-management
      description: Task manager
servers:
  - url: /
paths:
  /api/task_manager/_health:
    get:
      summary: Get the task manager health
      description: |
        Get the health status of the Kibana task manager.

        Per-task-type details are returned only to users with the `manage_taskManager` Kibana privilege (included in the `all` base privilege) or the `monitor` cluster privilege. For other users, fields keyed by task type, such as `workload.task_types`, `workload.schedule`, `runtime.drift_by_type`, and the per-type `runtime.execution` stats, are returned empty, so an empty value does not mean there are no tasks of that type.
      operationId: task-manager-health
      tags:
        - task manager
      responses:
        '200':
          description: Indicates a successful call
          content:
            application/json:
              schema:
                $ref: 'components/schemas/health_response_serverless.yaml'    
              examples:
                taskManagerHealthResponse1:
                  $ref: 'components/examples/health_200response_serverless.yaml'
