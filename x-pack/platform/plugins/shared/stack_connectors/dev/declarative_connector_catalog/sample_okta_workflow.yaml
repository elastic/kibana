name: Declarative Okta PoC
description: Runs catalog-loaded Okta actions against the local mock API.
triggers:
  - type: manual
steps:
  - name: list_users
    type: declarative-okta.listUsers
    connector-id: REPLACE_WITH_OKTA_CONNECTOR_ID
    with:
      limit: 2
  - name: get_logs
    type: declarative-okta.getLogs
    connector-id: REPLACE_WITH_OKTA_CONNECTOR_ID
    with:
      limit: 2
