name: Declarative AbuseIPDB PoC
description: Runs the catalog-loaded checkIp action against the local mock API.
triggers:
  - type: manual
inputs:
  - name: ip_address
    type: string
    required: true
steps:
  - name: check_ip
    type: declarative-abuseipdb.checkIp
    connector-id: REPLACE_WITH_ABUSEIPDB_CONNECTOR_ID
    with:
      ipAddress: "{{ inputs.ip_address }}"
      maxAgeInDays: 90
