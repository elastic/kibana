schemaVersion: 1
id: .declarative-abuseipdb
version: 1.0.0
metadata:
  displayName: AbuseIPDB (Declarative PoC)
  description: IP reputation checking and abuse reporting from a catalog-loaded YAML definition
  icon:
    path: 1.0.0.svg
    contentHash: sha256:c2ed2c5ebe15e0b513f760b11b0bdd149236d298f06612f468368901ce19e012
  minimumLicense: gold
  isTechnicalPreview: true
  supportedFeatureIds:
    - workflows
    - agentBuilder
config:
  type: object
  additionalProperties: false
  required:
    - baseUrl
  properties:
    baseUrl:
      type: string
      format: uri
      default: http://127.0.0.1:8090
      description: AbuseIPDB API base URL
      xUi:
        label: Base URL
        placeholder: https://api.abuseipdb.com
        helpText: Use the local mock URL for the PoC or https://api.abuseipdb.com for live testing.
        validate:
          allowedHosts: true
auth:
  type: api_key_header
  header: Key
  label: API key
  placeholder: local-poc-key
actions:
  checkIp:
    description: Check the reputation of an IPv4 address.
    isTool: true
    scope: read
    input:
      type: object
      additionalProperties: false
      required:
        - ipAddress
      properties:
        ipAddress:
          type: string
          format: ipv4
          description: IPv4 address to check
        maxAgeInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
          description: Maximum report age in days
    request:
      method: GET
      baseUrl: "{{ config.baseUrl }}"
      path: /api/v2/check
      query:
        ipAddress: "{{ input.ipAddress }}"
        maxAgeInDays: "{{ input.maxAgeInDays }}"
      retry:
        statusCodes:
          - 429
          - 503
        maxAttempts: 3
        initialDelayMs: 200
        maxDelayMs: 5000
      response:
        dataPath: data
        rateLimitHeaders:
          remaining: x-ratelimit-remaining
          reset: x-ratelimit-reset
  reportIp:
    description: Report an IPv4 address with one or more abuse categories.
    isTool: true
    scope: write
    input:
      type: object
      additionalProperties: false
      required:
        - ip
        - categories
      properties:
        ip:
          type: string
          format: ipv4
        categories:
          type: array
          items:
            type: integer
        comment:
          type: string
          maxLength: 1024
    request:
      method: POST
      baseUrl: "{{ config.baseUrl }}"
      path: /api/v2/report
      bodyType: form
      body:
        ip: "{{ input.ip }}"
        categories: "{{ input.categories }}"
        comment: "{{ input.comment }}"
      response:
        dataPath: data
test:
  description: Verify the API key with a bounded IP check.
  request:
    method: GET
    baseUrl: "{{ config.baseUrl }}"
    path: /api/v2/check
    query:
      ipAddress: 8.8.8.8
      maxAgeInDays: 1
    response:
      dataPath: data
