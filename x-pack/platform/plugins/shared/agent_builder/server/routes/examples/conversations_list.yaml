    description: "Indicates a successful response"
    content:
      application/json:
        examples:
          listConversationsResponseExample:
            description: "Example response returning the first page of conversations for all agents"
            value:
              pagination:
                total: 128
                page: 1
                per_page: 1000
              results:
              - id: bcc176c5-38f6-40be-be0c-898e34fa1480
                agent_id: elastic-ai-agent
                user:
                  username: elastic
                title: General Greeting
                permissions:
                  rename: true
                  delete: true
                created_at: "2025-09-19T17:45:39.554Z"
                updated_at: "2025-09-19T17:45:39.554Z"
          listConversationsPinnedExample:
            description: "Example response filtered to pinned conversations only"
