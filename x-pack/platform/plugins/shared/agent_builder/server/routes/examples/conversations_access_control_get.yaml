responses:
  200:
    description: "Indicates a successful response"
    content:
      application/json:
        examples:
          getConversationAccessControlResponseExample:
            description: "Example response for the conversation owner — the conversation is shared with two members."
            value:
              access_control:
                access_mode: private
                entries:
                  - type: user
                    id: u_kd2Wm6QCf9nBBqGGyfxBcQxIrgLLLLxbPHOTNHOTgWM_0
                    role: member
                    added_at: "2026-08-11T10:00:00.000Z"
                  - type: user
                    id: u_9xXGnqPB4mLTNhOlHMHXqYbGrGFOTuQIRWlqLpKq0dE_0
                    role: member
                    added_at: "2026-08-11T11:30:00.000Z"
              permissions:
                update_access_control: true
          getConversationAccessControlAsMemberResponseExample:
            description: "Example response for a member — the full member list is returned, but the member cannot change it."
            value:
              access_control:
                access_mode: private
                entries:
                  - type: user
                    id: u_kd2Wm6QCf9nBBqGGyfxBcQxIrgLLLLxbPHOTNHOTgWM_0
                    role: member
                    added_at: "2026-08-11T10:00:00.000Z"
                  - type: user
                    id: u_9xXGnqPB4mLTNhOlHMHXqYbGrGFOTuQIRWlqLpKq0dE_0
                    role: member
                    added_at: "2026-08-11T11:30:00.000Z"
              permissions:
                update_access_control: false
  404:
    description: "Not Found — no conversation with this ID is readable by the caller, either because it is not shared with them or because they lost access to its agent. Matches the existing `conversationNotFound` shape, so callers cannot probe for hidden conversations."
    content:
      application/json:
        examples:
          conversationNotFoundResponseExample:
            value:
              statusCode: 404
              error: "Not Found"
              message: "Conversation my-conversation-id not found"
              attributes:
                trace_id: "8d4f2a3b-1c5e-4a9b-9f0d-2e6c1a3d4f5e"
x-codeSamples:
  - lang: curl
    source: |
      curl \
        -X GET "${KIBANA_URL}/api/agent_builder/conversations/{conversation_id}/access_control" \
        -H "Authorization: ApiKey ${API_KEY}"
  - lang: Console
    source: |
      GET kbn://api/agent_builder/conversations/{conversation_id}/access_control
