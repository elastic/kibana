openapi: 3.0.3
info:
  title: Automatic Import Integrations API endpoint
  version: "1"
paths:
  /internal/automatic_import/integrations/{integration_id}/data_streams/{data_stream_id}:
    patch:
      summary: Updates ingest pipeline for a data stream.
      operationId: UpdateDataStreamPipeline
      x-codegen-enabled: true
      x-internal: true
      description: >-
        Updates the ingest pipeline for an existing data stream, simulates it using stored samples, and returns refreshed results.
      tags:
        - Automatic Import Integrations
      parameters:
        - name: integration_id
          in: path
          required: true
          description: The integration identifier
          schema:
            $ref: "../../../model/primitive.schema.yaml#/components/schemas/SafeIdentifier"
        - name: data_stream_id
          in: path
          required: true
          description: The data stream identifier
          schema:
            $ref: "../../../model/primitive.schema.yaml#/components/schemas/SafeIdentifier"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ingest_pipeline
                - version
              properties:
                ingest_pipeline:
                  description: >-
                    JSON string (max 10MiB) or pipeline object. When an object, `processors` is capped at 10000 entries.
                  oneOf:
                    - type: string
                      maxLength: 10485760
                    - type: object
                      additionalProperties: true
                      properties:
                        processors:
                          type: array
                          maxItems: 10000
                          items:
                            type: object
                            additionalProperties: true
                version:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: Saved Object version returned by the latest results request.
      responses:
        200:
          description: The updated data stream results are returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataStreamResults"
        400:
          description: The pipeline is invalid or samples are missing.
        404:
          description: Indicates the data stream id was not found.
        500:
          description: An internal server error occurred.
    delete:
      summary: Deletes a data stream by its id.
      operationId: DeleteDataStream
      x-codegen-enabled: true
      x-internal: true
      description: >-
        Deletes a data stream by its id.
      tags:
        - Automatic Import Integrations
      parameters:
        - name: integration_id
          in: path
          required: true
          description: The integration identifier
          schema:
            $ref: "../../../model/primitive.schema.yaml#/components/schemas/SafeIdentifier"
        - name: data_stream_id
          in: path
          required: true
          description: The data stream identifier
          schema:
            $ref: "../../../model/primitive.schema.yaml#/components/schemas/SafeIdentifier"
      responses:
        200:
          description: The data stream is deleted successfully.
        404:
          description: The data stream is not found.
        500:
          description: An internal server error occurred.
  /internal/automatic_import/integrations/{integration_id}/data_streams/{data_stream_id}/upload:
    post:
      summary: Uploads samples to a data stream.
      operationId: UploadSamplesToDataStream
      x-codegen-enabled: true
      x-internal: true
      description: >-
        Uploads samples to a data stream.
      tags:
        - Automatic Import Integrations
      parameters:
        - name: integration_id
          in: path
          required: true
          description: The integration identifier
          schema:
            $ref: "../../../model/primitive.schema.yaml#/components/schemas/SafeIdentifier"
        - name: data_stream_id
          in: path
          required: true
          description: The data stream identifier
          schema:
            $ref: "../../../model/primitive.schema.yaml#/components/schemas/SafeIdentifier"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - originalSource
              properties:
                samples:
                  type: array
                  maxItems: 1000
                  description: >-
                    Log lines to upload when the source is a file (omit when using sourceIndex).
                  items:
                    type: string
                    maxLength: 100000
                sourceIndex:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Index name to pick samples from.
                originalSource:
                  description: The original source of the samples (file name or index name)
                  $ref: "../../../model/common_attributes.schema.yaml#/components/schemas/OriginalSource"
                langSmithOptions:
                  description: The LangSmith tracing options
                  $ref: "../../../model/common_attributes.schema.yaml#/components/schemas/LangSmithOptions"
      responses:
        200:
          description: The samples are uploaded successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    description: Indicates if the samples are uploaded successfully.
        400:
          description: The request is invalid.
        500:
          description: An internal server error occurred.
  /internal/automatic_import/integrations/{integration_id}/data_streams/{data_stream_id}/stop:
    post:
      summary: Stops a data stream by its id.
      operationId: StopAutoImportDataStream
      x-codegen-enabled: true
      x-internal: true
      description: >-
        Stops a data stream by its id.
      tags:
        - Automatic Import Integrations
      parameters:
        - name: integration_id
          in: path
          required: true
          description: The integration identifier
          schema:
            $ref: "../../../model/primitive.schema.yaml#/components/schemas/SafeIdentifier"
        - name: data_stream_id
          in: path
          required: true
          description: The data stream identifier
          schema:
            $ref: "../../../model/primitive.schema.yaml#/components/schemas/SafeIdentifier"
      responses:
        200:
          description: The data stream is stopped.
        404:
          description: The data stream is not found.
  /internal/automatic_import/integrations/{integration_id}/data_streams/{data_stream_id}/results:
    get:
      summary: Retrieves results for a data stream.
      operationId: GetDataStreamResults
      x-codegen-enabled: true
      x-internal: true
      description: >-
        Retrieves the ingest pipeline and results for a data stream if processing is completed.
      tags:
        - Automatic Import Integrations
      parameters:
        - name: integration_id
          in: path
          required: true
          description: The integration identifier
          schema:
            $ref: "../../../model/primitive.schema.yaml#/components/schemas/SafeIdentifier"
        - name: data_stream_id
          in: path
          required: true
          description: The data stream identifier
          schema:
            $ref: "../../../model/primitive.schema.yaml#/components/schemas/SafeIdentifier"
      responses:
        200:
          description: The data stream results are returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataStreamResults"
        400:
          description: The data stream has not completed successfully.
        404:
          description: Indicates the data stream id was not found.
        500:
          description: An internal server error occurred.
  /internal/automatic_import/integrations/{integration_id}/data_streams/{data_stream_id}/field_types:
    put:
      summary: Updates field types for a data stream.
      operationId: UpdateDataStreamFieldTypes
      x-codegen-enabled: true
      x-internal: true
      description: >-
        Applies conservative compatibility guardrails to stored samples and saves mapping overrides
        without modifying the user-authored ingest pipeline.
      tags:
        - Automatic Import Integrations
      parameters:
        - name: integration_id
          in: path
          required: true
          description: The integration identifier
          schema:
            $ref: "../../../model/primitive.schema.yaml#/components/schemas/SafeIdentifier"
        - name: data_stream_id
          in: path
          required: true
          description: The data stream identifier
          schema:
            $ref: "../../../model/primitive.schema.yaml#/components/schemas/SafeIdentifier"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - changes
                - version
              properties:
                changes:
                  description: Field type changes. Setting a field back to its original type removes the change.
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/FieldTypeChange"
                version:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: Saved Object version returned by the latest results request.
      responses:
        200:
          description: The field types were saved, or the failing fields are returned.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/UpdateFieldTypesSavedResponse"
                  - $ref: "#/components/schemas/UpdateFieldTypesFailureResponse"
        400:
          description: The request is invalid or samples are missing.
        409:
          description: The data stream is part of the last approved package and its field types are locked.
        500:
          description: An internal server error occurred.
  /internal/automatic_import/integrations/{integration_id}/data_streams/{data_stream_id}/reanalyze:
    put:
      summary: Re-runs the analysis workflow for an existing data stream.
      operationId: ReanalyzeDataStream
      x-codegen-enabled: true
      x-internal: true
      description: >-
        Re-runs the analysis workflow for an existing data stream. Old result are removed. This resets the data stream status to pending and schedules a new analysis task.
      tags:
        - Automatic Import Integrations
      parameters:
        - name: integration_id
          in: path
          required: true
          description: The integration identifier
          schema:
            $ref: "../../../model/primitive.schema.yaml#/components/schemas/SafeIdentifier"
        - name: data_stream_id
          in: path
          required: true
          description: The data stream identifier
          schema:
            $ref: "../../../model/primitive.schema.yaml#/components/schemas/SafeIdentifier"
      requestBody:
        required: true
        additionalProperties: false
        content:
          application/json:
            schema:
              type: object
              required:
                - connectorId
              properties:
                connectorId:
                  description: The inference connector ID to use for the reanalysis task.
                  $ref: "../../../model/primitive.schema.yaml#/components/schemas/NonEmptyString"
                langSmithOptions:
                  description: The LangSmith tracing options
                  $ref: "../../../model/common_attributes.schema.yaml#/components/schemas/LangSmithOptions"
      responses:
        200:
          description: The data stream reanalysis has been scheduled successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    description: Indicates if the reanalysis was scheduled successfully.
        400:
          description: The request is invalid.
        404:
          description: The data stream is not found.
        500:
          description: An internal server error occurred.
components:
  schemas:
    FieldMapping:
      type: object
      additionalProperties: false
      required:
        - name
        - type
        - is_ecs
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
        type:
          type: string
          minLength: 1
          maxLength: 1024
        is_ecs:
          type: boolean
    FieldTypeOverride:
      type: object
      additionalProperties: false
      required:
        - name
        - type
        - original_type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
        type:
          $ref: "#/components/schemas/SupportedFieldType"
        original_type:
          type: string
          minLength: 1
          maxLength: 1024
    DataStreamResults:
      type: object
      additionalProperties: false
      required:
        - ingest_pipeline
        - results
        - field_mapping
        - field_type_overrides
        - version
      properties:
        ingest_pipeline:
          type: object
          additionalProperties: true
        results:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: true
        field_mapping:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/FieldMapping"
        field_type_overrides:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/FieldTypeOverride"
        version:
          type: string
          minLength: 1
          maxLength: 1024
    UpdateFieldTypesSavedResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - ingest_pipeline
        - results
        - field_mapping
        - field_type_overrides
        - version
      properties:
        status:
          type: string
          enum:
            - saved
        ingest_pipeline:
          type: object
          additionalProperties: true
        results:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: true
        field_mapping:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/FieldMapping"
        field_type_overrides:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/FieldTypeOverride"
        version:
          type: string
          minLength: 1
          maxLength: 1024
    UpdateFieldTypesFailureResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - errors
      properties:
        status:
          type: string
          enum:
            - failure
        errors:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/FieldTypeError"
    SupportedFieldType:
      type: string
      description: A field type that can be chosen in the mapping editor.
      enum:
        - keyword
        - constant_keyword
        - wildcard
        - text
        - match_only_text
        - byte
        - short
        - integer
        - long
        - unsigned_long
        - half_float
        - float
        - double
        - date
        - date_nanos
        - boolean
        - ip
        - version
    FieldTypeChange:
      type: object
      additionalProperties: false
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
        type:
          type: string
          minLength: 1
          maxLength: 1024
          description: >-
            The new field type, or the field's original type to remove the change.
            Original types that are not in SupportedFieldType are allowed only as a revert.
    FieldTypeError:
      type: object
      additionalProperties: false
      required:
        - name
        - failing_documents
        - total_documents
      properties:
        name:
          type: string
        issue:
          type: string
          description: A known rule that failed, such as out_of_range or object_value.
        failing_documents:
          type: integer
        total_documents:
          type: integer
