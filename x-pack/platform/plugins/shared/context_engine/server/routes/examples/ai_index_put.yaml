requestBody:
  content:
    application/json:
      examples:
        putAiIndexRequestExample:
          description: "Example request to create or fully replace an AI Index"
          value:
            description: Knowledge about customer support cases.
            dest:
              type: data_stream
              value: ai-index-ds-customer-support
            automations:
              - type: workflow
                value: 8f1c2d3e-4b5a-6c7d-8e9f-0a1b2c3d4e5f
            sources:
              - type: esql
                value: FROM support-cases | LIMIT 100
            traces: []
responses:
  200:
    content:
      application/json:
        examples:
          putAiIndexUpdatedExample:
            description: "Example response after an existing AI Index is replaced"
            value:
              status: updated
  201:
    content:
      application/json:
        examples:
          putAiIndexCreatedExample:
            description: "Example response after a new AI Index is created"
            value:
              status: created
  400:
    content:
      application/json:
        examples:
          invalidDestExample:
            description: "The dest value does not follow the naming convention"
            value:
              statusCode: 400
              error: Bad Request
              message: "dest.value 'support-cases' is not allowed: it must start with 'ai-index-ds-'"
  409:
    content:
      application/json:
        examples:
          managedExample:
            description: "The AI Index is managed by a plugin and cannot be replaced"
            value:
              statusCode: 409
              error: Conflict
              message: "AI index 'customer_support' is managed and cannot be modified via the API"
x-codeSamples:
  - lang: curl
    source: |
      curl \
        -X PUT "https://${KIBANA_URL}/api/context_engine/ai_index/customer_support" \
        -H "Authorization: ApiKey ${API_KEY}" \
        -H "kbn-xsrf: true" \
        -H "Content-Type: application/json" \
        -d '{
          "description": "Knowledge about customer support cases.",
          "dest": { "type": "data_stream", "value": "ai-index-ds-customer-support" },
          "automations": [{ "type": "workflow", "value": "8f1c2d3e-4b5a-6c7d-8e9f-0a1b2c3d4e5f" }],
          "sources": [{ "type": "esql", "value": "FROM support-cases | LIMIT 100" }],
          "traces": []
        }'
  - lang: Console
    source: |
      PUT kbn:/api/context_engine/ai_index/customer_support
      {
        "description": "Knowledge about customer support cases.",
        "dest": { "type": "data_stream", "value": "ai-index-ds-customer-support" },
        "automations": [{ "type": "workflow", "value": "8f1c2d3e-4b5a-6c7d-8e9f-0a1b2c3d4e5f" }],
        "sources": [{ "type": "esql", "value": "FROM support-cases | LIMIT 100" }],
        "traces": []
      }
