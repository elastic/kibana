requestBody:
  content:
    application/json:
      examples:
        createAiIndexRequestExample:
          description: "Example request to create an AI Index attached to a data stream"
          value:
            id: customer_support
            description: Knowledge about customer support cases.
            dest:
              type: data_stream
              value: ai-index-ds-customer-support
            automations:
              - type: workflow
                value: 8f1c2d3e-4b5a-6c7d-8e9f-0a1b2c3d4e5f
            sources:
              - type: esql
                value: FROM support-cases | LIMIT 100
            traces:
              - type: elastic_agent
                value: elastic-ai-agent
responses:
  201:
    content:
      application/json:
        examples:
          createAiIndexResponseExample:
            description: "Example response after the AI Index is created"
            value:
              status: created
  400:
    content:
      application/json:
        examples:
          invalidDestExample:
            description: "The dest value does not follow the naming convention"
            value:
              statusCode: 400
              error: Bad Request
              message: "dest.value 'support-cases' is not allowed: it must start with 'ai-index-ds-'"
  409:
    content:
      application/json:
        examples:
          alreadyExistsExample:
            description: "An AI Index with the same id already exists"
            value:
              statusCode: 409
              error: Conflict
              message: "AI index 'customer_support' already exists"
x-codeSamples:
  - lang: curl
    source: |
      curl \
        -X POST "https://${KIBANA_URL}/api/context_engine/ai_index" \
        -H "Authorization: ApiKey ${API_KEY}" \
        -H "kbn-xsrf: true" \
        -H "Content-Type: application/json" \
        -d '{
          "id": "customer_support",
          "description": "Knowledge about customer support cases.",
          "dest": { "type": "data_stream", "value": "ai-index-ds-customer-support" },
          "automations": [{ "type": "workflow", "value": "8f1c2d3e-4b5a-6c7d-8e9f-0a1b2c3d4e5f" }],
          "sources": [{ "type": "esql", "value": "FROM support-cases | LIMIT 100" }],
          "traces": [{ "type": "elastic_agent", "value": "elastic-ai-agent" }]
        }'
  - lang: Console
    source: |
      POST kbn:/api/context_engine/ai_index
      {
        "id": "customer_support",
        "description": "Knowledge about customer support cases.",
        "dest": { "type": "data_stream", "value": "ai-index-ds-customer-support" },
        "automations": [{ "type": "workflow", "value": "8f1c2d3e-4b5a-6c7d-8e9f-0a1b2c3d4e5f" }],
        "sources": [{ "type": "esql", "value": "FROM support-cases | LIMIT 100" }],
        "traces": [{ "type": "elastic_agent", "value": "elastic-ai-agent" }]
      }
