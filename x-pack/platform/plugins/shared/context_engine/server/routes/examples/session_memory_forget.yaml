requestBody:
  content:
    application/json:
      examples:
        forgetRequestExample:
          summary: "Forget memories"
          description: "Example request to forget two of the caller's memories, keeping their revisions until retention removes them"
          value:
            ids:
              - 7c1f0b2e-5a43-4b0e-9a57-2f0f6f1d3a10
              - 0d4e8a91-6c2b-4f3a-8d15-9b7e1c5a2f44
responses:
  200:
    content:
      application/json:
        examples:
          forgetResponseExample:
            summary: "Memories forgotten"
            description: "One memory was forgotten, and the other does not exist for this user"
            value:
              results:
                - id: 7c1f0b2e-5a43-4b0e-9a57-2f0f6f1d3a10
                  outcome: forgotten
                - id: 0d4e8a91-6c2b-4f3a-8d15-9b7e1c5a2f44
                  outcome: not_found
          failedForgetResponseExample:
            summary: "Failed to forget a memory"
            description: "One memory was forgotten and Elasticsearch rejected the other tombstone"
            value:
              results:
                - id: 7c1f0b2e-5a43-4b0e-9a57-2f0f6f1d3a10
                  outcome: forgotten
                - id: 0d4e8a91-6c2b-4f3a-8d15-9b7e1c5a2f44
                  outcome: failed
                  error: "index [.ds-.context-engine-session-memory-2026.11.16-000001] blocked by: [TOO_MANY_REQUESTS/12/disk usage exceeded flood-stage watermark, index has read-only-allow-delete block];"
  403:
    content:
      application/json:
        examples:
          manageMemoryRequiredExample:
            summary: "Missing manage memory privilege"
            description: "The request names another user in `user_id` and the caller lacks the manage memory privilege"
            value:
              statusCode: 403
              error: Forbidden
              message: "Acting on the memory of another user requires the [contextEngine:manage_memory] privilege."
          noUserProfileExample:
            summary: "No user profile"
            description: "`user_id` is missing and the caller has no user profile"
            value:
              statusCode: 403
              error: Forbidden
              message: The caller has no user profile, so the request cannot be attributed to a user. Set `user_id`, log in to Kibana once to create a profile, or use an API key whose owner has one.
  404:
    content:
      application/json:
        examples:
          contextEngineDisabledExample:
            summary: "Context Engine turned off"
            description: "Context Engine is turned off in this space"
            value:
              statusCode: 404
              error: Not Found
              message: Not Found
x-codeSamples:
  - lang: curl
    source: |
      curl \
        -X POST "https://${KIBANA_URL}/api/context_engine/memory/_forget" \
        -H "Authorization: ApiKey ${API_KEY}" \
        -H "Content-Type: application/json" \
        -H "kbn-xsrf: true" \
        -d '{
          "ids": ["7c1f0b2e-5a43-4b0e-9a57-2f0f6f1d3a10", "0d4e8a91-6c2b-4f3a-8d15-9b7e1c5a2f44"]
        }'
  - lang: Console
    source: |
      POST kbn:/api/context_engine/memory/_forget
      {
        "ids": ["7c1f0b2e-5a43-4b0e-9a57-2f0f6f1d3a10", "0d4e8a91-6c2b-4f3a-8d15-9b7e1c5a2f44"]
      }
