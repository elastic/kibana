responses:
  200:
    content:
      application/json:
        examples:
          getAiIndexDreamingResponseExample:
            summary: "Dreaming configuration"
            description: "Example response returning the dreaming configuration of an AI Index"
            value:
              dreaming:
                enabled: true
                schedule:
                  interval: 24h
                instructions: Record confirmed fixes, known issues and policies from support tickets.
                facts:
                  - type: known_issue
                    description: A problem confirmed to affect customers, with where it happens.
                  - type: workaround
                    description: A confirmed way around a problem until it is fixed.
                procedures:
                  - type: troubleshooting
                    description: How to diagnose and fix a problem customers report, step by step.
                entities:
                  nodes:
                    - type: issue
                      description: A known problem customers run into.
                      attributes:
                        - status
                        - fixed_in
                    - type: platform
                      description: A browser, operating system or device, with its version.
          getAiIndexDreamingNeverConfiguredExample:
            summary: "Dreaming never configured"
            description: "An AI Index that never configured dreaming"
            value:
              dreaming:
                enabled: false
  404:
    content:
      application/json:
        examples:
          notFoundExample:
            summary: "AI Index not found"
            description: "No AI Index with the given ID exists in the current space"
            value:
              statusCode: 404
              error: Not Found
              message: "AI index 'customer_support' not found"
          contextEngineDisabledExample:
            summary: "Context Engine turned off"
            description: "Context Engine is turned off in this space"
            value:
              statusCode: 404
              error: Not Found
              message: Not Found
x-codeSamples:
  - lang: curl
    source: |
      curl \
        -X GET "https://${KIBANA_URL}/api/context_engine/ai_index/customer_support/_dreaming" \
        -H "Authorization: ApiKey ${API_KEY}"
  - lang: Console
    source: |
      GET kbn:/api/context_engine/ai_index/customer_support/_dreaming
