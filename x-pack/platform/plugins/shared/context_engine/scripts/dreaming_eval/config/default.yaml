# Dreaming eval: which datasets to import as Agent Builder traces, and the AI indices that dream
# over them. Copy this file and pass it with --config to try other AI indices or dreaming configs.

space: default
data_dir: data/context_engine_dreaming_eval
# traces_index: traces-agent_builder.otel-default
schedule_interval: 7d

# The datasets to evaluate (--dataset overrides it): the stages work on the AI indices below that
# dream on only these.
run_datasets: [longmemeval_s]

# A sample is a question with the conversations it is asked over (its haystack). Per dataset, the
# listed `samples` (question ids) run; else those of the `preset`; else every sample with
# `all_samples: true`; else the first `sample_count`. --samples, --preset, --sample-count and
# --all-samples override these.
datasets:
  # Personal assistant chats (https://github.com/xiaowu0162/LongMemEval). Each question has its
  # own haystack of about 50 sessions, about 250 rounds.
  longmemeval_s:
    agent: { id: longmemeval-assistant, name: Personal assistant }
    # Haystack size, the same questions in each: s (about 50 sessions a question, 277 MB), m (about
    # 500, 2.7 GB, read as a stream) or oracle (only the sessions that hold the answer). --variant.
    variant: s
    samples: []
    # preset: dev
    presets:
      # Fixed questions across the 6 question types, so runs across the team compare.
      dev:
        - e47becba # single-session-user: What degree did I graduate with?
        - 118b2229 # single-session-user: How long is my daily commute to work?
        - 7161e7e2 # single-session-assistant: the shift rotation sheet for GM social media agents
        - 8a2466db # single-session-preference: resources to learn more about video editing
        - 0a995998 # multi-session: How many items of clothing do I need to pick up or return?
        - 6d550036 # multi-session: How many projects have I led or am currently leading?
