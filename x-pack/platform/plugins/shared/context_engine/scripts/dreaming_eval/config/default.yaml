    sample_count: 1
    all_samples: false
    # Runs each sample on its own: its sessions, a clean AI index, and a KI dump per sample.
    per_sample: true
    include_abstention: false
    # haystack: every session of each sample. answers: only those that hold the answer, and
    # distractor_sessions more per sample, for a quicker run.
    sessions: haystack
    distractor_sessions: 1

  # LongMemEval-V2 (https://github.com/xiaowu0162/LongMemEval-V2): a web agent's task trajectories,
  # one dataset per domain. haystack: small (all questions of a domain share one haystack of 100
  # trajectories, so by default every sample runs, on that one) or medium (each question has its
  # own haystack of about 500, so by default one sample runs, on its own; per_sample). The
  # trajectories file (1.2 GB) is downloaded once, for both domains.
  #
  # ServiceNow (WorkArena): 211 questions.
  longmemeval_v2_enterprise:
    agent: { id: workarena-agent, name: ServiceNow agent }
    samples: []
    presets:
      # Fixed questions across the 3 text question types (4 static-environment, 3 dynamic-environment,
      # 3 procedure), so runs across the team compare.
      dev:
        - c0593d69 # static-environment: Create Change Request vs Problem vs Incident vs Hardware v…
        - a7edfb7a # static-environment: Create Change Request vs Problem vs Incident. What is the…
        - 9680f077 # static-environment: Create Change Request vs Hardware. In both forms -- hardwa…
        - c80ca967 # static-environment: On the `Sales Laptop` item page under `Service Catalog > H…
        - d83c4bf7 # dynamic-environment: I am working with our ServiceNow portal while creating a…
        - 7ea13f14 # dynamic-environment: When marking a problem as duplicate, a popup appears to c…
        - 78686f4e # dynamic-environment: When we remove a user record, which option exactly matche…
        - 025db8ef # procedure: My boss asked me to rebalance workload between several agents by re…
        - eb3cfd03 # procedure: In our company's typical workflow, what are the modules we need to…
        - d63e8a7f # procedure: My boss asks me to onboard a new user. After creating the new user…
    sample_count: 1
    # all_samples: true     # default: true for small, false for medium
    # per_sample: false     # default: false for small, true for medium
    haystack: small
    # max_trajectories: 20  # per sample's haystack
    # Pages are kept whole; this cuts each to its first characters, for a cheaper run.
    # max_observation_chars: 600
    include_abstention: false
    # Every errors-gotchas question has a screenshot, so the category runs only with this set; the
    # answers are text, and the agent gets only the question text.
    include_image_questions: false
    start_time: '2026-01-05T09:00:00.000Z'

  # WebArena sites: a Postmill forum (webarena-reddit, 91 questions), a Magento admin (webarena-cms,
  # 83) and a Magento shop (webarena-onestopshop, 66). One haystack holds the trajectories of all
  # three; environments picks the questions of some of them.
  longmemeval_v2_web:
    agent: { id: webarena-agent, name: Web agent }
    samples: []
    sample_count: 1
    haystack: small
    environments: []        # such as [webarena-reddit]
    # max_observation_chars: 600
    include_abstention: false
    include_image_questions: false
    start_time: '2026-01-05T09:00:00.000Z'

# The ask stage puts each target's question to the AI index's answer agent and judges the answers.
# It runs when named with --stage, or with the other stages when enabled here.
ask:
  enabled: false
  # connector_id: .anthropic-claude-4.6-sonnet-chat_completion   # what the agents answer with
  concurrency: 2

# The reference stage writes each AI index's conversations as transcripts, and prompts for a coding
# agent (such as Claude Code) to write the memories dreaming should produce from them, to
# <data_dir>/references/<AI index id> unless the AI index sets references: <folder>.
reference:
  # Lines each prompt starts with, such as the coding agent's model and effort commands.
  prompt_prefix: ['/model fable', '/effort ultra']

# The compare stage matches a run's KIs against those reference memories, by code: no LLM. It runs
# when named with --stage, or with the other stages when enabled here.
compare:
  enabled: false
  fact_threshold: 0.5    # keywords (0.6 of the score) and wording (0.4)
  entity_threshold: 0.6  # name or alias: 1 when equal, 0.8 when one is within the other

# Each AI index also gets an answer agent (answer_agent), which the configure stage creates: it has
# only this AI index, the AI index tools, and instructions to answer from it. Set
# answer_agent: { enabled: false } to skip it, or give it an id, instructions or tools of its own.
ai_indices:
  - id: dreaming-eval-longmemeval
    description: What a personal assistant learned about its user, from LongMemEval chats.
    datasets: [longmemeval_s]
    dreaming:
      template: personal_assistant
    # targets: [x-pack/platform/plugins/shared/context_engine/scripts/dreaming_eval/targets/longmemeval_s.json]

  - id: dreaming-eval-workarena
    description: How the company's ServiceNow portal works, from the runs of an agent working in it.
    datasets: [longmemeval_v2_enterprise]
    dreaming:
      instructions: |-
        An agent works in the company's ServiceNow portal: it orders catalog items, assigns and closes incidents and problems, and follows company protocols. Record what a colleague would need to know to do the same work: the steps that complete each recurring task, where things are in the portal, the values records and catalog items have, the company's rules, and what goes wrong and how to avoid it. Keep exact module, page, field, button and option names, and exact prices and numbers.

        Learn from failed runs as well as successful ones: a step that failed is a gotcha, and what worked instead is the procedure.

        Skip:
        - Record numbers and agent names that only matter to one task.
        - Page layout details that are the same on every page, such as the navigation bar.
      facts:
        - type: procedure
          description: The steps or modules that complete a recurring task, such as "reassign problems by tag through Reports, then Problems".
        - type: gotcha
          description: Something that goes wrong in this portal and how to avoid it, such as "the global search needs Enter to show full results".
        - type: ui_location
          description: Where something is in the portal, such as "the Filters dropdown on the Incidents list holds My Open Incidents".
        - type: record_value
          description: A value of a record or catalog item, such as "a Dell XPS developer laptop costs $300 more with the largest SSD".
        - type: company_rule
          description: A rule from a company protocol, such as "incidents are assigned to network or software agents by category".
      entities:
        nodes:
          - type: module
            description: A ServiceNow application or module, such as Incidents, Problems, Reports or Service Catalog.
          - type: page
            description: A list, form or dashboard page in the portal.
            attributes: [module]
          - type: catalog_item
            description: Something that can be ordered from the service catalog.
            attributes: [base_price]
          - type: protocol
            description: A company protocol document that describes how a task is done.
      relationships:
        - type: part_of
          description: A page is part of a module.
        - type: uses
          description: A protocol uses a module or page.

  - id: dreaming-eval-webarena
    description: How three websites work (a forum, a shop and its admin), from the runs of an agent working in them.
    datasets: [longmemeval_v2_web]
    dreaming:
      instructions: |-
        An agent works in three websites: a Postmill forum (like Reddit), a Magento online shop, and the shop's Magento admin. It posts, votes and moderates on the forum, finds and buys products in the shop, and looks up orders, customers, products and reports in the admin. Record what a colleague would need to know to do the same work: the steps that complete each recurring task, where things are on each site, the values the sites hold (forums and their users, products and their prices, orders, customers, report figures), and what goes wrong and how to avoid it. Keep exact site, page, menu, field, button, filter and option names, and exact names, prices and numbers.

        Learn from failed runs as well as successful ones: a step that failed is a gotcha, and what worked instead is the procedure.

        Skip:
        - Ids and values that only matter to one task.
        - Page layout details that are the same on every page, such as the navigation bar.
      facts:
        - type: procedure
          description: The steps or pages that complete a recurring task, such as "find a customer's orders under Sales, then Orders, filtered by email".
        - type: gotcha
          description: Something that goes wrong on a site and how to avoid it, such as "the shop search needs the exact product name".
        - type: ui_location
          description: Where something is on a site, such as "the forum's Sort by menu holds Top, New and Hot".
        - type: site_value
          description: A value a site holds, such as "the Bluetooth speaker costs $24.99 in the shop".
      entities:
        nodes:
          - type: site
            description: One of the websites, such as the forum, the shop or the admin.
          - type: page
            description: A page or section of a site.
            attributes: [site]
          - type: forum
            description: A forum (subreddit) of the Postmill site.
          - type: product
            description: A product the shop sells.
            attributes: [price]
      relationships:
        - type: part_of
          description: A page or forum is part of a site.
