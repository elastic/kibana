responses:
  200:
    description: Indicates a successful response.
    content:
      application/json:
        examples:
          disableSuccessExample:
            summary: History snapshot task disabled
            description: The Entity Store history snapshot task was disabled.
            value:
              ok: true
  404:
    description: Entity store is not installed.
    content:
      application/json:
        examples:
          notInstalledExample:
            summary: Entity store not installed
            description: The Entity Store history snapshot task cannot be disabled because the entity store is not installed.
            value:
              statusCode: 404
              error: Not Found
              message: Entity store is not installed
x-codeSamples:
  - lang: curl
    source: |
      curl -X PUT -H "kbn-xsrf: true" -H "Authorization: ApiKey ${API_KEY}" \
        "${KIBANA_URL}/api/security/entity_store/history_snapshot/disable"
  - lang: Console
    source: |
      PUT kbn://api/security/entity_store/history_snapshot/disable
