responses:
  '200':
    description: Entity resolution rules.
    content:
      application/json:
        examples:
          rulesListExample:
            summary: Managed resolution rules
            description: Lists the managed resolution rules and their enabled state in the current space.
            value:
              rules:
                - id: email_exact_match
                  kind: same_field
                  description: Links user entities that share the same email address, compared case-insensitively, across identity providers. Disable if shared mailboxes or role accounts produce false links.
                  managed: true
                  enabled: true
                - id: windows_sid_bridge
                  kind: same_field
                  description: Links local Windows and CrowdStrike endpoint user entities to Active Directory by SID (`user.id`), excluding well-known SIDs such as LocalSystem and Linux numeric UIDs. Needs Windows or CrowdStrike endpoint events (which create `local` user entities) and Active Directory entity analytics. Several `local` entities sharing one domain SID are treated as one account. Disable if well-known SID exclusions are not enough for your environment.
                  managed: true
                  enabled: true
                - id: entra_guid_bridge
                  kind: same_field
                  description: Links Microsoft Defender (`m365_defender`) identities to Entra ID by GUID-shaped `user.id`. Needs Defender identity events and Entra entity analytics. Disable if Defender SID IAM events leak through the GUID gate.
                  managed: true
                  enabled: true
                - id: upn_cross_field_bridge
                  kind: cross_field
                  description: "Links Microsoft 365 audit actors (`user.id` UPN) to Entra users (`user.name` UPN), compared case-insensitively. Needs o365 audit events that create user entities (`event.kind: asset`) and Entra entity analytics. Disabled by default because those events currently do not create entities; enable if your environment emits them as asset events."
                  managed: true
                  enabled: false
                - id: related_user_alias_resolution
                  kind: related_user_alias_resolution
                  description: Related user alias resolution across identity providers
                  managed: true
                  enabled: false
