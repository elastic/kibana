responses:
  200:
    description: "Indicates a successful response."
    content:
      application/json:
        examples:
          runningStatusExample:
            summary: "Entity Store running"
            description: "The Entity Store is running with three started engines using default settings. Each engine reports the log extraction settings for its entity type, so the default frequency is 1m for host and user, and 10m for service."
            value:
              status: running
              engines:
                - type: host
                  status: started
                  filter: ""
                  delay: "1m"
                  timeout: "59s"
                  frequency: "1m"
                  lookbackPeriod: "3h"
                  fieldHistoryLength: 10
                  maxLogsPerPage: 50000
                  maxTimeWindowSize: "15m"
                  maxLogsPerWindow: 100000
                  maxLogsPerWindowCapBehavior: "drop"
                  docsPerSecond: -1
                  indexPattern: ""
                  enrichPolicyExecutionInterval: null
                  timestampField: "@timestamp"
                  maxPageSearchSize: 10000
                  lastExecutionTimestamp: "2026-04-10T08:30:00.000Z"
                - type: user
                  status: started
                  filter: ""
                  delay: "1m"
                  timeout: "59s"
                  frequency: "1m"
                  lookbackPeriod: "3h"
                  fieldHistoryLength: 10
                  maxLogsPerPage: 50000
                  maxTimeWindowSize: "15m"
                  maxLogsPerWindow: 100000
                  maxLogsPerWindowCapBehavior: "defer"
                  docsPerSecond: -1
                  indexPattern: ""
                  enrichPolicyExecutionInterval: null
                  timestampField: "@timestamp"
                  maxPageSearchSize: 10000
                  lastExecutionTimestamp: "2026-04-10T08:30:00.000Z"
                  nonPriority:
                    status: started
                    error: null
                    lastExecutionTimestamp: "2026-04-10T08:26:00.000Z"
                    samplingRate: null
                    delay: "1m"
                    timeout: "59s"
                    frequency: "1m"
                    lookbackPeriod: "3h"
                    fieldHistoryLength: 10
                    maxLogsPerPage: 50000
                    maxTimeWindowSize: "15m"
                    maxLogsPerWindow: 100000
                    maxLogsPerWindowCapBehavior: "drop"
                - type: service
                  status: started
                  filter: ""
                  delay: "1m"
                  timeout: "59s"
                  frequency: "10m"
                  lookbackPeriod: "3h"
                  fieldHistoryLength: 10
                  maxLogsPerPage: 50000
                  maxTimeWindowSize: "15m"
                  maxLogsPerWindow: 100000
                  maxLogsPerWindowCapBehavior: "drop"
                  docsPerSecond: -1
                  indexPattern: ""
                  enrichPolicyExecutionInterval: null
                  timestampField: "@timestamp"
                  maxPageSearchSize: 10000
                  lastExecutionTimestamp: "2026-04-10T08:30:00.000Z"
              excludedUserNames: []
          notInstalledExample:
            summary: "Entity Store not installed"
            description: "The Entity Store has not been installed."
            value:
              status: not_installed
              engines: []
x-codeSamples:
  - lang: curl
    source: |
      curl -X GET -H "Authorization: ApiKey ${API_KEY}" \
        "${KIBANA_URL}/api/security/entity_store/status?include_components=false"
  - lang: Console
    source: |
      GET kbn://api/security/entity_store/status?include_components=false
