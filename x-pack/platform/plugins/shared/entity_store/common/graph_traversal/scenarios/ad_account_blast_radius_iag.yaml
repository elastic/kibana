version: '2'
id: ad-account-blast-radius-iag
name: AD account blast radius (identity access graph)
description: >
  Blast radius of a compromised Active Directory account over the relationships the identity
  access graph generator writes on the AD side: the groups the account is in and the groups
  those nest into, the hosts the groups are local admins on, the hosts the account signs in to
  and the credentials left on them, the hosts that share a machine, and what the account
  owns. One hop spec repeated, since every kind can follow every other: an admin group nested
  into Domain Admins, a jump server holding a domain admin's credentials, and so on. Kinds are
  the generator's triple names in snake_case.
seed:
  type: user
  description: The entity store id of the AD account, for example user:adm-jdoe-s42@active_directory
limits:
  max_hops: 7
hops:
  - name: ad
    description: >
      One step over the AD relationships: group memberships and nesting, local admin rights,
      sign-ins and leftover credentials, shared machines and ownership.
    relationships:
      - member_of
      - nested_in
      - local_admin
      - credentials_left
      - accesses_frequently
      - accesses_infrequently
      - same_machine
      - owns
    payload_fields:
      - entity.name
      - entity.sub_type
    repeat: 7
