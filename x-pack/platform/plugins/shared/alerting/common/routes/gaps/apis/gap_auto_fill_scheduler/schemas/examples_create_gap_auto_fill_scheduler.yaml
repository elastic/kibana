                  consumer: siem
                - type: siem.queryRule
                  consumer: siem
                - type: siem.savedQueryRule
                  consumer: siem
                - type: siem.thresholdRule
                  consumer: siem
                - type: siem.newTermsRule
                  consumer: siem
              gap_fill_range: now-90d
              max_backfills: 100
              num_retries: 3
              scope:
                - security_solution
              excluded_reasons:
                - rule_disabled
              created_by: elastic
              updated_by: elastic
