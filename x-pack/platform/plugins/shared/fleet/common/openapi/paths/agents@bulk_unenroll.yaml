post:
  summary: Bulk unenroll agents
  tags:
    - Elastic Agents
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              actionId:
                type: string
    '400':
      $ref: ../components/responses/error.yaml
  operationId: bulk-unenroll-agents
  parameters:
    - $ref: ../components/headers/kbn_xsrf.yaml
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            agents:
              oneOf:
                - type: string
                  maxLength: 500000
                  description: KQL query string, leave empty to action all agents
                - type: array
                  items:
                    type: string
                    maxLength: 512
                  description: list of agent IDs
            revoke:
              type: boolean
              description: Revokes API keys of agents
            force:
              type: boolean
              description: Unenrolls hosted agents too
            includeInactive:
              type: boolean
              description: When passing agents by KQL query, unenrolls inactive agents too
          required:
            - agents
        example:
          revoke: true
          force: false
          agents: [agent1, agent2]
