requestBody:
  content:
    application/json:
      examples:
        putCloudConnectorRequestExample:
          description: 'Update a Fleet cloud connector'
          value:
            name: 'Updated AWS connector'
            vars: {}
            iac_key: 'sha256:661cb7def1c7101f'
            iac_blueprint_id: 'federated-identity'
            iac_blueprint_version: '1.0.0'
            iac_deployment_id: 'arn:aws:cloudformation:us-east-1:123456789012:stack/elastic-aws-connector/abc'
responses:
  200:
    description: 'Successful response'
    content:
      application/json:
        examples:
          putCloudConnectorExample:
            description: 'The updated Fleet cloud connector'
            value:
              item:
                id: 'cloud-connector-id-1'
                name: 'Updated AWS connector'
                cloudProvider: 'aws'
                accountType: 'single-account'
                vars: {}
                packagePolicyCount: 2
                created_at: '2024-01-15T10:00:00.000Z'
                updated_at: '2024-01-15T11:00:00.000Z'
                iac_key: 'sha256:661cb7def1c7101f'
                iac_blueprint_id: 'federated-identity'
                iac_blueprint_version: '1.0.0'
                iac_deployment_id: 'arn:aws:cloudformation:us-east-1:123456789012:stack/elastic-aws-connector/abc'
                iac_upgrade_status: 'up_to_date'
                iac_upgrade_checked_at: '2024-01-15T11:00:00.000Z'
  400:
    description: 'Bad Request'
    content:
      application/json:
        examples:
          genericErrorResponseExample:
            description: 'Example of a generic error response'
            value:
              statusCode: 400
              error: 'Bad Request'
              message: 'An error message describing what went wrong'
  409:
    description: 'Conflict'
    content:
      application/json:
        examples:
          genericErrorResponseExample:
            description: 'The connector changed while the Role ARN fan-out was in progress'
            value:
              statusCode: 409
              error: 'Conflict'
              message: 'Saved object [fleet-cloud-connector/cloud-connector-id-1] conflict'
  403:
    description: 'Forbidden'
    content:
      application/json:
        examples:
          genericErrorResponseExample:
            description: 'Role ARN fan-out requires integration-policy write permission'
            value:
              statusCode: 403
              error: 'Forbidden'
              message: 'Role ARN updates require permission to write integration policies.'
  500:
    description: 'Role ARN fan-out failed'
    content:
      application/json:
        examples:
          genericErrorResponseExample:
            description: 'Package policies could not be updated to the new role ARN'
            value:
              statusCode: 500
              error: 'Internal Server Error'
              message: 'Failed to update role ARN on 1 package policy (ids: policy-1).'
              attributes:
                updateFailed:
                  - policy-1
                revertFailed: []
                bumpFailed: false
