responses:
  200:
    description: 'Successful response'
    content:
      application/json:
        examples:
          deleteCloudOnboardingDeploymentExample:
            description: 'The cloud onboarding deployment was successfully deleted'
            value:
              id: 'onboarding-deployment-id-1'
  400:
    description: 'Bad Request'
    content:
      application/json:
        examples:
          genericErrorResponseExample:
            description: 'Example of a generic error response'
            value:
              statusCode: 400
              error: 'Bad Request'
              message: 'An error message describing what went wrong'
  404:
    description: 'Not Found'
    content:
      application/json:
        examples:
          notFoundResponseExample:
            description: 'The requested cloud onboarding deployment does not exist'
            value:
              statusCode: 404
              error: 'Not Found'
              message: 'Saved object [fleet-cloud-onboarding-deployment/unknown-id] not found'
