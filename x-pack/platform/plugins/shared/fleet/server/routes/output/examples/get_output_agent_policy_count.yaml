responses:
  200:
    description: 'Successful response'
    content:
      application/json:
        examples:
          getOutputAgentPolicyCountExample:
            description: 'Number of agent policies and active agents using this output'
            value:
              agentPolicyCount: 42
              agentCount: 1250
  400:
    description: 'Bad Request'
    content:
      application/json:
        examples:
          genericErrorResponseExample:
            description: 'Example of a generic error response'
            value:
              statusCode: 400
              error: 'Bad Request'
              message: 'An error message describing what went wrong'
  404:
    description: 'Not Found'
    content:
      application/json:
        examples:
          notFoundExample:
            description: 'Output not found'
            value:
              statusCode: 404
              error: 'Not Found'
              message: 'Output my-output-id not found'
