# Shared PoC Kibana config. Combine with one of the role overlays:
#   node scripts/kibana -c <this> -c kibana.poc.background_tasks.yml
elasticsearch.hosts: ['http://localhost:9200']
elasticsearch.username: kibana_system
elasticsearch.password: changeme
server.port: 5601
xpack.encryptedSavedObjects.encryptionKey: 'poc-alerting-v2-eso-key-0123456789abcdef'
xpack.security.encryptionKey: 'poc-alerting-v2-security-key-0123456789ab'
xpack.reporting.encryptionKey: 'poc-alerting-v2-reporting-key-0123456789a'
xpack.alerting_v2.enabled: true
logging.root.level: info
