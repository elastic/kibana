version: '1'
name: SDLC GitHub catalog teams (GraphQL)
description: >
  Tier-1 catalog workflow. Pages organization teams via GitHub GraphQL (orgCatalog.teams),
  upserts documents into github-intel-teams, and maintains github-intel-sync-state checkpoints.
  Requires a configured .github connector with read:org scope.
enabled: true
tags:
  - sdlc
  - github
  - catalog
  - ingest
  - graphql
  - teams

consts:
  orgLogin: REPLACE_WITH_ORG_LOGIN
  githubConnectorId: REPLACE_WITH_GITHUB_CONNECTOR_ID
  syncStateIndex: github-intel-sync-state
  teamsIndex: github-intel-teams
  syncSource: github-catalog-teams
  entityType: team
  pageSize: 100

settings:
  timeout: 30m
  concurrency:
    key: sdlc-github-catalog-teams
    strategy: drop
    max: 1

triggers:
  - type: scheduled
    with:
      every: 1d
  - type: manual

steps:
  - name: read_checkpoint
    type: elasticsearch.search
    with:
      index: '{{ consts.syncStateIndex }}'
      size: 1
      ignore_unavailable: true
      allow_no_indices: true
      query:
        bool:
          must:
            - term:
                sync.source: '{{ consts.syncSource }}'
            - term:
                entity_type: '{{ consts.entityType }}'
            - term:
                org.login: '{{ consts.orgLogin }}'

  - name: init_cursor
    type: data.set
    with:
      cursor: '{{ steps.read_checkpoint.output.hits.hits.0._source.cursor }}'
      pagesFetched: 0

  - name: paginate_teams
    type: while
    condition: 'steps.fetch_teams.output.pageInfo.hasNextPage : true'
    max-iterations: 15
    steps:
      - name: fetch_teams
        type: github.runQueryTemplate
        connector-id: '{{ consts.githubConnectorId }}'
        with:
          templateId: orgCatalog.teams
          variables:
            org: '{{ consts.orgLogin }}'
          first: '{{ consts.pageSize }}'
          after: '{{ variables.cursor }}'

      - name: backoff_if_needed
        type: wait
        if: '{{ steps.fetch_teams.output.shouldBackoff }}'
        with:
          duration: 60s

      - name: build_bulk_ops
        type: data.set
        with:
          operations: |-
            {% assign items = steps.fetch_teams.output.data.organization.teams.nodes %}
            [
            {%- for node in items -%}
              {
                "id": "{{ node.id }}",
                "@timestamp": "{{ execution.startedAt }}",
                "sync": {"run_id": "{{ execution.id }}", "source": "{{ consts.syncSource }}"},
                "team": {
                  "slug": "{{ node.slug }}",
                  "name": "{{ node.name }}",
                  "org": "{{ consts.orgLogin }}",
                  "members_count": "{{ node.members.totalCount }}"
                },
                "payload": {{ node | json }}
              }  {% unless forloop.last %},{% endunless %}
            {%- endfor -%}
            ]

      - name: bulk_index_page
        type: elasticsearch.bulk
        with:
          index: '{{ consts.teamsIndex }}'
          id_field: id
          operations: '${{ steps.build_bulk_ops.output.operations | json_parse }}'

      - name: advance_cursor
        type: data.set
        with:
          cursor: '{{ steps.fetch_teams.output.pageInfo.endCursor }}'
          pagesFetched: '{{ variables.pagesFetched | plus: 1 }}'

      - name: checkpoint_page
        type: elasticsearch.index
        with:
          index: '{{ consts.syncStateIndex }}'
          id: '{{ consts.syncSource }}-{{ consts.orgLogin }}-{{ consts.entityType }}'
          document:
            '@timestamp': '{{ execution.startedAt }}'
            sync:
              run_id: '{{ execution.id }}'
              source: '{{ consts.syncSource }}'
            entity_type: '{{ consts.entityType }}'
            org:
              login: '{{ consts.orgLogin }}'
            cursor: '{{ variables.cursor }}'
            last_run_at: '{{ execution.startedAt }}'
            last_run_status: in_progress
            stats:
              pages_fetched: '{{ variables.pagesFetched }}'
              has_next_page: '{{ steps.fetch_teams.output.pageInfo.hasNextPage }}'
              rate_limit_remaining: '{{ steps.fetch_teams.output.rateLimit.remaining }}'
  - name: write_checkpoint
    type: elasticsearch.index
    with:
      index: '{{ consts.syncStateIndex }}'
      id: '{{ consts.syncSource }}-{{ consts.orgLogin }}-{{ consts.entityType }}'
      document:
        '@timestamp': '{{ execution.startedAt }}'
        sync:
          run_id: '{{ execution.id }}'
          source: '{{ consts.syncSource }}'
        entity_type: '{{ consts.entityType }}'
        org:
          login: '{{ consts.orgLogin }}'
        cursor: '{{ variables.cursor }}'
        last_run_at: '{{ execution.startedAt }}'
        last_run_status: success
        stats:
          pages_fetched: '{{ variables.pagesFetched }}'
          has_next_page: '{{ steps.fetch_teams.output.pageInfo.hasNextPage }}'
          rate_limit_remaining: '{{ steps.fetch_teams.output.rateLimit.remaining }}'
