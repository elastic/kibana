version: '1'
name: SDLC GitHub project epic phases
description: >
  Tier-2 projection workflow. Builds sdlc-epic-phases documents from normalized Epic project
  items in github-intel-project-items. Run github-normalize-project-items first, then
  github-enrich-epic-phases for child tickets and rollup coverage.
enabled: true
tags:
  - sdlc
  - github
  - epic
  - phases
  - ingest

consts:
  orgLogin: REPLACE_WITH_ORG_LOGIN
  syncStateIndex: github-intel-sync-state
  projectItemsIndex: github-intel-project-items
  epicPhasesIndex: sdlc-epic-phases
  syncSource: github-project-epic-phases
  entityType: epic_phases
  batchSize: 200
  initialWatermark: '2024-01-01T00:00:00Z'

settings:
  timeout: 30m
  concurrency:
    key: sdlc-github-project-epic-phases
    strategy: drop
    max: 1

triggers:
  - type: scheduled
    with:
      every: 6h
  - type: manual

steps:
  - name: read_checkpoint
    type: elasticsearch.search
    with:
      index: '{{ consts.syncStateIndex }}'
      size: 1
      ignore_unavailable: true
      allow_no_indices: true
      query:
        bool:
          must:
            - term:
                sync.source: '{{ consts.syncSource }}'
            - term:
                entity_type: '{{ consts.entityType }}'
            - term:
                org.login: '{{ consts.orgLogin }}'

  - name: init_state
    type: data.set
    with:
      watermark: '${{ steps.read_checkpoint.output.hits.hits[0]._source.watermark ?? "" }}'
      runStartedAt: '{{ execution.startedAt }}'
      epicsProjected: 0
      lastUpdatedAt: ''

  - name: ensure_watermark
    type: data.set
    if: '${{ variables.watermark == null or variables.watermark == "" }}'
    with:
      watermark: '{{ consts.initialWatermark }}'

  - name: load_epic_items
    type: elasticsearch.search
    with:
      index: '{{ consts.projectItemsIndex }}'
      ignore_unavailable: true
      allow_no_indices: true
      size: '{{ consts.batchSize }}'
      _source:
        - entity
        - project
        - payload
        - hierarchy
        - epic_anchor
        - team_attribution
        - content_ref
        - delivery
        - github
        - roadmap
        - labels
      sort:
        - github.updated_at:
            order: asc
        - entity.id:
            order: asc
      query:
        bool:
          must:
            - term:
                org.login: '{{ consts.orgLogin }}'
            - range:
                github.updated_at:
                  gt: '{{ variables.watermark }}'
          should:
            - terms:
                hierarchy.ticket_type:
                  - Epic
                  - epic
            - term:
                payload.fieldValues.nodes.name.keyword: Epic
          minimum_should_match: 1
      script_fields:
        release_milestone:
          script:
            lang: painless
            source: |-
              String valueOf(def n) {
                if (n == null) return '';
                if (n.name != null && n.name.toString() != '') return n.name.toString();
                if (n.text != null && n.text.toString() != '') return n.text.toString();
                if (n.date != null && n.date.toString() != '') return n.date.toString();
                return '';
              }
              String pick(def nodes, def names) {
                if (nodes == null) return '';
                for (def n : nodes) {
                  if (n == null || n.field == null || n.field.name == null) continue;
                  if (names.contains(n.field.name)) {
                    String v = valueOf(n);
                    if (v != '') return v;
                  }
                }
                return '';
              }
              def existing = params._source.roadmap != null ? params._source.roadmap.release_milestone : null;
              if (existing != null && existing.toString() != '') return existing.toString();
              def payload = params._source.payload;
              if (payload == null) return '';
              def fv = payload.fieldValues;
              if (fv == null) return '';
              String v = pick(fv.nodes, ['Release Milestone', 'Stack Release Target', 'Target Milestone', 'Stack Milestone']);
              if (v == '') v = pick(fv.nodes, ['Program Milestone', 'Launch Milestone', 'Milestones']);
              if (v == '') v = pick(fv.nodes, ['Expected Delivery Quarter', 'Quarter', 'Target Quarter']);
              return v;
        roadmap_stage:
          script:
            lang: painless
            source: |-
              String valueOf(def n) {
                if (n == null) return '';
                if (n.name != null && n.name.toString() != '') return n.name.toString();
                if (n.text != null && n.text.toString() != '') return n.text.toString();
                return '';
              }
              String pick(def nodes, def names) {
                if (nodes == null) return '';
                for (def n : nodes) {
                  if (n == null || n.field == null || n.field.name == null) continue;
                  if (names.contains(n.field.name)) {
                    String v = valueOf(n);
                    if (v != '') return v;
                  }
                }
                return '';
              }
              def existing = params._source.roadmap != null ? params._source.roadmap.stage : null;
              if (existing != null && existing.toString() != '') return existing.toString();
              def payload = params._source.payload;
              if (payload == null) return '';
              def fv = payload.fieldValues;
              if (fv == null) return '';
              String v = pick(fv.nodes, ['Product Roadmap Stage', 'Stage', 'Pipeline Stage', 'Roadmap Stage']);
              if (v == '') v = pick(fv.nodes, ['Phase']);
              return v;
        release_initiative:
          script:
            lang: painless
            source: |-
              String valueOf(def n) {
                if (n == null) return '';
                if (n.name != null && n.name.toString() != '') return n.name.toString();
                if (n.text != null && n.text.toString() != '') return n.text.toString();
                return '';
              }
              def existing = params._source.roadmap != null ? params._source.roadmap.initiative : null;
              if (existing != null && existing.toString() != '') return existing.toString();
              def payload = params._source.payload;
              if (payload == null) return '';
              def fv = payload.fieldValues;
              if (fv == null || fv.nodes == null) return '';
              for (def n : fv.nodes) {
                if (n == null || n.field == null) continue;
                def fname = n.field.name;
                if (fname == 'Product Initiative' || fname == 'Product') {
                  String v = valueOf(n);
                  if (v != '') return v;
                }
              }
              return '';
        engineering_team:
          script:
            lang: painless
            source: |-
              String valueOf(def n) {
                if (n == null) return '';
                if (n.name != null && n.name.toString() != '') return n.name.toString();
                if (n.text != null && n.text.toString() != '') return n.text.toString();
                return '';
              }
              String pick(def nodes, def names) {
                if (nodes == null) return '';
                for (def n : nodes) {
                  if (n == null || n.field == null || n.field.name == null) continue;
                  if (names.contains(n.field.name)) {
                    String v = valueOf(n);
                    if (v != '') return v;
                  }
                }
                return '';
              }
              def existingAttr = params._source.team_attribution != null ? params._source.team_attribution.engineering_team : null;
              if (existingAttr != null && existingAttr.toString() != '') return existingAttr.toString();
              def payload = params._source.payload;
              if (payload == null) return '';
              def fv = payload.fieldValues;
              if (fv == null) return '';
              String v = pick(fv.nodes, ['Team', 'Owning Team']);
              if (v == '') v = pick(fv.nodes, ['Component', 'Area']);
              if (v == '') v = pick(fv.nodes, ['Workstream']);
              return v;

  - name: project_epic_phases
    type: foreach
    foreach: '${{ steps.load_epic_items.output.hits.hits | json }}'
    iteration-on-failure:
      continue: true
    steps:
      - name: upsert_epic_phase
        type: elasticsearch.index
        with:
          index: '{{ consts.epicPhasesIndex }}'
          id: '${{ foreach.item._source.entity.id }}'
          document:
            '@timestamp': '{{ execution.startedAt }}'
            sync:
              run_id: '{{ execution.id }}'
              source: '{{ consts.syncSource }}'
            roadmap:
              id: '${{ foreach.item._source.project.id }}'
              title: '${{ foreach.item._source.project.title }}'
              product: '${{ foreach.item.fields.release_initiative[0] ?? "" }}'
            epic:
              key: '${{ foreach.item._source.hierarchy.epic }}'
              display_id: '${{ foreach.item._source.entity.number }}'
              title: '${{ foreach.item._source.payload.content.title }}'
              summary: '${{ foreach.item._source.payload.content.body }}'
              owner: '${{ foreach.item._source.epic_anchor.owner }}'
              teams: '${{ foreach.item.fields.engineering_team[0] ?? foreach.item._source.team_attribution.engineering_team }}'
              url: '${{ foreach.item._source.content_ref.url }}'
              project_item_id: '${{ foreach.item._source.entity.id }}'
              issue_ref:
                repo: '${{ foreach.item._source.content_ref.repo }}'
                number: '${{ foreach.item._source.entity.number }}'
                node_id: '${{ foreach.item._source.content_ref.id }}'
            teams:
              own_engineering_team: '${{ foreach.item.fields.engineering_team[0] ?? foreach.item._source.team_attribution.engineering_team }}'
              own_org_team: '${{ foreach.item.fields.engineering_team[0] ?? foreach.item._source.team_attribution.org_teams }}'
              cross_team: false
              team_count: 1
            release:
              milestone: '${{ foreach.item.fields.release_milestone[0] ?? "" }}'
              roadmap_stage: '${{ foreach.item.fields.roadmap_stage[0] ?? "" }}'
              initiative: '${{ foreach.item.fields.release_initiative[0] ?? "" }}'
            links:
              project_url: '${{ foreach.item._source.project.url }}'
            rollup:
              status: '${{ foreach.item._source.delivery.coverage_status }}'
              coverage_pct: '${{ foreach.item._source.delivery.coverage_pct }}'
            payload: '${{ foreach.item._source.payload }}'

      - name: track_projection_progress
        type: data.set
        with:
          lastUpdatedAt: '${{ foreach.item._source.github.updated_at }}'
          epicsProjected: '${{ variables.epicsProjected | plus: 1 }}'

  - name: finalize_watermark
    type: if
    condition: 'variables.epicsProjected : {{ consts.batchSize }}'
    steps:
      - name: use_last_updated_watermark
        type: data.set
        with:
          watermark: '${{ variables.lastUpdatedAt }}'
    else:
      - name: finalize_if_any_processed
        type: if
        condition: "${{ variables.epicsProjected > 0 }}"
        steps:
          - name: use_run_started_watermark
            type: data.set
            with:
              watermark: '${{ variables.runStartedAt }}'

  - name: write_checkpoint
    type: elasticsearch.index
    with:
      index: '{{ consts.syncStateIndex }}'
      id: '{{ consts.syncSource }}-{{ consts.orgLogin }}-{{ consts.entityType }}'
      document:
        '@timestamp': '{{ execution.startedAt }}'
        sync:
          run_id: '{{ execution.id }}'
          source: '{{ consts.syncSource }}'
        entity_type: '{{ consts.entityType }}'
        org:
          login: '{{ consts.orgLogin }}'
        watermark: '${{ variables.watermark }}'
        last_run_at: '{{ execution.startedAt }}'
        last_run_status: success
        stats:
          epics_projected: '${{ variables.epicsProjected }}'
          batch_size: '${{ steps.load_epic_items.output.hits.hits.size }}'
