version: '1'
name: SDLC GitHub catalog team members (GraphQL)
description: >
  Tier-1 catalog workflow. Loads teams from github-intel-teams, pages members per team via
  GitHub GraphQL (orgCatalog.teamMembers), upserts github-intel-people and membership edges
  into github-intel-relationships. Run github-catalog-teams first. Per-team cursor checkpoints
  are stored in github-intel-sync-state. Each run skips teams already fully paged
  (stats.has_next_page: false), processes at most teamsPerRun remaining teams, and writes
  checkpoints after every GraphQL page so a 60m timeout cannot stall the catalog. When a team
  is fully paged from the start, stale member_of_team edges are deleted. When every team is
  complete, checkpoints are cleared so the next run can refresh membership.
enabled: true
tags:
  - sdlc
  - github
  - catalog
  - ingest
  - graphql
  - people
  - teams

consts:
  orgLogin: REPLACE_WITH_ORG_LOGIN
  githubConnectorId: REPLACE_WITH_GITHUB_CONNECTOR_ID
  syncStateIndex: github-intel-sync-state
  teamsIndex: github-intel-teams
  peopleIndex: github-intel-people
  relationshipsIndex: github-intel-relationships
  syncSource: github-catalog-team-members
  entityType: team_member
  pageSize: 100
  teamsPageSize: 1000
  teamsPerRun: 150

settings:
  timeout: 60m
  concurrency:
    key: sdlc-github-catalog-team-members
    strategy: drop
    max: 1

triggers:
  - type: scheduled
    with:
      every: 1d
  - type: manual

steps:
  - name: init_run_budget
    type: data.set
    with:
      teamsProcessed: 0

  - name: load_teams
    type: elasticsearch.search
    with:
      index: '{{ consts.teamsIndex }}'
      ignore_unavailable: true
      allow_no_indices: true
      size: '{{ consts.teamsPageSize }}'
      sort:
        - team.slug: asc
      query:
        term:
          team.org: '{{ consts.orgLogin }}'

  - name: sync_team_members
    type: foreach
    foreach: '{{ steps.load_teams.output.hits.hits | json }}'
    steps:
      - name: init_team_context
        type: data.set
        with:
          teamSlug: '{{ foreach.item._source.team.slug }}'
          teamName: '{{ foreach.item._source.team.name }}'
          memberCursor: ''
          memberPagesFetched: 0
          startedFromBeginning: false

      - name: read_team_checkpoint
        type: elasticsearch.search
        with:
          index: '{{ consts.syncStateIndex }}'
          size: 1
          ignore_unavailable: true
          allow_no_indices: true
          query:
            ids:
              values:
                - '{{ consts.syncSource }}-{{ consts.orgLogin }}-{{ variables.teamSlug }}'

      - name: skip_if_team_complete
        type: loop.continue
        if: '${{ steps.read_team_checkpoint.output.hits.hits[0]._source.stats.has_next_page == false or steps.read_team_checkpoint.output.hits.hits[0]._source.stats.has_next_page == "false" }}'

      - name: stop_if_run_budget_exhausted
        type: loop.break
        if: '${{ variables.teamsProcessed >= consts.teamsPerRun }}'

      - name: restore_team_cursor
        type: data.set
        with:
          memberCursor: '{{ steps.read_team_checkpoint.output.hits.hits.0._source.cursor }}'
          memberPagesFetched: 0

      - name: mark_refresh_start
        type: data.set
        if: '${{ variables.memberCursor == "" or variables.memberCursor == null }}'
        with:
          startedFromBeginning: true

      - name: paginate_team_members
        type: while
        condition: 'steps.fetch_team_members.output.pageInfo.hasNextPage : true'
        max-iterations: 10
        steps:
          - name: fetch_team_members
            type: github.runQueryTemplate
            connector-id: '{{ consts.githubConnectorId }}'
            with:
              templateId: orgCatalog.teamMembers
              variables:
                org: '{{ consts.orgLogin }}'
                teamSlug: '{{ variables.teamSlug }}'
              first: '{{ consts.pageSize }}'
              after: '{{ variables.memberCursor }}'

          - name: backoff_if_needed
            type: wait
            if: '{{ steps.fetch_team_members.output.shouldBackoff }}'
            with:
              duration: 60s

          - name: build_people_ops
            type: data.set
            with:
              operations: |-
                {% assign items = steps.fetch_team_members.output.data.organization.team.members.nodes %}
                [
                {%- for node in items -%}
                  {
                    "id": "{{ node.id }}",
                    "@timestamp": "{{ execution.startedAt }}",
                    "sync": {"run_id": "{{ execution.id }}", "source": "{{ consts.syncSource }}"},
                    "person": {"login": {{ node.login | json }}, "name": {{ node.name | json }}, "id": "{{ node.id }}"},
                    "payload": {{ node | json }}
                  }  {% unless forloop.last %},{% endunless %}
                {%- endfor -%}
                ]

          - name: bulk_index_people
            type: elasticsearch.bulk
            with:
              index: '{{ consts.peopleIndex }}'
              id_field: id
              operations: '${{ steps.build_people_ops.output.operations | json_parse }}'

          - name: build_relationships_ops
            type: data.set
            with:
              operations: |-
                {% assign items = steps.fetch_team_members.output.data.organization.team.members.nodes %}
                [
                {%- for node in items -%}
                  {
                    "id": "{{ consts.orgLogin }}-{{ variables.teamSlug }}-{{ node.id }}",
                    "@timestamp": "{{ execution.startedAt }}",
                    "sync": {"run_id": "{{ execution.id }}", "source": "{{ consts.syncSource }}"},
                    "from": {{ node.login | json }},
                    "to": {{ variables.teamSlug | json }},
                    "relation": "member_of_team",
                    "metadata": {"org": "{{ consts.orgLogin }}", "team_name": {{ variables.teamName | json }}},
                    "payload": {{ node | json }}
                  }  {% unless forloop.last %},{% endunless %}
                {%- endfor -%}
                ]

          - name: bulk_index_relationships
            type: elasticsearch.bulk
            with:
              index: '{{ consts.relationshipsIndex }}'
              id_field: id
              operations: '${{ steps.build_relationships_ops.output.operations | json_parse }}'

          - name: advance_team_member_cursor
            type: data.set
            with:
              memberCursor: '{{ steps.fetch_team_members.output.pageInfo.endCursor }}'
              memberPagesFetched: '{{ variables.memberPagesFetched | plus: 1 }}'

          - name: write_team_checkpoint
            type: elasticsearch.index
            with:
              index: '{{ consts.syncStateIndex }}'
              id: '{{ consts.syncSource }}-{{ consts.orgLogin }}-{{ variables.teamSlug }}'
              document:
                '@timestamp': '{{ execution.startedAt }}'
                sync:
                  run_id: '{{ execution.id }}'
                  source: '{{ consts.syncSource }}'
                entity_type: '{{ consts.entityType }}'
                org:
                  login: '{{ consts.orgLogin }}'
                cursor: '{{ variables.memberCursor }}'
                last_run_at: '{{ execution.startedAt }}'
                last_run_status: success
                stats:
                  team_slug: '{{ variables.teamSlug }}'
                  team_name: '{{ variables.teamName }}'
                  pages_fetched: '{{ variables.memberPagesFetched }}'
                  has_next_page: '${{ steps.fetch_team_members.output.pageInfo.hasNextPage }}'
                  rate_limit_remaining: '{{ steps.fetch_team_members.output.rateLimit.remaining }}'

      - name: cleanup_stale_memberships
        type: elasticsearch.request
        if: '${{ variables.startedFromBeginning == true and (steps.fetch_team_members.output.pageInfo.hasNextPage == false or steps.fetch_team_members.output.pageInfo.hasNextPage == "false") }}'
        with:
          method: POST
          path: '/{{ consts.relationshipsIndex }}/_delete_by_query?conflicts=proceed&refresh=true&ignore_unavailable=true'
          body:
            query:
              bool:
                must:
                  - term:
                      relation: member_of_team
                  - term:
                      to: '{{ variables.teamSlug }}'
                  - term:
                      metadata.org: '{{ consts.orgLogin }}'
                must_not:
                  - term:
                      sync.run_id: '{{ execution.id }}'
        on-failure:
          continue: true

      - name: count_processed_team
        type: data.set
        with:
          teamsProcessed: '{{ variables.teamsProcessed | plus: 1 }}'

  - name: reset_checkpoints_for_next_cycle
    type: elasticsearch.request
    if: '${{ variables.teamsProcessed == 0 }}'
    with:
      method: POST
      path: '/{{ consts.syncStateIndex }}/_delete_by_query?conflicts=proceed&refresh=true&ignore_unavailable=true'
      body:
        query:
          bool:
            must:
              - term:
                  sync.source: '{{ consts.syncSource }}'
              - term:
                  entity_type: '{{ consts.entityType }}'
              - term:
                  org.login: '{{ consts.orgLogin }}'
    on-failure:
      continue: true
