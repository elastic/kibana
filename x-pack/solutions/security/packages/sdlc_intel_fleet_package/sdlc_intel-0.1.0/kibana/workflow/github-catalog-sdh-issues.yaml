version: '1'
name: SDLC GitHub catalog SDH issues (GraphQL)
description: >
  Tier-1 SDH catalog workflow. Loads sdh-* repos from github-intel-repos, then pages each
  repo's issues via activity.searchIssues (repo:owner/name, sort:updated-asc). Upserts
  github-intel-sdh-issues. Per-repo checkpoints keep the search watermark until that repo is
  fully paged. When GitHub search hits its 1000-result cap, the watermark walks forward from
  the last indexed updatedAt so the next window can continue. Run github-catalog-repos first,
  then this workflow before cross-link-feedback-loop.
enabled: false
tags:
  - sdlc
  - github
  - catalog
  - ingest
  - graphql
  - issues
  - sdh
  - feedback

consts:
  orgLogin: REPLACE_WITH_ORG_LOGIN
  githubConnectorId: REPLACE_WITH_GITHUB_CONNECTOR_ID
  sdhRepoPattern: REPLACE_WITH_SDH_REPO_PATTERN
  syncStateIndex: github-intel-sync-state
  reposIndex: github-intel-repos
  issuesIndex: github-intel-sdh-issues
  syncSource: github-catalog-sdh-issues
  entityType: sdh_issue
  pageSize: 50
  reposPageSize: 200
  initialWatermark: '2024-01-01T00:00:00Z'

settings:
  timeout: 3h
  concurrency:
    key: sdlc-github-catalog-sdh-issues
    strategy: drop
    max: 1

triggers:
  - type: scheduled
    with:
      every: 1h
  - type: manual

steps:
  - name: init_run
    type: data.set
    with:
      runStartedAt: '{{ execution.startedAt }}'

  - name: load_sdh_repos
    type: elasticsearch.search
    with:
      index: '{{ consts.reposIndex }}'
      size: '{{ consts.reposPageSize }}'
      ignore_unavailable: true
      allow_no_indices: true
      query:
        bool:
          must:
            - term:
                org.login: '{{ consts.orgLogin }}'
            - wildcard:
                repo.name:
                  value: '{{ consts.sdhRepoPattern }}'

  - name: sync_sdh_repo_issues
    type: foreach
    foreach: '{{ steps.load_sdh_repos.output.hits.hits | json }}'
    steps:
      - name: init_repo_context
        type: data.set
        with:
          repoName: '{{ foreach.item._source.repo.name }}'
          repoFullName: '{{ foreach.item._source.repo.full_name }}'
          cursor: ''
          watermark: ''
          pagesFetched: 0
          continuePaging: true
          lastIssueUpdatedAt: ''

      - name: read_repo_checkpoint
        type: elasticsearch.search
        with:
          index: '{{ consts.syncStateIndex }}'
          size: 1
          ignore_unavailable: true
          allow_no_indices: true
          query:
            ids:
              values:
                - '{{ consts.syncSource }}-{{ consts.orgLogin }}-{{ variables.repoName }}'

      - name: restore_repo_checkpoint
        type: data.set
        with:
          cursor: '${{ steps.read_repo_checkpoint.output.hits.hits[0]._source.cursor ?? "" }}'
          watermark: '${{ steps.read_repo_checkpoint.output.hits.hits[0]._source.watermark ?? "" }}'

      - name: ensure_repo_watermark
        type: data.set
        if: '${{ variables.watermark == null or variables.watermark == "" }}'
        with:
          watermark: '{{ consts.initialWatermark }}'

      - name: build_repo_search_query
        type: data.set
        with:
          searchQuery: 'repo:{{ variables.repoFullName }} updated:>={{ variables.watermark }} -is:pr sort:updated-asc'

      - name: paginate_sdh_issues
        type: while
        condition: 'variables.continuePaging : true'
        max-iterations: 250
        steps:
          - name: fetch_sdh_issues
            type: github.runQueryTemplate
            connector-id: '{{ consts.githubConnectorId }}'
            with:
              templateId: activity.searchIssues
              variables:
                query: '{{ variables.searchQuery }}'
              first: '{{ consts.pageSize }}'
              after: '${{ variables.cursor }}'

          - name: backoff_if_needed
            type: wait
            if: '${{ steps.fetch_sdh_issues.output.shouldBackoff }}'
            with:
              duration: 60s

          - name: index_sdh_issues
            type: foreach
            foreach: '${{ steps.fetch_sdh_issues.output.data.search.nodes | json }}'
            steps:
              - name: upsert_sdh_issue
                type: elasticsearch.index
                with:
                  index: '{{ consts.issuesIndex }}'
                  id: '${{ foreach.item.id }}'
                  document:
                    '@timestamp': '{{ execution.startedAt }}'
                    sync:
                      run_id: '{{ execution.id }}'
                      source: '{{ consts.syncSource }}'
                    entity:
                      type: sdh_issue
                      id: '${{ foreach.item.id }}'
                      url: '${{ foreach.item.url }}'
                      number: '${{ foreach.item.number }}'
                    org:
                      login: '{{ consts.orgLogin }}'
                    repository:
                      name: '${{ foreach.item.repository.name }}'
                      full_name: '${{ foreach.item.repository.nameWithOwner }}'
                    github:
                      created_at: '${{ foreach.item.createdAt }}'
                      updated_at: '${{ foreach.item.updatedAt }}'
                      closed_at: '${{ foreach.item.closedAt }}'
                      state: '${{ foreach.item.state }}'
                    labels: '${{ foreach.item.labels.nodes | json }}'
                    people:
                      author: '${{ foreach.item.author.login }}'
                    content:
                      title: '${{ foreach.item.title }}'
                      body: '${{ foreach.item.body }}'
                      searchable: '{{ foreach.item.title }} {{ foreach.item.body }}'
                    feedback:
                      is_sdh: true
                      sdh_catalog_source: sdh_repo
                      linked_salesforce_case_id: ''
                      linked_salesforce_case_number: ''
                      link_source: ''
                    payload: '${{ foreach.item }}'

              - name: track_last_updated
                type: data.set
                if: '${{ foreach.item.updatedAt != null and foreach.item.updatedAt != "" }}'
                with:
                  lastIssueUpdatedAt: '${{ foreach.item.updatedAt }}'

          - name: advance_cursor
            type: data.set
            with:
              cursor: '${{ steps.fetch_sdh_issues.output.pageInfo.endCursor }}'
              pagesFetched: '${{ variables.pagesFetched | plus: 1 }}'
              checkpointWatermark: '{{ variables.watermark }}'
              checkpointCursor: '${{ steps.fetch_sdh_issues.output.pageInfo.endCursor }}'

          - name: finish_repo_if_complete
            type: data.set
            if: '${{ steps.fetch_sdh_issues.output.pageInfo.hasNextPage == false }}'
            with:
              continuePaging: false
              checkpointWatermark: '{{ variables.runStartedAt }}'
              checkpointCursor: ''

          - name: open_next_search_window
            type: data.set
            if: '${{ steps.fetch_sdh_issues.output.pageInfo.hasNextPage == false and (steps.fetch_sdh_issues.output.data.search.issueCount | plus: 0) > (variables.pagesFetched | times: 50) and variables.lastIssueUpdatedAt != "" }}'
            with:
              continuePaging: true
              watermark: '{{ variables.lastIssueUpdatedAt }}'
              cursor: ''
              checkpointWatermark: '{{ variables.lastIssueUpdatedAt }}'
              checkpointCursor: ''
              searchQuery: 'repo:{{ variables.repoFullName }} updated:>={{ variables.lastIssueUpdatedAt }} -is:pr sort:updated-asc'

          - name: write_repo_checkpoint
            type: elasticsearch.index
            with:
              index: '{{ consts.syncStateIndex }}'
              id: '{{ consts.syncSource }}-{{ consts.orgLogin }}-{{ variables.repoName }}'
              document:
                '@timestamp': '{{ execution.startedAt }}'
                sync:
                  run_id: '{{ execution.id }}'
                  source: '{{ consts.syncSource }}'
                entity_type: '{{ consts.entityType }}'
                org:
                  login: '{{ consts.orgLogin }}'
                repository:
                  name: '{{ variables.repoName }}'
                  full_name: '{{ variables.repoFullName }}'
                cursor: '${{ variables.checkpointCursor }}'
                watermark: '{{ variables.checkpointWatermark }}'
                last_run_at: '{{ execution.startedAt }}'
                last_run_status: success
                stats:
                  pages_fetched: '${{ variables.pagesFetched }}'
                  has_next_page: '${{ variables.continuePaging }}'
                  issue_count: '${{ steps.fetch_sdh_issues.output.data.search.issueCount ?? 0 }}'
                  search_query: '{{ variables.searchQuery }}'
                  sdh_repo_pattern: '{{ consts.sdhRepoPattern }}'
