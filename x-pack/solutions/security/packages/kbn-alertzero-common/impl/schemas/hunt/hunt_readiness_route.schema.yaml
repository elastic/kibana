openapi: 3.0.0
info:
  title: AlertZero Hunt readiness API endpoint
  version: '1'
paths:
  /internal/alertzero/hunt/readiness:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: HuntReadiness
      description: >-
        Readiness projection over A2's resolveIndexScope, one entry per
        technology (or the single requested one), for the given space. A
        thin projection over the resolution service, not a duplicate of its
        logic (plan.md:249).
      summary: Hunt index-scope readiness per technology
      tags:
        - AlertZero API
      parameters:
        - name: technology
          in: query
          required: false
          schema:
            $ref: '../components/hunt.schema.yaml#/components/schemas/HuntTechnology'
          description: Limit the readiness check to a single technology
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components/hunt.schema.yaml#/components/schemas/ResolvedIndexScope'
