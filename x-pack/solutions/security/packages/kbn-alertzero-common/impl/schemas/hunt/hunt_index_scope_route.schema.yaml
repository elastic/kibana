openapi: 3.0.0
info:
  title: AlertZero Hunt index scope API endpoint
  version: '1'
paths:
  /internal/alertzero/hunt/index_scope:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: HuntIndexScope
      description: >-
        The hunt scope for the space: the Security Solution default data view the
        hunt searches, and what resolved inside it. Not the same as Security
        Solution threat-intel readiness (`/internal/threat_intel/readiness`) or
        SIEM Readiness; this only reports whether the hunt has anything to search.
      summary: Hunt index scope
      tags:
        - AlertZero API
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../components/hunt.schema.yaml#/components/schemas/HuntScope'
