openapi: 3.0.0
info:
  title: Run AlertZero Hunt Tier 2 behavioral corroboration API endpoint
  version: '1'
paths:
  /internal/alertzero/hunt/hunt_behavior:
    post:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: HuntBehavior
      description: >-
        Runs Tier 2's LLM-backed behavioral extraction against a threat report's
        text. Requires a GenAI connector; returns 503 when none is configured.
      summary: Run Tier 2 behavioral corroboration
      tags:
        - AlertZero API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text:
                  type: string
                  maxLength: 200000
                report_id:
                  type: string
                  minLength: 1
                  maxLength: 512
                llm_confidence_threshold:
                  type: number
                  minimum: 0
                  maximum: 1
                iocs:
                  type: array
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/HuntBehaviorIoc'
                article_context:
                  $ref: '#/components/schemas/HuntBehaviorArticleContext'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required: [status, behaviors, indexed_behaviors, next_step, hasHit]
                properties:
                  status:
                    $ref: '#/components/schemas/HuntBehaviorStatus'
                  report_id:
                    type: string
                  behaviors:
                    type: array
                    items:
                      type: object
                      required:
                        - technique_id
                        - evidence_quote
                        - llm_confidence
                        - confidence
                        - technique_name
                        - reference
                        - tactic_ids
                        - proposed_esql_rule
                        - rule_name
                        - severity
                        - risk_score
                      properties:
                        technique_id:
                          type: string
                        evidence_quote:
                          type: string
                        llm_confidence:
                          type: number
                        confidence:
                          type: number
                        technique_name:
                          type: string
                        reference:
                          type: string
                        tactic_ids:
                          type: array
                          items:
                            type: string
                        parent_technique_id:
                          type: string
                        proposed_esql_rule:
                          type: string
                        rule_name:
                          type: string
                        severity:
                          type: string
                          enum: [critical, high, medium, low]
                        risk_score:
                          type: number
                  indexed_behaviors:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - technique_id
                        - description
                        - llm_confidence
                        - confidence
                      properties:
                        id:
                          type: string
                        technique_id:
                          type: string
                        description:
                          type: string
                        telemetry_targets:
                          type: array
                          items:
                            type: string
                        llm_confidence:
                          type: number
                        confidence:
                          type: number
                  dropped_unknown_ids:
                    type: array
                    items:
                      type: string
                  message:
                    type: string
                  next_step:
                    type: string
                  hasHit:
                    type: boolean
                    enum: [false]
        '503':
          description: No GenAI connector configured
components:
  schemas:
    HuntBehaviorStatus:
      type: string
      enum: [no_behaviors_found, no_behaviors_validated, behaviors_proposed]

    HuntBehaviorIoc:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 64
        value:
          type: string
          minLength: 1
          maxLength: 2048

    HuntBehaviorArticleContext:
      type: object
      description: >-
        Tier 1 context steering. Best-effort hints from Tier 1's environment hit
        surface; missing or empty falls back to text-only extraction.
      properties:
        matched_indices:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 512
        affected_hosts:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 512
        affected_users:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 512
        sample_events:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 2048
        time_range:
          type: object
          required: [from, to]
          properties:
            from:
              type: string
              minLength: 1
              maxLength: 64
            to:
              type: string
              minLength: 1
              maxLength: 64
        proposed_atomic_rules:
          type: array
          maxItems: 50
          items:
            type: object
            required: [rule_name, ioc_type, ioc_value]
            properties:
              rule_name:
                type: string
                maxLength: 512
              ioc_type:
                type: string
                maxLength: 64
              ioc_value:
                type: string
                maxLength: 2048
