openapi: 3.0.0
info:
  title: AlertZero write hunt evidence route
  version: '1'
paths:
  /internal/alertzero/hunt/write_hunt_evidence:
    post:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: WriteHuntEvidence
      description: >-
        Records a finished hunt on a report, called after
        `run_hunt_coordinator` returns a result. A confirmed hit is stamped on
        the space's evidence (`last_hunted_at` and siblings) whatever the
        completeness; a run that found nothing is stamped only when repeating
        it could not cover more, so a retryable run leaves the report
        eligible. The techniques the run searched are recorded either way.
        Kept as its own route rather than folded into the coordinator's
        response path, so a coordinator call the engine times out or
        truncates never reaches this write -- a failed hunt must never consume
        the hunt-once gate.
      summary: Write the hunt-once evidence stamp for a report
      tags:
        - AlertZero API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportId, runId, hasConfirmedHit, completeness, totalHits]
              additionalProperties: false
              properties:
                reportId:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: Threat report id to stamp as hunted.
                runId:
                  type: string
                  minLength: 1
                  maxLength: 128
                hasConfirmedHit:
                  type: boolean
                completeness:
                  $ref: '../components/hunt.schema.yaml#/components/schemas/HuntCompleteness'
                totalHits:
                  type: integer
                  minimum: 0
                  description: Tier 1's total-hits count for this run.
                searchedTechniqueIds:
                  type: array
                  maxItems: 100
                  description: >-
                    Technique ids this run actually searched, from the
                    coordinator's `searched_technique_ids`. Unioned into the
                    report's per-space ledger so a later run does not spend
                    its behavior budget on them again.
                  items:
                    type: string
                    minLength: 1
                    maxLength: 32
                pendingTechniqueIds:
                  type: array
                  maxItems: 100
                  description: >-
                    Technique ids this run could not search but a later run
                    still should, from the coordinator's
                    `pending_technique_ids`. Replaces the report's
                    recorded list for the space, so the next run keeps them
                    as pending even if its own extraction no longer
                    returns them. Omit when Tier 2 did not run, which leaves
                    the recorded list as it is.
                  items:
                    type: string
                    minLength: 1
                    maxLength: 32
                replayedWholeReport:
                  type: boolean
                  description: >-
                    From the coordinator's `replayed_whole_report`. True lets
                    this run's result replace an earlier finding the report
                    still carries while its coverage is pending. Omit when
                    Tier 2 did not run.
            examples:
              WriteHuntEvidenceRequestExample:
                summary: Stamp a clean run as hunted.
                value:
                  reportId: report-2f9e1c
                  runId: run-3b2e1f9a
                  hasConfirmedHit: false
                  completeness: complete
                  totalHits: 0
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [acknowledged]
                properties:
                  acknowledged:
                    type: boolean
              examples:
                WriteHuntEvidenceResponse200Example:
                  summary: Evidence written.
                  value:
                    acknowledged: true
