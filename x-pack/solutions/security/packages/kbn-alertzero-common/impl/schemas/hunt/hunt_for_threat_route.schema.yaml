openapi: 3.0.0
info:
  title: Run AlertZero Hunt Tier 1 threat hunt API endpoint
  version: '1'
paths:
  /internal/alertzero/hunt/hunt_for_threat:
    post:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: HuntForThreat
      description: >-
        Runs Tier 1's deterministic search against a technology's resolved
        index scope. A blocked scope is refused with 409.
      summary: Run Tier 1 deterministic hunt
      tags:
        - AlertZero API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [technology]
              additionalProperties: false
              properties:
                technology:
                  $ref: '../components/hunt.schema.yaml#/components/schemas/HuntTechnology'
                iocs:
                  type: array
                  items:
                    $ref: '../components/hunt.schema.yaml#/components/schemas/HuntIoc'
                techniques:
                  type: array
                  items:
                    type: string
                timeRange:
                  type: object
                  required: [from, to]
                  properties:
                    from:
                      type: string
                    to:
                      type: string
                size:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required: [scope, result]
                properties:
                  scope:
                    $ref: '../components/hunt.schema.yaml#/components/schemas/ResolvedIndexScope'
                  result:
                    $ref: '../components/hunt.schema.yaml#/components/schemas/HuntForThreatResult'
        '409':
          description: The technology's index scope is blocked (a required pattern is missing)
