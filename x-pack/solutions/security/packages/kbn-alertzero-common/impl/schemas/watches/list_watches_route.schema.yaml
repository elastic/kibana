openapi: 3.0.0
info:
  title: List AlertZero Watches API endpoint
  version: '1'
paths:
  /internal/alertzero/watches:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: ListWatches
      description: List Security Watch catalog groupings. A Watch stores no settings.
      summary: List watches
      tags:
        - AlertZero API
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  watches:
                    type: array
                    items:
                      $ref: '../components/watch.schema.yaml#/components/schemas/Watch'
                required:
                  - watches
