openapi: 3.0.0
info:
  title: Get AlertZero Watch API endpoint
  version: '1'
paths:
  /internal/alertzero/watches/{watchId}:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: GetWatch
      description: Get a single Security Watch catalog grouping by id. Watches store no settings.
      summary: Get watch
      tags:
        - AlertZero API
      parameters:
        - name: watchId
          in: path
          required: true
          schema:
            type: string
          description: Managed or custom watch workflow id
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  watch:
                    $ref: '../components/watch.schema.yaml#/components/schemas/Watch'
                required:
                  - watch
