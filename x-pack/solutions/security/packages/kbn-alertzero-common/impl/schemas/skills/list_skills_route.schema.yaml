openapi: 3.0.0
info:
  title: List AlertZero Skills API endpoint
  version: '1'
paths:
  /internal/alertzero/skills:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: ListSkills
      description: List the global skill catalog shared across Security Watches
      summary: List skills
      tags:
        - AlertZero API
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  skills:
                    type: array
                    items:
                      $ref: '../components/watch_settings.schema.yaml#/components/schemas/WatchSkill'
                required:
                  - skills
