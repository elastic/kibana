openapi: 3.0.0
info:
  title: List AlertZero Investigations API endpoint
  version: '1'
paths:
  /internal/alertzero/investigations:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: ListInvestigations
      description: List investigations projected from watch executions and agent conversations
      summary: List investigations
      tags:
        - AlertZero API
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  investigations:
                    type: array
                    items:
                      $ref: '../components/investigation.schema.yaml#/components/schemas/Investigation'
                  total:
                    type: integer
                required:
                  - investigations
                  - total
