openapi: 3.0.0
info:
  title: AlertZero Watch settings component schemas
  version: '1'
paths: {}
components:
  x-codegen-enabled: true
  schemas:
    WatchAutonomyLevel:
      type: string
      enum: [manual, assisted, supervised]
      description: >-
        Autonomy dial levels per programme decision D15 (2026-07-28). Manual is the MVP default.
        There is deliberately no mapping from the legacy 1–5 AutonomyLevel scale — see
        https://github.com/elastic/security-team/issues/18718.

    AllowedAutonomyLevels:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/WatchAutonomyLevel'
      description: >-
        Autonomy levels this Worker actually supports, derived from its complete settings schema
        rather than a hand-maintained list (worker-settings-page-decisions-3, item 3). A Worker
        whose gate cannot run unattended narrows this to the levels it can honour; the UI renders
        a selector only when more than one level is allowed, and the server rejects a PATCH
        naming a level outside the set.

    WorkerScheduleInterval:
      type: string
      pattern: '^[1-9][0-9]*[mhd]$'
      maxLength: 6
      description: >-
        Interval between runs for a schedule-driven Worker, as a positive count and a unit of
        minutes, hours or days (e.g. "24h"). Rendered verbatim into the Worker's `scheduled`
        trigger. Seconds are not supported.

    AnalysisWindowDays:
      type: integer
      minimum: 1
      maximum: 30
      description: >-
        How many days of alerts feed Rule Tuning analysis. Matches the tuning sweep's
        analysis_window_days input. Omitted for every Worker except Rule Tuning.

    WorkerRunState:
      type: string
      enum: [ok, paused, degraded, unavailable]
      description: >-
        Run health of a long-running worker, shown instead of a timestamp when not ok. Workers only —
        a skill is invoked rather than run continuously, so it has no health of its own.

    WatchWorker:
      type: object
      description: A worker in the global worker catalog.
      required:
        - id
        - watchIds
        - lastRun
        - enabled
        - state
      properties:
        id:
          type: string
          description: >-
            Copy key — the UI resolves name and description from this id. Unique among workers only;
            Containment and Case assembly each exist as both a worker and a skill.
        watchIds:
          type: array
          items:
            type: string
          description: Watches this worker is attached to
        lastRun:
          type: string
          nullable: true
          description: ISO 8601 timestamp of last invocation, or null when never run or not running
        enabled:
          type: boolean
          description: Global flag. Effective enablement is this AND the per-watch attachment flag.
        state:
          $ref: '#/components/schemas/WorkerRunState'
        stateReason:
          type: string
          description: >-
            Why the worker is not in the ok state, e.g. which dependency is unavailable. Free prose
            rather than a copy key because it names runtime specifics, like WatchLedgerEntry.event.
        lifecycle:
          $ref: './watch.schema.yaml#/components/schemas/Lifecycle'
          description: Omitted for generally available workers; badge shown otherwise

    WatchSkill:
      type: object
      description: A skill in the global skill catalog.
      required:
        - id
        - watchIds
        - lastRun
      properties:
        id:
          type: string
          description: >-
            Copy key — the UI resolves name and description from this id. Unique among skills only.
        name:
          type: string
          description: >-
            Display name resolved from the Agent Builder registry at projection time.
        watchIds:
          type: array
          items:
            type: string
          description: Watches whose workers may call this skill
        summary:
          type: string
          description: >-
            Summary of the skill's purpose
        lastRun:
          type: string
          nullable: true
          description: ISO 8601 timestamp of last invocation, or null when never invoked
        lifecycle:
          $ref: './watch.schema.yaml#/components/schemas/Lifecycle'
          description: Omitted for generally available skills; badge shown otherwise

    WatchWorkerAttachment:
      type: object
      description: Per-watch enablement of a worker, ANDed with the worker's global flag
      required:
        - workerId
        - enabled
      properties:
        workerId:
          type: string
        enabled:
          type: boolean

    WatchSkillAttachment:
      type: object
      description: Per-watch enablement of a skill, ANDed with the skill's global flag
      required:
        - skillId
        - enabled
      properties:
        skillId:
          type: string
        enabled:
          type: boolean

    WatchSelectSetting:
      type: object
      description: A single-choice setting. Both ids resolve to copy in the UI.
      required:
        - optionIds
        - selectedId
      properties:
        optionIds:
          type: array
          items:
            type: string
        selectedId:
          type: string

    WatchTriggersSettings:
      type: object
      required:
        - sharedWithAttackDiscovery
        - schedule
        - allowManualRun
      properties:
        sharedWithAttackDiscovery:
          type: boolean
          description: >-
            Renders the "Shared with Attack Discovery" callout. Mocked — not wired to the real
            Attack Discovery API. Contested in the field, see programme decision D12.
        schedule:
          $ref: '#/components/schemas/WatchSelectSetting'
        allowManualRun:
          type: boolean

    WatchScopeRoutingSettings:
      type: object
      description: >-
        The data-boundary chips the design shows in this section are rendered from the watch's own
        `scopes`, which already carry a name and an access level, so they are not duplicated here.
      required:
        - dataSources
        - assigneeQueue
        - escalationContact
      properties:
        dataSources:
          $ref: '#/components/schemas/WatchSelectSetting'
        assigneeQueue:
          $ref: '#/components/schemas/WatchSelectSetting'
        escalationContact:
          $ref: '#/components/schemas/WatchSelectSetting'

    ApprovalRequirement:
      type: string
      enum: [always, high-impact, in-scope]
      description: >-
        always and high-impact require a named approver; in-scope is informational (the action has
        no side effects and runs within the watch's scope)

    WatchApprovalGate:
      type: object
      required:
        - id
        - requirement
        - requirementLocked
        - approverRoleId
      properties:
        id:
          type: string
          description: Copy key for the action type and its qualifier line
        requirement:
          $ref: '#/components/schemas/ApprovalRequirement'
        requirementLocked:
          type: boolean
          description: True renders static text instead of a select — consequential actions always gate
        approverRoleId:
          type: string
          nullable: true
          description: Null renders an em dash, used for gates that need no approver
        approverRoleOptionIds:
          type: array
          items:
            type: string
          description: Omitted when approverRoleId is null

    WatchRunOutcome:
      type: string
      enum: [awaiting-review, accepted, dismissed, executed, completed]

    WatchLedgerEntry:
      type: object
      description: One row of the per-watch run ledger
      required:
        - id
        - time
        - callableId
        - action
        - event
        - outcome
      properties:
        id:
          type: string
        time:
          type: string
          description: ISO 8601 timestamp
        callableId:
          type: string
          description: Copy key for the workflow or skill that ran
        action:
          $ref: './watch.schema.yaml#/components/schemas/WatchRunAction'
        event:
          type: string
          description: >-
            Run-generated headline, e.g. "Drafted a case — mailbox rules are good". Free prose
            rather than a copy key because it is produced per run, matching WatchRecentRun.summary.
        outcome:
          $ref: '#/components/schemas/WatchRunOutcome'

    WatchSettings:
      type: object
      description: >-
        Legacy per-watch settings projection. Watches are grouping-only; durable settings live on
        WorkerSettings. Kept so unused mock fixtures continue to parse.
      required:
        - watchId
        - autonomy
      properties:
        watchId:
          type: string
        autonomy:
          $ref: '#/components/schemas/WatchAutonomyLevel'

    SharedOnlyWorkerSettings:
      type: object
      additionalProperties: false
      description: >-
        Complete settings for a Worker that only carries the shared autonomy dial. Watch-owned
        custom fields are absent by construction.
      required:
        - workerId
        - autonomy
      properties:
        workerId:
          type: string
        autonomy:
          $ref: '#/components/schemas/WatchAutonomyLevel'

    ScheduledWorkerSettings:
      type: object
      additionalProperties: false
      description: Complete settings for a schedule-driven Worker with no Watch-owned custom fields.
      required:
        - workerId
        - autonomy
        - scheduleInterval
      properties:
        workerId:
          type: string
        autonomy:
          $ref: '#/components/schemas/WatchAutonomyLevel'
        scheduleInterval:
          $ref: '#/components/schemas/WorkerScheduleInterval'

    RuleTuningWorkerSettings:
      type: object
      additionalProperties: false
      description: >-
        Complete Detection Watch / Rule Tuning settings. Owned by Detection Watch; CWL reviews
        the field list and UI, the Watch team owns the values.
      required:
        - workerId
        - autonomy
        - scheduleInterval
        - extras
      properties:
        workerId:
          type: string
          enum: [system-security-detection-rule-tuning]
        autonomy:
          $ref: '#/components/schemas/WatchAutonomyLevel'
        scheduleInterval:
          $ref: '#/components/schemas/WorkerScheduleInterval'
        extras:
          $ref: '#/components/schemas/RuleTuningWorkerExtras'

    AlertTriageWorkerSettings:
      type: object
      additionalProperties: false
      description: >-
        Complete Alert Triage settings. Detection tuning thresholds were removed from the
        contract: the Alert Triage workflow is a classification stub with no auto-close step
        to consume them, so exposing thresholds would be settings storage without a consumer
        (worker-settings-page-decisions-3, item 9).
      required:
        - workerId
        - autonomy
      properties:
        workerId:
          type: string
          enum: [system-security-floor-alert-triage]
        autonomy:
          $ref: '#/components/schemas/WatchAutonomyLevel'

    RuleTuningWorkerExtras:
      type: object
      additionalProperties: false
      description: >-
        Watch-owned custom fields for Detection Rule Tuning. Closed per-Worker schema; unknown
        keys are rejected with the field name so a misspelled custom setting cannot silently
        persist. Replaces whole-object on write (worker-settings-page-decisions-3, items 5+12).
      required:
        - analysisWindowDays
      properties:
        analysisWindowDays:
          $ref: '#/components/schemas/AnalysisWindowDays'

    WorkerSettings:
      type: object
      additionalProperties: false
      description: >-
        Durable per-Worker settings stored as managed template values. Shared fields plus any
        Watch-owned custom fields that Worker declares. Unknown keys are rejected. Completeness
        for a given Worker is the matching SharedOnlyWorkerSettings, ScheduledWorkerSettings,
        RuleTuningWorkerSettings, or AlertTriageWorkerSettings schema.
      required:
        - workerId
        - autonomy
      properties:
        workerId:
          type: string
        autonomy:
          $ref: '#/components/schemas/WatchAutonomyLevel'
        scheduleInterval:
          $ref: '#/components/schemas/WorkerScheduleInterval'
          description: >-
            Omitted for Workers that are not schedule-driven. Its presence is what tells the UI to
            render the interval control.
        extras:
          type: object
          additionalProperties: false
          description: >-
            Watch-owned custom fields this Worker declares. Which keys exist is decided by the
            Worker's complete schema (e.g. RuleTuningWorkerExtras); the shape here is the union
            for API read. Replaces whole-object on write. Omitted when the Worker owns none.
          properties:
            analysisWindowDays:
              $ref: '#/components/schemas/AnalysisWindowDays'

    WorkerSettingsWrite:
      type: object
      additionalProperties: false
      description: >-
        Partial settings patch. Field names match WorkerSettings. Omitted fields keep their stored
        values; unknown keys and wrong-Worker fields are rejected. extras replaces the whole
        stored object when present.
      properties:
        autonomy:
          $ref: '#/components/schemas/WatchAutonomyLevel'
        scheduleInterval:
          $ref: '#/components/schemas/WorkerScheduleInterval'
        extras:
          $ref: '#/components/schemas/WorkerSettingsWriteExtras'

    WorkerSettingsWriteExtras:
      type: object
      additionalProperties: false
      description: >-
        Watch-owned custom fields a Client may write. Union of all Workers' custom fields;
        the server validates against the target Worker's complete schema, so a field another
        Worker owns is rejected here.
      properties:
        analysisWindowDays:
          $ref: '#/components/schemas/AnalysisWindowDays'
    Worker:
      type: object
      description: A live registered Worker with Watch membership and durable settings.
      required:
        - id
        - name
        - watchIds
        - enabled
        - lastRun
        - state
        - settings
        - settingsRevision
        - allowedAutonomyLevels
      properties:
        id:
          type: string
        name:
          type: string
        watchIds:
          type: array
          items:
            type: string
          description: Catalog Watch ids this Worker belongs to, derived from YAML tags
        enabled:
          type: boolean
        lastRun:
          type: string
          nullable: true
        state:
          $ref: '#/components/schemas/WorkerRunState'
        stateReason:
          type: string
        lifecycle:
          $ref: './watch.schema.yaml#/components/schemas/Lifecycle'
        settings:
          $ref: '#/components/schemas/WorkerSettings'
        allowedAutonomyLevels:
          $ref: '#/components/schemas/AllowedAutonomyLevels'
        settingsRevision:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: >-
            Logical workflow version for best-effort stale settings detection. Null when the
            per-space managed Worker has not been installed yet.
        skills:
          type: array
          items:
            $ref: './watch.schema.yaml#/components/schemas/WatchCallableRef'
