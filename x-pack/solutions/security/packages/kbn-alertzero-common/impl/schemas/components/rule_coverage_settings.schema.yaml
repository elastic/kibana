openapi: 3.0.0
info:
  title: AlertZero Rule Coverage Worker settings
  version: '1'
paths: {}
components:
  x-codegen-enabled: true
  schemas:
    LookbackDays:
      type: integer
      # A review can park 176h on its gate and an expired one is retried only while its gap
      # is still inside the window, so the floor stays above a week.
      minimum: 8
      maximum: 90
      description: >-
        How many days back the sweep looks for pending coverage gaps. Matches the coverage
        sweep's lookback_days input.

    MaxGapsPerRun:
      type: integer
      minimum: 1
      maximum: 50
      description: >-
        How many coverage gap reviews one scheduled run starts. Matches the coverage sweep's
        batch_size input.

    RuleCoverageWorkerExtras:
      type: object
      additionalProperties: false
      description: >-
        Complete Worker-specific settings for the Rule Coverage Worker. Sent whole on write. A
        replacement missing a field is rejected.
      required:
        - lookbackDays
        - maxGapsPerRun
      properties:
        lookbackDays:
          $ref: '#/components/schemas/LookbackDays'
        maxGapsPerRun:
          $ref: '#/components/schemas/MaxGapsPerRun'
