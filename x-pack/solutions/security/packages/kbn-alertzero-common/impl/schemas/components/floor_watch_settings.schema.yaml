openapi: 3.0.0
info:
  title: AlertZero Floor Watch Worker-specific settings
  version: '1'
paths: {}
components:
  x-codegen-enabled: true
  schemas:
    AttackDiscoveryAgentId:
      type: string
      minLength: 1
      maxLength: 64
      description: >-
        Agent Builder agent the Attack Discovery Worker runs with. Carried from the Worker through
        the runner to each per-discovery review, where it opens the investigation conversation. Max
        length matches Agent Builder's agentIdMaxLength.

    AttackDiscoveryWorkerExtras:
      type: object
      additionalProperties: false
      description: >-
        Complete Worker-specific settings for the Attack Discovery Worker, owned by Floor Watch.
        Sent whole on write. Every field is optional and the object itself may be omitted: the
        Worker declares no default extras, so a Worker that has never had an agent picked stores no
        `extras` key at all and the review opens its conversation with the default agent.
      properties:
        agentId:
          $ref: '#/components/schemas/AttackDiscoveryAgentId'
