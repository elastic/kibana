openapi: 3.0.0
info:
  title: AlertZero Floor Watch Worker-specific settings
  version: '1'
paths: {}
components:
  x-codegen-enabled: true
  schemas:
    AutoCloseConfidenceScoreMinThreshold:
      type: number
      minimum: 0
      maximum: 1
      description: >-
        Minimum confidence score (0–1) for the Alert Triage Worker to auto-close an alert
        as a false positive. Alerts below this threshold require human review.

    BudgetPerHour:
      type: integer
      minimum: 10
      maximum: 5000
      description: >-
        Triage work the sweep may plan per hour, in cost units (a batch costs a fixed overhead
        plus a cost per alert). Scaled to the sweep interval, so changing the interval does not
        change the hourly total.

    LookbackHours:
      type: integer
      minimum: 1
      maximum: 168
      description: >-
        How many hours back the sweep looks for alerts to triage. Older pending alerts are
        tagged stale instead of analysed.

    AlertTriageWorkerExtras:
      type: object
      additionalProperties: false
      description: >-
        Complete Worker-specific settings for the Alert Triage Worker, owned by Floor Watch.
        Sent whole on write; a replacement missing a field is rejected.
      required:
        - autoCloseConfidenceScoreMinThreshold
        - budgetPerHour
        - lookbackHours
      properties:
        autoCloseConfidenceScoreMinThreshold:
          $ref: '#/components/schemas/AutoCloseConfidenceScoreMinThreshold'
        budgetPerHour:
          $ref: '#/components/schemas/BudgetPerHour'
        lookbackHours:
          $ref: '#/components/schemas/LookbackHours'
