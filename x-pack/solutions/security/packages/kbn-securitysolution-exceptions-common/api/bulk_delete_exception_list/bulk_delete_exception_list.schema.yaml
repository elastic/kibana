openapi: 3.0.0
info:
  title: Bulk delete exception lists API endpoint
  version: '2023-10-31'
paths:
  /api/exception_lists/_bulk_delete:
    post:
      x-labels: [serverless, ess]
      operationId: BulkDeleteExceptionLists
      x-codegen-enabled: true
      summary: Bulk delete exception lists
      description: |
        Delete multiple exception lists using either their `id` or `list_id` field. Provide
        exactly one of `ids` or `list_ids`, each containing at least one entry; mixing both in
        the same request is not supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required:
                    - ids
                  properties:
                    ids:
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        $ref: '../model/exception_list_common.schema.yaml#/components/schemas/ExceptionListId'
                      description: Array of exception list saved object identifiers.
                    namespace_type:
                      description: |
                        `single` deletes lists in the current Kibana space; `agnostic` deletes global
                        lists. Applies to every list in the request.
                      $ref: '../model/exception_list_common.schema.yaml#/components/schemas/ExceptionNamespaceType'
                      default: single
                - type: object
                  additionalProperties: false
                  required:
                    - list_ids
                  properties:
                    list_ids:
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        $ref: '../model/exception_list_common.schema.yaml#/components/schemas/ExceptionListHumanId'
                      description: Array of human readable exception list string identifiers.
                    namespace_type:
                      description: |
                        `single` deletes lists in the current Kibana space; `agnostic` deletes global
                        lists. Applies to every list in the request.
                      $ref: '../model/exception_list_common.schema.yaml#/components/schemas/ExceptionNamespaceType'
                      default: single
              examples:
                byListIds:
                  value:
                    list_ids: [simple_list_1, simple_list_2]
                    namespace_type: single
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: array
                    items:
                      $ref: '../model/exception_list_common.schema.yaml#/components/schemas/ExceptionList'
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          $ref: '../model/exception_list_common.schema.yaml#/components/schemas/ExceptionListId'
                        list_id:
                          $ref: '../model/exception_list_common.schema.yaml#/components/schemas/ExceptionListHumanId'
                        error:
                          type: object
                          properties:
                            message:
                              type: string
                            status_code:
                              type: integer
                          required:
                            - message
                            - status_code
                      required:
                        - error
                required:
                  - deleted
                  - errors
              examples:
                partialFailure:
                  value:
                    deleted:
                      - id: 9e5fc75a-a3da-46c5-96e3-a2ec59c6bb85
                        list_id: simple_list_1
                        type: detection
                        name: Sample Detection Exception List
                        description: This is a sample detection type exception list.
                        immutable: false
                        namespace_type: single
                        os_types: [linux]
                        tags: [malware]
                        version: 1
                        _version: WzIsMV0=
                        tie_breaker_id: 78f1aca1-f8ee-4eb5-9ceb-f5c3ee656cb3
                        created_at: 2025-01-07T19:34:27.942Z
                        created_by: elastic
                        updated_at: 2025-01-07T19:34:27.942Z
                        updated_by: elastic
                    errors:
                      - list_id: simple_list_2
                        error:
                          message: 'exception list list_id: "simple_list_2" does not exist'
                          status_code: 404
        400:
          description: Invalid input data response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '../../../../../../../src/platform/packages/shared/kbn-openapi-common/schemas/error_responses.schema.yaml#/components/schemas/PlatformErrorResponse'
                  - $ref: '../../../../../../../src/platform/packages/shared/kbn-openapi-common/schemas/error_responses.schema.yaml#/components/schemas/SiemErrorResponse'
              examples:
                badRequest:
                  value:
                    statusCode: 400
                    error: Bad Request
                    message: 'Exactly one of "ids" or "list_ids" must be provided, each with at least one entry'
        401:
          description: Unsuccessful authentication response
          content:
            application/json:
              schema:
                $ref: '../../../../../../../src/platform/packages/shared/kbn-openapi-common/schemas/error_responses.schema.yaml#/components/schemas/PlatformErrorResponse'
              examples:
                unauthorized:
                  value:
                    statusCode: 401
                    error: Unauthorized
                    message: '[security_exception\n\tRoot causes:\n\t\tsecurity_exception: unable to authenticate user [elastic] for REST request [/_security/_authenticate]]: unable to authenticate user [elastic] for REST request [/_security/_authenticate]'
        403:
          description: Not enough privileges response
          content:
            application/json:
              schema:
                $ref: '../../../../../../../src/platform/packages/shared/kbn-openapi-common/schemas/error_responses.schema.yaml#/components/schemas/PlatformErrorResponse'
              examples:
                forbidden:
                  value:
                    statusCode: 403
                    error: Forbidden
                    message: 'API [POST /api/exception_lists/_bulk_delete] is unauthorized for user, this action is granted by the Kibana privileges [lists-all]'
        500:
          description: Internal server error response
          content:
            application/json:
              schema:
                $ref: '../../../../../../../src/platform/packages/shared/kbn-openapi-common/schemas/error_responses.schema.yaml#/components/schemas/SiemErrorResponse'
              examples:
                serverError:
                  value:
                    message: Internal Server Error
                    status_code: 500
