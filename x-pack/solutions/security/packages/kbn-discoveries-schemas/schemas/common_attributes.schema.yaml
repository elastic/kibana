openapi: 3.0.0
info:
  title: Common Security Insights Attributes
  version: 'not applicable'
paths: {}
components:
  x-codegen-enabled: true
  schemas:
    NonEmptyString:
      type: string
      format: nonempty
      minLength: 1
      maxLength: 1024
      description: A string that does not contain only whitespace characters.
      example: "I am a string"

    NonEmptyTimestamp:
      type: string
      format: nonempty
      minLength: 1
      description: A string that represents a timestamp in ISO 8601 format and does not contain only whitespace characters.
      example: "2023-10-31T12:00:00Z"

    UUID:
      type: string
      format: uuid
      description: A universally unique identifier.
      example: "123e4567-e89b-12d3-a456-426614174000"

    User:
      type: object
      description: Could be any string, not necessarily a UUID.
      properties:
        id:
          type: string
          description: User id.
          example: "user123"
        name:
          type: string
          description: User name.
          example: "John Doe"

    Replacements:
      type: object
      description: Map of anonymized values to original values
      additionalProperties:
        type: string

    ConfidenceFactor:
      type: object
      description: A single contributing factor behind a confidence score
      required:
        - name
        - assessment
      properties:
        name:
          type: string
          maxLength: 1024
        assessment:
          type: string
          maxLength: 4096
        weight:
          type: number
        evidence:
          type: string
          maxLength: 4096

    Confidence:
      type: object
      description: Calibrated confidence for an attack discovery (how sure it is real; orthogonal to severity)
      required:
        - score
        - rationale
        - factors
      properties:
        score:
          type: number
          description: Confidence from 0.0 (not sure) to 1.0 (certain)
        band:
          type: string
          enum:
            - high
            - medium
            - low
        rationale:
          type: string
          maxLength: 4096
        factors:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ConfidenceFactor'

    Provider:
      type: string
      description: LLM Provider
      enum:
        - OpenAI
        - Azure OpenAI
        - Other
      example: 'OpenAI'

    ApiConfig:
      type: object
      description: LLM API configuration
      required:
        - connector_id
      properties:
        connector_id:
          type: string
          maxLength: 1024
          description: Connector ID
          example: 'connector123'
        action_type_id:
          type: string
          maxLength: 1024
          description: Action type ID
          example: 'actionType456'
        default_system_prompt_id:
          type: string
          maxLength: 1024
          description: Default system prompt ID
          example: 'systemPrompt001'
        provider:
          $ref: '#/components/schemas/Provider'
          description: Provider
          example: 'OpenAI'
        model:
          type: string
          maxLength: 1024
          description: Model
          example: 'gpt-4'




