openapi: 3.0.0
info:
  title: List PND Conversations API endpoint
  version: '1'
paths:
  /internal/pnd/conversations:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: ListConversations
      description: List PND conversations derived from Attack Discovery 2.0 alerts
      summary: List conversations
      tags:
        - PND API
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [investigation, incident, tuning, thread]
          description: >
            Restrict to one conversation kind. When `incident` or `investigation`,
            the page of that kind is the group list; nested children of those
            parents (threads, and for incidents also tuning plus the originating
            investigation) are appended so the client can nest without a second
            unbounded read. `total` still counts only the requested kind.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: >
            1-based page of the requested kind. Omit together with perPage to
            return the full matching set. Has no default — callers that need the
            whole projection (lifecycle, queue) send neither.
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: >
            Page size of the requested kind, bounded to prevent unbounded-input
            reads. Omit together with page to return the full matching set.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    maxItems: 10000
                    items:
                      $ref: '../components/conversation.schema.yaml#/components/schemas/PndConversation'
                  total:
                    type: integer
                    minimum: 0
                required:
                  - conversations
                  - total
