openapi: 3.0.0
info:
  title: Get PND Execution projection API endpoint
  version: '1'
paths:
  /internal/pnd/executions/{correlationId}:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: GetExecution
      description: >
        The four-phase execution projection for an Attack Discovery 2.0 alert: one
        row per phase-catalog step, aggregated across both the Watch Floor and
        Post-Incident Watch orchestrator executions.
      summary: Get execution projection
      tags:
        - PND API
      parameters:
        - name: correlationId
          in: path
          required: true
          schema:
            type: string
            maxLength: 1024
          description: Attack Discovery 2.0 alert id
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  correlationId:
                    type: string
                    maxLength: 1024
                  steps:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '../components/execution.schema.yaml#/components/schemas/PndPhaseStepProjection'
                  containmentActions:
                    type: array
                    maxItems: 200
                    description: >-
                      Per-action containment execution ledger, projected from the Watch Floor run's
                      collect_executed_actions step output. Absent until the containment gate has
                      been answered and the execute steps have recorded outcomes.
                    items:
                      type: object
                      additionalProperties: true
                required:
                  - correlationId
                  - steps
