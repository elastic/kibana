openapi: 3.0.0
info:
  title: Set up PND Watches API endpoint
  version: '1'
paths:
  /internal/pnd/watches/setup:
    post:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: SetupWatches
      description: Create the customer-owned Security Watch starting points that do not exist
      summary: Set up watch starting points
      tags:
        - PND API
      responses:
        '200':
          description: Setup result
          content:
            application/json:
              schema:
                type: object
                required:
                  - created
                  - existing
                  - failed
                properties:
                  created:
                    type: array
                    items:
                      type: string
                      maxLength: 128
                  existing:
                    type: array
                    items:
                      type: string
                      maxLength: 128
                  failed:
                    type: array
                    items:
                      type: string
                      maxLength: 128
