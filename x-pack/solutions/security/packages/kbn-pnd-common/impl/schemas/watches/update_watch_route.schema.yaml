openapi: 3.0.0
info:
  title: Update PND Watch API endpoint
  version: '1'
paths:
  /internal/pnd/watches/{watchId}:
    patch:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: UpdateWatch
      description: >-
        Update a Security Watch and its settings. A watch and its settings are patched through one
        endpoint because they are one thing to the user, and because settings will eventually be
        applied to the managed workflow definition the watch is projected from. Every field is
        optional so the UI sends only what changed.
      summary: Update watch
      tags:
        - PND API
      parameters:
        - name: watchId
          in: path
          required: true
          schema:
            type: string
          description: Managed or custom watch workflow id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: >-
                    Written to the backing workflow as an enablement-only update, which is the one
                    mutation permitted on a managed workflow.
                autonomyLevel:
                  $ref: '../components/watch_settings.schema.yaml#/components/schemas/WatchAutonomyLevel'
                triggers:
                  type: object
                  properties:
                    scheduleId:
                      type: string
                      minLength: 1
                      maxLength: 128
                    allowManualRun:
                      type: boolean
                scopeRouting:
                  type: object
                  description: Each value is an option id the watch offers; unknown ids are rejected.
                  properties:
                    dataSources:
                      type: string
                      minLength: 1
                      maxLength: 128
                    assigneeQueue:
                      type: string
                      minLength: 1
                      maxLength: 128
                    escalationContact:
                      type: string
                      minLength: 1
                      maxLength: 128
                approvalGate:
                  type: object
                  required:
                    - gateId
                  properties:
                    gateId:
                      type: string
                      minLength: 1
                      maxLength: 128
                    requirement:
                      $ref: '../components/watch_settings.schema.yaml#/components/schemas/ApprovalRequirement'
                    approverRoleId:
                      type: string
                      minLength: 1
                      maxLength: 128
                worker:
                  type: object
                  description: Per-watch worker attachment. The global flag is patched via /workers.
                  required:
                    - workerId
                    - enabled
                  properties:
                    workerId:
                      type: string
                      minLength: 1
                      maxLength: 128
                    enabled:
                      type: boolean
                skill:
                  type: object
                  description: Per-watch skill attachment. The global flag is patched via /skills.
                  required:
                    - skillId
                    - enabled
                  properties:
                    skillId:
                      type: string
                      minLength: 1
                      maxLength: 128
                    enabled:
                      type: boolean
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  watch:
                    $ref: '../components/watch.schema.yaml#/components/schemas/Watch'
                  settings:
                    $ref: '../components/watch_settings.schema.yaml#/components/schemas/WatchSettings'
                required:
                  - watch
