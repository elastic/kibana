openapi: 3.0.0
info:
  title: Update PND Watch API endpoint
  version: '1'
paths:
  /internal/pnd/watches/{watchId}:
    put:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: UpdateWatch
      description: Replace the editable settings of a customer-owned Security Watch
      summary: Update watch settings
      tags:
        - PND API
      parameters:
        - name: watchId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
          description: Watch workflow id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/watch.schema.yaml#/components/schemas/WatchSettings'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  watch:
                    $ref: '../components/watch.schema.yaml#/components/schemas/Watch'
                required:
                  - watch
