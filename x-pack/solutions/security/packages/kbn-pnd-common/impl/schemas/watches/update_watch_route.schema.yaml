openapi: 3.0.0
info:
  title: Update PND Watch API endpoint
  version: '1'
paths:
  /internal/pnd/watches/{watchId}:
    patch:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: UpdateWatch
      description: >-
        Update a Security Watch and its settings. A watch and its settings are patched through one
        endpoint because they are one thing to the user and settings are applied to the managed
        workflow definition the watch is projected from. Settings writes carry the revision returned
        by GET for best-effort stale-read detection; this is not an atomic write guard.
      summary: Update watch
      tags:
        - PND API
      parameters:
        - name: watchId
          in: path
          required: true
          schema:
            type: string
          description: Managed or custom watch workflow id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: >-
                    Enables or disables the backing workflow. Enabling an uninstalled built-in watch
                    first installs its per-space managed document.
                settingsRevision:
                  type: integer
                  format: int64
                  minimum: 0
                  nullable: true
                  description: >-
                    Revision returned by GET. Required when any settings field is present; null
                    asserts that the per-space managed watch has not been installed yet.
                autonomyLevel:
                  $ref: '../components/watch_settings.schema.yaml#/components/schemas/WatchAutonomyLevel'
                triggers:
                  type: object
                  properties:
                    scheduleId:
                      type: string
                      minLength: 1
                      maxLength: 128
                    allowManualRun:
                      type: boolean
                scopeRouting:
                  type: object
                  description: Each value is an option id the watch offers; unknown ids are rejected.
                  properties:
                    dataSources:
                      type: string
                      minLength: 1
                      maxLength: 128
                    assigneeQueue:
                      type: string
                      minLength: 1
                      maxLength: 128
                    escalationContact:
                      type: string
                      minLength: 1
                      maxLength: 128
                approvalGate:
                  type: object
                  required:
                    - gateId
                  properties:
                    gateId:
                      type: string
                      minLength: 1
                      maxLength: 128
                    requirement:
                      $ref: '../components/watch_settings.schema.yaml#/components/schemas/ApprovalRequirement'
                    approverRoleId:
                      type: string
                      minLength: 1
                      maxLength: 128
                worker:
                  type: object
                  description: Per-watch worker attachment. The global flag is patched via /workers.
                  required:
                    - workerId
                    - enabled
                  properties:
                    workerId:
                      type: string
                      minLength: 1
                      maxLength: 128
                    enabled:
                      type: boolean
                skill:
                  type: object
                  description: Per-watch skill attachment. The global flag is patched via /skills.
                  required:
                    - skillId
                    - enabled
                  properties:
                    skillId:
                      type: string
                      minLength: 1
                      maxLength: 128
                    enabled:
                      type: boolean
                dark:
                  type: object
                  description: >-
                    Partial Dark Watch settings patch. Only valid for system-security-watch-dark;
                    other watches reject it.
                  properties:
                    connectorId:
                      type: string
                      maxLength: 256
                    tier2When:
                      $ref: '../components/watch_settings.schema.yaml#/components/schemas/DarkWatchTier2When'
                    candidateLimit:
                      type: integer
                      minimum: 1
                      maximum: 100
                    fanOutMax:
                      type: integer
                      minimum: 1
                      maximum: 20
                    scheduleEveryMinutes:
                      type: integer
                      minimum: 1
                      maximum: 10080
                    targetTechnology:
                      $ref: '../components/watch_settings.schema.yaml#/components/schemas/DarkWatchTargetTechnology'
                    leadPollIntervalMinutes:
                      type: integer
                      minimum: 1
                      maximum: 10080
                    leadMinPriority:
                      type: integer
                      minimum: 0
                      maximum: 100
                    intelEventTriggerEnabled:
                      type: boolean
                    scheduleId:
                      type: string
                      minLength: 1
                      maxLength: 128
                    allowManualRun:
                      type: boolean
                    scopes:
                      type: array
                      maxItems: 32
                      items:
                        $ref: '../components/watch_settings.schema.yaml#/components/schemas/DarkWatchScope'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  watch:
                    $ref: '../components/watch.schema.yaml#/components/schemas/Watch'
                  settings:
                    $ref: '../components/watch_settings.schema.yaml#/components/schemas/WatchSettings'
                  settingsRevision:
                    type: integer
                    format: int64
                    minimum: 0
                    nullable: true
                    description: Current logical workflow version after the update
                required:
                  - watch
                  - settingsRevision
        '409':
          description: The settings changed before this request began applying its patch
        '400':
          description: The settings patch is unsupported or omitted its revision
