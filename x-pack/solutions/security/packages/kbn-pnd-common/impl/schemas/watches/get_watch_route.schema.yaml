openapi: 3.0.0
info:
  title: Get PND Watch API endpoint
  version: '1'
paths:
  /internal/pnd/watches/{watchId}:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: GetWatch
      description: Get a single Security Watch by id
      summary: Get watch
      tags:
        - PND API
      parameters:
        - name: watchId
          in: path
          required: true
          schema:
            type: string
          description: Managed or custom watch workflow id
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  watch:
                    $ref: '../components/watch.schema.yaml#/components/schemas/Watch'
                  settings:
                    $ref: '../components/watch_settings.schema.yaml#/components/schemas/WatchSettings'
                    description: >-
                      Omitted when the watch has no settings to expose, which is the case for live
                      projected watches until settings are applied to the managed workflow definition.
                required:
                  - watch
