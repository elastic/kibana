openapi: 3.0.0
info:
  title: PND Watch settings component schemas
  version: '1'
paths: {}
components:
  x-codegen-enabled: true
  schemas:
    WatchAutonomyLevel:
      type: string
      enum: [manual, assisted, supervised]
      description: >-
        Autonomy dial levels per programme decision D15 (2026-07-28). Manual is the MVP default.
        There is deliberately no mapping from the legacy 1–5 AutonomyLevel scale — see
        https://github.com/elastic/security-team/issues/18718.

    LifecyclePhase:
      type: string
      enum: [signal_triage, investigation, incident_response, post_incident]
      description: >-
        One of the four lifecycle phases. Mirrors PHASE_IDS, which is hand-written because the phase
        catalog is not generated; `schemas.test.ts` pins the two together so this enum cannot drift.

    WatchWorker:
      type: object
      description: >-
        A worker: one `ai.agent` step of a watch's lane, projected from the managed workflow
        definition against the agents PND installs (kibana-phf4.6). Read-only, and deliberately
        carrying no `enabled`, `lastRun` or run-health field. Those described a worker as a
        long-running service with a global flag and a per-watch attachment, which no such thing ever
        was: nothing wrote the flag through to execution, so the switch moved a number in an
        in-memory store and the timestamps were seeded. A projection has nothing to toggle, so
        `PATCH /internal/pnd/workers/{workerId}` refuses outright rather than accepting a
        write it would drop.
      required:
        - agentId
        - agentName
        - id
        - phase
        - skillIds
        - watchIds
      properties:
        agentId:
          type: string
          description: >-
            The Agent Builder agent the step runs, resolved from the step's `agent-id` template.
            Always one of the three agents PND installs — a step whose agent PND does not own is
            not projected at all.
        agentName:
          type: string
          description: >-
            The agent's name as installed, e.g. "Watch Investigator". Travels in the payload rather
            than living in UI copy because it is the name of a record in Agent Builder, not a label
            this app chose.
        id:
          type: string
          description: >-
            The orchestrator step name, e.g. open_investigation. Unique across the projection, and
            the copy key the UI resolves a display name and description from.
        phase:
          $ref: '#/components/schemas/LifecyclePhase'
          description: >-
            The phase catalog row whose orchestratorStepId is this step name, falling back to the
            phase its agent serves.
        skillIds:
          type: array
          items:
            type: string
          description: >-
            The agent's configured skills. Agent Builder owns these; PND only names them, which is
            why there is no PND skill catalog behind them.
        watchIds:
          type: array
          items:
            type: string
          description: Watches whose lane declares this step. Usually one.

    WatchSkill:
      type: object
      description: A skill in the global skill catalog.
      required:
        - id
        - watchIds
        - lastRun
        - enabled
      properties:
        id:
          type: string
          description: >-
            Copy key — the UI resolves name and description from this id. Unique among skills only.
        watchIds:
          type: array
          items:
            type: string
          description: Watches whose workers may call this skill
        lastRun:
          type: string
          nullable: true
          description: ISO 8601 timestamp of last invocation, or null when never invoked
        enabled:
          type: boolean
          description: Global flag. Effective enablement is this AND the per-watch attachment flag.
        lifecycle:
          $ref: './watch.schema.yaml#/components/schemas/Lifecycle'
          description: Omitted for generally available skills; badge shown otherwise

    WatchSkillAttachment:
      type: object
      description: Per-watch enablement of a skill, ANDed with the skill's global flag
      required:
        - skillId
        - enabled
      properties:
        skillId:
          type: string
        enabled:
          type: boolean

    WatchSelectSetting:
      type: object
      description: A single-choice setting. Both ids resolve to copy in the UI.
      required:
        - optionIds
        - selectedId
      properties:
        optionIds:
          type: array
          items:
            type: string
        selectedId:
          type: string

    WatchTriggersSettings:
      type: object
      required:
        - sharedWithAttackDiscovery
        - schedule
        - allowManualRun
      properties:
        sharedWithAttackDiscovery:
          type: boolean
          description: >-
            Renders the "Shared with Attack Discovery" callout. Mocked — not wired to the real
            Attack Discovery API. Contested in the field, see programme decision D12.
        schedule:
          $ref: '#/components/schemas/WatchSelectSetting'
        allowManualRun:
          type: boolean

    WatchScopeRoutingSettings:
      type: object
      description: >-
        The data-boundary chips the design shows in this section are rendered from the watch's own
        `scopes`, which already carry a name and an access level, so they are not duplicated here.
      required:
        - dataSources
        - assigneeQueue
        - escalationContact
      properties:
        dataSources:
          $ref: '#/components/schemas/WatchSelectSetting'
        assigneeQueue:
          $ref: '#/components/schemas/WatchSelectSetting'
        escalationContact:
          $ref: '#/components/schemas/WatchSelectSetting'

    ApprovalRequirement:
      type: string
      enum: [always, high-impact, in-scope]
      description: >-
        always and high-impact require a named approver; in-scope is informational (the action has
        no side effects and runs within the watch's scope)

    WatchApprovalGate:
      type: object
      required:
        - id
        - requirement
        - requirementLocked
        - approverRoleId
      properties:
        id:
          type: string
          description: Copy key for the action type and its qualifier line
        requirement:
          $ref: '#/components/schemas/ApprovalRequirement'
        requirementLocked:
          type: boolean
          description: True renders static text instead of a select — consequential actions always gate
        approverRoleId:
          type: string
          nullable: true
          description: Null renders an em dash, used for gates that need no approver
        approverRoleOptionIds:
          type: array
          items:
            type: string
          description: Omitted when approverRoleId is null

    WatchRunOutcome:
      type: string
      enum: [awaiting-review, accepted, dismissed, executed, completed]

    WatchLedgerEntry:
      type: object
      description: One row of the per-watch run ledger
      required:
        - id
        - time
        - callableId
        - action
        - event
        - outcome
      properties:
        id:
          type: string
        time:
          type: string
          description: ISO 8601 timestamp
        callableId:
          type: string
          description: Copy key for the workflow or skill that ran
        action:
          $ref: './watch.schema.yaml#/components/schemas/WatchRunAction'
        event:
          type: string
          description: >-
            Run-generated headline, e.g. "Drafted a case — mailbox rules are good". Free prose
            rather than a copy key because it is produced per run, matching WatchRecentRun.summary.
        outcome:
          $ref: '#/components/schemas/WatchRunOutcome'

    WatchSettings:
      type: object
      description: >-
        Per-watch settings. Optional sections are absent when a watch does not offer them, which is
        what lets each watch legitimately render a different set of sections. There is deliberately
        no `workers` section: a WatchWorker already carries the watches whose lane declares it, so
        the settings page filters GET /internal/pnd/workers by watch id rather than storing a second,
        writable copy of the same fact (kibana-phf4.6).
      required:
        - watchId
        - autonomy
      properties:
        watchId:
          type: string
        autonomy:
          $ref: '#/components/schemas/WatchAutonomyLevel'
          description: >-
            The selected level. The scale itself is shared across every watch, so it is not repeated
            per watch — see WATCH_AUTONOMY_LEVELS.
        triggers:
          $ref: '#/components/schemas/WatchTriggersSettings'
        scopeRouting:
          $ref: '#/components/schemas/WatchScopeRoutingSettings'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/WatchSkillAttachment'
        approvalGates:
          type: array
          description: >-
            No longer seeded, and no longer rendered anywhere: the 2026-08-10 design deleted the
            Approval gates section of the Watch settings page, which was this field's only surface
            (kibana-phf4.33). The field and WatchApprovalGate stay because they are #284009's shape
            and removing them would break every importer for no design reason. PATCH
            /internal/pnd/watches/{watchId} refuses to write them.
          items:
            $ref: '#/components/schemas/WatchApprovalGate'
        runsLedger:
          type: array
          items:
            $ref: '#/components/schemas/WatchLedgerEntry'
