openapi: 3.0.0
info:
  title: PND Investigation component schemas
  version: '1'
paths: {}
components:
  x-codegen-enabled: true
  schemas:
    TemplateId:
      type: string
      enum: [investigation, proposal, incident]

    RecommendedAction:
      type: string
      enum: [contain, escalate, investigate, tune]
      description: Brief bucket recommendation for an investigation

    ProposalStatus:
      type: string
      enum: [pending, approved, modified, dismissed, executed]

    WatchTier:
      type: string
      enum: [floor, officer, dark, deep, detection]

    EvidenceRef:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
        type:
          type: string
          description: Attachment or document type (e.g. alert, log, case)
        label:
          type: string
        url:
          type: string

    TimelineEvent:
      type: object
      required:
        - id
        - timestamp
        - type
        - summary
      properties:
        id:
          type: string
        timestamp:
          type: string
          description: ISO 8601 timestamp
        type:
          type: string
          description: Event category (e.g. triage, proposal, escalation)
        summary:
          type: string
        actor:
          type: string
          nullable: true
          description: User or watch that produced the event

    Investigation:
      type: object
      required:
        - id
        - template_id
        - title
        - createdAt
        - updatedAt
        - watch_id
        - watch_execution_id
        - pendingProposalCount
        - events
      properties:
        id:
          type: string
        template_id:
          type: string
          enum: [investigation]
        title:
          type: string
        createdAt:
          type: string
          description: ISO 8601 timestamp
        updatedAt:
          type: string
          description: ISO 8601 timestamp
        watch_id:
          type: string
        watch_execution_id:
          type: string
        watch_tier:
          $ref: '#/components/schemas/WatchTier'
        severity:
          type: string
        assignee:
          type: string
          nullable: true
        status:
          type: string
        pendingProposalCount:
          type: integer
          minimum: 0
        recommendedAction:
          $ref: '#/components/schemas/RecommendedAction'
        affectedSurface:
          type: string
          description: Primary asset or surface impacted
        summary:
          type: string
        priorityScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Brief priority score (0-100) for queue ranking
        recordId:
          type: string
          description: Durable record label shown in Brief (e.g. CASE-2047)
        primaryActionLabel:
          type: string
          description: Leading proposal CTA label for Brief cards
        events:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'

    Proposal:
      type: object
      description: >
        A proposal awaiting a decision. The **single** proposal contract: both
        `GET /internal/pnd/investigations/{id}/proposals` (this shape) and the grouped HITL queue's
        `PndProposalRow` describe the same object, and the queue's row is projected onto this type by
        `proposalRowToProposal` rather than by a second, parallel declaration.


        The `pnd*` block at the end of `properties` is what a **real** proposal — one projected from
        a parked `waitForInput` gate rather than from a fixture — carries and this type had no field
        for. Every one of them is optional, so nothing that already consumed a `Proposal` has to
        change; a second type would have forked the contract instead (epic decision 9: contracts
        widen additively).
      required:
        - id
        - template_id
        - parentConversationId
        - type
        - reasoning
        - evidenceRefs
        - status
        - assignee
        - sla
        - events
        - sourceWatchId
        - approvalRequired
        - summary
        - recommendation
      properties:
        id:
          type: string
        template_id:
          type: string
          enum: [proposal]
        parentConversationId:
          type: string
          description: Investigation id this proposal belongs to
        type:
          type: string
          description: Proposal action type (e.g. contain, escalate, tune)
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: >
            Producer confidence in the proposal, 0..1. **Optional**, and omitted rather than
            invented: a proposal projected from a parked HITL gate has no measured confidence, and
            `security.detectionChangeSignal` already made the same field optional for the same
            reason ("there is no measured confidence at containment"). Every fixture still supplies
            it and no surface reads it, so relaxing it broke no consumer.
        reasoning:
          type: string
        evidenceRefs:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceRef'
        status:
          $ref: '#/components/schemas/ProposalStatus'
        assignee:
          type: string
          nullable: true
        sla:
          type: string
          nullable: true
          description: ISO 8601 deadline for response
        events:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
        sourceWatchId:
          type: string
        approvalRequired:
          type: boolean
        summary:
          type: string
        recommendation:
          type: string
        # ---------------------------------------------------------------------------------------
        # The gate projection. Present on a proposal read from a parked `waitForInput` gate, absent
        # on a fixture, so each one is optional and adding them broke no existing consumer. They
        # carry the same names and bounds as `PndProposalRow`'s so the two surfaces of one contract
        # cannot drift apart under a rename.
        # ---------------------------------------------------------------------------------------
        alwaysGate:
          type: boolean
          description: True when this gate can never be auto-accepted at any autonomy level (D15)
        correlationId:
          type: string
          maxLength: 1024
          description: >
            The Attack Discovery alert the gate's run was correlated to. Absent — never blank — for
            an uncorrelated gate, so a surface can tell "no discovery" from "a discovery at id ''".
        createdAt:
          type: string
          maxLength: 64
          description: ISO 8601 timestamp the gate parked
        gateId:
          type: string
          maxLength: 1024
          description: >
            Gate id from `PND_GATE_REGISTRY`. Left a free string rather than `$ref`-ing the closed
            `PndGateId` enum for the reason `gate.schema.yaml` already records against
            `PndProposalRow.gateId`: widening a *response* field to a closed enum makes an older
            parked row unparseable rather than merely unrecognised.
        inputSchema:
          type: object
          additionalProperties: true
          description: JSON schema describing the input this gate expects in `_respond`
        preview:
          $ref: './tuning.schema.yaml#/components/schemas/PndTuningPreview'
        reversible:
          type: boolean
        sourceId:
          type: string
          maxLength: 1024
          description: >
            Opaque id addressing this pending gate in `_respond`. Equal to `id` by construction —
            `id` is the same value under this type's own name, so a client that only knows
            `Proposal` can still answer the gate.
        threadConversationId:
          type: string
          maxLength: 1024
          description: >
            Deterministic `[Thread]` conversation id for this proposal (D1), derived server-side
            from `(correlationId, gateId)` — the same key the queue dedupes on. Absent —
            never blank — when the derivation fails closed.

    Incident:
      type: object
      required:
        - id
        - template_id
        - forkedFromInvestigationId
        - events
      properties:
        id:
          type: string
        template_id:
          type: string
          enum: [incident]
        forkedFromInvestigationId:
          type: string
        watch_id:
          type: string
        status:
          type: string
        severity:
          type: string
        assignee:
          type: string
          nullable: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
