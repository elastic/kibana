openapi: 3.0.0
info:
  title: PND Investigation component schemas
  version: '1'
paths: {}
components:
  x-codegen-enabled: true
  schemas:
    TemplateId:
      type: string
      enum: [investigation, proposal, incident]

    RecommendedAction:
      type: string
      enum: [contain, escalate, investigate, tune]
      description: Brief bucket recommendation for an investigation

    ProposalStatus:
      type: string
      enum: [pending, approved, modified, dismissed, executed]

    WatchTier:
      type: string
      enum: [floor, officer, dark, deep, detection]

    EvidenceRef:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
        type:
          type: string
          description: Attachment or document type (e.g. alert, log, case)
        label:
          type: string
        url:
          type: string

    TimelineEvent:
      type: object
      required:
        - id
        - timestamp
        - type
        - summary
      properties:
        id:
          type: string
        timestamp:
          type: string
          description: ISO 8601 timestamp
        type:
          type: string
          description: Event category (e.g. triage, proposal, escalation)
        summary:
          type: string
        actor:
          type: string
          nullable: true
          description: User or watch that produced the event

    Investigation:
      type: object
      required:
        - id
        - template_id
        - title
        - createdAt
        - updatedAt
        - watch_id
        - watch_execution_id
        - pendingProposalCount
        - events
      properties:
        id:
          type: string
        template_id:
          type: string
          enum: [investigation]
        title:
          type: string
        createdAt:
          type: string
          description: ISO 8601 timestamp
        updatedAt:
          type: string
          description: ISO 8601 timestamp
        watch_id:
          type: string
        watch_execution_id:
          type: string
        watch_tier:
          $ref: '#/components/schemas/WatchTier'
        severity:
          type: string
        assignee:
          type: string
          nullable: true
        status:
          type: string
        pendingProposalCount:
          type: integer
          minimum: 0
        recommendedAction:
          $ref: '#/components/schemas/RecommendedAction'
        affectedSurface:
          type: string
          description: Primary asset or surface impacted
        summary:
          type: string
        priorityScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Brief priority score (0-100) for queue ranking
        recordId:
          type: string
          description: Durable record label shown in Brief (e.g. CASE-2047)
        primaryActionLabel:
          type: string
          description: Leading proposal CTA label for Brief cards
        events:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'

    Proposal:
      type: object
      required:
        - id
        - template_id
        - parentConversationId
        - type
        - confidence
        - reasoning
        - evidenceRefs
        - status
        - assignee
        - sla
        - events
        - sourceWatchId
        - approvalRequired
        - summary
        - recommendation
      properties:
        id:
          type: string
        template_id:
          type: string
          enum: [proposal]
        parentConversationId:
          type: string
          description: Investigation id this proposal belongs to
        type:
          type: string
          description: Proposal action type (e.g. contain, escalate, tune)
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reasoning:
          type: string
        evidenceRefs:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceRef'
        status:
          $ref: '#/components/schemas/ProposalStatus'
        assignee:
          type: string
          nullable: true
        sla:
          type: string
          nullable: true
          description: ISO 8601 deadline for response
        events:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
        sourceWatchId:
          type: string
        approvalRequired:
          type: boolean
        summary:
          type: string
        recommendation:
          type: string

    Incident:
      type: object
      required:
        - id
        - template_id
        - forkedFromInvestigationId
        - events
      properties:
        id:
          type: string
        template_id:
          type: string
          enum: [incident]
        forkedFromInvestigationId:
          type: string
        watch_id:
          type: string
        status:
          type: string
        severity:
          type: string
        assignee:
          type: string
          nullable: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
