openapi: 3.0.0
info:
  title: PND Conversation attachment component schemas
  version: '1'
paths: {}
components:
  x-codegen-enabled: true
  schemas:
    PndConversationAttachment:
      type: object
      description: >
        One Agent Builder conversation attachment, projected into PND's own shape (D10).


        A **deliberately narrow projection**, not a passthrough of Agent Builder's
        `VersionedAttachment`. PND creates three `type: 'text'` attachments on a thread when
        `_ensure` materialises it (the Attack Discovery markdown, the proposed rule change and
        the backtest comparison) and reads them back through an S11-guarded proxy over
        `GET /api/agent_builder/conversations/{id}/attachments`. Re-declaring Agent Builder's
        versioning model in a Security-owned contract would create a second source of truth
        that drifts the moment the platform adds a field, so only what the Attachments tab
        renders is projected: identity, type, description, and the **current** version's text.


        Every field is bounded, because the proxy forwards whatever Agent Builder returns.
      required:
        - id
        - type
      properties:
        id:
          type: string
          maxLength: 1024
          description: Agent Builder attachment id
        type:
          type: string
          maxLength: 256
          description: >
            Attachment type. Agent Builder declares this as an open `schema.string()` whose
            built-ins are `text`, `esql`, `screen_context` and `connector`, and contributors may
            add more — so this stays an open, bounded string rather than a closed enum PND does
            not own. PND itself only ever creates `text`.
        description:
          type: string
          maxLength: 1024
          description: Human-readable description, e.g. "Attack Discovery"
        content:
          type: string
          maxLength: 100000
          description: >
            Text content of the attachment's **current** version — Agent Builder's
            `versions[current_version].data.content` for a `text` attachment. Absent for any
            type whose data is not text, so the Attachments tab can list an attachment it
            cannot render inline rather than dropping it.
        version:
          type: integer
          minimum: 1
          description: Agent Builder's `current_version` (version numbers start at 1)
        createdAt:
          type: string
          maxLength: 64
          description: ISO 8601 timestamp of the current version (`created_at`)
