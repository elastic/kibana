openapi: 3.0.0
info:
  title: PND Watch component schemas
  version: '1'
paths: {}
components:
  x-codegen-enabled: true
  schemas:
    Lifecycle:
      type: string
      enum: [ga, beta, pilot]
      description: Release maturity shown as a badge next to a watch, worker, or skill

    ScheduleMode:
      type: string
      enum: [always, window, demand]

    ScheduleCadence:
      type: string
      enum: [stream, sweep, manual]

    ScheduleHandoff:
      type: string
      enum: [officer, oncall, brief, records, none]

    ScopeAccess:
      type: string
      enum: [full, masked, denied]

    WorkflowTriggerType:
      type: string
      enum: [event, schedule, manual]

    WatchRunAction:
      type: string
      enum: [read, draft, gated, auto]

    WatchSchedule:
      type: object
      required:
        - set
        - mode
        - from
        - to
        - onDemand
        - cadence
        - every
        - handoff
      properties:
        set:
          type: boolean
          description: Draft watches may be unscheduled (set false)
        mode:
          $ref: '#/components/schemas/ScheduleMode'
        from:
          type: integer
          minimum: 0
          maximum: 23
          description: Hour of day 0–23 (window mode)
        to:
          type: integer
          minimum: 0
          maximum: 23
          description: Hour of day 0–23 (window mode). May be less than from when wrapping midnight
        onDemand:
          type: boolean
          description: Also runnable outside the window (Deep Watch pattern)
        cadence:
          $ref: '#/components/schemas/ScheduleCadence'
        every:
          type: integer
          minimum: 1
          description: Interval minutes when cadence is sweep
        handoff:
          $ref: '#/components/schemas/ScheduleHandoff'

    WatchScope:
      type: object
      required:
        - name
        - access
        - label
      properties:
        name:
          type: string
        access:
          $ref: '#/components/schemas/ScopeAccess'
        label:
          type: string
          description: Short UI label, e.g. Read, Masked, No access

    WatchCallableRef:
      type: object
      required:
        - id
        - name
        - kind
        - summary
        - lastRun
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [skill, workflow]
        summary:
          type: string
        lastRun:
          type: string
          nullable: true
          description: ISO 8601 timestamp of last invocation, or null

    WatchRecentRunStep:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        type:
          type: string
        status:
          type: string

    WatchRecentRun:
      type: object
      required:
        - executionId
        - startedAt
        - status
        - steps
        - summary
      properties:
        executionId:
          type: string
        startedAt:
          type: string
          description: ISO 8601 timestamp
        status:
          type: string
        triggerType:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WatchRecentRunStep'
        summary:
          type: string
          description: Best-effort headline for cards/tables
        action:
          $ref: '#/components/schemas/WatchRunAction'

    WatchMetrics:
      type: object
      required:
        - lastRun
      properties:
        lastRun:
          type: string
          nullable: true
          description: ISO 8601 timestamp of most recent run

    WatchTriggerProjection:
      type: object
      required:
        - type
        - summary
      properties:
        type:
          $ref: '#/components/schemas/WorkflowTriggerType'
        summary:
          type: string

    Watch:
      type: object
      required:
        - id
        - name
        - tags
        - color
        - enabled
        - draft
        - managed
        - sortOrder
        - mandate
        - description
        - schedule
        - triggers
        - coverage
        - scopeSummary
        - scopes
        - skills
        - metrics
        - recentRuns
      properties:
        id:
          type: string
        name:
          type: string
        tags:
          type: array
          items:
            type: string
          description: Always includes watch, plus a tier tag when known
        color:
          type: string
          description: Accent color for coverage strip and cards (hex or CSS var)
        enabled:
          type: boolean
        draft:
          type: boolean
        managed:
          type: boolean
          description: True for Security-managed catalog watches
        sortOrder:
          type: integer
          description: Catalog sort key; MAX_SAFE_INTEGER when unset (custom watches last)
        mandate:
          type: string
          description: Short mandate shown on cards
        description:
          type: string
        lifecycle:
          $ref: '#/components/schemas/Lifecycle'
          description: Omitted for generally available watches; badge shown otherwise
        schedule:
          $ref: '#/components/schemas/WatchSchedule'
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/WatchTriggerProjection'
        coverage:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
          description: Derived hour segments for the 24h coverage strip, e.g. [[0,24]] or [[22,24],[0,6]]
        scopeSummary:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/WatchScope'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/WatchCallableRef'
        metrics:
          $ref: '#/components/schemas/WatchMetrics'
        recentRuns:
          type: array
          items:
            $ref: '#/components/schemas/WatchRecentRun'
