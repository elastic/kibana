openapi: 3.0.0
info:
  title: Get PND Investigation API endpoint
  version: '1'
paths:
  /internal/pnd/investigations/{id}:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: GetInvestigation
      description: Get a single investigation by id
      summary: Get investigation
      tags:
        - PND API
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Investigation id
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  investigation:
                    $ref: '../components/investigation.schema.yaml#/components/schemas/Investigation'
                required:
                  - investigation
