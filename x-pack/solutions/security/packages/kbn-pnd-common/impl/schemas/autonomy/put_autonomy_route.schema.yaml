openapi: 3.0.0
info:
  title: Set PND Watch Autonomy API endpoint
  version: '1'
paths:
  /internal/pnd/autonomy:
    put:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: SetAutonomy
      description: >
        Set the persisted autonomy level for a single system watch. Gated on the
        dedicated PND autonomy privilege; the handler allow-lists watchId against
        SYSTEM_SECURITY_WATCH_IDS and validates the level before writing (S4).
      summary: Set watch autonomy
      tags:
        - PND API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                watchId:
                  type: string
                  maxLength: 256
                  description: Managed system watch workflow id
                autonomyLevel:
                  $ref: '../components/watch_settings.schema.yaml#/components/schemas/WatchAutonomyLevel'
              required:
                - watchId
                - autonomyLevel
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  watchId:
                    type: string
                  autonomyLevel:
                    $ref: '../components/watch_settings.schema.yaml#/components/schemas/WatchAutonomyLevel'
                  autoAccept:
                    $ref: '../components/autonomy.schema.yaml#/components/schemas/AutonomyAutoAccept'
                required:
                  - watchId
                  - autonomyLevel
                  - autoAccept
