openapi: 3.0.0
info:
  title: Get PND Watch Autonomy API endpoint
  version: '1'
paths:
  /internal/pnd/autonomy:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: GetAutonomy
      description: >
        Read the persisted autonomy level and derived per-gate auto-accept flags
        for a single system watch. Low-privilege read path the orchestrators call
        via kibana.request.
      summary: Get watch autonomy
      tags:
        - PND API
      parameters:
        - name: watchId
          in: query
          required: true
          schema:
            type: string
            maxLength: 256
          description: Managed system watch workflow id
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  watchId:
                    type: string
                  autonomyLevel:
                    $ref: '../components/watch_settings.schema.yaml#/components/schemas/WatchAutonomyLevel'
                  autoAccept:
                    $ref: '../components/autonomy.schema.yaml#/components/schemas/AutonomyAutoAccept'
                required:
                  - watchId
                  - autonomyLevel
                  - autoAccept
