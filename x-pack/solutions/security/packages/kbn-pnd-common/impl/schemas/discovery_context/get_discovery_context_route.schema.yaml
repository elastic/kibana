openapi: 3.0.0
info:
  title: Get PND Discovery Context API endpoint
  version: '1'
paths:
  /internal/pnd/discovery-context:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: GetDiscoveryContext
      description: >
        The blast radius entities and the normalized risk score for a set of Attack Discovery 2.0
        alerts, derived in one pass so both surfaces share a single react-query key (D10). Entities
        come from a `terms` aggregation over the constituent detection alerts reached through each
        discovery's `alert_ids` (D2); the score is the MAX of those alerts'
        `kibana.alert.risk_score` (D5).

        The handler filters to readable ids with `resolveReadableAttackDiscoveryAlertIds` before
        querying, and reads the alerts index as the current user, so the S3 IDOR guard holds by
        construction. A failed enrichment degrades to `contexts: []` rather than breaking the
        queue, which is a separate read.
      summary: Get discovery context
      tags:
        - PND API
      parameters:
        - name: correlationIds
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
              maxLength: 1024
          style: form
          explode: true
          description: >
            Attack Discovery 2.0 alert ids to enrich. Each id becomes an `ids` filter clause in a
            single aggregation, so the count is capped at `PND_DISCOVERY_CONTEXT_MAX_ALERT_IDS`
            (200) — enforced by the route, which returns a 400 above it, because `maxItems` cannot
            be expressed here. `@kbn/openapi-generator` renders a bounded query array as
            `ArrayFromString(...).max(n)`, and `ArrayFromString` returns a `z.preprocess` pipe that
            has no `.max`, so the generated codec throws at parse time. `kbn-inbox-common` hit the
            same wall on `list_history_route.schema.yaml` and resolved it the same way.

      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  contexts:
                    type: array
                    maxItems: 200
                    description: >
                      One entry per readable, resolved discovery. Shorter than the request when an
                      id is unreadable or has no constituent alerts; order is not significant, so
                      a client keys on `correlationId`.
                    items:
                      $ref: '../components/discovery_context.schema.yaml#/components/schemas/PndDiscoveryContext'
                required:
                  - contexts
