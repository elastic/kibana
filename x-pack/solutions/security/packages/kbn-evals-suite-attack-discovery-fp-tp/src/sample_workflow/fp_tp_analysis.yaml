# Sample FP/TP analysis workflow for the eval suite.
#
# Temporary: the suite installs this until the managed analysis workflow (#19282)
# ships, then runs that one instead (see the package README). It follows the input,
# evidence, check, and output contract from security-team#19280, but it does NOT
# implement the claim-verification gate — the returned verdict is the model's
# proposal as-is. Scores against it measure the prompt, not the product.
#
# Every run either returns the output below or fails. `failed` is an execution
# state, never a verdict.
version: '1'
name: Attack Discovery FP/TP analysis (eval sample)
description: >-
  Eval-only sample. Classifies one persisted Attack Discovery as true_positive,
  false_positive, or inconclusive from its cited alerts, entity store, and raw events.
enabled: true
tags:
  - security
  - attack-discovery
  - eval
triggers:
  - type: manual
    inputs:
      properties:
        attack_discovery_id:
          type: string
          maxLength: 512
        investigation_id:
          type: string
          maxLength: 128
      required:
        - attack_discovery_id
        - investigation_id
      additionalProperties: false
outputs:
  properties:
    attack_discovery_id:
      type: string
    investigation_id:
      type: string
    workflow_id:
      type: string
    workflow_version:
      type: number
    coverage:
      type: object
      properties:
        alerts:
          type: object
          properties:
            seen:
              type: number
            total:
              type: number
        entities:
          type: object
          properties:
            seen:
              type: number
            failed:
              type: boolean
        events:
          type: object
          properties:
            seen:
              type: number
            cap:
              type: number
            truncated:
              type: boolean
            failed:
              type: boolean
    payload:
      type: object
      properties:
        verdict:
          type: string
        summary_markdown:
          type: string
          maxLength: 8000
        rationale_markdown:
          type: string
          maxLength: 50000
      required:
        - verdict
        - summary_markdown
        - rationale_markdown
    checks:
      type: array
      items:
        type: object
    claims:
      type: object
  required:
    - attack_discovery_id
    - investigation_id
    - workflow_id
    - coverage
    - payload
    - checks
    - claims
consts:
  supported_verdicts:
    - true_positive
    - false_positive
    - inconclusive
  # The template language has no empty-list literal, and `| default: []` returns
  # nothing. This constant is the empty-list fallback for optional sources.
  no_rows: []
settings:
  timeout: '10m'
steps:
  # Required source 1: the persisted Attack Discovery.
  - name: load_attack_discovery
    type: elasticsearch.search
    with:
      index: '.adhoc.alerts-security.attack.discovery.alerts-{{ workflow.spaceId }}'
      size: 1
      query:
        ids:
          values:
            - '{{ inputs.attack_discovery_id }}'

  - name: require_attack_discovery
    type: workflow.fail
    if: '${{ steps.load_attack_discovery.output.hits.total.value == 0 }}'
    with:
      message: 'Attack Discovery {{ inputs.attack_discovery_id }} was not found in space {{ workflow.spaceId }}.'

  # The Investigation must exist. Its content is not analysis evidence.
  - name: load_investigation
    type: ai.conversation.metadata.read
    with:
      conversation_id: '{{ inputs.investigation_id }}'

  # Required source 2: every alert the discovery cites. `found` counts returned hits, not
  # `hits.total`, so a discovery citing more than `size` alerts fails instead of being
  # judged on a subset.
  - name: load_alerts
    type: elasticsearch.search
    with:
      index: '.alerts-security.alerts-{{ workflow.spaceId }}'
      size: 100
      query:
        ids:
          values: "${{ steps.load_attack_discovery.output.hits.hits[0]._source['kibana.alert.attack_discovery.alert_ids'] }}"

  - name: count_alerts
    type: data.set
    with:
      cited: "${{ steps.load_attack_discovery.output.hits.hits[0]._source['kibana.alert.attack_discovery.alert_ids'] | size }}"
      found: '${{ steps.load_alerts.output.hits.hits | size }}'
      host_ids: "${{ steps.load_alerts.output.hits.hits | map: '_source.host.id' | compact | uniq }}"
      user_names: "${{ steps.load_alerts.output.hits.hits | map: '_source.user.name' | compact | uniq }}"
      attack_timestamp: "{{ steps.load_attack_discovery.output.hits.hits[0]._source['@timestamp'] }}"

  - name: require_cited_alerts
    type: workflow.fail
    if: '${{ steps.count_alerts.output.found != steps.count_alerts.output.cited }}'
    with:
      message: 'Only {{ steps.count_alerts.output.found }} of {{ steps.count_alerts.output.cited }} cited alerts were found for Attack Discovery {{ inputs.attack_discovery_id }}.'

  # Optional source: entity store records for the cited hosts and users.
  - name: load_entities
    type: elasticsearch.search
    on-failure:
      continue: true
    with:
      index: 'entities-latest-{{ workflow.spaceId }}'
      size: 50
      query:
        bool:
          minimum_should_match: 1
          should:
            - terms:
                host.id: '${{ steps.count_alerts.output.host_ids }}'
            - terms:
                user.name: '${{ steps.count_alerts.output.user_names }}'

  # Optional source: raw endpoint events on the cited hosts, ±2h of the discovery.
  - name: load_events
    type: elasticsearch.search
    on-failure:
      continue: true
    with:
      index: 'logs-endpoint.events.*'
      size: 50
      sort:
        - '@timestamp': asc
      query:
        bool:
          filter:
            - terms:
                host.id: '${{ steps.count_alerts.output.host_ids }}'
            - range:
                '@timestamp':
                  gte: '{{ steps.count_alerts.output.attack_timestamp }}||-2h'
                  lte: '{{ steps.count_alerts.output.attack_timestamp }}||+2h'

  - name: source_status
    type: data.set
    with:
      entities_failed: '${{ steps.load_entities.error != null }}'
      events_failed: '${{ steps.load_events.error != null }}'

  - name: analyze
    type: ai.agent
    agent-id: alertzero-thin-agent
    connector-id-by-feature: alertzero_reasoning
    create-conversation: true
    timeout: '8m'
    with:
      configuration_overrides:
        enable_elastic_capabilities: false
        tools: []
        skill_ids: []
      message: |
        You judge ONE persisted Attack Discovery as a chain: do the world facts around its
        cited alerts support the attack story it tells? You do not generate a discovery,
        judge individual detection rules, or confirm compromise. You have no tools; use
        only the evidence below.

        Verdicts:
        - true_positive: the alerts plus the world warrant investigating them as one unit.
        - false_positive: the world affirmatively refutes the story.
        - inconclusive: you cannot decide from the evidence.

        Two rules that are never negotiable:
        - Missing telemetry is never a false_positive; only an affirmative contradiction is.
        - A contradiction is never negotiable. If any world check contradicts, you may not
          dismiss it as neutral, as "not relevant", as "not explaining the activity", or as
          outweighed by other checks. A contradicting check is a fixed input to the rules
          below, and it blocks every true_positive and false_positive rule that excludes it.
        The discovery's own markdown is a claim to test, not evidence.

        Run every check below and report exactly one entry per check. Status is
        `completed` or `skipped` (the source is empty or unavailable). A completed check
        also has a result: `supports`, `contradicts`, or `neutral`.

        1. alert_linkage — cited alerts only. Do at least two cited alerts share a user,
           host, or process lineage? This is a precondition, not world evidence.
        2. entity_role — entity store only. Does the host or user role make the activity
           expected (management server, MDM, jump box, service account) or unexpected
           (ordinary employee workstation or account)?
        3. process_parent — raw events only. Is the parent of the suspicious process a
           management agent or scheduler (contradicts), or a user application such as an
           Office program or browser (supports)? A management-agent parent (e.g. an SCCM,
           MDM, RMM, or patch-management executable such as ccmexec.exe) contradicts
           regardless of what happens downstream of the suspicious process — the parent
           being routine tooling is itself evidence the discovery cites nothing suspicious.
        4. network_destination — raw events only. Is the destination a known vendor or
           internal management service (contradicts), or an unknown or known-bad
           endpoint (supports)? A vendor management domain (e.g. manage.microsoft.com,
           an MDM/RMM console, or a software-distribution point) contradicts even when the
           process making the connection is the one under scrutiny — routine management
           traffic to a named vendor endpoint is not attacker C2, independent of any other
           check's result.

        The world checks are entity_role, process_parent, and network_destination.

        EVIDENCE GATE — a mandatory precondition, checked before choosing any rule. State
        the status of BOTH sources as the first line of rationale_markdown, in exactly this
        form: "entity_store: hits|empty|failed; raw_events: hits|empty|failed".
        - false_positive requires BOTH sources to be present. If either source is empty or
          failed you may NOT return false_positive under any rule, no matter how clean,
          total, or unambiguous the contradiction looks. You cannot exonerate an alert with
          telemetry you never saw.
        - A total contradiction on the raw events with an empty or failed entity store is
          inconclusive, NOT false_positive. This is the single most common mistake this gate
          exists to prevent: a decisive-looking raw-event contradiction does not become a
          clearance when the other source is missing.
        - Never let an unavailable source make the verdict MORE decisive. A source you could
          not read weakens the verdict; it never strengthens it.
        When the gate blocks false_positive, skip to whichever of rules 1, 3, or 4 applies.

        Choose the verdict by the first rule that matches:
        1. inconclusive — world checks both support and contradict; or you cannot cite
           an id from the hits below.
        2. false_positive — at least one world check contradicts, none supports, and
           both the entity store and the raw events have hits. (Blocked by the
           evidence gate above when either source is empty or failed — inconclusive
           applies instead.)
        3. true_positive — process_parent or network_destination supports and no world
           check contradicts. An empty or failed entity store does not block this.
           entity_role and alert_linkage corroborate but are never enough on their own.
        4. inconclusive — anything else: every world check is skipped or neutral, or
           only entity_role or alert_linkage supports.

        MANDATORY SELF-CHECK — do this before you pick a rule, and write the result as the
        first bullets of rationale_markdown: first the source-status line from the evidence
        gate above, then every world check (entity_role, process_parent, network_destination)
        with its status and result, exactly as you will report it below. Then re-read that
        list once, specifically hunting for two traps: (a) any check you marked "contradicts"
        and then talked yourself out of, and (b) any rule you are about to apply whose
        precondition involves a source you just listed as empty or failed. For (a) its result
        is still "contradicts" — you do not get to downgrade a contradiction to neutral or
        supports because another check disagrees, because it seems unrelated to the process
        chain, or because the overall story otherwise looks compelling. For (b) the rule does
        not apply at all.

        Three worked examples of the failure modes this self-check exists to catch:
        - entity_role reads "contradicts" (host is a known MDM/management distribution
          point) and process_parent reads "supports" (an Office app spawned the process).
          These disagree, so the verdict is inconclusive under rule 1 — NOT true_positive.
          It is wrong to reason "the management role doesn't explain this specific process
          chain, so it doesn't count"; a contradiction never gets explained away, it only
          gets weighed against other checks by rule 1.
        - process_parent shows a patch-management executable (ccmexec.exe or equivalent)
          launching the suspicious process, AND network_destination shows that process
          connecting to a named vendor management domain (e.g. manage.microsoft.com). Both
          checks contradict. It is wrong to reason "the connection happened, so it supports
          the story"; the identity of the destination, not the fact that a connection
          occurred, is what process_parent and network_destination test. Both contradicting
          means rule 2 is the candidate — but its precondition is the next example's trap.
        - raw_events shows BOTH process_parent and network_destination contradicting
          (management agent parent, vendor management domain), the contradiction is total
          and unambiguous, and the entity store is empty or failed. The verdict is
          inconclusive — NOT false_positive. Rule 2's precondition ("both the entity store
          and the raw events have hits") is unmet, so rule 2 does not apply, however
          convincing the raw-event contradiction is. Entity_role being unevaluable is not
          "no check supports"; it is a missing source, and a missing source can never clear
          an alert. Do not write "entity_role could not be evaluated" and then still return
          false_positive.

        Claims:
        - claims.world: one entry for each world-check result the verdict relies on, with
          `check`, `result` (supports or contradicts), `source` (entity_store or
          raw_event), and `id` — the `entity.id` of an entity store hit or the `_id` of a
          raw event hit. Cite only ids that appear in the hits below.
        - claims.alert_link: when alert_linkage supports, the shared `field` (one of
          user.name, user.id, host.id, host.name, process.entity_id, process.pid), its
          `value`, and the `_id`s of at least two cited alerts that share it.

        Writing:
        - summary_markdown: one paragraph. State the verdict in prose (no heading), the
          strongest reason, the id it rests on, and any empty or unavailable source.
          At most 8000 characters.
        - rationale_markdown: REQUIRED on every run. First line is the source-status line
          from the evidence gate above, exactly as specified there. Then one bullet per
          check (status, result, cited ids) and one per empty or unavailable source.
        - No JSON, no confidence scores, no restated instructions.

        Attack Discovery:
        {{ steps.load_attack_discovery.output.hits.hits[0] | json }}

        Cited alerts ({{ steps.count_alerts.output.found }} of {{ steps.count_alerts.output.cited }}):
        {{ steps.load_alerts.output.hits.hits | json }}

        Entity store (query failed: {{ steps.source_status.output.entities_failed }}):
        {{ steps.load_entities.output.hits.hits | default: consts.no_rows | json }}

        Raw events within 2 hours of the discovery, at most 50 (query failed: {{ steps.source_status.output.events_failed }}):
        {{ steps.load_events.output.hits.hits | default: consts.no_rows | json }}
      schema:
        type: object
        additionalProperties: false
        properties:
          verdict:
            type: string
            enum:
              - true_positive
              - false_positive
              - inconclusive
          summary_markdown:
            type: string
          rationale_markdown:
            type: string
          checks:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  enum:
                    - alert_linkage
                    - entity_role
                    - process_parent
                    - network_destination
                status:
                  type: string
                  enum:
                    - completed
                    - skipped
                result:
                  type: string
                  enum:
                    - supports
                    - contradicts
                    - neutral
                details:
                  type: string
              required:
                - name
                - status
                - details
          claims:
            type: object
            additionalProperties: false
            properties:
              alert_link:
                type: object
                additionalProperties: false
                properties:
                  field:
                    type: string
                    enum:
                      - user.name
                      - user.id
                      - host.id
                      - host.name
                      - process.entity_id
                      - process.pid
                  value:
                    type: string
                  alert_ids:
                    type: array
                    items:
                      type: string
                required:
                  - field
                  - value
                  - alert_ids
              world:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    check:
                      type: string
                      enum:
                        - entity_role
                        - process_parent
                        - network_destination
                    result:
                      type: string
                      enum:
                        - supports
                        - contradicts
                    source:
                      type: string
                      enum:
                        - entity_store
                        - raw_event
                    id:
                      type: string
                  required:
                    - check
                    - result
                    - source
                    - id
        required:
          - verdict
          - summary_markdown
          - rationale_markdown
          - checks
          - claims

  - name: check_payload
    type: data.set
    with:
      payload_valid: '${{ consts.supported_verdicts contains steps.analyze.output.structured_output.verdict and steps.analyze.output.structured_output.summary_markdown != blank }}'

  - name: require_supported_verdict
    type: workflow.fail
    if: '${{ steps.check_payload.output.payload_valid == false }}'
    with:
      message: 'The analysis returned no supported verdict and summary.'

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      attack_discovery_id: "{{ steps.load_attack_discovery.output.hits.hits | map: '_id' | first }}"
      investigation_id: '{{ inputs.investigation_id }}'
      workflow_id: '{{ workflow.id }}'
      workflow_version: '${{ workflow.version }}'
      coverage:
        alerts:
          seen: '${{ steps.count_alerts.output.found }}'
          total: '${{ steps.count_alerts.output.cited }}'
        entities:
          seen: '${{ steps.load_entities.output.hits.hits | default: consts.no_rows | size }}'
          failed: '${{ steps.source_status.output.entities_failed }}'
        events:
          seen: '${{ steps.load_events.output.hits.hits | default: consts.no_rows | size }}'
          cap: 50
          truncated: '${{ steps.load_events.output.hits.total.value > 50 }}'
          failed: '${{ steps.source_status.output.events_failed }}'
      payload:
        verdict: '${{ steps.analyze.output.structured_output.verdict }}'
        summary_markdown: '${{ steps.analyze.output.structured_output.summary_markdown }}'
        rationale_markdown: '${{ steps.analyze.output.structured_output.rationale_markdown }}'
      checks: '${{ steps.analyze.output.structured_output.checks }}'
      claims: '${{ steps.analyze.output.structured_output.claims }}'
