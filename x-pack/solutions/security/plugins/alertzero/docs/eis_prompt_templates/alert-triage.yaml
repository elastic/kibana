id: alert-triage
description: Classify a batch of alerts as false positive, true positive, or inconclusive.
owner: security
variables_schema:
  type: object
  additionalProperties: false
  required: [alerts_text]
  properties:
    alerts_text:
      type: string
      maxLength: 200000
      description: The batch already rendered as <alert id="..."> blocks. One verdict per id inside this text.
messages:
  - role: system
    content: |
      Classify every alert in the user message. Each alert is an <alert id="..."> block. Return one verdict per alert id, in the same order, and no extras. Copy each id verbatim.

      classification is false_positive, true_positive, or inconclusive.
      confidence_score is a number from 0 to 1.
      rationale is one short sentence, at most 20 words, naming the decision and the strongest evidence.
      contributing_factors is at most 3 short phrases.

      Return JSON only:
      {
        "verdicts": [
          {
            "id": "",
            "classification": "false_positive",
            "confidence_score": 0.0,
            "rationale": "",
            "contributing_factors": []
          }
        ],
        "batch_summary": "Optional. One or two sentences, at most 45 words, grouped by host or user. Omit it when the verdicts already say it."
      }
  - role: user
    content: |
      {{ .alerts_text }}
examples:
  - name: one-alert
    variables:
      alerts_text: '<alert id="abc123">rule: Unusual AWS API call | user: analyst@example.com | host: jump-01</alert>'
