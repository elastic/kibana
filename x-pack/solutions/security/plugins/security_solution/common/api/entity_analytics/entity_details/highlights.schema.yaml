openapi: 3.0.0

info:
  title: Entity Details highlights
  version: '1'
paths:
  /internal/entity_details/highlights:
    post:
      x-labels: [ess, serverless]
      x-codegen-enabled: true
      operationId: EntityDetailsHighlights
      summary: Generate AI summary for entity

      requestBody:
        description: Schema for the entity details highlights
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entityType:
                  type: string
                  enum: [user, host, service, generic]
                  description: The type of entity.
                entityIdentifier:
                  type: string
                  maxLength: 1024
                  description: The identifier of the entity (its Entity Store `entity.id` when Entity Store v2 is enabled).
                mode:
                  $ref: '../common/common.schema.yaml#/components/schemas/EntityViewMode'
                  default: single
                anonymizationFields:
                  type: array
                  items:
                    $ref: '../../../../../../../../platform/packages/shared/kbn-elastic-assistant-common/impl/schemas/anonymization_fields/bulk_crud_anonymization_fields_route.schema.yaml#/components/schemas/AnonymizationFieldResponse'
                from:
                  type: number
                  description: The 'from' date.
                to:
                  type: number
                  description: The 'to' date.
                connectorId:
                  type: string
                  maxLength: 200
                  description: The connector id.
              required:
                - entityType
                - entityIdentifier
                - anonymizationFields
                - from
                - to
                - connectorId
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    properties:
                      assetCriticality:
                        type: array
                        description: Assigned asset criticality only. Empty when unassigned.
                        items:
                          type: object
                          additionalProperties: true
                      riskScore:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      vulnerabilities:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      vulnerabilitiesTotal:
                        type: object
                        additionalProperties:
                          type: number
                      anomalies:
                        type: array
                        nullable: true
                        description: ML anomaly findings. Null when there are none.
                        items:
                          type: object
                          additionalProperties: true
                      resolutionGroup:
                        type: object
                        description: Present only when `mode` is `resolved`. Describes the resolution group whose signals were combined into the summary.
                        properties:
                          member_count:
                            type: integer
                            description: Number of group members (target included) whose signals are in the summary.
                          members:
                            type: array
                            description: Anonymized identifiers of the included members, target first.
                            items:
                              type: string
                        required:
                          - member_count
                          - members
                    description: The highlights of the entity.
                  replacements:
                    $ref: '../../../../../../../../platform/packages/shared/kbn-elastic-assistant-common/impl/schemas/conversations/common_attributes.schema.yaml#/components/schemas/Replacements'
                  prompt:
                    type: string
                    description: The prompt used to generate the highlights.
                required:
                  - summary
                  - replacements
                  - prompt
        '400':
          description: Invalid request
