# Update Watchlist API Schema
# Modeled after create.schema.yaml
openapi: 3.0.0
info:
  title: Watchlist Management API
  version: "2023-10-31"

paths:
  /api/entity_analytics/watchlists/{id}:
    put:
      x-labels: [ess, serverless]
      x-codegen-enabled: true
      x-state: Technical Preview
      operationId: UpdateWatchlist
      summary: Update an existing watchlist
      description: >-
        Updates the name, description, risk modifier, or managed status of an existing entity analytics
        watchlist. Optionally also sets its rule-based data sources in the same request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 256
          description: The ID of the watchlist to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - riskModifier
              properties:
                name:
                  type: string
                  maxLength: 256
                  description: Unique name of the watchlist
                description:
                  type: string
                  maxLength: 1000
                  description: Description of the watchlist
                riskModifier:
                  type: number
                  minimum: 0
                  maximum: 2
                  description: Risk score modifier associated with the watchlist
                managed:
                  type: boolean
                  description: Indicates if the watchlist is managed by the system
                entitySources:
                  description: >-
                    The rule-based data sources (entity store or index) the watchlist should have after
                    the update, at most one of each type. Omit it to leave the data sources as they are;
                    an empty array removes them. A watchlist that is not managed can have only one
                    rule-based source in this array; its integration sources are not counted and are not changed.
                    An entity store source requires a non-empty `queryRule`. An index source requires
                    Elasticsearch `read` privileges on its `indexPattern` (and encrypted saved objects to be
                    configured on self-managed deployments), and accepts a `range`; `range` is ignored for
                    entity store sources. Managed data sources are not changed.
                  type: array
                  maxItems: 2
                  items:
                    type: object
                    required:
                      - type
                      - name
                    additionalProperties: false
                    properties:
                      type:
                        type: string
                        enum:
                          - index
                          - store
                      name:
                        type: string
                        maxLength: 256
                      indexPattern:
                        type: string
                        maxLength: 1000
                      enabled:
                        type: boolean
                      identifierField:
                        type: string
                        maxLength: 256
                        description: Field used to query the entity store for index-type sources
                      queryRule:
                        type: string
                        maxLength: 4096
                        description: >-
                          KQL query. For an index source, it filters the documents read from the index pattern.
                          For an entity store source, it filters the entity store and is required.
                      range:
                        $ref: "../data_source/common.schema.yaml#/components/schemas/DateRange"
            examples:
              UpdateWatchlistRequest:
                summary: Update watchlist request
                value:
                  name: High Risk Vendors
                  description: High risk vendor watchlist
                  riskModifier: 1.5
                  managed: false
              UpdateWatchlistWithSourcesRequest:
                summary: Update watchlist and replace its data source
                value:
                  name: High Risk Vendors
                  description: High risk vendor watchlist
                  riskModifier: 1.5
                  entitySources:
                    - type: store
                      name: High Risk Vendors-store
                      queryRule: "entity.name: *-vendor"
      responses:
        "200":
          description: Watchlist updated successfully
          content:
            application/json:
              schema:
                $ref: "./common.schema.yaml#/components/schemas/WatchlistObject"
              examples:
                UpdateWatchlistResponse:
                  summary: Updated watchlist
                  value:
                    id: watchlist-123
                    name: High Risk Vendors
                    description: High risk vendor watchlist
                    riskModifier: 1.5
                    managed: false
                    createdAt: "2026-01-28T12:00:00.000Z"
                    updatedAt: "2026-02-18T12:00:00.000Z"
        "409":
          description: >-
            Conflict. Another watchlist in the current space already has the new name, the name is
            reserved for a system watchlist, or a data source name is already used.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type: integer
                  message:
                    type: string
                required:
                  - status_code
                  - message
              examples:
                DuplicateWatchlistName:
                  summary: Name already used
                  value:
                    status_code: 409
                    message: 'A watchlist named "High Risk Vendors" already exists'
