openapi: 3.0.0
info:
  title: Set alerts status API endpoint
  version: '2023-10-31'
paths:
  /api/detection_engine/signals/status:
    post:
      x-labels: [serverless, ess]
      operationId: SetAlertsStatus
      x-codegen-enabled: true
      summary: Set a detection alert status
      description: Set the status of one or more detection alerts.
      tags:
        - Alerts API
      requestBody:
        description: An object containing desired status and explicit alert ids or a query to select alerts
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SetAlertsStatusByIds'
                - $ref: '#/components/schemas/SetAlertsStatusByQuery'
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Elasticsearch update by query response
        400:
          description: Invalid input data response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '../../../model/error_responses.schema.yaml#/components/schemas/PlatformErrorResponse'
                  - $ref: '../../../model/error_responses.schema.yaml#/components/schemas/SiemErrorResponse'
        401:
          description: Unsuccessful authentication response
          content:
            application/json:
              schema:
                $ref: '../../../model/error_responses.schema.yaml#/components/schemas/PlatformErrorResponse'
        500:
          description: Internal server error response
          content:
            application/json:
              schema:
                $ref: '../../../model/error_responses.schema.yaml#/components/schemas/SiemErrorResponse'

components:
  schemas:
    RuntimeFieldType:
      type: string
      enum:
        - keyword
        - long
        - double
        - date
        - ip
        - boolean
        - geo_point
      description: >-
        The data type for the runtime field type. Determines how the field value is indexed and queried.

    RuntimeFieldMapping:
      type: object
      description: >-
        A runtime field included in the status-update query so the query
        can match fields that are not in the alerts index mapping, for
        example scripted fields on a data view. Elasticsearch evaluates
        the field at query time.
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/RuntimeFieldType'
        script:
          type: object
          additionalProperties: false
          description: >-
            Inline Painless script that Elasticsearch evaluates for each alert.
            Only `source` is accepted. Stored scripts, parameterized scripts
            (`params`), and non-default `lang` values are not supported. Extra
            properties are rejected with a 400 so the script is not run with
            different semantics.
          required: [source]
          properties:
            source:
              type: string
              description: Painless script source to execute.
              maxLength: 10000
        format:
          type: string
          description: >-
            Format string for date runtime fields, for example
            `strict_date_optional_time`.
          maxLength: 100
    SetAlertsStatusByIds:
      type: object
      properties:
        signal_ids:
          type: array
          description: 'List of alert ids. Use field `_id` on alert document or `kibana.alert.uuid`. Note: signals are a deprecated term for alerts.'
          items:
            $ref: '../../../model/primitives.schema.yaml#/components/schemas/NonEmptyString'
          minItems: 1
        status:
          $ref: '../../../model/alert.schema.yaml#/components/schemas/AlertStatus'
      required: [signal_ids, status]

    SetAlertsStatusByQuery:
      type: object
      properties:
        query:
          type: object
          additionalProperties: true
        status:
          $ref: '../../../model/alert.schema.yaml#/components/schemas/AlertStatus'
        conflicts:
          type: string
          enum:
            - abort
            - proceed
          default: abort
        runtime_fields:
          type: object
          maxProperties: 100
          additionalProperties:
            $ref: '#/components/schemas/RuntimeFieldType'
          description: >-
            Optional map of field name to runtime field type. For each entry, a
            runtime field of the specified type is created reading its value from
            `_source[fieldName]` and included in the query as `runtime_mappings`.
            Use this to reference fields stored on the alert `_source` that are not
            part of the alerts index mapping, for example, custom fields added via
            data view runtime fields. The combined number of unique field names
            across `runtime_fields` and `runtime_mappings` must not exceed 100.
        runtime_mappings:
          type: object
          maxProperties: 100
          additionalProperties:
            $ref: '#/components/schemas/RuntimeFieldMapping'
          description: >-
            Use this when the query references fields that are not in the
            alerts index mapping, for example data view runtime fields with
            a Painless script. The combined number of unique field names across
            `runtime_fields` and `runtime_mappings` must not exceed 100.
      required: [query, status]
