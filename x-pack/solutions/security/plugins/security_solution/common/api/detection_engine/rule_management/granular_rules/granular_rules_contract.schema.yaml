openapi: 3.0.0
info:
  title: Granular rules API shared contract
  version: '1'
paths: {}
components:
  x-codegen-enabled: true
  schemas:
    GranularRulesSearchMode:
      type: string
      description: |
        Search mode for free-text search combined with `filter`.
      enum:
        - legacy
      default: legacy

    GranularRulesSearch:
      type: object
      additionalProperties: false
      required:
        - term
      description: |
        Free-text search combined with `filter`. Interpreted according to search mode.
      properties:
        term:
          type: string
          maxLength: 10000
        mode:
          $ref: '#/components/schemas/GranularRulesSearchMode'

    GranularRulesFilterMode:
      type: string
      description: |
        How `GranularRulesFilter.term` is interpreted. Defaults to KQL.
      enum:
        - KQL
      default: KQL

    GranularRulesFilter:
      type: object
      additionalProperties: false
      required:
        - term
      description: |
        String filter expression interpreted according to `mode`.
      properties:
        term:
          type: string
          maxLength: 10000
        mode:
          $ref: '#/components/schemas/GranularRulesFilterMode'

    GranularRulesFacetCategory:
      type: string
      enum:
        - tags
        - enabled
        - updatedBy
        - createdBy
        - lastRunOutcome
        - isCustomized
        - type
        - integration
        - tactic
        - source
        - severity


    SearchRulesAggregations:
      type: object
      additionalProperties: false
      description: |
        Aggregation options on `_search`.
      properties:
        counts:
          type: array
          maxItems: 20
          description: Facet categories for which to compute counts over the filtered + searched set.
          items:
            $ref: '#/components/schemas/GranularRulesFacetCategory'
        exclude_own_filter:
          type: boolean
          description: |
            Count each category without the `filter_params` condition on the same field, so a
            facet shows the other values a user can add (disjunctive facets). Group by leaves it off.
        tag_categories:
          type: array
          maxItems: 50
          description: |
            Tag prefixes, for example `OS`. Counts the tags of each prefix without the
            `filter_params.tag_categories` condition of that prefix.
          items:
            type: string
            minLength: 1
            maxLength: 256

    FacetCounts:
      type: object
      description: |
        Per-category facet counts. Each key is a facet category from `aggregations.counts`, each value is an object that maps a filter value to its count.
      additionalProperties:
        type: object
        additionalProperties:
          type: integer
          minimum: 0
