---
system_indices_superuser:
  cluster: ['all']
  indices:
    - names: ['*']
      privileges: ['all']
      allow_restricted_indices: true
  applications:
    - application: '*'
      privileges: ['*']
      resources: ['*']
  run_as: ['*']

#--------------------------------------------------------------------------------------------------
#
# SOURCE OF ROLES DEFINED BELOW IS PROJECT CONTROLLER:
# https://github.com/elastic/elasticsearch-controller/blob/main/internal/config/roles/security.yaml
#
# !!!! IMPORTANT !!!!       DO NOT MAKE CHANGES TO THIS FILE, UNLESS THOSE CHANGES
#                           HAVE ALSO BEEN MADE TO PROJECT CONTROLLER (path above)
#
#--------------------------------------------------------------------------------------------------

# modeled after the t1_analyst minus osquery run saved queries privilege, plus endpoint exceptions read
viewer:
  metadata:
    public: true
    reserved: true
  cluster:
    - "read_project_routing"
  indices:
    - names:
        - ".siem-signals*"
        - ".lists-*"
        - ".items-*"
      privileges:
        - "read"
        - "view_index_metadata"
      allow_restricted_indices: false
    - names:
        - ".alerts*"
        - ".preview.alerts*"
        - ".adhoc.alerts*"
      privileges:
        - "read"
        - "view_index_metadata"
      allow_restricted_indices: false
    - names:
        - apm-*-transaction*
        - traces-apm*
        - auditbeat-*
        - endgame-*
        - filebeat-*
        - logs-*
        - packetbeat-*
        - winlogbeat-*
        - metrics-endpoint.metadata_current_*
        - logstash-*
        - ".fleet-agents*"
        - ".fleet-actions*"
        - "risk-score.risk-score-*"
        - ".asset-criticality.asset-criticality-*"
        - ".entities.v1.latest.security_*"
        - ".entities.v1.updates.security_*"
        - ".entities.v1.history.*.security_*"
        - ".entities.v2.*"
        - "entities-latest-*"
        - ".ml-anomalies-*"
        - security_solution-*.misconfiguration_latest*
      privileges:
        - read
  applications:
    - application: "kibana-.kibana"
      privileges:
        - feature_ml.read
        - feature_siemV5.read
        - feature_siemV5.endpoint_list_read
        - feature_siemV5.endpoint_exceptions_read
        - feature_siemV5.scripts_management_read
        - feature_securitySolutionRulesV2.read
        - feature_securitySolutionCases.read
        - feature_securitySolutionAssistant.minimal_all
        - feature_securitySolutionAttackDiscovery.minimal_all
        - feature_securitySolutionTimeline.read
        - feature_securitySolutionNotes.read
        - feature_actions.read
        - feature_builtInAlerts.read
        - feature_osquery.read
        - feature_discover_v2.all
        - feature_dashboard_v2.all
        - feature_maps_v2.all
        - feature_visualize_v2.all
        - feature_savedQueryManagement.all
        - feature_agentBuilder.read
        - feature_workflowsManagement.read
        - feature_alertzero.read
        - feature_agenticInvestigations.read
        - feature_proposals.read
      resources: "*"
  run_as: []

