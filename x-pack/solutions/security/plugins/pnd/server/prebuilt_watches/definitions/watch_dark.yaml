version: "1"
name: Dark Watch
description: >
  Dark Watch skeleton. Continuous, technology-aware hunting with hourly UTC
  sweeps and reviewable findings.
enabled: true
tags:
  - watch
  - watch-dark
triggers:
  - type: scheduled
    with:
      every: "1h"
  - type: manual
consts:
  watch_policy:
    mandate: Continuous, technology-aware hunting for relevant threats and coverage gaps
    autonomyLevel: manual
    handoff: brief
    onDemand: true
    draft: false
    cadence: sweep
    mode: always
    ui:
      color: "#f59e0b"
      icon: bolt
      order: 30
    scopeSummary: Mail · IdP · edge / VPN
    scopes:
      - name: Mail · IdP
        access: full
        label: Read + monitor
      - name: Edge / VPN
        access: full
        label: Read + monitor
      - name: Customer data
        access: denied
        label: No access
    # Capabilities projected from executable steps — see Watch Floor.
    callables: []
steps:
  - name: hunt_stub
    type: console
    with:
      message: "Dark Watch skeleton hunt pass — add ai.agent / skill steps (see Floor)"
