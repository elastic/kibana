requestBody:
  content:
    application/json:
      examples:
        bulkDeleteRequestExample1:
          description: Run `POST /api/synthetics/monitors/_bulk_delete` to delete a list of monitors.
          value:
            ids: [monitor1-id, monitor2-id]
responses:
  200:
    description: A successful response.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../oas_schemas.yaml#/deleteResult'
        examples:
          deleteMonitorsResponseExample1:
            description: A response from successfully deleting multiple monitors.
            value:
              - id: monitor1-id
                deleted: true
              - id: monitor2-id
                deleted: true
x-codeSamples:
  - lang: curl
    source: |
      curl \
        -X POST "${KIBANA_URL}/api/synthetics/monitors/_bulk_delete" \
        -H "Authorization: ApiKey ${API_KEY}" \
        -H "kbn-xsrf: true" \
        -H "Content-Type: application/json" \
        -d '{"ids":["monitor1-id","monitor2-id"]}'
  - lang: Console
    source: |
      POST kbn://api/synthetics/monitors/_bulk_delete
      {"ids":["monitor1-id","monitor2-id"]}
