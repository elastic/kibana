requestBody:
  content:
    application/json:
      examples:
        deleteParametersRequestExample1:
          description: Run `POST /api/synthetics/params/_bulk_delete` to delete multiple parameters.
          value:
            ids: [param1-id, param2-id]
responses:
  200:
    description: A successful response.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../../oas_schemas.yaml#/deleteResult'
        examples:
          deleteParametersResponseExample1:
            value:
              - id: param1-id
                deleted: true
x-codeSamples:
  - lang: curl
    source: |
      curl \
        -X POST "${KIBANA_URL}/api/synthetics/params/_bulk_delete" \
        -H "Authorization: ApiKey ${API_KEY}" \
        -H "kbn-xsrf: true" \
        -H "Content-Type: application/json" \
        -d '{"ids":["param1-id","param2-id"]}'
  - lang: Console
    source: |
      POST kbn://api/synthetics/params/_bulk_delete
      {"ids":["param1-id","param2-id"]}
