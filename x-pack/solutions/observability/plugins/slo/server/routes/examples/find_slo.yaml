  '400':
    description: Bad request
    content:
      application/json:
        schema:
          $ref: ../oas_error_schemas.yaml#/400_response
        examples:
          badRequestSortDirectionExample:
            summary: Invalid query parameter value
            value:
              statusCode: 400
              error: Bad Request
              message: |-
                [
                  {
                    "code": "invalid_union",
                    "errors": [
                      [
                        {
                          "code": "invalid_value",
                          "values": [
                            "asc"
                          ],
                          "path": [],
                          "message": "Invalid input: expected \"asc\""
                        }
                      ],
                      [
                        {
                          "code": "invalid_value",
                          "values": [
                            "desc"
                          ],
                          "path": [],
                          "message": "Invalid input: expected \"desc\""
                        }
                      ]
                    ],
                    "path": [
                      "sortDirection"
                    ],
                    "message": "Invalid input"
                  }
                ]
          badRequestSearchAfterExample:
            summary: Invalid searchAfter cursor
            value:
              statusCode: 400
              error: Bad Request
              message: |-
                [
                  {
                    "code": "custom",
                    "message": "Invalid searchAfter value, must be a JSON array of strings or numbers",
                    "path": [
                      "searchAfter"
                    ]
                  }
                ]
          badRequestPerPageExample:
            summary: perPage above the limit
            value:
              statusCode: 400
              error: Bad Request
              message: 'perPage limit set to 5000'
  '401':
    description: Unauthorized response
    content:
      application/json:
        schema:
          $ref: ../oas_error_schemas.yaml#/401_response
        examples:
          unauthorizedExample:
            summary: Unauthorized
            value:
              statusCode: 401
              error: Unauthorized
              message: "[security_exception\n\tRoot causes:\n\t\tsecurity_exception: unable to authenticate user [elastic] for REST request [/_security/_authenticate]]: unable to authenticate user [elastic] for REST request [/_security/_authenticate]"
  '403':
    description: Forbidden response
    content:
      application/json:
        schema:
          $ref: ../oas_error_schemas.yaml#/403_response
        examples:
          forbiddenExample:
            summary: Forbidden
            value:
              statusCode: 403
              error: Forbidden
              message: 'API [GET /api/observability/slos] is unauthorized for user, this action is granted by the Kibana privileges [slo_read]'
