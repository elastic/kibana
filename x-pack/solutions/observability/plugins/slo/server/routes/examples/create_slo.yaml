requestBody:
  content:
    application/json:
      examples:
        createSloKqlExample:
          summary: Create an SLO with a KQL indicator
          value:
            name: My Service Availability
            description: Availability of my web service measured by successful HTTP responses
            indicator:
              type: sli.kql.custom
              params:
                index: logs-*
                good: 'request.status_code : "2xx"'
                total: 'request.status_code : *'
                filter: 'field.environment : "production" and service.name : "my-service"'
                timestampField: '@timestamp'
            timeWindow:
              duration: 30d
              type: rolling
            budgetingMethod: occurrences
            objective:
              target: 0.99
            tags:
              - production
              - web-service
            settings:
              syncDelay: 5m
              frequency: 5m
responses:
  '200':
    description: Successful request
    content:
      application/json:
        schema:
          $ref: ../oas_schemas.yaml#/create_slo_response
        examples:
          createSloResponse:
            summary: Create SLO response
            value:
              id: 8853df00-ae2e-11ed-90af-09bb6422b258
  '400':
    description: Bad request
    content:
      application/json:
        schema:
          $ref: ../oas_schemas.yaml#/400_response
        examples:
          badRequestExample:
            summary: Bad request
            value:
              statusCode: 400
              error: Bad Request
              message: 'Invalid value ''foo'' supplied to: indicator/type'
  '401':
    description: Unauthorized response
    content:
      application/json:
        schema:
          $ref: ../oas_schemas.yaml#/401_response
        examples:
          unauthorizedExample:
            summary: Unauthorized
            value:
              statusCode: 401
              error: Unauthorized
              message: 'security_exception: unable to authenticate user for REST request [/api/observability/slos]'
  '403':
    description: Forbidden response
    content:
      application/json:
        schema:
          $ref: ../oas_schemas.yaml#/403_response
        examples:
          forbiddenExample:
            summary: Forbidden
            value:
              statusCode: 403
              error: Forbidden
              message: 'security_exception: action [slo_write] is unauthorized for user'
  '409':
    description: Conflict - The SLO id already exists
    content:
      application/json:
        schema:
          $ref: ../oas_schemas.yaml#/409_response
        examples:
          conflictExample:
            summary: Conflict
            value:
              statusCode: 409
              error: Conflict
              message: SLO [d077e940-1515-11ee-9c50-9d096392f520] already exists
