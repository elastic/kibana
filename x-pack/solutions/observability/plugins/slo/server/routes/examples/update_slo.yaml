requestBody:
  content:
    application/json:
      examples:
        updateSloNameExample:
          summary: Update the SLO name and tags
          value:
            name: Updated Service Availability
            tags:
              - production
              - updated
        updateSloObjectiveExample:
          summary: Update the SLO objective
          value:
            objective:
              target: 0.995
        updateSloIndicatorExample:
          summary: Change the SLO indicator
          value:
            indicator:
              type: sli.kql.custom
              params:
                index: logs-*
                good: 'request.status_code < 500'
                total: 'request.status_code : *'
                timestampField: '@timestamp'
        updateSloGroupByExample:
          summary: Generate one SLO instance per service and host
          value:
            groupBy:
              - service.name
              - host.name
        updateSloSettingsExample:
          summary: Change the SLO settings
          value:
            settings:
              syncDelay: 5m
              frequency: 2m
responses:
  '200':
    content:
      application/json:
        examples:
          updateSloNameResponse:
            summary: Response after updating the name and tags (the revision does not change)
            value:
