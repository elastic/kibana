  '400':
    description: Bad request
    content:
      application/json:
        schema:
          $ref: ../oas_error_schemas.yaml#/400_response
        examples:
          badRequestBodyExample:
            summary: Invalid request body
            value:
              statusCode: 400
              error: Bad Request
              message: |-
                [
                  {
                    "expected": "string",
                    "code": "invalid_type",
                    "path": [
                      "name"
                    ],
                    "message": "Invalid input: expected string, received number"
                  }
                ]
          badRequestIdExample:
            summary: Invalid SLO id
            value:
              statusCode: 400
              error: Bad Request
              message: |-
                [
                  {
                    "origin": "string",
                    "code": "too_small",
                    "minimum": 8,
                    "inclusive": true,
                    "path": [
                      "id"
                    ],
                    "message": "Invalid slo id, must be between 8 and 48 characters and contain only letters, numbers, hyphens, and underscores"
                  },
                  {
                    "origin": "string",
                    "code": "invalid_format",
                    "format": "regex",
                    "pattern": "/^[a-z0-9-_]+$/",
                    "path": [
                      "id"
                    ],
                    "message": "Invalid slo id, must be between 8 and 48 characters and contain only letters, numbers, hyphens, and underscores"
                  }
                ]
