requestBody:
  content:
    application/json:
      examples:
        deleteInstancesExample:
          summary: Delete specific SLO instances
          value:
            list:
              - sloId: 8853df00-ae2e-11ed-90af-09bb6422b258
                instanceId: host-abc123
              - sloId: 8853df00-ae2e-11ed-90af-09bb6422b258
                instanceId: host-def456
responses:
  '204':
    description: Successful request
  '400':
    description: Bad request
    content:
      application/json:
        schema:
          $ref: ../oas_error_schemas.yaml#/400_response
        examples:
          badRequestBodyExample:
            summary: Invalid request body
            value:
              statusCode: 400
              error: Bad Request
              message: |-
                [
                  {
                    "origin": "string",
                    "code": "too_small",
                    "minimum": 8,
                    "inclusive": true,
                    "path": [
                      "list",
                      0,
                      "sloId"
                    ],
                    "message": "Invalid slo id, must be between 8 and 48 characters and contain only letters, numbers, hyphens, and underscores"
                  },
                  {
                    "origin": "string",
                    "code": "invalid_format",
                    "format": "regex",
                    "pattern": "/^[a-z0-9-_]+$/",
                    "path": [
                      "list",
                      0,
                      "sloId"
                    ],
                    "message": "Invalid slo id, must be between 8 and 48 characters and contain only letters, numbers, hyphens, and underscores"
                  }
                ]
          badRequestAllInstancesExample:
            summary: The instanceId * cannot be deleted
            value:
              statusCode: 400
              error: Bad Request
              message: 'Cannot delete an SLO instance ''*'''
  '401':
    description: Unauthorized response
    content:
      application/json:
        schema:
          $ref: ../oas_error_schemas.yaml#/401_response
        examples:
          unauthorizedExample:
            summary: Unauthorized
            value:
              statusCode: 401
              error: Unauthorized
              message: "[security_exception\n\tRoot causes:\n\t\tsecurity_exception: unable to authenticate user [elastic] for REST request [/_security/_authenticate]]: unable to authenticate user [elastic] for REST request [/_security/_authenticate]"
  '403':
    description: Forbidden response
    content:
      application/json:
        schema:
          $ref: ../oas_error_schemas.yaml#/403_response
        examples:
          forbiddenExample:
            summary: Forbidden
            value:
              statusCode: 403
              error: Forbidden
              message: 'API [POST /api/observability/slos/_delete_instances] is unauthorized for user, this action is granted by the Kibana privileges [slo_write]'
