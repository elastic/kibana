              groupings:
                host.name: web-01
              instanceId: web-01
          getRemoteSloResponse:
            summary: Get an SLO defined in a remote cluster (request with the remoteName query parameter)
            value:
              id: 8853df00-ae2e-11ed-90af-09bb6422b258
              name: My Service Availability
              description: Availability of my web service measured by successful HTTP responses
              indicator:
                type: sli.kql.custom
                params:
                  index: logs-*
                  good: 'request.status_code : "2xx"'
                  total: 'request.status_code : *'
