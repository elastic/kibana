requestBody:
  content:
    application/json:
      examples: {}
responses:
  '200':
    content:
      application/json:
        examples:
          getSloResponse:
            summary: Get an SLO
            value:
              id: 8853df00-ae2e-11ed-90af-09bb6422b258
              name: My Service Availability
              description: Availability of my web service measured by successful HTTP responses
              indicator:
                type: sli.kql.custom
                params:
                  index: logs-*
                  good: 'request.status_code : "2xx"'
                  total: 'request.status_code : *'
                  filter: 'field.environment : "production" and service.name : "my-service"'
                  timestampField: '@timestamp'
              timeWindow:
                duration: 30d
                type: rolling
              budgetingMethod: occurrences
              objective:
                target: 0.99
              settings:
                syncDelay: 5m
                frequency: 5m
                preventInitialBackfill: false
              revision: 1
              enabled: true
              tags:
                - production
                - web-service
              createdAt: '2025-01-12T10:03:19.000Z'
              updatedAt: '2025-01-12T10:03:19.000Z'
              groupBy: '*'
              version: 2
              createdBy: elastic
              updatedBy: elastic
              artifacts:
                dashboards: []
              summary:
