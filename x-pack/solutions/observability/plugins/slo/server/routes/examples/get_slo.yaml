  '400':
    description: Bad request
    content:
      application/json:
        schema:
          $ref: ../oas_error_schemas.yaml#/400_response
        examples:
          badRequestIdExample:
            summary: Invalid SLO id
            value:
              statusCode: 400
              error: Bad Request
              message: |-
                [
                  {
                    "origin": "string",
                    "code": "too_small",
                    "minimum": 8,
                    "inclusive": true,
                    "path": [
                      "id"
                    ],
                    "message": "Invalid slo id, must be between 8 and 48 characters and contain only letters, numbers, hyphens, and underscores"
                  },
                  {
                    "origin": "string",
                    "code": "invalid_format",
                    "format": "regex",
                    "pattern": "/^[a-z0-9-_]+$/",
                    "path": [
                      "id"
                    ],
                    "message": "Invalid slo id, must be between 8 and 48 characters and contain only letters, numbers, hyphens, and underscores"
                  }
                ]
          badRequestInstanceIdExample:
            summary: Invalid instanceId query parameter
            value:
              statusCode: 400
              error: Bad Request
              message: |-
                [
                  {
                    "code": "invalid_union",
                    "errors": [
                      [
                        {
                          "code": "invalid_value",
                          "values": [
                            "*"
                          ],
                          "path": [],
                          "message": "Invalid input: expected \"*\""
                        }
                      ],
                      [
                        {
                          "expected": "string",
                          "code": "invalid_type",
                          "path": [],
                          "message": "Invalid input: expected string, received array"
                        }
                      ]
                    ],
                    "path": [
                      "instanceId"
                    ],
                    "message": "Invalid input"
                  }
                ]
  '401':
    description: Unauthorized response
    content:
      application/json:
        schema:
          $ref: ../oas_error_schemas.yaml#/401_response
        examples:
          unauthorizedExample:
            summary: Unauthorized
            value:
              statusCode: 401
              error: Unauthorized
              message: "[security_exception\n\tRoot causes:\n\t\tsecurity_exception: unable to authenticate user [elastic] for REST request [/_security/_authenticate]]: unable to authenticate user [elastic] for REST request [/_security/_authenticate]"
  '403':
    description: Forbidden response
    content:
      application/json:
        schema:
          $ref: ../oas_error_schemas.yaml#/403_response
        examples:
          forbiddenExample:
            summary: Forbidden
            value:
              statusCode: 403
              error: Forbidden
              message: 'API [GET /api/observability/slos/8853df00-ae2e-11ed-90af-09bb6422b258] is unauthorized for user, this action is granted by the Kibana privileges [slo_read]'
  '404':
    description: Not found response
    content:
      application/json:
        schema:
          $ref: ../oas_error_schemas.yaml#/404_response
        examples:
          notFoundExample:
            summary: Not found
            value:
              statusCode: 404
              error: Not Found
              message: 'SLO [3749f390-03a3-11ee-8139-c7ff60a1692d] not found'
