requestBody:
  content:
    application/json:
      examples: {}
responses:
  '200':
    content:
      application/json:
        examples:
          getSnapshotResponse:
            summary: Snapshot result for a healthy SLO instance
            value:
              at: '2025-01-12T10:00:00.000Z'
              results:
                - id: 8853df00-ae2e-11ed-90af-09bb6422b258
                  instanceId: '*'
                  summary:
                    status: HEALTHY
                    sliValue: 0.9976
                    errorBudget:
                      initial: 0.01
                      consumed: 0.24
                      remaining: 0.76
                    good: 9976
                    total: 10000
          getSnapshotResponseViolated:
            summary: Snapshot result for a violated SLO instance
            value:
              at: '2025-01-12T10:00:00.000Z'
              results:
                - id: 8853df00-ae2e-11ed-90af-09bb6422b258
                  instanceId: web-01
                  summary:
                    status: VIOLATED
                    sliValue: 0.95
                    errorBudget:
                      initial: 0.01
                      consumed: 5
                      remaining: -4
                    good: 9500
                    total: 10000
  '400':
    description: Bad request
    content:
      application/json:
        schema:
          $ref: ../oas_error_schemas.yaml#/400_response
        examples:
          badRequestIdExample:
            summary: Invalid SLO id
            value:
              statusCode: 400
              error: Bad Request
              message: |-
                [
                  {
                    "origin": "string",
                    "code": "too_small",
                    "minimum": 8,
                    "inclusive": true,
                    "path": [
                      "id"
                    ],
                    "message": "Invalid slo id, must be between 8 and 48 characters and contain only letters, numbers, hyphens, and underscores"
                  },
                  {
                    "origin": "string",
                    "code": "invalid_format",
                    "format": "regex",
                    "pattern": "/^[a-z0-9-_]+$/",
                    "path": [
                      "id"
                    ],
                    "message": "Invalid slo id, must be between 8 and 48 characters and contain only letters, numbers, hyphens, and underscores"
                  }
                ]
          badRequestAtExample:
            summary: Invalid at query parameter
            value:
              statusCode: 400
              error: Bad Request
              message: |-
                [
                  {
                    "code": "custom",
                    "path": [
                      "at"
                    ],
                    "message": "Invalid date"
                  }
                ]
  '401':
    description: Unauthorized response
    content:
      application/json:
        schema:
          $ref: ../oas_error_schemas.yaml#/401_response
        examples:
          unauthorizedExample:
            summary: Unauthorized
            value:
              statusCode: 401
              error: Unauthorized
              message: "[security_exception\n\tRoot causes:\n\t\tsecurity_exception: unable to authenticate user [elastic] for REST request [/_security/_authenticate]]: unable to authenticate user [elastic] for REST request [/_security/_authenticate]"
  '403':
    description: Forbidden response
    content:
      application/json:
        schema:
          $ref: ../oas_error_schemas.yaml#/403_response
        examples:
          forbiddenExample:
            summary: Forbidden
            value:
              statusCode: 403
              error: Forbidden
              message: 'API [GET /api/observability/slos/8853df00-ae2e-11ed-90af-09bb6422b258/_snapshot?at=2025-01-12T10:00:00.000Z] is unauthorized for user, this action is granted by the Kibana privileges [slo_read]'
  '404':
    description: Not found response
    content:
      application/json:
        schema:
          $ref: ../oas_error_schemas.yaml#/404_response
        examples:
          notFoundExample:
            summary: Not found
            value:
              statusCode: 404
              error: Not Found
              message: 'SLO [3749f390-03a3-11ee-8139-c7ff60a1692d] not found'
