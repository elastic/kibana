requestBody:
  content:
    application/json:
      examples: {}
responses:
  '200':
    description: Successful response
    content:
      application/json:
        schema:
          $ref: ../oas_schemas.yaml#/snapshot_response
        examples:
          getSnapshotResponse:
            summary: Snapshot result for a healthy SLO instance
            value:
              at: '2025-01-12T10:00:00.000Z'
              results:
                - id: 8853df00-ae2e-11ed-90af-09bb6422b258
                  instanceId: '*'
                  summary:
                    status: HEALTHY
                    sliValue: 0.9976
                    errorBudget:
                      initial: 0.01
                      consumed: 0.24
                      remaining: 0.76
                    good: 9976
                    total: 10000
          getSnapshotResponseViolated:
            summary: Snapshot result for a violated SLO instance
            value:
              at: '2025-01-12T10:00:00.000Z'
              results:
                - id: 8853df00-ae2e-11ed-90af-09bb6422b258
                  instanceId: host.name:web-01
                  summary:
                    status: VIOLATED
                    sliValue: 0.95
                    errorBudget:
                      initial: 0.01
                      consumed: 5
                      remaining: -4
                    good: 9500
                    total: 10000
  '400':
    description: Bad request
    content:
      application/json:
        schema:
          $ref: ../oas_schemas.yaml#/400_response
        examples:
          badRequestExample:
            summary: Bad request
            value:
              statusCode: 400
              error: Bad Request
              message: 'Invalid value ''foo'' supplied to: at'
  '401':
    description: Unauthorized response
    content:
      application/json:
        schema:
          $ref: ../oas_schemas.yaml#/401_response
        examples:
          unauthorizedExample:
            summary: Unauthorized
            value:
              statusCode: 401
              error: Unauthorized
              message: 'security_exception: unable to authenticate user for REST request [/api/observability/slos]'
  '403':
    description: Forbidden response
    content:
      application/json:
        schema:
          $ref: ../oas_schemas.yaml#/403_response
        examples:
          forbiddenExample:
            summary: Forbidden
            value:
              statusCode: 403
              error: Forbidden
              message: 'security_exception: action [slo_read] is unauthorized for user'
  '404':
    description: Not found response
    content:
      application/json:
        schema:
          $ref: ../oas_schemas.yaml#/404_response
        examples:
          notFoundExample:
            summary: Not found
            value:
              statusCode: 404
              error: Not Found
              message: SLO [8853df00-ae2e-11ed-90af-09bb6422b258] not found
