# Error response schemas shared by the `oasOperationObject` example files.
# Request and successful response schemas are generated from the routes' Zod schemas.
400_response:
  title: Bad request
  type: object
  required:
    - statusCode
    - error
    - message
  properties:
    statusCode:
      type: number
      example: 400
    error:
      type: string
      example: Bad Request
    message:
      type: string
      example: 'Invalid value ''foo'' supplied to: [...]'
401_response:
  title: Unauthorized
  type: object
  required:
    - statusCode
    - error
    - message
  properties:
    statusCode:
      type: number
      example: 401
    error:
      type: string
      example: Unauthorized
    message:
      type: string
      example: "[security_exception\n\tRoot causes:\n\t\tsecurity_exception: unable to authenticate user [elastics] for REST request [/_security/_authenticate]]: unable to authenticate user [elastics] for REST request [/_security/_authenticate]"
403_response:
  title: Forbidden
  type: object
  required:
    - statusCode
    - error
    - message
  properties:
    statusCode:
      type: number
      example: 403
    error:
      type: string
      example: Forbidden
    message:
      type: string
      example: "[security_exception\n\tRoot causes:\n\t\tsecurity_exception: action [slo_write] is unauthorized for user [limited_user] for REST request [/api/observability/slos]]: action [slo_write] is unauthorized for user [limited_user]"
404_response:
  title: Not found
  type: object
  required:
    - statusCode
    - error
    - message
  properties:
    statusCode:
      type: number
      example: 404
    error:
      type: string
      example: Not Found
    message:
      type: string
      example: SLO [3749f390-03a3-11ee-8139-c7ff60a1692d] not found
409_response:
  title: Conflict
  type: object
  required:
    - statusCode
    - error
    - message
  properties:
    statusCode:
      type: number
      example: 409
    error:
      type: string
      example: Conflict
    message:
      type: string
      example: SLO [d077e940-1515-11ee-9c50-9d096392f520] already exists
