get:
  summary: Compute an SLO instance summary at a point in time
  operationId: getSnapshotOp
  description: >
    Compute the summary of a single SLO instance at a given point in time.
    The endpoint is synchronous and returns the result directly.
    You must have the `read` privileges for the **SLOs** feature in the
    **Observability** section of the Kibana feature privileges.
  tags:
    - slo
  parameters:
    - $ref: ../components/headers/kbn_xsrf.yaml
    - $ref: ../components/parameters/space_id.yaml
    - $ref: ../components/parameters/slo_id.yaml
    - name: at
      in: query
      description: The point in time at which to compute the SLO instance summary (ISO 8601 date-time)
      required: true
      schema:
        type: string
        format: date-time
        example: '2025-01-12T10:00:00.000Z'
    - name: instanceId
      in: query
      description: >
        The SLO instance id. Use '*' for the default (ungrouped) instance.
        When omitted, defaults to '*'.
      required: false
      schema:
        type: string
        example: '*'
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '../components/schemas/snapshot_result.yaml'
          examples:
            getSnapshotResponse:
              summary: Snapshot result for a healthy SLO instance
              value:
                id: 8853df00-ae2e-11ed-90af-09bb6422b258
                instanceId: '*'
                summary:
                  status: HEALTHY
                  sliValue: 0.9976
                  errorBudget:
                    initial: 0.01
                    consumed: 0.24
                    remaining: 0.76
                  good: 9976
                  total: 10000
            getSnapshotResponseViolated:
              summary: Snapshot result for a violated SLO instance
              value:
                id: 8853df00-ae2e-11ed-90af-09bb6422b258
                instanceId: 'host.name:web-01'
                summary:
                  status: VIOLATED
                  sliValue: 0.95
                  errorBudget:
                    initial: 0.01
                    consumed: 5.0
                    remaining: -4.0
                  good: 9500
                  total: 10000
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../components/schemas/400_response.yaml'
          examples:
            badRequestExample:
              summary: Bad request
              value:
                statusCode: 400
                error: Bad Request
                message: "Invalid value 'foo' supplied to: at"
    '401':
      description: Unauthorized response
      content:
        application/json:
          schema:
            $ref: '../components/schemas/401_response.yaml'
          examples:
            unauthorizedExample:
              summary: Unauthorized
              value:
                statusCode: 401
                error: Unauthorized
                message: "security_exception: unable to authenticate user for REST request [/api/observability/slos]"
    '403':
      description: Forbidden response
      content:
        application/json:
          schema:
            $ref: '../components/schemas/403_response.yaml'
          examples:
            forbiddenExample:
              summary: Forbidden
              value:
                statusCode: 403
                error: Forbidden
                message: "security_exception: action [slo_read] is unauthorized for user"
