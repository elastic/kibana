# Kibana config for the investigation evals, loaded by the evals_nightshift_investigations Scout
# config set when scout_hook.sh exports SANDBOX_KIBANA_CONFIG. Kibana resolves ${SANDBOX_*} and
# ${NIGHTSHIFT_TRACING_EXPORTERS} from the environment, so no secret is written to disk or passed as
# an argument. The ssl paths are optional: the hook exports them empty when unset, and Kibana then
# connects without a client certificate, authenticated by the API key only.
#
# This must be the only --config the config set passes: the Kibana test server keeps just the last
# --config flag. kibana.sandbox_telemetry.yml repeats this file and adds the remote telemetry.

telemetry.tracing.exporters: ${NIGHTSHIFT_TRACING_EXPORTERS}

xpack.sandbox:
  enabled: true
  host: ${SANDBOX_API_HOST:localhost}
  port: ${SANDBOX_API_PORT:9090}
  api_key: ${SANDBOX_API_KEY}
  ssl:
    certificate: ${SANDBOX_CLIENT_CERT_PATH}
    key: ${SANDBOX_CLIENT_KEY_PATH}
    certificate_authorities: ${SANDBOX_CA_CERT_PATH}
