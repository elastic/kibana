# Customer0 connectors, matching the investigator on nightshift-customer0. The eval assigns these
# ids in evals/investigation/investigator_connectors.ts. Credentials stay in the hook environment.
# `.http` is required because sandbox credential injection does not support `.webhook`.
xpack.actions.preconfigured.c0-es:
  name: c0_es
  actionTypeId: .http
  config:
    url: ${NIGHTSHIFT_SANDBOX_ELASTICSEARCH_URL}
    hasAuth: false
    authType: null
  secrets:
    secretHeaders:
      Authorization: "ApiKey ${NIGHTSHIFT_SANDBOX_ELASTICSEARCH_API_KEY}"

xpack.actions.preconfigured.gh:
  name: gh
  actionTypeId: .github
  config:
    serverUrl: https://api.githubcopilot.com/mcp/
    hasAuth: true
    authType: bearer
  secrets:
    token: ${NIGHTSHIFT_GITHUB_GH_TOKEN}

xpack.actions.preconfigured.github-elastic-org:
  name: github-elastic-org
  actionTypeId: .github
  config:
    serverUrl: https://api.githubcopilot.com/mcp/
    hasAuth: true
    authType: bearer
  secrets:
    token: ${NIGHTSHIFT_GITHUB_ORG_TOKEN}
