# The `orcabench` connector set: one Elasticsearch connector to the cluster holding the ORCA
# snapshot, named the way an operator would name it. evals/investigation/connector_sets.ts lists
# this id and saves it on the investigator. Credentials stay in the hook environment.
# `.http` is required because sandbox credential injection does not support `.webhook`.
xpack.actions.preconfigured.orcabench-es:
  name: orcabench_es
  actionTypeId: .http
  config:
    url: ${NIGHTSHIFT_ORCABENCH_ES_URL}
    hasAuth: false
    authType: null
  secrets:
    secretHeaders:
      Authorization: "ApiKey ${NIGHTSHIFT_ORCABENCH_ES_API_KEY}"
