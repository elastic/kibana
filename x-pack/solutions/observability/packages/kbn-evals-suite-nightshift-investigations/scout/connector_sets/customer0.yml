# The `customer0` connector set: the Elasticsearch connector to the customer0 cluster, with the id
# and name it has on nightshift-customer0. evals/investigation/connector_sets.ts lists this id and
# saves it on the investigator. Credentials stay in the hook environment.
# `.http` is required because sandbox credential injection does not support `.webhook`.
xpack.actions.preconfigured.c0-es:
  name: c0_es
  actionTypeId: .http
  config:
    url: ${NIGHTSHIFT_C0_ES_URL}
    hasAuth: false
    authType: null
  secrets:
    secretHeaders:
      Authorization: "ApiKey ${NIGHTSHIFT_C0_ES_API_KEY}"
