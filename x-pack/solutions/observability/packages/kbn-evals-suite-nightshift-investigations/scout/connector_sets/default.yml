# The `default` connector set: one Elasticsearch connector to the cluster in the suite config's
# `nightshift.telemetry` block. evals/investigation/connector_sets.ts lists this id and saves it on
# the investigator. Credentials stay in the hook environment.
# An External Elasticsearch (`.elasticsearch`) connector, as Nightshift onboarding creates for users.
xpack.actions.preconfigured.elasticsearch:
  name: elasticsearch
  actionTypeId: .elasticsearch
  config:
    url: ${NIGHTSHIFT_ES_URL}
    selectedActions: [_test]
  secrets:
    authType: api_key_header
    Authorization: "ApiKey ${NIGHTSHIFT_ES_API_KEY}"
