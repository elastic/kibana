# ORCA shard telemetry. Customer0 uses scout/kibana.customer0.yml instead. The connector is `.http`
# because sandbox credential injection (getSandboxCredentials) doesn't support `.webhook`.
xpack.actions.preconfigured.nightshift-evals-telemetry:
  name: Remote Elasticsearch telemetry
  actionTypeId: .http
  config:
    url: ${NIGHTSHIFT_SANDBOX_ELASTICSEARCH_URL}
    hasAuth: false
    authType: null
  secrets:
    secretHeaders:
      Authorization: "ApiKey ${NIGHTSHIFT_SANDBOX_ELASTICSEARCH_API_KEY}"
