# Remote telemetry credentials are resolved from the scout hook environment. Telemetry is an ordinary
# connector: the eval adds it to the investigator's saved connectors (see
# evals/investigation/investigator_connectors.ts), as a user would in the agent's settings. The
# connector is `.http` because sandbox credential injection (getSandboxCredentials) doesn't support
# `.webhook`.
xpack.actions.preconfigured.nightshift-evals-telemetry:
  name: Remote Elasticsearch telemetry
  actionTypeId: .http
  config:
    url: ${NIGHTSHIFT_SANDBOX_ELASTICSEARCH_URL}
    hasAuth: false
    authType: null
  secrets:
    secretHeaders:
      Authorization: "ApiKey ${NIGHTSHIFT_SANDBOX_ELASTICSEARCH_API_KEY}"
