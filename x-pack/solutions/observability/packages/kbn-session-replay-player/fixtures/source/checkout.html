<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Shop: checkout</title>
  <style>
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: #1a1c21; background: #f7f8fc; }
    main { max-width: 520px; margin: 40px auto; background: #fff; border: 1px solid #d3dae6; border-radius: 6px; padding: 24px; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #98a2b3; border-radius: 4px; font: inherit; }
    input:focus { outline: 2px solid #0b64dd; }
    button { margin-top: 24px; background: #0b64dd; color: #fff; border: 0; border-radius: 4px; padding: 10px 18px; font: inherit; cursor: pointer; }
    #status { margin-top: 16px; color: #017d73; min-height: 1.4em; }
  </style>
</head>
<body>
  <main>
    <h1>Checkout</h1>
    <form id="form" autocomplete="off">
      <label for="email">Email</label><input id="email" name="email" type="email" />
      <label for="password">Password</label><input id="password" name="password" type="password" />
      <label for="card">Card number</label><input id="card" name="card" type="text" />
      <button type="submit" id="pay">Pay now</button>
    </form>
    <div id="status" role="status"></div>
  </main>
  <script>
    document.getElementById('form').addEventListener('submit', function (event) {
      event.preventDefault();
      document.getElementById('status').textContent = 'Order placed. Thank you!';
    });
  </script>
</body>
</html>
